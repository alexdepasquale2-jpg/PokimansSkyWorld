<title>Primal Isle</title>
<style>
/* Primal Isle — phone-first skin.
 * Everything interactive is at least 44px, sits clear of the safe-area insets,
 * and lives in the bottom third of the screen where thumbs are.
 */
:root {
  --bg: #080d14;
  --panel: #121a26;
  --panel-2: #18222f;
  --line: #26344a;
  --ink: #e6ecf7;
  --dim: #8d9ab2;
  --dimmer: #5f6b82;
  --gold: #e8b23a;
  --amber: #f0a52e;
  --good: #79c07a;
  --bad: #e0655a;
  --warn: #e0a83f;
  --prem: #b07fe0;
  --radius: 12px;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.4 var(--sans);
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

#app { position: fixed; inset: 0; }
#stage { position: absolute; inset: 0; touch-action: none; }
#scene { position: absolute; inset: 0; display: block; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud-top {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding: calc(var(--safe-t) + 8px) calc(var(--safe-r) + 8px) 0 calc(var(--safe-l) + 8px);
}

#vitals { flex: 1; max-width: 62%; }
.who { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; text-shadow: 0 1px 3px #000; }
.who b { font-size: 14px; }
.who span { font-size: 11px; color: var(--dim); }
.who .vip { font-size: 9px; font-style: normal; letter-spacing: .1em; color: #101010;
  background: var(--gold); border-radius: 4px; padding: 1px 4px; font-weight: 700; }

.bars { display: grid; gap: 3px; }
.bar {
  position: relative; height: 13px; border-radius: 7px;
  background: rgba(6,10,18,0.62); overflow: hidden;
  border: 1px solid rgba(255,255,255,0.08);
}
.bar i { position: absolute; inset: 0 auto 0 0; display: block; border-radius: 7px; transition: width .18s linear; }
.bar b {
  position: relative; display: block; font-size: 9px; font-weight: 600;
  line-height: 13px; padding-left: 7px; letter-spacing: .04em;
  text-shadow: 0 1px 2px rgba(0,0,0,0.8); color: #fff;
}
.bar.grow i { background: linear-gradient(90deg, #6ea8d8, #9ad3f0); }
.bar.grow.warn i { background: linear-gradient(90deg, #b2762c, #e0a83f); }
.bar.hp i { background: linear-gradient(90deg, #a63f38, #d8564a); }
.bar.food i { background: linear-gradient(90deg, #6d8a3c, #9ac251); }
.bar.water i { background: linear-gradient(90deg, #2f6f8a, #4fa8c4); }
.bar.stam i { background: linear-gradient(90deg, #8a7a2f, #d9c453); }

.wounds { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.wounds .w {
  font-size: 9px; padding: 2px 5px; border-radius: 5px;
  background: rgba(10,16,26,0.72); border: 1px solid var(--line);
}
.wounds .bleed { color: #ff9a90; border-color: #6a2a26; }
.wounds .bone { color: #e6d2a8; }
.wounds .buff { color: #9ad9ff; }
.wounds .group { color: #9ae0a8; }

#hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; }
#wallet { display: flex; gap: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 3px;
  background: rgba(12,18,28,0.82); border: 1px solid var(--line);
  border-radius: 9px; padding: 6px 7px; font-size: 12px; font-weight: 600;
  min-height: 32px;
}
.chip i { font-style: normal; font-size: 12px; }
.chip em { font-style: normal; color: var(--gold); font-weight: 800; margin-left: 2px; }
.chip.amber { border-color: #6b4c14; }
.chip.menu, .chip.shop { padding: 6px 8px; }

#mapwrap { position: relative; pointer-events: auto; }
#minimap {
  width: 88px; height: 88px; border-radius: 10px;
  border: 1px solid var(--line); background: #0b1a26; display: block;
  box-shadow: 0 4px 14px rgba(0,0,0,0.4);
}
#place {
  position: absolute; left: 0; right: 0; bottom: -15px; text-align: center;
  font-size: 9px; color: var(--dim); text-shadow: 0 1px 3px #000; white-space: nowrap;
}

#threats {
  position: absolute; right: calc(var(--safe-r) + 8px); top: 210px;
  display: grid; gap: 3px; justify-items: end;
}
.th {
  font-size: 10px; padding: 3px 6px; border-radius: 6px;
  background: rgba(10,16,26,0.72); border: 1px solid var(--line);
}
.th span { color: var(--dim); margin-left: 4px; }
.th em { font-style: normal; color: var(--dimmer); margin-left: 4px; }
.th.danger { border-color: #6e2a24; color: #ff9c92; }
.th.prey { border-color: #2f5a30; color: #9ad9a0; }

#feed {
  position: absolute; left: calc(var(--safe-l) + 10px); bottom: calc(var(--safe-b) + 232px);
  display: grid; gap: 2px; max-width: 56%;
}
.f { font-size: 11px; color: var(--dim); text-shadow: 0 1px 3px #000; }
.f.good { color: #9ad9a0; }
.f.bad { color: #ff9c92; }
.f.buy { color: var(--gold); }
.f.dim { color: var(--dimmer); }

#offerbtn {
  position: absolute; left: calc(var(--safe-l) + 8px); top: calc(var(--safe-t) + 150px);
  display: none; pointer-events: auto;
  background: linear-gradient(160deg, #d8912a, #a8611b);
  border-radius: 10px; padding: 6px 10px; text-align: left;
  box-shadow: 0 4px 16px rgba(216,145,42,0.35);
  animation: pulse 1.8s ease-in-out infinite;
}
#offerbtn.on { display: block; }
#offerbtn b { display: block; font-size: 12px; }
#offerbtn span { font-size: 11px; font-weight: 700; }
#offerbtn em { font-style: normal; font-size: 10px; opacity: .85; margin-left: 6px; }
@keyframes pulse { 50% { transform: scale(1.05); } }

/* ---------- controls ---------- */
#stick {
  position: absolute; width: 118px; height: 118px; margin: -59px 0 0 -59px;
  border-radius: 50%; border: 2px solid rgba(255,255,255,0.16);
  background: rgba(10,16,26,0.28); opacity: 0; transition: opacity .12s;
  pointer-events: none;
}
#stick.on { opacity: 1; }
#knob {
  position: absolute; left: 50%; top: 50%; width: 52px; height: 52px;
  margin: -26px 0 0 -26px; border-radius: 50%;
  background: rgba(230,236,247,0.28); border: 2px solid rgba(255,255,255,0.4);
}

#acts {
  position: absolute; right: calc(var(--safe-r) + 12px); bottom: calc(var(--safe-b) + 16px);
  display: grid; grid-template-columns: repeat(2, auto); gap: 10px; justify-items: end;
}
.act {
  width: 62px; height: 62px; border-radius: 50%;
  background: rgba(18,26,38,0.78); border: 1px solid var(--line);
  display: grid; place-items: center; gap: 0; backdrop-filter: blur(3px);
}
.act i { font-style: normal; font-size: 24px; line-height: 1; }
.act u { text-decoration: none; font-size: 8px; color: var(--dim); letter-spacing: .05em; }
.act.small { width: 48px; height: 48px; }
.act.small i { font-size: 18px; }
.act.big {
  width: 84px; height: 84px; grid-column: 2; grid-row: 3;
  background: rgba(120,36,30,0.8); border-color: #7d3029;
}
.act.big i { font-size: 32px; }
.act.down { transform: scale(0.94); background: rgba(60,80,110,0.8); }
.act.dim { opacity: 0.42; }
.act.has { box-shadow: 0 0 0 2px rgba(232,178,58,0.5); }

#banner {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%) scale(0.9);
  background: rgba(10,16,26,0.9); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 16px; font-size: 13px; opacity: 0; pointer-events: none; transition: .18s;
}
#banner.on { opacity: 1; transform: translate(-50%,-50%) scale(1); }

/* ---------- modal sheets ---------- */
#modal { position: fixed; inset: 0; display: none; z-index: 40; }
#modal.on { display: block; }
#modal .scrim { position: absolute; inset: 0; background: rgba(4,7,12,0.72); backdrop-filter: blur(2px); }
#modal .dialog {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%;
  background: var(--panel); border-top: 1px solid var(--line);
  border-radius: 16px 16px 0 0; padding: 16px 14px calc(var(--safe-b) + 16px);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  animation: rise .2s ease-out;
}
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
#modal h1 { font-size: 26px; margin: 4px 0 6px; letter-spacing: .06em; }
#modal h2 { font-size: 18px; margin: 0 0 10px; }
#modal h3 { font-size: 13px; margin: 16px 0 6px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
#modal p { margin: 0 0 10px; }
#modal .lead { color: var(--dim); font-size: 12px; }
#modal .dim { color: var(--dim); }
#modal .small { font-size: 12px; }
#modal .tiny { font-size: 10px; }
#modal textarea {
  width: 100%; background: #0c131d; color: var(--ink); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px; font: 11px/1.3 ui-monospace, monospace; resize: vertical;
}
.fine { font-size: 11px; color: var(--dimmer); line-height: 1.5; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }

.wide {
  display: block; width: 100%; min-height: 48px; margin: 8px 0;
  border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line);
  font-weight: 600; padding: 10px 12px; text-align: center;
}
.wide em { font-style: normal; font-weight: 400; color: var(--dim); font-size: 11px; margin-left: 6px; }
.wide.gold { background: linear-gradient(160deg, #d8a02a, #a8701b); border-color: #7d5416; color: #1a1206; }
.wide.ad { background: #1d2a3a; border-color: #2f4a64; }
.wide.ghost { background: transparent; }
.wide.danger { background: #4a1e1a; border-color: #7d2f27; }
.wide.small { font-size: 12px; min-height: 40px; }
.wide:disabled { opacity: .38; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row2 .wide { margin: 8px 0 0; }

.row {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 10px; margin-bottom: 6px; min-height: 54px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
}
.row i { font-style: normal; font-size: 22px; }
.row > div { flex: 1; min-width: 0; }
.row b { display: block; font-size: 13px; }
.row span { display: block; font-size: 11px; color: var(--dim); }
.row span.sub { color: var(--dimmer); margin-top: 2px; }
.row u { text-decoration: none; font-weight: 700; color: var(--gold); white-space: nowrap; }
.row .tag { font-style: normal; font-size: 9px; background: var(--gold); color: #150f04;
  border-radius: 4px; padding: 1px 4px; margin-left: 4px; font-weight: 800; }
.row.buy u { font-size: 15px; }
.row .btns { display: flex; gap: 6px; }
.mini {
  min-width: 52px; min-height: 40px; border-radius: 8px; padding: 6px 8px;
  background: #24334a; border: 1px solid var(--line); font-size: 12px; font-weight: 600;
}
.mini.use { background: #2c4a30; border-color: #3e6b44; }
.mini.ghost { background: transparent; }
.row.tog u { color: var(--dim); }
.row.danger b { color: #ff9c92; }
.row.species.prem { border-color: #4b3668; }
.row .owned { color: var(--good); }
.row.call i { font-size: 26px; }

.shophead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.bal { display: flex; gap: 10px; font-weight: 700; font-size: 13px; }
.x { font-size: 20px; width: 40px; height: 40px; color: var(--dim); }
.stabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 4px; scrollbar-width: none; }
.stabs::-webkit-scrollbar { display: none; }
.stabs button {
  white-space: nowrap; padding: 8px 11px; border-radius: 8px; font-size: 12px;
  background: var(--panel-2); border: 1px solid var(--line); min-height: 38px;
}
.stabs button.on { background: #2b3b55; border-color: #43597d; }
.sbody { min-height: 40vh; }

.pity { font-size: 12px; color: var(--dim); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
.pity b { color: var(--ink); }
.pity span { float: right; color: var(--dimmer); }
table.odds, table.pass, table.lines { width: 100%; border-collapse: collapse; font-size: 12px; }
table.odds td, table.pass td, table.pass th, table.lines td {
  padding: 6px 4px; border-bottom: 1px solid var(--line);
}
table.odds td:nth-child(2) { color: var(--dim); }
table.odds td:last-child, table.lines td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
tr.common td:nth-child(2) { color: #9aa6bd; }
tr.rare td:nth-child(2) { color: #5ea9e6; }
tr.epic td:nth-child(2) { color: #c07fe8; }
tr.legendary td:nth-child(2) { color: var(--gold); }
table.pass th { text-align: left; color: var(--dim); font-size: 10px; text-transform: uppercase; }
table.pass td.tier { width: 34px; color: var(--dim); }
table.pass tr.got td { color: var(--ink); }
table.pass td.prem { color: var(--gold); }
table.pass td.lockedcell { color: var(--dimmer); }

.drops { display: grid; gap: 6px; margin: 10px 0; }
.drop {
  padding: 10px; border-radius: 8px; background: var(--panel-2);
  border-left: 4px solid var(--dimmer); display: flex; justify-content: space-between; align-items: center;
}
.drop b { font-size: 13px; }
.drop span { font-size: 11px; color: var(--dim); }
.drop em { font-style: normal; font-size: 9px; color: var(--gold); }
.drop.common { border-left-color: #9aa6bd; }
.drop.rare { border-left-color: #5ea9e6; }
.drop.epic { border-left-color: #c07fe8; }
.drop.legendary { border-left-color: var(--gold); background: linear-gradient(90deg, rgba(232,178,58,0.16), var(--panel-2)); }

.xpbar { position: relative; height: 20px; border-radius: 10px; background: #0c131d;
  border: 1px solid var(--line); overflow: hidden; margin-bottom: 10px; }
.xpbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #4a7dc4, #6fa8e0); }
.xpbar b { position: relative; display: block; font-size: 10px; line-height: 20px; text-align: center; }
.ok { background: #1e3a24; border: 1px solid #34603c; border-radius: 8px; padding: 10px; font-size: 12px; color: #9ad9a0; }

.vipcard { background: linear-gradient(160deg, #2a2314, var(--panel-2)); border: 1px solid #5c4a1c;
  border-radius: 12px; padding: 14px; }
.vipcard h3 { margin-top: 0; color: var(--gold); font-size: 16px; text-transform: none; letter-spacing: 0; }
.vipcard ul { margin: 8px 0; padding-left: 18px; font-size: 12px; color: var(--dim); }
.vipcard li { margin: 3px 0; }

.offercard { background: linear-gradient(160deg, #2b1c14, var(--panel-2)); border: 1px solid #6b3f22;
  border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.offercard h3 { margin-top: 0; color: #f0a52e; font-size: 15px; text-transform: none; letter-spacing: 0; }
.gives { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.gives span { font-size: 11px; background: rgba(0,0,0,0.28); border-radius: 5px; padding: 3px 6px; }
.timer { font-size: 12px; color: #f0a52e; font-weight: 700; }
.offercard.big { padding: 18px; text-align: center; }
.offercard.big h3 { font-size: 21px; }
.offercard .flag {
  display: inline-block; font-size: 9px; letter-spacing: .16em; font-weight: 800;
  background: #d8564a; color: #fff; border-radius: 4px; padding: 3px 7px; margin-bottom: 8px;
}
.offercard.big .gives { justify-content: center; }
/* The way out is small on purpose. The Offers tab explains why. */
.tinyno { display: block; width: 100%; margin-top: 10px; font-size: 11px; color: var(--dimmer); padding: 8px; }

.receipt .total { font-size: 34px; font-weight: 800; color: var(--gold); letter-spacing: -0.02em; }
.advbar { position: relative; height: 22px; border-radius: 11px; background: #0c131d;
  border: 1px solid var(--line); overflow: hidden; margin: 6px 0; }
.advbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #a8701b, #e8b23a); }
.advbar b { position: relative; display: block; font-size: 11px; line-height: 22px; text-align: center; }

.spgrid { display: grid; gap: 8px; }
.spcard {
  text-align: left; padding: 12px; border-radius: 12px;
  background: var(--panel-2); border: 1px solid var(--line); width: 100%;
}
.spcard.prem { border-color: #4b3668; background: linear-gradient(160deg, #221a33, var(--panel-2)); }
.spcard.locked { opacity: .96; }
.sphead { display: flex; justify-content: space-between; align-items: baseline; }
.sphead b { font-size: 15px; }
.sphead em { font-style: normal; font-size: 10px; color: var(--dim); letter-spacing: .04em; }
.spcard.prem .sphead em { color: var(--prem); }
.spstats { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; font-size: 11px; color: var(--dim); }
.spcard p { font-size: 11px; color: var(--dimmer); margin: 0; line-height: 1.45; }
.spcard .lock { margin-top: 8px; font-size: 11px; color: var(--gold); }
.spcard .lock u { text-decoration: underline; margin-left: 6px; }

.skins { display: flex; flex-wrap: wrap; gap: 6px; }
.skin { padding: 8px 10px; border-radius: 8px; background: var(--panel-2);
  border: 1px solid var(--line); font-size: 11px; min-height: 38px; }
.skin.on { border-color: var(--gold); color: var(--gold); }
.skin.legendary { border-color: #6b5418; }
.skin.epic { border-color: #4b3668; }

.death { text-align: center; }
.death h2 { font-size: 24px; color: #ff9c92; letter-spacing: .04em; }
.death .big { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
.death .vipdot { color: var(--gold); }
.revives { margin: 14px 0 6px; }
.orfree { font-size: 11px; color: var(--dimmer); margin: 14px 0 4px; }

.adbox { text-align: center; }
.adtag { font-size: 9px; letter-spacing: .2em; color: var(--dimmer); }
.adart {
  height: 190px; border-radius: 12px; margin: 8px 0;
  background: linear-gradient(150deg, #23407a, #7a2f5e);
  display: grid; place-content: center; gap: 4px; position: relative; overflow: hidden;
}
.adart b { font-size: 22px; letter-spacing: .04em; }
.adart span { font-size: 12px; opacity: .8; }
.adblob {
  position: absolute; width: 150px; height: 150px; border-radius: 50%;
  background: rgba(255,255,255,0.12); left: -40px; top: -40px;
  animation: float 3s ease-in-out infinite alternate;
}
@keyframes float { to { transform: translate(230px, 90px) scale(1.4); } }
.adfoot { font-size: 12px; color: var(--dim); }

.start { text-align: center; padding: 10px 0 4px; }
.start h1 { font-size: 30px; letter-spacing: .12em; margin-bottom: 2px; }
.start .tagline { color: var(--gold); font-size: 13px; letter-spacing: .05em; margin-bottom: 12px; }
.start .dim { font-size: 12px; line-height: 1.5; }

/* Landscape / desktop: the sheet stops being full width, the pad stays put. */
@media (min-width: 620px) {
  #modal .dialog {
    left: 50%; right: auto; bottom: 0; width: 560px; transform: translateX(-50%);
    max-height: 88%; border-radius: 16px 16px 0 0;
  }
  #vitals { max-width: 320px; }
}
@media (min-height: 900px) {
  #acts { bottom: calc(var(--safe-b) + 40px); }
}

/* ---------- the Fossil Exchange ---------- */
.exhead { text-align: center; margin-bottom: 10px; }
.exbal {
  font-size: 34px; font-weight: 800; letter-spacing: -0.02em; color: var(--gold);
  font-variant-numeric: tabular-nums; transition: transform .08s;
}
.exbal.pop { transform: scale(1.08); }
.exrate { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }

.digbtn {
  position: relative; display: block; width: 100%; height: 96px; margin-bottom: 12px;
  border-radius: 14px; overflow: hidden;
  background: linear-gradient(160deg, #3d3320, #241d12);
  border: 1px solid #5c4a24; font-size: 34px; line-height: 1;
}
.digbtn span { display: block; font-size: 11px; letter-spacing: .22em; color: var(--gold); margin-top: 4px; }
.digbtn em { font-style: normal; display: block; font-size: 11px; color: var(--dim); }
.digbtn:active { transform: scale(0.985); background: linear-gradient(160deg, #4a3e26, #2b2215); }
.floater {
  position: absolute; bottom: 16px; font-size: 15px; font-weight: 700; color: var(--gold);
  pointer-events: none; animation: rise-out .9s ease-out forwards;
}
@keyframes rise-out { to { transform: translateY(-56px); opacity: 0; } }

.exstat { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.exstat span {
  font-size: 11px; color: var(--dim); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px;
}

<script>
/* Primal Isle — shared helpers: RNG, math, formatting, persistence.
 *
 * The world is regenerated from a seed rather than saved, so everything here
 * that touches world generation has to be deterministic.
 */
(function (ISLE) {
  'use strict';

  const SAVE_KEY = 'primal-isle/save/v1';
  const SAVE_VERSION = 1;

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const clamp01 = v => clamp(v, 0, 1);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const rndInt = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const chance = p => Math.random() < p;
  const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
  const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));

  /* Angle difference wrapped to [-PI, PI]. */
  function angDelta(a, b) {
    let d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }
  function turnToward(a, b, maxStep) {
    const d = angDelta(a, b);
    return a + clamp(d, -maxStep, maxStep);
  }

  /* Seeded RNG (mulberry32). World generation uses one of these so the same
   * seed always produces the same island on any device. */
  function rngFrom(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hash2(seed, x, y) {
    let h = (seed * 374761393 + x * 668265263 + y * 2147483647) >>> 0;
    h = (h ^ (h >>> 13)) >>> 0;
    h = Math.imul(h, 1274126177) >>> 0;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  /* Smooth value noise, good enough for coastlines and biome blotches. */
  function noise2(seed, x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(seed, xi, yi), b = hash2(seed, xi + 1, yi);
    const c = hash2(seed, xi, yi + 1), d = hash2(seed, xi + 1, yi + 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  }

  function fbm(seed, x, y, octaves) {
    let sum = 0, amp = 1, norm = 0, f = 1;
    for (let i = 0; i < (octaves || 3); i++) {
      sum += amp * noise2(seed + i * 7919, x * f, y * f);
      norm += amp;
      amp *= 0.5; f *= 2;
    }
    return sum / norm;
  }

  // --- formatting --------------------------------------------------------
  function fmt(n) {
    n = Math.floor(n);
    if (n < 1000) return String(n);
    if (n < 1e6) return (n / 1000).toFixed(n < 1e4 ? 1 : 0).replace(/\.0$/, '') + 'k';
    return (n / 1e6).toFixed(2).replace(/\.0+$/, '') + 'M';
  }
  const pct = v => Math.round(v * 100) + '%';

  /* Rates and small quantities, where flooring to an integer would print a
   * misleading zero. */
  function fmtSmall(n) {
    if (n >= 100) return fmt(n);
    if (n >= 10) return n.toFixed(1).replace(/\.0$/, '');
    if (n >= 0.01) return n.toFixed(2).replace(/0$/, '').replace(/\.$/, '');
    return n > 0 ? '<0.01' : '0';
  }

  /* Money is stored in whole cents so the receipt never drifts. */
  function money(cents) {
    const neg = cents < 0;
    const v = Math.abs(cents) / 100;
    const s = '$' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return neg ? '-' + s : s;
  }

  function clock(sec) {
    sec = Math.max(0, Math.ceil(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h) return h + 'h ' + String(m).padStart(2, '0') + 'm';
    return m + ':' + String(s).padStart(2, '0');
  }

  function titleCase(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // --- persistence -------------------------------------------------------
  function save(game) {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ v: SAVE_VERSION, t: Date.now(), g: game }));
      return true;
    } catch (e) {
      console.warn('[isle] save failed', e);
      return false;
    }
  }

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const payload = JSON.parse(raw);
      if (!payload || payload.v !== SAVE_VERSION || !payload.g) return null;
      payload.g.__savedAt = payload.t || Date.now();
      return payload.g;
    } catch (e) {
      console.warn('[isle] load failed', e);
      return null;
    }
  }

  function wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } }

  function exportSave(game) {
    return btoa(unescape(encodeURIComponent(JSON.stringify({ v: SAVE_VERSION, t: Date.now(), g: game }))));
  }

  function importSave(text) {
    const payload = JSON.parse(decodeURIComponent(escape(atob(text.trim()))));
    if (!payload || payload.v !== SAVE_VERSION || !payload.g) throw new Error('unrecognised save');
    return payload.g;
  }

  ISLE.core = {
    SAVE_KEY, clamp, clamp01, lerp, rnd, rndInt, pick, chance, dist, dist2,
    angDelta, turnToward, rngFrom, hash2, noise2, fbm,
    fmt, fmtSmall, pct, money, clock, titleCase, save, load, wipe, exportSave, importSave
  };
})(window.ISLE = window.ISLE || {});

</script>

<script>
/* Primal Isle — mutations: the roguelike layer on the survival game.
 *
 * A life is a run. Every time you cross a growth milestone the isle offers
 * three mutations and you keep one. They stack, they interact, and they die
 * with the animal — so the twentieth hatchling is a different creature from
 * the first even though the numbers on the species card never changed.

 * modifiers that dino.js reads. Adding a mutation is adding a row here.

    { id: 'apexpred', name: 'Apex Instinct', rarity: 'apex', icon: '👑',
      desc: '+35% damage, +15% speed, and killing something heals you completely.',
      mods: { dmg: 0.35, spd: 0.15, killheal: 1 } },
    { id: 'undying', name: 'Undying', rarity: 'apex', icon: '🔥',
      desc: 'Once per life, a killing blow leaves you at 1 health instead.',
      mods: { undying: 1 } },
    { id: 'photosyn', name: 'Symbiotic Algae', rarity: 'apex', icon: '☀️',
      desc: 'You slowly feed and water yourself in daylight.', mods: { photo: 1 } }
  ];

  const BY_ID = {};
  for (const m of POOL) BY_ID[m.id] = m;

  /* Sum every mutation into one flat bag, cached on the animal. Called
   * whenever the list changes rather than every frame. */
  function recompute(d) {
    const mods = {};
    for (const id of (d.muts || [])) {
      const m = BY_ID[id];
      if (!m) continue;
      for (const k in m.mods) mods[k] = (mods[k] || 0) + m.mods[k];
    }
    d.mods = mods;
    return mods;
  }

   * carried. A run that is going well gets offered better things — the last

    const lateBias = milestoneIndex >= 3 ? 2.2 : 1;
    const out = [];
    for (let n = 0; n < 3 && pool.length; n++) {
      let total = 0;
      for (const m of pool) {
        const r = RARITY[m.rarity];
        total += r.w * (m.rarity === 'rare' || m.rarity === 'apex' ? lateBias : 1);
      }
      let roll = Math.random() * total;
      let chosen = pool[0];
      for (const m of pool) {
        const r = RARITY[m.rarity];
        roll -= r.w * (m.rarity === 'rare' || m.rarity === 'apex' ? lateBias : 1);
        if (roll <= 0) { chosen = m; break; }
      }
      out.push(chosen);
      pool.splice(pool.indexOf(chosen), 1);
    }

    d.muts = d.muts || [];
    if (d.muts.indexOf(id) >= 0) return false;

    if (done >= MILESTONES.length) return -1;
    return d.growth >= MILESTONES[done] ? done : -1;

  const COST_MUL = 1.15;

  /* Owning a lot of one thing makes it better, at 10 / 25 / 50 / 100 / 200. */
  const MILES = [10, 25, 50, 100, 200];
  function milestoneMult(n) {
    let m = 1;
    for (const k of MILES) if (n >= k) m *= 2;
    return m;
  }

  /* One-off purchases that multiply everything. Deliberately few and
   * expensive: the interesting decision is Exchange versus shop, and too many
   * upgrades here would drown it. */
  const UPGRADES = [
    { id: 'sharper',  name: 'Sharper Picks',      cost: 800,    mult: 1.5,  blurb: '×1.5 to everything.' },
    { id: 'rail',     name: 'Narrow-gauge Rail',  cost: 24000,  mult: 1.75, blurb: '×1.75 to everything.' },
    { id: 'contract', name: 'Museum Contracts',   cost: 600000, mult: 2,    blurb: '×2 to everything.' },
    { id: 'patent',   name: 'Genome Patents',     cost: 1.2e7,  mult: 2.5,  blurb: '×2.5 to everything.' },
    { id: 'brand',    name: 'The Brand',          cost: 4e8,    mult: 3,    blurb: '×3 to everything.' },
    { id: 'hands',    name: 'Practised Hands',    cost: 2500,   tap: 12,    blurb: 'Digging by hand pays ×12.' },
    { id: 'seismic',  name: 'Seismic Survey',     cost: 90000,  tap: 40,    blurb: 'Digging by hand pays ×40 instead.' }
  ];

  /* Prestige. Everything on the Exchange resets; Fossil Points do not. */
  const PRESTIGE_BASE = 2e6;
  const FP_MULT = 0.05;               // each point is +5% forever
  const OFFLINE_CAP = 8 * 3600;       // seconds credited while away
  const OFFLINE_RATE = 0.55;

  function newState() {
    return {
      gens: {}, ups: {}, tapped: 0,
      earned: 0, total: 0,            // total is lifetime, across prestiges
      fp: 0, prestiges: 0,
      specimens: 0,                   // banked from survival runs
      lastReal: Date.now()
    };
  }

  const genDef = id => GENS.find(g => g.id === id);
  const owned = (s, id) => s.gens[id] || 0;

  function costOf(s, id, n) {
    const def = genDef(id);
    const have = owned(s, id);
    let total = 0;
    for (let i = 0; i < (n || 1); i++) total += def.cost * Math.pow(COST_MUL, have + i);
    return Math.ceil(total);
  }

  /* How many of this generator the wallet can afford right now. */
  function maxAfford(s, wallet, id) {
    let n = 0, spent = 0;
    const def = genDef(id);
    const have = owned(s, id);
    while (n < 1000) {
      const next = def.cost * Math.pow(COST_MUL, have + n);
      if (spent + next > wallet) break;
      spent += next; n++;
    }
    return n;
  }

  function globalMult(s) {
    let m = 1;
    for (const u of UPGRADES) if (s.ups[u.id] && u.mult) m *= u.mult;
    m *= 1 + FP_MULT * s.fp;
    m *= specimenMult(s);
    return m;
  }

  /* Specimens are the survival game's contribution: one per 10% of peak growth
   * reached on a run, banked whether you died or walked away. */
  function specimenMult(s) { return 1 + 0.04 * s.specimens; }

  function rate(s) {
    let r = 0;
    for (const def of GENS) {
      const n = owned(s, def.id);
      if (n) r += n * def.rate * milestoneMult(n);
    }
    return r * globalMult(s);
  }

  function tapPower(s) {
    let base = 1;
    for (const u of UPGRADES) if (s.ups[u.id] && u.tap) base = Math.max(base, u.tap);
    return base * globalMult(s) * (1 + rate(s) * 0.0015);
  }

  // --- actions -------------------------------------------------------------
  function tap(g) {
    const s = g.idle;
    const got = tapPower(s);
    credit(g, got);
    s.tapped++;
    return got;
  }

  function credit(g, amount) {
    g.acct.dino += amount;
    g.idle.earned += amount;
    g.idle.total += amount;
  }

  function buyGen(g, id, n) {
    const s = g.idle;
    n = n || 1;
    const cost = costOf(s, id, n);
    if (g.acct.dino < cost) return false;
    g.acct.dino -= cost;
    s.gens[id] = owned(s, id) + n;
    return true;
  }

  function buyUpgrade(g, id) {
    const s = g.idle;
    const u = UPGRADES.find(x => x.id === id);
    if (!u || s.ups[id] || g.acct.dino < u.cost) return false;
    g.acct.dino -= u.cost;
    s.ups[id] = 1;
    return true;
  }

  function prestigeGain(s) {
    if (s.total < PRESTIGE_BASE) return 0;
    return Math.floor(Math.sqrt(s.total / PRESTIGE_BASE) * 10) - s.fp;
  }

  function prestige(g) {
    const s = g.idle;
    const gain = prestigeGain(s);
    if (gain <= 0) return 0;
    s.fp += gain;
    s.prestiges++;
    s.gens = {}; s.ups = {}; s.earned = 0;
    g.acct.dino = 0;
    ISLE.sim.feed(g, `Extinction event. ${gain} fossil points — everything on the Exchange is ${Math.round(FP_MULT * s.fp * 100)}% better forever.`, 'buy');
    return gain;
  }

  /* Banked at the end of a run, win or lose. This is the only thing a death
   * does not take away from you, and it is why dying is a setback rather than
   * a wasted twenty minutes. */
  function bankRun(g, peakGrowth) {
    const n = Math.floor(peakGrowth * 10);
    if (n <= 0) return 0;
    g.idle.specimens += n;
    ISLE.sim.feed(g, `${n} specimen${n === 1 ? '' : 's'} logged — the Exchange pays ${Math.round((specimenMult(g.idle) - 1) * 100)}% more.`, 'good');
    return n;
  }

  function tick(g, dt) {
    credit(g, rate(g.idle) * dt);
    g.idle.lastReal = Date.now();
  }

  /* Credited on load. The Exchange keeps working while the tab is shut, at a
   * discount, up to eight hours. */
  function catchUp(g) {
    const s = g.idle;
    const away = clamp((Date.now() - (s.lastReal || Date.now())) / 1000, 0, OFFLINE_CAP);
    s.lastReal = Date.now();
    if (away < 30) return 0;
    const got = rate(s) * away * OFFLINE_RATE;
    if (got <= 0) return 0;
    credit(g, got);
    return { secs: away, got };
  }

  ISLE.idle = {
    GENS, UPGRADES, MILES, COST_MUL, PRESTIGE_BASE, OFFLINE_CAP,
    newState, genDef, owned, costOf, maxAfford, globalMult, specimenMult,
    milestoneMult, rate, tapPower, tap, credit, buyGen, buyUpgrade,
    prestigeGain, prestige, bankRun, tick, catchUp
  };
})(window.ISLE = window.ISLE || {});

</script>
<script>
/* Primal Isle — the island itself.
 *
 * Generated from a seed and never saved: the same seed rebuilds the same
 * coastline, the same river, the same highland. Only the things that change
 * during play (how much of a fern is left, where the bodies are) go in the
 * save.
 */
(function (ISLE) {
  'use strict';
  const C = ISLE.content;
  const { clamp, lerp, fbm, rngFrom, dist } = ISLE.core;

  const CELL = 12;                          // world units per biome cell
  const GN = Math.ceil(C.WORLD / CELL);     // cells per side
  const B = ['ocean', 'shallow', 'beach', 'plains', 'forest', 'swamp', 'river', 'lake', 'highland'];
  const BI = {}; B.forEach((id, i) => { BI[id] = i; });

  /* Named places, so the HUD can say where you are and the map means
   * something. Positions are in fractions of the world. */
  const PLACES = [
    { name: 'The Spine',      fx: 0.50, fy: 0.46, r: 300 },
    { name: 'Redwater Lake',  fx: 0.31, fy: 0.36, r: 250 },
    { name: 'Stillmere',      fx: 0.66, fy: 0.62, r: 230 },
    { name: 'The Fen',        fx: 0.62, fy: 0.30, r: 260 },
    { name: 'Longstrand',     fx: 0.50, fy: 0.90, r: 320 },
    { name: 'North Reach',    fx: 0.50, fy: 0.12, r: 320 },
    { name: 'Blackpine',      fx: 0.26, fy: 0.62, r: 300 },
    { name: 'Sunward Plain',  fx: 0.76, fy: 0.46, r: 300 }
  ];

  function build(seed) {
    const rng = rngFrom(seed);
    const grid = new Uint8Array(GN * GN);
    const cx = C.WORLD / 2, cy = C.WORLD / 2;
    const baseR = C.WORLD * 0.405;

    // Lakes, placed before the terrain so the swamp can hug them.
    const lakes = [
      { x: C.WORLD * 0.31, y: C.WORLD * 0.36, r: 168 },
      { x: C.WORLD * 0.66, y: C.WORLD * 0.62, r: 142 },
      { x: C.WORLD * 0.60, y: C.WORLD * 0.29, r: 96 }
    ];

    /* One river, from the highland down to the south-west coast, as a
     * poly-line the terrain pass carves out. */
    const river = [];
    {
      let x = cx + 40, y = cy + 20, a = 2.35;
      for (let i = 0; i < 70; i++) {
        river.push({ x, y, w: lerp(34, 62, i / 69) });
        a += (rng() - 0.5) * 0.42;
        a = lerp(a, 2.35, 0.22);
        x += Math.cos(a) * 26; y += Math.sin(a) * 26;
      }
    }

    function elevation(x, y) {
      const d = dist(x, y, cx, cy) / baseR;
      const warp = (fbm(seed, x / 620, y / 620, 4) - 0.5) * 0.62;
      return 1 - d + warp;
    }

    for (let gy = 0; gy < GN; gy++) {
      for (let gx = 0; gx < GN; gx++) {
        const x = gx * CELL + CELL / 2, y = gy * CELL + CELL / 2;
        const e = elevation(x, y);
        let id;
        if (e < -0.06) id = 'ocean';
        else if (e < 0.015) id = 'shallow';
        else if (e < 0.075) id = 'beach';
        else {
          const moist = fbm(seed + 991, x / 340, y / 340, 3);
          if (e > 0.62) id = 'highland';
          else if (moist > 0.56) id = 'forest';
          else id = 'plains';
        }
        grid[gy * GN + gx] = BI[id];
      }
    }

    // Carve the lakes and the marsh collar around them.
    for (const L of lakes) {
      const r2 = L.r + 78;
      for (let gy = Math.max(0, ((L.y - r2) / CELL) | 0); gy < Math.min(GN, ((L.y + r2) / CELL) | 0 + 1); gy++) {
        for (let gx = Math.max(0, ((L.x - r2) / CELL) | 0); gx < Math.min(GN, ((L.x + r2) / CELL) | 0 + 1); gx++) {
          const x = gx * CELL + CELL / 2, y = gy * CELL + CELL / 2;
          const d = dist(x, y, L.x, L.y);
          const wob = (fbm(seed + 77, x / 130, y / 130, 2) - 0.5) * 60;
          const cur = grid[gy * GN + gx];
          if (cur === BI.ocean || cur === BI.shallow) continue;
          if (d + wob < L.r) grid[gy * GN + gx] = BI.lake;
          else if (d + wob < L.r + 70) grid[gy * GN + gx] = BI.swamp;
        }
      }
    }

    // Carve the river last so it cuts through everything but the sea.
    for (const p of river) {
      const r = p.w;
      for (let gy = Math.max(0, ((p.y - r) / CELL) | 0); gy <= Math.min(GN - 1, ((p.y + r) / CELL) | 0); gy++) {
        for (let gx = Math.max(0, ((p.x - r) / CELL) | 0); gx <= Math.min(GN - 1, ((p.x + r) / CELL) | 0); gx++) {
          const x = gx * CELL + CELL / 2, y = gy * CELL + CELL / 2;
          const cur = grid[gy * GN + gx];
          if (cur === BI.ocean || cur === BI.shallow) continue;
          const d = dist(x, y, p.x, p.y);
          if (d < r * 0.62) grid[gy * GN + gx] = BI.river;
          else if (d < r && cur !== BI.lake) grid[gy * GN + gx] = BI.swamp;
        }
      }
    }

    const w = { seed, grid, lakes, river, cx, cy, baseR };
    w.nodes = seedNodes(w, rng);
    return w;
  }

  function biomeIdAt(w, x, y) {
    const gx = (x / CELL) | 0, gy = (y / CELL) | 0;
    if (gx < 0 || gy < 0 || gx >= GN || gy >= GN) return 'ocean';
    return B[w.grid[gy * GN + gx]];
  }
  const biomeAt = (w, x, y) => C.BIOMES[biomeIdAt(w, x, y)];

  const isWater = (w, x, y) => !!biomeAt(w, x, y).water;
  const isFresh = (w, x, y) => biomeAt(w, x, y).water === 'fresh';
  const isSalt = (w, x, y) => biomeAt(w, x, y).water === 'salt';
  const isDeep = (w, x, y) => biomeIdAt(w, x, y) === 'ocean';

  function slowAt(w, x, y) { return biomeAt(w, x, y).slow; }
  function coverAt(w, x, y) { return biomeAt(w, x, y).cover; }

  /* Can I drink from here? Standing in fresh water, or on its bank. */
  function drinkableAt(w, x, y) {
    if (isFresh(w, x, y)) return 'fresh';
    for (let a = 0; a < 8; a++) {
      const ang = (a / 8) * Math.PI * 2;
      const b = biomeAt(w, x + Math.cos(ang) * 26, y + Math.sin(ang) * 26);
      if (b.water === 'fresh') return 'fresh';
    }
    if (isSalt(w, x, y)) return 'salt';
    for (let a = 0; a < 8; a++) {
      const ang = (a / 8) * Math.PI * 2;
      const b = biomeAt(w, x + Math.cos(ang) * 26, y + Math.sin(ang) * 26);
      if (b.water === 'salt') return 'salt';
    }
    return null;
  }

  function regionName(w, x, y) {
    let best = null, bd = Infinity;
    for (const p of PLACES) {
      const d = dist(x, y, p.fx * C.WORLD, p.fy * C.WORLD);
      if (d < p.r && d < bd) { bd = d; best = p; }
    }
    if (best) return best.name;
    return C.BIOMES[biomeIdAt(w, x, y)].name;
  }

  /* --- food nodes ------------------------------------------------------
   * Scattered once, then depleted and regrown during play. Every entry knows
   * which biome it belongs to so regrowth does not have to re-check.
   */
  function seedNodes(w, rng) {
    const nodes = [];
    const want = 460;
    let guard = 0;
    while (nodes.length < want && guard++ < want * 40) {
      const x = rng() * C.WORLD, y = rng() * C.WORLD;
      const bid = biomeIdAt(w, x, y);
      if (bid === 'ocean') continue;

      const plants = Object.values(C.PLANTS).filter(p => p.biomes.includes(bid));
      const critters = Object.values(C.CRITTERS).filter(p => p.biomes.includes(bid));
      const pool = [];
      for (const p of plants) pool.push({ kind: 'plant', def: p });
      for (const p of critters) pool.push({ kind: 'critter', def: p });
      if (!pool.length) continue;

      const chosen = pool[(rng() * pool.length) | 0];
      nodes.push({
        x, y, kind: chosen.kind, type: chosen.def.id,
        amt: 1,                                  // 0..1 of a full meal
        t: 0,                                    // regrow timer
        seedv: (rng() * 1000) | 0
      });
    }
    return nodes;
  }

  function nodeDef(n) {
    return n.kind === 'plant' ? C.PLANTS[n.type] : C.CRITTERS[n.type];
  }

  function tickNodes(w, dt) {
    for (const n of w.nodes) {
      if (n.amt >= 1) continue;
      const def = nodeDef(n);
      const per = n.kind === 'plant' ? def.regrow : def.respawn;
      n.amt = Math.min(1, n.amt + dt / per);
    }
  }

  /* Everything edible within `r`, for the AI and for the eat button. */
  function nodesNear(w, x, y, r, diet) {
    const out = [];
    const r2 = r * r;
    for (const n of w.nodes) {
      if (n.amt < 0.25) continue;
      const dx = n.x - x, dy = n.y - y;
      if (dx * dx + dy * dy > r2) continue;
      if (diet === 'herbivore' && n.kind !== 'plant') continue;
      if (diet === 'carnivore' && n.kind !== 'critter') continue;
      out.push(n);
    }
    return out;
  }

  /* A spawn point: land, not highland, and preferably under cover. Hatchlings
   * spawn where they have a chance, which is nowhere near the middle. */
  function spawnPoint(w, rng) {
    rng = rng || Math.random;
    for (let i = 0; i < 400; i++) {
      const a = rng() * Math.PI * 2;
      const d = lerp(w.baseR * 0.55, w.baseR * 0.92, rng());
      const x = w.cx + Math.cos(a) * d, y = w.cy + Math.sin(a) * d;
      const bid = biomeIdAt(w, x, y);
      if (bid === 'forest' || bid === 'plains' || bid === 'swamp') return { x, y };
    }
    return { x: w.cx, y: w.cy + w.baseR * 0.7 };
  }

  /* Push a position back onto walkable ground — used when something wanders
   * into deep water it cannot survive. */
  function nudgeAshore(w, x, y) {
    let bx = x, by = y, best = Infinity;
    for (let a = 0; a < 16; a++) {
      for (let d = 40; d <= 260; d += 40) {
        const ang = (a / 16) * Math.PI * 2;
        const nx = x + Math.cos(ang) * d, ny = y + Math.sin(ang) * d;
        if (!isWater(w, nx, ny) && d < best) { best = d; bx = nx; by = ny; }
      }
      if (best < Infinity) break;
    }
    return { x: bx, y: by };
  }

  /* --- day/night -------------------------------------------------------
   * 0 = midnight, 1 = noon. Vision at night is species-dependent, which is
   * the whole reason a nocturnal premium raptor is worth money.
   */
  function daylight(clock) {
    const t = (clock % C.DAY_LENGTH) / C.DAY_LENGTH;
    return clamp(0.5 - 0.5 * Math.cos(t * Math.PI * 2), 0, 1);
  }
  function phaseName(clock) {
    const t = (clock % C.DAY_LENGTH) / C.DAY_LENGTH;
    if (t < 0.16) return 'Night';
    if (t < 0.3) return 'Dawn';
    if (t < 0.66) return 'Day';
    if (t < 0.82) return 'Dusk';
    return 'Night';
  }

  ISLE.world = {
    CELL, GN, build, biomeAt, biomeIdAt, isWater, isFresh, isSalt, isDeep,
    slowAt, coverAt, drinkableAt, regionName, tickNodes, nodesNear, nodeDef,
    spawnPoint, nudgeAshore, daylight, phaseName, PLACES
  };
})(window.ISLE = window.ISLE || {});

</script>
<script>
/* Primal Isle — the account: what you own, and what the shop does to the run.
 *
 * Every price here is paid in Dinollars earned on the Fossil Exchange. There
 * is no purchase path, no currency pack and no advertisement anywhere in this
 * file — the only way in is to have played the other half of the game.
 *
 * The ledger keeps the whole thing legible: where the Dinollars came from,
 * what they went on, and how much of your current run is standing on them.
 */
(function (ISLE) {
  'use strict';
  const S = ISLE.store;
  const C = ISLE.content;
  const { clamp, pick } = ISLE.core;

  const now = () => Date.now();

  function newAccount() {
    return {
      dino: 0, bones: 0,
      items: {}, boneItems: {},
      species: {}, shards: 0,
      skins: [], skin: null,
      clubUntil: 0,
      pass: { xp: 0, tier: 0, premium: false, claimedFree: {}, claimedPrem: {} },
      crate: { pulls: 0, pity: 0 },
      deals: [], firedDeals: {},
      mutBank: [],
      deaths: 0, deathStreak: 0, bestGrowth: 0, lives: 0,
      nestLives: 0, nestGrowth: 0.25,
      revivesUsed: 0, serumsUsed: 0, seenMuts: {},
      ledger: { spent: 0, by: {} }
    };
  }

  // --- currency ----------------------------------------------------------
  function spend(g, n, what) {
    if (g.acct.dino < n) return false;
    g.acct.dino -= n;
    const L = g.acct.ledger;
    L.spent += n;
    if (what) L.by[what] = (L.by[what] || 0) + n;
    return true;
  }

  function addBones(g, n) {
    if (clubActive(g)) n *= S.CLUB.boneMult;
    g.acct.bones += Math.round(n);
  }

  // --- items -------------------------------------------------------------
  function itemCount(g, id) { return g.acct.items[id] || 0; }
  function giveItem(g, id, n) { g.acct.items[id] = (g.acct.items[id] || 0) + (n || 1); }

  function buyItem(g, id, n) {
    n = n || 1;
    const it = S.ITEMS[id];
    if (!it) return false;
    if (!spend(g, it.cost * n, 'Items')) return false;
    giveItem(g, id, n);
    ISLE.sim.feed(g, `Bought ${it.name} ×${n}.`, 'buy');
    return true;
  }

  function buyBoneItem(g, id, n) {
    n = n || 1;
    const it = S.BONE_ITEMS[id];
    if (!it || g.acct.bones < it.bones * n) return false;
    g.acct.bones -= it.bones * n;
    g.acct.boneItems[id] = (g.acct.boneItems[id] || 0) + n;
    return true;
  }

  function applyEffect(g, eff, source) {
    const d = g.player;
    if (!d) return false;
    if (eff.growth) {
      d.growth = Math.min(C.ADULT, d.growth + eff.growth);
      g.acct.serumsUsed++;
      onGrowth(g, eff.growth);
      ISLE.sim.feed(g, `${source} — growth +${Math.round(eff.growth * 100)}%.`, 'buy');
    }
    if (eff.hunger) d.hunger = clamp(d.hunger + eff.hunger, 0, 100);
    if (eff.thirst) d.thirst = clamp(d.thirst + eff.thirst, 0, 100);
    if (eff.heal) ISLE.dino.heal(g, d, ISLE.dino.maxHp(d));
    if (eff.clearWounds) ISLE.dino.clearWounds(d);
    if (eff.clearBleed) { d.bleed = 0; d.bleedT = 0; }
    if (eff.armor) d.buffs.armor = { v: eff.armor, t: eff.dur || 300 };
    if (eff.reveal) d.buffs.reveal = { v: 1, t: eff.reveal };
    if (eff.spawnGrowth) { g.acct.nestLives = eff.lives; g.acct.nestGrowth = eff.spawnGrowth; }
    return true;
  }

  function useItem(g, id) {
    if (itemCount(g, id) <= 0) return false;
    const it = S.ITEMS[id];
    // These are spent by their own paths, not from the item list.
    if (id === 'revive' || id === 'instant' || id === 'reroll') return false;
    g.acct.items[id]--;
    applyEffect(g, it.effect, it.name);
    return true;
  }

  function useBoneItem(g, id) {
    if ((g.acct.boneItems[id] || 0) <= 0) return false;
    g.acct.boneItems[id]--;
    applyEffect(g, S.BONE_ITEMS[id].effect, S.BONE_ITEMS[id].name);
    return true;
  }

  // --- species -----------------------------------------------------------
  function unlocked(g, spId) {
    if (!C.SPECIES[spId].premium) return true;
    return !!g.acct.species[spId];
  }
  function unlockSpecies(g, spId, how) {
    g.acct.species[spId] = true;
    ISLE.sim.feed(g, `${C.SPECIES[spId].name} unlocked${how ? ' — ' + how : ''}.`, 'buy');
  }
  function buySpecies(g, spId) {
    const p = S.SPECIES_PRICE[spId];
    if (!p || unlocked(g, spId)) return false;
    if (!spend(g, p.cost, 'Species')) return false;
    unlockSpecies(g, spId, 'bought');
    return true;
  }
  function buySpeciesWithShards(g, spId) {
    const p = S.SPECIES_PRICE[spId];
    if (!p || unlocked(g, spId) || g.acct.shards < p.shards) return false;
    g.acct.shards -= p.shards;
    unlockSpecies(g, spId, 'shards');
    return true;
  }

  // --- banked mutations ---------------------------------------------------
  /* The bridge between the two games: Dinollars buy a mutation that outlives
   * your death and is already in play when the next hatchling opens its eyes. */
  function bankMutation(g, mutId) {
    const a = g.acct;
    if (a.mutBank.length >= S.BANK.slots) return false;
    if (a.mutBank.indexOf(mutId) >= 0) return false;
    const def = ISLE.mutations.BY_ID[mutId];
    if (!def) return false;
    if (!(a.seenMuts || {})[mutId]) return false;              // must have rolled it
    if (def.rarity === 'rare' || def.rarity === 'apex') return false;   // not the big ones
    if (!spend(g, S.BANK.cost, 'Banked mutations')) return false;
    a.mutBank.push(mutId);
    ISLE.sim.feed(g, `${ISLE.mutations.BY_ID[mutId].name} banked — it will be waiting at your next hatch.`, 'buy');
    return true;
  }
  function unbankMutation(g, mutId) {
    g.acct.mutBank = g.acct.mutBank.filter(x => x !== mutId);
    return true;
  }

  // --- crates -------------------------------------------------------------
  function rollCrate(g) {
    const a = g.acct;
    a.crate.pulls++;
    a.crate.pity++;
    const table = S.CRATE.table;

    if (a.crate.pity >= S.CRATE.pity) {
      a.crate.pity = 0;
      const legs = table.filter(e => e.rarity === 'legendary');
      return grant(g, legs[Math.random() < 0.8 ? 0 : legs.length - 1], true);
    }

    let total = 0;
    for (const e of table) total += e.w;
    let r = Math.random() * total;
    for (const e of table) {
      r -= e.w;
      if (r <= 0) {
        if (e.rarity === 'legendary') a.crate.pity = 0;
        return grant(g, e, false);
      }
    }
    return grant(g, table[0], false);
  }

  function grant(g, entry, pitied) {
    const gv = entry.give;
    const out = { name: entry.name, rarity: entry.rarity, pitied, detail: '' };
    if (gv.bones) { addBones(g, gv.bones); out.detail = `+${gv.bones} bones`; }
    if (gv.shards) { g.acct.shards += gv.shards; out.detail = `+${gv.shards} shards`; }
    if (gv.item) { giveItem(g, gv.item, gv.n || 1); out.detail = `${S.ITEMS[gv.item].name} ×${gv.n || 1}`; }
    if (gv.skin) {
      const pool = S.SKINS_BY_RARITY[gv.skin] || S.SKINS_BY_RARITY.common;
      const ownedSkins = g.acct.skins;
      const fresh = pool.filter(s => !ownedSkins.includes(s));
      const id = fresh.length ? pick(fresh) : pick(pool);
      if (!ownedSkins.includes(id)) ownedSkins.push(id);
      out.detail = S.SKINS[id].name + (fresh.length ? '' : ' (duplicate → 40 shards)');
      if (!fresh.length) g.acct.shards += 40;
      out.skin = id;
    }
    if (gv.species) {
      const locked = C.PREMIUM_SPECIES.filter(s => !unlocked(g, s));
      if (locked.length) { const s = pick(locked); unlockSpecies(g, s, 'crate'); out.detail = C.SPECIES[s].name + '!'; }
      else { g.acct.shards += 120; out.detail = 'already owned → 120 shards'; }
    }
    return out;
  }

  function openCrates(g, n) {
    n = n || 1;
    const cost = n === 10 ? S.CRATE.tenCost : S.CRATE.cost * n;
    if (!spend(g, cost, 'Crates')) return null;
    const out = [];
    for (let i = 0; i < n; i++) out.push(rollCrate(g));
    return out;
  }

  // --- season pass --------------------------------------------------------
  function addXp(g, n) {
    const p = g.acct.pass;
    p.xp += n;
    const tier = Math.min(S.PASS.tiers, Math.floor(p.xp / S.PASS.xpPerTier));
    if (tier > p.tier) {
      p.tier = tier;
      ISLE.sim.feed(g, `Apex Pass — tier ${tier}.`, 'info');
    }
  }
  function buyPass(g) {
    if (g.acct.pass.premium) return false;
    if (!spend(g, S.PASS.cost, 'Apex Pass')) return false;
    g.acct.pass.premium = true;
    ISLE.sim.feed(g, 'Apex Pass unlocked. Every premium reward up to your tier is claimable.', 'buy');
    return true;
  }
  function skipTier(g, n) {
    n = n || 1;
    if (!spend(g, S.PASS.tierSkip * n, 'Apex Pass')) return false;
    g.acct.pass.xp += S.PASS.xpPerTier * n;
    g.acct.pass.tier = Math.min(S.PASS.tiers, Math.floor(g.acct.pass.xp / S.PASS.xpPerTier));
    return true;
  }
  function claimTier(g, tier, premium) {
    const p = g.acct.pass;
    if (tier > p.tier || tier < 1) return null;
    if (premium && !p.premium) return null;
    const book = premium ? p.claimedPrem : p.claimedFree;
    if (book[tier]) return null;
    book[tier] = 1;
    const rew = premium ? S.PASS.premReward(tier) : S.PASS.freeReward(tier);
    if (rew.bones) addBones(g, rew.bones);
    if (rew.dino) g.acct.dino += rew.dino;
    if (rew.item) giveItem(g, rew.item, rew.n || 1);
    if (rew.species && !unlocked(g, rew.species)) unlockSpecies(g, rew.species, 'Apex Pass tier 40');
    return rew;
  }
  function claimAll(g) {
    let n = 0;
    for (let t = 1; t <= g.acct.pass.tier; t++) {
      if (claimTier(g, t, false)) n++;
      if (g.acct.pass.premium && claimTier(g, t, true)) n++;
    }
    return n;
  }

  // --- membership ---------------------------------------------------------
  function clubActive(g) { return g.acct && g.acct.clubUntil > now(); }
  function buyClub(g) {
    if (!spend(g, S.CLUB.cost, 'Apex Club')) return false;
    const a = g.acct;
    a.clubUntil = Math.max(a.clubUntil, now()) + S.CLUB.hours * 3600000;
    ISLE.sim.feed(g, 'Apex Club active for a day. Your name is gold now.', 'buy');
    return true;
  }

  // --- deals --------------------------------------------------------------
  function maybeDeal(g, trigger) {
    for (const id in S.DEALS) {
      const o = S.DEALS[id];
      if (o.trigger !== trigger) continue;
      if (o.once && g.acct.firedDeals[id]) continue;
      if (g.acct.deals.some(x => x.id === id)) continue;
      g.acct.firedDeals[id] = (g.acct.firedDeals[id] || 0) + 1;
      g.acct.deals.push({ id, until: now() + o.secs * 1000 });
      ISLE.sim.feed(g, `Limited deal: ${o.name}.`, 'buy');
      g.ui = g.ui || {};
      g.ui.popDeal = id;
      return id;
    }
    return null;
  }

  function tickDeals(g) {
    const t = now();
    g.acct.deals = g.acct.deals.filter(o => o.until > t);
  }

  function buyDeal(g, id) {
    const o = S.DEALS[id];
    const held = g.acct.deals.find(x => x.id === id);
    if (!o || !held) return false;
    if (!spend(g, o.cost, 'Deals')) return false;
    const a = g.acct;
    const gv = o.give;
    if (gv.dino) a.dino += gv.dino;
    if (gv.bones) addBones(g, gv.bones);
    if (gv.item) giveItem(g, gv.item, gv.n || 1);
    if (gv.item2) giveItem(g, gv.item2, gv.n2 || 1);
    if (gv.shards) a.shards += gv.shards;
    if (gv.species && !unlocked(g, gv.species)) unlockSpecies(g, gv.species, o.name);
    if (gv.mutBank) {
      const opts = ISLE.mutations.POOL.filter(m => m.rarity === 'uncommon' || m.rarity === 'common');
      const m = pick(opts);
      if (m && a.mutBank.length < S.BANK.slots) a.mutBank.push(m.id);
    }
    a.deals = a.deals.filter(x => x.id !== id);
    ISLE.sim.feed(g, `${o.name} bought.`, 'buy');
    return true;
  }

  // --- multipliers the sim reads ------------------------------------------
  function growthMult(g) {
    let m = 1;
    if (clubActive(g)) m *= S.CLUB.growthMult;
    if (g.acct.pass.premium) m *= 1.1;
    return m;
  }

  function exchangeMult(g) { return clubActive(g) ? S.CLUB.exchangeMult : 1; }

  function respawnSecs(g) {
    let base = 18 + 32 * clamp(g.acct.deathStreak / 5, 0, 1);
    if (clubActive(g)) base *= S.CLUB.respawnMult;
    return base;
  }

  // --- hooks the sim calls -------------------------------------------------
  function onGrowth(g, delta) {
    if (delta <= 0) return;
    addXp(g, delta * 100 * S.XP_PER.growthPct);
    const before = Math.floor((g.acct.bestGrowth || 0) * 10);
    g.acct.bestGrowth = Math.max(g.acct.bestGrowth || 0, g.player ? g.player.growth : 0);
    if (Math.floor(g.acct.bestGrowth * 10) > before) addBones(g, S.BONES_PER.growthMilestone);
    if (g.player && g.player.growth > 0.7) maybeDeal(g, 'nearAdult');
  }

  function onKill(g, victim) {
    addBones(g, S.BONES_PER.kill * (0.4 + victim.growth));
    addXp(g, S.XP_PER.kill * (0.5 + victim.growth));
  }

  function onEat(g, kind) {
    addXp(g, kind === 'plant' ? S.XP_PER.plant : S.XP_PER.meat);
  }

  function onMutation(g, id) {
    addBones(g, S.BONES_PER.mutation);
    addXp(g, S.XP_PER.mutation);
    // The bank can only hold something a run has actually shown you.
    if (id) {
      g.acct.seenMuts = g.acct.seenMuts || {};
      g.acct.seenMuts[id] = 1;
    }
  }

  function onDeath(g) {
    const a = g.acct;
    a.deaths++;
    a.deathStreak++;
    a.lives++;
    if (a.deaths === 1) maybeDeal(g, 'firstDeath');
    if (a.deathStreak >= 3) maybeDeal(g, 'deathStreak');
    if (a.dino > 12000) maybeDeal(g, 'richExchange');
  }

  function onSpawn(g) { /* nothing to settle yet; kept as the hook point */ }

  /* Growth you keep when you hatch again. Nothing, unless you bought a nest. */
  function spawnGrowth(g) {
    if (g.acct.nestLives > 0) { g.acct.nestLives--; return g.acct.nestGrowth || 0.25; }
    return C.HATCH_GROWTH;
  }

  // --- the ledger ----------------------------------------------------------
  function ledger(g) {
    const a = g.acct;
    const L = a.ledger;
    return {
      spent: L.spent,
      held: a.dino,
      earned: g.idle ? g.idle.total : 0,
      lines: Object.keys(L.by).map(k => ({ what: k, cost: L.by[k] })).sort((x, y) => y.cost - x.cost)
    };
  }

  /* 0..100: how much of this run is standing on the Exchange rather than on
   * play. Printed in the ledger, and measured by the balance harness. */
  function advantage(g) {
    const a = g.acct;
    let v = 0;
    if (clubActive(g)) v += 22;
    if (a.pass.premium) v += 10;
    v += C.PREMIUM_SPECIES.filter(s => unlocked(g, s)).length * 12;
    v += Math.min(16, itemCount(g, 'revive') * 4);
    v += Math.min(12, (itemCount(g, 'serum') + itemCount(g, 'megaSerum') * 3) * 1.5);
    v += Math.min(8, a.dino / 1500);
    v += a.mutBank.length * 4;
    return Math.round(clamp(v, 0, 100));
  }

  ISLE.shop = {
    newAccount, spend, addBones, itemCount, giveItem, buyItem, buyBoneItem,
    useItem, useBoneItem, applyEffect, unlocked, unlockSpecies, buySpecies,
    buySpeciesWithShards, bankMutation, unbankMutation, openCrates, rollCrate,
    addXp, buyPass, skipTier, claimTier, claimAll, clubActive, buyClub,
    maybeDeal, tickDeals, buyDeal, growthMult, exchangeMult, respawnSecs,
    onGrowth, onKill, onEat, onMutation, onDeath, onSpawn, spawnGrowth,
    ledger, advantage
  };
})(window.ISLE = window.ISLE || {});

<script>
/* Primal Isle — one animal, whether a player is steering it or not.
 *
 * The player's dinosaur and the thirty-odd others on the server run through
 * exactly the same functions. That is deliberate: it is the only way the
 * shop's advantages and the run's mutations are honestly reflected in what the
 * lobby does to you, and it lets the balance harness play both sides.
 *
 * Every stat here is: species base × growth scale × (1 + mutation modifiers),
 * in that order.
 */
(function (ISLE) {
  'use strict';
  const C = ISLE.content;
  const W = ISLE.world;
  const MU = ISLE.mutations;
  const { clamp, lerp, rnd, dist, turnToward } = ISLE.core;

  let nextId = 1;
  const mod = (d, k) => MU.mod(d, k);

  function make(opts) {
    const sp = C.SPECIES[opts.sp];
    const growth = opts.growth != null ? opts.growth : C.HATCH_GROWTH;
    const d = {
      id: opts.id || ('d' + (nextId++)),
      name: opts.name || sp.name,
      sp: sp.id,
      growth,
      x: opts.x || 0, y: opts.y || 0,
      ang: opts.ang != null ? opts.ang : rnd(0, Math.PI * 2),
      vx: 0, vy: 0, speed: 0,
      hp: 1, hunger: 78, thirst: 78, stam: 100,
      bleed: 0, bleedT: 0, bone: 0, boneT: 0, salt: 0,
      biteT: 0, combatT: 0, callT: 0, restT: 0,
      alive: true, group: opts.group || null,
      player: !!opts.player, whale: !!opts.whale, skin: opts.skin || null,
      kills: 0, born: opts.clock || 0, meals: 0,
      buffs: {},                     // armor / reveal, each { v, t }
      muts: opts.muts ? opts.muts.slice() : [],
      mods: {},
      mutMiles: 0,
      usedUndying: false,
      lastHitBy: null, lastHitT: 0,
      protect: C.SPAWN_PROTECT,      // briefly hard to notice, after hatching
      ai: null
    };
    MU.recompute(d);
    d.hp = maxHp(d);
    d.stam = maxStam(d);
    return d;
  }

  const species = d => C.SPECIES[d.sp];
  const scale = d => C.scaleOf(d.growth);
  const radius = d => species(d).size * C.sizeScale(d.growth);
  const maxHp = d => species(d).hp * scale(d) * (1 + mod(d, 'hp'));
  const maxStam = d => species(d).stam * (0.6 + 0.4 * d.growth) * (1 + mod(d, 'stamMax'));

  /* Weight decides who wins a shove and who can eat whom. */
  const mass = d => species(d).bulk * Math.pow(d.growth, 1.6) * species(d).size;
  const tier = d => species(d).tier * (0.35 + 0.65 * d.growth);

  /* Adrenal Glands and the like are conditional, so damage is computed rather
   * than cached. */
  function damage(d) {
    let v = species(d).dmg * scale(d) * (1 + mod(d, 'dmg'));
    if (d.bone) v *= 0.82;
    if (mod(d, 'lowHp') && d.hp < maxHp(d) * 0.34) v *= 1.35;
    const pack = species(d).packBonus * (1 + mod(d, 'pack'));
    if (d.groupSize > 1) v *= 1 + pack * Math.min(3, d.groupSize - 1);
    return v;
  }

  function biteCd(d) {
    return species(d).biteCd * (1 + mod(d, 'biteCd')) * (d.bone ? 1.25 : 1);
  }

  function speedOf(g, d) {
    const sp = species(d);
    let v = sp.spd * (0.55 + 0.45 * Math.pow(d.growth, 0.55)) * (1 + mod(d, 'spd'));
    v *= W.slowAt(g.world, d.x, d.y);
    if (W.isWater(g.world, d.x, d.y)) v *= sp.swim * (1 + mod(d, 'swim'));
    if (d.bone) v *= C.NEEDS.boneSlow;
    if (d.salt > 0) v *= 0.88;
    if (d.hunger < 12 || d.thirst < 12) v *= 0.8;
    if (mod(d, 'lowHp') && d.hp < maxHp(d) * 0.34) v *= 1.2;
    return v;
  }

  /* How far this animal can make anything out, right now. Night is the great
   * equaliser, except for whatever has paid or mutated its way around it. */
  function vision(g, d) {
    const day = W.daylight(g.clock);
    const night = clamp(species(d).night + mod(d, 'night'), 0, 1);
    const dark = lerp(C.NIGHT_VISION_FLOOR + night * (1 - C.NIGHT_VISION_FLOOR), 1, day);
    let r = (420 + 520 * d.growth) * dark * (1 + mod(d, 'vision'));
    if (d.buffs.reveal) r = 1e5;
    return r;
  }

  /* How visible this animal is to others: big things in the open are seen. */
  function conspicuity(g, d) {
    const cover = W.coverAt(g.world, d.x, d.y);
    let v = (0.35 + 1.15 * d.growth) * (1 - cover * 0.75) * (d.speed > 40 ? 1.25 : 1);
    v *= clamp(1 - mod(d, 'quiet'), 0.25, 1);
    if (d.protect > 0) v *= 0.25;
    return v;
  }

  function canSee(g, watcher, target) {
    return dist(watcher.x, watcher.y, target.x, target.y) < vision(g, watcher) * conspicuity(g, target);
  }

  // --- needs -------------------------------------------------------------
  function tickNeeds(g, d, dt) {
    const sp = species(d);
    const bulk = sp.bulk * (0.45 + 0.55 * d.growth);
    const club = d.player && ISLE.shop.clubActive(g) ? ISLE.store.CLUB.hungerMult : 1;
    const hMul = club * (1 + mod(d, 'hunger'));
    const tMul = club * (1 + mod(d, 'thirst'));

    d.hunger = clamp(d.hunger - C.NEEDS.hungerDrain * bulk * hMul * dt, 0, 100);
    d.thirst = clamp(d.thirst - C.NEEDS.thirstDrain * bulk * tMul * dt, 0, 100);

    // Symbiotic Algae: daylight is a slow meal.
    if (mod(d, 'photo')) {
      const day = W.daylight(g.clock);
      d.hunger = clamp(d.hunger + 1.6 * day * dt, 0, 100);
      d.thirst = clamp(d.thirst + 1.1 * day * dt, 0, 100);
    }

    if (d.salt > 0) {
      d.salt -= dt;
      d.thirst = clamp(d.thirst - 0.5 * dt, 0, 100);
    }

    if (!d.sprinting) {
      const rest = d.speed < 8 ? 1.65 : 1;
      d.stam = clamp(d.stam + sp.stamRegen * (1 + mod(d, 'stamRegen')) * rest * dt, 0, maxStam(d));
    }

    // Wounds.
    if (d.bleed > 0) {
      d.bleedT -= dt * (1 + mod(d, 'bleedRes') * 2);
      hurt(g, d, C.NEEDS.bleedDps * d.bleed * (1 - clamp(mod(d, 'bleedRes'), 0, 0.9)) * dt, null, true);
      if (d.bleedT <= 0) { d.bleed = Math.max(0, d.bleed - 1); d.bleedT = C.NEEDS.bleedDur * 0.5; }
    }
    if (d.bone) {
      d.boneT -= dt;
      if (d.boneT <= 0) d.bone = 0;
    }

    // Starvation and thirst kill, slowly, which is the point of the timers.
    if (d.hunger <= 0) hurt(g, d, C.NEEDS.starveDps * dt, null, true);
    if (d.thirst <= 0) hurt(g, d, C.NEEDS.thirstDps * dt, null, true);

    // Drowning: deep water is not a shortcut unless you swim well.
    if (W.isDeep(g.world, d.x, d.y) && species(d).swim * (1 + mod(d, 'swim')) < 1.2) {
      d.stam = clamp(d.stam - 9 * dt, 0, maxStam(d));
      if (d.stam <= 0) hurt(g, d, 8 * dt, null, true);
    }

    // Healing, when everything else is in order — or always, if it mutated.
    const knits = mod(d, 'regen');
    const canHeal = d.combatT <= 0 && (knits ? d.hunger > 15 : (d.hunger > C.NEEDS.healHunger && d.thirst > 30 && !d.bleed));
    if (canHeal) {
      d.hp = Math.min(maxHp(d), d.hp + C.NEEDS.healPerSec * (1 + knits) * scale(d) * dt);
    }

    d.combatT = Math.max(0, d.combatT - dt);
    d.biteT = Math.max(0, d.biteT - dt);
    d.callT = Math.max(0, d.callT - dt);
    if (d.protect > 0) d.protect -= dt;

    for (const k in d.buffs) {
      const b = d.buffs[k];
      b.t -= dt;
      if (b.t <= 0) delete d.buffs[k];
    }

    tickGrowth(g, d, dt);
  }

  /* Growth only moves while fed and watered. Everything the shop sells is
   * ultimately a way around this line. */
  function tickGrowth(g, d, dt) {
    if (d.growth >= C.ADULT) { d.growth = C.ADULT; return; }
    if (d.hunger < C.NEEDS.growthHunger || d.thirst < C.NEEDS.growthThirst) { d.growthStalled = true; return; }
    d.growthStalled = false;
    let rate = C.NEEDS.growthPerSec * species(d).growthRate * (1 + mod(d, 'growth'));
    if (d.player) rate *= ISLE.shop.growthMult(g);
    else if (d.whale) rate *= 1.35;
    const before = d.growth;
    d.growth = Math.min(C.ADULT, d.growth + rate * dt);
    if (d.player) ISLE.shop.onGrowth(g, d.growth - before);
    // Growing costs food: bigger animal, emptier stomach.
    d.hunger = clamp(d.hunger - (d.growth - before) * 26, 0, 100);
  }

  function hurt(g, d, amount, from, silent) {
    if (!d.alive) return 0;
    if (d.buffs.armor) amount *= 1 - d.buffs.armor.v;
    amount *= clamp(1 - mod(d, 'armor'), 0.2, 1);
    d.hp -= amount;
    if (!silent) {
      d.combatT = C.COMBAT.combatMemory;
      d.lastHitBy = from ? from.id : d.lastHitBy;
      d.lastHitT = g.clock;
    }
    if (d.hp <= 0) {
      // Undying: one killing blow a life leaves you standing on nothing.
      if (mod(d, 'undying') && !d.usedUndying) {
        d.usedUndying = true;
        d.hp = 1;
        d.buffs.armor = { v: 0.6, t: 4 };
        if (d.player) ISLE.sim.feed(g, 'Undying — you should be dead. You are not, yet.', 'great');
      } else {
        d.hp = 0; d.alive = false; d.killer = from ? from.id : null;
      }
    }
    return amount;
  }

  function heal(g, d, amount) { d.hp = Math.min(maxHp(d), d.hp + amount); }

  function clearWounds(d) { d.bleed = 0; d.bleedT = 0; d.bone = 0; d.boneT = 0; }

  // --- feeding -----------------------------------------------------------
  /* Nutrition falls off as you grow unless the food is good. A grown herbivore
   * living on ferns is losing ground; a Ruminant Gut is how it stops. */
  function nutritionMul(d, quality) {
    const need = 0.25 + 0.75 * d.growth;
    return clamp(quality / need, 0.18, 1.35);
  }

  function eatNode(g, d, n) {
    if (!n || n.amt < 0.25) return 0;
    const def = W.nodeDef(n);
    const bonus = 1 + mod(d, n.kind === 'plant' ? 'plantFood' : 'meatFood');
    const gain = def.food * nutritionMul(d, def.quality) * n.amt * bonus;
    d.hunger = clamp(d.hunger + gain, 0, 100);
    n.amt = 0;
    d.meals++;
    if (d.player) ISLE.shop.onEat(g, n.kind);
    return gain;
  }

  function eatCarcass(g, d, car) {
    if (!car || car.meat <= 0) return 0;
    // Iron Stomach does not care how long that has been lying there.
    const rot = mod(d, 'scavenge') ? 1 : clamp(1 - car.age / C.CARCASS_ROT, 0.15, 1);
    const bite = Math.min(car.meat, 0.16 + 0.2 * d.growth);
    const gain = 130 * bite * nutritionMul(d, C.MEAT_QUALITY * rot) * (1 + mod(d, 'meatFood'));
    car.meat -= bite;
    d.hunger = clamp(d.hunger + gain, 0, 100);
    d.meals++;
    if (d.player) ISLE.shop.onEat(g, 'meat');
    return gain;
  }

  function drink(g, d, dt) {
    const kind = W.drinkableAt(g.world, d.x, d.y);
    if (!kind) return null;
    if (kind === 'fresh' || mod(d, 'saltproof')) {
      d.thirst = clamp(d.thirst + 42 * dt, 0, 100);
      return 'fresh';
    }
    d.thirst = clamp(d.thirst + 12 * dt, 0, 100);
    d.salt = C.NEEDS.saltSick;
    return kind;
  }

  // --- movement ----------------------------------------------------------
  /* `input` is { mx, my, sprint }. The AI builds exactly the same shape, so
   * the steering code is shared. */
  function steer(g, d, input, dt) {
    const mag = Math.hypot(input.mx, input.my);
    const wantSprint = !!input.sprint && mag > 0.55 && d.stam > 1;
    d.sprinting = wantSprint;

    let sp = speedOf(g, d);
    if (wantSprint) {
      sp *= species(d).sprint;
      const drain = species(d).stamDrain * (1 + mod(d, 'stamDrain')) *
        (W.isWater(g.world, d.x, d.y) && mod(d, 'swim') ? 0 : 1);
      d.stam = clamp(d.stam - drain * C.COMBAT.sprintTax * dt, 0, maxStam(d));
      if (d.stam <= 0) d.sprinting = false;
    }
    if (d.stam < 12 && !wantSprint) sp *= 0.9;

    if (mag > 0.06) {
      /* Big animals turn like ships. It is the only defence a hatchling has. */
      const agility = 3.4 - 1.5 * d.growth;
      d.ang = turnToward(d.ang, Math.atan2(input.my, input.mx), agility * dt);
      d.speed = lerp(d.speed, sp * Math.min(1, mag), Math.min(1, dt * 6));
    } else {
      d.speed = lerp(d.speed, 0, Math.min(1, dt * 7));
    }

    d.vx = Math.cos(d.ang) * d.speed;
    d.vy = Math.sin(d.ang) * d.speed;
    d.x += d.vx * dt;
    d.y += d.vy * dt;

    const m = 30;
    d.x = clamp(d.x, m, C.WORLD - m);
    d.y = clamp(d.y, m, C.WORLD - m);
  }

  /* Simple separation so animals do not stack into one pixel. */
  function separate(g, list) {
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      if (!a.alive) continue;
      for (let j = i + 1; j < list.length; j++) {
        const b = list[j];
        if (!b.alive) continue;
        const rr = radius(a) + radius(b);
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy;
        if (d2 > rr * rr || d2 < 0.0001) continue;
        const dd = Math.sqrt(d2);
        const push = (rr - dd) / 2;
        const ux = dx / dd, uy = dy / dd;
        const ma = mass(a), mb = mass(b);
        const total = ma + mb;
        a.x -= ux * push * (mb / total) * 2;
        a.y -= uy * push * (mb / total) * 2;
        b.x += ux * push * (ma / total) * 2;
        b.y += uy * push * (ma / total) * 2;
      }
    }
  }

  function label(d) { return C.growthLabel(d.growth); }

  ISLE.dino = {
    make, species, scale, radius, maxHp, maxStam, mass, tier, damage, biteCd,
    speedOf, vision, conspicuity, canSee, tickNeeds, tickGrowth, hurt, heal,
    clearWounds, eatNode, eatCarcass, drink, steer, separate, nutritionMul, label
  };
})(window.ISLE = window.ISLE || {});

<script>
/* Primal Isle — bites, bleeding, and what a body leaves behind.
 *
 * There are no combos and no dodge button. A fight is decided by who is
 * bigger, who brought friends, what each of them mutated into, and who has
 * stamina left to leave.
 */
(function (ISLE) {
  'use strict';
  const C = ISLE.content;
  const D = ISLE.dino;
  const MU = ISLE.mutations;
  const { clamp, dist, angDelta, chance } = ISLE.core;

  const mod = (d, k) => MU.mod(d, k);

  /* The animal in front of you, within reach, closest first. */
  function biteTarget(g, a) {
    let best = null, bestD = Infinity;
    const ar = D.radius(a);
    for (const b of g.dinos) {
      if (b === a || !b.alive) continue;
      if (b.group && b.group === a.group) continue;      // no biting the herd
      const dd = dist(a.x, a.y, b.x, b.y);
      const reach = (ar + D.radius(b)) * C.COMBAT.biteReach;
      if (dd > reach) continue;
      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      if (Math.abs(angDelta(a.ang, ang)) > C.COMBAT.biteArc) continue;
      if (dd < bestD) { bestD = dd; best = b; }
    }
    return best;
  }

  function canBite(a) { return a.alive && a.biteT <= 0 && a.stam > C.COMBAT.biteStam * 0.5; }

  function bite(g, a) {
    if (!canBite(a)) return null;
    const b = biteTarget(g, a);
    a.biteT = D.biteCd(a);
    a.stam = clamp(a.stam - C.COMBAT.biteStam, 0, D.maxStam(a));
    a.combatT = C.COMBAT.combatMemory;
    if (!b) return { miss: true };

    let dmg = D.damage(a);
    // Ambush Predator: the first bite on something that has not been in a
    // fight yet lands twice as hard.
    const ambushed = mod(a, 'ambush') && b.combatT <= 0;
    if (ambushed) dmg *= 2;

    const dealt = D.hurt(g, b, dmg, a);
    b.combatT = C.COMBAT.combatMemory;

    if (mod(a, 'lifesteal')) D.heal(g, a, dealt * mod(a, 'lifesteal'));

    // Wounds. Bleeding is what kills the ones that get away.
    const sizeEdge = clamp(D.mass(a) / Math.max(0.01, D.mass(b)), 0.3, 3);
    const bleedChance = (C.COMBAT.bleedChance + mod(a, 'bleedOn')) * clamp(sizeEdge, 0.4, 1.6);
    if (chance(bleedChance)) {
      b.bleed = Math.min(5, b.bleed + 1);
      b.bleedT = C.NEEDS.bleedDur;
    }
    if (chance(C.COMBAT.boneChance * sizeEdge) && !b.bone) {
      b.bone = 1; b.boneT = C.NEEDS.boneHeal;
    }

    // Knockback, for the species and the mutations built around it.
    const kb = (D.species(a).knockback || 0) + mod(a, 'knock');
    if (kb) {
      const push = kb * clamp(sizeEdge, 0.2, 2.2);
      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      b.x += Math.cos(ang) * push;
      b.y += Math.sin(ang) * push;
      b.stam = clamp(b.stam - push * 0.12, 0, D.maxStam(b));
    }

    const res = { target: b, dmg: dealt, killed: !b.alive, ambushed };
    if (!b.alive) onKill(g, a, b);
    return res;
  }

  function onKill(g, killer, victim) {
    victim.alive = false;
    victim.diedAt = g.clock;
    killer.kills++;
    makeCarcass(g, victim);

    // Apex Instinct: a kill puts you back to full.
    if (mod(killer, 'killheal')) D.heal(g, killer, D.maxHp(killer));

    if (killer.player) {
      ISLE.shop.onKill(g, victim);
      ISLE.sim.feed(g, `You killed ${victim.name} (${D.label(victim)} ${D.species(victim).name}).`, 'good');
    } else if (victim.player) {
      ISLE.sim.feed(g, `${victim.name} was killed by ${killer.name}.`, 'bad');
    } else {
      ISLE.sim.feed(g, `${killer.name} killed ${victim.name}.`, 'dim');
    }
  }

  function makeCarcass(g, d) {
    g.carcasses.push({
      x: d.x, y: d.y, sp: d.sp, name: d.name,
      growth: d.growth,
      meat: 0.5 + 2.6 * d.growth * D.species(d).bulk,
      age: 0, seedv: (Math.random() * 1000) | 0
    });
    if (g.carcasses.length > 40) g.carcasses.shift();
  }

  function tickCarcasses(g, dt) {
    for (let i = g.carcasses.length - 1; i >= 0; i--) {
      const c = g.carcasses[i];
      c.age += dt;
      if (c.age > C.CARCASS_ROT * 1.8 || c.meat <= 0.02) g.carcasses.splice(i, 1);
    }
  }

  function carcassNear(g, x, y, r) {
    let best = null, bd = r;
    for (const c of g.carcasses) {
      const dd = dist(x, y, c.x, c.y);
      if (dd < bd && c.meat > 0.02) { bd = dd; best = c; }
    }
    return best;
  }

  /* Would I win? Used by the AI to decide, and by the threat readout to tell
   * the player what the thing across the clearing is going to do about them. */
  function matchup(a, b) {
    const mine = D.damage(a) * (a.hp / Math.max(1, D.maxHp(a))) * (0.6 + 0.4 * a.stam / D.maxStam(a));
    const theirs = D.damage(b) * (b.hp / Math.max(1, D.maxHp(b))) * (0.6 + 0.4 * b.stam / D.maxStam(b));
    const durability = D.maxHp(a) / Math.max(1, D.maxHp(b));
    return (mine / Math.max(0.01, theirs)) * Math.sqrt(durability);
  }

  ISLE.combat = { bite, canBite, biteTarget, onKill, makeCarcass, tickCarcasses, carcassNear, matchup };
})(window.ISLE = window.ISLE || {});
