<script>
/* Primal Isle — the other thirty-four players.
 *
 * There is no server. The lobby is simulated locally, with the same needs,
 * the same growth curve and the same combat as the player — and with the same
 * shop advantages applied to the third of them who "pay". A free player is
 * therefore genuinely outnumbered by better animals, which is the honest
 * version of what the store is selling a way out of.
 */
(function (ISLE) {
  'use strict';
  const C = ISLE.content;
  const W = ISLE.world;
  const D = ISLE.dino;
  const K = ISLE.combat;
  const { clamp, rnd, rndInt, pick, chance, dist } = ISLE.core;

  function waterPoints(w) {
    if (w.__water) return w.__water;
    const pts = w.lakes.map(l => ({ x: l.x, y: l.y }));
    for (let i = 0; i < w.river.length; i += 6) pts.push({ x: w.river[i].x, y: w.river[i].y });
    w.__water = pts;
    return pts;
  }

  function nearestWater(w, x, y) {
    let best = null, bd = Infinity;
    for (const p of waterPoints(w)) {
      const d = dist(x, y, p.x, p.y);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }

  /* A newcomer to the server. Species and starting growth are drawn so the
   * lobby always holds a spread — a few adults to be afraid of, a lot of
   * juveniles to compete with, and some hatchlings to eat. */
  function spawn(g, opts) {
    opts = opts || {};
    const whale = opts.whale != null ? opts.whale : chance(C.AI_WHALE_RATE);
    let spId;
    if (whale && chance(0.55)) spId = pick(C.PREMIUM_SPECIES);
    else spId = pick(C.FREE_SPECIES);

    const roll = Math.random();
    let growth;
    if (roll < 0.34) growth = rnd(0.06, 0.2);
    else if (roll < 0.72) growth = rnd(0.2, 0.55);
    else if (roll < 0.93) growth = rnd(0.55, 0.85);
    else growth = rnd(0.85, 1);
    if (whale) growth = clamp(growth * 1.35, 0.1, 1);

    const at = opts.at || W.spawnPoint(g.world);
    const used = new Set(g.dinos.map(d => d.name));
    let name = pick(C.NAMES);
    for (let i = 0; i < 20 && used.has(name); i++) name = pick(C.NAMES) + rndInt(2, 99);

    const d = D.make({
      sp: spId, growth, x: at.x, y: at.y, name, whale, clock: g.clock,
      skin: whale && chance(0.5) ? pick(['gilded', 'prism', 'void']) : null
    });
    d.ai = {
      state: 'wander',
      kos: chance(C.AI_KOS_RATE) || D.species(d).tier >= 4,
      nerve: rnd(0.7, 1.45),          // how favourable a fight has to look
      skill: rnd(0.55, 1.0),
      think: rnd(0, 0.6),
      gx: at.x, gy: at.y,
      targetId: null, until: 0
    };
    /* The lobby mutates too. A grown rival carrying three of these is why an
     * adult is frightening rather than merely large. */
    ISLE.mutations.seedAi(d);
    g.dinos.push(d);
    return d;
  }

  /* Keep the lobby full, with a trickle rather than a burst. */
  function maintain(g, dt) {
    g.spawnAcc = (g.spawnAcc || 0) + dt;
    const alive = g.dinos.filter(d => d.alive && !d.player).length;
    if (alive < C.SERVER_CAP && g.spawnAcc > 1.6) {
      g.spawnAcc = 0;
      spawn(g);
    }
  }

  function nearestNode(g, d, r) {
    const diet = D.species(d).diet;
    const list = W.nodesNear(g.world, d.x, d.y, r, diet === 'herbivore' ? 'herbivore' : 'carnivore');
    let best = null, bd = Infinity;
    for (const n of list) {
      const dd = dist(d.x, d.y, n.x, n.y);
      if (dd < bd) { bd = dd; best = n; }
    }
    return best;
  }

  /* Who is worth attacking, and who should be run from. Both answers come out
   * of the same matchup number. */
  function assess(g, d) {
    let prey = null, preyScore = 0, threat = null, threatScore = 0;
    for (const o of g.dinos) {
      if (o === d || !o.alive) continue;
      if (o.group && o.group === d.group) continue;
      if (!D.canSee(g, d, o)) continue;
      const m = K.matchup(d, o);
      const dd = dist(d.x, d.y, o.x, o.y);
      const near = clamp(1 - dd / 900, 0.05, 1);
      // A hatchling is not worth the walk unless you are genuinely starving.
      const beneathNotice = o.growth < C.IGNORE_GROWTH && d.hunger > 30;
      if (m > d.ai.nerve && !beneathNotice) {
        const s = m * near * (1 + o.growth);
        if (s > preyScore) { preyScore = s; prey = o; }
      } else if (m < 0.72) {
        const s = (1 / Math.max(0.05, m)) * near;
        if (s > threatScore) { threatScore = s; threat = o; }
      }
    }
    return { prey, threat, threatScore };
  }

  function think(g, d, dt) {
    const a = d.ai;
    a.think -= dt;
    if (a.think > 0) return;
    a.think = rnd(0.35, 0.8);

    const sp = D.species(d);
    const carn = sp.diet === 'carnivore';
    const { prey, threat } = assess(g, d);

    // 1. Anything scary and close beats every other consideration.
    const hurtBadly = d.hp < D.maxHp(d) * 0.42;
    if (threat && (hurtBadly || dist(d.x, d.y, threat.x, threat.y) < 340)) {
      a.state = 'flee'; a.targetId = threat.id; return;
    }
    if (hurtBadly && d.combatT > 0) { a.state = 'flee'; a.targetId = null; return; }

    // 2. Thirst, then hunger. A dying-of-thirst animal takes risks.
    if (d.thirst < 38) {
      const p = nearestWater(g.world, d.x, d.y);
      if (p) { a.state = 'drink'; a.gx = p.x; a.gy = p.y; return; }
    }
    if (d.hunger < 58) {
      if (carn) {
        const car = K.carcassNear(g, d.x, d.y, D.vision(g, d) * 1.2);
        if (car) { a.state = 'scavenge'; a.gx = car.x; a.gy = car.y; a.car = car; return; }
        if (prey) { a.state = 'hunt'; a.targetId = prey.id; return; }
        const n = nearestNode(g, d, 700);
        if (n) { a.state = 'forage'; a.gx = n.x; a.gy = n.y; a.node = n; return; }
      } else {
        const n = nearestNode(g, d, 900);
        if (n) { a.state = 'forage'; a.gx = n.x; a.gy = n.y; a.node = n; return; }
      }
    }

    // 3. Kill-on-sight players go looking for a fight they can win.
    if (a.kos && prey && d.stam > D.maxStam(d) * 0.45 && d.hunger > 25) {
      a.state = 'hunt'; a.targetId = prey.id; return;
    }

    // 4. Otherwise drift. Grown animals patrol the middle; small ones hide.
    if (a.state !== 'wander' || dist(d.x, d.y, a.gx, a.gy) < 90) {
      a.state = 'wander';
      const w = g.world;
      const bias = d.growth > 0.6 ? 0.45 : 0.9;
      const ang = rnd(0, Math.PI * 2);
      const r = w.baseR * rnd(0.2, bias);
      a.gx = clamp(w.cx + Math.cos(ang) * r, 60, C.WORLD - 60);
      a.gy = clamp(w.cy + Math.sin(ang) * r, 60, C.WORLD - 60);
    }
  }

  function act(g, d, dt) {
    const a = d.ai;
    const input = { mx: 0, my: 0, sprint: false };
    const target = a.targetId ? g.byId[a.targetId] : null;

    switch (a.state) {
      case 'flee': {
        if (target && target.alive) {
          const ang = Math.atan2(d.y - target.y, d.x - target.x);
          input.mx = Math.cos(ang); input.my = Math.sin(ang);
          input.sprint = d.stam > 8;
          // Cornered and out of stamina: turn and bite.
          if (dist(d.x, d.y, target.x, target.y) < D.radius(d) * 2.2 && d.stam < 12) {
            faceAndBite(g, d, target, input);
          }
        } else {
          const ang = Math.atan2(g.world.cy - d.y, g.world.cx - d.x) + Math.PI;
          input.mx = Math.cos(ang); input.my = Math.sin(ang);
          input.sprint = d.stam > 30 && d.combatT > 0;
        }
        break;
      }
      case 'hunt': {
        if (!target || !target.alive) { a.state = 'wander'; break; }
        const dd = dist(d.x, d.y, target.x, target.y);
        if (dd > D.vision(g, d) * 1.6) { a.state = 'wander'; break; }
        faceAndBite(g, d, target, input);
        input.sprint = dd < 420 && d.stam > 18;
        break;
      }
      case 'drink': {
        moveTo(d, a.gx, a.gy, input);
        if (W.drinkableAt(g.world, d.x, d.y) === 'fresh') {
          D.drink(g, d, dt);
          if (d.thirst > 92) a.state = 'wander';
          input.mx = input.my = 0;
        }
        break;
      }
      case 'forage': {
        const n = a.node;
        if (!n || n.amt < 0.25) { a.state = 'wander'; break; }
        moveTo(d, n.x, n.y, input);
        if (dist(d.x, d.y, n.x, n.y) < D.radius(d) + 26) {
          D.eatNode(g, d, n);
          a.state = 'wander';
        }
        break;
      }
      case 'scavenge': {
        const c = a.car;
        if (!c || c.meat <= 0.02 || g.carcasses.indexOf(c) < 0) { a.state = 'wander'; break; }
        moveTo(d, c.x, c.y, input);
        if (dist(d.x, d.y, c.x, c.y) < D.radius(d) + 30) {
          D.eatCarcass(g, d, c);
          input.mx = input.my = 0;
          if (d.hunger > 92) a.state = 'wander';
        }
        break;
      }
      default: {
        moveTo(d, a.gx, a.gy, input);
        if (d.stam < D.maxStam(d) * 0.3) { input.mx *= 0.4; input.my *= 0.4; }
      }
    }

    // Nobody with any sense swims the open sea.
    if (W.isDeep(g.world, d.x, d.y) && D.species(d).swim < 1.2) {
      const ashore = W.nudgeAshore(g.world, d.x, d.y);
      const ang = Math.atan2(ashore.y - d.y, ashore.x - d.x);
      input.mx = Math.cos(ang); input.my = Math.sin(ang); input.sprint = true;
    }

    D.steer(g, d, input, dt);

    // Calls: mostly the ones that give the map away, because that is what
    // players actually do.
    if (d.callT <= 0 && chance(dt * 0.035)) {
      d.callT = 9;
      ISLE.sim.emitCall(g, d, d.combatT > 0 ? 'distress' : 'broadcast');
    }
  }

  function moveTo(d, x, y, input) {
    const ang = Math.atan2(y - d.y, x - d.x);
    input.mx = Math.cos(ang); input.my = Math.sin(ang);
  }

  function faceAndBite(g, d, target, input) {
    const ang = Math.atan2(target.y - d.y, target.x - d.x);
    input.mx = Math.cos(ang); input.my = Math.sin(ang);
    const reach = (D.radius(d) + D.radius(target)) * C.COMBAT.biteReach;
    if (dist(d.x, d.y, target.x, target.y) <= reach * 0.95 && K.canBite(d)) {
      if (chance(d.ai.skill)) K.bite(g, d);
    }
  }

  /* Grouping: same species, close, and neither of them already in a big herd.
   * The pack bonus is real, which is why a lone free player is at the bottom
   * of every fight. */
  function tickGroups(g) {
    for (const d of g.dinos) d.groupSize = 0;
    const counts = {};
    for (const d of g.dinos) {
      if (!d.alive || !d.group) continue;
      counts[d.group] = (counts[d.group] || 0) + 1;
    }
    for (const d of g.dinos) {
      if (d.group) d.groupSize = counts[d.group] || 1;
      else d.groupSize = 1;
    }
  }

  function autoGroup(g) {
    for (const d of g.dinos) {
      if (!d.alive || d.player || d.group) continue;
      for (const o of g.dinos) {
        if (o === d || !o.alive || o.player || o.sp !== d.sp) continue;
        if (dist(d.x, d.y, o.x, o.y) > C.COMBAT.packRange) continue;
        d.group = o.group || (o.group = 'g' + o.id);

<script>
/* Primal Isle — game state shape, new game, and save rehydration.
 *
 * The island is not saved. The seed is, and world.build() puts the same island
 * back. Everything that changed during play — who is alive, how much of each
 * fern is left, and above all the account — is.
 */
(function (ISLE) {
  'use strict';
  const C = ISLE.content;
  const W = ISLE.world;
  const D = ISLE.dino;
  const M = ISLE.shop;
  const MU = ISLE.mutations;

  function startGame(spId, playerName, seed) {
    const g = {
      seed: seed || ((Math.random() * 1e9) | 0),
      clock: 0,
      day: 1,
      dinos: [],
      byId: {},
      carcasses: [],
      calls: [],
      feed: [],
      player: null,
      playerName: playerName || 'you',
      spawnAcc: 0,
      respawn: null,
      dead: false,
      acct: M.newAccount(),
      idle: ISLE.idle.newState(),
      draft: null,
      runPeak: 0,
      settings: { haptics: true, lefty: false, showRange: false },
      stats: { lives: 0, kills: 0, bestGrowth: 0, timeAlive: 0, timeTotal: 0, deathsBy: {} },
      ui: {}
    };
    g.world = W.build(g.seed);
    spawnPlayer(g, spId, C.HATCH_GROWTH);

    // Fill the lobby before the player draws their first breath, so the server
    // already has adults in it. It is never a level playing field.
    for (let i = 0; i < C.SERVER_CAP; i++) ISLE.ai.spawn(g);
    reindex(g);
    return g;
  }

  function spawnPlayer(g, spId, growth) {
    const at = W.spawnPoint(g.world);
    /* Banked mutations are the meta-progression: bought once on the Exchange,
     * present in every hatchling from then on. */
    const d = D.make({
      sp: spId, growth, x: at.x, y: at.y, player: true,
      name: g.playerName, clock: g.clock, skin: g.acct.skin,
      muts: (g.acct.mutBank || []).slice()
    });
    d.id = 'player';
    g.player = d;
    g.dinos.push(d);
    g.dead = false;
    g.respawn = null;
    g.stats.lives++;
    g.lifeStart = g.clock;
    g.runPeak = growth;
    g.draft = null;
    reindex(g);
    return d;
  }

  function reindex(g) {
    g.byId = {};
    for (const d of g.dinos) g.byId[d.id] = d;
  }

  /* Restore a save. Anything the save is missing is filled in rather than
   * refused — a half-finished account is still an account. */
  function hydrate(raw) {
    if (!raw) return null;
    try {
      const g = raw;
      g.world = W.build(g.seed);
      // Node amounts were saved flat; put them back on the regenerated nodes.
      if (g.nodeAmts && g.nodeAmts.length === g.world.nodes.length) {
        for (let i = 0; i < g.world.nodes.length; i++) g.world.nodes[i].amt = g.nodeAmts[i];
      }
      delete g.nodeAmts;
      g.dinos = g.dinos || [];
      g.carcasses = g.carcasses || [];
      g.calls = [];
      g.feed = g.feed || [];
      g.acct = Object.assign(M.newAccount(), g.acct || {});
      g.idle = Object.assign(ISLE.idle.newState(), g.idle || {});
      g.draft = g.draft || null;
      g.settings = Object.assign({ haptics: true, lefty: false, showRange: false }, g.settings || {});
      g.stats = Object.assign({ lives: 1, kills: 0, bestGrowth: 0, timeAlive: 0, timeTotal: 0, deathsBy: {} }, g.stats || {});
      g.ui = {};
      reindex(g);
      g.player = g.byId.player || null;
      // AI objects lose nothing in JSON except their live node references.
      for (const d of g.dinos) {
        if (d.ai) { d.ai.node = null; d.ai.car = null; }
        MU.recompute(d);
      }
      if (!g.player && !g.respawn) g.dead = true;
      return g;
    } catch (e) {
      console.warn('[isle] hydrate failed', e);
      return null;
    }
  }

  /* Flatten the parts of the world worth persisting before handing the state
   * to JSON. */
  function forSave(g) {
    const out = {};
    for (const k in g) {
      if (k === 'world' || k === 'byId' || k === 'player' || k === 'calls' || k === 'ui') continue;
      out[k] = g[k];
    }
    out.nodeAmts = g.world.nodes.map(n => Math.round(n.amt * 100) / 100);
    return out;
  }

  ISLE.state = { startGame, spawnPlayer, reindex, hydrate, forSave };
})(window.ISLE = window.ISLE || {});

<script>
/* Primal Isle — the world tick.
 *
 * One update, every frame, at real speed. There is no fast-forward: an action
 * game where you can skip the boring part with a button would have nothing
 * left to sell you.
 */
(function (ISLE) {
  'use strict';
  const C = ISLE.content;
  const W = ISLE.world;
  const D = ISLE.dino;
  const K = ISLE.combat;
  const A = ISLE.ai;
  const M = ISLE.shop;
  const MU = ISLE.mutations;
  const Idle = ISLE.idle;
  const { clamp, dist, chance } = ISLE.core;

  function feed(g, text, tone) {
    g.feed.unshift({ t: g.clock, text, tone: tone || 'info' });
    if (g.feed.length > 70) g.feed.length = 70;
  }

  // --- calls --------------------------------------------------------------
  function emitCall(g, d, type) {
    const def = C.CALLS[type];
    if (!def) return;
    g.calls.push({ x: d.x, y: d.y, r: def.range, t: 0, type, by: d.id, name: d.name, sp: d.sp });
    if (g.calls.length > 24) g.calls.shift();

    for (const o of g.dinos) {
      if (o === d || !o.alive || o.player || !o.ai) continue;
      const dd = dist(o.x, o.y, d.x, d.y);
      if (dd > def.range) continue;
      const carn = D.species(o).diet === 'carnivore';

      if (type === 'group' && o.sp === d.sp && !o.group && dd < C.CALLS.group.range) {
        o.group = d.group || (d.group = 'g' + d.id);
        continue;
      }
      // A distress call is a dinner bell for anything that fancies its chances.
      const interested = (type === 'distress' && carn) || (o.ai.kos && chance(0.5));
      if (interested && K.matchup(o, d) > o.ai.nerve * 0.9) {
        o.ai.state = 'wander';
        o.ai.gx = d.x; o.ai.gy = d.y;
        o.ai.think = 0.4;
      }
    }
  }

  function tickCalls(g, dt) {
    for (let i = g.calls.length - 1; i >= 0; i--) {
      g.calls[i].t += dt;
      if (g.calls[i].t > 2.2) g.calls.splice(i, 1);
    }
  }

  // --- player actions -----------------------------------------------------
  function playerBite(g) {
    const d = g.player;
    if (!d || !d.alive) return null;
    const res = K.bite(g, d);
    if (res && res.target) g.ui.hitFlash = 0.16;
    return res;
  }

  /* One button does the obvious thing, because a phone has no keyboard: eat
   * whatever is under you, or drink if you are standing in water. */
  function playerInteract(g, dt) {
    const d = g.player;
    if (!d || !d.alive) return null;
    const carn = D.species(d).diet === 'carnivore';

    const car = carn ? K.carcassNear(g, d.x, d.y, D.radius(d) + 34) : null;
    if (car) { const got = D.eatCarcass(g, d, car); return got ? { kind: 'meat', got } : null; }

    const near = W.nodesNear(g.world, d.x, d.y, D.radius(d) + 32, carn ? 'carnivore' : 'herbivore');
    if (near.length) {
      const n = near[0];
      const got = D.eatNode(g, d, n);
      return got ? { kind: W.nodeDef(n).name, got } : null;
    }

    const water = W.drinkableAt(g.world, d.x, d.y);
    if (water) {
      D.drink(g, d, dt);
      if (water === 'salt' && !g.ui.saltWarned) {
        g.ui.saltWarned = true;
        feed(g, 'Sea water. It goes down, and then it takes more than it gave.', 'bad');
      }
      return { kind: water === 'fresh' ? 'water' : 'salt water' };
    }
    return null;
  }

  /* What the interact button should say right now. */
  function interactHint(g) {
    const d = g.player;
    if (!d || !d.alive) return null;
    const carn = D.species(d).diet === 'carnivore';
    if (carn && K.carcassNear(g, d.x, d.y, D.radius(d) + 34)) return { icon: '🍖', label: 'Eat' };
    const near = W.nodesNear(g.world, d.x, d.y, D.radius(d) + 32, carn ? 'carnivore' : 'herbivore');
    if (near.length) return { icon: carn ? '🦎' : '🌿', label: 'Eat' };
    const water = W.drinkableAt(g.world, d.x, d.y);
    if (water === 'fresh') return { icon: '💧', label: 'Drink' };
    if (water === 'salt') return { icon: '🌊', label: 'Salt' };
    return null;
  }

  function playerCall(g, type) {
    const d = g.player;
    if (!d || !d.alive || d.callT > 0) return false;
    d.callT = C.CALLS[type].cd;
    emitCall(g, d, type);
    if (type === 'group') {
      let n = 0;
      for (const o of g.dinos) {
        if (o === d || !o.alive || o.sp !== d.sp) continue;
        if (dist(o.x, o.y, d.x, d.y) > C.CALLS.group.range) continue;
        o.group = d.group || (d.group = 'gplayer');
        n++;
      }
      feed(g, n ? `${n} joined your group.` : 'Nobody answered.', n ? 'good' : 'dim');
    }
    return true;
  }

  /* Take one of the three, and the other two are gone for this run. */
  function takeMutation(g, id) {
    if (!g.draft || g.draft.opts.indexOf(id) < 0) return false;
    const d = g.player;
    if (!d) return false;
    MU.take(d, id);
    MU.markTaken(d);
    M.onMutation(g, id);
    g.draft = null;
    d.hp = Math.min(D.maxHp(d), d.hp + D.maxHp(d) * 0.15);   // a milestone heals a little
    feed(g, `Mutation — ${MU.BY_ID[id].name}.`, 'great');
    return true;
  }

  /* Three bad offers is a real outcome, so there is a way to buy out of it. */
  function rerollDraft(g) {
    if (!g.draft || !g.player) return false;
    if (M.itemCount(g, 'reroll') <= 0) return false;
    g.acct.items.reroll--;
    g.draft = { at: g.draft.at, opts: MU.offer(g.player, g.draft.at).map(m => m.id), rerolls: g.draft.rerolls + 1 };
    return true;
  }

  // --- death and respawn ---------------------------------------------------
  function handleDeath(g) {
    const d = g.player;
    const killer = d.killer ? g.byId[d.killer] : null;
    g.dead = true;
    g.stats.timeAlive += g.clock - (g.lifeStart || 0);
    g.stats.bestGrowth = Math.max(g.stats.bestGrowth, d.growth);
    const cause = killer ? D.species(killer).name : (d.hunger <= 0 ? 'starvation' : d.thirst <= 0 ? 'thirst' : 'wounds');
    g.stats.deathsBy[cause] = (g.stats.deathsBy[cause] || 0) + 1;
    g.deathInfo = {
      growth: d.growth, sp: d.sp, killer: killer ? killer.name : null,
      killerSp: killer ? killer.sp : null, killerWhale: killer ? !!killer.whale : false,
      cause, lived: g.clock - (g.lifeStart || 0), kills: d.kills
    };
    M.onDeath(g);
    Idle.bankRun(g, g.runPeak || d.growth);
    g.runPeak = 0;
    g.respawn = { t: M.respawnSecs(g) };
    feed(g, `You died — ${D.label(d)} (${Math.round(d.growth * 100)}%). ${killer ? 'Killed by ' + killer.name + '.' : cause + '.'}`, 'bad');
  }

  /* Revive: an item you hold, or Dinollars on the spot. It is the most
   * valuable thing in the shop, because it is the only thing that undoes a
   * death — growth, mutations and all. */
  function revive(g, how) {
    const d = g.player;
    if (!d || !g.dead) return false;
    if (how === 'item') {
      if (M.itemCount(g, 'revive') <= 0) return false;
      g.acct.items.revive--;
      g.acct.revivesUsed++;
    } else if (how === 'dino') {
      if (!M.spend(g, ISLE.store.ITEMS.revive.cost, 'Revives')) return false;
      g.acct.revivesUsed++;
    } else return false;

    d.alive = true;
    d.hp = D.maxHp(d);
    d.hunger = Math.max(d.hunger, 55);
    d.thirst = Math.max(d.thirst, 55);
    D.clearWounds(d);
    d.buffs.armor = { v: 0.5, t: 6 };            // brief mercy window
    d.usedUndying = false;
    g.dead = false;
    g.respawn = null;
    g.runPeak = d.growth;
    g.acct.deathStreak = Math.max(0, g.acct.deathStreak - 1);
    feed(g, 'Revived where you fell, at full size, with every mutation intact.', 'buy');
    return true;
  }

  function respawnNow(g, spId) {
    const growth = M.spawnGrowth(g);
    const sp = spId || (g.player ? g.player.sp : 'fernback');
    // Drop the corpse from the roster before the new animal is added.
    g.dinos = g.dinos.filter(x => x !== g.player);
    ISLE.state.spawnPlayer(g, sp, growth);
    M.onSpawn(g);
    feed(g, `You hatch in ${W.regionName(g.world, g.player.x, g.player.y)}.`, 'info');
    return g.player;
  }

  /* Timers that must keep running even while the world is held still: the
   * respawn countdown ticks behind the death sheet, and deals expire whether
   * or not anyone is looking at them. */
  function tickTimers(g, dt) {
    if (g.respawn) g.respawn.t -= dt;
    M.tickDeals(g);
  }

  // --- the tick -----------------------------------------------------------
  function update(g, dt, input) {
    /* A draft stops the world. Choosing a mutation is a real decision and it
     * should not be taken with something walking up behind you — and on a
     * phone, a choice made under time pressure is a choice made badly. */
    if (g.draft) { Idle.tick(g, dt * M.exchangeMult(g)); return; }
    dt = Math.min(dt, 0.06);
    g.clock += dt;
    g.stats.timeTotal += dt;
    g.day = 1 + Math.floor(g.clock / C.DAY_LENGTH);

    Idle.tick(g, dt * M.exchangeMult(g));
    W.tickNodes(g.world, dt);
    K.tickCarcasses(g, dt);
    tickCalls(g, dt);

    A.maintain(g, dt);
    A.autoGroup(g);
    A.tickGroups(g);

    for (const d of g.dinos) {
      if (!d.alive) continue;
      if (d.player) {
        /* Normally the player steers. If the player's dinosaur has been given
         * a brain instead — which is how the balance harness plays both sides
         * of the shop — it runs on exactly the same code as the lobby. */
        if (input) D.steer(g, d, input, dt);
        else if (d.ai) { A.think(g, d, dt); A.act(g, d, dt); }
      } else {
        A.think(g, d, dt);
        A.act(g, d, dt);
      }
      D.tickNeeds(g, d, dt);
    }

    D.separate(g, g.dinos.filter(d => d.alive));

    /* Mutation milestones, and the run's high-water mark — the number that
     * banks specimens into the Exchange when this life ends. */
    if (g.player && g.player.alive) {
      g.runPeak = Math.max(g.runPeak || 0, g.player.growth);
      const mi = MU.pending(g.player);
      if (mi >= 0 && !g.draft) {
        g.draft = { at: mi, opts: MU.offer(g.player, mi).map(m => m.id), rerolls: 0 };
      }
    }

    // Reap the dead: bodies stay as carcasses, the roster does not.
    for (let i = g.dinos.length - 1; i >= 0; i--) {
      const d = g.dinos[i];
      if (d.alive) continue;
      if (d.player) { if (!g.dead) handleDeath(g); continue; }
      if (!d.reaped) { d.reaped = true; if (!d.killer) K.makeCarcass(g, d); }
      if (g.clock - (d.diedAt || g.clock) > 1.5) g.dinos.splice(i, 1);
    }
    ISLE.state.reindex(g);

    // Staying alive pays, slowly. It is the free player's only income.
    if (!g.dead && g.player && g.player.alive) {
      g.__surviveAcc = (g.__surviveAcc || 0) + dt;
      if (g.__surviveAcc >= 60) {
        g.__surviveAcc -= 60;
        M.addBones(g, ISLE.store.BONES_PER.survive60s);
        M.addXp(g, ISLE.store.XP_PER.survive60s);
      }
    }
  }

  /* The server list: everything alive, biggest first. The diamond next to a
   * name is not decoration — it is the third of the lobby with the shop
   * working for them. */
  function leaderboard(g, n) {
    return g.dinos
      .filter(d => d.alive)
      .sort((a, b) => b.growth - a.growth)
      .slice(0, n || 10)
      .map(d => ({
        name: d.name, sp: d.sp, growth: d.growth, whale: !!d.whale,
        you: !!d.player, kills: d.kills, label: D.label(d)
      }));
  }

  /* Everything close enough to matter, for the threat readout. */
  function threats(g) {
    const d = g.player;
    if (!d || !d.alive) return [];
    const out = [];
    for (const o of g.dinos) {
      if (o === d || !o.alive) continue;
      if (!D.canSee(g, d, o)) continue;
      const m = K.matchup(d, o);
      out.push({ d: o, dist: dist(d.x, d.y, o.x, o.y), edge: m });
    }
    return out.sort((a, b) => a.dist - b.dist).slice(0, 6);
  }

  ISLE.sim = {
    update, feed, emitCall, playerBite, playerInteract, interactHint, playerCall,
    handleDeath, revive, respawnNow, leaderboard, threats, takeMutation,
    rerollDraft, tickTimers
  };
})(window.ISLE = window.ISLE || {});

</script>
<script>
/* Primal Isle — the canvas.
 *
 * Top-down, procedural, no image assets. The island is baked once into a small
 * offscreen bitmap and scaled up (a phone has no budget for redrawing 17,000
 * terrain cells a frame); everything on top of it — foliage, animals, blood,
 * calls — is drawn live.
 */
(function (ISLE) {
  'use strict';
  const C = ISLE.content;
  const W = ISLE.world;
  const D = ISLE.dino;
  const S = ISLE.store;
  const { clamp, lerp, hash2, dist } = ISLE.core;

  let canvas = null, ctx = null, dpr = 1;
  let cssW = 380, cssH = 700;
  let cam = { x: 0, y: 0, z: 1 };
  let terrain = null, terrainSeed = -1;
  let t = 0;
  let shake = 0;

  const SHAPE = {
    velox: 'raptor', duskclaw: 'raptor', fernback: 'duck', gorehorn: 'horn',
    marshjaw: 'sail', tyrant: 'rex', ivory: 'long'
  };

  function attach(el) {
    canvas = el;
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  }

  function resize() {
    if (!canvas) return;
    const box = canvas.parentElement.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cssW = Math.max(280, box.width);
    cssH = Math.max(360, box.height);
    canvas.width = Math.floor(cssW * dpr);
    canvas.height = Math.floor(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
  }

  /* --- the island bitmap ------------------------------------------------ */
  const TPX = 4;                        // pixels per biome cell in the bake
  function bake(world) {
    const n = W.GN;
    const cv = document.createElement('canvas');
    cv.width = n * TPX; cv.height = n * TPX;
    const c = cv.getContext('2d');
    for (let gy = 0; gy < n; gy++) {
      for (let gx = 0; gx < n; gx++) {
        const b = C.BIOMES[W.biomeIdAt(world, gx * W.CELL + 1, gy * W.CELL + 1)];
        const j = (hash2(world.seed, gx, gy) - 0.5) * 16;
        c.fillStyle = shade(b.sand, j);
        c.fillRect(gx * TPX, gy * TPX, TPX, TPX);
      }
    }
    terrain = cv;
    terrainSeed = world.seed;
  }

  function shade(hex, delta) {
    const r = clamp(parseInt(hex.slice(1, 3), 16) + delta, 0, 255) | 0;
    const g = clamp(parseInt(hex.slice(3, 5), 16) + delta, 0, 255) | 0;
    const b = clamp(parseInt(hex.slice(5, 7), 16) + delta, 0, 255) | 0;
    return `rgb(${r},${g},${b})`;
  }

  // --- camera -------------------------------------------------------------
  function follow(g, dt) {
    const p = g.player;
    const target = p || { x: g.world.cx, y: g.world.cy, growth: 0.5 };
    // Grown animals see further. It feels like power and it is also mercy.
    const view = 620 + 620 * (target.growth || 0.2);
    const z = Math.min(cssH / view, cssW / (view * 0.62));
    cam.z = lerp(cam.z, z, Math.min(1, dt * 3));
    cam.x = lerp(cam.x, target.x, Math.min(1, dt * 7));
    cam.y = lerp(cam.y, target.y, Math.min(1, dt * 7));
  }

  const sx = x => (x - cam.x) * cam.z + cssW / 2;
  const sy = y => (y - cam.y) * cam.z + cssH / 2;
  function toWorld(px, py) {
    return { x: (px - cssW / 2) / cam.z + cam.x, y: (py - cssH / 2) / cam.z + cam.y };
  }

  // --- frame --------------------------------------------------------------
  function frame(g, dt) {
    if (!ctx) return;
    t += dt;
    if (terrainSeed !== g.world.seed) bake(g.world);
    follow(g, dt);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);

    if (shake > 0) {
      shake = Math.max(0, shake - dt * 2.6);
      ctx.save();
      ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);
    }

    drawTerrain(g);
    drawDetail(g);
    drawNodes(g);
    drawCarcasses(g);
    drawCalls(g);

    const list = g.dinos.filter(d => inView(d.x, d.y, 120));
    list.sort((a, b) => a.y - b.y);
    for (const d of list) drawDino(g, d);

    drawNight(g);
    drawOffscreenMarkers(g);

    if (shake > 0) ctx.restore();
    if (g.ui.hitFlash > 0) {
      g.ui.hitFlash -= dt;
      ctx.fillStyle = `rgba(255,90,80,${clamp(g.ui.hitFlash * 1.4, 0, 0.4)})`;
      ctx.fillRect(0, 0, cssW, cssH);
    }
  }

  function inView(x, y, pad) {
    const px = sx(x), py = sy(y);
    pad = pad || 60;
    return px > -pad && px < cssW + pad && py > -pad && py < cssH + pad;
  }

  function drawTerrain(g) {
    const size = W.GN * W.CELL;
    ctx.fillStyle = '#12293b';
    ctx.fillRect(0, 0, cssW, cssH);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(terrain, sx(0), sy(0), size * cam.z, size * cam.z);
  }

  /* Foliage and rocks, placed deterministically per detail cell so they never
   * swim about between frames. */
  const DET = 58;
  function drawDetail(g) {
    const w = g.world;
    const x0 = Math.floor((cam.x - cssW / 2 / cam.z) / DET) - 1;
    const x1 = Math.ceil((cam.x + cssW / 2 / cam.z) / DET) + 1;
    const y0 = Math.floor((cam.y - cssH / 2 / cam.z) / DET) - 1;
    const y1 = Math.ceil((cam.y + cssH / 2 / cam.z) / DET) + 1;
    const z = cam.z;

    for (let gy = y0; gy <= y1; gy++) {
      for (let gx = x0; gx <= x1; gx++) {
        const h = hash2(w.seed + 31, gx, gy);
        const wx = gx * DET + h * DET, wy = gy * DET + hash2(w.seed + 57, gx, gy) * DET;
        const bid = W.biomeIdAt(w, wx, wy);
        const px = sx(wx), py = sy(wy);

        if (bid === 'forest') {
          if (h > 0.34) tree(px, py, (10 + h * 9) * z, h);
        } else if (bid === 'plains') {
          if (h > 0.72) tuft(px, py, 7 * z, '#7d9450');
        } else if (bid === 'swamp') {
          if (h > 0.58) tuft(px, py, 8 * z, '#6a7a45');
        } else if (bid === 'highland') {
          if (h > 0.76) rock(px, py, (7 + h * 8) * z);
        } else if (bid === 'beach') {
          if (h > 0.93) rock(px, py, 4 * z);
        } else if (bid === 'river' || bid === 'lake' || bid === 'shallow') {
          if (h > 0.8) ripple(px, py, 9 * z, h);
        }
      }
    }
  }

  function tree(x, y, r, h) {
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(x + r * 0.25, y + r * 0.4, r * 0.9, r * 0.4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = h > 0.7 ? '#2f4a2a' : '#37552f';
    ctx.beginPath(); ctx.arc(x, y, r * 0.78, 0, 7); ctx.fill();
    ctx.fillStyle = h > 0.7 ? '#3d5c33' : '#456b3a';
    ctx.beginPath(); ctx.arc(x - r * 0.2, y - r * 0.22, r * 0.5, 0, 7); ctx.fill();
  }
  function tuft(x, y, r, col) {
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(1, r * 0.16); ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = -1; i <= 1; i++) {
      ctx.moveTo(x + i * r * 0.3, y);
      ctx.lineTo(x + i * r * 0.42, y - r * (0.7 + i * 0.1));
    }
    ctx.stroke();
  }
  function rock(x, y, r) {
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(x + r * 0.2, y + r * 0.3, r, r * 0.45, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#8d8d80';
    ctx.beginPath(); ctx.ellipse(x, y, r * 0.85, r * 0.62, 0.4, 0, 7); ctx.fill();
  }
  function ripple(x, y, r, h) {
    ctx.strokeStyle = 'rgba(255,255,255,0.13)';
    ctx.lineWidth = 1.2;
    const p = (t * 0.6 + h) % 1;
    ctx.beginPath(); ctx.ellipse(x, y, r * (0.4 + p), r * (0.18 + p * 0.4), 0, 0, 7); ctx.stroke();
  }

  function drawNodes(g) {
    for (const n of g.world.nodes) {
      if (n.amt < 0.25) continue;
      if (!inView(n.x, n.y, 30)) continue;
      const px = sx(n.x), py = sy(n.y), z = cam.z;
      if (n.kind === 'plant') {
        const def = C.PLANTS[n.type];
        ctx.fillStyle = def.color;
        const r = (5 + def.food * 0.09) * z;
        for (let i = 0; i < 3; i++) {
          const a = (i / 3) * 6.28 + n.seedv;
          ctx.beginPath();
          ctx.ellipse(px + Math.cos(a) * r * 0.5, py + Math.sin(a) * r * 0.35, r * 0.55, r * 0.3, a, 0, 7);
          ctx.fill();
        }
      } else {
        ctx.fillStyle = n.type === 'fish' ? '#8fb8c9' : n.type === 'egg' ? '#e8dfc6' : '#b58f5e';
        const wob = Math.sin(t * 3 + n.seedv) * 2 * z;
        ctx.beginPath();
        ctx.ellipse(px + wob, py, 4.2 * z, 2.8 * z, 0, 0, 7);
        ctx.fill();
      }
    }
  }

  function drawCarcasses(g) {
    for (const c of g.carcasses) {
      if (!inView(c.x, c.y, 60)) continue;
      const px = sx(c.x), py = sy(c.y), z = cam.z;
      const r = C.SPECIES[c.sp].size * C.sizeScale(c.growth) * z;
      const rot = clamp(c.age / C.CARCASS_ROT, 0, 1);
      ctx.fillStyle = `rgba(${lerp(120, 70, rot) | 0},${lerp(40, 60, rot) | 0},${lerp(40, 55, rot) | 0},0.92)`;
      ctx.beginPath(); ctx.ellipse(px, py, r * 1.1, r * 0.55, 0.4, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(230,220,210,0.5)'; ctx.lineWidth = Math.max(1, r * 0.1);
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(px - r * 0.6 + i * r * 0.5, py - r * 0.3);
        ctx.lineTo(px - r * 0.4 + i * r * 0.5, py + r * 0.3);
        ctx.stroke();
      }
      if (c.age < 6) {
        ctx.fillStyle = `rgba(150,20,20,${0.5 * (1 - c.age / 6)})`;
        ctx.beginPath(); ctx.arc(px, py, r * 1.8, 0, 7); ctx.fill();
      }
    }
  }

  function drawCalls(g) {
    for (const c of g.calls) {
      const p = c.t / 2.2;
      const r = c.r * p * cam.z;
      ctx.strokeStyle = c.type === 'distress' ? `rgba(255,120,110,${0.5 * (1 - p)})`
        : c.type === 'group' ? `rgba(140,220,160,${0.5 * (1 - p)})`
          : `rgba(230,220,180,${0.42 * (1 - p)})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(sx(c.x), sy(c.y), r, 0, 7); ctx.stroke();
    }
  }

  // --- animals ------------------------------------------------------------
  function drawDino(g, d) {
    const sp = D.species(d);
    const px = sx(d.x), py = sy(d.y);
    const r = D.radius(d) * cam.z;
    const step = Math.sin(t * (6 + d.speed * 0.06) + d.id.length) * clamp(d.speed / 60, 0, 1);
    const skin = d.skin ? S.SKINS[d.skin] : null;
    const body = skin ? mix(sp.color, skin.tint, 0.55) : sp.color;
    const dark = skin ? mix(sp.color2, skin.tint, 0.35) : sp.color2;

    ctx.save();
    ctx.translate(px, py);

    // Shadow first, on the ground plane.
    ctx.fillStyle = 'rgba(0,0,0,0.26)';
    ctx.beginPath(); ctx.ellipse(0, r * 0.34, r * 1.05, r * 0.42, 0, 0, 7); ctx.fill();

    ctx.rotate(d.ang);
    const shape = SHAPE[d.sp] || 'raptor';
    silhouette(shape, r, body, dark, step, d);
    ctx.restore();

    if (skin && skin.edge) {
      ctx.strokeStyle = skin.rarity === 'legendary' ? 'rgba(233,178,58,0.75)' : 'rgba(180,120,220,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py, r * 1.3, 0, 7); ctx.stroke();
    }

    drawTag(g, d, px, py, r);
  }

  function silhouette(shape, r, body, dark, step, d) {
    ctx.lineJoin = 'round';
    const legY = r * 0.62;

    // legs
    ctx.strokeStyle = dark;
    ctx.lineWidth = Math.max(1.4, r * 0.19);
    ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(-r * 0.15, s * legY * 0.5);
      ctx.lineTo(-r * 0.15 + step * r * 0.35 * s, s * legY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(r * 0.35, s * legY * 0.45);
      ctx.lineTo(r * 0.35 - step * r * 0.35 * s, s * legY * 0.92);
      ctx.stroke();
    }

    // tail
    ctx.strokeStyle = body;
    ctx.lineWidth = Math.max(1.6, r * 0.3);
    ctx.beginPath();
    ctx.moveTo(-r * 0.4, 0);
    const tl = shape === 'long' ? 2.4 : shape === 'raptor' ? 2.0 : 1.5;
    ctx.quadraticCurveTo(-r * tl * 0.7, step * r * 0.5, -r * tl, step * r * 0.9);
    ctx.stroke();

    // body
    ctx.fillStyle = body;
    ctx.beginPath();
    const bw = shape === 'horn' || shape === 'long' ? 1.15 : shape === 'rex' ? 1.05 : 0.95;
    ctx.ellipse(0, 0, r * bw, r * 0.62, 0, 0, 7);
    ctx.fill();

    // sail / frill / back ridge
    if (shape === 'sail') {
      ctx.fillStyle = dark;
      ctx.beginPath();
      ctx.moveTo(-r * 0.5, 0);
      ctx.quadraticCurveTo(0, -r * 1.35, r * 0.5, 0);
      ctx.closePath(); ctx.fill();
    } else if (shape === 'horn') {
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.ellipse(r * 0.72, 0, r * 0.5, r * 0.72, 0, 0, 7); ctx.fill();
    } else if (shape === 'raptor') {
      ctx.strokeStyle = dark; ctx.lineWidth = Math.max(1, r * 0.12);
      ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.1); ctx.lineTo(r * 0.5, -r * 0.1); ctx.stroke();
    }

    // neck + head
    const neck = shape === 'long' ? r * 1.7 : shape === 'sail' ? r * 1.25 : r * 1.0;
    ctx.strokeStyle = body;
    ctx.lineWidth = Math.max(1.4, r * (shape === 'long' ? 0.22 : 0.34));
    ctx.beginPath();
    ctx.moveTo(r * 0.5, 0);
    ctx.quadraticCurveTo(r * neck * 0.7, -step * r * 0.18, r * 0.35 + neck, -step * r * 0.25);
    ctx.stroke();

    const hx = r * 0.35 + neck, hy = -step * r * 0.25;
    const hr = r * (shape === 'rex' ? 0.55 : shape === 'long' ? 0.3 : 0.42);
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.ellipse(hx, hy, hr * 1.25, hr, 0, 0, 7); ctx.fill();

    // jaw, open while biting
    const biting = d.biteT > D.species(d).biteCd * 0.55;
    if (biting) {
      ctx.fillStyle = '#6a2020';
      ctx.beginPath();
      ctx.moveTo(hx + hr * 0.2, hy);
      ctx.lineTo(hx + hr * 2.0, hy - hr * 0.65);
      ctx.lineTo(hx + hr * 2.0, hy + hr * 0.65);
      ctx.closePath(); ctx.fill();
    }

    // eye
    ctx.fillStyle = '#101014';
    ctx.beginPath(); ctx.arc(hx + hr * 0.35, hy - hr * 0.35, Math.max(0.8, hr * 0.22), 0, 7); ctx.fill();

    if (shape === 'horn') {
      ctx.strokeStyle = '#e6dcc4'; ctx.lineWidth = Math.max(1, r * 0.11);
      ctx.beginPath(); ctx.moveTo(hx + hr * 0.6, hy - hr * 0.5); ctx.lineTo(hx + hr * 1.9, hy - hr * 1.1); ctx.stroke();
    }
  }

  function mix(a, b, k) {
    const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16));
    const pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
    return `rgb(${pa.map((v, i) => Math.round(lerp(v, pb[i], k))).join(',')})`;
  }

  /* The name tag is where the shop shows up in the world: gold for a
   * subscriber, a diamond for anyone spending. */
  function drawTag(g, d, px, py, r) {
    const me = g.player;
    if (!me) return;
    const near = dist(d.x, d.y, me.x, me.y) < D.vision(g, me) * 1.1 || d.player;
    if (!near) return;
    if (px < 34 || px > cssW - 34 || py < 24) return;    // tags do not hang off the edge

    const top = py - r * 1.5 - 10;
    const hpFrac = clamp(d.hp / D.maxHp(d), 0, 1);
    const wBar = Math.max(24, r * 2.2);

    if (!d.player) {
      ctx.fillStyle = 'rgba(0,0,0,0.42)';
      ctx.fillRect(px - wBar / 2, top, wBar, 3.5);
      ctx.fillStyle = hpFrac > 0.5 ? '#79c07a' : hpFrac > 0.22 ? '#d8b44a' : '#d8564a';
      ctx.fillRect(px - wBar / 2, top, wBar * hpFrac, 3.5);
    }

    const vip = d.whale || (d.player && ISLE.shop.clubActive(g));
    ctx.font = '600 10px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'center';
    const label = (vip ? '♦ ' : '') + d.name + '  ' + Math.round(d.growth * 100) + '%';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillText(label, px + 1, top - 4 + 1);
    ctx.fillStyle = d.player ? '#ffe9a8' : vip ? '#e8c257' : '#d6dced';
    ctx.fillText(label, px, top - 4);

    if (d.bleed) {
      ctx.fillStyle = '#c8392f';
      ctx.beginPath(); ctx.arc(px + wBar / 2 + 6, top + 2, 2.4, 0, 7); ctx.fill();
    }
  }

  /* Night. The hole in the dark is exactly this animal's vision, which is the
   * clearest possible statement of what night vision is worth. */
  function drawNight(g) {
    const day = W.daylight(g.clock);
    const dark = (1 - day) * 0.86;
    if (dark < 0.02) return;
    const p = g.player;
    const r = (p ? D.vision(g, p) : 500) * cam.z;
    const cx = p ? sx(p.x) : cssW / 2, cy = p ? sy(p.y) : cssH / 2;
    const grad = ctx.createRadialGradient(cx, cy, Math.min(r * 0.35, 240), cx, cy, Math.max(r, 60));
    grad.addColorStop(0, `rgba(6,10,26,${dark * 0.12})`);
    grad.addColorStop(0.6, `rgba(6,10,26,${dark * 0.6})`);
    grad.addColorStop(1, `rgba(4,7,18,${dark})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cssW, cssH);
  }

  /* Arrows at the screen edge for anything close and dangerous — a phone
   * screen is too small to find out the hard way. */
  function drawOffscreenMarkers(g) {
    const me = g.player;
    if (!me || !me.alive) return;
    for (const d of g.dinos) {
      if (d === me || !d.alive) continue;
      if (inView(d.x, d.y, -20)) continue;
      if (!D.canSee(g, me, d)) continue;
      const dd = dist(me.x, me.y, d.x, d.y);
      if (dd > 900) continue;
      const ang = Math.atan2(d.y - me.y, d.x - me.x);
      const m = 26;
      const rx = (cssW / 2 - m), ry = (cssH / 2 - m);
      const k = Math.min(rx / Math.abs(Math.cos(ang) || 1e-3), ry / Math.abs(Math.sin(ang) || 1e-3));
      const px = cssW / 2 + Math.cos(ang) * k, py = cssH / 2 + Math.sin(ang) * k;
      const danger = ISLE.combat.matchup(me, d) < 0.8;
      ctx.save();
      ctx.translate(px, py); ctx.rotate(ang);
      ctx.fillStyle = danger ? 'rgba(216,86,74,0.85)' : 'rgba(214,220,237,0.55)';
      ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, 5); ctx.lineTo(-5, -5); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  /* The minimap, drawn into whatever 2D context the UI hands over. Everything
   * the player has not paid to see is a rumour: only your own position, the
   * coastline and your group show up unless Scent Surge is running. */
  function minimap(g, mctx, w, h) {
    const world = C.WORLD;
    const k = Math.min(w, h) / world;
    mctx.clearRect(0, 0, w, h);
    mctx.fillStyle = '#0b1a26';
    mctx.fillRect(0, 0, w, h);
    if (terrain) {
      mctx.imageSmoothingEnabled = true;
      mctx.globalAlpha = 0.9;
      mctx.drawImage(terrain, 0, 0, world * k, world * k);
      mctx.globalAlpha = 1;
    }
    const p = g.player;
    const reveal = p && p.buffs.reveal;
    for (const d of g.dinos) {
      if (!d.alive || d.player) continue;
      const known = reveal || (p && d.group && d.group === p.group);
      if (!known) continue;
      mctx.fillStyle = d.whale ? '#e8c257' : '#ff8f7f';
      mctx.beginPath(); mctx.arc(d.x * k, d.y * k, 2 + d.growth * 2, 0, 7); mctx.fill();
    }
    if (p) {
      mctx.fillStyle = '#8fe3ff';
      mctx.beginPath(); mctx.arc(p.x * k, p.y * k, 3.4, 0, 7); mctx.fill();
      mctx.strokeStyle = 'rgba(143,227,255,0.7)';
      mctx.beginPath();
      mctx.moveTo(p.x * k, p.y * k);
      mctx.lineTo(p.x * k + Math.cos(p.ang) * 9, p.y * k + Math.sin(p.ang) * 9);
      mctx.stroke();
    }
  }

  function kick(v) { shake = Math.max(shake, v || 0.6); }

  ISLE.render = { attach, resize, frame, toWorld, minimap, kick, get cam() { return cam; } };
})(window.ISLE = window.ISLE || {});

</script>
<script>
/* Primal Isle — the interface.
 *
 * Built thumbs-first: a floating stick under the left thumb, actions under the
 * right, nothing important within 44px of a screen edge, and every panel a
 * full-screen sheet rather than a window. Keyboard is supported so the game is
 * playable at a desk, but the phone is the design target.
 *
 * Anything that opens a sheet stops the world. Being eaten while reading a
 * price list is not interesting, and on a phone a menu is not a moment of
 * spare attention.
 */
(function (ISLE) {
  'use strict';
  const C = ISLE.content;
  const S = ISLE.store;
  const W = ISLE.world;
  const D = ISLE.dino;
  const K = ISLE.combat;
  const M = ISLE.shop;
  const MU = ISLE.mutations;
  const Idle = ISLE.idle;
  const Sim = ISLE.sim;
  const { clamp, fmt, fmtSmall, clock } = ISLE.core;

  let G = null;
  let el = {};
  let mctx = null;
  let modalOpen = null;
  let storeTab = 'exchange';
  let speciesCb = null;
  let lastVitals = 0;
  let flashT = null;

  /* Rewriting a panel every tick detaches the node under the player's thumb
   * mid-tap. Each of these holds the last markup written, and the write is
   * skipped when nothing changed. */
  const painted = { vitals: '', wallet: '', threats: '', feed: '', place: '' };
  function paint(key, node, html) {
    if (painted[key] === html) return;
    painted[key] = html;
    node.innerHTML = html;
  }

  const input = { mx: 0, my: 0, sprint: false, interact: false };
  const stick = { on: false, id: null, ox: 0, oy: 0 };
  const held = {};

  const D$ = n => S.CUR.short + ' ' + fmt(n);
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function init(game) {
    G = game;
    el = {
      app: $('app'), stage: $('stage'), scene: $('scene'), hud: $('hud'),
      vitals: $('vitals'), wallet: $('wallet'), minimap: $('minimap'),
      place: $('place'), feed: $('feed'), threats: $('threats'),
      stick: $('stick'), knob: $('knob'), acts: $('acts'), offer: $('offerbtn'),
      modal: $('modal'), banner: $('banner')
    };
    mctx = el.minimap.getContext('2d');
    el.minimap.width = 132; el.minimap.height = 132;
    bindTouch();
    bindKeys();
    bindButtons();
  }

  function setGame(g) { G = g; }

  /* The world runs only when nothing is in front of it. */
  function paused() { return !!modalOpen || !!(G && G.draft); }

  // --- input --------------------------------------------------------------
  function bindTouch() {
    const stage = el.stage;
    stage.addEventListener('pointerdown', e => {
      if (paused()) return;
      const r = stage.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      const nearThumb = G.settings.lefty ? x > r.width * 0.55 : x < r.width * 0.55;
      if (nearThumb && y > r.height * 0.42 && !stick.on) {
        stick.on = true; stick.id = e.pointerId; stick.ox = x; stick.oy = y;
        el.stick.style.left = x + 'px'; el.stick.style.top = y + 'px';
        el.stick.classList.add('on');
        stage.setPointerCapture(e.pointerId);
        e.preventDefault();
      }
    }, { passive: false });

    stage.addEventListener('pointermove', e => {
      if (!stick.on || e.pointerId !== stick.id) return;
      const r = stage.getBoundingClientRect();
      const dx = (e.clientX - r.left) - stick.ox, dy = (e.clientY - r.top) - stick.oy;
      const len = Math.hypot(dx, dy);
      const max = 52;
      const k = len > max ? max / len : 1;
      el.knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
      const mag = Math.min(1, len / max);
      input.mx = len ? (dx / len) * mag : 0;
      input.my = len ? (dy / len) * mag : 0;
      e.preventDefault();
    }, { passive: false });

    const end = e => {
      if (!stick.on || e.pointerId !== stick.id) return;
      stick.on = false; stick.id = null;
      input.mx = input.my = 0;
      el.knob.style.transform = 'translate(0,0)';
      el.stick.classList.remove('on');
    };
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', end);

    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('contextmenu', e => { if (!modalOpen) e.preventDefault(); });
  }

  function bindKeys() {
    const map = { KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right' };
    window.addEventListener('keydown', e => {
      if (e.repeat) return;
      if (map[e.code]) { held[map[e.code]] = 1; e.preventDefault(); }
      else if (e.code === 'Space') { act('bite'); e.preventDefault(); }
      else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') input.sprint = true;
      else if (e.code === 'KeyE') input.interact = true;
      else if (e.code === 'KeyQ') act('call');
      else if (e.code === 'KeyM') openMap();
      else if (e.code === 'KeyB') openStore('exchange');
      else if (e.code === 'Escape') closeModal();
    });
    window.addEventListener('keyup', e => {
      if (map[e.code]) held[map[e.code]] = 0;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') input.sprint = false;
      if (e.code === 'KeyE') input.interact = false;
    });
  }

  function keyVector() {
    const x = (held.right ? 1 : 0) - (held.left ? 1 : 0);
    const y = (held.down ? 1 : 0) - (held.up ? 1 : 0);
    if (!x && !y) return null;
    const l = Math.hypot(x, y);
    return { x: x / l, y: y / l };
  }

  function bindButtons() {
    const hold = (id, fn) => {
      const b = $(id);
      b.addEventListener('pointerdown', e => { e.preventDefault(); fn(true); b.classList.add('down'); });
      const off = () => { fn(false); b.classList.remove('down'); };
      b.addEventListener('pointerup', off);
      b.addEventListener('pointerleave', off);
      b.addEventListener('pointercancel', off);
    };
    const tap = (id, fn) => $(id).addEventListener('pointerdown', e => { e.preventDefault(); fn(); });

    hold('b-sprint', on => { input.sprint = on; });
    hold('b-eat', on => { input.interact = on; });
    tap('b-bite', () => act('bite'));
    tap('b-call', () => act('call'));
    tap('b-use', () => openStore('items'));
    el.minimap.parentElement.addEventListener('pointerdown', e => { e.preventDefault(); openMap(); });
    el.wallet.addEventListener('pointerdown', e => {
      const t = e.target.closest('[data-open]');
      if (t) { e.preventDefault(); openStore(t.getAttribute('data-open')); }
    });
    el.offer.addEventListener('pointerdown', e => { e.preventDefault(); openStore('deals'); });
    el.modal.addEventListener('click', onModalClick);
  }

  function act(what) {
    if (paused() || !G.player || !G.player.alive) return;
    if (what === 'bite') {
      const res = Sim.playerBite(G);
      if (res && res.target) {
        haptic(res.killed ? 60 : 18);
        ISLE.render.kick(res.killed ? 0.9 : 0.35);
        if (res.ambushed) flash('Ambush!');
      } else haptic(6);
    } else if (what === 'call') {
      openCalls();
    }
  }

  function haptic(ms) {
    if (!G || !G.settings.haptics || !navigator.vibrate) return;
    try { navigator.vibrate(ms); } catch (e) { /* ignore */ }
  }

  // --- per-frame HUD ------------------------------------------------------
  function frame(g, dt) {
    G = g;
    const kv = keyVector();
    if (!stick.on) { input.mx = kv ? kv.x : 0; input.my = kv ? kv.y : 0; }

    if (input.interact && !paused() && g.player && g.player.alive) Sim.playerInteract(g, dt);

    lastVitals += dt;
    if (lastVitals > 0.1) {
      lastVitals = 0;
      drawVitals(g); drawWallet(g); drawThreats(g); drawFeed(g); updateActs(g);
      if (g.player) {
        const where = W.regionName(g.world, g.player.x, g.player.y) + ' · ' + W.phaseName(g.clock);
        if (painted.place !== where) { painted.place = where; el.place.textContent = where; }
      }
    }
    ISLE.render.minimap(g, mctx, 132, 132);
    drawDeal(g);

    if (g.draft && modalOpen !== 'draft') openDraft();
    /* `respawning` is the window between choosing to hatch again and choosing
     * what to hatch as: still dead, but the death sheet must not slam back
     * over the species picker. */
    if (g.dead && !g.ui.respawning && modalOpen !== 'death') openDeath();
    if (g.ui.popDeal && !modalOpen) { const id = g.ui.popDeal; g.ui.popDeal = null; openDealPopup(id); }
  }

  function bar(cls, v, max, label, extra) {
    const p = clamp(v / max, 0, 1) * 100;
    return `<div class="bar ${cls}${extra || ''}"><i style="width:${p}%"></i><b>${label}</b></div>`;
  }

  function drawVitals(g) {
    const d = g.player;
    if (!d) { paint('vitals', el.vitals, ''); return; }
    const sp = D.species(d);
    const growPct = Math.round(d.growth * 100);
    const stalled = d.growthStalled && d.growth < 1;
    const nextMile = MU.MILESTONES[d.mutMiles || 0];
    paint('vitals', el.vitals,
      `<div class="who"><b>${esc(sp.name)}</b><span>${D.label(d)} · ${growPct}%</span>
        ${M.clubActive(g) ? '<em class="vip">CLUB</em>' : ''}</div>
      <div class="bars">
        ${bar('grow', d.growth, 1, stalled ? '⚠ growth stalled'
          : (nextMile ? `Growth ${growPct}% → 🧬 ${Math.round(nextMile * 100)}%` : `Growth ${growPct}%`),
          stalled ? ' warn' : '')}
        ${bar('hp', d.hp, D.maxHp(d), 'HP')}
        ${bar('food', d.hunger, 100, 'Food')}
        ${bar('water', d.thirst, 100, 'Water')}
        ${bar('stam', d.stam, D.maxStam(d), 'Stam')}
      </div>
      <div class="wounds">
        ${(d.muts || []).map(id => `<span class="w mut ${MU.BY_ID[id].rarity}">${MU.BY_ID[id].icon}</span>`).join('')}
        ${d.bleed ? `<span class="w bleed">🩸 ×${d.bleed}</span>` : ''}
        ${d.bone ? '<span class="w bone">🦴 broken</span>' : ''}
        ${d.salt > 0 ? '<span class="w salt">🌊 salt</span>' : ''}
        ${d.protect > 0 ? `<span class="w buff">✨ unnoticed ${Math.ceil(d.protect)}s</span>` : ''}
        ${d.buffs.armor ? '<span class="w buff">🛡 plated</span>' : ''}
        ${d.buffs.reveal ? '<span class="w buff">👃 scent</span>' : ''}
        ${d.groupSize > 1 ? `<span class="w group">🤝 ×${d.groupSize}</span>` : ''}
      </div>`);
  }

  function drawWallet(g) {
    const a = g.acct;
    const rate = Idle.rate(g.idle) * M.exchangeMult(g);
    paint('wallet', el.wallet,
      `<button class="chip dino" data-open="exchange"><i>💵</i>${fmt(a.dino)}<em>+${fmtSmall(rate)}/s</em></button>
       <button class="chip bones" data-open="bones"><i>🦴</i>${fmt(a.bones)}</button>
       <button class="chip shop" data-open="items"><i>🎒</i></button>
       <button class="chip menu" data-open="menu"><i>☰</i></button>`);
  }

  function drawThreats(g) {
    const list = Sim.threats(g).filter(x => x.dist < 620);
    if (!list.length || !g.player) { paint('threats', el.threats, ''); return; }
    paint('threats', el.threats, list.slice(0, 4).map(x => {
      const cls = x.edge > 1.25 ? 'prey' : x.edge < 0.8 ? 'danger' : 'even';
      return `<div class="th ${cls}">${x.d.whale ? '♦' : ''}${esc(D.species(x.d).name)}
        <span>${Math.round(x.d.growth * 100)}%</span><em>${Math.round(x.dist)}m</em></div>`;
    }).join(''));
  }

  function drawFeed(g) {
    paint('feed', el.feed, g.feed.slice(0, 4).map(f =>
      `<div class="f ${f.tone}">${esc(f.text)}</div>`).join(''));
  }

  function drawDeal(g) {
    const o = g.acct.deals[0];
    if (!o) { el.offer.classList.remove('on'); return; }
    const def = S.DEALS[o.id];
    const left = Math.max(0, (o.until - Date.now()) / 1000);
    el.offer.classList.add('on');
    el.offer.innerHTML = `<b>${esc(def.name)}</b><span>${D$(def.cost)}</span><em>${clock(left)}</em>`;
  }

  function updateActs(g) {
    const hint = Sim.interactHint(g);
    const b = $('b-eat');
    b.querySelector('i').textContent = hint ? hint.icon : '🌿';
    b.classList.toggle('dim', !hint);
    const d = g.player;
    $('b-sprint').classList.toggle('dim', !d || d.stam < 5);
    $('b-bite').classList.toggle('dim', !d || !K.canBite(d));
    $('b-use').classList.toggle('has', Object.keys(g.acct.items).some(k => g.acct.items[k] > 0));
  }

  // --- modal plumbing -----------------------------------------------------
  function openModal(kind, html, opts) {
    opts = opts || {};
    modalOpen = kind;
    el.modal.className = 'on' + (opts.sheet ? ' sheet' : '') + (opts.locked ? ' locked' : '');
    el.modal.innerHTML = `<div class="scrim"${opts.locked ? '' : ' data-act="close"'}></div>
      <div class="dialog">${html}</div>`;
    input.mx = input.my = 0; input.sprint = false; input.interact = false;
    stick.on = false; el.stick.classList.remove('on');
  }
  function closeModal() {
    if (modalOpen === 'death' || modalOpen === 'draft') return;
    // Backing out of the picker hands you back to the death sheet.
    if (modalOpen === 'species' && G.dead) G.ui.respawning = false;
    forceClose();
  }
  function forceClose() { modalOpen = null; el.modal.className = ''; el.modal.innerHTML = ''; }

  function onModalClick(e) {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    e.preventDefault();
    handle(t.getAttribute('data-act'), t.getAttribute('data-v'));
  }

  function handle(a, v) {
    switch (a) {
      case 'close': closeModal(); break;
      case 'pick': { const cb = speciesCb; speciesCb = null; if (cb) cb(v); break; }
      case 'tab': storeTab = v; renderStore(); break;
      case 'store': openStore(v || 'exchange'); break;

      // the Exchange
      case 'dig': doDig(); break;
      case 'buygen': if (Idle.buyGen(G, v, 1)) { haptic(8); renderStore(); } else denied(); break;
      case 'buygenmax': {
        const n = Idle.maxAfford(G.idle, G.acct.dino, v);
        if (n > 0 && Idle.buyGen(G, v, n)) { haptic(14); renderStore(); } else denied();
        break;
      }
      case 'buyup': if (Idle.buyUpgrade(G, v)) { haptic(20); renderStore(); } else denied(); break;
      case 'prestige': confirmPrestige(); break;

      // the shop
      case 'buyitem': if (M.buyItem(G, v)) { haptic(20); renderStore(); } else denied(); break;
      case 'useitem': if (M.useItem(G, v)) { haptic(20); renderStore(); } else denied(); break;
      case 'buybone': if (M.buyBoneItem(G, v)) renderStore(); else denied(); break;
      case 'usebone': if (M.useBoneItem(G, v)) renderStore(); else denied(); break;
      case 'buyspecies': if (M.buySpecies(G, v)) { haptic(40); renderStore(); } else denied(); break;
      case 'shardspecies': if (M.buySpeciesWithShards(G, v)) renderStore(); else denied(); break;
      case 'crate': openCrate(parseInt(v, 10)); break;
      case 'buypass': if (M.buyPass(G)) renderStore(); else denied(); break;
      case 'skiptier': if (M.skipTier(G, 1)) renderStore(); else denied(); break;
      case 'claimpass': M.claimAll(G); renderStore(); break;
      case 'buyclub': if (M.buyClub(G)) renderStore(); else denied(); break;
      case 'buydeal': if (M.buyDeal(G, v)) { haptic(40); renderStore(); } else denied(); break;
      case 'bankmut': if (M.bankMutation(G, v)) { haptic(30); renderStore(); } else denied(); break;
      case 'unbankmut': M.unbankMutation(G, v); renderStore(); break;

      // the run
      case 'takemut': if (Sim.takeMutation(G, v)) { haptic(30); forceClose(); } break;
      case 'reroll': if (Sim.rerollDraft(G)) { haptic(12); openDraft(); } else denied(); break;
      case 'revive': if (Sim.revive(G, v)) { forceClose(); haptic(40); } else denied(); break;
      case 'respawn': doRespawn(); break;
      case 'map': openMap(); break;
      case 'call': Sim.playerCall(G, v); closeModal(); break;
      case 'setskin': G.acct.skin = v === 'none' ? null : v; if (G.player) G.player.skin = G.acct.skin; renderStore(); break;
      case 'toggle': G.settings[v] = !G.settings[v]; renderStore(); break;
      case 'export': doExport(); break;
      case 'import': doImport(); break;
      case 'wipe': doWipe(); break;
      case 'about': openAbout(); break;
    }
  }

  function denied() { haptic(8); flash('Not enough.'); }

  function flash(text) {
    el.banner.textContent = text;
    el.banner.classList.add('on');
    clearTimeout(flashT);
    flashT = setTimeout(() => el.banner.classList.remove('on'), 1400);
  }

  // --- the mutation draft ---------------------------------------------------
  /* The roguelike beat. Three offers, one kept, the world held still while you
   * decide — and everything you take dies with this animal. */
  function openDraft() {
    const dr = G.draft;
    if (!dr || !G.player) return;
    const cards = dr.opts.map(id => {
      const m = MU.BY_ID[id];
      return `<button class="mutcard ${m.rarity}" data-act="takemut" data-v="${id}">
        <div class="mrow"><i>${m.icon}</i><b>${esc(m.name)}</b><em>${MU.RARITY[m.rarity].name}</em></div>
        <p>${esc(m.desc)}</p></button>`;
    }).join('');
    const have = (G.player.muts || []).map(id =>
      `<span class="minimut ${MU.BY_ID[id].rarity}">${MU.BY_ID[id].icon} ${esc(MU.BY_ID[id].name)}</span>`).join('');
    const rerolls = M.itemCount(G, 'reroll');

    openModal('draft', `<div class="draft">
        <div class="dhead">🧬 MUTATION</div>
        <h2>${Math.round(G.player.growth * 100)}% — the isle offers</h2>
        <p class="dim small">Keep one. The other two are gone. All of it dies with you.</p>
        ${cards}
        ${have ? `<div class="carrying"><b>Carrying</b>${have}</div>` : ''}
        <button class="wide ghost small" data-act="reroll" ${rerolls ? '' : 'disabled'}>
          🎲 Reroll — Unstable Genome <em>${rerolls} held</em></button>
      </div>`, { locked: true, sheet: true });
  }

  // --- calls ---------------------------------------------------------------
  function openCalls() {
    const cd = G.player ? G.player.callT : 0;
    const rows = Object.values(C.CALLS).map(c =>
      `<button class="row call" data-act="call" data-v="${c.id}" ${cd > 0 ? 'disabled' : ''}>
        <i>${c.icon}</i><div><b>${c.name}</b><span>${esc(c.blurb)}</span></div></button>`).join('');
    openModal('calls', `<h2>Call</h2>${cd > 0 ? `<p class="dim">Recovering — ${cd.toFixed(1)}s</p>` : ''}${rows}
      <button class="wide ghost" data-act="close">Cancel</button>`, { sheet: true });
  }

  // --- map -----------------------------------------------------------------
  function openMap() {
    openModal('map', `<h2>The Isle</h2>
      <canvas id="bigmap" width="600" height="600"></canvas>
      <p class="dim small">You see your own position and your pack. Everything else is
      rumour unless you are running Scent Surge.</p>
      <div class="row2">
        <button class="wide" data-act="buyitem" data-v="surge">👃 Scent Surge · ${D$(S.ITEMS.surge.cost)}</button>
        <button class="wide ghost" data-act="close">Close</button>
      </div>`, { sheet: true });
    const c = $('bigmap').getContext('2d');
    const draw = () => {
      if (modalOpen !== 'map') return;
      ISLE.render.minimap(G, c, 600, 600);
      requestAnimationFrame(draw);
    };
    draw();
  }

  // --- death ---------------------------------------------------------------
  function openDeath() {
    const info = G.deathInfo || {};
    const a = G.acct;
    const canItem = M.itemCount(G, 'revive') > 0;
    const canPay = a.dino >= S.ITEMS.revive.cost;
    const lostPct = Math.round((info.growth || 0) * 100);
    const muts = (G.player && G.player.muts) || [];
    const specimens = Math.floor((info.growth || 0) * 10);

    openModal('death', `
      <div class="death">
        <h2>You died</h2>
        <p class="big">${lostPct}% growth and ${muts.length} mutation${muts.length === 1 ? '' : 's'} lost</p>
        <p class="dim">${info.killer
          ? `Killed by ${esc(info.killer)}${info.killerWhale ? ' <span class="vipdot">♦</span>' : ''} — ${esc(C.SPECIES[info.killerSp].name)}`
          : 'Cause: ' + esc(info.cause || 'wounds')}
          · survived ${clock(info.lived || 0)}${info.kills ? ' · ' + info.kills + ' kills' : ''}</p>

        <div class="banked">🦴 ${specimens} specimen${specimens === 1 ? '' : 's'} logged —
          the Exchange keeps those whatever happens out here.</div>

        <div class="revives">
          <button class="wide gold" data-act="revive" data-v="item" ${canItem ? '' : 'disabled'}>
            💗 Use Second Chance <em>${M.itemCount(G, 'revive')} held</em></button>
          <button class="wide gold" data-act="revive" data-v="dino" ${canPay ? '' : 'disabled'}>
            💗 Get up where you fell <em>${D$(S.ITEMS.revive.cost)}</em></button>
        </div>

        <div class="orfree">or hatch again, small and clean</div>
        <button class="wide ghost" id="respawnbtn" data-act="respawn">Respawn</button>
        <button class="wide ghost small" data-act="store" data-v="exchange">
          💵 Work the Exchange instead <em>${D$(a.dino)} · +${fmtSmall(Idle.rate(G.idle))}/s</em></button>
        <p class="tiny dim">Deaths: ${a.deaths} · streak ${a.deathStreak}${a.mutBank.length ? ' · banked: ' + a.mutBank.map(id => MU.BY_ID[id].name).join(', ') : ''}</p>
      </div>`, { locked: true });

    const tick = () => {
      if (modalOpen !== 'death') return;
      const b = $('respawnbtn');
      if (!b) return;
      const left = G.respawn ? Math.max(0, G.respawn.t) : 0;
      const ready = left <= 0.5 || M.itemCount(G, 'instant') > 0;
      b.textContent = ready ? 'Respawn' : `Respawn in ${Math.ceil(left)}s`;
      b.disabled = !ready;
      requestAnimationFrame(tick);
    };
    tick();
  }

  function doRespawn() {
    const left = G.respawn ? G.respawn.t : 0;
    if (left > 0.5) {
      if (M.itemCount(G, 'instant') > 0) G.acct.items.instant--;
      else return;
    }
    G.ui.respawning = true;
    forceClose();
    openSpeciesPick(sp => {
      G.ui.respawning = false;
      Sim.respawnNow(G, sp);
      forceClose();
    });
  }

  /* Species select doubles as the shop window for premium species: the locked
   * cards sit in the same list as the free ones, with their numbers showing. */
  function openSpeciesPick(cb, first) {
    const cards = Object.keys(C.SPECIES).map(id => {
      const sp = C.SPECIES[id];
      const open = M.unlocked(G, id);
      const price = S.SPECIES_PRICE[id];
      return `<button class="spcard ${open ? '' : 'locked'} ${sp.premium ? 'prem' : ''}"
          data-act="${open ? 'pick' : 'buyspecies'}" data-v="${id}">
        <div class="sphead"><b>${esc(sp.name)}</b><em>${esc(sp.tag)}</em></div>
        <div class="spstats">
          <span>❤ ${sp.hp}</span><span>🦷 ${sp.dmg}</span><span>💨 ${sp.spd}</span>
          <span>🌱 ${sp.growthRate.toFixed(2)}×</span><span>${sp.diet === 'carnivore' ? '🍖' : '🌿'}</span>
        </div>
        <p>${esc(sp.blurb)}</p>
        ${open ? '' : `<div class="lock">🔒 ${D$(price.cost)} · ${price.shards} shards${G.acct.shards >= price.shards ? ' <u data-act="shardspecies" data-v="' + id + '">use shards</u>' : ''}</div>`}
      </button>`;
    }).join('');

    speciesCb = cb;
    const bank = G.acct.mutBank.map(id =>
      `<span class="minimut ${MU.BY_ID[id].rarity}">${MU.BY_ID[id].icon} ${esc(MU.BY_ID[id].name)}</span>`).join('');
    openModal('species', `<h2>${first ? 'Choose your animal' : 'Hatch as'}</h2>
      <p class="dim small">Premium species are not sidegrades. Compare the numbers.</p>
      ${bank ? `<div class="carrying"><b>Starting with</b>${bank}</div>` : ''}
      <div class="spgrid">${cards}</div>
      ${first ? '' : '<button class="wide ghost" data-act="close">Back</button>'}`,
      { sheet: true, locked: !!first });
  }

  // --- the shop ------------------------------------------------------------
  function openStore(tab) {
    storeTab = tab || 'exchange';
    renderStore();
  }

  const TABS = [
    ['exchange', '💵 Exchange'], ['items', '💉 Items'], ['mutations', '🧬 Genome'],
    ['crates', '🎁 Crates'], ['pass', '🏅 Pass'], ['club', '👑 Club'],
    ['species', '🦖 Species'], ['deals', '⏳ Deals'], ['bones', '🦴 Bones'],
    ['ledger', '📒 Ledger'], ['menu', '☰ Menu']
  ];

  function renderStore() {
    const a = G.acct;
    const head = `<div class="shophead">
        <div class="bal"><span>💵 <b id="hbal">${fmt(a.dino)}</b></span><span>🦴 ${fmt(a.bones)}</span><span>💠 ${fmt(a.shards)}</span></div>
        <button class="x" data-act="close">✕</button>
      </div>
      <nav class="stabs">${TABS.map(([id, name]) =>
        `<button class="${storeTab === id ? 'on' : ''}" data-act="tab" data-v="${id}">${name}</button>`).join('')}</nav>`;
    const body = ({
      exchange: tabExchange, items: tabItems, mutations: tabMutations, crates: tabCrates,
      pass: tabPass, club: tabClub, species: tabSpecies, deals: tabDeals,
      bones: tabBones, ledger: tabLedger, menu: tabMenu
    }[storeTab] || tabExchange)();

    if (modalOpen === 'store') {
      el.modal.querySelector('.dialog').innerHTML = head + `<div class="sbody">${body}</div>`;
    } else {
      openModal('store', head + `<div class="sbody">${body}</div>`, { sheet: true });
    }
    if (storeTab === 'exchange') liveExchange();
    else liveBalance();
  }

  /* The balance keeps moving while a sheet is open, because the Exchange does
   * not stop for the shop. */
  function liveBalance() {
    const step = () => {
      if (modalOpen !== 'store') return;
      const b = $('hbal');
      if (b) b.textContent = fmt(G.acct.dino);
      requestAnimationFrame(step);
    };
    step();
  }

  // --- the Fossil Exchange --------------------------------------------------
  function tabExchange() {
    const s = G.idle;
    const rate = Idle.rate(s) * M.exchangeMult(G);
    const gain = Idle.prestigeGain(s);

    const gens = Idle.GENS.map((def, i) => {
      const n = Idle.owned(s, def.id);
      const prev = i > 0 ? Idle.owned(s, Idle.GENS[i - 1].id) : 1;
      if (!n && !prev) return '';                       // one rung at a time
      const cost = Idle.costOf(s, def.id, 1);
      const each = def.rate * Idle.milestoneMult(n) * Idle.globalMult(s);
      const nextMile = Idle.MILES.find(k => k > n);
      return `<div class="genrow ${G.acct.dino >= cost ? 'can' : ''}" data-gen="${def.id}">
        <i>${def.icon}</i>
        <div><b>${esc(def.name)} ${n ? `<em class="tag">×${n}</em>` : ''}</b>
          <span>${esc(def.blurb)}</span>
          <span class="sub">${fmtSmall(each)}/s each${nextMile ? ` · ×2 at ${nextMile}` : ''}</span></div>

    const ups = Idle.UPGRADES.filter(u => !s.ups[u.id]).slice(0, 3).map(u =>
      `<div class="row item"><i>⭐</i>
        <div><b>${esc(u.name)}</b><span>${esc(u.blurb)}</span></div>
        <button class="mini" data-act="buyup" data-v="${u.id}">${fmt(u.cost)}</button></div>`).join('');

    return `<div class="exchange">
        <div class="exhead">
          <div class="exbal" id="exbal">${fmt(G.acct.dino)}</div>
          <div class="exrate" id="exrate">+${fmtSmall(rate)} ${S.CUR.short}/s</div>
        </div>
        <button class="digbtn" data-act="dig">⛏<span>DIG</span><em>+${fmtSmall(Idle.tapPower(s))}</em></button>
        <p class="lead">Dinollars come from here and nowhere else — there is no
        payment screen in this game. The Exchange keeps running while you are out
        on the isle, and every run banks specimens into it whether you live or
        die.</p>
        <div class="exstat">
          <span>Specimens <b>${s.specimens}</b> → ×${Idle.specimenMult(s).toFixed(2)}</span>
          <span>Fossil points <b>${s.fp}</b> → ×${(1 + 0.05 * s.fp).toFixed(2)}</span>
          ${M.clubActive(G) ? '<span class="clubon">Club ×1.5</span>' : ''}
        </div>
        ${gens}
        ${ups ? '<h3>Upgrades</h3>' + ups : ''}
        <h3>Extinction event</h3>
        <div class="prestige">
          <p>Reset every generator and upgrade on the Exchange. Fossil points are
          kept, and each one is +5% forever.</p>
          ${gain > 0
            ? `<button class="wide gold" data-act="prestige">Reset for ${gain} fossil point${gain === 1 ? '' : 's'}</button>`
            : `<div class="dim small">Needs ${fmt(Idle.PRESTIGE_BASE)} lifetime Dinollars for the first point. Lifetime so far: ${fmt(s.total)}.</div>`}
        </div>
      </div>`;
  }

  function doDig() {
    const got = Idle.tap(G);
    haptic(4);
    const b = $('exbal');
    if (b) {
      b.textContent = fmt(G.acct.dino);
      b.classList.remove('pop');
      void b.offsetWidth;
      b.classList.add('pop');
    }
    floatUp('+' + fmtSmall(got));
  }

  function floatUp(text) {
    const btn = el.modal.querySelector('.digbtn');
    if (!btn) return;
    const s = document.createElement('span');
    s.className = 'floater';
    s.textContent = text;
    s.style.left = (30 + Math.random() * 40) + '%';
    btn.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }

  /* The Exchange screen updates its numbers without rebuilding its buttons, so
   * a tap never lands on a node that has just been replaced. */
  function liveExchange() {
    const step = () => {
      if (modalOpen !== 'store' || storeTab !== 'exchange') return;
      const b = $('exbal'), h = $('hbal'), r = $('exrate');
      if (b) b.textContent = fmt(G.acct.dino);
      if (h) h.textContent = fmt(G.acct.dino);
      if (r) r.textContent = '+' + fmtSmall(Idle.rate(G.idle) * M.exchangeMult(G)) + ' ' + S.CUR.short + '/s';
      for (const row of el.modal.querySelectorAll('.genrow')) {
        const id = row.getAttribute('data-gen');
        row.classList.toggle('can', G.acct.dino >= Idle.costOf(G.idle, id, 1));
      }
      requestAnimationFrame(step);
    };
    step();
  }

  function confirmPrestige() {
    const gain = Idle.prestigeGain(G.idle);
    openModal('prestige', `<h2>Extinction event</h2>
      <p>Every generator and upgrade on the Exchange goes, along with your
      Dinollar balance. You keep <b>${gain} fossil point${gain === 1 ? '' : 's'}</b>,
      everything the shop has already given you, and every specimen.</p>
      <button class="wide gold" id="prestigego">Do it</button>
      <button class="wide ghost" data-act="store" data-v="exchange">Not yet</button>`, { sheet: true });
    $('prestigego').addEventListener('click', () => {
      Idle.prestige(G);
      haptic(60);
      openStore('exchange');
    });
  }

  // --- shop tabs ------------------------------------------------------------
  function tabItems() {
    return `<p class="lead">Consumables, priced in Dinollars. The top two are the
      game: growth is health, damage and speed, and these sell it by the tap.</p>
      ${Object.values(S.ITEMS).map(it => {
        const n = M.itemCount(G, it.id);
        const usable = n > 0 && it.id !== 'revive' && it.id !== 'instant' && it.id !== 'reroll'
          && G.player && G.player.alive;
        return `<div class="row item">
          <i>${it.icon}</i>
          <div><b>${esc(it.name)}${n ? ` <em class="tag">×${n}</em>` : ''}</b><span>${esc(it.blurb)}</span></div>
          <div class="btns">
            ${usable ? `<button class="mini use" data-act="useitem" data-v="${it.id}">Use</button>` : ''}
            <button class="mini" data-act="buyitem" data-v="${it.id}">${fmt(it.cost)}</button>
          </div></div>`;
      }).join('')}
      <p class="fine">Second Chance is the most valuable thing on this page,
      because a death costs the whole run: the growth and every mutation on it.</p>`;
  }

  function tabMutations() {
    const a = G.acct;
    const run = (G.player && G.player.muts) || [];
    const seen = a.seenMuts || {};
    const bankable = MU.POOL.filter(m => seen[m.id] && (m.rarity === 'common' || m.rarity === 'uncommon'));

    return `<p class="lead">Mutations are drafted during a run and die with it.
      The bank is the exception: Dinollars buy a slot that is already filled when
      the next hatchling opens its eyes.</p>

      <h3>This run</h3>
      ${run.length ? run.map(id => mutRow(MU.BY_ID[id], '')).join('')
        : '<p class="dim small">Nothing yet. The first draft is at 12% growth.</p>'}

      <h3>Banked — ${a.mutBank.length}/${S.BANK.slots} slots</h3>
      ${a.mutBank.length ? a.mutBank.map(id =>
        mutRow(MU.BY_ID[id], `<button class="mini ghost" data-act="unbankmut" data-v="${id}">drop</button>`)).join('')
        : '<p class="dim small">Empty.</p>'}

      <h3>Bankable — ${D$(S.BANK.cost)} each</h3>
      <p class="dim small">Only mutations a run has actually shown you, and never
      the Rare or Apex ones — those have to be earned every time.</p>
      ${bankable.length ? bankable.map(m => mutRow(m,
        a.mutBank.indexOf(m.id) >= 0 ? '<u class="owned">banked</u>'
          : `<button class="mini" data-act="bankmut" data-v="${m.id}">${fmt(S.BANK.cost)}</button>`)).join('')
        : '<p class="dim small">Survive long enough to draft something first.</p>'}

      <h3>The pool</h3>
      <table class="odds">${MU.POOL.map(m =>
        `<tr class="${m.rarity === 'apex' ? 'legendary' : m.rarity === 'rare' ? 'epic' : m.rarity === 'uncommon' ? 'rare' : 'common'}">
          <td>${m.icon} ${esc(m.name)}</td><td>${MU.RARITY[m.rarity].name}</td></tr>`).join('')}</table>`;
  }

  function mutRow(m, right) {
    return `<div class="row mutrow ${m.rarity}">
      <i>${m.icon}</i>
      <div><b>${esc(m.name)} <em class="rar">${MU.RARITY[m.rarity].name}</em></b><span>${esc(m.desc)}</span></div>
      ${right || ''}</div>`;
  }

  function tabCrates() {
    const a = G.acct;
    const ev = Math.round(S.crateEV());
    const table = S.CRATE.table;
    const total = table.reduce((s, e) => s + e.w, 0);
    return `<p class="lead">${S.CRATE.name} — ${D$(S.CRATE.cost)}, or ten for ${fmt(S.CRATE.tenCost)}.</p>
      <div class="row2">
        <button class="wide gold" data-act="crate" data-v="1">Open 1 · ${fmt(S.CRATE.cost)}</button>
        <button class="wide gold" data-act="crate" data-v="10">Open 10 · ${fmt(S.CRATE.tenCost)}</button>
      </div>
      <div class="pity">Pity counter: <b>${a.crate.pity}/${S.CRATE.pity}</b> — a Legendary is guaranteed at ${S.CRATE.pity}.
        <span>${a.crate.pulls} opened</span></div>
      <h3>Full odds</h3>
      <table class="odds">${table.map(e => `<tr class="${e.rarity}">
        <td>${esc(e.name)}</td><td>${e.rarity}</td><td>${(e.w / total * 100).toFixed(2)}%</td></tr>`).join('')}</table>
      <p class="fine">Expected value of one pull: about <b>${fmt(ev)} ${S.CUR.short}</b> against a
      ${S.CRATE.cost} price. Printing that number is the difference between a

      <div class="drops">${rows}</div>
