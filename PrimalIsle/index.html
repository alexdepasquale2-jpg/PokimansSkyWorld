<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Primal Isle</title>
<meta name="description" content="A 2D one-thumb dinosaur survival roguelike, funded by an incremental game. Hatch, eat, grow, mutate, get eaten. Dinollars are dug, not bought.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <div id="stage">
    <canvas id="scene"></canvas>

    <div id="hud">
      <div id="hud-top">
        <div id="vitals"></div>
        <div id="hud-right">
          <div id="wallet"></div>
          <div id="mapwrap">
            <canvas id="minimap"></canvas>
            <div id="place"></div>
          </div>
        </div>
      </div>
      <div id="threats"></div>
      <div id="feed"></div>
      <button id="offerbtn"></button>
    </div>

    <div id="stick"><div id="knob"></div></div>

    <div id="acts">
      <button id="b-call" class="act small"><i>📣</i><u>Call</u></button>
      <button id="b-use" class="act small"><i>🎒</i><u>Items</u></button>
      <button id="b-eat" class="act"><i>🌿</i><u>Eat</u></button>
      <button id="b-sprint" class="act"><i>💨</i><u>Sprint</u></button>
      <button id="b-bite" class="act big"><i>🦷</i><u>Bite</u></button>
    </div>

    <div id="banner"></div>
  </div>

  <div id="modal"></div>
</div>

<script src="js/core.js"></script>
<script src="js/content.js"></script>
<script src="js/store.js"></script>
<script src="js/mutations.js"></script>
<script src="js/idle.js"></script>
<script src="js/world.js"></script>
<script src="js/shop.js"></script>
<script src="js/dino.js"></script>
<script src="js/combat.js"></script>
<script src="js/ai.js"></script>
<script src="js/state.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
