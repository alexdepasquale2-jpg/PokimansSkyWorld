  function buildingTier(g, id) { return (g.buildings && g.buildings[id]) | 0; }

  function roleCount(g, roleId) {
    if (!g.people) return 0;
    let n = 0;
    for (const p of g.people) if (p.role === roleId) n += (p.trait === 'quick' ? 1.5 : 1);
    return n;
  }

  /* The big one. Every multiplier in the game resolves through here. */
  function get(g, key) {
    let m = 1;
    const season = seasonOf(g), weather = weatherOf(g);

    // --- island features (permanent, from examining the ground)
    if (key === 'thirstDown' && g.effects.thirst) m *= 1.25;
    if (key === 'growth' && g.effects.growth) m *= 1.15;
    if (key === 'foodDown' && g.effects.granary) m *= 1.18;
    if (key === 'prayer' && g.effects.prayer) m *= 1.25;

    // --- neurons
    const n = g.neurons || {};
    if (key === 'yield' && n.husbandry) m *= 1.25;
    if (key === 'focus' && n.stamina) m *= 1.4;
    if (key === 'learn' && n.patience) m *= 1.3;
    if (key === 'forgetDown' && n.memory) m *= 2;
    if (key === 'herit' && n.lineage) m *= 1.5;
    if (key === 'life' && n.lineage) m *= 1.15;
    if (key === 'renown' && n.devotion) m *= 1.3;
    if (key === 'craft' && n.craftsman) m *= 1.6;
    if (key === 'insight' && n.sight) m *= 1.4;
    if (key === 'buildCostDown' && n.frontier) m *= 1.49;

    // --- the line's evolutions
    const evoKey = { yield: 'yield', insight: 'insight', renown: 'renown', work: 'speed', life: 'life' }[key];
    if (evoKey) m *= 1 + SW.lineage.bonus(g, evoKey);

    // --- season and weather
    if (key === 'growth') m *= season.growth * weather.growth;
    if (key === 'thirstUp') m *= season.thirst * weather.thirst;
    if (key === 'coin') m *= season.feed;
    if (key === 'faith') m *= season.faith * (weather.faith || 1);
    if (key === 'awe') m *= weather.awe || 1;
    if (key === 'prayer') m *= weather.prayer || 1;
    if (key === 'insight') m *= weather.insight || 1;
    if (key === 'listen') m *= weather.listen || 1;
    if (key === 'rotUp') m *= weather.rot || 1;
    if (key === 'vigor') m *= weather.vigor || 1;

    // --- buildings
    if (key === 'thirstDown') m *= 1 + buildingTier(g, 'well') * 0.12;
    if (key === 'foodDown') m *= 1 + buildingTier(g, 'granary') * 0.10;
    if (key === 'craft') m *= 1 + buildingTier(g, 'workshop') * 0.18;
    if (key === 'insight') m *= 1 + buildingTier(g, 'watchtower') * 0.10;
    if (key === 'careUp') m *= 1 + buildingTier(g, 'infirmary') * 0.34;
    if (key === 'trade') m *= 1 + buildingTier(g, 'dock') * 0.22;

    // --- villager roles
    if (key === 'buildCostDown') m *= 1 + roleCount(g, 'mason') * 0.05;
    if (key === 'careUp') m *= 1 + roleCount(g, 'herbalist') * 0.20;
    if (key === 'prayer') m *= 1 + roleCount(g, 'acolyte') * 0.08;
    if (key === 'faith') m *= 1 + roleCount(g, 'acolyte') * 0.05;
    if (key === 'coin') m *= 1 + roleCount(g, 'trader') * 0.06;
    if (key === 'trade') m *= 1 + roleCount(g, 'trader') * 0.10;

    // --- equipped relics
    if (g.equipped) {
      for (const id of g.equipped) {
        const r = C2.RELICS[id];
        if (!r) continue;
        if (r.effect === 'all') m *= 1 + r.power;
        else if (RELIC_KEY[r.effect] === key) m *= 1 + r.power;
      }
    }

    // --- title
    const t = titleOf(g);
    if (t.bonus) {
      if (t.bonus.all) m *= 1 + t.bonus.all;
      if (t.bonus[key] !== undefined) m *= 1 + t.bonus[key];
      if (key === 'buildCostDown' && t.bonus.buildCost) m *= 1 - t.bonus.buildCost;
    }

    // --- prestige boons, which outlive everything
    const b = (g.prestige && g.prestige.boons) || {};
    if (key === 'insight' && b.wideeye) m *= 1.33;
    if (key === 'yield' && b.greenthumb) m *= 1.25;
    if (key === 'renown' && b.standing) m *= 1.4;

    return m;
  }

  /* Thirst and food are "lower is better", so they get their own reducers. */
  const thirst = g => get(g, 'thirstUp') / get(g, 'thirstDown');
  const foodUse = g => 1 / get(g, 'foodDown');
  const forget = g => 1 / get(g, 'forgetDown');
  const buildCost = g => 1 / get(g, 'buildCostDown');
  const unrest = g => 1 / get(g, 'unrestDown');

  SW.boost = { get, seasonOf, weatherOf, titleOf, buildingTier, roleCount, thirst, foodUse, forget, buildCost, unrest };
})(window.SW = window.SW || {});

<script>
/* Skyward Reach — weather, soil, villagers, buildings and island events.
 * The layer between the sky and the ground.
 */
(function (SW) {
  'use strict';
  const C = SW.content, C2 = SW.content2;
  const { clamp, rnd, rndInt, pick, chance, fmt, hashNoise } = SW.core;

  /* ----------------------------------------------------------- 1. weather */
  function rollWeather(g) {
    // The Still suppresses violent weather; auroral nights are rarer early.
    const season = SW.boost.seasonOf(g);
    let total = 0;
    const opts = C2.WEATHER_LIST.map(w => {
      let wt = w.weight;
      if (season.id === 'still' && (w.id === 'swelter' || w.id === 'drought')) wt *= 0.2;
      if (season.id === 'high' && (w.id === 'drought' || w.id === 'swelter')) wt *= 2.2;
      if (season.id === 'greening' && w.id === 'downpour') wt *= 1.8;
      if (w.id === 'auroral' && g.day < 12) wt *= 0.25;
      total += wt;
      return { w, wt };
    });
    let r = Math.random() * total;
    for (const o of opts) { r -= o.wt; if (r <= 0) return o.w.id; }
    return 'clear';
  }

  function advanceWeather(g) {
    if (!g.weather) g.weather = { today: 'clear', tomorrow: rollWeather(g) };
    g.weather.today = g.weather.tomorrow;
    g.weather.tomorrow = rollWeather(g);
    const w = C2.WEATHER[g.weather.today];
    // Downpour fills every plot; a gale rips at ripe ones.
    if (w.water) for (const p of g.plots) if (p.crop) p.water = 100;
    SW.ui.log(g, `${w.glyph} ${w.name}. ${w.blurb}`, w.id === 'auroral' ? 'great' : 'info');
    if (w.mood) g.creature.mood = clamp(g.creature.mood + w.mood, 0, 100);
  }

  function seasonProgress(g) {
    return ((g.day - 1) % C2.SEASON_LEN) / C2.SEASON_LEN;
  }
  function daysToSeasonEnd(g) {
    return C2.SEASON_LEN - ((g.day - 1) % C2.SEASON_LEN);
  }

  /* -------------------------------------------------------------- 2. soil */
  function soilOf(p) { return p.soil === undefined ? 100 : clamp(p.soil, 0, C2.SOIL.max); }

  function soilYield(g, p) {
    let m = C2.SOIL.yieldAt(soilOf(p));
    if (p.rotated) m += C2.SOIL.rotationBonus;
    return m;
  }

  function fertilise(g, p, id) {
    const f = C2.FERTILISERS[id];
    if (!f) return false;
    if (soilOf(p) >= C2.SOIL.max - 1) { SW.ui.log(g, 'That ground is already as rich as it gets.', 'warn'); return false; }
    const cost = f.cost;
    if (cost.food && g.village.food < cost.food) return fail(g, 'Not enough food in the granary.');
    // A kiln burns the ash for you, so it costs less wood.
    const woodCost = id === 'ash' ? Math.ceil(cost.wood * (1 - SW.boost.buildingTier(g, 'kiln') * 0.22)) : cost.wood;
    if (cost.wood && g.res.wood < woodCost) return fail(g, 'Not enough wood.');
    if (cost.mats) for (const k in cost.mats) if ((g.mats[k] | 0) < cost.mats[k]) return fail(g, `Not enough ${C.MATERIALS[k].name.toLowerCase()}.`);
    if (cost.food) g.village.food -= cost.food;
    if (cost.wood) g.res.wood -= woodCost;
    if (cost.mats) for (const k in cost.mats) g.mats[k] -= cost.mats[k];
    p.soil = clamp(soilOf(p) + f.soil, 0, C2.SOIL.max);
    SW.ui.log(g, `${f.glyph} ${f.name} worked into plot ${p.i + 1}. Soil at ${Math.round(p.soil)}%.`, 'good');
    return true;
  }

  function fail(g, msg) { SW.ui.log(g, msg, 'warn'); return false; }

  function tickSoil(g, dt) {
    for (const p of g.plots) {
      if (p.soil === undefined) p.soil = 100;
      // Ground left empty comes back on its own; a granary means there is
      // waste to turn back into it, so it recovers everywhere.
      const idle = (p.state === 'raw' || p.state === 'tilled') ? 1 : 0.22;
      const rate = C2.SOIL.fallowRecovery * idle * (1 + SW.boost.buildingTier(g, 'granary') * 0.35);
      p.soil = clamp(p.soil + rate * dt, 0, C2.SOIL.max);
    }
  }

  /* --------------------------------------------------- 3. named villagers */
  function makePerson(g) {
    const used = new Set((g.people || []).map(p => p.name));
    const pool = C2.VILLAGER_NAMES.filter(n => !used.has(n));
    const name = pool.length ? pick(pool) : 'Newcomer ' + ((g.people || []).length + 1);
    const trait = chance(0.45) ? pick(C2.VILLAGER_TRAITS).id : null;
    return { name, role: 'idle', trait, mood: 60, since: g.day };
  }

  /* Keep the named roster in step with the headcount the village sim tracks. */
  function syncPeople(g) {
    if (!g.people) g.people = [];
    while (g.people.length < g.village.villagers) g.people.push(makePerson(g));
    while (g.people.length > g.village.villagers) {
      // whoever is unhappiest leaves first
      let worst = 0;
      for (let i = 1; i < g.people.length; i++) if (g.people[i].mood < g.people[worst].mood) worst = i;
      g.people.splice(worst, 1);
    }
  }

  function assign(g, name, role) {
    const p = g.people.find(x => x.name === name);
    if (!p) return false;
    p.role = role;
    return true;
  }

  function tickPeople(g, dt) {
    if (!g.people) return;
    const v = g.village;
    for (const p of g.people) {
      const target = clamp(v.faith * 0.7 + 30 - v.unrest * 0.5 + (p.trait === 'sour' ? -15 : 0), 0, 100);
      p.mood += (target - p.mood) * 0.004 * dt;
    }
    // Farmhands quietly water things; scouts turn up materials; the clever
    // occasionally work something out.
    const hands = SW.boost.roleCount(g, 'farmhand');
    if (hands > 0 && chance(0.012 * hands * dt)) {
      const dry = SW.farm.thirstiest(g);
      if (dry) { SW.farm.water(g, dry); }
    }
    const scouts = SW.boost.roleCount(g, 'scout');
    if (scouts > 0 && chance(0.006 * scouts * dt)) {
      const m = pick(['fibre', 'clay']);
      g.mats[m] = (g.mats[m] | 0) + 1;
    }
    const clever = g.people.filter(p => p.trait === 'clever').length;
    if (clever > 0 && chance(0.0018 * clever * dt)) g.insight += 1;
  }

  const extraEaters = g => (g.people || []).filter(p => p.trait === 'hungry').length;
  const devoutBonus = g => (g.people || []).filter(p => p.trait === 'devout').length * 0.04;

  /* --------------------------------------------------------- 4. buildings */
  function buildingCost(g, id) {
    const b = C2.BUILDINGS[id];
    const tier = SW.boost.buildingTier(g, id);
    const scale = Math.pow(2.6, tier);
    const off = SW.boost.buildCost(g);
    const mats = {};
    for (const k in b.mats) mats[k] = Math.ceil(b.mats[k] * (tier + 1));
    return {
      wood: Math.ceil(b.wood * scale * off),
      coin: Math.ceil(b.coin * scale * off),
      mats: mats,
      tier: tier + 1
    };
  }

  function canBuild(g, id) {
    const b = C2.BUILDINGS[id];
    if (!b) return 'no such building';
    if (SW.boost.buildingTier(g, id) >= b.tiers) return 'already at its final tier';
    if ((b.ring || 0) > (g.ring | 0)) return `needs ${C.RINGS[b.ring].name}`;
    return null;
  }

  function build(g, id) {
    const why = canBuild(g, id);
    if (why) return fail(g, 'You cannot build that — ' + why + '.');
    const b = C2.BUILDINGS[id];
    const cost = buildingCost(g, id);
    if (g.res.wood < cost.wood || g.res.coin < cost.coin) return fail(g, 'Not enough wood and coin.');
    for (const k in cost.mats) if ((g.mats[k] | 0) < cost.mats[k]) return fail(g, `Not enough ${C.MATERIALS[k].name.toLowerCase()}.`);
    g.res.wood -= cost.wood; g.res.coin -= cost.coin;
    for (const k in cost.mats) g.mats[k] -= cost.mats[k];
    g.buildings[id] = cost.tier;
    SW.discovery.firstTime(g, 'built:' + id, 4, `raising a ${b.name.toLowerCase()}`);
    SW.ui.log(g, `${b.glyph} ${b.name} ${cost.tier > 1 ? 'improved to tier ' + cost.tier : 'built'}. ${b.blurb}`, 'great');
    return true;
  }

  /* The watchtower gradually reveals the ground you have not walked. */
  function tickWatchtower(g, dt) {
    const tier = SW.boost.buildingTier(g, 'watchtower');
    if (!tier) return;
    if (!chance(0.0012 * tier * dt)) return;
    const hidden = g.features.filter(f => !f.found && f.ring <= g.ring);
    if (!hidden.length) return;
    const inst = pick(hidden);
    const def = C.FEATURES.find(f => f.id === inst.fid);
    SW.ui.log(g, `From the watchtower you make out ${def.name} out on the ${C.RINGS[inst.ring].name.toLowerCase()}.`, 'info');
    inst.marked = true;
  }

  /* ------------------------------------------------------------ 5. events */
  function maybeEvent(g) {
    if (g.event) return;
    const pool = C2.EVENTS.filter(e => g.day >= (e.min || 0) && !(g.eventSeen && g.eventSeen[e.id] && chance(0.6)));
    if (!pool.length) return;
    let total = 0;
    for (const e of pool) total += e.weight;
    let r = Math.random() * total;
    for (const e of pool) { r -= e.weight; if (r <= 0) { g.event = { id: e.id, day: g.day }; return; } }
  }

  function eventDef(g) {
    return g.event ? C2.EVENTS.find(e => e.id === g.event.id) : null;
  }

  function resolveEvent(g, choiceIndex) {
    const def = eventDef(g);
    if (!def) return false;
    const ch = def.choices[choiceIndex];
    if (!ch) return false;
    applyEffect(g, ch.effect || {});
    if (!g.eventSeen) g.eventSeen = {};
    g.eventSeen[def.id] = g.day;
    g.eventLog.unshift({ day: g.day, title: def.title, choice: ch.label, note: ch.note });
    if (g.eventLog.length > 40) g.eventLog.length = 40;
    SW.ui.log(g, `${def.title} — ${ch.label}. ${ch.note}`, 'great');
    g.event = null;
    return true;
  }

  function applyEffect(g, e) {
    const v = g.village, c = g.creature;
    if (e.villagers) { v.villagers = Math.max(0, v.villagers + e.villagers); syncPeople(g); }
    if (e.food) v.food = Math.max(0, v.food + e.food);
    if (e.faith) v.faith = clamp(v.faith + e.faith, 0, 100);
    if (e.awe) v.awe = clamp(v.awe + e.awe, 0, 100);
    if (e.unrest) v.unrest = clamp(v.unrest + e.unrest, 0, 100);
    if (e.wood) g.res.wood = Math.max(0, g.res.wood + e.wood);
    if (e.prayer) g.res.prayer = Math.max(0, g.res.prayer + e.prayer);
    if (e.insight) g.insight += e.insight;
    if (e.renown) g.res.renown = Math.max(0, g.res.renown + e.renown);
    // Scaled by the day rather than by what you already have: a percentage of
    // a late-game total is an absurd swing from a single click.
    if (e.renownMul) g.res.renown = Math.max(0, g.res.renown + e.renownMul * (400 + g.day * 40));
    if (e.coinMul) g.res.coin = Math.max(0, g.res.coin + e.coinMul * (2000 + g.day * 500));
    if (e.bond) c.bond = clamp(c.bond + e.bond, 0, 100);
    if (e.mood) c.mood = clamp(c.mood + e.mood, 0, 100);
    if (e.hunger) c.hunger = clamp(c.hunger + e.hunger, 0, 130);
    if (e.kind) c.kind = clamp(c.kind + e.kind, -100, 100);
    if (e.vigorCost) c.vigor = clamp(c.vigor - e.vigorCost, 0, 100);
    if (e.mats) for (const k in e.mats) g.mats[k] = (g.mats[k] | 0) + e.mats[k];
    if (e.seedsAll) for (const cr of C.CROP_LIST) g.seeds[cr.id] = (g.seeds[cr.id] | 0) + e.seedsAll;
    if (e.soilAll) for (const p of g.plots) p.soil = clamp(soilOf(p) + e.soilAll, 0, C2.SOIL.max);
    if (e.waterAll) for (const p of g.plots) p.water = clamp(p.water + e.waterAll, 0, 100);
    if (e.burnPlots) {
      let n = e.burnPlots;
      for (const p of g.plots) { if (n <= 0) break; if (p.crop) { p.state = 'tilled'; p.crop = null; p.growth = 0; n--; } }
    }
    if (e.techReps) SW.beast.trainTechnique(g, e.techReps, 8);
    if (e.relicRoll) SW.relics.grant(g);
    if (e.diplo) for (const r of g.rivals) g.diplo[r.name] = clamp((g.diplo[r.name] || 0) + e.diplo, -100, 100);
    if (e.mate) g.mateOffer = SW.beast.rollMate(g);
    if (e.arena) g.arenaChallenge = true;
    if (e.grandeurTemp) g.grandeurBonus = (g.grandeurBonus || 0) + 12;
  }

  /* ------------------------------------------------------------- 6. oaths */
  function counterValue(g, kind) {
    switch (kind) {
      case 'harvests': return g.stats.harvests;
      case 'sold': return g.stats.sold;
      case 'praised': return g.creature.praised + (g.stats.praisedTotal || 0);
      case 'crafted': return Object.values(g.crafted).reduce((a, b) => a + b, 0);
      case 'found': return Object.keys(g.discovered).length;
      case 'fished': return g.stats.fished || 0;
      case 'chores': return g.creature.chores + (g.stats.choresTotal || 0);
      default: return 0;
    }
  }

  function rollOaths(g) {
    g.oaths = [];
    const pool = [...C2.OATH_TEMPLATES];
    for (let i = 0; i < 3 && pool.length; i++) {
      const t = pool.splice(rndInt(0, pool.length - 1), 1)[0];
      const need = Math.max(1, Math.round(t.base + t.scale * g.day));
      g.oaths.push({
        id: t.id, kind: t.kind, need,
        from: counterValue(g, t.kind),
        name: t.name.replace('{n}', need),
        renown: Math.round(t.renown * (1 + g.day * 0.04)),
        insight: t.insight, done: false
      });
    }
    g.oathDay = g.day;
  }

  function oathProgress(g, o) {
    return clamp((counterValue(g, o.kind) - o.from) / o.need, 0, 1);
  }

  function checkOaths(g) {
    if (!g.oaths) return;
    for (const o of g.oaths) {
      if (o.done) continue;
      if (oathProgress(g, o) >= 1) {
        o.done = true;
        g.res.renown += o.renown;
        g.insight += o.insight;
        SW.ui.log(g, `Oath kept — ${o.name}. +${o.renown} renown, +${o.insight} insight.`, 'great');
      }
    }
  }

  /* ------------------------------------------------------------- 7. tick  */
  function tick(g, dt) {
    tickSoil(g, dt);
    tickPeople(g, dt);
    tickWatchtower(g, dt);
    checkOaths(g);
  }

  function newDay(g) {
    advanceWeather(g);
    syncPeople(g);
    if (!g.oathDay || g.day - g.oathDay >= 3) rollOaths(g);
    if (chance(0.16)) maybeEvent(g);
    if (g.grandeurBonus) g.grandeurBonus = Math.max(0, g.grandeurBonus - 0.4);
  }

  SW.world = {
    rollWeather, advanceWeather, seasonProgress, daysToSeasonEnd,
    soilOf, soilYield, fertilise, tickSoil,
    makePerson, syncPeople, assign, extraEaters, devoutBonus,
    buildingCost, canBuild, build,
    maybeEvent, eventDef, resolveEvent, applyEffect,
    rollOaths, oathProgress, checkOaths, counterValue,
    tick, newDay
  };
})(window.SW = window.SW || {});

</script>
<script>
/* Skyward Reach — the creature beyond training: illness, techniques,
 * bloodlines, and the Trial Ring. */
(function (SW) {
  'use strict';
  const C = SW.content, C2 = SW.content2;
  const { clamp, rnd, rndInt, pick, chance, fmt, hashNoise } = SW.core;

  const fail = (g, m) => { SW.ui.log(g, m, 'warn'); return false; };

  /* --------------------------------------------------------- 1. illness  */
  /* Each ailment has a cause you can actually see coming, which is the point:
   * a creature that gets sick is a creature you mismanaged. */
  function illnessRisk(g, id) {
    const c = g.creature, w = SW.boost.weatherOf(g);
    const care = SW.boost.get(g, 'careUp');
    let r = 0;
    switch (id) {
      case 'bloat':    r = c.hunger > 118 ? 0.0016 : 0; break;
      case 'rotlung':  r = (w.id === 'downpour' || w.id === 'mist') ? 0.0009 : 0.0001; break;
      case 'sunsick':  r = (w.id === 'swelter' || w.id === 'drought') ? 0.0011 : 0.0001; break;
      case 'lameness': r = c.vigor < 12 ? 0.0014 : 0; break;
      case 'despair':  r = (c.mood < 18 && c.scolded > c.praised) ? 0.0013 : 0; break;
    }
    return r / care;
  }

  function tickIllness(g, dt) {
    const c = g.creature;
    if (c.ailment) {
      const a = C2.AILMENTS[c.ailment];
      c.ailDays = (c.ailDays || 0) + dt / C.TICKS_PER_DAY;
      c.vigor = clamp(c.vigor + a.vigor * dt * 0.1, 0, 100);
      c.mood = clamp(c.mood + a.mood * dt * 0.1, 0, 100);
      // It shakes some off on its own, faster with a beast house and a herbalist.
      const selfHeal = 0.0008 * SW.boost.get(g, 'careUp') * dt;
      if (chance(selfHeal)) {
        SW.ui.log(g, `${c.name} has thrown off the ${a.name.toLowerCase()}.`, 'good');
        c.ailment = null; c.ailDays = 0;
      }
      return;
    }
    for (const id in C2.AILMENTS) {
      if (chance(illnessRisk(g, id) * dt)) {
        c.ailment = id; c.ailDays = 0;
        const a = C2.AILMENTS[id];
        SW.ui.log(g, `${c.name} has come down with ${a.name.toLowerCase()}. ${a.blurb}`, 'bad');
        g.fx.push({ at: 'banner', text: a.glyph + ' ' + a.name.toUpperCase(), life: 4, t: 0 });
        return;
      }
    }
  }

  function cure(g) {
    const c = g.creature;
    if (!c.ailment) return fail(g, 'Nothing wrong with it.');
    const a = C2.AILMENTS[c.ailment];
    const r = C2.REMEDIES[a.remedy];
    const cost = r.cost;
    if (cost.food && g.village.food < cost.food) return fail(g, 'Not enough food.');
    if (cost.wood && g.res.wood < cost.wood) return fail(g, 'Not enough wood.');
    if (cost.prayer && g.res.prayer < cost.prayer) return fail(g, 'Not enough prayer.');
    if (cost.mats) for (const k in cost.mats) if ((g.mats[k] | 0) < cost.mats[k]) return fail(g, 'Missing materials.');
    if (cost.food) g.village.food -= cost.food;
    if (cost.wood) g.res.wood -= cost.wood;
    if (cost.prayer) g.res.prayer -= cost.prayer;
    if (cost.mats) for (const k in cost.mats) g.mats[k] -= cost.mats[k];
    c.ailment = null; c.ailDays = 0;
    c.bond = clamp(c.bond + 3, 0, 100);
    SW.ui.log(g, `${r.glyph} ${r.name}. ${c.name} is itself again, and remembers who fixed it.`, 'great');
    return true;
  }

  /* How much of its work an ill creature actually manages. */
  function workFactor(g) {
    const c = g.creature;
    let m = SW.boost.get(g, 'work');
    if (c.ailment) m *= C2.AILMENTS[c.ailment].work;
    if (hasTech(g, 'sprint')) m *= 1.2;
    return m;
  }

  /* ------------------------------------------------------ 2. techniques  */
  const reps = (g, id) => (g.creature.techniques && g.creature.techniques[id]) | 0;
  const hasTech = (g, id) => (g.equippedTech || []).includes(id) && reps(g, id) >= C2.TECHNIQUES[id].reps;
  const techKnown = (g, id) => reps(g, id) >= C2.TECHNIQUES[id].reps;

  function techSlots(g) {
    return C2.TECH_SLOTS_BASE + Math.floor((g.evo | 0) / 2) + (SW.boost.buildingTier(g, 'arena') > 0 ? 1 : 0);
  }

  function trainTechnique(g, id, n) {
    if (!C2.TECHNIQUES[id]) return;
    const c = g.creature;
    if (!c.techniques) c.techniques = {};
    const before = techKnown(g, id);
    c.techniques[id] = reps(g, id) + (n || 1);
    if (!before && techKnown(g, id)) {
      const t = C2.TECHNIQUES[id];
      SW.ui.log(g, `${c.name} has worked out how to ${t.name.toLowerCase()}. ${t.blurb}`, 'great');
      g.fx.push({ at: 'banner', text: t.glyph + ' ' + t.name.toUpperCase(), life: 4, t: 0 });
      SW.discovery.firstTime(g, 'tech:' + id, 5, `seeing it learn ${t.name.toLowerCase()}`);
    }
  }

  /* Which acts drill which techniques. */
  const ACT_TECH = {
    forage: ['haul', 'dig'], harvest: ['haul'], water: ['sprint'], sow: ['sprint'],
    till: ['dig'], play: ['sing'], perform: ['sing', 'show'], tithe: ['sing'],
    terrorize: ['guard'], rest: ['nightwork']
  };

  function onAct(g, actId) {
    const list = ACT_TECH[actId];
    if (list) for (const t of list) if (chance(0.5)) trainTechnique(g, t, 1);
    // Working at night is its own lesson.
    const night = (g.dayTick / C.TICKS_PER_DAY) > 0.72;
    if (night && actId !== 'rest') trainTechnique(g, 'nightwork', 1);
  }

  function equipTech(g, id) {
    if (!techKnown(g, id)) return fail(g, 'It does not know that yet.');
    if (!g.equippedTech) g.equippedTech = [];
    const i = g.equippedTech.indexOf(id);
    if (i >= 0) { g.equippedTech.splice(i, 1); return true; }
    if (g.equippedTech.length >= techSlots(g)) return fail(g, 'No room. Set something else down first.');
    g.equippedTech.push(id);
    return true;
  }

  /* ------------------------------------------------------ 3. bloodlines  */
  function rollMate(g) {
    const lin = pick(C.LINEAGE_LIST);
    const q = 0.6 + Math.random() * 0.9;
    return {
      lineage: lin.id,
      name: pick(['Wild', 'Grey', 'Thorn', 'Ash', 'Bramble', 'Pale', 'Fen']) + ' ' + lin.name,
      strength: Math.round(lin.base.strength * q * 10) / 10,
      cunning: Math.round(lin.base.cunning * q * 10) / 10,
      grace: Math.round(lin.base.grace * q * 10) / 10,
      vigour: q,
      day: g.day
    };
  }

  function acceptMate(g) {
    if (!g.mateOffer) return false;
    g.mate = g.mateOffer;
    g.mateOffer = null;
    SW.ui.log(g, `${g.mate.name} stays. The next whelp will carry both lines.`, 'good');
    return true;
  }
  function refuseMate(g) { g.mateOffer = null; return true; }

  /* Called by lineage.breed to blend in the mate, then consume it. */
  function applyMate(g, child) {
    const m = g.mate;
    if (!m) { g.pedigree = g.pedigree || []; return; }
    child.stats.strength = (child.stats.strength + m.strength) / 2 * 1.06;
    child.stats.cunning = (child.stats.cunning + m.cunning) / 2 * 1.06;
    child.stats.grace = (child.stats.grace + m.grace) / 2 * 1.06;
    // Hybrid vigour: a different lineage is worth more than the same one.
    if (m.lineage !== child.lineage) {
      child.hybrid = m.lineage;
      for (const k of ['strength', 'cunning', 'grace']) child.stats[k] *= 1.08;
      SW.ui.log(g, `The whelp is a cross — ${C.LINEAGES[child.lineage].name} out of ${C.LINEAGES[m.lineage].name}. It is stronger for it.`, 'great');
    } else {
      g.inbreeding = (g.inbreeding || 0) + 1;
      if (g.inbreeding >= 3) {
        for (const k of ['strength', 'cunning', 'grace']) child.stats[k] *= 0.94;
        SW.ui.log(g, 'The line is getting narrow. The whelp is a little weaker than it should be.', 'warn');
      }
    }
    g.pedigree = g.pedigree || [];
    g.pedigree.unshift({ gen: child.gen, mate: m.name, day: g.day, hybrid: !!child.hybrid });
    if (g.pedigree.length > 30) g.pedigree.length = 30;
    g.mate = null;
  }

  /* ---------------------------------------------------------- 4. arena   */
  /* What the ring is actually measuring. A freshly bred whelp has poor stats
   * by design, so the trial has to see the whole line behind it — what it was
   * born knowing, what it has worked out, and how many generations of work sit
   * underneath. Otherwise breeding, the central loop, would be a penalty. */
  function beastPower(g) {
    const c = g.creature;
    let p = (c.stats.strength * 1.4 + c.stats.cunning * 1.1 + c.stats.grace * 0.9)
      * (0.6 + c.size * 0.5) * (0.55 + c.vigor / 140) * (0.7 + c.bond / 200);
    if (hasTech(g, 'show')) p *= 1.25;
    if (hasTech(g, 'guard')) p *= 1.15;
    if (hasTech(g, 'sprint')) p *= 1.1;
    if (c.ailment) p *= 0.6;
    p *= 1 + (g.evo | 0) * 0.18;

    let ingrained = 0;
    for (const id of C.TRAINABLE) ingrained += SW.lineage.ingrainedOf(g, id);
    let known = 0;
    for (const id in C2.TECHNIQUES) if (techKnown(g, id)) known++;
    return p + ingrained * 30 + known * 12 + (g.gens | 0) * 3;
  }

  function arenaOpponents(g) {
    return g.rivals.map((r, i) => ({
      name: r.name,
      power: (20 + Math.pow(g.day, 1.0) * 1.9) * r.pace * (0.7 + hashNoise(r.seed + 91, Math.floor(g.day / 3)) * 0.7),
      index: i
    })).sort((a, b) => a.power - b.power);
  }

  /* Three rounds, each a noisy comparison. Best of three takes it. */
  function fight(g, opponentIndex) {
    if (!SW.boost.buildingTier(g, 'arena')) return fail(g, 'You have nowhere to hold a trial.');
    const c = g.creature;
    if (c.vigor < 30) return fail(g, 'It is in no state to fight.');
    // One trial a day. The ring is an event, not a renown tap.
    if (g.arenaDay === g.day) return fail(g, 'It has already fought today.');
    g.arenaDay = g.day;
    const opp = arenaOpponents(g)[opponentIndex];
    if (!opp) return false;
    c.vigor = clamp(c.vigor - 28, 0, 100);
    const mine = beastPower(g);
    const rounds = [];
    let wins = 0;
    for (let i = 0; i < 3; i++) {
      const a = mine * rnd(0.7, 1.35);
      const b = opp.power * rnd(0.7, 1.35);
      const won = a >= b;
      if (won) wins++;
      rounds.push({ mine: Math.round(a), theirs: Math.round(b), won });
    }
    const won = wins >= 2;
    const stake = Math.round(90 + g.day * 6);
    if (won) {
      g.res.renown += stake;
      g.stats.arenaWins = (g.stats.arenaWins || 0) + 1;
      c.bond = clamp(c.bond + 4, 0, 100);
      // A gentle champion is loved for it; a vicious one is feared. Winning
      // should not quietly turn a faith empire into a terror one.
      if (c.kind >= 0) g.village.faith = clamp(g.village.faith + 1.5, 0, 100);
      else g.village.awe = clamp(g.village.awe + 1.5, 0, 100);
      trainTechnique(g, 'show', 4);
      if (chance(0.18)) SW.relics.grant(g);
      SW.ui.log(g, `Trial won against ${opp.name}, ${wins}–${3 - wins}. +${stake} renown.`, 'great');
    } else {
      g.res.renown = Math.max(0, g.res.renown - Math.round(stake * 0.3));
      c.mood = clamp(c.mood - 10, 0, 100);
      g.stats.arenaLosses = (g.stats.arenaLosses || 0) + 1;
      SW.ui.log(g, `Beaten by ${opp.name}, ${wins}–${3 - wins}. It limps off.`, 'bad');
    }
    g.diplo[opp.name] = clamp((g.diplo[opp.name] || 0) + (won ? -8 : 4), -100, 100);
    g.arenaResult = { opponent: opp.name, rounds, won, stake, day: g.day };
    g.arenaChallenge = false;
    SW.discovery.firstTime(g, 'arena', 6, 'putting it in the ring');
    return true;
  }

  function tick(g, dt) {
    tickIllness(g, dt);
  }

  SW.beast = {
    illnessRisk, tickIllness, cure, workFactor,
    reps, hasTech, techKnown, techSlots, trainTechnique, onAct, equipTech,
    rollMate, acceptMate, refuseMate, applyMate,
    beastPower, arenaOpponents, fight, tick
  };
})(window.SW = window.SW || {});

</script>
<script>
/* Skyward Reach — relics, the slots they go in, and the titles you earn. */
(function (SW) {
  'use strict';
  const C = SW.content, C2 = SW.content2;
  const { clamp, pick, chance, fmt } = SW.core;

  const fail = (g, m) => { SW.ui.log(g, m, 'warn'); return false; };

  /* Slots open up with the shrine — a bigger shrine is somewhere to keep
   * things, and somewhere for people to see that you have them. */
  function slots(g) {
    return 1 + Math.floor((g.shrine | 0) / 2) + ((g.ring | 0) >= 2 ? 1 : 0);
  }

  const owned = g => C2.RELIC_LIST.filter(r => g.relics[r.id]);
  const isEquipped = (g, id) => (g.equipped || []).includes(id);

  /* Relic tier is gated on standing, so the good ones cannot turn up on day 3. */
  function grant(g, forceRank) {
    const rank = forceRank || (1 + Math.min(3, Math.floor(SW.sim.rankOf(g).id / 1.4)));
    const pool = C2.RELIC_LIST.filter(r => r.rank <= rank && !g.relics[r.id]);
    if (!pool.length) {
      // Nothing new to find; convert into insight instead so it is never a dud.
      g.insight += 12;
      SW.ui.log(g, 'Another relic, and you already own its like. You study it apart instead. +12 insight.', 'good');
      return null;
    }
    const r = pick(pool);
    g.relics[r.id] = g.day;
    SW.ui.log(g, `${r.glyph} ${r.name}. ${r.blurb}`, 'great');
    g.fx.push({ at: 'banner', text: r.glyph + ' ' + r.name, life: 4.5, t: 0 });
    SW.discovery.firstTime(g, 'relic', 6, 'holding a relic');
    // First one goes on automatically, so its effect is never invisible.
    if ((g.equipped || []).length < slots(g)) equip(g, r.id);
    return r;
  }

  function equip(g, id) {
    if (!g.relics[id]) return false;
    if (!g.equipped) g.equipped = [];
    const i = g.equipped.indexOf(id);
    if (i >= 0) { g.equipped.splice(i, 1); return true; }
    if (g.equipped.length >= slots(g)) return fail(g, 'No free setting. Take one out first.');
    g.equipped.push(id);
    return true;
  }

  /* Two relics of the same rank fuse into one of the next rank up. The cost is
   * that you lose both, which makes it a real decision rather than a menu. */
  function canFuse(g, a, b) {
    if (!a || !b || a === b) return false;
    if (!g.relics[a] || !g.relics[b]) return false;
    if (C2.RELICS[a].rank !== C2.RELICS[b].rank) return false;
    return C2.RELIC_LIST.some(r => r.rank === C2.RELICS[a].rank + 1 && !g.relics[r.id]);
  }

  function fuse(g, a, b) {
    if (!canFuse(g, a, b)) return fail(g, 'Those two will not fuse.');
    const rank = C2.RELICS[a].rank + 1;
    delete g.relics[a]; delete g.relics[b];
    g.equipped = (g.equipped || []).filter(x => x !== a && x !== b);
    SW.ui.log(g, `${C2.RELICS[a].name} and ${C2.RELICS[b].name} go into the fire together.`, 'info');
    grant(g, rank);
    return true;
  }

  /* ------------------------------------------------------------- titles  */
  function available(g) {
    return C2.TITLES.filter(t => { try { return t.need(g); } catch (e) { return false; } });
  }

  function setTitle(g, id) {
    const t = C2.TITLES.find(x => x.id === id);
    if (!t) return false;
    try { if (!t.need(g)) return fail(g, 'You have not earned that.'); } catch (e) { return false; }
    g.title = id;
    SW.ui.log(g, id === 'none' ? 'You go by no title.' : `You are ${g.godName}, ${t.name}.`, 'good');
    return true;
  }

  function checkTitles(g) {
    const av = available(g);
    if (!g.titlesSeen) g.titlesSeen = {};
    for (const t of av) {
      if (t.id === 'none' || g.titlesSeen[t.id]) continue;
      g.titlesSeen[t.id] = g.day;
      SW.ui.log(g, `A title is yours to take if you want it: ${t.name}.`, 'good');
      SW.discovery.firstTime(g, 'title:' + t.id, 4, 'earning a title');
    }
  }

  SW.relics = { slots, owned, isEquipped, grant, equip, canFuse, fuse, available, setTitle, checkTitles };
})(window.SW = window.SW || {});

</script>
<script>
/* Skyward Reach — caravans, contracts, and what the other gods think of you. */
(function (SW) {
  'use strict';
  const C = SW.content, C2 = SW.content2;
  const { clamp, rnd, rndInt, pick, chance, fmt } = SW.core;

  const fail = (g, m) => { SW.ui.log(g, m, 'warn'); return false; };

  /* ---------------------------------------------------------- caravans   */
  const VISIT_EVERY = 6;   // days, roughly; the dock shortens it

  function merchantRep(g, id) { return (g.merchantRep && g.merchantRep[id]) | 0; }

  function repTier(rep) { return rep >= 60 ? 3 : rep >= 30 ? 2 : rep >= 10 ? 1 : 0; }

  /* Prices improve as a merchant comes to trust you; the dock and traders help. */
  function markup(g, id) {
    return 1 / (1 + repTier(merchantRep(g, id)) * 0.09) / SW.boost.get(g, 'trade');
  }
  function payout(g, id) {
    return (1 + repTier(merchantRep(g, id)) * 0.11) * SW.boost.get(g, 'trade') * SW.boost.get(g, 'coin');
  }

  function rollCaravan(g) {
    const m = pick(C2.MERCHANTS);
    const tier = repTier(merchantRep(g, m.id));
    const stock = {};
    for (const mat of m.sells) {
      // Rare stock only opens up once they know you.
      const rare = mat === 'metal' || mat === 'glass';
      if (rare && tier < 1) continue;
      stock[mat] = rndInt(2, 4 + tier * 2);
    }
    const wants = pick(m.buys.filter(b => SW.sim.rankOf(g).id >= C.CROPS[b].rank)) || m.buys[0];
    const need = Math.max(4, Math.round((6 + g.day * 0.5) * rnd(0.7, 1.3)));
    g.caravan = {
      id: m.id, until: g.day + 3, stock,
      contract: {
        kind: 'deliver', crop: wants, need, got: 0,
        coin: Math.round(C.CROPS[wants].price * need * 2.4 * (1 + tier * 0.15)),
        renown: Math.round(30 + g.day * 3),
        rep: 12
      }
    };
    SW.ui.log(g, `${m.glyph} ${m.name} has tied up at the rim. ${m.blurb}`, 'good');
    SW.discovery.firstTime(g, 'caravan', 5, 'trading with a caravan');
  }

  function caravanDef(g) {
    return g.caravan ? C2.MERCHANTS.find(m => m.id === g.caravan.id) : null;
  }

  function matPrice(g, mat) {
    const base = C.MATERIALS[mat].buy || (mat === 'glass' ? 520 : 900);
    return Math.max(1, Math.round(base * 1.25 * markup(g, g.caravan.id)));
  }

  function buyFromCaravan(g, mat, n) {
    if (!g.caravan) return false;
    const have = g.caravan.stock[mat] | 0;
    const price = matPrice(g, mat);
    const want = Math.min(n, have, Math.floor(g.res.coin / price));
    if (want <= 0) return fail(g, have ? 'Not enough coin.' : 'They have none left.');
    g.res.coin -= price * want;
    g.caravan.stock[mat] -= want;
    g.mats[mat] = (g.mats[mat] | 0) + want;
    g.merchantRep[g.caravan.id] = merchantRep(g, g.caravan.id) + want;
    SW.ui.log(g, `Bought ${want} ${C.MATERIALS[mat].name.toLowerCase()} off the cart.`, 'info');
    return true;
  }

  function deliverContract(g) {
    if (!g.caravan) return false;
    const ct = g.caravan.contract;
    const held = g.stock[ct.crop] | 0;
    const give = Math.min(held, ct.need - ct.got);
    if (give <= 0) return fail(g, `You have no ${C.CROPS[ct.crop].name} to hand over.`);
    g.stock[ct.crop] -= give;
    ct.got += give;
    if (ct.got >= ct.need) {
      const coin = Math.round(ct.coin * payout(g, g.caravan.id));
      g.res.coin += coin;
      g.stats.coinEarned += coin;
      g.res.renown += ct.renown;
      g.merchantRep[g.caravan.id] = merchantRep(g, g.caravan.id) + ct.rep;
      SW.ui.log(g, `Contract filled — ${ct.need} ${C.CROPS[ct.crop].name}. +${fmt(coin)} coin, +${ct.renown} renown.`, 'great');
      SW.discovery.firstTime(g, 'contract', 6, 'filling a contract');
      g.caravan.contract = null;
    } else {
      SW.ui.log(g, `${ct.got}/${ct.need} delivered.`, 'info');
    }
    return true;
  }

  function tickCaravan(g) {
    const gap = Math.max(3, VISIT_EVERY - SW.boost.buildingTier(g, 'dock'));
    if (g.caravan && g.day > g.caravan.until) {
      const m = caravanDef(g);
      if (g.caravan.contract) {
        g.merchantRep[g.caravan.id] = merchantRep(g, g.caravan.id) - 6;
        SW.ui.log(g, `${m.name} casts off with the contract unfilled. They remember that.`, 'warn');
      } else {
        SW.ui.log(g, `${m.name} casts off.`, 'info');
      }
      g.caravan = null;
      g.nextCaravan = g.day + gap;
    }
    if (!g.caravan && g.day >= (g.nextCaravan || 0)) rollCaravan(g);
  }

  /* --------------------------------------------------------- diplomacy   */
  function opinion(g, name) { return (g.diplo && g.diplo[name]) | 0; }
  function opinionWord(v) {
    return v >= 55 ? 'allied' : v >= 20 ? 'warm' : v > -20 ? 'neutral' : v > -55 ? 'cold' : 'hostile';
  }

  function diplomacy(g, rivalName, actionId) {
    const a = C2.DIPLO_ACTIONS.find(x => x.id === actionId);
    const rival = g.rivals.find(r => r.name === rivalName);
    if (!a || !rival) return false;
    if (a.coin) {
      const c = a.coin(g);
      if (g.res.coin < c) return fail(g, 'Not enough coin for that.');
      g.res.coin -= c;
    }
    if (a.renown) g.res.renown = Math.max(0, g.res.renown + a.renown(g));
    if (a.awe) g.village.awe = clamp(g.village.awe + a.awe, 0, 100);
    if (a.vigor) {
      if (g.creature.vigor < a.vigor) return fail(g, 'The creature is too tired for that.');
      g.creature.vigor -= a.vigor;
      // Sabotage: steal standing, unless they see it coming.
      const caught = chance(0.35 - (SW.beast.hasTech(g, 'guard') ? 0.15 : 0));
      if (caught) {
        g.res.renown = Math.max(0, g.res.renown - 120);
        SW.ui.log(g, `${rivalName} catches your creature at it. Everyone hears.`, 'bad');
      } else {
        const took = Math.min(rival.renown * 0.03, 600 + g.day * 8);
        rival.renown -= took;
        g.res.renown += took * 0.5;
        SW.ui.log(g, `Something of ${rivalName}'s standing goes missing in the night. +${fmt(took * 0.5)} renown.`, 'good');
      }
    }
    g.diplo[rivalName] = clamp(opinion(g, rivalName) + a.opinion, -100, 100);
    if (!a.vigor) SW.ui.log(g, `${a.glyph} ${a.name} — ${rivalName} is now ${opinionWord(opinion(g, rivalName))}.`, 'info');
    SW.discovery.firstTime(g, 'diplo', 4, 'dealing with a rival directly');
    return true;
  }

  /* Allies drag you up the curve a little; enemies chip at you. */
  function tickDiplomacy(g) {
    for (const r of g.rivals) {
      const v = opinion(g, r.name);
      if (v >= 55) g.res.renown += 12 + g.day * 0.4;
      else if (v <= -55 && chance(0.10)) {
        const loss = Math.round(40 + g.day * 2);
        g.res.renown = Math.max(0, g.res.renown - loss);
        SW.ui.log(g, `${r.name} says something damaging about you, and it sticks. −${loss} renown.`, 'bad');
      }
      // Opinions decay toward indifference.
      if (v !== 0) g.diplo[r.name] = v - Math.sign(v) * Math.min(Math.abs(v), 0.6);
    }
  }

  function newDay(g) {
    tickCaravan(g);
    tickDiplomacy(g);
  }

  SW.trade = {
    merchantRep, repTier, markup, payout, rollCaravan, caravanDef, matPrice,
    buyFromCaravan, deliverContract, tickCaravan,
    opinion, opinionWord, diplomacy, tickDiplomacy, newDay

<script>
/* Skyward Reach — two more things you play rather than manage.
 *
 * Cloud fishing: a three-stage timing game. Each stage you stop a sweeping
 * marker inside a window that gets narrower and faster; clear more stages and
 * something bigger comes up.
 *
 * Chanting: call and response. The shrine sings a sequence of tones, you sing
 * it back. Get it all and the miracle lands at full strength; fumble it and
 * you get part of one.
 */
(function (SW) {
  'use strict';
  const C = SW.content, C2 = SW.content2;
  const { clamp, rnd, rndInt, pick, chance, fmt } = SW.core;

  const fail = (g, m) => { SW.ui.log(g, m, 'warn'); return false; };

  /* ------------------------------------------------------------ fishing  */
  const CAST_FOCUS = 5;
  const STAGES = 3;

  function fishingUnlocked(g) { return (g.ring | 0) >= 0 && !!g.neurons.listening; }

  function startFishing(g) {
    if (!fishingUnlocked(g)) return fail(g, 'You would not know what to listen for. Grow The Listening first.');
    if (g.fishing || g.listen || g.chant) return false;
    if (g.res.focus < CAST_FOCUS) return fail(g, 'Not enough focus to cast.');
    g.res.focus -= CAST_FOCUS;
    g.fishing = newStage(g, 0);
    SW.ui.log(g, 'You drop a line off the rim into open cloud.', 'info');
    return true;
  }

  function newStage(g, stage) {
    const tight = 1 - stage * 0.26;
    return {
      stage,
      pos: 0, dir: 1,
      speed: 0.85 + stage * 0.38 + Math.min(g.day, 60) * 0.004,
      zone: rnd(0.12, 0.88 - 0.20 * tight),
      zoneW: 0.22 * tight,
      t: 0, result: null, cleared: stage
    };
  }

  function tickFishing(g, dt) {
    const f = g.fishing;
    if (!f) return;
    if (f.result) {
      f.t += dt;
      if (f.t > 1.4) finishFishing(g);
      return;
    }
    f.pos += f.dir * f.speed * dt;
    if (f.pos >= 1) { f.pos = 1; f.dir = -1; }
    if (f.pos <= 0) { f.pos = 0; f.dir = 1; }
    f.t += dt;
    // Give up after a while so a forgotten line does not sit forever.
    if (f.t > 14) { f.result = 'lost'; f.t = 0; }
  }

  /* The click. Inside the window advances a stage; outside ends the cast. */
  function strike(g) {
    const f = g.fishing;
    if (!f || f.result) return false;
    const hit = f.pos >= f.zone && f.pos <= f.zone + f.zoneW;
    if (!hit) {
      f.result = f.stage === 0 ? 'lost' : 'partial';
      f.t = 0;
      return true;
    }
    if (f.stage + 1 >= STAGES) {
      f.result = 'full';
      f.cleared = STAGES;
      f.t = 0;
      return true;
    }
    const next = newStage(g, f.stage + 1);
    next.cleared = f.stage + 1;
    g.fishing = next;
    g.fx.push({ at: 'banner', text: '✔ ' + (f.stage + 1) + '/' + STAGES, life: 1.1, t: 0 });
    return true;
  }

  function pickFish(g, cleared) {
    const night = (g.dayTick / C.TICKS_PER_DAY) > 0.72;
    const pool = C2.FISH.filter(fh => fh.ring <= (g.ring | 0) && (!fh.night || night));
    if (!pool.length) return C2.FISH[0];
    // More stages cleared shifts the draw toward the rare end.
    const target = 1 + cleared * 1.3 + (chance(0.15) ? 1 : 0);
    let best = pool[0];
    for (const fh of pool) {
      if (fh.rarity <= target && fh.rarity >= best.rarity) best = fh;
    }
    // A small chance at something well above your level, which is the hook.
    if (cleared >= STAGES && chance(0.14)) {
      const big = pool.filter(fh => fh.rarity > best.rarity);
      if (big.length) best = pick(big);
    }
    return best;
  }

  function finishFishing(g) {
    const f = g.fishing;
    g.fishing = null;
    if (f.result === 'lost' && f.cleared === 0) {
      SW.ui.log(g, 'The line goes slack. Nothing.', 'warn');
      return;
    }
    const fish = pickFish(g, f.cleared);
    g.fish[fish.id] = (g.fish[fish.id] | 0) + 1;
    g.stats.fished = (g.stats.fished || 0) + 1;
    if (fish.mat) g.mats[fish.mat] = (g.mats[fish.mat] | 0) + 1;
    SW.discovery.firstTime(g, 'fish:' + fish.id, 3, `landing a ${fish.name.toLowerCase()}`);
    SW.ui.log(g, `${fish.glyph} ${fish.name}. ${fish.blurb}`, fish.rarity >= 3 ? 'great' : 'good');
    if (fish.rarity >= 4) {
      g.fx.push({ at: 'banner', text: fish.glyph + ' ' + fish.name, life: 4, t: 0 });
      if (chance(0.22)) SW.relics.grant(g);   // something was inside it
    }
    SW.beast.trainTechnique(g, 'sense', 1);
  }

  function sellFish(g, id, n) {
    const fh = C2.FISH.find(x => x.id === id);
    const have = g.fish[id] | 0;
    const want = Math.min(n, have);
    if (want <= 0) return 0;
    g.fish[id] -= want;
    const coin = Math.round(fh.coin * want * SW.boost.get(g, 'coin'));
    g.res.coin += coin;
    g.stats.coinEarned += coin;
    return coin;
  }

  function eatFish(g, id, n) {
    const fh = C2.FISH.find(x => x.id === id);
    const have = g.fish[id] | 0;
    const want = Math.min(n, have);
    if (want <= 0) return 0;
    g.fish[id] -= want;
    g.village.food += fh.feed * want;
    return fh.feed * want;
  }

  /* ----------------------------------------------------------- chanting  */
  function chantUnlocked(g) { return (g.shrine | 0) >= 2; }

  function startChant(g, id) {
    const ch = C2.CHANTS.find(x => x.id === id);
    if (!ch) return false;
    if (!chantUnlocked(g)) return fail(g, 'You need a shrine worth chanting at.');
    if ((g.ring | 0) < ch.ring) return fail(g, `That one belongs to ${C.RINGS[ch.ring].name}.`);
    if (g.chant || g.listen || g.fishing) return false;
    if (g.res.prayer < ch.prayer) return fail(g, 'Not enough prayer.');
    g.res.prayer -= ch.prayer;
    const seq = [];
    for (let i = 0; i < ch.len; i++) seq.push(rndInt(0, C2.CHANT_TONES.length - 1));
    g.chant = { id, seq, input: [], phase: 'show', shown: 0, t: 0, lit: -1 };
    return true;
  }

  const SHOW_ON = 0.42, SHOW_OFF = 0.20;

  function tickChant(g, dt) {
    const ch = g.chant;
    if (!ch) return;
    ch.t += dt;
    if (ch.phase === 'show') {
      const step = SHOW_ON + SHOW_OFF;
      const i = Math.floor(ch.t / step);
      if (i >= ch.seq.length) { ch.phase = 'input'; ch.lit = -1; ch.t = 0; return; }
      ch.lit = (ch.t - i * step) < SHOW_ON ? ch.seq[i] : -1;
    } else if (ch.phase === 'input') {
      if (ch.t > 3.5 + ch.seq.length * 1.3) resolveChant(g);
    } else if (ch.phase === 'done') {
      if (ch.t > 1.2) g.chant = null;
    }
  }

  function chantInput(g, tone) {
    const ch = g.chant;
    if (!ch || ch.phase !== 'input') return false;
    ch.input.push(tone);
    ch.lit = tone;
    ch.flash = 0.18;
    if (ch.input.length >= ch.seq.length) resolveChant(g);
    return true;
  }

  function resolveChant(g) {
    const ch = g.chant;
    const def = C2.CHANTS.find(x => x.id === ch.id);
    let right = 0;
    for (let i = 0; i < ch.seq.length; i++) if (ch.input[i] === ch.seq[i]) right++;
    const acc = right / ch.seq.length;
    ch.phase = 'done';
    ch.t = 0;
    ch.acc = acc;
    applyChant(g, def, acc);
  }

  function applyChant(g, def, acc) {
    if (acc <= 0.34) {
      SW.ui.log(g, `The ${def.name} falls apart in your mouth. The prayer is spent regardless.`, 'bad');
      return;
    }
    const p = acc;
    switch (def.id) {
      case 'growth':
        for (const pl of g.plots) if (pl.state === 'growing') {
          pl.growth += C.CROPS[pl.crop].growTicks * 0.35 * p;
          if (pl.growth >= C.CROPS[pl.crop].growTicks) { pl.state = 'ripe'; pl.growth = C.CROPS[pl.crop].growTicks; }
        }
        g.fx.push({ at: 'sky', kind: 'shine', life: 2, t: 0 });
        break;
      case 'calm':
        g.village.unrest = clamp(g.village.unrest - 45 * p, 0, 100);
        g.creature.mood = clamp(g.creature.mood + 30 * p, 0, 100);
        break;
      case 'plenty':
        g.village.food += 130 * p;
        g.village.faith = clamp(g.village.faith + 7 * p, 0, 100);
        break;
      case 'fear':
        g.village.awe = clamp(g.village.awe + 26 * p, 0, 100);
        g.village.faith = clamp(g.village.faith - 6 * p, 0, 100);
        g.fx.push({ at: 'sky', kind: 'storm', life: 3, t: 0 });
        break;
      case 'insight':
        g.insight += Math.round(14 * p * SW.boost.get(g, 'insight'));
        break;
      case 'renewal':
        for (const pl of g.plots) pl.soil = clamp(SW.world.soilOf(pl) + 55 * p, 0, C2.SOIL.max);
        break;
    }
    const word = acc >= 0.999 ? 'perfectly' : acc >= 0.7 ? 'well enough' : 'badly';
    SW.ui.log(g, `${def.glyph} ${def.name}, sung ${word}. ${def.blurb}`, acc >= 0.999 ? 'great' : 'good');
    g.stats.chants = (g.stats.chants || 0) + 1;
    SW.discovery.firstTime(g, 'chant:' + def.id, 5, `singing the ${def.name}`);
    if (acc >= 0.999) SW.discovery.firstTime(g, 'chantperfect', 8, 'singing one without a mistake');
  }

  function tick(g, dt) {
    tickFishing(g, dt);
    tickChant(g, dt);
  }

  const busy = g => !!(g.listen || g.fishing || g.chant);

  SW.mini2 = {
    CAST_FOCUS, STAGES, fishingUnlocked, startFishing, tickFishing, strike, finishFishing,
    sellFish, eatFish, chantUnlocked, startChant, tickChant, chantInput, tick, busy
  };
})(window.SW = window.SW || {});

</script>
<script>
/* Skyward Reach — Ascension.
 *
 * Let the island go and begin again on a fresh one, carrying only what you
 * chose to carry. The point of a grind game is the second run being faster
 * than the first for reasons you picked.
 */
(function (SW) {
  'use strict';
  const C = SW.content, C2 = SW.content2;
  const { clamp, fmt } = SW.core;

  const fail = (g, m) => { SW.ui.log(g, m, 'warn'); return false; };

  function canAscend(g) {
    return g.res.renown >= C2.ASCEND_MIN_RENOWN;
  }

  /* Points earned by this run, on a curve so a much longer run is worth more
   * but not proportionally so. */
  function pointsFor(g) {
    if (!canAscend(g)) return 0;
    return Math.max(1, Math.floor(Math.pow(g.res.renown / C2.ASCEND_MIN_RENOWN, 0.62) * 3));
  }

  function spent(g) {
    let n = 0;
    for (const id in (g.prestige.boons || {})) {
      const b = C2.BOONS.find(x => x.id === id);
      if (b) n += b.cost;
    }
    return n;
  }
  const unspent = g => (g.prestige.points | 0) - spent(g);

  function buyBoon(g, id) {
    const b = C2.BOONS.find(x => x.id === id);
    if (!b) return false;
    if (g.prestige.boons[id]) return fail(g, 'You already carry that.');
    if (unspent(g) < b.cost) return fail(g, 'Not enough ascension points.');
    g.prestige.boons[id] = true;
    SW.ui.log(g, `${b.glyph} ${b.name}. ${b.blurb}`, 'great');
    return true;
  }

  /* Build the next island. Everything not covered by a boon is gone. */
  function ascend(g) {
    if (!canAscend(g)) return fail(g, `You need ${fmt(C2.ASCEND_MIN_RENOWN)} renown before anyone would let you start again.`);
    const gained = pointsFor(g);
    const carried = {
      points: (g.prestige.points | 0) + gained,
      boons: g.prestige.boons || {},
      runs: (g.prestige.runs | 0) + 1,
      best: Math.max(g.prestige.best | 0, Math.floor(g.res.renown)),
      bestDay: g.prestige.best > g.res.renown ? g.prestige.bestDay : g.day
    };
    const keptSeeds = carried.boons.seedstock;
    const keptEvo = carried.boons.longline ? Math.max(0, (g.evo | 0) - 1) : 0;
    const keptIngrained = carried.boons.memory ? g.creature.ingrained : null;
    const keptNeurons = carried.boons.earlyweb
      ? Object.keys(g.neurons).slice(0, 4).reduce((o, k) => (o[k] = 1, o), {})
      : {};
    const lineage = g.creature.lineage;
    const name = g.creature.name;
    const godName = g.godName;

    const n = SW.state.startGame(lineage, name, godName);
    n.prestige = carried;
    n.evo = keptEvo;
    if (keptIngrained) {
      n.creature.ingrained = {};
      for (const k in keptIngrained) n.creature.ingrained[k] = keptIngrained[k] * 0.5;
      // Ingrained behaviour implies some of the weight came with it.
      for (const k in n.creature.ingrained) {
        const inst = (C.LINEAGES[lineage].instinct[k] || 1);
        n.creature.weights[k] = clamp(inst + (SW.creature.W_MAX - inst) * n.creature.ingrained[k] * 0.3,
          SW.creature.W_MIN, SW.creature.W_MAX);
      }
    }
    n.neurons = keptNeurons;
    if (keptNeurons.attention) n.res.focusMax += 10;
    if (carried.boons.inheritance) { n.res.coin += 2000; n.res.wood += 150; }
    if (keptSeeds) for (const cr of C.CROP_LIST) n.seeds[cr.id] = 40;

    SW.ui.log(n, `You let the island go. ${carried.runs === 1 ? 'The first' : 'Another'} one is already forming under your feet. +${gained} ascension point${gained === 1 ? '' : 's'}.`, 'great');
    n.fx.push({ at: 'banner', text: '✧ ASCENSION ' + carried.runs, life: 6, t: 0 });
    return n;
  }

  SW.prestige = { canAscend, pointsFor, spent, unspent, buyBoon, ascend };
})(window.SW = window.SW || {});

</script>
<script>
/* Skyward Reach — the world tick: village, economy, rivals, festivals, feats,
 * plus every action the player themself can take. */
(function (SW) {
  'use strict';
  const C = SW.content;
  const C2 = SW.content2;
  const F = SW.farm;
  const Cr = SW.creature;
  const { clamp, hashNoise, chance, pick, fmt } = SW.core;

  const OFFLINE_CAP_TICKS = 4 * 60 * 60;   // four hours of catch-up, at most
  const FOCUS_REGEN = 0.55;

  const COST = { till: 3, sow: 1, water: 1, harvest: 2, forage: 3 };

  // --- rank --------------------------------------------------------------
  function rankOf(g) {
    let r = C.RANKS[0];
    for (const rk of C.RANKS) if (g.res.renown >= rk.renown) r = rk;
    return r;
  }
  function nextRank(g) {
    const cur = rankOf(g);
    return C.RANKS[Math.min(cur.id + 1, C.RANKS.length - 1)] === cur ? null : C.RANKS[cur.id + 1];
  }
  const grandeur = g => C.SHRINE_TIERS[g.shrine].grandeur + (g.grandeurBonus || 0);

  // --- player actions ----------------------------------------------------
  function spend(g, focus) {
    if (g.res.focus < focus) return false;
    g.res.focus -= focus;
    return true;
  }

  function playerTill(g, plot) {
    if (plot.state !== 'raw') return fail(g, 'That soil is already broken.');
    if (!spend(g, COST.till)) return fail(g, 'Not enough focus.');
    F.till(g, plot);
    Cr.observe(g, 'till');
    return true;
  }

  function playerSow(g, plot, cropId) {
    if (plot.state !== 'tilled') return fail(g, 'Break the soil first.');
    if ((g.seeds[cropId] | 0) <= 0) return fail(g, `No ${C.CROPS[cropId].name} seed left.`);
    if (!spend(g, COST.sow)) return fail(g, 'Not enough focus.');
    F.sow(g, plot, cropId);
    Cr.observe(g, 'sow');
    return true;
  }

  function playerWater(g, plot) {
    if (plot.state !== 'growing' && plot.state !== 'ripe') return fail(g, 'Nothing there to water.');
    if (!spend(g, COST.water)) return fail(g, 'Not enough focus.');
    F.water(g, plot);
    Cr.observe(g, 'water');
    return true;
  }

  function playerHarvest(g, plot) {
    if (plot.state !== 'ripe') return fail(g, 'Not ready.');
    if (!spend(g, COST.harvest)) return fail(g, 'Not enough focus.');
    const r = F.harvest(g, plot, 1);
    Cr.observe(g, 'harvest');
    if (r) SW.ui.log(g, `You gather ${r.amount} ${r.crop.name}.`);
    return true;
  }

  function playerForage(g) {
    if (!spend(g, COST.forage)) return fail(g, 'Not enough focus.');
    const n = 3;
    g.res.wood += n;
    Cr.observe(g, 'forage');
    SW.ui.log(g, `You haul ${n} wood out of the treeline.`);
    return true;
  }

  function fail(g, msg) { SW.ui.log(g, msg, 'warn'); return false; }

  // --- building ----------------------------------------------------------
  function hutCost(g) {
    const n = g.village.huts;
    return {
      wood: Math.ceil(C.HUT_COST.wood * Math.pow(C.HUT_COST.scale, n - 3)),
      coin: Math.ceil(C.HUT_COST.coin * Math.pow(C.HUT_COST.scale, n - 3))
    };
  }
  function plotCost(g) {
    const n = g.plots.length;
    return {
      wood: Math.ceil(C.PLOT_COST.wood * Math.pow(C.PLOT_COST.scale, n - 3)),
      coin: Math.ceil(C.PLOT_COST.coin * Math.pow(C.PLOT_COST.scale, n - 3))
    };
  }

  function buildHut(g) {
    const c = hutCost(g);
    if (g.village.huts >= SW.discovery.hutCap(g)) {
      return fail(g, 'There is no more room on this terrace. Build the island outward first.');
    }
    if (g.res.wood < c.wood || g.res.coin < c.coin) return fail(g, 'You cannot afford another hut.');
    g.res.wood -= c.wood; g.res.coin -= c.coin;
    g.village.huts++;
    SW.discovery.firstTime(g, 'build:hut', 3, 'raising a hut');
    SW.ui.log(g, 'A new hut goes up. Somewhere below, someone hears about it.', 'good');
    return true;
  }

  function clearPlot(g) {
    if (!g.lockedPlots.length) return fail(g, 'There is no more island to break.');
    const c = plotCost(g);
    if (g.res.wood < c.wood || g.res.coin < c.coin) return fail(g, 'Not enough wood and coin.');
    g.res.wood -= c.wood; g.res.coin -= c.coin;
    g.plots.push(g.lockedPlots.shift());
    SW.discovery.firstTime(g, 'build:plot', 3, 'breaking new ground');
    SW.ui.log(g, 'New ground, cleared and claimed.', 'good');
    return true;
  }

  function upgradeShrine(g) {
    const next = C.SHRINE_TIERS[g.shrine + 1];
    if (!next) return fail(g, 'The shrine is already everything it can be.');
    if (rankOf(g).id < next.rank) return fail(g, `You must stand at ${C.RANKS[next.rank].name} before the stones will hold.`);
    if ((next.ring || 0) > (g.ring | 0)) return fail(g, `${C.RINGS[next.ring].name} has to exist before there is ground to put it on.`);
    if (g.res.wood < next.wood || g.res.coin < next.coin) return fail(g, 'Not enough wood and coin.');
    g.res.wood -= next.wood; g.res.coin -= next.coin;
    g.shrine++;
    SW.discovery.firstTime(g, 'shrine:' + g.shrine, 5, `raising the ${next.name}`);
    g.village.faith = clamp(g.village.faith + 6, 0, 100);
    SW.ui.log(g, `The shrine rises. It is a ${next.name} now, and it can be seen from other islands.`, 'great');
    return true;
  }

  // --- miracles ----------------------------------------------------------
  function castMiracle(g, id) {
    const m = C.MIRACLES[id];
    if (!m) return false;
    if (rankOf(g).id < m.rank) return fail(g, 'That power is beyond your standing.');
    if (g.res.prayer < m.cost) return fail(g, 'Not enough prayer.');
    g.res.prayer -= m.cost;
    g.stats.miracles++;
    SW.discovery.firstTime(g, 'miracle:' + id, 3, `working the ${m.name}`);
    switch (id) {
      case 'rain':
        for (const p of g.plots) if (p.crop) { p.water = 100; p.rot = Math.max(0, p.rot - 30); }
        g.fx.push({ at: 'sky', kind: 'rain', life: 6, t: 0 });
        SW.ui.log(g, 'Rain, on your say-so. Every plot drinks.', 'good');
        break;
      case 'quickening':
        for (const p of g.plots) if (p.state === 'growing') {
          p.growth += C.CROPS[p.crop].growTicks * 0.25;
          if (p.growth >= C.CROPS[p.crop].growTicks) { p.state = 'ripe'; p.growth = C.CROPS[p.crop].growTicks; }
        }
        g.fx.push({ at: 'sky', kind: 'shine', life: 2.5, t: 0 });
        SW.ui.log(g, 'The fields lurch forward a season in a heartbeat.', 'good');
        break;
      case 'bounty':
        g.village.food += 42;
        g.village.faith = clamp(g.village.faith + 3, 0, 100);
        SW.ui.log(g, 'Bread out of nothing. The granary is full and they know who filled it.', 'good');
        break;
      case 'mend':
        g.creature.vigor = 100;
        g.creature.hunger = clamp(g.creature.hunger + 45, 0, 130);
        g.creature.mood = clamp(g.creature.mood + 12, 0, 100);
        g.creature.bond = clamp(g.creature.bond + 1.5, 0, 100);
        g.fx.push({ at: 'creature', text: '💗', tone: 'good', life: 1.8, t: 0 });
        SW.ui.log(g, `${g.creature.name} straightens up, whole again.`, 'good');
        break;
      case 'storm':
        g.village.awe = clamp(g.village.awe + 14, 0, 100);
        g.village.faith = clamp(g.village.faith - 6, 0, 100);
        g.village.unrest = clamp(g.village.unrest + 8, 0, 100);
        g.creature.mood = clamp(g.creature.mood - 6, 0, 100);
        g.fx.push({ at: 'sky', kind: 'storm', life: 4, t: 0 });
        SW.ui.log(g, 'You break the sky over their heads. Nobody will forget the date.', 'bad');
        break;
    }
    return true;
  }

  // --- world tick --------------------------------------------------------
  function tickVillage(g, dt) {
    const v = g.village;
    const eaten = (v.villagers + SW.world.extraEaters(g)) * 0.085 * SW.boost.foodUse(g) * dt;
    if (v.food >= eaten) {
      v.food -= eaten;
      v.faith = clamp(v.faith + 0.028 * dt, 0, 100);
      v.unrest = clamp(v.unrest - 0.05 * dt, 0, 100);
    } else {
      v.food = 0;
      v.faith = clamp(v.faith - 0.13 * dt, 0, 100);
      v.unrest = clamp(v.unrest + 0.09 * dt, 0, 100);
    }
    // Faith settles toward what you visibly provide — a shrine to look at, a
    // full granary, neighbours who stayed — less whatever they are afraid of.
    // A people who fear you do not also love you, so the two paths compete
    // instead of stacking.
    const pull = clamp((18 + Math.min(grandeur(g) * 1.8, 46) + (v.food > 40 ? 18 : 0) + v.villagers * 0.8
      - v.awe * 0.62 - v.unrest * 0.45) * SW.boost.get(g, 'faith'), 0, 100);
    if (g.effects.awe) v.awe = Math.max(v.awe, 14);      // the monolith never stops looming
    v.faith += (pull - v.faith) * 0.0022 * dt;
    v.faith = clamp(v.faith, 0, 100);
    v.awe = clamp(v.awe - 0.022 / SW.boost.get(g, 'awe') * dt, 0, 100);
    // Living under a terror is exhausting, but only once it is genuinely a
    // terror. Below that, fear is just respect and costs nothing.
    v.unrest = clamp(v.unrest + Math.max(0, v.awe - 45) * 0.005 * SW.boost.unrest(g) * dt, 0, 100);

    // Prayer: love gives it freely, terror gives it grudgingly.
    const rate = v.villagers * (v.faith / 100 * 0.055 + v.awe / 100 * 0.05)
      * (SW.boost.get(g, 'prayer') + SW.world.devoutBonus(g));
    g.res.prayer += rate * dt;

    // Standing compounds. A congregation is worth what it feels about you,
    // multiplied by how far away your shrine can be seen. Neither half alone
    // gets you up the Register — this is the engine the whole grind feeds.
    const devotion = v.villagers * (v.faith + v.awe) / 100;
    g.res.renown += (1 + grandeur(g) * 0.05) * devotion * 0.09 * SW.boost.get(g, 'renown') * dt;
  }

  function checkFeats(g) {
    for (const f of C.FEATS) {
      if (g.feats[f.id]) continue;
      let ok = false;
      try { ok = f.check(g); } catch (e) { ok = false; }
      if (ok) {
        g.feats[f.id] = g.day;
        g.res.renown += f.renown;
        SW.ui.log(g, `Feat — ${f.name}. +${f.renown} renown.`, 'great');
        g.fx.push({ at: 'banner', text: 'FEAT · ' + f.name, life: 4, t: 0 });
      }
    }
  }

  // A rival's ceiling on daily growth. Their curve accelerates for the first
  // ~70 days and then levels off for good: an established god is not getting
  // any more established. A fully built island out-earns even the fastest of
  // them, which is what makes first place reachable instead of a treadmill.
  const RIVAL_MAX_GAIN = 1900;

  function tickRivals(g) {
    // Rivals climb their own curve and never chase you. Nothing rubber-bands,
    // which is the whole reason passing one of them means anything.
    for (const r of g.rivals) {
      const n = hashNoise(r.seed, g.day);
      const curve = Math.min(25 + 7 * Math.pow(g.day, 1.15), RIVAL_MAX_GAIN);
      let gain = r.pace * curve * (0.72 + n * 0.62);
      if (hashNoise(r.seed + 5, g.day) < r.spike * 0.25) gain *= 2.2;    // a good week
      r.renown += gain;
    }
  }

  function standings(g) {
    const rows = g.rivals.map(r => ({ name: r.name, renown: Math.floor(r.renown), you: false, tone: r.tone }));
    rows.push({ name: g.godName, renown: Math.floor(g.res.renown), you: true, tone: 'you' });
    rows.sort((a, b) => b.renown - a.renown);
    rows.forEach((r, i) => { r.place = i + 1; });
    return rows;
  }

  function tickChatter(g) {
    const rows = standings(g);
    const me = rows.find(r => r.you);
    g.lastStanding = me.place;
    if (!chance(0.75)) return;
    const rival = pick(g.rivals);
    const rel = rival.renown > g.res.renown * 1.15 ? 'ahead'
      : rival.renown < g.res.renown * 0.85 ? 'behind' : 'near';
    const line = pick(C.BARBS[rel][rival.tone]).replace(/\{r\}/g, rival.name);
    g.chatter.unshift({ day: g.day, text: line, rel });
    if (g.chatter.length > 40) g.chatter.length = 40;
  }

  // --- festivals ---------------------------------------------------------
  function festivalScore(g, cat) {
    const c = g.creature;
    switch (cat.id) {
      case 'harvest': {
        let best = 0, total = 0;
        for (const cr of C.CROP_LIST) {
          const n = g.stock[cr.id] | 0;
          total += n;
          best = Math.max(best, F.price(g, cr.id) * n);
        }
        return best + total * 3;
      }
      case 'beast': {
        let m = 0;
        for (const id of C.TRAINABLE) if (C.ACTS[id].useful) m += Cr.mastery(g, id);
        return (c.stats.strength + c.stats.cunning + c.stats.grace) * 8
          + c.bond * 2.2 + c.size * 55 + m * 34 + Math.abs(c.kind) * 0.7;
      }
      case 'rite':
      default:
        return grandeur(g) * 6.5 + g.village.faith * 2.2 + g.village.awe * 1.7 + g.village.villagers * 9;
    }
  }

  function runFestival(g) {
    const cat = C.FESTIVALS[g.festival.index % C.FESTIVALS.length];
    const mine = festivalScore(g, cat);
    // Rivals are scored against a par curve for the category, not against their
    // renown — otherwise a runaway leader would sweep every event forever.
    const par = cat.par(g.day);
    const field = g.rivals.map(r => ({
      name: r.name,
      score: par * (0.5 + r.pace * 0.5) * (0.6 + hashNoise(r.seed + 31, g.day) * 0.8)
    }));
    field.push({ name: g.godName, score: mine, you: true });
    field.sort((a, b) => b.score - a.score);
    const place = field.findIndex(f => f.you) + 1;

    const payout = place === 1 ? Math.round(150 + g.day * 14)
      : place === 2 ? Math.round(85 + g.day * 8)
      : place === 3 ? Math.round(50 + g.day * 5)
      : Math.round(8 + g.day);
    g.res.renown += payout;
    g.stats.festivals++;
    SW.discovery.firstTime(g, 'fest:' + cat.id, 4, `entering ${cat.name}`);
    if (place === 1) g.stats.festivalWins++;
    if (place <= 3) g.trophies.push({ fest: cat.id, name: cat.name, place, day: g.day });
    // A podium finish is one of the few reliable ways to come by a relic.
    if (place === 1 ? chance(0.55) : (place <= 3 && chance(0.2))) SW.relics.grant(g);

    g.festival.lastResult = { cat: cat.id, name: cat.name, place, score: Math.round(mine), payout, day: g.day, field: field.slice(0, 5).map(f => ({ name: f.name, score: Math.round(f.score), you: !!f.you })) };
    g.festival.index++;
    g.festival.nextDay = g.day + 5;

    const tone = place === 1 ? 'great' : place <= 3 ? 'good' : 'warn';
    const ord = place === 1 ? 'first' : place === 2 ? 'second' : place === 3 ? 'third' : `${place}th`;
    SW.ui.log(g, `${cat.name}: you place ${ord}. +${payout} renown.`, tone);
    g.fx.push({ at: 'banner', text: `${cat.glyph} ${cat.name} — ${ord}`, life: 5, t: 0 });
    return g.festival.lastResult;
  }

  // --- day rollover ------------------------------------------------------
  function newDay(g) {
    g.day++;
    g.stats.days++;
    F.rollPrices(g);
    if (g.effects.seeds) {
      const best = C.CROP_LIST.filter(c => rankOf(g).id >= c.rank).pop();
      if (best) g.seeds[best.id] = (g.seeds[best.id] | 0) + 2;
    }
    tickRivals(g);
    tickChatter(g);

    // Arrivals: people move toward a god who feeds them and has room.
    const v = g.village;
    if (v.huts > v.villagers && v.faith > 42 && v.food > 12 && chance(0.6)) {
      v.villagers++;
      SW.ui.log(g, 'Someone new climbs up out of the cloud and asks to stay.', 'good');
    }
    if (v.unrest > 75 && v.villagers > 1 && chance(0.5)) {
      v.villagers--;
      v.unrest -= 25;
      SW.ui.log(g, 'A family leaves in the night. Word of that travels too.', 'bad');
    }

    SW.world.newDay(g);
    SW.trade.newDay(g);
    SW.relics.checkTitles(g);

    const before = rankOf(g).id;
    checkFeats(g);
    if (g.day >= g.festival.nextDay) runFestival(g);
    checkFeats(g);
    const after = rankOf(g).id;
    if (after > before) {
      const rk = C.RANKS[after];
      SW.discovery.firstTime(g, 'rank:' + rk.id, 6, `being called ${rk.name}`);
      SW.ui.log(g, `The Register lists you as ${rk.name}. ${rk.unlock || ''}`, 'great');
      g.fx.push({ at: 'banner', text: 'RANK · ' + rk.name, life: 5, t: 0 });
    }
  }

  function tick(g, dt) {
    g.tick += dt;
    g.dayTick += dt;
    g.res.focus = clamp(g.res.focus + FOCUS_REGEN * SW.boost.get(g, 'focus') * dt, 0, g.res.focusMax);

    F.tickPlots(g, dt);
    Cr.tick(g, dt);
    SW.lineage.tick(g, dt);
    SW.beast.tick(g, dt);
    SW.world.tick(g, dt);
    tickVillage(g, dt);

    while (g.dayTick >= C.TICKS_PER_DAY) {
      g.dayTick -= C.TICKS_PER_DAY;
      newDay(g);
    }
  }

  /* The mini-games are played, not simulated: they need real frame time, not
   * one update per game-second, or a sweeping marker teleports between four
   * positions and a 0.4-second tone is unhittable. Driven from the render loop
   * and unaffected by game speed or pause. */
  function tickRealtime(g, dt) {
    SW.minigames.tick(g, dt);
    SW.mini2.tick(g, dt);
  }

  /* Catch-up when the tab has been closed. Coarse but honest: the same rules,
   * just stepped in bigger chunks. */
  function runOffline(g) {
    const now = Date.now();
    const elapsed = Math.max(0, Math.floor((now - (g.__savedAt || now)) / 1000));
    const ticks = Math.min(elapsed, OFFLINE_CAP_TICKS);
    if (ticks < 30) return null;
    const before = { renown: g.res.renown, coin: g.res.coin, harvests: g.stats.harvests, day: g.day };
    // Step one tick at a time. Bigger batches skip phases of the creature's
    // act loop, which quietly starves the farm it was trained to run — and the
    // whole point of training it is that it keeps working while you are gone.
    // Four hours is 14,400 iterations, a few tens of milliseconds.
    const quiet = SW.ui.log;
    SW.ui.log = () => {};
    try {
      for (let t = 0; t < ticks; t++) tick(g, 1);
    } finally {
      SW.ui.log = quiet;
    }
    const mins = Math.round(ticks / 60);
    return {
      minutes: mins,
      days: g.day - before.day,
      renown: Math.floor(g.res.renown - before.renown),
      coin: Math.floor(g.res.coin - before.coin),
      harvests: g.stats.harvests - before.harvests
    };
  }

  /* What a competent rival is expected to score at this festival today. Shown
   * to the player so an entry is a decision, not a coin flip. */
  function festivalPar(g, cat) { return cat.par(g.day); }

  SW.sim = {
    COST, rankOf, nextRank, grandeur, tick, tickRealtime, newDay, runOffline, festivalPar,
    playerTill, playerSow, playerWater, playerHarvest, playerForage,
    hutCost, plotCost, buildHut, clearPlot, upgradeShrine, castMiracle,
    standings, checkFeats, festivalScore, runFestival
  };
})(window.SW = window.SW || {});

</script>
<script>
/* Skyward Reach — canvas scene.
 * Everything is drawn procedurally: no image assets, so the creature can
 * physically change shape as you raise it.
 */
(function (SW) {
  'use strict';
  const C = SW.content;
  const C2 = SW.content2;
  const Cr = SW.creature;
  const { clamp, lerp, hashNoise } = SW.core;

  const W = 960, H = 540;
  const UI_FONT = 'ui-sans-serif, system-ui, sans-serif';
  // The island's footprint at terrace 0. Everything on the ground is placed
  // relative to this, and the whole thing scales as terraces go up.
  const ISLAND = { cx: 476, cy: 309, rx: 356, ry: 124 };
  // The part of the frame worth guaranteeing on screen, for a given radius.
  const fitFor = r => ({ w: 700 * r + 90, h: 420 * r + 56, cx: ISLAND.cx, cy: 316 });

  // Island furniture, in logical canvas pixels.
  const GRID = { ox: 408, oy: 232, ax: 46, ay: 23 };
  const WOOD = { x: 214, y: 330 };
  const VILLAGE = { x: 730, y: 344 };
  const SHRINE = { x: 618, y: 240 };
  const DEN = { x: 492, y: 432 };

  let canvas = null, ctx = null, dpr = 1, scale = 1, offX = 0, offY = 0;
  let cssW = 960, cssH = 540, radius = 1;
  let time = 0;
  let hover = -1;
  let selected = -1;
  let hoverFeature = null;

  let attached = false;
  function attach(el) {
    canvas = el;
    ctx = canvas.getContext('2d');
    resize();
    if (!attached) { attached = true; window.addEventListener('resize', resize); }
  }

  function resize() {
    if (!canvas) return;
    const box = canvas.parentElement.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = Math.max(320, box.width);
    const ch = Math.max(200, box.height);
    canvas.width = Math.floor(cw * dpr);
    canvas.height = Math.floor(ch * dpr);
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    cssW = cw; cssH = ch;
    project();
  }

  /* Fit the island's footprint rather than the whole 960x540 frame: the design
   * frame has generous sky margins, and on a narrow stage those margins would
   * shrink the island to a thumbnail. The sky is painted over whatever falls
   * outside, so cropping them costs nothing — and as terraces go up the view
   * pulls back to keep the new ground on screen. */
  function project() {
    const fit = fitFor(radius);
    scale = Math.min(cssW / fit.w, cssH / fit.h);
    offX = cssW / 2 - fit.cx * scale;
    offY = cssH / 2 - fit.cy * scale;
  }

  function toWorld(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return { x: (clientX - r.left - offX) / scale, y: (clientY - r.top - offY) / scale };
  }

  /* Inverse of toWorld: scene coordinates back to viewport coordinates. */
  function toScreen(wx, wy) {
    const r = canvas.getBoundingClientRect();
    return { x: r.left + offX + wx * scale, y: r.top + offY + wy * scale };
  }

  /* Unlock order over the full 6x6 field, sorted outward from the middle, so
   * three plots read as a small farm rather than a diagonal stripe and the
   * field stays compact all the way to thirty-six. The inner 4x4 are exactly
   * the sixteen nearest the centre, which keeps the first terrace's farm
   * where it has always been. */
  const PLOT_CELL = (() => {
    const cells = [];
    for (let y = 0; y < 6; y++) for (let x = 0; x < 6; x++) {
      cells.push({ x, y, d: Math.hypot(x - 2.5, y - 2.5), a: Math.atan2(y - 2.5, x - 2.5) });
    }
    cells.sort((p, q) => (p.d - q.d) || (p.a - q.a));
    return cells.map(c => [c.x, c.y]);
  })();

  function plotCenter(p) {
    const cell = PLOT_CELL[p.i] || [p.gx, p.gy];
    // shift so the inner block sits where the original 4x4 grid did
    const gx = cell[0] - 1 + 0.5, gy = cell[1] - 1 + 0.5;
    return {
      x: GRID.ox + gx * GRID.ax - gy * GRID.ax,
      y: GRID.oy + gx * GRID.ay + gy * GRID.ay
    };
  }

  /* Where a thing sitting at (angle, distance) on the island lands on screen.
   * Distance is in units of the terrace-0 radius, so features stay put as the
   * ground grows out around them. */
  function featurePoint(ang, dist) {
    return {
      x: ISLAND.cx + Math.cos(ang) * dist * ISLAND.rx,
      y: ISLAND.cy + Math.sin(ang) * dist * ISLAND.ry
    };
  }

  function anchorPoint(g, a) {
    if (!a) return { x: DEN.x, y: DEN.y };
    switch (a.kind) {
      case 'plot': {
        const p = g.plots.find(p => p.i === a.i) || g.plots[0];
        return p ? plotCenter(p) : { x: DEN.x, y: DEN.y };
      }
      case 'wood': return { x: WOOD.x + 30, y: WOOD.y + 10 };
      case 'village': return { x: VILLAGE.x - 40, y: VILLAGE.y + 8 };
      case 'shrine': return { x: SHRINE.x, y: SHRINE.y + 46 };
      case 'home': return { x: DEN.x, y: DEN.y };
      default: return { x: 480 + Math.sin(time * 0.3) * 90, y: 400 + Math.cos(time * 0.21) * 30 };
    }
  }

  // --- sky ---------------------------------------------------------------
  const SKY_KEYS = [
    { t: 0.00, top: '#2a2f52', mid: '#7d5f7a', low: '#e6a172', sun: '#ffd9a0', amb: 0.55 },
    { t: 0.18, top: '#4d8fd6', mid: '#9fd0f0', low: '#e9f3fb', sun: '#fff6d8', amb: 1.00 },
    { t: 0.52, top: '#3f81cc', mid: '#8fc6ec', low: '#ecf4fa', sun: '#fff3cf', amb: 1.00 },
    { t: 0.72, top: '#2c3a68', mid: '#a8628a', low: '#f0a86a', sun: '#ffcf94', amb: 0.62 },
    { t: 0.86, top: '#111634', mid: '#222a52', low: '#3a3f68', sun: '#cfd8ff', amb: 0.34 },
    { t: 1.00, top: '#2a2f52', mid: '#7d5f7a', low: '#e6a172', sun: '#ffd9a0', amb: 0.55 }
  ];

  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const r = Math.round(((pa >> 16) & 255) * (1 - t) + ((pb >> 16) & 255) * t);
    const gg = Math.round(((pa >> 8) & 255) * (1 - t) + ((pb >> 8) & 255) * t);
    const bl = Math.round((pa & 255) * (1 - t) + (pb & 255) * t);
    return '#' + ((1 << 24) | (r << 16) | (gg << 8) | bl).toString(16).slice(1);
  }

  function skyAt(t) {
    let a = SKY_KEYS[0], b = SKY_KEYS[1];
    for (let i = 0; i < SKY_KEYS.length - 1; i++) {
      if (t >= SKY_KEYS[i].t && t <= SKY_KEYS[i + 1].t) { a = SKY_KEYS[i]; b = SKY_KEYS[i + 1]; break; }
    }
    const k = (t - a.t) / Math.max(0.0001, b.t - a.t);
    return {
      top: mix(a.top, b.top, k), mid: mix(a.mid, b.mid, k), low: mix(a.low, b.low, k),
      sun: mix(a.sun, b.sun, k), amb: lerp(a.amb, b.amb, k)
    };
  }

  function drawSky(g, sky, t, vw) {
    const grad = ctx.createLinearGradient(0, vw.y0, 0, vw.y1);
    grad.addColorStop(0, sky.top);
    grad.addColorStop(0.55, sky.mid);
    grad.addColorStop(1, sky.low);
    ctx.fillStyle = grad;
    ctx.fillRect(vw.x0, vw.y0, vw.x1 - vw.x0, vw.y1 - vw.y0);

    // Stars fade in after dusk.
    const night = clamp((t - 0.62) / 0.2, 0, 1) * clamp((1.02 - t) / 0.12, 0, 1) + clamp((0.08 - t) / 0.08, 0, 1);
    if (night > 0.01) {
      ctx.save();
      ctx.globalAlpha = clamp(night, 0, 1) * 0.9;
      for (let i = 0; i < 70; i++) {
        const x = vw.x0 + hashNoise(7, i) * (vw.x1 - vw.x0);
        const y = vw.y0 + hashNoise(13, i) * (vw.y1 - vw.y0) * 0.62;
        const s = 0.6 + hashNoise(19, i) * 1.4;
        ctx.globalAlpha = clamp(night, 0, 1) * (0.35 + 0.65 * Math.abs(Math.sin(time * 0.7 + i)));
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x, y, s, s);
      }
      ctx.restore();
    }

    // Rival islands, far off. A reminder there are other gods.
    ctx.save();
    for (let i = 0; i < 5; i++) {
      const span = vw.x1 - vw.x0 + 300;
      const bx = vw.x0 - 150 + ((i * 231 + time * (2 + i)) % span);
      const by = vw.y0 + 40 + hashNoise(3, i) * 140;
      const s = 0.28 + hashNoise(5, i) * 0.3;
      ctx.globalAlpha = 0.13 + 0.1 * s;
      ctx.fillStyle = mix(sky.top, '#000000', 0.25);
      farIsland(bx, by, 120 * s);
    }
    ctx.restore();

    // Clouds.
    ctx.save();
    for (let i = 0; i < 7; i++) {
      const span = vw.x1 - vw.x0 + 400;
      const bx = vw.x0 - 200 + ((i * 173 + time * (5 + i * 1.7)) % span);
      const by = vw.y0 + 20 + hashNoise(11, i) * (vw.y1 - vw.y0) * 0.55;
      const s = 0.5 + hashNoise(17, i) * 0.8;
      ctx.globalAlpha = 0.16 + 0.12 * hashNoise(23, i);
      ctx.fillStyle = '#ffffff';
      cloud(bx, by, 70 * s);
    }
    ctx.restore();

    // Sun / moon on an arc, glared over everything else in the sky.
    const ang = Math.PI * (t * 2 - 0.15);
    const cx = W * 0.5 - Math.cos(ang) * W * 0.42;
    const cy = H * 0.72 - Math.sin(ang) * H * 0.62;
    ctx.save();
