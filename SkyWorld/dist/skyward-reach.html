<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skyward Reach</title>
<meta name="description" content="Raise a creature that learns from praise and punishment, farm a floating island, and grind your way up the Skyward Register.">
<style>
/* Skyward Reach — interface skin. */
:root {
  --bg: #080b13;
  --panel: #111725;
  --panel-2: #161d2e;
  --line: #232c44;
  --line-soft: #1a2134;
  --ink: #e2e8f6;
  --dim: #8b96b1;
  --dimmer: #5d6782;
  --gold: #e7c66a;
  --good: #7ee787;
  --bad: #ff8f8f;
  --warn: #e6ac4d;
  --great: #d2a8ff;
  --radius: 10px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
h1, h2 { font-family: var(--serif); font-weight: 600; letter-spacing: 0.01em; }
button { font: inherit; color: inherit; cursor: pointer; }
kbd {
  font: 600 10px/1 var(--sans); background: rgba(255,255,255,0.12);
  border-radius: 3px; padding: 2px 4px; margin-left: 5px; vertical-align: middle;
}

#app {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}

/* ---------- top bar ---------- */
#topbar {
  display: flex; align-items: center; gap: 20px;
  padding: 8px 14px;
  background: linear-gradient(180deg, #141b2c, #0d1220);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 9px; min-width: 168px; }
.brand-mark { font-size: 22px; }
.brand b { font-family: var(--serif); font-size: 16px; display: block; letter-spacing: 0.02em; }
.brand span { color: var(--dim); font-size: 11px; margin-right: 8px; text-transform: uppercase; letter-spacing: 0.08em; }

.res { display: flex; gap: 6px; flex-wrap: wrap; }
.res .r {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 11px 4px 8px; font-size: 13px;
}
.res .r i { font-style: normal; font-size: 13px; opacity: 0.95; }
.res .r b { font-variant-numeric: tabular-nums; }
.res .renown b { color: var(--gold); }
.res .focus { position: relative; padding-bottom: 5px; }
.focus-track {
  position: absolute; left: 8px; right: 8px; bottom: 3px; height: 2px;
  background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;
}
#focus-fill { display: block; height: 100%; background: var(--gold); transition: width 0.2s linear; }

.rank { min-width: 178px; flex: 1; max-width: 300px; }
.rank-line { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; }
.rank-line b { font-family: var(--serif); font-size: 15px; }
.rank-line span { color: var(--dim); font-variant-numeric: tabular-nums; }
.rank-track { height: 4px; background: rgba(255,255,255,0.08); border-radius: 3px; margin: 3px 0 2px; overflow: hidden; }
#rank-fill { height: 100%; width: 0; background: var(--gold); transition: width 0.3s; }
.rank-next { font-size: 10.5px; color: var(--dimmer); text-transform: uppercase; letter-spacing: 0.06em; }

.ctrl { display: flex; gap: 4px; margin-left: auto; }
.ctrl button {
  background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
  min-width: 34px; height: 30px; font-size: 12px; font-weight: 600;
}
.ctrl button:hover { border-color: #3d4a6c; background: var(--panel-2); }
.ctrl button.on { background: rgba(231,198,106,0.16); border-color: var(--gold); color: var(--gold); }

/* ---------- main columns ---------- */
main {
  display: grid;
  grid-template-columns: 306px minmax(0, 1fr) 330px;
  min-height: 0;
}
aside {
  background: var(--panel);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  overflow-x: hidden;
}
#right { border-right: none; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
aside::-webkit-scrollbar, #log::-webkit-scrollbar { width: 8px; }
aside::-webkit-scrollbar-thumb, #log::-webkit-scrollbar-thumb { background: #263049; border-radius: 4px; }

/* ---------- stage ---------- */
#stage { position: relative; min-width: 0; background: #06080f; overflow: hidden; }
#scene { display: block; width: 100%; height: 100%; }

#actionbar {
  position: absolute; left: 12px; right: 12px; bottom: 12px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: rgba(10,13,22,0.82);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 8px 10px; backdrop-filter: blur(6px);
}
.ab-title { font-family: var(--serif); font-size: 14px; margin-right: 4px; }
.ab-hint { color: var(--dim); font-size: 12px; }

#judge {
  position: absolute; left: 50%; transform: translateX(-50%) translateY(-8px);
  top: 14px; width: min(400px, 92%);
  background: rgba(12,15,26,0.9); border: 1px solid var(--gold);
  border-radius: var(--radius); padding: 10px 12px;
  opacity: 0; pointer-events: none; transition: opacity 0.16s, transform 0.16s;
  box-shadow: 0 10px 34px rgba(0,0,0,0.5);
}
#judge.on { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
#judge-what { font-size: 13px; text-align: center; margin-bottom: 7px; }
.judge-track { height: 3px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
#judge-fill { height: 100%; background: var(--gold); }
.judge-btns { display: flex; gap: 8px; }
.judge-btns button {
  flex: 1; border-radius: 8px; padding: 9px; font-weight: 600; font-size: 13px;
  border: 1px solid var(--line); background: var(--panel-2);
}
.judge-btns .praise { border-color: #2f6b3d; background: rgba(126,231,135,0.13); color: #b6f0bd; }
.judge-btns .praise:hover { background: rgba(126,231,135,0.24); }
.judge-btns .scold { border-color: #6f2f36; background: rgba(255,143,143,0.12); color: #f5b7b7; }
.judge-btns .scold:hover { background: rgba(255,143,143,0.23); }

/* ---------- creature card ---------- */
#card { padding: 12px; }
.card-head { border-bottom: 1px solid var(--line-soft); padding-bottom: 9px; margin-bottom: 10px; }
.card-title { display: flex; gap: 10px; align-items: center; }
.lineage-glyph { font-size: 30px; line-height: 1; }
.card-title h2 { margin: 0; font-size: 19px; }
.card-title p { margin: 1px 0 0; font-size: 11.5px; color: var(--dim); }
.doing {
  margin-top: 8px; font-size: 12px; color: var(--gold);
  background: rgba(231,198,106,0.08); border: 1px solid rgba(231,198,106,0.22);
  border-radius: 6px; padding: 4px 8px;
}

.bars { display: grid; gap: 6px; margin-bottom: 10px; }
.bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); }
.bar-label span:last-child { font-variant-numeric: tabular-nums; color: var(--ink); }
.bar-track { height: 5px; background: rgba(255,255,255,0.07); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--dim); transition: width 0.25s; }
.bar.food .bar-fill { background: #e0b45c; }
.bar.vigor .bar-fill { background: #6bbf8a; }
.bar.mood .bar-fill { background: #74a9e6; }
.bar.bond .bar-fill { background: #e08fb9; }
.bar.faith .bar-fill { background: #f0d68a; }
.bar.awe .bar-fill { background: #a58ce4; }
.bar.danger .bar-fill { background: var(--bad); }

.axis { margin-bottom: 9px; }
.axis-head { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--dimmer); text-transform: uppercase; letter-spacing: 0.05em; }
.axis-head b { color: var(--dim); }
.axis-track { position: relative; height: 5px; margin-top: 3px; border-radius: 3px;
  background: linear-gradient(90deg, #6d2b34, #2b3145, #3d6b4a); }
.axis-mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: rgba(255,255,255,0.25); }
.axis-knob {
  position: absolute; top: -3px; width: 11px; height: 11px; margin-left: -5.5px;
  border-radius: 50%; background: var(--ink); border: 2px solid #0d1220; transition: left 0.3s;
}

.statline { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim);
  padding: 7px 0; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); margin-bottom: 10px; }
.statline span { font-variant-numeric: tabular-nums; }

.section-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.11em;
  color: var(--dimmer); margin: 12px 0 6px;
}
.leash-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.leash-btn {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px;
  padding: 6px 2px; font-size: 15px; display: grid; gap: 2px; line-height: 1.1;
}
.leash-btn span { font-size: 9px; color: var(--dim); }
.leash-btn.on { border-color: var(--gold); background: rgba(231,198,106,0.14); }
.leash-btn.on span { color: var(--gold); }
.leash-desc { font-size: 11px; color: var(--dim); margin: 6px 0 0; }

.trainlist { display: grid; gap: 3px; }
.train { display: grid; grid-template-columns: 18px 1fr 54px 30px; align-items: center; gap: 6px; font-size: 11.5px; }
.train-name { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.train-bar { height: 4px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; }
.train-bar i { display: block; height: 100%; background: var(--good); transition: width 0.3s; }
.train.vice .train-bar i { background: var(--bad); }
.train-pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--dimmer); font-size: 10.5px; }

.feedrow, .seedbag { display: flex; gap: 5px; flex-wrap: wrap; }
.chip {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 10px; font-size: 12px;
}
.chip i { font-style: normal; color: var(--dimmer); font-size: 10.5px; }
.chip:disabled, .chip.dim { opacity: 0.4; cursor: default; }
.chip:not(:disabled):hover { border-color: var(--gold); }

.tiny { font-size: 10.5px; color: var(--dimmer); margin: 8px 0 0; }
.hint { font-size: 12px; color: var(--dim); margin: 0 0 10px; }

/* ---------- right panel ---------- */
.tabs { display: grid; grid-template-columns: repeat(6, 1fr); border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.tab { background: transparent; border: none; border-bottom: 2px solid transparent; padding: 10px 0; font-size: 16px; opacity: 0.55; }
.tab:hover { opacity: 0.85; background: rgba(255,255,255,0.03); }
.tab.on { opacity: 1; border-bottom-color: var(--gold); background: rgba(231,198,106,0.07); }
#panel-body { padding: 12px; overflow-y: auto; flex: 1 1 auto; }

.btn {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 11px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover:not(:disabled) { border-color: var(--gold); background: #1c2439; }
.btn:disabled, .btn.off { opacity: 0.42; cursor: default; }
.btn.hot { border-color: var(--gold); background: rgba(231,198,106,0.15); color: #ffe9a8; }
.btn.big { width: 100%; justify-content: center; padding: 11px; font-size: 14px; margin-top: 14px; }
.btn.danger { border-color: #5c2a30; color: #f0a9a9; }
.btn .cost { color: var(--dimmer); font-size: 10.5px; margin-left: auto; }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.btnrow.col { flex-direction: column; }
.btnrow.col .btn { width: 100%; }

.plotlist { display: grid; gap: 2px; margin-bottom: 6px; }
.plotrow {
  display: grid; grid-template-columns: 20px 1fr 46px 44px; gap: 6px; align-items: center;
  font-size: 11.5px; padding: 4px 6px; border-radius: 5px; cursor: pointer;
  border: 1px solid transparent;
}
.plotrow:hover { background: rgba(255,255,255,0.04); }
.plotrow.sel { border-color: var(--gold); background: rgba(231,198,106,0.08); }
.pr-i { color: var(--dimmer); font-variant-numeric: tabular-nums; }
.pr-state { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr-prog { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
.pr-prog.ripe { color: var(--gold); font-weight: 700; }
.pr-water { text-align: right; color: var(--dimmer); font-size: 10.5px; }

table.register { width: 100%; border-collapse: collapse; font-size: 12px; }

.mkrow { border-top: 1px solid var(--line-soft); padding: 7px 0; }
.mkrow.locked { opacity: 0.5; }
.mk-top { display: flex; justify-content: space-between; align-items: baseline; }
.mk-title { font-size: 13px; }
.mk-price { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--gold); }
.mk-price i { font-style: normal; font-size: 9.5px; color: var(--dimmer); margin-left: 4px; letter-spacing: 0.04em; }
.mk-bot { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
.mk-held { font-size: 11px; color: var(--dim); margin-right: 3px; }
.mk-held b { color: var(--ink); font-variant-numeric: tabular-nums; }
.mk-lock { font-size: 10.5px; color: var(--dimmer); }
.mini.seed { border-style: dashed; }
.mini {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px;
  padding: 3px 6px; font-size: 11px; margin-right: 3px;
}
.mini i { font-style: normal; color: var(--dimmer); font-size: 9.5px; }
.mini:hover:not(:disabled) { border-color: var(--gold); }
.mini:disabled { opacity: 0.35; cursor: default; }
.up { color: var(--good); font-size: 9px; }
.down { color: var(--bad); font-size: 9px; }

.miracles { display: grid; gap: 6px; }
.miracle {
  display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 9px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 11px; text-align: left;
}
.miracle:hover:not(:disabled) { border-color: var(--gold); }
.miracle.off { opacity: 0.5; }
.mi-glyph { font-size: 19px; }
.mi-body b { display: block; font-size: 13px; }
.mi-body i { font-style: normal; font-size: 11px; color: var(--dim); }
.mi-cost { font-size: 12px; color: var(--gold); font-variant-numeric: tabular-nums; }

.fest { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--panel-2); }
.fest-head { display: flex; align-items: baseline; gap: 7px; font-size: 14px; font-family: var(--serif); }
.fest-head span { margin-left: auto; font-family: var(--sans); font-size: 11px; color: var(--gold); }
.fest p { margin: 6px 0 0; font-size: 11.5px; color: var(--dim); }
.fest-result { margin-top: 8px; font-size: 11.5px; color: var(--dim); border-left: 2px solid var(--gold); padding-left: 8px; }
.fest-field { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.fest-field span { font-size: 10px; background: var(--panel-2); border-radius: 4px; padding: 2px 5px; }
.fest-field .you { background: rgba(231,198,106,0.2); color: var(--gold); }

table.register td { padding: 4px 3px; border-top: 1px solid var(--line-soft); }
table.register tr.you td { background: rgba(231,198,106,0.1); color: var(--gold); font-weight: 600; }
.rg-place { width: 22px; color: var(--dimmer); font-variant-numeric: tabular-nums; }
tr.you .rg-place { color: var(--gold); }
.rg-renown { text-align: right; font-variant-numeric: tabular-nums; }

.chatter { display: grid; gap: 5px; }
.ch { font-size: 11.5px; color: var(--dim); border-left: 2px solid var(--line); padding-left: 7px; }
.ch i { font-style: normal; color: var(--dimmer); font-size: 10px; margin-right: 5px; }
.ch.behind { border-left-color: #3d7a4c; }
.ch.ahead { border-left-color: #7a3d3d; }
.ch.near { border-left-color: var(--gold); }

.feats { display: grid; gap: 3px; }
.feat { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center; opacity: 0.5; padding: 3px 0; }
.feat.got { opacity: 1; }
.ft-mark { color: var(--gold); }
.ft-body b { display: block; font-size: 12px; }
.ft-body i { font-style: normal; font-size: 10.5px; color: var(--dimmer); }
.ft-renown { font-size: 11px; color: var(--gold); font-variant-numeric: tabular-nums; }
.trophies { display: flex; flex-wrap: wrap; gap: 4px; }
.trophy { font-size: 10.5px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
.trophy.p1 { border-color: var(--gold); }

/* ---------- log ---------- */
#logbar { border-top: 1px solid var(--line); background: #0c111c; }
#log { height: 94px; overflow-y: auto; padding: 7px 14px; display: flex; flex-direction: column; }
.li { font-size: 11.5px; color: var(--dim); padding: 1px 0; }
.li i { font-style: normal; color: var(--dimmer); margin-right: 7px; font-size: 10px; }
.li.good { color: #a5dcae; }
.li.bad { color: #eda3a3; }
.li.warn { color: var(--warn); }
.li.great { color: var(--great); }
.li.creature { color: #b9c6e4; }

/* ---------- modal ---------- */
#modal {
  position: fixed; inset: 0; background: rgba(4,6,12,0.78);
  display: none; align-items: center; justify-content: center; padding: 20px;
  z-index: 50; backdrop-filter: blur(4px);
}
#modal.on { display: flex; }
.sheet {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 22px; width: min(460px, 100%); max-height: 90vh; overflow-y: auto;
  box-shadow: 0 24px 70px rgba(0,0,0,0.6);
}
.sheet.wide { width: min(720px, 100%); }
.sheet h1 { margin: 0 0 8px; font-size: 25px; }
.lede { color: var(--dim); font-size: 13px; margin: 0 0 12px; }
.help p { font-size: 12.5px; color: var(--dim); margin: 0 0 10px; }
.help b { color: var(--ink); }

.hatch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hatch-card {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 10px; text-align: center; display: grid; gap: 5px;
}
.hatch-card:hover { border-color: #46527a; }
.hatch-card.on { border-color: var(--gold); background: rgba(231,198,106,0.1); }
.hg { font-size: 30px; }
.hatch-card b { font-family: var(--serif); font-size: 14px; }
.hatch-card i { font-style: normal; font-size: 11px; color: var(--dim); }
.hstat { font-size: 10.5px; color: var(--dimmer); }

.namerow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.namerow label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dimmer); display: grid; gap: 4px; }
.namerow input {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px;
  color: var(--ink); padding: 8px 10px; font: 14px var(--sans); text-transform: none; letter-spacing: 0;
}
.namerow input:focus { outline: none; border-color: var(--gold); }

.offgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.offgrid div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 12px; text-align: center; }
.offgrid b { display: block; font-size: 21px; font-family: var(--serif); color: var(--gold); }
.offgrid i { font-style: normal; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dimmer); }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  main { grid-template-columns: 268px minmax(0, 1fr) 288px; }
}
@media (max-width: 980px) {
  body { overflow: auto; }
  #app { height: auto; min-height: 100%; }
  main { grid-template-columns: 1fr; }
  aside { border-right: none; border-left: none; border-top: 1px solid var(--line); max-height: none; }
  /* The scene is where you praise, strike and work plots, so it leads. */
  #stage { order: -2; height: 62vh; min-height: 340px; }
  #right { order: -1; }
  #log { height: 74px; }
  #topbar { gap: 10px; }
  .rank { max-width: none; }
  .ctrl { margin-left: 0; }
}
@media (max-width: 560px) {
  /* Portrait phones: the island is width-bound, so a tall stage is just sky. */
  #stage { height: 46vh; min-height: 270px; }
  #actionbar { left: 8px; right: 8px; bottom: 8px; }
}

</style>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">⛅</span>
      <div>
        <b>Skyward Reach</b>
        <span id="hud-day">Day 1</span><span id="hud-clock">dawn</span>
      </div>
    </div>

    <div class="res">
      <span class="r" title="Coin"><i>🪙</i><b id="res-coin">0</b></span>
      <span class="r" title="Wood"><i>🪵</i><b id="res-wood">0</b></span>
      <span class="r" title="Prayer"><i>🙏</i><b id="res-prayer">0</b></span>
      <span class="r renown" title="Renown — the only score anyone counts"><i>👁️</i><b id="res-renown">0</b></span>
      <span class="r focus" title="Focus — your own stamina; it regenerates">

<script>
/* Skyward Reach — small shared helpers: RNG, math, formatting, persistence. */
(function (SW) {
  'use strict';

  const SAVE_KEY = 'skyward-reach/save/v1';
  const SAVE_VERSION = 1;

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const rndInt = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const chance = p => Math.random() < p;

  /* Deterministic hash-based noise, so rivals behave the same across reloads
   * without us having to persist their whole random walk. */
  function hashNoise(seed, n) {
    let h = (seed * 374761393 + n * 668265263) >>> 0;
    h = (h ^ (h >>> 13)) >>> 0;
    h = Math.imul(h, 1274126177) >>> 0;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  function fmt(n) {
    n = Math.floor(n);
    if (n < 1000) return String(n);
    if (n < 1e6) return (n / 1000).toFixed(n < 1e4 ? 2 : 1).replace(/\.0+$/, '') + 'k';
    return (n / 1e6).toFixed(2).replace(/\.0+$/, '') + 'M';
  }
  const pct = v => Math.round(v * 100) + '%';

  function titleCase(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // --- persistence -------------------------------------------------------
  function save(game) {
    try {
      const payload = { v: SAVE_VERSION, t: Date.now(), g: game };
      localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
      return true;
    } catch (e) {
      console.warn('[skyward] save failed', e);
      return false;
    }
  }

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const payload = JSON.parse(raw);
      if (!payload || payload.v !== SAVE_VERSION || !payload.g) return null;
      payload.g.__savedAt = payload.t || Date.now();
      return payload.g;
    } catch (e) {
      console.warn('[skyward] load failed', e);
      return null;
    }
  }

  function wipe() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
  }

  function exportSave(game) {
    return btoa(unescape(encodeURIComponent(JSON.stringify({ v: SAVE_VERSION, t: Date.now(), g: game }))));
  }

  function importSave(text) {
    const payload = JSON.parse(decodeURIComponent(escape(atob(text.trim()))));
    if (!payload || payload.v !== SAVE_VERSION || !payload.g) throw new Error('unrecognised save');
    return payload.g;
  }

  SW.core = {
    SAVE_KEY, clamp, lerp, rnd, rndInt, pick, chance, hashNoise,
    fmt, pct, titleCase, save, load, wipe, exportSave, importSave
  };
})(window.SW = window.SW || {});

</script>

<script>
/* Skyward Reach — game state shape, new-game construction, save migration. */
(function (SW) {
  'use strict';
  const C = SW.content;
  const { clamp } = SW.core;

  const GRID_W = 4, GRID_H = 4;
  const MAX_PLOTS = GRID_W * GRID_H;
  const START_PLOTS = 3;

  function makePlot(index) {
    return {
      i: index,
      gx: index % GRID_W,
      gy: Math.floor(index / GRID_W),
      state: 'raw',   // raw | tilled | growing | ripe
      crop: null,
      growth: 0,      // ticks accumulated
      water: 0,       // 0..100
      rot: 0          // wither pressure 0..100
    };
  }

  function newCreature(lineageId, name) {
    const L = C.LINEAGES[lineageId];
    const weights = {};
    for (const id of C.TRAINABLE) weights[id] = 1.0;
    weights.wander = 1.0;
    for (const k in L.instinct) weights[k] = L.instinct[k];
    return {
      lineage: lineageId,
      name: name || L.name,
      hunger: 70,      // 0 starving .. 100 stuffed
      vigor: 90,       // 0 exhausted .. 100 fresh
      mood: 70,        // 0 miserable .. 100 delighted
      bond: 20,        // 0 .. 100
      kind: 0,         // -100 cruel .. +100 kind
      diligence: 0,    // -100 idle .. +100 industrious
      size: 1.0,
      stats: { strength: L.base.strength, cunning: L.base.cunning, grace: L.base.grace },
      weights: weights,
      leash: 'none',
      // transient-ish, but persisted so a reload doesn't eat a pending praise
      act: null,       // { id, tick, target, resolved }
      actCooldown: 0,
      pending: null,   // { act, expires } — the praise/scold window
      // scene position, in the renderer's logical canvas pixels
      x: 470, y: 452, tx: 470, ty: 452,
      fed: 0, praised: 0, scolded: 0, chores: 0
    };
  }

  function newGame(lineageId, creatureName, godName) {
    const plots = [];
    for (let i = 0; i < MAX_PLOTS; i++) plots.push(makePlot(i));

    const rivals = C.RIVALS.map((r, i) => ({
      name: r.name, pace: r.pace, spike: r.spike, tone: r.tone,
      renown: 140 + i * 130, seed: 1000 + i * 77
    }));

    const prices = {};
    for (const c of C.CROP_LIST) prices[c.id] = 1;

    return {
      version: 1,
      godName: godName || 'the Nameless',
      tick: 0,
      day: 1,
      dayTick: 0,
      speed: 1,
      paused: false,

      res: { coin: 40, wood: 5, prayer: 0, focus: 24, focusMax: 24, renown: 0 },
      seeds: { sunwheat: 6, glimmerroot: 0, duskberry: 0, aetherbloom: 0 },
      stock: { sunwheat: 0, glimmerroot: 0, duskberry: 0, aetherbloom: 0 },
      prices: prices,

      plots: plots.slice(0, START_PLOTS),
      lockedPlots: plots.slice(START_PLOTS),

      village: { villagers: 3, huts: 3, faith: 20, awe: 5, food: 8, unrest: 0 },
      shrine: 0,

      creature: newCreature(lineageId, creatureName),

      rivals: rivals,
      lastStanding: 0,
      feats: {},                 // id -> day earned
      trophies: [],              // { fest, place, day }
      festival: { nextDay: 5, index: 0, lastResult: null },
      log: [],
      chatter: [],
      stats: { harvests: 0, sold: 0, coinEarned: 0, miracles: 0, festivals: 0, festivalWins: 0, days: 0 },
      fx: [],
      __savedAt: Date.now()

  }

  /* Bring an older/partial save up to the current shape without losing progress. */
  function hydrate(g) {
    if (!g || typeof g !== 'object') return null;
    const fresh = newGame('mossback', 'x', 'x');
    const fill = (target, source) => {
      for (const k in source) {
        if (target[k] === undefined) target[k] = source[k];
        else if (source[k] && typeof source[k] === 'object' && !Array.isArray(source[k]) &&
                 target[k] && typeof target[k] === 'object') fill(target[k], source[k]);
      }
    };
    fill(g, fresh);
    if (!C.LINEAGES[g.creature.lineage]) g.creature.lineage = 'mossback';
    for (const id of C.TRAINABLE) if (typeof g.creature.weights[id] !== 'number') g.creature.weights[id] = 1;
    g.creature.hunger = clamp(g.creature.hunger, 0, 100);
    g.creature.vigor = clamp(g.creature.vigor, 0, 100);
    g.fx = [];
    return g;
  }

  SW.state = { GRID_W, GRID_H, MAX_PLOTS, makePlot, newCreature, newGame, hydrate };

<script>
/* Skyward Reach — plots, crops and the market.
 * Shared by the player's hand and by the creature, so both go through the
 * same rules: whoever swings the hoe, the soil behaves identically.
 */
(function (SW) {
  'use strict';
  const C = SW.content;
  const { clamp, chance } = SW.core;

  // --- queries -----------------------------------------------------------
  const plotsWhere = (g, fn) => g.plots.filter(fn);
  const rawPlots     = g => plotsWhere(g, p => p.state === 'raw');
  const tilledPlots  = g => plotsWhere(g, p => p.state === 'tilled');
  const growingPlots = g => plotsWhere(g, p => p.state === 'growing');
  const ripePlots    = g => plotsWhere(g, p => p.state === 'ripe');

  function thirstiest(g) {
    const cand = plotsWhere(g, p => (p.state === 'growing' || p.state === 'ripe') && p.water < 80);
    if (!cand.length) return null;
    return cand.reduce((a, b) => (a.water <= b.water ? a : b));
  }

  function bestSeed(g) {
    // The creature sows the most valuable seed it has enough of.
    let best = null;
    for (const c of C.CROP_LIST) {
      if ((g.seeds[c.id] | 0) > 0 && (!best || c.price > best.price)) best = c;
    }
    return best;
  }

  function seedCount(g) {
    let n = 0;
    for (const k in g.seeds) n += g.seeds[k] | 0;
    return n;
  }

  function stockCount(g) {
    let n = 0;
    for (const k in g.stock) n += g.stock[k] | 0;
    return n;
  }

  function bestStock(g) {
    let best = null;
    for (const c of C.CROP_LIST) {
      if ((g.stock[c.id] | 0) > 0 && (!best || c.price > best.price)) best = c;
    }
    return best;
  }

  // --- mutations ---------------------------------------------------------
  function till(g, plot) {
    if (!plot || plot.state !== 'raw') return false;
    plot.state = 'tilled';
    plot.rot = 0;
    return true;
  }

  function sow(g, plot, cropId) {
    if (!plot || plot.state !== 'tilled') return false;
    if ((g.seeds[cropId] | 0) <= 0) return false;
    g.seeds[cropId]--;
    plot.state = 'growing';
    plot.crop = cropId;
    plot.growth = 0;
    plot.water = Math.max(plot.water, 45);
    plot.rot = 0;
    return true;
  }

  function water(g, plot) {
    if (!plot || (plot.state !== 'growing' && plot.state !== 'ripe')) return false;
    if (plot.water >= 99) return false;
    plot.water = 100;
    plot.rot = Math.max(0, plot.rot - 25);
    return true;
  }

  /* Returns the crop definition harvested, or null. `bonus` scales the yield —
   * a strong creature brings in more than a careless one. */
  function harvest(g, plot, bonus) {
    if (!plot || plot.state !== 'ripe') return null;
    const crop = C.CROPS[plot.crop];
    const spoil = plot.rot > 55 ? 0.5 : 1;
    const amount = Math.max(1, Math.round(crop.yield * (bonus || 1) * spoil));
    g.stock[crop.id] = (g.stock[crop.id] | 0) + amount;
    g.stats.harvests += amount;
    plot.state = 'tilled';
    plot.crop = null;
    plot.growth = 0;
    plot.rot = 0;
    plot.water = Math.max(0, plot.water - 20);
    return { crop, amount };
  }

  /* Something ate the crop in the ground. Nobody gets paid. */
  function devour(g, plot) {
    if (!plot || (plot.state !== 'growing' && plot.state !== 'ripe')) return null;
    const crop = C.CROPS[plot.crop];
    const ripeness = plot.state === 'ripe' ? 1 : clamp(plot.growth / crop.growTicks, 0.2, 1);
    plot.state = 'tilled';
    plot.crop = null;
    plot.growth = 0;
    plot.rot = 0;
    return { crop, ripeness };
  }

  // --- per-tick simulation ----------------------------------------------
  function tickPlots(g, dt) {
    for (const p of g.plots) {
      if (p.state === 'growing' || p.state === 'ripe') {
        const crop = C.CROPS[p.crop];
        p.water = clamp(p.water - crop.thirst * dt, 0, 100);
        if (p.state === 'growing') {
          // Dry soil stalls growth rather than stopping it dead.
          const rate = p.water > 20 ? 1 : p.water > 0 ? 0.35 : 0.1;
          p.growth += rate * dt;
          if (p.growth >= crop.growTicks) { p.state = 'ripe'; p.growth = crop.growTicks; }
        } else {
          // Ripe crops left in the field start to go over.
          p.rot = clamp(p.rot + 0.55 * dt, 0, 100);
        }
        if (p.water <= 0) p.rot = clamp(p.rot + 0.8 * dt, 0, 100);
        if (p.rot >= 100 && chance(0.05 * dt)) {
          p.state = 'tilled'; p.crop = null; p.growth = 0; p.rot = 0;
          SW.ui && SW.ui.log(g, 'A crop withered to nothing in the dry.', 'bad');
        }
      }
    }
  }

  // --- market ------------------------------------------------------------
  function price(g, cropId) {
    return Math.max(1, Math.round(C.CROPS[cropId].price * (g.prices[cropId] || 1)));
  }

  function rollPrices(g) {
    for (const c of C.CROP_LIST) {
      const drift = (Math.random() - 0.5) * 0.34;
      g.prices[c.id] = clamp((g.prices[c.id] || 1) * 0.55 + (1 + drift) * 0.45, 0.62, 1.55);
    }
  }

  function sell(g, cropId, count) {
    const have = g.stock[cropId] | 0;
    const n = Math.min(have, count);
    if (n <= 0) return 0;
    const gain = price(g, cropId) * n;
    g.stock[cropId] -= n;
    g.res.coin += gain;
    g.stats.sold += n;
    g.stats.coinEarned += gain;
    return gain;
  }

  function buySeed(g, cropId, count) {
    const crop = C.CROPS[cropId];
    const unit = Math.max(1, Math.round(crop.seedCost * (0.75 + 0.35 * (g.prices[cropId] || 1))));
    const affordable = Math.min(count, Math.floor(g.res.coin / unit));
    if (affordable <= 0) return 0;
    g.res.coin -= unit * affordable;
    g.seeds[cropId] = (g.seeds[cropId] | 0) + affordable;
    return affordable;
  }

  function seedPrice(g, cropId) {
    const crop = C.CROPS[cropId];
    return Math.max(1, Math.round(crop.seedCost * (0.75 + 0.35 * (g.prices[cropId] || 1))));
  }

  /* Timber, bought rather than hauled. Coin needs a sink and wood is the
   * bottleneck on every structure you actually want. */
  const WOOD_PRICE = 12;
  function buyWood(g, count) {
    const affordable = Math.min(count, Math.floor(g.res.coin / WOOD_PRICE));
    if (affordable <= 0) return 0;
    g.res.coin -= WOOD_PRICE * affordable;
    g.res.wood += affordable;
    return affordable;
  }

  /* Crops into the granary. Villagers eat food, not raw duskberries. */
  function mill(g, cropId, count) {
    const have = g.stock[cropId] | 0;
    const n = Math.min(have, count);
    if (n <= 0) return 0;
    g.stock[cropId] -= n;
    const food = C.CROPS[cropId].feed * n;
    g.village.food += food;
    return food;
  }

  SW.farm = {
    rawPlots, tilledPlots, growingPlots, ripePlots, thirstiest, bestSeed, bestStock,
    seedCount, stockCount, till, sow, water, harvest, devour, tickPlots,
    price, seedPrice, rollPrices, sell, buySeed, mill, buyWood, WOOD_PRICE
  };
})(window.SW = window.SW || {});

</script>
<script>
/* Skyward Reach — the creature's brain.
 *
 * The whole design rests here. The creature is never commanded. It picks an
 * act by softmax over learned weights, does it in front of you, and then you
 * get a short window to praise or scold. Praise multiplies the weight for
 * that act; scolding divides it and makes the creature a little meaner.
 * Everything you eventually get for free — a watered, harvested, self-running
 * farm — is something you had to sit and teach.
 */
(function (SW) {
  'use strict';
  const C = SW.content;
  const F = SW.farm;
  const { clamp, rnd, rndInt, chance, pick } = SW.core;

  const W_MIN = 0.08, W_MAX = 14;
  const PRAISE_WINDOW = 9;   // ticks you have to react

  const lineage = g => C.LINEAGES[g.creature.lineage];

  /* Display value: how well it knows a chore, 0..1. */
  function mastery(g, actId) {
    const w = g.creature.weights[actId] || 0;
    return clamp(1 - 1 / (1 + w / 2.5), 0, 1);
  }

  function masteredCount(g, threshold) {
    let n = 0;
    for (const id of C.TRAINABLE) {
      if (C.ACTS[id].useful && mastery(g, id) >= threshold) n++;
    }
    return n;
  }

  const FARM_CHORES = ['water', 'harvest', 'sow', 'till', 'forage'];
  function farmChoresMastered(g, threshold) {
    return FARM_CHORES.every(id => mastery(g, id) >= threshold);
  }

  function learnRate(g) {
    const c = g.creature;
    const fear = c.mood < 25 ? 0.55 : 1;          // a terrified beast learns badly
    return 1 + 0.26 * lineage(g).wits * (0.55 + c.bond / 140) * fear;
  }

  // --- feasibility -------------------------------------------------------
  /* Each entry answers "can it do this right now, and at what". */
  const FEASIBLE = {
    water:   g => { const p = F.thirstiest(g); return p ? { kind: 'plot', i: p.i } : null; },
    harvest: g => { const p = F.ripePlots(g)[0]; return p ? { kind: 'plot', i: p.i } : null; },
    till:    g => { const p = F.rawPlots(g)[0]; return p ? { kind: 'plot', i: p.i } : null; },
    sow:     g => { const p = F.tilledPlots(g)[0]; return p && F.bestSeed(g) ? { kind: 'plot', i: p.i } : null; },
    forage:  g => ({ kind: 'wood' }),
    tithe:   g => (F.stockCount(g) > 0 && g.village.food < 60 ? { kind: 'village' } : null),
    play:    g => (g.village.villagers > 0 ? { kind: 'village' } : null),
    perform: g => (g.village.villagers > 0 && g.creature.bond >= 25 ? { kind: 'shrine' } : null),
    graze:   g => { const p = F.ripePlots(g)[0] || F.growingPlots(g)[0]; return p ? { kind: 'plot', i: p.i } : null; },
    feast:   g => (g.village.food >= 4 ? { kind: 'village' } : null),
    terrorize: g => (g.village.villagers > 0 ? { kind: 'village' } : null),
    rest:    g => ({ kind: 'home' }),
    wander:  g => ({ kind: 'roam' })
  };

  /* Situational multipliers layered on top of the learned weight. Needs win
   * over training: a starving creature will eat your field no matter what it
   * was taught, which is exactly the lesson. */
  function drive(g, actId) {
    const c = g.creature;
    const a = C.ACTS[actId];
    let m = 1;

    if (a.vigor > 0 && c.vigor < a.vigor * 1.6) m *= 0.25;
    if (a.vigor > 0 && c.vigor < a.vigor) return 0;

    if (actId === 'graze' || actId === 'feast') {
      m *= 1 + Math.pow(clamp((55 - c.hunger) / 55, 0, 1), 1.6) * 7;
      if (c.hunger > 78) m *= 0.18;
    }
    if (actId === 'rest') {
      m *= 1 + Math.pow(clamp((50 - c.vigor) / 50, 0, 1), 1.5) * 8;
      if (c.vigor > 82) m *= 0.1;
    }
    if (actId === 'play' || actId === 'wander') {
      m *= 1 + clamp((45 - c.mood) / 45, 0, 1) * 2.2;
    }
    if (actId === 'terrorize') {
      m *= 1 + clamp(-c.kind / 100, 0, 1) * 2.2;
      if (c.kind > 45) m *= 0.25;
    }
    if (a.useful) {
      // Industriousness is its own appetite.
      m *= 1 + clamp(c.diligence / 100, -0.7, 1) * 0.9;
    }
    if (actId === 'perform') m *= 1 + c.stats.grace / 30;

    switch (c.leash) {
      case 'compassion':
        if (a.kind > 0.3 || a.useful) m *= 2.3;
        if (a.kind < -0.2) m *= 0.14;
        break;
      case 'aggression':
        if (a.kind < -0.2) m *= 2.4;
        if (a.kind > 0.5) m *= 0.4;
        if (actId === 'perform') m *= 1.8;
        break;
      case 'learning':
        m *= 1.05;  // attentive, slightly more active
        break;
    }
    return m;
  }

  function chooseAct(g) {
    const c = g.creature;
    const options = [];
    let total = 0;
    for (const id in c.weights) {
      const fn = FEASIBLE[id];
      if (!fn) continue;
      const target = fn(g);
      if (!target) continue;
      const w = clamp(c.weights[id], W_MIN, W_MAX) * drive(g, id);
      if (w <= 0) continue;
      options.push({ id, target, w });
      total += w;
    }
    if (!options.length) return { id: 'wander', target: { kind: 'roam' } };
    let r = Math.random() * total;
    for (const o of options) { r -= o.w; if (r <= 0) return o; }
    return options[options.length - 1];
  }

  // --- doing the thing ---------------------------------------------------
  function emit(g, text, tone) {
    if (SW.ui) SW.ui.log(g, text, tone || 'creature');
  }
  function pop(g, text, tone) {
    g.fx.push({ at: 'creature', text: text, tone: tone || 'neutral', life: 1.6, t: 0 });
  }

  function applyAct(g, actId, target) {
    const c = g.creature;
    const a = C.ACTS[actId];
    const name = c.name;
    let ok = true;

    switch (actId) {
      case 'water': {
        const p = g.plots.find(p => p.i === target.i);
        ok = F.water(g, p);
        if (ok) { pop(g, '💧', 'good'); emit(g, `${name} waters the ${C.CROPS[p.crop] ? C.CROPS[p.crop].name.toLowerCase() : 'soil'}.`); }
        break;
      }
      case 'harvest': {
        const p = g.plots.find(p => p.i === target.i);
        const r = F.harvest(g, p, 0.85 + c.stats.strength / 40);
        ok = !!r;
        if (ok) { pop(g, '🧺+' + r.amount, 'good'); emit(g, `${name} brings in ${r.amount} ${r.crop.name}.`); }
        break;
      }
      case 'till': {
        const p = g.plots.find(p => p.i === target.i);
        ok = F.till(g, p);
        if (ok) { pop(g, '⛏️', 'good'); emit(g, `${name} breaks the soil open.`); }
        break;
      }
      case 'sow': {
        const p = g.plots.find(p => p.i === target.i);
        const seed = F.bestSeed(g);
        ok = seed ? F.sow(g, p, seed.id) : false;
        if (ok) { pop(g, '🌱', 'good'); emit(g, `${name} presses a ${seed.name} seed into the ground.`); }
        break;
      }
      case 'forage': {
        const n = 1 + Math.floor(c.stats.strength / 7);
        g.res.wood += n;
        pop(g, '🪵+' + n, 'good');
        emit(g, `${name} drags ${n} wood back from the treeline.`);
        break;
      }
      case 'tithe': {
        const crop = F.bestStock(g);
        ok = !!crop;
        if (ok) {
          const food = F.mill(g, crop.id, 1);
          g.village.faith = clamp(g.village.faith + 1.6, 0, 100);
          pop(g, '🥣', 'good');
          emit(g, `${name} carries ${crop.name} down to the village. They eat because of your beast.`, 'good');
        }
        break;
      }
      case 'play': {
        c.mood = clamp(c.mood + 9, 0, 100);
        g.village.faith = clamp(g.village.faith + 0.9, 0, 100);
        pop(g, '🎈', 'good');
        emit(g, `${name} plays with the village children.`);
        break;
      }
      case 'perform': {
        const gain = 1 + c.stats.grace / 5 + c.bond / 40;
        g.res.renown += gain;
        g.village.faith = clamp(g.village.faith + 0.6, 0, 100);
        c.mood = clamp(c.mood + 6, 0, 100);
        pop(g, '🎭+' + Math.round(gain), 'good');
        emit(g, `${name} performs. Word of it travels.`, 'good');
        break;
      }
      case 'graze': {
        const p = g.plots.find(p => p.i === target.i);
        const r = F.devour(g, p);
        ok = !!r;
        if (ok) {
          c.hunger = clamp(c.hunger + r.crop.feed * r.ripeness, 0, 130);
          c.fed++;
          pop(g, '😋', 'bad');
          emit(g, `${name} eats your ${r.crop.name} straight out of the ground.`, 'bad');
        }
        break;
      }
      case 'feast': {
        const take = Math.min(g.village.food, 14);
        g.village.food -= take;
        c.hunger = clamp(c.hunger + take * 1.6, 0, 130);
        c.fed++;
        g.village.faith = clamp(g.village.faith - 1.2, 0, 100);
        pop(g, '🍖', 'bad');
        emit(g, `${name} raids the granary. The village counts what is left.`, 'bad');
        break;
      }
      case 'terrorize': {
        g.village.awe = clamp(g.village.awe + 2.6, 0, 100);
        g.village.faith = clamp(g.village.faith - 2.1, 0, 100);
        g.village.unrest = clamp(g.village.unrest + 3, 0, 100);
        c.mood = clamp(c.mood + (c.kind < 0 ? 8 : -4), 0, 100);
        pop(g, '💀', 'bad');
        emit(g, `${name} goes through the village roaring. They will remember it.`, 'bad');
        break;
      }
      case 'rest': {
        pop(g, '💤', 'neutral');
        break;
      }
      default:
        break;
    }

    if (!ok) return false;

    // Cost, drift, and slow physical growth.
    c.vigor = clamp(c.vigor - a.vigor, 0, 100);
    c.kind = clamp(c.kind + a.kind * 0.16, -100, 100);
    c.diligence = clamp(c.diligence + a.diligent * 0.14, -100, 100);
    if (a.useful) { c.chores++; c.bond = clamp(c.bond + 0.06, 0, 100); }

    if (actId === 'till' || actId === 'forage' || actId === 'harvest') c.stats.strength += 0.022;
    if (actId === 'sow' || actId === 'water' || actId === 'terrorize') c.stats.cunning += 0.022;
    if (actId === 'play' || actId === 'perform' || actId === 'tithe') c.stats.grace += 0.022;

    return true;
  }

  // --- the per-tick state machine ---------------------------------------
  function beginAct(g) {
    const c = g.creature;
    const chosen = chooseAct(g);
    const quick = 1 / (0.8 + c.stats.cunning / 45);
    c.act = {
      id: chosen.id,
      anchor: chosen.target,
      phase: 'travel',
      t: 0,
      travel: 2 * quick,
      work: 2 * quick,
      idle: rnd(1, 3) * quick
    };
  }

  function tick(g, dt) {
    const c = g.creature;
    const L = lineage(g);

    // Needs.
    c.hunger = clamp(c.hunger - 0.22 * L.appetite * (0.7 + c.size * 0.4) * dt, 0, 130);
    c.vigor = clamp(c.vigor + (c.act && c.act.id === 'rest' ? 2.2 : 0.42) * L.stamina * dt, 0, 100);
    c.mood = clamp(c.mood - 0.12 * dt + (c.hunger < 20 ? -0.35 * dt : 0) + (c.bond > 60 ? 0.05 * dt : 0), 0, 100);
    if (c.hunger <= 0) {
      c.vigor = clamp(c.vigor - 0.5 * dt, 0, 100);
      c.mood = clamp(c.mood - 0.3 * dt, 0, 100);
    }
    // Well-fed creatures grow. Growth is one-way; you cannot shrink a beast.
    if (c.hunger > 78) c.size = clamp(c.size + 0.0009 * dt, 0.6, 3.2);

    // Praise window expiry.
    if (c.pending) {
      c.pending.t += dt;
      if (c.pending.t >= PRAISE_WINDOW) c.pending = null;
    }

    // Slow forgetting toward instinct — thistlebeaks lose it fastest.
    const forget = 0.00035 * L.wits * dt;
    for (const id in c.weights) {
      const base = (L.instinct[id] || 1);
      c.weights[id] += (base - c.weights[id]) * forget;
      c.weights[id] = clamp(c.weights[id], W_MIN, W_MAX);
    }

    // Act state machine.
    if (!c.act) { beginAct(g); return; }
    const a = c.act;
    a.t += dt;
    if (a.phase === 'travel' && a.t >= a.travel) { a.phase = 'work'; a.t = 0; }
    else if (a.phase === 'work' && a.t >= a.work) {
      const done = applyAct(g, a.id, a.anchor);
      if (done && a.id !== 'wander') {
        c.pending = { act: a.id, t: 0 };
      }
      a.phase = 'idle'; a.t = 0;
    } else if (a.phase === 'idle' && a.t >= a.idle) {
      c.act = null;
    }
  }

  // --- teaching ----------------------------------------------------------
  function praise(g) {
    const c = g.creature;
    if (!c.pending) return false;
    const id = c.pending.act;
    const a = C.ACTS[id];
    const mul = learnRate(g);
    c.weights[id] = clamp(c.weights[id] * mul, W_MIN, W_MAX);
    c.bond = clamp(c.bond + 2.4, 0, 100);
    c.mood = clamp(c.mood + 7, 0, 100);
    // You are not just reinforcing a chore, you are endorsing a character.
    c.kind = clamp(c.kind + a.kind * 1.7, -100, 100);
    c.diligence = clamp(c.diligence + a.diligent * 1.3, -100, 100);
    c.praised++;
    c.pending = null;
    pop(g, '❤', 'good');
    SW.ui && SW.ui.log(g, `You lay a hand on ${c.name}. It will ${a.name} again.`, 'good');
    return true;
  }

  function scold(g) {
    const c = g.creature;
    if (!c.pending) return false;
    const id = c.pending.act;
    const a = C.ACTS[id];
    const mul = learnRate(g) * 1.1;
    c.weights[id] = clamp(c.weights[id] / mul, W_MIN, W_MAX);
    c.bond = clamp(c.bond - 1.7, 0, 100);
    c.mood = clamp(c.mood - 10, 0, 100);
    c.vigor = clamp(c.vigor - 2, 0, 100);
    c.kind = clamp(c.kind - a.kind * 1.1 - 0.7, -100, 100);
    c.diligence = clamp(c.diligence - a.diligent * 0.8, -100, 100);
    c.scolded++;
    c.pending = null;
    pop(g, '✋', 'bad');
    SW.ui && SW.ui.log(g, `You strike ${c.name}. It flinches, and files the lesson away.`, 'bad');
    return true;
  }

  /* Imitation. On the Leash of Learning, whatever you do with your own hands
   * bleeds into the creature's weights. Slower than praise, but free. */
  function observe(g, actId) {
    const c = g.creature;
    if (c.leash !== 'learning') return;
    if (!c.weights[actId]) return;
    const gain = 1 + 0.075 * lineage(g).wits * (0.6 + c.bond / 200);
    c.weights[actId] = clamp(c.weights[actId] * gain, W_MIN, W_MAX);
    if (chance(0.12)) {
      g.fx.push({ at: 'creature', text: '👁️', tone: 'neutral', life: 1.2, t: 0 });
    }
  }

  function feed(g, cropId) {
    const c = g.creature;
    if ((g.stock[cropId] | 0) <= 0) return false;
    g.stock[cropId]--;
    const crop = C.CROPS[cropId];
    c.hunger = clamp(c.hunger + crop.feed, 0, 130);
    c.mood = clamp(c.mood + 4, 0, 100);
    c.bond = clamp(c.bond + 1.1, 0, 100);
    c.fed++;
    pop(g, crop.glyph, 'good');
    SW.ui && SW.ui.log(g, `You feed ${c.name} a ${crop.name}. It leans into your hand.`, 'good');
    return true;
  }

  // --- appearance --------------------------------------------------------
  /* Everything visible about the creature is downstream of how you raised it.
   * This is the payoff for all that praising and slapping. */
  function look(g) {
    const c = g.creature;
    const L = lineage(g);
    const k = c.kind / 100;          // -1 cruel .. +1 kind
    const d = c.diligence / 100;
    const plump = clamp((c.hunger - 40) / 90, -0.3, 0.7);
    const hue = (base, target, t) => mixHex(base, target, clamp(t, 0, 1));
    let hide = L.palette.hide;
    if (k < 0) hide = hue(hide, '#8e2f3f', -k * 0.8);
    else hide = hue(hide, '#f2e7b0', k * 0.55);
    let mark = k < 0 ? hue(L.palette.mark, '#3b0d18', -k * 0.85) : hue(L.palette.mark, '#ffd97a', k * 0.6);
    return {
      hide, mark,
      belly: hue(L.palette.belly, k < 0 ? '#7a2b34' : '#fffdf0', Math.abs(k) * 0.62),
      size: c.size,
      spikes: clamp(-k, 0, 1),
      bloom: clamp(k, 0, 1),
      plump,
      posture: clamp(0.35 + d * 0.4 + c.vigor / 260, 0, 1),
      eye: c.mood < 30 ? 'sad' : c.mood > 75 ? 'bright' : 'calm',
      glow: clamp((c.bond - 50) / 60, 0, 1),
      lineage: L.id
    };
  }

  function mixHex(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const r = Math.round(((pa >> 16) & 255) * (1 - t) + ((pb >> 16) & 255) * t);
    const gg = Math.round(((pa >> 8) & 255) * (1 - t) + ((pb >> 8) & 255) * t);
    const bl = Math.round((pa & 255) * (1 - t) + (pb & 255) * t);
    return '#' + ((1 << 24) | (r << 16) | (gg << 8) | bl).toString(16).slice(1);
  }

  /* A one-line read on the beast, for the creature card. */
  function describe(g) {
    const c = g.creature;
    const k = c.kind, d = c.diligence;
    const moral = k > 60 ? 'saintly' : k > 20 ? 'gentle' : k > -20 ? 'unformed' : k > -60 ? 'mean' : 'monstrous';
    const work = d > 60 ? 'tireless' : d > 20 ? 'willing' : d > -20 ? 'aimless' : d > -60 ? 'lazy' : 'utterly indolent';
    return `${SW.core.titleCase(moral)} and ${work}.`;
  }

  SW.creature = {
    W_MIN, W_MAX, PRAISE_WINDOW, mastery, masteredCount, farmChoresMastered,
    tick, praise, scold, observe, feed, look, describe, chooseAct, learnRate, lineage
  };
})(window.SW = window.SW || {});

</script>
<script>
/* Skyward Reach — the world tick: village, economy, rivals, festivals, feats,
 * plus every action the player themself can take. */
(function (SW) {
  'use strict';
  const C = SW.content;
  const F = SW.farm;
  const Cr = SW.creature;
  const { clamp, hashNoise, chance, pick, fmt } = SW.core;

  const OFFLINE_CAP_TICKS = 4 * 60 * 60;   // four hours of catch-up, at most
  const FOCUS_REGEN = 0.55;

  const COST = { till: 3, sow: 1, water: 1, harvest: 2, forage: 3 };

  // --- rank --------------------------------------------------------------
  function rankOf(g) {
    let r = C.RANKS[0];
    for (const rk of C.RANKS) if (g.res.renown >= rk.renown) r = rk;
    return r;
  }
  function nextRank(g) {
    const cur = rankOf(g);
    return C.RANKS[Math.min(cur.id + 1, C.RANKS.length - 1)] === cur ? null : C.RANKS[cur.id + 1];
  }
  const grandeur = g => C.SHRINE_TIERS[g.shrine].grandeur;

  // --- player actions ----------------------------------------------------
  function spend(g, focus) {
    if (g.res.focus < focus) return false;
    g.res.focus -= focus;
    return true;
  }

  function playerTill(g, plot) {
    if (plot.state !== 'raw') return fail(g, 'That soil is already broken.');
    if (!spend(g, COST.till)) return fail(g, 'Not enough focus.');
    F.till(g, plot);
    Cr.observe(g, 'till');
    return true;
  }

  function playerSow(g, plot, cropId) {
    if (plot.state !== 'tilled') return fail(g, 'Break the soil first.');
    if ((g.seeds[cropId] | 0) <= 0) return fail(g, `No ${C.CROPS[cropId].name} seed left.`);
    if (!spend(g, COST.sow)) return fail(g, 'Not enough focus.');
    F.sow(g, plot, cropId);
    Cr.observe(g, 'sow');
    return true;
  }

  function playerWater(g, plot) {
    if (plot.state !== 'growing' && plot.state !== 'ripe') return fail(g, 'Nothing there to water.');
    if (!spend(g, COST.water)) return fail(g, 'Not enough focus.');
    F.water(g, plot);
    Cr.observe(g, 'water');
    return true;
  }

  function playerHarvest(g, plot) {
    if (plot.state !== 'ripe') return fail(g, 'Not ready.');
    if (!spend(g, COST.harvest)) return fail(g, 'Not enough focus.');
    const r = F.harvest(g, plot, 1);
    Cr.observe(g, 'harvest');
    if (r) SW.ui.log(g, `You gather ${r.amount} ${r.crop.name}.`);
    return true;
  }

  function playerForage(g) {
    if (!spend(g, COST.forage)) return fail(g, 'Not enough focus.');
    const n = 3;
    g.res.wood += n;
    Cr.observe(g, 'forage');
    SW.ui.log(g, `You haul ${n} wood out of the treeline.`);
    return true;
  }

  function fail(g, msg) { SW.ui.log(g, msg, 'warn'); return false; }

  // --- building ----------------------------------------------------------
  function hutCost(g) {
    const n = g.village.huts;
    return {
      wood: Math.ceil(C.HUT_COST.wood * Math.pow(C.HUT_COST.scale, n - 3)),
      coin: Math.ceil(C.HUT_COST.coin * Math.pow(C.HUT_COST.scale, n - 3))
    };
  }
  function plotCost(g) {
    const n = g.plots.length;
    return {
      wood: Math.ceil(C.PLOT_COST.wood * Math.pow(C.PLOT_COST.scale, n - 3)),
      coin: Math.ceil(C.PLOT_COST.coin * Math.pow(C.PLOT_COST.scale, n - 3))
    };
  }

  function buildHut(g) {
    const c = hutCost(g);
    if (g.res.wood < c.wood || g.res.coin < c.coin) return fail(g, 'You cannot afford another hut.');
    g.res.wood -= c.wood; g.res.coin -= c.coin;
    g.village.huts++;
    SW.ui.log(g, 'A new hut goes up. Somewhere below, someone hears about it.', 'good');
    return true;
  }

  function clearPlot(g) {
    if (!g.lockedPlots.length) return fail(g, 'There is no more island to break.');
    const c = plotCost(g);
    if (g.res.wood < c.wood || g.res.coin < c.coin) return fail(g, 'Not enough wood and coin.');
    g.res.wood -= c.wood; g.res.coin -= c.coin;
    g.plots.push(g.lockedPlots.shift());
    SW.ui.log(g, 'New ground, cleared and claimed.', 'good');
    return true;
  }

  function upgradeShrine(g) {
    const next = C.SHRINE_TIERS[g.shrine + 1];
    if (!next) return fail(g, 'The shrine is already everything it can be.');
    if (rankOf(g).id < next.rank) return fail(g, `You must stand at ${C.RANKS[next.rank].name} before the stones will hold.`);
    if (g.res.wood < next.wood || g.res.coin < next.coin) return fail(g, 'Not enough wood and coin.');
    g.res.wood -= next.wood; g.res.coin -= next.coin;
    g.shrine++;
    g.village.faith = clamp(g.village.faith + 6, 0, 100);
    SW.ui.log(g, `The shrine rises. It is a ${next.name} now, and it can be seen from other islands.`, 'great');
    return true;
  }

  // --- miracles ----------------------------------------------------------
  function castMiracle(g, id) {
    const m = C.MIRACLES[id];
    if (!m) return false;
    if (rankOf(g).id < m.rank) return fail(g, 'That power is beyond your standing.');
    if (g.res.prayer < m.cost) return fail(g, 'Not enough prayer.');
    g.res.prayer -= m.cost;
    g.stats.miracles++;
    switch (id) {
      case 'rain':
        for (const p of g.plots) if (p.crop) { p.water = 100; p.rot = Math.max(0, p.rot - 30); }
        g.fx.push({ at: 'sky', kind: 'rain', life: 6, t: 0 });
        SW.ui.log(g, 'Rain, on your say-so. Every plot drinks.', 'good');
        break;
      case 'quickening':
        for (const p of g.plots) if (p.state === 'growing') {
          p.growth += C.CROPS[p.crop].growTicks * 0.25;
          if (p.growth >= C.CROPS[p.crop].growTicks) { p.state = 'ripe'; p.growth = C.CROPS[p.crop].growTicks; }
        }
        g.fx.push({ at: 'sky', kind: 'shine', life: 2.5, t: 0 });
        SW.ui.log(g, 'The fields lurch forward a season in a heartbeat.', 'good');
        break;
      case 'bounty':
        g.village.food += 42;
        g.village.faith = clamp(g.village.faith + 3, 0, 100);
        SW.ui.log(g, 'Bread out of nothing. The granary is full and they know who filled it.', 'good');
        break;
      case 'mend':
        g.creature.vigor = 100;
        g.creature.hunger = clamp(g.creature.hunger + 45, 0, 130);
        g.creature.mood = clamp(g.creature.mood + 12, 0, 100);
        g.creature.bond = clamp(g.creature.bond + 1.5, 0, 100);
        g.fx.push({ at: 'creature', text: '💗', tone: 'good', life: 1.8, t: 0 });
        SW.ui.log(g, `${g.creature.name} straightens up, whole again.`, 'good');
        break;
      case 'storm':
        g.village.awe = clamp(g.village.awe + 14, 0, 100);
        g.village.faith = clamp(g.village.faith - 6, 0, 100);
        g.village.unrest = clamp(g.village.unrest + 8, 0, 100);
        g.creature.mood = clamp(g.creature.mood - 6, 0, 100);
        g.fx.push({ at: 'sky', kind: 'storm', life: 4, t: 0 });
        SW.ui.log(g, 'You break the sky over their heads. Nobody will forget the date.', 'bad');
        break;
    }
    return true;
  }

  // --- world tick --------------------------------------------------------
  function tickVillage(g, dt) {
    const v = g.village;
    const eaten = v.villagers * 0.085 * dt;
    if (v.food >= eaten) {
      v.food -= eaten;
      v.faith = clamp(v.faith + 0.028 * dt, 0, 100);
      v.unrest = clamp(v.unrest - 0.05 * dt, 0, 100);
    } else {
      v.food = 0;
      v.faith = clamp(v.faith - 0.13 * dt, 0, 100);
      v.unrest = clamp(v.unrest + 0.09 * dt, 0, 100);
    }
    // Faith settles toward what you visibly provide — a shrine to look at, a
    // full granary, neighbours who stayed — less whatever they are afraid of.
    // A people who fear you do not also love you, so the two paths compete
    // instead of stacking.
    const pull = clamp(18 + grandeur(g) * 1.8 + (v.food > 40 ? 18 : 0) + v.villagers * 0.8
      - v.awe * 0.62 - v.unrest * 0.45, 0, 100);
    v.faith += (pull - v.faith) * 0.0022 * dt;
    v.faith = clamp(v.faith, 0, 100);
    v.awe = clamp(v.awe - 0.022 * dt, 0, 100);
    // Living under a terror is exhausting. Awe keeps unrest topped up on its
    // own, so a fear empire steadily bleeds the villagers it multiplies.
    v.unrest = clamp(v.unrest + v.awe * 0.0042 * dt, 0, 100);

    // Prayer: love gives it freely, terror gives it grudgingly.
    const rate = v.villagers * (v.faith / 100 * 0.055 + v.awe / 100 * 0.03);
    g.res.prayer += rate * dt;

    // Standing compounds. A congregation is worth what it feels about you,
    // multiplied by how far away your shrine can be seen. Neither half alone
    // gets you up the Register — this is the engine the whole grind feeds.
    const devotion = v.villagers * (v.faith + v.awe) / 100;
    g.res.renown += (1 + grandeur(g) * 0.05) * devotion * 0.09 * dt;
  }

  function checkFeats(g) {
    for (const f of C.FEATS) {
      if (g.feats[f.id]) continue;
      let ok = false;
      try { ok = f.check(g); } catch (e) { ok = false; }
      if (ok) {
        g.feats[f.id] = g.day;
        g.res.renown += f.renown;
        SW.ui.log(g, `Feat — ${f.name}. +${f.renown} renown.`, 'great');
        g.fx.push({ at: 'banner', text: 'FEAT · ' + f.name, life: 4, t: 0 });
      }
    }
  }

  // A rival's ceiling on daily growth. Their curve accelerates for the first
  // ~70 days and then levels off for good: an established god is not getting
  // any more established. A fully built island out-earns even the fastest of
  // them, which is what makes first place reachable instead of a treadmill.
  const RIVAL_MAX_GAIN = 650;

  function tickRivals(g) {
    // Rivals climb their own curve and never chase you. Nothing rubber-bands,
    // which is the whole reason passing one of them means anything.
    for (const r of g.rivals) {
      const n = hashNoise(r.seed, g.day);
      const curve = Math.min(25 + 4.5 * Math.pow(g.day, 1.15), RIVAL_MAX_GAIN);
      let gain = r.pace * curve * (0.72 + n * 0.62);
      if (hashNoise(r.seed + 5, g.day) < r.spike * 0.25) gain *= 2.2;    // a good week
      r.renown += gain;
    }
  }

  function standings(g) {
    const rows = g.rivals.map(r => ({ name: r.name, renown: Math.floor(r.renown), you: false, tone: r.tone }));
    rows.push({ name: g.godName, renown: Math.floor(g.res.renown), you: true, tone: 'you' });
    rows.sort((a, b) => b.renown - a.renown);
    rows.forEach((r, i) => { r.place = i + 1; });
    return rows;
  }

  function tickChatter(g) {
    const rows = standings(g);
    const me = rows.find(r => r.you);
    g.lastStanding = me.place;
    if (!chance(0.75)) return;
    const rival = pick(g.rivals);
    const rel = rival.renown > g.res.renown * 1.15 ? 'ahead'
      : rival.renown < g.res.renown * 0.85 ? 'behind' : 'near';
    const line = pick(C.BARBS[rel][rival.tone]).replace(/\{r\}/g, rival.name);
    g.chatter.unshift({ day: g.day, text: line, rel });
    if (g.chatter.length > 40) g.chatter.length = 40;
  }

  // --- festivals ---------------------------------------------------------
  function festivalScore(g, cat) {
    const c = g.creature;
    switch (cat.id) {
      case 'harvest': {
        let best = 0, total = 0;
        for (const cr of C.CROP_LIST) {
          const n = g.stock[cr.id] | 0;
          total += n;
          best = Math.max(best, F.price(g, cr.id) * n);
        }
        return best + total * 3;
      }
      case 'beast': {
        let m = 0;
        for (const id of C.TRAINABLE) if (C.ACTS[id].useful) m += Cr.mastery(g, id);
        return (c.stats.strength + c.stats.cunning + c.stats.grace) * 8
          + c.bond * 2.2 + c.size * 55 + m * 34 + Math.abs(c.kind) * 0.7;
      }
      case 'rite':
      default:
        return grandeur(g) * 6.5 + g.village.faith * 2.2 + g.village.awe * 1.7 + g.village.villagers * 9;
    }
  }

  function runFestival(g) {
    const cat = C.FESTIVALS[g.festival.index % C.FESTIVALS.length];
    const mine = festivalScore(g, cat);
    // Rivals are scored against a par curve for the category, not against their
    // renown — otherwise a runaway leader would sweep every event forever.
    const par = cat.par(g.day);
    const field = g.rivals.map(r => ({
      name: r.name,
      score: par * (0.5 + r.pace * 0.5) * (0.6 + hashNoise(r.seed + 31, g.day) * 0.8)
    }));
    field.push({ name: g.godName, score: mine, you: true });
    field.sort((a, b) => b.score - a.score);
    const place = field.findIndex(f => f.you) + 1;

    const payout = place === 1 ? Math.round(150 + g.day * 14)
      : place === 2 ? Math.round(85 + g.day * 8)
      : place === 3 ? Math.round(50 + g.day * 5)
      : Math.round(8 + g.day);
    g.res.renown += payout;
    g.stats.festivals++;
    if (place === 1) g.stats.festivalWins++;
    if (place <= 3) g.trophies.push({ fest: cat.id, name: cat.name, place, day: g.day });

    g.festival.lastResult = { cat: cat.id, name: cat.name, place, score: Math.round(mine), payout, day: g.day, field: field.slice(0, 5).map(f => ({ name: f.name, score: Math.round(f.score), you: !!f.you })) };
    g.festival.index++;
    g.festival.nextDay = g.day + 5;

    const tone = place === 1 ? 'great' : place <= 3 ? 'good' : 'warn';
    const ord = place === 1 ? 'first' : place === 2 ? 'second' : place === 3 ? 'third' : `${place}th`;
    SW.ui.log(g, `${cat.name}: you place ${ord}. +${payout} renown.`, tone);
    g.fx.push({ at: 'banner', text: `${cat.glyph} ${cat.name} — ${ord}`, life: 5, t: 0 });
    return g.festival.lastResult;
  }

  // --- day rollover ------------------------------------------------------
  function newDay(g) {
    g.day++;
    g.stats.days++;
    F.rollPrices(g);
    tickRivals(g);
    tickChatter(g);

    // Arrivals: people move toward a god who feeds them and has room.
    const v = g.village;
    if (v.huts > v.villagers && v.faith > 42 && v.food > 12 && chance(0.6)) {
      v.villagers++;
      SW.ui.log(g, 'Someone new climbs up out of the cloud and asks to stay.', 'good');
    }
    if (v.unrest > 75 && v.villagers > 1 && chance(0.5)) {
      v.villagers--;
      v.unrest -= 25;
      SW.ui.log(g, 'A family leaves in the night. Word of that travels too.', 'bad');
    }

    const before = rankOf(g).id;
    checkFeats(g);
    if (g.day >= g.festival.nextDay) runFestival(g);
    checkFeats(g);
    const after = rankOf(g).id;
    if (after > before) {
      const rk = C.RANKS[after];
      SW.ui.log(g, `The Register lists you as ${rk.name}. ${rk.unlock || ''}`, 'great');
      g.fx.push({ at: 'banner', text: 'RANK · ' + rk.name, life: 5, t: 0 });
    }
  }

  function tick(g, dt) {
    g.tick += dt;
    g.dayTick += dt;
    g.res.focus = clamp(g.res.focus + FOCUS_REGEN * dt, 0, g.res.focusMax);

    F.tickPlots(g, dt);
    Cr.tick(g, dt);
    tickVillage(g, dt);

    while (g.dayTick >= C.TICKS_PER_DAY) {
      g.dayTick -= C.TICKS_PER_DAY;
      newDay(g);
    }
  }

  /* Catch-up when the tab has been closed. Coarse but honest: the same rules,
   * just stepped in bigger chunks. */
  function runOffline(g) {
    const now = Date.now();
    const elapsed = Math.max(0, Math.floor((now - (g.__savedAt || now)) / 1000));
    const ticks = Math.min(elapsed, OFFLINE_CAP_TICKS);
    if (ticks < 30) return null;
    const before = { renown: g.res.renown, coin: g.res.coin, harvests: g.stats.harvests, day: g.day };
    // Step one tick at a time. Bigger batches skip phases of the creature's
    // act loop, which quietly starves the farm it was trained to run — and the

      renown: Math.floor(g.res.renown - before.renown),
      coin: Math.floor(g.res.coin - before.coin),
      harvests: g.stats.harvests - before.harvests

  }

   * to the player so an entry is a decision, not a coin flip. */

    [1, 0], [0, 1], [2, 0], [3, 1],
    [0, 2], [3, 2], [1, 3], [2, 3],

        return p ? plotCenter(p) : { x: DEN.x, y: DEN.y };

      case 'village': return { x: VILLAGE.x - 40, y: VILLAGE.y + 8 };
      case 'shrine': return { x: SHRINE.x, y: SHRINE.y + 46 };
      case 'home': return { x: DEN.x, y: DEN.y };

  // --- sky ---------------------------------------------------------------
  const SKY_KEYS = [

    { t: 0.18, top: '#4d8fd6', mid: '#9fd0f0', low: '#e9f3fb', sun: '#fff6d8', amb: 1.00 },
    { t: 0.52, top: '#3f81cc', mid: '#8fc6ec', low: '#ecf4fa', sun: '#fff3cf', amb: 1.00 },

      top: mix(a.top, b.top, k), mid: mix(a.mid, b.mid, k), low: mix(a.low, b.low, k),

  function drawSky(g, sky, t, vw) {
    const grad = ctx.createLinearGradient(0, vw.y0, 0, vw.y1);

        const y = vw.y0 + hashNoise(13, i) * (vw.y1 - vw.y0) * 0.62;

        ctx.globalAlpha = clamp(night, 0, 1) * (0.35 + 0.65 * Math.abs(Math.sin(time * 0.7 + i)));

    }

    ctx.save();

      const span = vw.x1 - vw.x0 + 300;

  // --- island ------------------------------------------------------------
  function drawIsland(g, sky) {

    const grassLow = mix('#5d9450', '#141c30', 1 - amb);

    ctx.bezierCurveTo(560, 560, 700, 470, 830, 352);

  // --- plots -------------------------------------------------------------

    ctx.lineTo(c.x, c.y + GRID.ay);
    ctx.lineTo(c.x - GRID.ax, c.y);

  function drawPlots(g, sky) {

        ctx.fillRect(c.x - bw / 2, c.y + GRID.ay - 4, bw * clamp(p.water / 100, 0, 1), 3);

    }
  }

  function drawCrop(g, p, c, amb) {
    const crop = C.CROPS[p.crop];
    const prog = p.state === 'ripe' ? 1 : clamp(p.growth / crop.growTicks, 0.05, 1);
    const n = 5;
    const tint = mix(crop.tint, '#0d1424', 1 - amb);
    const stem = mix('#4f8b45', '#101c2c', 1 - amb);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + p.i;
      const px = c.x + Math.cos(a) * GRID.ax * 0.44;
      const py = c.y + Math.sin(a) * GRID.ay * 0.5;

      ctx.arc(c.x, c.y - 30, 3.2, 0, 7);
      ctx.fill();
      ctx.restore();
    }
  }

  // --- structures --------------------------------------------------------
  function drawTrees(sky) {
    const amb = sky.amb;
    for (let i = 0; i < 7; i++) {
      const x = WOOD.x + Math.sin(i * 2.1) * 44;
      const y = WOOD.y + Math.cos(i * 1.4) * 30;

      ctx.fillRect(x - 2 * s, y - 14 * s, 4 * s, 16 * s);

      ctx.arc(x, y - 22 * s, 13 * s, 0, 7);
      ctx.arc(x - 9 * s, y - 15 * s, 9 * s, 0, 7);
      ctx.arc(x + 9 * s, y - 16 * s, 10 * s, 0, 7);
      ctx.fill();
    }
  }

  function drawHuts(g, sky) {
    const amb = sky.amb;
    const n = Math.min(g.village.huts, 14);
    for (let i = 0; i < n; i++) {
      const a = i * 1.9;
      const x = VILLAGE.x + Math.cos(a) * (18 + i * 8.5);
      const y = VILLAGE.y + Math.sin(a) * (11 + i * 4.4);

      ctx.lineTo(x, y - 25 * s);
      ctx.lineTo(x + 14 * s, y - 12 * s);

      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(x - 3 * s, y - 6 * s, 6 * s, 8 * s);
    }
  }

  function drawVillagers(g, sky) {
    const amb = sky.amb;
    const n = Math.min(g.village.villagers, 18);
    const scared = g.village.unrest > 45;
    for (let i = 0; i < n; i++) {
      const sp = 0.25 + hashNoise(37, i) * 0.3 + (scared ? 0.5 : 0);
      const r = 28 + hashNoise(41, i) * 62;
      const a = time * sp + i * 2.4;
      const x = VILLAGE.x - 20 + Math.cos(a) * r;
      const y = VILLAGE.y + 10 + Math.sin(a) * r * 0.42;
      const bob = Math.abs(Math.sin(time * 5 + i)) * 1.6;
