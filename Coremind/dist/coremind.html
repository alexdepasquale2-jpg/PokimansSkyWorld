<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Coremind</title>
<meta name="description" content="COREMIND — a single-player biological evolution sandbox. Discover, analyze, extract, design, deploy, adapt.">
<!-- Inline so the page stays a single self-contained bundle (see tools/build.mjs)
     and so no request 404s when it is opened straight off the filesystem. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230f2e26' stroke='%2333e6b0' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2333e6b0'/%3E%3C/svg%3E">
<style>
/* Coremind — mobile-first dark UI. Large touch targets, portrait layout. */
:root{
  --bg:#060b12;
  --panel:#0b141d;
  --panel2:#0f1c27;
  --line:#1c2e3a;
  --fg:#dfeef0;
  --fg-dim:#8aa3ab;
  --accent:#33e6b0;
  --accent-dim:#1c8a6b;
  --warn:#f2a33c;
  --danger:#ef5b5b;
  --biomass:#7ee081;
  --energy:#ffd166;
  --pop:#8ec8ff;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:none;}
body{
  background:var(--bg);color:var(--fg);
  font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;position:fixed;inset:0;
}
#app{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-top);}

/* ---- top bar ---- */
#topbar{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;
  z-index:5;
}
#topbar .stat{display:flex;align-items:center;gap:5px;font-weight:600;font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:8px;background:var(--panel2);}
#topbar .stat i{font-style:normal;font-size:15px;}
#stat-biomass{color:var(--biomass);}
#stat-energy{color:var(--energy);}
#stat-pop{color:var(--pop);}
#btn-speed{margin-left:auto;}

.iconbtn{
  background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
  min-width:40px;min-height:36px;font-size:16px;line-height:1;cursor:pointer;
}
.iconbtn:active{background:var(--line);}

/* ---- stage / world canvas ---- */
#stage{position:relative;flex:1 1 auto;min-height:0;background:#04080d;overflow:hidden;}
#world-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

#cam-controls{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:4;}
.roundbtn{
  width:46px;height:46px;border-radius:50%;background:rgba(11,20,29,.85);
  color:var(--fg);border:1px solid var(--line);font-size:20px;backdrop-filter:blur(2px);
}
.roundbtn:active{background:var(--accent-dim);}

#toast-layer{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:6;align-items:center;}
.toast{
  background:rgba(11,20,29,.92);border:1px solid var(--line);border-left:3px solid var(--accent);
  padding:8px 12px;border-radius:8px;max-width:340px;font-size:13px;animation:toastin .18s ease-out;
}
.toast.warn{border-left-color:var(--warn);}
.toast.danger{border-left-color:var(--danger);}
@keyframes toastin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

#selection-panel.card{
  position:absolute;left:10px;top:10px;right:10px;max-width:360px;z-index:5;
}
.card{
  background:rgba(11,20,29,.94);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
}
.hidden{display:none !important;}

/* ---- bottom tabs ---- */
#tabs{display:flex;flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);}
.tab{
  flex:1;padding:11px 4px;background:none;border:none;color:var(--fg-dim);font-weight:700;
  font-size:12.5px;letter-spacing:.04em;position:relative;min-height:44px;
}
.tab.active{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent);}
.badge{
  position:absolute;top:4px;right:calc(50% - 26px);background:var(--accent);color:#04140e;
  border-radius:9px;padding:0 5px;font-size:10px;font-weight:800;
}
.badge.warn{background:var(--warn);}

/* ---- bottom panels ---- */
.panel{display:none;flex:0 0 auto;background:var(--panel);max-height:40vh;overflow-y:auto;padding:8px 10px calc(10px + var(--safe-bottom));}
.panel.active{display:block;}
#selection-summary{color:var(--fg-dim);font-size:12.5px;margin-bottom:8px;}

#directive-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.dirbtn{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--fg);
  padding:10px 2px;font-size:11.5px;font-weight:700;min-height:52px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
}
.dirbtn i{font-style:normal;font-size:18px;}
.dirbtn.active{border-color:var(--accent);color:var(--accent);background:rgba(51,230,176,.08);}
.dirbtn:disabled{opacity:.35;}

/* ---- event feed ---- */
#event-feed{display:flex;flex-direction:column;gap:6px;}
.event-row{
  display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;text-align:left;color:var(--fg);
}
.event-row .ico{font-size:16px;flex:0 0 auto;}
.event-row .body{flex:1;min-width:0;}
.event-row .msg{font-size:12.5px;}
.event-row .time{font-size:10.5px;color:var(--fg-dim);}
.event-row.discovery{border-left:3px solid var(--accent);}
.event-row.death{border-left:3px solid var(--danger);}
.event-row.warn{border-left:3px solid var(--warn);}
.event-empty{color:var(--fg-dim);text-align:center;padding:20px 0;font-size:12.5px;}

/* ---- overlays (designer / inspect / boot) ---- */
.overlay{
  position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;
  padding-top:var(--safe-top);
}
.overlay-head{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto;}
.overlay-title{flex:1;text-align:center;font-weight:800;letter-spacing:.06em;font-size:13px;}

/* designer */
#designer-preview{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:10px;background:var(--panel);border-bottom:1px solid var(--line);}
#preview-canvas{background:radial-gradient(circle at 50% 40%,#0f2018,#050a08);border-radius:12px;border:1px solid var(--line);}
#designer-cost{margin-top:6px;font-size:12px;color:var(--fg-dim);}
#designer-cost .ok{color:var(--biomass);}
#designer-cost .bad{color:var(--danger);}

#designer-slots{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:var(--panel);border-bottom:1px solid var(--line);}
.slot{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;
}
.slot .cat{font-size:10px;color:var(--fg-dim);letter-spacing:.06em;}
.slot .trait{font-size:12.5px;font-weight:700;margin:4px 0;min-height:16px;}
.slot .trait.empty{color:var(--fg-dim);font-weight:400;}
.slot select{
  width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;
  padding:6px 2px;font-size:11.5px;min-height:34px;
}

#designer-stats{flex:1;overflow-y:auto;padding:10px;}
.statrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;}
.statrow .label{width:76px;flex:0 0 auto;color:var(--fg-dim);}
.statrow .bar{flex:1;height:9px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--line);}
.statrow .bar > i{display:block;height:100%;background:var(--accent);}
.statrow .val{width:34px;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums;}
.statrow .delta{width:36px;flex:0 0 auto;font-size:10.5px;text-align:left;}
.statrow .delta.pos{color:var(--biomass);}
.statrow .delta.neg{color:var(--danger);}

.bigbtn{
  flex:0 0 auto;margin:10px;padding:14px;border-radius:12px;border:none;background:var(--accent);
  color:#04140e;font-weight:800;font-size:14px;letter-spacing:.03em;min-height:50px;
}
.bigbtn:disabled{opacity:.35;}
.bigbtn.secondary{background:var(--panel2);color:var(--fg);border:1px solid var(--line);}

/* designer: conflicts / synergies / saved strains */
#designer-actions{flex:0 0 auto;display:flex;gap:0;padding-bottom:var(--safe-bottom);}
#designer-actions .bigbtn{flex:1;}
#btn-save-design{flex:0 0 38%;}

#designer-combo{flex:0 0 auto;padding:0 10px;background:var(--panel);}
#designer-combo:empty{display:none;}
.combo-note{
  display:flex;gap:6px;align-items:flex-start;font-size:11.5px;padding:6px 8px;border-radius:8px;margin-bottom:6px;
}
.combo-note.synergy{background:rgba(51,230,176,.1);border:1px solid var(--accent-dim);color:var(--accent);}
.combo-note.conflict{background:rgba(239,91,91,.12);border:1px solid var(--danger);color:var(--danger);}

#designer-designs{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line);}
#designer-designs:empty{display:none;}
.strain-chip{
  flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:14px;
  padding:7px 12px;font-size:11.5px;color:var(--fg);white-space:nowrap;min-height:34px;
}
.strain-chip:active{border-color:var(--accent);color:var(--accent);}
.strain-chip .del{color:var(--fg-dim);margin-left:6px;}

/* analyze: research backlog */
#research-list{margin-bottom:10px;}
#research-list:empty{display:none;}
.research-head{font-size:10.5px;letter-spacing:.08em;color:var(--fg-dim);margin-bottom:6px;}
.research-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px;}
.research-row .rname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.research-row .rbar{width:74px;height:7px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:0 0 auto;}
.research-row .rbar > i{display:block;height:100%;background:var(--warn);}
.research-row .rcount{width:30px;text-align:right;color:var(--fg-dim);font-size:10.5px;flex:0 0 auto;}

/* observation report inside an event row */
.obs{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line);font-size:11px;color:var(--fg-dim);}
.obs b{color:var(--fg);font-weight:600;}

/* inspect */
#inspect-body{flex:1;overflow-y:auto;padding:12px;}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.kv .k{color:var(--fg-dim);}
.trait-chip{
  display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);
  border-radius:14px;padding:4px 10px;margin:3px 4px 0 0;font-size:11.5px;
}
.extract-btn{width:100%;margin-top:12px;}

/* boot */
#boot-overlay{align-items:center;justify-content:center;z-index:50;background:radial-gradient(circle at 50% 30%,#0d1f18,#04080d 70%);}
.boot-card{text-align:center;padding:20px;max-width:360px;}
.boot-card h1{font-size:34px;letter-spacing:.12em;margin:0 0 4px;color:var(--accent);text-shadow:0 0 24px rgba(51,230,176,.5);}
.boot-card .tag{color:var(--fg-dim);margin:0 0 26px;}
.boot-card .hint{color:var(--fg-dim);font-size:11.5px;margin-top:20px;}
.boot-card .bigbtn{width:100%;margin:8px 0;}

@media (min-width:600px){
  #selection-panel.card{max-width:320px;}
  #designer-slots{grid-template-columns:repeat(6,1fr);}
}

</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div class="stat" id="stat-biomass" title="Biomass"><i>&#127793;</i><span>0</span></div>
    <div class="stat" id="stat-energy" title="Energy"><i>&#9889;</i><span>0</span></div>
    <div class="stat" id="stat-pop" title="Population"><i>&#129440;</i><span>0</span></div>
    <button id="btn-speed" class="iconbtn" title="Simulation speed">1x</button>
  </div>

  <div id="stage">
    <canvas id="world-canvas"></canvas>

    <div id="toast-layer"></div>

    <div id="selection-panel" class="card hidden"></div>

    <div id="cam-controls">
      <button id="btn-focus-core" class="roundbtn" title="Focus Core">&#8962;</button>
      <button id="btn-zoom-in" class="roundbtn" title="Zoom in">+</button>
      <button id="btn-zoom-out" class="roundbtn" title="Zoom out">&minus;</button>
    </div>

    <div id="directive-toast" class="hidden"></div>
  </div>

  <div id="tabs">
    <button data-tab="explore" class="tab active">EXPLORE</button>
    <button data-tab="analyze" class="tab">ANALYZE<span id="badge-analyze" class="badge hidden">0</span></button>
    <button data-tab="dna" class="tab">DNA<span id="badge-dna" class="badge hidden">!</span></button>
  </div>

  <div id="panel-explore" class="panel active">
    <div id="selection-summary">Tap an organism to select it, or issue a directive to your whole colony.</div>
    <div id="directive-bar"></div>
  </div>

  <div id="panel-analyze" class="panel">
    <div id="research-list"></div>
    <div id="event-feed"></div>
  </div>

  <div id="designer-overlay" class="overlay hidden">
    <div class="overlay-head">
      <button id="btn-designer-close" class="iconbtn">&#10005;</button>
      <div class="overlay-title">GENOME DESIGNER</div>
      <div style="width:40px"></div>
    </div>
    <div id="designer-preview">
      <canvas id="preview-canvas" width="240" height="240"></canvas>
      <div id="designer-cost"></div>
    </div>
    <div id="designer-slots"></div>
    <div id="designer-combo"></div>
    <div id="designer-stats"></div>
    <div id="designer-designs"></div>
    <div id="designer-actions">
      <button id="btn-save-design" class="bigbtn secondary">SAVE STRAIN</button>
      <button id="btn-create-organism" class="bigbtn" disabled>CREATE ORGANISM</button>
    </div>
  </div>

  <div id="inspect-overlay" class="overlay hidden">
    <div class="overlay-head">
      <button id="btn-inspect-close" class="iconbtn">&#10005;</button>
      <div class="overlay-title" id="inspect-title">DETAILS</div>
      <div style="width:40px"></div>
    </div>
    <div id="inspect-body"></div>
  </div>

  <div id="boot-overlay" class="overlay">
    <div class="boot-card">
      <h1>COREMIND</h1>
      <p class="tag">a distributed biological intelligence</p>
      <button id="btn-continue" class="bigbtn hidden">CONTINUE</button>
      <button id="btn-new-world" class="bigbtn secondary">NEW WORLD</button>
      <p class="hint">Discover &rarr; Analyze &rarr; Extract &rarr; Design &rarr; Deploy &rarr; Adapt</p>
    </div>
  </div>

</div>

<script>
/* Coremind — shared helpers: RNG, noise, math, formatting, event bus.
 *
 * The world is regenerated from a seed (see world.js), so anything here that
 * touches world generation must be deterministic given the same seed.
 */
(function (CM) {
  'use strict';

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const clamp01 = v => clamp(v, 0, 1);
  const lerp = (a, b, t) => a + (b - a) * t;
  const invLerp = (a, b, v) => (b === a ? 0 : clamp01((v - a) / (b - a)));
  const rndInt = (rng, a, b) => Math.floor(a + rng() * (b - a + 1));
  const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
  const chance = (rng, p) => rng() < p;
  const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
  const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));

  /* Angle helpers for steering. */
  function angDelta(a, b) {
    let d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }
  function turnToward(a, b, maxStep) {
    return a + clamp(angDelta(a, b), -maxStep, maxStep);
  }

  /* Seeded RNG (mulberry32). Every stream that must be reproducible from the
   * world seed uses one of these — never Math.random(). */
  function rngFrom(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hash2(seed, x, y) {
    let h = (seed * 374761393 + x * 668265263 + y * 2147483647) >>> 0;
    h = (h ^ (h >>> 13)) >>> 0;
    h = Math.imul(h, 1274126177) >>> 0;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  /* Smooth value noise — good enough for biome blotches and temperature
   * fields, cheap enough to sample 65k times at world-gen. */
  function noise2(seed, x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(seed, xi, yi), b = hash2(seed, xi + 1, yi);
    const c = hash2(seed, xi, yi + 1), d = hash2(seed, xi + 1, yi + 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  }

  function fbm(seed, x, y, octaves) {
    let sum = 0, amp = 1, norm = 0, f = 1;
    for (let i = 0; i < (octaves || 4); i++) {
      sum += amp * noise2(seed + i * 7919, x * f, y * f);
      norm += amp;
      amp *= 0.52; f *= 2.1;
    }
    return sum / norm;
  }

  // --- formatting ----------------------------------------------------------
  function fmt(n) {
    n = Math.floor(n);
    if (Math.abs(n) < 1000) return String(n);
    if (Math.abs(n) < 1e6) return (n / 1000).toFixed(n < 1e4 ? 1 : 0).replace(/\.0$/, '') + 'k';
    return (n / 1e6).toFixed(2).replace(/\.0+$/, '') + 'M';
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h) return h + 'h ' + String(m).padStart(2, '0') + 'm';
    return m + ':' + String(s).padStart(2, '0');
  }

  // --- tiny pub/sub used to decouple simulation, discovery and UI ----------
  function makeBus() {
    const listeners = {};
    return {
      on(kind, fn) {
        (listeners[kind] || (listeners[kind] = [])).push(fn);
        return () => { const a = listeners[kind]; const i = a.indexOf(fn); if (i >= 0) a.splice(i, 1); };
      },
      emit(kind, payload) {
        const a = listeners[kind];
        if (!a) return;
        for (let i = 0; i < a.length; i++) {
          try { a[i](payload); } catch (e) { console.error('[coremind] listener error for', kind, e); }
        }
      }
    };
  }

  /* Monotonically increasing ids, namespaced by prefix so debug output stays
   * readable ("org_42", "sample_7"). */
  function makeIdGen() {
    const counters = {};
    return prefix => {
      counters[prefix] = (counters[prefix] || 0) + 1;
      return prefix + '_' + counters[prefix];
    };
  }

  CM.core = {
    clamp, clamp01, lerp, invLerp, rndInt, pick, chance, dist, dist2,
    angDelta, turnToward, rngFrom, hash2, noise2, fbm,
    fmt, fmtClock, makeBus, makeIdGen
  };
})(window.CM = window.CM || {});

</script>
<script>
/* Coremind — the trait catalog and the base organism schema.
 *
 * Every organism, player-designed or wild, is built the same way: a base
 * stat block plus the summed deltas of up to six traits (one per category
 * slot). Nothing here hard-codes a species' behaviour — wild species (below)
 * are just trait combinations with a default AI disposition, exactly like a
 * player design.
 */
(function (CM) {
  'use strict';

  const CATEGORIES = ['BODY', 'SENSE', 'METABOLISM', 'DEFENSE', 'OFFENSE', 'REPRODUCTION'];

  /* The intentionally weak, generic starting point. Every stat an organism
   * can have is listed here — traits only ever add a delta on top. */
  const BASE_STATS = {
    health: 40, energyMax: 40, speed: 13, size: 10, vision: 16, sense_radius: 9,
    attack: 5, defense: 3, temperature_tolerance: 9, water_requirement: 0.55,
    reproduction_rate: 0.16, metabolism: 11, camouflage: 4, venom: 0, armor: 0, digging: 0
  };

  const STAT_KEYS = Object.keys(BASE_STATS);
  const STAT_MIN = { health: 5, energyMax: 5, speed: 2, size: 3, vision: 2, sense_radius: 2, attack: 0, defense: 0, temperature_tolerance: 2, water_requirement: 0.1, reproduction_rate: 0.02, metabolism: 3, camouflage: 0, venom: 0, armor: 0, digging: 0 };

  /* stat_modifiers are additive deltas over BASE_STATS. energy_cost / biomass_cost
   * are paid once, at CREATE ORGANISM time (see genome.js). compatibility /
   * incompatibility are informational pairings shown in the designer — they
   * tell the player which traits play well together, they don't hide extra
   * math the UI can't explain. */
  const TRAITS = [
    // -- BODY (movement) --
    { id: 'basic_legs', name: 'Basic Legs', category: 'BODY',
      description: 'Sturdier limbs for covering ground.',
      stat_modifiers: { speed: 10, metabolism: 2 }, energy_cost: 4, biomass_cost: 6,
      compatibility: ['fast_movement'], incompatibility: [],
      visual_modifier: 'legs', behavior_modifier: null },
    { id: 'fast_movement', name: 'Fast Movement', category: 'BODY',
      description: 'A streamlined build built for speed, at a metabolic cost.',
      stat_modifiers: { speed: 24, metabolism: 8, water_requirement: 0.15 }, energy_cost: 8, biomass_cost: 10,
      compatibility: ['vibration_sense'], incompatibility: ['armor'],
      visual_modifier: 'streamlined', behavior_modifier: null },
    { id: 'burrowing', name: 'Burrowing', category: 'BODY',
      description: 'Digging limbs that let this organism vanish underground to escape danger.',
      stat_modifiers: { digging: 45, speed: -6, defense: 6, water_requirement: -0.18 }, energy_cost: 6, biomass_cost: 9,
      compatibility: ['camouflage'], incompatibility: ['fast_movement'],
      visual_modifier: 'digger', behavior_modifier: 'can_burrow_flee' },

    // -- SENSE --
    { id: 'vision', name: 'Vision', category: 'SENSE',
      description: 'Larger eyes — spots food and threats from further away.',
      stat_modifiers: { vision: 26, sense_radius: 6 }, energy_cost: 3, biomass_cost: 5,
      compatibility: ['fast_movement'], incompatibility: [],
      visual_modifier: 'eyes', behavior_modifier: null },
    { id: 'chem_sense', name: 'Chemical Sensing', category: 'SENSE',

    { id: 'vibration_sense', name: 'Vibration Sensing', category: 'SENSE',

    // -- DEFENSE --
    { id: 'armor', name: 'Armor', category: 'DEFENSE',
      description: 'A heavy external shell. Excellent protection, but slow and hungry.',

      stat_modifiers: { defense: 32, armor: 32, speed: -7, metabolism: 7, water_requirement: 0.12 }, energy_cost: 6, biomass_cost: 14,

    { id: 'claws', name: 'Claws', category: 'OFFENSE',

    { id: 'venom', name: 'Venom', category: 'OFFENSE',

    { id: 'acid', name: 'Acid', category: 'OFFENSE',

    // -- METABOLISM --
    { id: 'efficient_metabolism', name: 'Efficient Metabolism', category: 'METABOLISM',
      description: 'Burns energy and water more slowly — needs to eat and drink less often.',
      stat_modifiers: { metabolism: -19, water_requirement: -0.2 }, energy_cost: 4, biomass_cost: 8,

    { id: 'heat_resistance', name: 'Heat Resistance', category: 'METABOLISM',

      stat_modifiers: { temperature_tolerance: 19, water_requirement: -0.15 }, energy_cost: 3, biomass_cost: 7,

      visual_modifier: 'warm_hued', behavior_modifier: null },
    { id: 'cold_resistance', name: 'Cold Resistance', category: 'METABOLISM',

      stat_modifiers: { temperature_tolerance: 19 }, energy_cost: 3, biomass_cost: 7,

    { id: 'prolific_broodsac', name: 'Prolific Broodsac', category: 'REPRODUCTION',
      description: 'Produces offspring far more readily, at the cost of a smaller body.',
      stat_modifiers: { reproduction_rate: 0.4, size: -4 }, energy_cost: 6, biomass_cost: 10,
      compatibility: ['efficient_metabolism'], incompatibility: [],
      visual_modifier: 'brood_sac', behavior_modifier: null }
  ];

  const TRAITS_BY_ID = {};
  const TRAITS_BY_CATEGORY = {};
  for (const cat of CATEGORIES) TRAITS_BY_CATEGORY[cat] = [];
  for (const t of TRAITS) { TRAITS_BY_ID[t.id] = t; TRAITS_BY_CATEGORY[t.category].push(t); }

  const BASE_CREATE_COST = { biomass: 18, energy: 12 };

  /* Stats where a *lower* number is the better outcome. Everything that
   * reasons about whether a modifier is a benefit or a cost — the synergy
   * bonus below, and the designer's +/- colouring — has to consult this, or
   * it will cheerfully report a metabolism increase as an improvement. */
  const LOWER_IS_BETTER = new Set(['metabolism', 'water_requirement']);
  function isBenefit(statKey, delta) {
    return LOWER_IS_BETTER.has(statKey) ? delta < 0 : delta > 0;
  }

  /* Each satisfied `compatibility` pairing amplifies both traits' upsides by
   * this much. Deliberately one-directional: synergy never deepens a trait's
   * own costs, so pairing traits is always a reward for noticing the
   * relationship, never a hidden penalty. */
  const SYNERGY_BONUS = 0.15;

  /* Which declared pairings are actually live in this set of traits. Pure and
   * cheap (<=6 traits), so the designer can call it on every change. */
  function checkCombination(traitIds) {
    const ids = traitIds.filter(Boolean);
    const set = new Set(ids);
    const conflicts = [], synergies = [], seen = new Set();
    for (const id of ids) {
      const t = TRAITS_BY_ID[id];
      if (!t) continue;
      for (const other of t.incompatibility) {
        if (!set.has(other)) continue;
        const key = [id, other].sort().join('|');
        if (seen.has(key)) continue;
        seen.add(key);
        conflicts.push({ a: id, b: other });
      }
      for (const other of t.compatibility) {
        if (!set.has(other)) continue;
        const key = 's:' + [id, other].sort().join('|');
        if (seen.has(key)) continue;
        seen.add(key);
        synergies.push({ a: id, b: other });
      }
    }
    return { conflicts, synergies };
  }

  /* True when `candidate` could be added to `traitIds` without creating a
   * declared incompatibility. The designer uses this to disable the option
   * rather than letting the player build something the rules forbid. */
  function conflictsWith(traitIds, candidate) {
    const t = TRAITS_BY_ID[candidate];
    if (!t) return null;
    for (const id of traitIds) {
      if (!id || id === candidate) continue;
      const other = TRAITS_BY_ID[id];
      if (!other) continue;
      if (t.incompatibility.includes(id) || other.incompatibility.includes(candidate)) return id;
    }
    return null;
  }

  /* Compute the full stat block for a set of trait ids (one per category,
   * nulls allowed). Pure function — the designer calls this on every tap. */
  function resolveStats(traitIds) {
    const ids = traitIds.filter(Boolean);
    const stats = Object.assign({}, BASE_STATS);

    // Count each trait's live synergy partners first, so the boost applies to
    // every contributor of a pairing rather than depending on iteration order.
    const partners = {};
    for (const { a, b } of checkCombination(ids).synergies) {
      partners[a] = (partners[a] || 0) + 1;
      partners[b] = (partners[b] || 0) + 1;
    }

    for (const id of ids) {
      const t = TRAITS_BY_ID[id];
      if (!t) continue;
      const boost = 1 + SYNERGY_BONUS * (partners[id] || 0);
      for (const k in t.stat_modifiers) {
        const v = t.stat_modifiers[k];
        stats[k] = (stats[k] || 0) + (isBenefit(k, v) ? v * boost : v);
      }
    }
    for (const k of STAT_KEYS) stats[k] = Math.max(STAT_MIN[k] || 0, stats[k]);
    return stats;
  }

  function resolveCost(traitIds) {
    let biomass = BASE_CREATE_COST.biomass, energy = BASE_CREATE_COST.energy;
    for (const id of traitIds) {
      const t = TRAITS_BY_ID[id];
      if (!t) continue;
      biomass += t.biomass_cost; energy += t.energy_cost;
    }
    return { biomass, energy };
  }

  function behaviorModifiers(traitIds) {
    const set = new Set();
    for (const id of traitIds) {
      const t = TRAITS_BY_ID[id];
      if (t && t.behavior_modifier) set.add(t.behavior_modifier);
    }
    return set;
  }

  // --- wild species: the same trait system, an authored preset each --------
  const WILD_SPECIES = [
    { id: 'grazer', name: 'Grazer', tier: 'prey', diet: 'herbivore',
      traits: ['basic_legs', 'vision'], color: '#8fd15a' },
    { id: 'thistleback', name: 'Thistleback', tier: 'prey', diet: 'herbivore',
      traits: ['armor', 'basic_legs'], color: '#c9b25a' },
    { id: 'stalker', name: 'Stalker', tier: 'predator', diet: 'carnivore',
      traits: ['fast_movement', 'bite'], color: '#d16b5a' },
    // Carries legs deliberately: an armored predator without them cannot
    // close on anything, and a predator that never hunts is not a predator.
    { id: 'shellfang', name: 'Shellfang', tier: 'predator', diet: 'carnivore',
      traits: ['armor', 'claws', 'basic_legs'], color: '#a15ad1' },
    { id: 'needler', name: 'Needler', tier: 'predator', diet: 'carnivore',
      traits: ['venom', 'vibration_sense'], color: '#5ad1c4' }
  ];
  const WILD_BY_ID = {};
  for (const s of WILD_SPECIES) WILD_BY_ID[s.id] = s;

  CM.traits = {
    CATEGORIES, TRAITS, TRAITS_BY_ID, TRAITS_BY_CATEGORY,
    BASE_STATS, STAT_KEYS, STAT_MIN, BASE_CREATE_COST,
    LOWER_IS_BETTER, isBenefit, SYNERGY_BONUS, checkCombination, conflictsWith,
    resolveStats, resolveCost, behaviorModifiers,
    WILD_SPECIES, WILD_BY_ID
  };
})(window.CM = window.CM || {});

<script>
/* Coremind — procedural world: a 256x256 cell ecosystem grid, plus a uniform
 * spatial grid used to query organisms by position cheaply.
 *
 * The terrain is regenerated from the seed on every load (world.js never
 * touches localStorage); only the *deltas* worth keeping — food levels drift
 * back to their natural carrying capacity fast enough that they are not
 * saved at all; see save.js for what actually persists.
 */
(function (CM) {
  'use strict';
  const K = CM.core;

  const SIZE = 256; // cells per side
  const BIOME = { WATER: 0, GRASS: 1, SOIL: 2, ROCK: 3 };
  const BIOME_NAMES = ['Water', 'Grass', 'Soil', 'Rock'];

  function idx(x, y) { return y * SIZE + x; }
  function inBounds(x, y) { return x >= 0 && y >= 0 && x < SIZE && y < SIZE; }

  /* --- generation ---------------------------------------------------------
   * Elevation carves water / land / rock. Moisture (itself elevation-biased,
   * so basins are wetter) decides grass vs bare soil. Temperature follows a
   * latitude band across the y axis plus noise, so the world has a cold edge,
   * a warm middle, and local variation neither alone would produce. */
  function generate(seed) {
    seed = (seed >>> 0) || 1;
    const n = SIZE * SIZE;
    const biome = new Uint8Array(n);
    const temp = new Float32Array(n);      // degrees C
    const moisture = new Float32Array(n);
    const food = new Float32Array(n);      // current plant biomass per cell
    const foodCap = new Float32Array(n);   // carrying capacity per cell

    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const i = idx(x, y);
        const e = K.fbm(seed, x * 0.02, y * 0.02, 5) * 0.75 + K.fbm(seed + 1, x * 0.06, y * 0.06, 3) * 0.25;
        let m = K.fbm(seed + 2000, x * 0.035, y * 0.035, 4) * 0.7 + (1 - e) * 0.3;
        m = K.clamp01(m);

        // latitude-ish temperature band centred on the vertical middle,
        // warmest at the equator (mid-row), coldest at the poles (edges).
        const lat = Math.abs(y / SIZE - 0.5) * 2; // 0 at equator, 1 at pole
        let t = K.lerp(34, -12, lat) + (K.fbm(seed + 4000, x * 0.05, y * 0.05, 3) - 0.5) * 14;
        t -= K.clamp01(e - 0.6) * 18; // higher ground runs cooler

        let b;
        if (e < 0.30) b = BIOME.WATER;
        else if (e > 0.80 || (e > 0.62 && m < 0.22)) b = BIOME.ROCK;
        else if (m > 0.38 && t > -4) b = BIOME.GRASS;
        else b = BIOME.SOIL;

        biome[i] = b;
        temp[i] = t;
        moisture[i] = m;
        if (b === BIOME.GRASS) {
          const cap = K.clamp01(m * 0.7 + K.invLerp(-4, 30, t) * 0.3) * 90 + 10;
          foodCap[i] = cap;
          // Coherent noise, not a raw per-cell hash — a hash decorrelates
          // completely between neighbours, which reads as TV static once
          // painted into the terrain cache. Real grass patchiness (and the
          // grazing pressure that later shows through it) should look like
          // patches, not salt-and-pepper noise.
          food[i] = cap * (0.45 + 0.55 * K.noise2(seed + 5000, x * 0.12, y * 0.12));
        } else {
          foodCap[i] = 0;
          food[i] = 0;
        }
      }
    }

    const world = {
      seed, size: SIZE, biome, temp, moisture, food, foodCap,
      foodCursor: 0,
      grid: makeSpatialGrid(SIZE, 6)
    };
    world.coreSpawn = findCoreSpawn(world, K.rngFrom(seed ^ 0x9e3779b9));
    return world;
  }

  /* A grassy, temperate, non-coastal patch near the middle of the map — a
   * reasonable home base regardless of seed. */
  function findCoreSpawn(world, rng) {
    let best = null, bestScore = -Infinity;
    for (let tries = 0; tries < 400; tries++) {
      const x = K.rndInt(rng, SIZE * 0.25, SIZE * 0.75);
      const y = K.rndInt(rng, SIZE * 0.25, SIZE * 0.75);
      const i = idx(x, y);
      if (world.biome[i] !== BIOME.GRASS) continue;
      const t = world.temp[i];
      let score = -Math.abs(t - 18) - K.dist(x, y, SIZE / 2, SIZE / 2) * 0.02;
      // reward being near water (drinkable, but not flooded)
      let nearWater = false;
      for (let dy = -3; dy <= 3 && !nearWater; dy++) {
        for (let dx = -3; dx <= 3; dx++) {
          const nx = x + dx, ny = y + dy;
          if (inBounds(nx, ny) && world.biome[idx(nx, ny)] === BIOME.WATER) { nearWater = true; break; }
        }
      }
      if (nearWater) score += 5;
      if (score > bestScore) { bestScore = score; best = { x: x + 0.5, y: y + 0.5 }; }
    }
    return best || { x: SIZE / 2, y: SIZE / 2 };
  }

  function biomeAt(world, x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    if (!inBounds(xi, yi)) return BIOME.ROCK;
    return world.biome[idx(xi, yi)];
  }
  function tempAt(world, x, y) {
    const xi = K.clamp(Math.floor(x), 0, SIZE - 1), yi = K.clamp(Math.floor(y), 0, SIZE - 1);
    return world.temp[idx(xi, yi)];
  }
  function moistureAt(world, x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    if (!inBounds(xi, yi)) return 0;
    return world.moisture[idx(xi, yi)];
  }
  function foodAt(world, x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    if (!inBounds(xi, yi)) return 0;
    return world.food[idx(xi, yi)];
  }
  function consumeFood(world, x, y, amount) {
    const xi = Math.floor(x), yi = Math.floor(y);
    if (!inBounds(xi, yi)) return 0;
    const i = idx(xi, yi);
    const taken = Math.min(world.food[i], amount);
    world.food[i] -= taken;
    return taken;
  }

  /* Regrowth runs on a rolling cursor instead of a full 65k-cell sweep every
   * call, so cost per call is bounded regardless of world size. */
  function tickFood(world, batchSize) {
    const n = world.food.length;
    let c = world.foodCursor;
    for (let k = 0; k < batchSize; k++) {
      const i = c;
      if (world.foodCap[i] > 0) {
        const cap = world.foodCap[i];
        world.food[i] += (cap - world.food[i]) * 0.02;
        if (world.food[i] < 0.01) world.food[i] = 0;
      }
      c = (c + 1) % n;
    }
    world.foodCursor = c;
  }

  function findNearestFood(world, x, y, radius, minAmount) {
    const xi = Math.floor(x), yi = Math.floor(y);
    let best = null, bestD = Infinity;
    const r = Math.ceil(radius);
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const nx = xi + dx, ny = yi + dy;
        if (!inBounds(nx, ny)) continue;
        const d2 = dx * dx + dy * dy;
        if (d2 > radius * radius) continue;
        const i = idx(nx, ny);
        if (world.food[i] >= minAmount) {
          if (d2 < bestD) { bestD = d2; best = { x: nx + 0.5, y: ny + 0.5, amount: world.food[i] }; }
        }
      }
    }
    return best;
  }

  /* Nearest drinkable cell. Organisms drink from the shore rather than
   * swimming, so this returns the water cell itself and the caller treats
   * "adjacent" as close enough (see DRINK_DIST in simulation.js). */
  function findNearestWater(world, x, y, radius) {
    const xi = Math.floor(x), yi = Math.floor(y);
    let best = null, bestD = Infinity;
    const r = Math.ceil(radius);
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const nx = xi + dx, ny = yi + dy;
        if (!inBounds(nx, ny)) continue;
        const d2 = dx * dx + dy * dy;
        if (d2 > radius * radius || d2 >= bestD) continue;
        if (world.biome[idx(nx, ny)] === BIOME.WATER) {
          bestD = d2; best = { x: nx + 0.5, y: ny + 0.5 };
        }
      }
    }
    return best;
  }

  /* Is this position at or beside open water — i.e. can something standing
   * here drink without entering the lake? */
  function atWaterEdge(world, x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const nx = xi + dx, ny = yi + dy;
        if (inBounds(nx, ny) && world.biome[idx(nx, ny)] === BIOME.WATER) return true;
      }
    }
    return false;
  }

  // --- uniform spatial grid for organisms / samples -------------------------
  function makeSpatialGrid(worldSize, cellSize) {
    const cols = Math.ceil(worldSize / cellSize);
    const buckets = new Map();
    const key = (cx, cy) => cx * 100000 + cy;

    function bucketOf(x, y) {
      return [Math.floor(x / cellSize), Math.floor(y / cellSize)];
    }
    function insert(entity) {
      const [cx, cy] = bucketOf(entity.x, entity.y);
      entity.__gx = cx; entity.__gy = cy;
      const k = key(cx, cy);
      let b = buckets.get(k);
      if (!b) { b = new Set(); buckets.set(k, b); }
      b.add(entity);
    }
    function remove(entity) {
      const k = key(entity.__gx, entity.__gy);
      const b = buckets.get(k);
      if (b) { b.delete(entity); if (b.size === 0) buckets.delete(k); }
    }
    function update(entity) {
      const [cx, cy] = bucketOf(entity.x, entity.y);
      if (cx === entity.__gx && cy === entity.__gy) return;
      remove(entity);
      insert(entity);
    }
    function queryRadius(x, y, radius, out) {
      out = out || [];
      const r = Math.ceil(radius / cellSize);
      const [cx, cy] = bucketOf(x, y);
      const r2 = radius * radius;
      for (let gy = cy - r; gy <= cy + r; gy++) {
        for (let gx = cx - r; gx <= cx + r; gx++) {
          const b = buckets.get(key(gx, gy));
          if (!b) continue;
          for (const e of b) {
            if (K.dist2(e.x, e.y, x, y) <= r2) out.push(e);
          }
        }
      }
      return out;
    }
    function queryBox(minX, minY, maxX, maxY, out) {
      out = out || [];
      const [cx0, cy0] = bucketOf(minX, minY);
      const [cx1, cy1] = bucketOf(maxX, maxY);
      for (let gy = cy0; gy <= cy1; gy++) {
        for (let gx = cx0; gx <= cx1; gx++) {
          const b = buckets.get(key(gx, gy));
          if (!b) continue;
          for (const e of b) out.push(e);
        }
      }
      return out;
    }
    function clear() { buckets.clear(); }
    return { cellSize, insert, remove, update, queryRadius, queryBox, clear };
  }

  CM.world = {
    SIZE, BIOME, BIOME_NAMES, idx, inBounds,
    generate, biomeAt, tempAt, moistureAt, foodAt, consumeFood, tickFood, findNearestFood,
    findNearestWater, atWaterEdge, makeSpatialGrid
  };
})(window.CM = window.CM || {});

/* Coremind — organism instances: factory, object pool, and the pure stat/
 * comfort math shared by simulation and AI. No per-species behaviour lives
 * here — see ai.js for the reusable state machine every organism runs.
 */
(function (CM) {
  'use strict';
  const K = CM.core;
  const T = CM.traits;

  /* SEEK_WATER is the one state beyond the brief's list. The brief calls that
   * list "possible states", and water_requirement is a required stat — without
   * somewhere for a thirsty organism to go, that stat could only ever be a
   * hidden death sentence rather than a design decision the player can answer. */
  const AI_STATE = {
    IDLE: 'IDLE', EXPLORE: 'EXPLORE', SEEK_FOOD: 'SEEK_FOOD', SEEK_WATER: 'SEEK_WATER',
    FLEE: 'FLEE', HUNT: 'HUNT', ATTACK: 'ATTACK', REST: 'REST',
    RETURN_TO_CORE: 'RETURN_TO_CORE', REPRODUCE: 'REPRODUCE', INVESTIGATE: 'INVESTIGATE'
  };

  const DIRECTIVES = ['EXPLORE', 'GATHER', 'HUNT', 'DEFEND', 'REPRODUCE', 'INVESTIGATE', 'RETURN'];

  const pool = [];

  function acquire() {
    return pool.pop() || {
      id: null, ownerId: null, speciesId: null, designId: null, name: '',
      generation: 1, age: 0, x: 0, y: 0, heading: 0,
      stats: null, traits: null, behaviors: null, diet: 'herbivore',
      health: 1, energy: 1, hunger: 0, thirst: 0, burrowed: false, burrowTimer: 0,
      state: AI_STATE.IDLE, stateTimer: 0, directive: null,
      target: null, carrying: 0, alive: true, lod: 'near', selected: false,
      visualSeed: 0, lastEventAt: 0, __gx: 0, __gy: 0
    };
  }

  function release(org) {
    org.alive = false;
    org.target = null;
    pool.push(org);
  }

  let nextId = 1;

  /* traitIds: array (nulls for empty slots are fine, filtered here). */
  function create(opts) {
    const org = acquire();
    const traitIds = (opts.traits || []).filter(Boolean);
    const stats = T.resolveStats(traitIds);
    org.id = 'org_' + (nextId++);
    org.ownerId = opts.ownerId || 'wild';
    org.speciesId = opts.speciesId || null;
    org.designId = opts.designId || null;
    org.name = opts.name || (opts.speciesId ? T.WILD_BY_ID[opts.speciesId].name : 'Organism');
    org.generation = opts.generation || 1;
    org.age = 0;
    org.x = opts.x; org.y = opts.y;
    org.heading = opts.heading != null ? opts.heading : Math.random() * Math.PI * 2;
    org.stats = stats;
    org.traits = traitIds;
    org.behaviors = T.behaviorModifiers(traitIds);
    org.diet = opts.diet || (opts.ownerId === 'player' ? 'omnivore' : 'herbivore');
    org.health = stats.health;
    org.energy = stats.energyMax;
    org.hunger = 0;
    org.thirst = 0;
    org.burrowed = false;
    org.burrowTimer = 0;
    org.burrowCooldown = 0;
    org.state = AI_STATE.IDLE;
    org.stateTimer = 0;
    org.directive = opts.directive || null;
    org.directiveTarget = null;
    org.target = null;
    org.actionTarget = null;
    org.carrying = 0;
    // A random maturation delay before an organism is first eligible to
    // reproduce. Without this every organism in the starting population
    // begins at full health/energy with nothing else to do, so they all
    // enter REPRODUCE on their very first AI decision — a synchronized
    // birth spike a few seconds later, rather than a population that grows
    // gradually and staggers itself the way reproCooldown does afterward.
    org.reproCooldown = 5 + Math.random() * 28;
    org.reproTimer = null;
    org.huntTimer = 0;
    org.aiCounter = 0;
    org.__attackedThisTick = false;
    org.alive = true;
    org.lod = 'near';
    org.selected = false;
    org.visualSeed = (opts.visualSeed != null ? opts.visualSeed : Math.floor(Math.random() * 1e9));
    org.color = opts.color || (opts.ownerId === 'player' ? '#33e6b0' : (T.WILD_BY_ID[opts.speciesId] || {}).color || '#cccccc');
    return org;
  }

  /* 0 (dead center of comfort) .. 1 (right at the edge of tolerance) .. >1
   * (out of range, taking damage). temperature_tolerance is a +/- half-width
   * band around a fixed species-neutral comfort point. */
  const COMFORT_TEMP = 19;
  function tempStress(org, worldTemp) {
    const band = org.stats.temperature_tolerance;
    const d = Math.abs(worldTemp - COMFORT_TEMP);
    return d / band; // <=1 fine, >1 stressed
  }

  function isAlive(org) { return org.alive && org.health > 0; }

  CM.organism = { AI_STATE, DIRECTIVES, create, release, isAlive, tempStress, COMFORT_TEMP };
})(window.CM = window.CM || {});

<script>
/* Coremind — reusable utility AI. One function decides what any organism
 * wants to do next from its needs, senses and the player's directive; it
 * never knows about a specific species. Pure logic, no canvas/DOM — the
 * simulation gathers `ctx` (what's nearby) and executes the chosen state.
 */
(function (CM) {
  'use strict';
  const S = CM.organism.AI_STATE;

  /* How much a spotted threat scares this organism. Armor and defense make
   * standing ground more viable; a defense-heavy build flees later. */
  function fearMultiplier(org) {
    const stoutness = (org.stats.defense + org.stats.armor) / 120;
    return Math.max(0.35, 1.1 - stoutness);
  }

  function applyDirectiveBias(directive, u) {
    switch (directive) {
      case 'EXPLORE': u.EXPLORE *= 2.2; u.INVESTIGATE *= 1.4; break;
      case 'GATHER': u.SEEK_FOOD *= 2.4; u.RETURN_TO_CORE *= 1.3; break;
      case 'HUNT': u.HUNT *= 2.6; u.ATTACK *= 1.5; break;
      case 'DEFEND': u.FLEE *= 0.15; u.EXPLORE *= 0.3; break; // guard() below drives the actual behaviour
      case 'REPRODUCE': u.REPRODUCE *= 3; break;
      case 'INVESTIGATE': u.INVESTIGATE *= 3; break;
      case 'RETURN': u.RETURN_TO_CORE = 999; break;
      default: break;
    }
  }

  /* ctx fields (all optional — absence just means "nothing sensed"):
   *   canEatPlants, canHunt: bool
   *   nearestThreat:  {dist, entity}
   *   nearestFood:    {dist, x, y}
   *   nearestWater:   {x, y}
   *   nearestPrey:    {dist, entity}
   *   nearestCuriosity: {dist, x, y, kind, ref}   // unknown species sighting or sample
   *   mateAvailable:  bool
   *   coreDist: number
   *   defendRadius: number  (only meaningful with directive DEFEND)
   */
  function decide(org, ctx) {
    if (org.health <= 0) return { state: S.IDLE, target: null };

    const hungerFrac = CM.core.clamp01(org.hunger / 100);
    const thirstFrac = CM.core.clamp01(org.thirst / 100);
    const energyFrac = CM.core.clamp01(org.energy / org.stats.energyMax);
    const healthFrac = CM.core.clamp01(org.health / org.stats.health);
    const critical = hungerFrac > 0.92 || thirstFrac > 0.92 || healthFrac < 0.22;

    const u = { IDLE: 0.05, EXPLORE: 0.22, REST: 0, SEEK_FOOD: 0, SEEK_WATER: 0, HUNT: 0, FLEE: 0, RETURN_TO_CORE: 0, REPRODUCE: 0, INVESTIGATE: 0, ATTACK: 0 };

    if (ctx.nearestThreat) {
      const closeness = 1 - CM.core.clamp01(ctx.nearestThreat.dist / Math.max(1, org.stats.sense_radius));
      u.FLEE = closeness * 1.35 * fearMultiplier(org);
    }

    if (ctx.canEatPlants) {
      u.SEEK_FOOD = hungerFrac * hungerFrac * (ctx.nearestFood ? 1 : 0.45);
    }
    // Thirst curves the same way hunger does, so an organism engineered with a
    // high water_requirement genuinely spends more of its life walking to water
    // instead of doing what the player asked of it.
    u.SEEK_WATER = thirstFrac * thirstFrac * (ctx.nearestWater ? 1.05 : 0.4);
    if (ctx.canHunt && ctx.nearestPrey) {
      u.HUNT = (0.35 + hungerFrac * 0.75);
    }

    u.REST = Math.max(0, (1 - energyFrac) * 0.75 + (1 - healthFrac) * 0.25 - (ctx.nearestThreat ? 0.6 : 0));
    u.RETURN_TO_CORE = org.carrying > 0 ? 0.85 + Math.min(0.4, org.carrying / 40) : 0;
    u.REPRODUCE = (energyFrac > 0.72 && healthFrac > 0.7 && (org.reproCooldown || 0) <= 0)
      ? org.stats.reproduction_rate * 1.8 : 0;
    u.INVESTIGATE = ctx.nearestCuriosity ? 0.4 : 0;

    // A fight in progress is not re-litigated every re-decision — without
    // this an ATTACK organism would be yanked back into HUNT (which
    // immediately re-enters ATTACK, but only *after* skipping this tick's
    // damage) every single time it re-decides, i.e. every tick for anything
    // near the camera.
    if (org.state === S.ATTACK && org.actionTarget && org.actionTarget.ref && org.actionTarget.ref.health > 0) {
      u.ATTACK = 2.2;
    }

    applyDirectiveBias(org.directive, u);

    // A guarding organism holds position near the Core and only leaves the
    // utility loop to fight something that gets close, or to flee if truly
    // overwhelmed (critical health always wins — see below).
    if (org.directive === 'DEFEND') {
      if (ctx.nearestThreat && ctx.defendRadius != null && ctx.nearestThreat.dist <= ctx.defendRadius) {
        u.HUNT = Math.max(u.HUNT, 1.6); // "hunt" the intruder, i.e. engage it
      } else {
        u.EXPLORE = 0.12; // stay close; movement code keeps DEFEND orbiting the Core
      }
    }

    // Critical needs are an imperative, not a suggestion — an organism must
    // never be argued out of eating or fleeing by a stale directive.
    if (critical) {
      if (healthFrac < 0.22 && ctx.nearestThreat) u.FLEE *= 2.2;
      if (hungerFrac > 0.92) u.SEEK_FOOD = Math.max(u.SEEK_FOOD, 1.5);
      if (thirstFrac > 0.92) u.SEEK_WATER = Math.max(u.SEEK_WATER, 1.55);
    }

    // Hysteresis: mildly prefer whatever we're already doing so utilities
    // that are nearly tied don't flap the organism between states every tick.
    if (u[org.state] != null) u[org.state] *= 1.12;

    let bestState = S.IDLE, bestScore = -Infinity;
    for (const st in u) {
      if (u[st] > bestScore) { bestScore = u[st]; bestState = st; }
    }

    return resolveTarget(org, bestState, ctx);
  }

  /* Turn the chosen state into something the simulation can act on. If the
   * ideal target isn't actually available (e.g. HUNT with no prey in range),
   * fall back to a search behaviour instead of an empty action. */
  function resolveTarget(org, state, ctx) {
    switch (state) {
      case S.FLEE:
        if (!ctx.nearestThreat) return { state: S.EXPLORE, target: null };
        return { state: S.FLEE, target: { type: 'flee_from', x: ctx.nearestThreat.entity.x, y: ctx.nearestThreat.entity.y } };
      case S.SEEK_FOOD:
        if (ctx.nearestFood) return { state: S.SEEK_FOOD, target: { type: 'food_cell', x: ctx.nearestFood.x, y: ctx.nearestFood.y } };
        return { state: S.EXPLORE, target: null };
      case S.SEEK_WATER:
        if (ctx.nearestWater) return { state: S.SEEK_WATER, target: { type: 'water_cell', x: ctx.nearestWater.x, y: ctx.nearestWater.y } };
        return { state: S.EXPLORE, target: null };
      case S.HUNT:
        if (org.directive === 'DEFEND' && ctx.nearestThreat) {
          return { state: S.HUNT, target: { type: 'organism', ref: ctx.nearestThreat.entity } };
        }
        if (ctx.nearestPrey) return { state: S.HUNT, target: { type: 'organism', ref: ctx.nearestPrey.entity } };
        return { state: S.EXPLORE, target: null };
      case S.ATTACK:
        // Only ever chosen by the hysteresis guard in decide() when already
        // mid-fight; keep the exact same target rather than re-resolving it.
        if (org.actionTarget && org.actionTarget.ref && org.actionTarget.ref.health > 0) {
          return { state: S.ATTACK, target: org.actionTarget };
        }
        return { state: S.EXPLORE, target: null };
      case S.RETURN_TO_CORE:
        return { state: S.RETURN_TO_CORE, target: { type: 'core' } };
      case S.REPRODUCE:
        return { state: S.REPRODUCE, target: null };
      case S.INVESTIGATE:
        if (org.directive === 'INVESTIGATE' && org.directiveTarget) {
          return { state: S.INVESTIGATE, target: { type: 'point', x: org.directiveTarget.x, y: org.directiveTarget.y, ref: org.directiveTarget.ref || null } };
        }
        if (ctx.nearestCuriosity) return { state: S.INVESTIGATE, target: { type: 'point', x: ctx.nearestCuriosity.x, y: ctx.nearestCuriosity.y, ref: ctx.nearestCuriosity.ref || null } };
        return { state: S.EXPLORE, target: null };
      case S.REST:
        return { state: S.REST, target: null };
      default:
        return { state: S.EXPLORE, target: null };
    }
  }

  CM.ai = { decide, fearMultiplier };
})(window.CM = window.CM || {});

</script>
<script>
/* Coremind — DISCOVER -> ANALYZE -> EXTRACT.
 *
 * Traits are never unlocked by a level-up; they're earned by watching wild
 * organisms use them. Every encounter between a player organism and a wild
 * one leaves partial evidence; killing a wild organism leaves a biological
 * sample the player can walk up to and extract for a much bigger dose of
 * evidence. Once a trait has enough evidence behind it, it becomes available
 * in the genome designer.
 */
(function (CM) {
  'use strict';

  const OBSERVATION_THRESHOLD = 4;
  const EXTRACT_CREDIT = 3;
  const ENCOUNTER_CREDIT = 1;
  const SAMPLE_TTL = 180; // seconds of sim time before an unclaimed sample decays

  function newDiscoveryState() {
    return {
      events: [],
      nextEventId: 1,
      observations: {},     // traitId -> count
      discoveredTraits: {},  // traitId -> true
      knownSpecies: {},      // speciesId -> true
      samples: []            // {id, x, y, speciesId, traits, name, ttl}
    };
  }

  function pushEvent(game, bus, evt) {
    const e = Object.assign({
      id: 'evt_' + (game.discovery.nextEventId++),
      time: game.simTime,
      read: false
    }, evt);
    game.discovery.events.unshift(e);
    if (game.discovery.events.length > 200) game.discovery.events.length = 200;
    bus.emit('event', e);
    return e;
  }

  function recordSighting(game, bus, speciesId, x, y) {
    const D = game.discovery;
    if (D.knownSpecies[speciesId]) return;
    D.knownSpecies[speciesId] = true;
    const sp = CM.traits.WILD_BY_ID[speciesId];
    pushEvent(game, bus, {
      kind: 'discovery', icon: sp && sp.tier === 'predator' ? '\u{1F439}' : '\u{1F43F}',
      message: `Your organism discovered a new ${sp ? sp.tier : 'species'}: ${sp ? sp.name : speciesId}.`,
      x, y, speciesId
    });
  }

  function creditTrait(game, bus, traitId, amount) {
    const D = game.discovery;
    if (D.discoveredTraits[traitId]) return;
    D.observations[traitId] = (D.observations[traitId] || 0) + amount;
    if (D.observations[traitId] >= OBSERVATION_THRESHOLD) {
      D.discoveredTraits[traitId] = true;
      const t = CM.traits.TRAITS_BY_ID[traitId];
      pushEvent(game, bus, {
        kind: 'discovery', icon: '\u{1F9EC}',
        message: `Biological discovery: ${t.name.toUpperCase()} can now be designed into your organisms.`,
        traitId
      });
    }
  }

  /* What the Coremind can say about an organism from watching it fight —
   * the raw material of the OBSERVATION report below. Both read the
   * organism's real traits, so the report can never describe a creature
   * that isn't the one that was actually there. */
  const DAMAGE_TYPES = { venom: 'Neurotoxic', acid: 'Corrosive', claws: 'Physical (lacerating)', bite: 'Physical (crushing)' };
  const DEFENSE_NOTES = { armor: 'Heavy external shell', camouflage: 'Adaptive colouration', regeneration: 'Rapid tissue repair', burrowing: 'Subterranean evasion' };

  function observedDamageType(org) {
    for (const id of org.traits) if (DAMAGE_TYPES[id]) return DAMAGE_TYPES[id];
    return 'Physical (blunt)';
  }
  function observedDefense(org) {
    for (const id of org.traits) if (DEFENSE_NOTES[id]) return DEFENSE_NOTES[id];
    return 'None apparent';
  }

  /* outcome: 'player_killed' | 'wild_killed' | 'player_fled' | 'wild_fled' */
  function recordEncounter(game, bus, playerOrg, wildOrg, outcome, x, y) {
    recordSighting(game, bus, wildOrg.speciesId, x, y);
    for (const traitId of wildOrg.traits) {
      const t = CM.traits.TRAITS_BY_ID[traitId];
      if (!t) continue;
      const relevant = (outcome === 'player_killed' && (t.category === 'OFFENSE'))
        || (outcome === 'wild_killed' && (t.category === 'DEFENSE'))
        || t.category === 'SENSE' || t.category === 'BODY' || t.category === 'METABOLISM' || t.category === 'REPRODUCTION';
      if (relevant) creditTrait(game, bus, traitId, ENCOUNTER_CREDIT);
    }
    if (outcome === 'player_killed') {
      const identified = !!game.discovery.knownSpecies[wildOrg.speciesId];
      pushEvent(game, bus, {
        kind: 'death', icon: '☠',
        message: `${identified ? wildOrg.name : 'An unknown predator'} killed ${playerOrg.name}.`,
        // The report the player opens to work out what to build next. It is
        // the same data the trait ledger is accumulating, shown in plain
        // language at the moment it was earned.
        observation: {
          damageType: observedDamageType(wildOrg),
          defense: observedDefense(wildOrg),
          species: identified ? wildOrg.name : 'Unidentified'
        },
        x, y, orgId: playerOrg.id, speciesId: wildOrg.speciesId
      });
    }
  }

  function spawnSample(game, world, x, y, wildOrg) {
    const D = game.discovery;
    const sample = {
      id: 'sample_' + (game.discovery.nextEventId++),
      x, y, speciesId: wildOrg.speciesId, traits: wildOrg.traits.slice(),
      name: wildOrg.name, ttl: SAMPLE_TTL
    };
    D.samples.push(sample);
    return sample;
  }

  function tickSamples(game, dt) {
    const D = game.discovery;
    for (let i = D.samples.length - 1; i >= 0; i--) {
      D.samples[i].ttl -= dt;
      if (D.samples[i].ttl <= 0) D.samples.splice(i, 1);
    }
  }

  function extractSample(game, bus, sampleId) {
    const D = game.discovery;
    const i = D.samples.findIndex(s => s.id === sampleId);
    if (i < 0) return false;
    const sample = D.samples[i];
    D.samples.splice(i, 1);
    for (const traitId of sample.traits) creditTrait(game, bus, traitId, EXTRACT_CREDIT);
    pushEvent(game, bus, {
      kind: 'analysis', icon: '\u{1F52C}',
      message: `Extracted a biological sample from ${sample.name}.`,
      x: sample.x, y: sample.y
    });
    return true;
  }

  function observationProgress(game, traitId) {
    return Math.min(1, (game.discovery.observations[traitId] || 0) / OBSERVATION_THRESHOLD);
  }

  /* Every trait the Coremind has partial evidence for but hasn't identified
   * yet — the research backlog the ANALYZE tab renders, so progress toward a
   * discovery is visible while it accumulates instead of only at the moment
   * it completes. */
  function researchInProgress(game) {
    const out = [];
    for (const traitId in game.discovery.observations) {
      if (game.discovery.discoveredTraits[traitId]) continue;
      const trait = CM.traits.TRAITS_BY_ID[traitId];
      if (!trait) continue;
      out.push({
        traitId, trait,
        observations: game.discovery.observations[traitId],
        needed: OBSERVATION_THRESHOLD,
        progress: observationProgress(game, traitId)
      });
    }
    return out.sort((a, b) => b.progress - a.progress);
  }

  CM.discovery = {
    OBSERVATION_THRESHOLD, newDiscoveryState, pushEvent, recordSighting,
    recordEncounter, spawnSample, tickSamples, extractSample, observationProgress,
    researchInProgress, observedDamageType, observedDefense
  };
})(window.CM = window.CM || {});

</script>
<script>
/* Coremind — the player's own entity: the Core (biomass/energy pool),
 * directive issuance, selection, and the organism designer's draft buffer.
 * Also owns the shape of the overall game object every other system reads.
 */
(function (CM) {
  'use strict';
  const K = CM.core;
  const T = CM.traits;
  const O = CM.organism;

  function newGame(seed) {
    seed = seed >>> 0;
    const world = CM.world.generate(seed);
    const game = {
      seed, simTime: 0, speed: 1, paused: false,
      world,
      organisms: [],
      byId: {},
      core: { x: world.coreSpawn.x, y: world.coreSpawn.y, biomass: 60, energy: 55, radius: 7 },
      discovery: CM.discovery.newDiscoveryState(),
      designs: [],
      selection: null,
      camera: { x: world.coreSpawn.x, y: world.coreSpawn.y, zoom: 18, targetX: world.coreSpawn.x, targetY: world.coreSpawn.y, targetZoom: 18, dragging: false },
      stats: { playerPop: 0, herbivorePop: 0, predatorPop: 0, plantTotal: 0 },
      designerDraft: { BODY: null, SENSE: null, METABOLISM: null, DEFENSE: null, OFFENSE: null, REPRODUCTION: null },
      globalDirective: 'EXPLORE',
      nextDesignId: 1
    };
    return game;
  }

  function addOrganism(game, org) {
    game.organisms.push(org);
    game.byId[org.id] = org;
    game.world.grid.insert(org);
    return org;
  }
  function removeOrganism(game, org) {
    game.world.grid.remove(org);
    delete game.byId[org.id];
    const i = game.organisms.indexOf(org);
    if (i >= 0) game.organisms.splice(i, 1);
    if (game.selection === org.id) game.selection = null;
    O.release(org);
  }

  // --- resources -------------------------------------------------------
  function canAfford(game, cost) { return game.core.biomass >= cost.biomass && game.core.energy >= cost.energy; }
  function spend(game, cost) {
    if (!canAfford(game, cost)) return false;
    game.core.biomass -= cost.biomass;
    game.core.energy -= cost.energy;
    return true;
  }
  function deposit(game, biomass, energy) {
    game.core.biomass += biomass || 0;
    game.core.energy += energy || 0;
  }

  // --- selection & directives -------------------------------------------
  function selectOrganism(game, orgId) {
    if (game.selection && game.byId[game.selection]) game.byId[game.selection].selected = false;
    game.selection = orgId || null;
    if (orgId && game.byId[orgId]) game.byId[orgId].selected = true;
  }

  /* target: optional {x,y,ref} — required for a meaningful INVESTIGATE.
   * When nothing is selected, the directive applies colony-wide and becomes
   * the default new organisms are deployed with. */
  function issueDirective(game, directive, target) {
    if (game.selection && game.byId[game.selection]) {
      const org = game.byId[game.selection];
      org.directive = directive;
      org.directiveTarget = target || null;
      return 'selected';
    }
    game.globalDirective = directive;
    for (const org of game.organisms) {
      if (org.ownerId === 'player') { org.directive = directive; org.directiveTarget = target || null; }
    }
    return 'all';
  }

  // --- genome designer draft ---------------------------------------------
  /* Returns true if the slot was set. Refuses undiscovered traits and traits
   * that declare an incompatibility with something already in the draft —
   * the designer disables those options too, but the rule is enforced here so
   * an invalid genome cannot be built by any path. */
  function setDesignSlot(game, category, traitId) {
    if (!T.CATEGORIES.includes(category)) return false;
    if (!traitId) { game.designerDraft[category] = null; return true; }
    if (!game.discovery.discoveredTraits[traitId]) return false; // must be discovered first
    const others = T.CATEGORIES.filter(c => c !== category).map(c => game.designerDraft[c]);
    if (T.conflictsWith(others, traitId)) return false;
    game.designerDraft[category] = traitId;
    return true;
  }
  function draftTraitIds(game) { return T.CATEGORIES.map(c => game.designerDraft[c]).filter(Boolean); }
  function draftCombination(game) { return T.checkCombination(draftTraitIds(game)); }
  function draftStats(game) { return T.resolveStats(draftTraitIds(game)); }
  function draftCost(game) { return T.resolveCost(draftTraitIds(game)); }

  function createOrganismFromDraft(game, bus) {
    const cost = draftCost(game);
    if (!spend(game, cost)) return null;
    const jitter = () => (Math.random() - 0.5) * 3;
    const org = O.create({
      ownerId: 'player', traits: draftTraitIds(game),
      x: K.clamp(game.core.x + jitter(), 1, game.world.size - 1),
      y: K.clamp(game.core.y + jitter(), 1, game.world.size - 1),
      generation: 1, directive: game.globalDirective,
      name: 'Coremind-' + game.nextDesignId
    });
    game.nextDesignId++;
    addOrganism(game, org);
    CM.discovery.pushEvent(game, bus, {
      kind: 'system', icon: '\u{1F9EA}',
      message: `New organism successfully created: ${org.name}.`,
      x: org.x, y: org.y, orgId: org.id
    });
    return org;
  }

  const MAX_SAVED_DESIGNS = 8;

  /* Saved designs are how the player re-runs an experiment. Once a genome
   * has proven itself the loop should be "deploy that one again", not
   * "rebuild it from memory slot by slot". */
  function saveDesign(game, name) {
    const traitIds = draftTraitIds(game);
    if (!traitIds.length) return null;
    const design = {
      id: 'design_' + (game.nextDesignId++),
      name: name || ('Strain ' + (game.designs.length + 1)),
      traits: Object.assign({}, game.designerDraft)
    };
    game.designs.unshift(design);
    if (game.designs.length > MAX_SAVED_DESIGNS) game.designs.length = MAX_SAVED_DESIGNS;
    return design;
  }

  /* Load a saved design back into the draft, dropping any trait that is no
   * longer valid. A save file predating a rules change should degrade to a
   * partial design the player can repair, never refuse to load. */
  function loadDesign(game, designId) {
    const design = game.designs.find(d => d.id === designId);
    if (!design) return false;
    for (const cat of T.CATEGORIES) game.designerDraft[cat] = null;
    for (const cat of T.CATEGORIES) setDesignSlot(game, cat, design.traits[cat] || null);
    return true;
  }

  function deleteDesign(game, designId) {
    const i = game.designs.findIndex(d => d.id === designId);
    if (i < 0) return false;
    game.designs.splice(i, 1);
    return true;
  }

  CM.coremind = {
    newGame, addOrganism, removeOrganism, canAfford, spend, deposit,
    selectOrganism, issueDirective, setDesignSlot, draftTraitIds, draftStats, draftCost,
    draftCombination, createOrganismFromDraft, saveDesign, loadDesign, deleteDesign
  };
})(window.CM = window.CM || {});

</script>
<script>
/* Coremind — the simulation: ties world + organisms + ai together into one
 * fixed-step tick. Runs at a modest fixed rate (see main.js) independent of
 * render framerate, with LOD bands so cost stays bounded regardless of how
 * many organisms are alive.
 */
(function (CM) {
  'use strict';
  const K = CM.core;
  const W = CM.world;
  const O = CM.organism;
  const T = CM.traits;
  const D = CM.discovery;
  const S = O.AI_STATE;

  const MAX_ACTIVE = 500;
  const NEAR_R = 45, MID_R = 115;
  const SPEED_DIV = 9;             // stat speed -> cells/sec
  const ARRIVE_DIST = 0.65;
  const ATTACK_RANGE = 1.35;
  const ATTACK_LEASH = 2.4;
  const HUNT_GIVEUP = 12;
  const MAX_CARRY = 22;
  const PREY_TARGET = 70, PRED_TARGET = 22, MIN_PREY_FOR_PRED = 14;
  const WILD_CAP = 380;
  const PLAYER_REPRO_SOFT_CAP = 60;
  const WATER_SPEED_MUL = 0.4;
  const DRINK_DIST = 1.6;
  const BURROW_DURATION = 4.5, BURROW_COOLDOWN = 14;

  // -- population seeding ---------------------------------------------------
  function randomLandSpot(world, minDistFromCore, maxTries) {
    for (let i = 0; i < maxTries; i++) {
      const x = Math.random() * world.size, y = Math.random() * world.size;
      const b = W.biomeAt(world, x, y);
      if (b === W.BIOME.WATER || b === W.BIOME.ROCK) continue;
      if (minDistFromCore && K.dist(x, y, world.coreSpawn.x, world.coreSpawn.y) < minDistFromCore) continue;
      return { x, y };
    }
    return { x: world.coreSpawn.x + (Math.random() - 0.5) * 20, y: world.coreSpawn.y + (Math.random() - 0.5) * 20 };
  }

  function spawnWildOne(game, speciesId, spot) {
    const sp = T.WILD_BY_ID[speciesId];
    const org = O.create({
      ownerId: 'wild', speciesId, name: sp.name, x: spot.x, y: spot.y,
      traits: sp.traits, diet: sp.diet, color: sp.color, directive: null
    });
    CM.coremind.addOrganism(game, org);
    return org;
  }

  function spawnStarterWildlife(game) {
    const preySpecies = T.WILD_SPECIES.filter(s => s.tier === 'prey').map(s => s.id);
    const predSpecies = T.WILD_SPECIES.filter(s => s.tier === 'predator').map(s => s.id);
    for (let i = 0; i < 40; i++) {
      spawnWildOne(game, K.pick(Math.random, preySpecies), randomLandSpot(game.world, 12, 60));
    }
    for (let i = 0; i < 10; i++) {
      spawnWildOne(game, K.pick(Math.random, predSpecies), randomLandSpot(game.world, 25, 60));
    }
  }

  function spawnStarterColony(game, bus) {
    for (let i = 0; i < 3; i++) {
      const a = Math.random() * Math.PI * 2, r = 2 + Math.random() * 2;
      const org = O.create({
        ownerId: 'player', traits: [], name: 'Scout-' + (i + 1),
        x: game.core.x + Math.cos(a) * r, y: game.core.y + Math.sin(a) * r,
        directive: game.globalDirective
      });
      CM.coremind.addOrganism(game, org);
    }
    D.pushEvent(game, bus, { kind: 'system', icon: '\u{1F4E1}', message: 'Coremind established. Three starter organisms are ready for a directive.', x: game.core.x, y: game.core.y });
  }

  // -- sensing ----------------------------------------------------------------
  function isPredatorLike(org) {
    if (org.ownerId === 'wild') return T.WILD_BY_ID[org.speciesId].diet === 'carnivore';
    return org.ownerId === 'player' && (org.directive === 'HUNT' || org.directive === 'DEFEND');
  }
  function validHuntTarget(hunter, other) {
    if (other.ownerId === hunter.ownerId && hunter.ownerId === 'player') return false;
    if (hunter.ownerId === 'wild') {
      if (other.ownerId === 'player') return true;
      return other.ownerId === 'wild' && T.WILD_BY_ID[other.speciesId].tier === 'prey';
    }
    // player, directed to HUNT or defending
    return other.ownerId === 'wild';
  }
  function isThreatTo(org, other) {
    if (org.ownerId === 'player') return other.ownerId === 'wild' && T.WILD_BY_ID[other.speciesId].diet === 'carnivore';
    if (org.ownerId === 'wild' && T.WILD_BY_ID[org.speciesId].tier === 'prey') {
      return (other.ownerId === 'wild' && T.WILD_BY_ID[other.speciesId].diet === 'carnivore')
        || (other.ownerId === 'player' && (other.directive === 'HUNT'));
    }
    return false;
  }
  /* Camouflage/burrowing probabilistically keep an organism off a sensing
   * organism's radar — a mechanical payoff for those traits, not just flavour. */
  function isDetected(watcher, target) {
    if (target.burrowed) return false; // underground and out of play
    // Chemical sensing tracks a scent trail, which visual concealment does
    // nothing about — the counter that makes camouflage a choice, not a
    // strictly-correct default.
    if (watcher.behaviors.has('sense_through_walls')) return true;
    const cam = target.behaviors.has('reduce_detection') ? (target.stats.camouflage || 0) : 0;
    if (cam <= 0) return true;
    return Math.random() > cam / 140;
  }

  function gatherContext(game, org) {
    // Vibration sensing reaches further for *threats* specifically: it feels
    // footfalls through the ground rather than perceiving the whole scene.
    const senseR = org.stats.sense_radius;
    const threatR = org.behaviors.has('early_warning') ? senseR * 1.5 : senseR;
    const near = game.world.grid.queryRadius(org.x, org.y, Math.max(senseR, threatR), []);
    let nearestThreat = null, nearestPrey = null, nearestCuriosity = null;
    let bestThreatD = Infinity, bestPreyD = Infinity, bestCurD = Infinity;
    const newSightings = [];

    for (const other of near) {
      if (other === org || !O.isAlive(other)) continue;
      const d = K.dist(org.x, org.y, other.x, other.y);
      if (!isDetected(org, other)) continue;

      if (d <= threatR && isThreatTo(org, other) && d < bestThreatD) { bestThreatD = d; nearestThreat = { dist: d, entity: other }; }
      if (d <= senseR && validHuntTarget(org, other) && d < bestPreyD) {
        const canHuntNow = org.ownerId === 'wild' ? isPredatorLike(org) : org.directive === 'HUNT';
        if (canHuntNow) { bestPreyD = d; nearestPrey = { dist: d, entity: other }; }
      }
      if (d <= senseR && other.ownerId === 'wild' && !game.discovery.knownSpecies[other.speciesId]) newSightings.push({ speciesId: other.speciesId, x: other.x, y: other.y });
    }

    for (const sample of game.discovery.samples) {
      const d = K.dist(org.x, org.y, sample.x, sample.y);
      if (d <= senseR && d < bestCurD) { bestCurD = d; nearestCuriosity = { dist: d, x: sample.x, y: sample.y, ref: sample }; }
    }

    const canEatPlants = org.diet !== 'carnivore';
    const canHunt = org.ownerId === 'wild' ? isPredatorLike(org) : org.directive === 'HUNT';
    const nearestFood = canEatPlants ? W.findNearestFood(game.world, org.x, org.y, senseR, 4) : null;
    // Water is only looked up when the organism actually cares — this is a
    // grid scan, and running it for every organism every decision would cost
    // far more than the thirst system is worth.
    // Search range widens with thirst: a desperate animal ranges much further
    // for water than a comfortable one bothers to.
    const nearestWater = org.thirst > 25
      ? W.findNearestWater(game.world, org.x, org.y, senseR * (1.6 + K.clamp01(org.thirst / 100) * 2.6))
      : null;

    return { nearestThreat, nearestPrey, nearestFood, nearestWater, nearestCuriosity, canEatPlants, canHunt, newSightings, defendRadius: senseR };
  }

  // -- movement ---------------------------------------------------------------
  /* Open water is crossable but expensive, rather than a hard wall. A wall
   * needs pathfinding to look anything but stupid (organisms grinding along a
   * shoreline); a movement cost gets the same read — creatures go around
   * lakes, and the map's water genuinely shapes where life goes — with none
   * of the stuck-against-geometry failure modes. */
  function moveToward(world, org, tx, ty, dt, mul) {
    const dx = tx - org.x, dy = ty - org.y;
    const d = Math.hypot(dx, dy);
    if (d < 1e-4) return 0;
    const desired = Math.atan2(dy, dx);
    org.heading = K.turnToward(org.heading, desired, 5 * dt);
    const terrain = W.biomeAt(world, org.x, org.y) === W.BIOME.WATER ? WATER_SPEED_MUL : 1;
    const spd = (org.stats.speed / SPEED_DIV) * (mul || 1) * terrain;
    const step = Math.min(d, spd * dt);
    org.x += Math.cos(org.heading) * step;
    org.y += Math.sin(org.heading) * step;
    return d - step;
  }

  /* Wandering is random, except when the organism is thirsty — then it walks
   * up the humidity gradient. Large inland stretches of this map hold no
   * open water at all, so without a gradient to follow a thirsty organism
   * out there has no strategy but luck, and quietly dies. Following moisture
   * is both a real thing animals do and the reason droughts here produce
   * migration toward the wet regions rather than a silent die-off. */
  function pickWanderTarget(org, world, radius) {
    const thirsty = org.thirst > 55;
    let best = null, bestMoisture = -1;
    for (let i = 0; i < 6; i++) {
      const a = Math.random() * Math.PI * 2, r = 3 + Math.random() * radius;
      const x = K.clamp(org.x + Math.cos(a) * r, 1, world.size - 1);
      const y = K.clamp(org.y + Math.sin(a) * r, 1, world.size - 1);
      if (W.biomeAt(world, x, y) === W.BIOME.WATER) continue;
      if (!thirsty) return { x, y };
      const m = W.moistureAt(world, x, y);
      if (m > bestMoisture) { bestMoisture = m; best = { x, y }; }
    }
    return best || { x: org.x, y: org.y };
  }

  // -- combat / death -----------------------------------------------------
  function resolveDeath(game, bus, victim, killer) {
    if (victim.ownerId === 'wild') {
      if (killer && killer.ownerId === 'player') {
        D.spawnSample(game, game.world, victim.x, victim.y, victim);
        D.recordEncounter(game, bus, killer, victim, 'wild_killed', victim.x, victim.y);
        killer.carrying = Math.min(MAX_CARRY, killer.carrying + 9 + victim.stats.size * 0.25);
      }
    } else {
      if (killer) D.recordEncounter(game, bus, victim, killer, 'player_killed', victim.x, victim.y);
    }
    CM.coremind.removeOrganism(game, victim);
  }

  function meleeTick(game, bus, org, dt) {
    const target = org.actionTarget && org.actionTarget.ref;
    if (!target || !O.isAlive(target)) { org.state = S.EXPLORE; org.actionTarget = null; org.aiCounter = 0; return; }
    const d = K.dist(org.x, org.y, target.x, target.y);
    if (d > ATTACK_LEASH) { org.state = S.HUNT; return; }

    const pierce = org.behaviors.has('armor_pierce') ? 0.5 : 1;
    const venomMul = org.behaviors.has('damage_over_time') ? 1.28 : 1;
    const effDef = target.stats.defense * pierce;
    const dmg = Math.max(1, org.stats.attack - effDef * 0.5) * venomMul * dt;
    target.health -= dmg;
    if (org.behaviors.has('passive_heal')) target.__attackedThisTick = true;

    const retaliates = (target.ownerId === 'wild' && T.WILD_BY_ID[target.speciesId].diet === 'carnivore')
      || (target.ownerId === 'player' && (target.directive === 'DEFEND' || target.directive === 'HUNT'));
    let retaliationDealt = 0;
    if (retaliates && target.health > 0) {
      const rEffDef = org.stats.defense;
      const rDmg = Math.max(1, target.stats.attack - rEffDef * 0.5) * dt;
      org.health -= rDmg;
      retaliationDealt = rDmg;
    }

    if (target.health <= 0) { resolveDeath(game, bus, target, org); org.state = S.EXPLORE; org.actionTarget = null; org.aiCounter = 0; }
    // Credit the kill to the target only if it actually fought back. An
    // attacker that was already starving or dehydrated can cross zero during
    // its own attack, and blaming whatever it happened to be biting produced
    // reports like "Grazer killed Scout" — a herbivore that never deals
    // damage. Those reports are the evidence the player designs from, so a
    // false one is worse than none.
    if (org.health <= 0) resolveDeath(game, bus, org, retaliationDealt > 0 ? target : null);
  }

  // -- per-organism step ------------------------------------------------------
  function executeState(game, bus, org, dt) {
    const world = game.world;
    switch (org.state) {
      case S.EXPLORE: {
        if (!org.actionTarget || K.dist(org.x, org.y, org.actionTarget.x, org.actionTarget.y) < ARRIVE_DIST) {
          const radius = (org.ownerId === 'player' && org.directive === 'EXPLORE') ? 26 : 10;
          org.actionTarget = pickWanderTarget(org, world, radius);
        }
        moveToward(world, org, org.actionTarget.x, org.actionTarget.y, dt, 0.55);
        break;
      }
      case S.SEEK_FOOD: {
        const tgt = org.actionTarget;
        if (!tgt) { org.state = S.EXPLORE; break; }
        const d = moveToward(world, org, tgt.x, tgt.y, dt, 0.8);
        if (d < ARRIVE_DIST) {
          const taken = W.consumeFood(world, tgt.x, tgt.y, 16);
          org.hunger = Math.max(0, org.hunger - taken * 3.2);
          org.energy = Math.min(org.stats.energyMax, org.energy + taken * 0.6);
          if (org.ownerId === 'player' && org.directive === 'GATHER') {
            org.carrying = Math.min(MAX_CARRY, org.carrying + taken * 0.5);
          }
          org.actionTarget = null; org.aiCounter = 0;
        }
        break;
      }
      case S.SEEK_WATER: {
        const tgt = org.actionTarget;
        if (!tgt) { org.state = S.EXPLORE; break; }
        // Drinking happens from the shore, so arriving *next to* the water
        // cell is enough — walking into the lake would only cost speed.
        moveToward(world, org, tgt.x, tgt.y, dt, 0.85);
        if (W.atWaterEdge(world, org.x, org.y) || K.dist(org.x, org.y, tgt.x, tgt.y) < DRINK_DIST) {
          org.thirst = Math.max(0, org.thirst - 55 * dt);
          if (org.thirst <= 0) { org.actionTarget = null; org.aiCounter = 0; }
        }
        break;
      }
      case S.HUNT: {
        const tgt = org.actionTarget && org.actionTarget.ref;
        if (!tgt || !O.isAlive(tgt)) { org.state = S.EXPLORE; org.actionTarget = null; org.aiCounter = 0; break; }
        const d = K.dist(org.x, org.y, tgt.x, tgt.y);
        org.huntTimer = (org.huntTimer || 0) + dt;
        if (d <= ATTACK_RANGE) { org.state = S.ATTACK; org.huntTimer = 0; break; }
        if (org.huntTimer > HUNT_GIVEUP) { org.state = S.EXPLORE; org.actionTarget = null; org.aiCounter = 0; org.huntTimer = 0; break; }
        moveToward(world, org, tgt.x, tgt.y, dt, 1.05);
        break;
      }
