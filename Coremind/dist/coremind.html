      case S.ATTACK:
        meleeTick(game, bus, org, dt);
        break;
      case S.FLEE: {
        const away = org.actionTarget;
        // A digger that can't outrun the threat goes under instead. This is
        // what `digging` buys: burrowing beats being slow, which is the whole
        // reason the trait's speed penalty is affordable.
        if (org.behaviors.has('can_burrow_flee') && !org.burrowed && org.burrowCooldown <= 0
            && away && K.dist(org.x, org.y, away.x, away.y) < 7
            && W.biomeAt(world, org.x, org.y) !== W.BIOME.WATER) {
          org.burrowed = true;
          org.burrowTimer = BURROW_DURATION * (0.6 + org.stats.digging / 90);
          break;
        }
        if (away) {
          const a = Math.atan2(org.y - away.y, org.x - away.x);
          moveToward(world, org, org.x + Math.cos(a) * 6, org.y + Math.sin(a) * 6, dt, 1.15);
        }
        break;
      }
      case S.REST:
        org.energy = Math.min(org.stats.energyMax, org.energy + org.stats.energyMax * 0.08 * dt);
        org.health = Math.min(org.stats.health, org.health + org.stats.health * 0.02 * dt);
        break;
      case S.RETURN_TO_CORE: {
        const d = moveToward(world, org, game.core.x, game.core.y, dt, 1);
        if (d < game.core.radius) {
          if (org.carrying > 0) {
            CM.coremind.deposit(game, org.carrying, org.carrying * 0.25);
            org.carrying = 0;
          }
          org.aiCounter = 0;
        }
        break;
      }
      case S.REPRODUCE: {
        if (org.reproTimer == null) org.reproTimer = 3.5 + org.stats.size * 0.06;
        org.reproTimer -= dt;
        if (org.reproTimer <= 0) {
          attemptReproduce(game, bus, org);
          org.reproTimer = null; org.reproCooldown = 22 + Math.random() * 10; org.aiCounter = 0;
        }
        break;
      }
      case S.INVESTIGATE: {
        const tgt = org.actionTarget;
        if (!tgt) { org.state = S.EXPLORE; break; }
        const d = moveToward(world, org, tgt.x, tgt.y, dt, 0.7);
        if (d < ARRIVE_DIST) { org.directiveTarget = null; org.actionTarget = null; org.aiCounter = 0; }
        break;
      }
      default: break;
    }
  }

  function attemptReproduce(game, bus, org) {
    if (game.organisms.length >= MAX_ACTIVE) return;
    // Wild reproduction has its own soft ceiling (double the target density)
    // so the ecosystem plateaus instead of one tier filling the entire
    // active-organism cap and crowding out everything else, including the
    // player's own designs.
    if (org.ownerId === 'wild') {
      const tier = T.WILD_BY_ID[org.speciesId].tier;
      if (tier === 'prey' && game.stats.herbivorePop >= PREY_TARGET * 2) return;
      if (tier === 'predator' && game.stats.predatorPop >= PRED_TARGET * 2) return;
    } else if (game.stats.playerPop >= PLAYER_REPRO_SOFT_CAP) {
      // Auto-reproduction pauses once the colony is sizeable so it never
      // crowds out the wildlife or the player's own room to deploy fresh
      // designs — deliberate CREATE ORGANISM spend is never blocked by this.
      return;
    }
    org.energy -= org.stats.energyMax * 0.42;
    org.health -= org.stats.health * 0.08;
    const jitter = () => (Math.random() - 0.5) * 2.4;
    let traits = org.traits.slice();
    if (org.ownerId === 'wild' && Math.random() < 0.08) {
      const cat = K.pick(Math.random, T.CATEGORIES);
      const options = T.TRAITS_BY_CATEGORY[cat];
      if (options.length) traits = traits.filter(id => T.TRAITS_BY_ID[id].category !== cat).concat([K.pick(Math.random, options).id]);
    }
    const child = O.create({
      ownerId: org.ownerId, speciesId: org.speciesId, designId: org.designId,
      name: org.ownerId === 'player' ? org.name : org.name,
      traits, diet: org.diet, color: org.color,
      x: K.clamp(org.x + jitter(), 1, game.world.size - 1),
      y: K.clamp(org.y + jitter(), 1, game.world.size - 1),
      generation: org.generation + 1,
      directive: org.ownerId === 'player' ? org.directive : null
    });
    CM.coremind.addOrganism(game, child);
    return child;
  }

  // -- wild population maintenance --------------------------------------------
  function maybeSpawnWild(game, dt) {
    game.wildSpawnAcc = (game.wildSpawnAcc || 0) + dt;
    if (game.wildSpawnAcc < 1.4) return;
    game.wildSpawnAcc = 0;
    if (game.organisms.length >= MAX_ACTIVE) return;
    const wildCount = game.stats.herbivorePop + game.stats.predatorPop;
    if (wildCount >= WILD_CAP) return;

    if (game.stats.herbivorePop < PREY_TARGET && Math.random() < 0.55) {
      const species = T.WILD_SPECIES.filter(s => s.tier === 'prey').map(s => s.id);
      spawnWildOne(game, K.pick(Math.random, species), randomLandSpot(game.world, 8, 30));
    } else if (game.stats.predatorPop < PRED_TARGET && game.stats.herbivorePop > MIN_PREY_FOR_PRED && Math.random() < 0.28) {
      const species = T.WILD_SPECIES.filter(s => s.tier === 'predator').map(s => s.id);
      spawnWildOne(game, K.pick(Math.random, species), randomLandSpot(game.world, 20, 30));
    }
  }

  // -- main tick ----------------------------------------------------------
  function tick(game, bus, dt) {
    game.simTime += dt;

    W.tickFood(game.world, 3200);
    D.tickSamples(game, dt);
    maybeSpawnWild(game, dt);

    const camX = game.camera.x, camY = game.camera.y;
    let playerPop = 0, herbivorePop = 0, predatorPop = 0, plantTotal = 0;

    // Snapshot the roster before iterating: resolveDeath() splices
    // game.organisms as organisms die (natural causes below, or combat
    // inside executeState/meleeTick), and mutating an array mid-`for...of`
    // silently skips whatever shifts into the current index.
    const roster = game.organisms.slice();

    for (const org of roster) {
      if (!org.alive) continue; // already resolveDeath'd earlier this tick (e.g. to a faster predator)
      org.age += dt;

      const distCam = K.dist(org.x, org.y, camX, camY);
      org.lod = distCam < NEAR_R ? 'near' : distCam < MID_R ? 'mid' : 'far';

      // A burrowed organism is out of play: safe, still, and recovering. It
      // skips sensing, deciding and acting entirely, which also makes
      // burrowing the cheapest thing in the sim rather than the priciest.
      if (org.burrowed) {
        org.burrowTimer -= dt;
        org.energy = Math.min(org.stats.energyMax, org.energy + org.stats.energyMax * 0.03 * dt);
        org.hunger = K.clamp(org.hunger + (org.stats.metabolism / 11) * 0.4 * dt, 0, 100);
        if (org.burrowTimer <= 0) {
          org.burrowed = false;
          org.burrowCooldown = BURROW_COOLDOWN;
          org.state = S.EXPLORE; org.actionTarget = null; org.aiCounter = 0;
        }
        playerPop += org.ownerId === 'player' ? 1 : 0;
        if (org.ownerId === 'wild') {
          const sp = T.WILD_BY_ID[org.speciesId];
          if (sp && sp.tier === 'predator') predatorPop++; else herbivorePop++;
        }
        continue;
      }
      if (org.burrowCooldown > 0) org.burrowCooldown -= dt;

      // needs
      const metaRate = org.stats.metabolism / 11;
      org.hunger = K.clamp(org.hunger + metaRate * 1.05 * dt, 0, 100);
      org.thirst = K.clamp(org.thirst + metaRate * org.stats.water_requirement * 1.6 * dt, 0, 100);
      const moving = org.state === S.EXPLORE || org.state === S.HUNT || org.state === S.FLEE || org.state === S.SEEK_FOOD || org.state === S.SEEK_WATER || org.state === S.RETURN_TO_CORE;
      org.energy = K.clamp(org.energy - metaRate * (moving ? 0.9 : 0.35) * dt, 0, org.stats.energyMax);
      if (org.hunger >= 100) org.health -= org.stats.health * 0.03 * dt;
      if (org.thirst >= 100) org.health -= org.stats.health * 0.035 * dt;
      if (org.energy <= 0) org.health -= org.stats.health * 0.015 * dt;

      const stress = O.tempStress(org, W.tempAt(game.world, org.x, org.y));
      if (stress > 1) {
        org.health -= org.stats.health * 0.02 * (stress - 1) * dt;
        // Heat drives thirst: a badly-adapted organism in the wrong climate
        // dies of the heat *and* of the water it costs to cope with it.
        org.thirst = K.clamp(org.thirst + (stress - 1) * 1.2 * dt, 0, 100);
      }

      if (org.behaviors.has('passive_heal') && org.hunger < 85 && !org.__attackedThisTick) {
        org.health = Math.min(org.stats.health, org.health + org.stats.health * 0.045 * dt);
      }
      org.__attackedThisTick = false;

      if (org.reproCooldown > 0) org.reproCooldown -= dt;

      // Resolve a needs death here, before the organism gets to sense, decide
      // or act. Letting a corpse take another swing is both wrong and the
      // source of misattributed kills further down.
      if (org.health <= 0) { resolveDeath(game, bus, org, null); continue; }

      // AI re-decision, throttled by LOD
      org.aiCounter = (org.aiCounter || 0) - 1;
      if (org.aiCounter <= 0) {
        const interval = org.lod === 'near' ? 1 : org.lod === 'mid' ? 4 : 12;
        org.aiCounter = interval;
        const ctx = gatherContext(game, org);
        for (const s of ctx.newSightings) D.recordSighting(game, bus, s.speciesId, s.x, s.y);
        const decision = CM.ai.decide(org, ctx);
        const transitioning = decision.state !== org.state;
        if (transitioning) { org.state = decision.state; org.huntTimer = 0; }
        // A null target on an unchanged state (e.g. still EXPLORE) means
        // "nothing new to report" — keep whatever in-progress target
        // executeState is working toward instead of wiping it every
        // re-decision, which for a near-camera organism is every tick.
        if (decision.target !== null || transitioning) org.actionTarget = decision.target;
      }

      executeState(game, bus, org, dt);
      // Deliberately org.alive, not O.isAlive(): isAlive also factors in
      // health, which is true both for "combat already resolveDeath'd this
      // organism inside meleeTick" (alive=false — skip) and for "hunger/temp
      // damage above just dropped health to 0 and hasn't been resolved yet"
      // (alive still true — must fall through to the health<=0 check below,
      // or the organism becomes a permanent zombie: dead in every practical
      // sense but never removed from the roster).
      if (!org.alive) continue;

      org.x = K.clamp(org.x, 0.1, game.world.size - 0.1);
      org.y = K.clamp(org.y, 0.1, game.world.size - 0.1);
      game.world.grid.update(org);

      if (org.health <= 0) { resolveDeath(game, bus, org, null); continue; }

      if (org.ownerId === 'player') playerPop++;
      else {
        const sp = T.WILD_BY_ID[org.speciesId];
        if (sp && sp.tier === 'predator') predatorPop++; else herbivorePop++;
      }
    }

    for (let i = 0; i < game.world.food.length; i += 733) plantTotal += game.world.food[i]; // sampled estimate, cheap
    game.stats = { playerPop, herbivorePop, predatorPop, plantTotal: Math.round(plantTotal) };

    // slow passive core regeneration — the Coremind's own baseline metabolism
    game.core.energy = Math.min(999, game.core.energy + 0.9 * dt);

    narrateEcosystem(game, bus, dt);
  }

  /* The food web has to visibly react on its own, not just in the player's
   * organisms. Rather than scripting it, watch the population numbers the
   * simulation already produces and say something when they cross a
   * threshold — each flag latches so one crossing narrates once, not every
   * tick it stays crossed. */
  function narrateEcosystem(game, bus, dt) {
    const eco = game.eco || (game.eco = { acc: 0, prevHerb: 0, prevPred: 0, shortage: false, predSurge: false, herbCrash: false });
    eco.acc += dt;
    if (eco.acc < 16) return;
    eco.acc = 0;

    const s = game.stats;
    const plantFrac = K.clamp01(s.plantTotal / 3200);

    if (plantFrac < 0.18 && !eco.shortage) {
      eco.shortage = true;
      D.pushEvent(game, bus, { kind: 'warn', icon: '\u{1F342}', message: 'Food shortage detected — plant coverage is critically low.' });
    } else if (plantFrac > 0.35) eco.shortage = false;

    if (eco.prevPred > 4 && s.predatorPop > eco.prevPred * 1.4 && !eco.predSurge) {
      eco.predSurge = true;
      D.pushEvent(game, bus, { kind: 'warn', icon: '\u{1F43A}', message: 'Predator population increasing.' });
    } else if (s.predatorPop < eco.prevPred * 1.15) eco.predSurge = false;

    if (eco.prevHerb > 10 && s.herbivorePop < eco.prevHerb * 0.55 && !eco.herbCrash) {
      eco.herbCrash = true;
      D.pushEvent(game, bus, { kind: 'warn', icon: '\u{26A0}', message: 'Herbivore population crashing — predators will follow.' });
    } else if (s.herbivorePop > eco.prevHerb * 0.85) eco.herbCrash = false;

    eco.prevHerb = s.herbivorePop; eco.prevPred = s.predatorPop;
  }

  CM.simulation = {
    MAX_ACTIVE, tick, spawnStarterColony, spawnStarterWildlife, spawnWildOne, randomLandSpot, gatherContext
  };
})(window.CM = window.CM || {});

</script>
<script>
/* Coremind — camera + rendering. Terrain is baked once into an offscreen
 * canvas (1 pixel per world cell) and blitted with a single drawImage per
 * frame regardless of zoom level; only organisms/samples/Core are drawn as
 * individual shapes, and only the ones inside the viewport (+ a margin).
 */
(function (CM) {
  'use strict';
  const K = CM.core;
  const W = CM.world;
  const T = CM.traits;

  const ZOOM_MIN = 5, ZOOM_MAX = 46;
  const CAM_EASE = 6.5; // per-second convergence rate toward the camera target

  const BIOME_COLOR = {
    [W.BIOME.WATER]: [26, 61, 92],
    [W.BIOME.SOIL]: [90, 68, 48],
    [W.BIOME.ROCK]: [78, 80, 84]
  };

  function buildTerrainCache(world) {
    const size = world.size;
    const canvas = (typeof OffscreenCanvas !== 'undefined')
      ? new OffscreenCanvas(size, size)
      : Object.assign(document.createElement('canvas'), { width: size, height: size });
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(size, size);
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const i = y * size + x;
        const p = i * 4;
        const b = world.biome[i];
        let rgb;
        if (b === W.BIOME.GRASS) {
          const lush = K.clamp01(world.food[i] / Math.max(1, world.foodCap[i]));
          const t = K.clamp01(K.invLerp(-4, 30, world.temp[i]));
          const g1 = [107, 66, 38], g2 = [63, 138, 58], g3 = [150, 168, 60];
          const cold = [K.lerp(g1[0], g2[0], lush), K.lerp(g1[1], g2[1], lush), K.lerp(g1[2], g2[2], lush)];
          const warm = [K.lerp(g1[0], g3[0], lush), K.lerp(g1[1], g3[1], lush), K.lerp(g1[2], g3[2], lush)];
          rgb = [K.lerp(cold[0], warm[0], t), K.lerp(cold[1], warm[1], t), K.lerp(cold[2], warm[2], t)];
        } else {
          rgb = BIOME_COLOR[b] || [50, 50, 50];
        }
        img.data[p] = rgb[0] | 0; img.data[p + 1] = rgb[1] | 0; img.data[p + 2] = rgb[2] | 0; img.data[p + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    return canvas;
  }

  function ensureCache(game) {
    if (!game.render) game.render = {};
    if (!game.render.terrainCanvas || game.render.terrainSeed !== game.seed) {
      game.render.terrainCanvas = buildTerrainCache(game.world);
      game.render.terrainSeed = game.seed;
    }
    return game.render.terrainCanvas;
  }

  function resizeCanvas(canvas) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    return dpr;
  }

  function clampCamera(game) {
    const c = game.camera, size = game.world.size;
    c.x = K.clamp(c.x, 0, size);
    c.y = K.clamp(c.y, 0, size);
    c.zoom = K.clamp(c.zoom, ZOOM_MIN, ZOOM_MAX);
    if (c.targetZoom != null) c.targetZoom = K.clamp(c.targetZoom, ZOOM_MIN, ZOOM_MAX);
  }

  function focusOn(game, x, y, zoom) {
    const c = game.camera;
    c.targetX = x; c.targetY = y;
    if (zoom != null) c.targetZoom = zoom;
  }

  function updateCamera(game, dt) {
    const c = game.camera;
    if (c.targetX == null) { c.targetX = c.x; c.targetY = c.y; c.targetZoom = c.zoom; }
    if (!c.dragging) {
      const t = 1 - Math.exp(-CAM_EASE * dt);
      c.x = K.lerp(c.x, c.targetX, t);
      c.y = K.lerp(c.y, c.targetY, t);
      c.zoom = K.lerp(c.zoom, c.targetZoom, t);
    }
    clampCamera(game);
  }

  function worldToScreen(game, canvas, wx, wy) {
    const c = game.camera;
    return {
      x: (wx - c.x) * c.zoom + canvas.width / 2,
      y: (wy - c.y) * c.zoom + canvas.height / 2
    };
  }
  function screenToWorld(game, canvas, sx, sy) {
    const c = game.camera;
    return {
      x: (sx - canvas.width / 2) / c.zoom + c.x,
      y: (sy - canvas.height / 2) / c.zoom + c.y
    };
  }

  // -- organism drawing -------------------------------------------------------
  function drawOrganism(ctx, org, sx, sy, zoom, alpha) {
    const size = Math.max(1.5, org.stats.size * 0.075) * zoom;
    const mods = new Set(org.traits.map(id => (T.TRAITS_BY_ID[id] || {}).visual_modifier).filter(Boolean));
    const stretch = mods.has('streamlined') ? 1.5 : mods.has('lean') ? 1.25 : 1;

    // A burrowed organism is drawn as the mound it left behind — it has to be
    // visibly *gone* rather than merely faded, because "the predator can no
    // longer see it" is the entire mechanic.
    if (org.burrowed) {
      ctx.save();
      ctx.fillStyle = 'rgba(74,56,38,.85)';
      ctx.beginPath();
      ctx.ellipse(sx, sy, size * 1.15, size * 0.6, 0, Math.PI, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(20,14,8,.5)'; ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
      return;
    }

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(org.heading);

    // camouflage: render translucent to hint that predators struggle to spot it
    if (mods.has('mottled')) ctx.globalAlpha = 0.62;

    // legs / digger limbs, drawn under the body
    if (mods.has('legs') || mods.has('digger')) {
      ctx.strokeStyle = 'rgba(0,0,0,.35)';
      ctx.lineWidth = Math.max(1, size * 0.12);
      const n = mods.has('digger') ? 3 : 2;
      for (let i = 0; i < n; i++) {
        const t = (i / (n - 1 || 1) - 0.5) * size * 1.6;
        ctx.beginPath(); ctx.moveTo(t, size * 0.55); ctx.lineTo(t * 0.7, size * 1.05); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(t, -size * 0.55); ctx.lineTo(t * 0.7, -size * 1.05); ctx.stroke();
      }
    }

    // body
    let bodyColor = org.color;
    if (mods.has('warm_hued')) bodyColor = tint(bodyColor, [40, 10, -10]);
    if (mods.has('cool_hued')) bodyColor = tint(bodyColor, [-15, 5, 35]);
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.ellipse(0, 0, size * stretch, size * 0.72, 0, 0, Math.PI * 2);
    ctx.fill();

    if (mods.has('shell')) {
      ctx.strokeStyle = 'rgba(20,20,20,.55)';
      ctx.lineWidth = Math.max(1.2, size * 0.22);
      ctx.beginPath(); ctx.ellipse(0, 0, size * stretch * 0.86, size * 0.56, 0, 0, Math.PI * 2); ctx.stroke();
    }
    if (mods.has('veined')) {
      ctx.strokeStyle = 'rgba(255,90,90,.5)';
      ctx.lineWidth = Math.max(0.6, size * 0.08);
      ctx.beginPath(); ctx.moveTo(-size * 0.4, 0); ctx.lineTo(size * 0.4, 0); ctx.stroke();
    }

    // head features (front = +x local, since heading rotates toward travel dir)
    if (mods.has('jaws') || mods.has('claws')) {
      ctx.fillStyle = 'rgba(30,20,20,.85)';
      ctx.beginPath();
      ctx.moveTo(size * stretch * 0.85, -size * 0.22);
      ctx.lineTo(size * stretch * 1.35, 0);
      ctx.lineTo(size * stretch * 0.85, size * 0.22);
      ctx.closePath(); ctx.fill();
    }
    if (mods.has('eyes')) {
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(size * stretch * 0.55, -size * 0.28, size * 0.15, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(size * stretch * 0.55, size * 0.28, size * 0.15, 0, Math.PI * 2); ctx.fill();
    }
    if (mods.has('antennae')) {
      ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = Math.max(0.6, size * 0.08);
      ctx.beginPath(); ctx.moveTo(size * stretch * 0.6, -size * 0.1); ctx.lineTo(size * stretch * 1.3, -size * 0.55); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(size * stretch * 0.6, size * 0.1); ctx.lineTo(size * stretch * 1.3, size * 0.55); ctx.stroke();
    }
    if (mods.has('whiskers')) {
      ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = Math.max(0.5, size * 0.06);
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(0, s * size * 0.6); ctx.lineTo(-size * 0.6, s * size * 1.0); ctx.stroke();
      }
    }
    if (mods.has('venom_glands')) {
      ctx.fillStyle = '#8a3fd1';
      for (const s of [-0.35, 0.35]) { ctx.beginPath(); ctx.arc(-size * 0.15, s * size * 0.55, size * 0.22, 0, Math.PI * 2); ctx.fill(); }
    }
    if (mods.has('acid_sacs')) {
      ctx.fillStyle = '#8fd15a';
      for (const s of [-0.3, 0.3]) { ctx.beginPath(); ctx.arc(-size * 0.25, s * size * 0.5, size * 0.2, 0, Math.PI * 2); ctx.fill(); }
    }
    if (mods.has('brood_sac')) {
      ctx.fillStyle = 'rgba(255,200,220,.85)';
      ctx.beginPath(); ctx.ellipse(-size * 0.95, 0, size * 0.4, size * 0.32, 0, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();

    if (org.selected) {
      ctx.save();
      ctx.strokeStyle = '#33e6b0'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, size * 1.9, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    // health bar for anything below 60% — a quiet, constant readout of danger
    const hf = K.clamp01(org.health / org.stats.health);
    if (hf < 0.6) {
      const w = Math.max(10, size * 2.2), h = 3;
      const bx = sx - w / 2, by = sy - size * 1.9 - 6;
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(bx, by, w, h);
      ctx.fillStyle = hf < 0.3 ? '#ef5b5b' : '#f2a33c'; ctx.fillRect(bx, by, w * hf, h);
    }
  }

  function tint(hex, delta) {
    const c = hexToRgb(hex);
    return `rgb(${K.clamp(c[0] + delta[0], 0, 255)},${K.clamp(c[1] + delta[1], 0, 255)},${K.clamp(c[2] + delta[2], 0, 255)})`;
  }
  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }

  // -- main draw ---------------------------------------------------------
  function draw(game, canvas, ctx) {
    const dpr = resizeCanvas(canvas);
    const w = canvas.width, h = canvas.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#04080d';
    ctx.fillRect(0, 0, w, h);

    const zoom = game.camera.zoom * dpr;
    const size = game.world.size;
    const halfW = w / 2 / zoom, halfH = h / 2 / zoom;
    let sx0 = game.camera.x - halfW, sy0 = game.camera.y - halfH;
    let sx1 = game.camera.x + halfW, sy1 = game.camera.y + halfH;
    const csx0 = K.clamp(sx0, 0, size), csy0 = K.clamp(sy0, 0, size);
    const csx1 = K.clamp(sx1, 0, size), csy1 = K.clamp(sy1, 0, size);

    if (csx1 > csx0 && csy1 > csy0) {
      const cache = ensureCache(game);
      const dx0 = (csx0 - game.camera.x) * zoom + w / 2, dy0 = (csy0 - game.camera.y) * zoom + h / 2;
      const dx1 = (csx1 - game.camera.x) * zoom + w / 2, dy1 = (csy1 - game.camera.y) * zoom + h / 2;
      ctx.imageSmoothingEnabled = zoom < 3;
      ctx.drawImage(cache, csx0, csy0, csx1 - csx0, csy1 - csy0, dx0, dy0, dx1 - dx0, dy1 - dy0);
    }

    // Core
    {
      const p = worldToScreenDpr(game, w, h, zoom, dpr, game.core.x, game.core.y);
      const r = game.core.radius * zoom;
      const pulse = 0.85 + Math.sin(game.simTime * 2) * 0.08;
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * pulse);
      grad.addColorStop(0, 'rgba(51,230,176,.55)');
      grad.addColorStop(1, 'rgba(51,230,176,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0f2e26';
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(4, r * 0.32), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#33e6b0'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(4, r * 0.32), 0, Math.PI * 2); ctx.stroke();
    }

    // samples
    for (const s of game.discovery.samples) {
      if (s.x < sx0 - 2 || s.x > sx1 + 2 || s.y < sy0 - 2 || s.y > sy1 + 2) continue;
      const p = worldToScreenDpr(game, w, h, zoom, dpr, s.x, s.y);
      const r = Math.max(4, 3.6 * zoom / 12);
      ctx.fillStyle = 'rgba(51,230,176,.85)';
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 2.5, 0, Math.PI * 2); ctx.stroke();
    }

    // organisms (viewport-culled)
    const margin = 3;
    for (const org of game.organisms) {
      if (org.x < sx0 - margin || org.x > sx1 + margin || org.y < sy0 - margin || org.y > sy1 + margin) continue;
      const p = worldToScreenDpr(game, w, h, zoom, dpr, org.x, org.y);
      drawOrganism(ctx, org, p.x, p.y, zoom);
    }

    canvas.__dpr = dpr;
  }

  function worldToScreenDpr(game, w, h, zoom, dpr, wx, wy) {
    return { x: (wx - game.camera.x) * zoom + w / 2, y: (wy - game.camera.y) * zoom + h / 2 };
  }

  CM.render = {
    ZOOM_MIN, ZOOM_MAX, ensureCache, resizeCanvas, clampCamera, focusOn, updateCamera,
    worldToScreen, screenToWorld, draw, drawOrganism
  };
})(window.CM = window.CM || {});

</script>
<script>
/* Coremind — touch input: one-finger drag to pan, two-finger pinch to zoom,
 * tap to select/inspect. Pointer Events unify mouse and touch so the same
 * code path is what gets exercised on desktop during development.
 */
(function (CM) {
  'use strict';
  const K = CM.core;
  const R = CM.render;

  const TAP_MOVE_THRESHOLD = 9;   // px
  const TAP_MAX_DURATION = 400;   // ms
  const HIT_RADIUS_PX = 22;

  function zoomBy(game, factor) {
    const c = game.camera;
    c.targetZoom = K.clamp((c.targetZoom || c.zoom) * factor, R.ZOOM_MIN, R.ZOOM_MAX);
  }
  function focusCore(game) { R.focusOn(game, game.core.x, game.core.y, 16); }

  function hitTestOrganism(game, canvas, screenX, screenY) {
    let best = null, bestD = HIT_RADIUS_PX;
    for (const org of game.organisms) {
      const p = R.worldToScreen(game, canvas, org.x, org.y);
      const d = Math.hypot(p.x - screenX, p.y - screenY);
      const r = Math.max(10, org.stats.size * 0.11 * game.camera.zoom * (canvas.__dpr || 1) * 1.9);
      if (d < r + 6 && d < bestD) { bestD = d; best = org; }
    }
    return best;
  }
  function hitTestSample(game, canvas, screenX, screenY) {
    let best = null, bestD = HIT_RADIUS_PX;
    for (const s of game.discovery.samples) {
      const p = R.worldToScreen(game, canvas, s.x, s.y);
      const d = Math.hypot(p.x - screenX, p.y - screenY);
      if (d < bestD) { bestD = d; best = s; }
    }
    return best;
  }
  function hitTestCore(game, canvas, screenX, screenY) {
    const p = R.worldToScreen(game, canvas, game.core.x, game.core.y);
    const r = Math.max(18, game.core.radius * game.camera.zoom * (canvas.__dpr || 1));
    return Math.hypot(p.x - screenX, p.y - screenY) < r ? game.core : null;
  }

  function attach(canvas, game, handlers) {
    handlers = handlers || {};
    const pointers = new Map();
    let mode = null; // 'pan' | 'pinch'
    let panLast = null;
    let pinchStartDist = 0, pinchStartZoom = 0;
    let tapStart = null; // {x,y,t,id}

    function dpr() { return canvas.__dpr || (window.devicePixelRatio || 1); }
    function toCanvasPx(evt) {
      const rect = canvas.getBoundingClientRect();
      return { x: (evt.clientX - rect.left) * (canvas.width / rect.width), y: (evt.clientY - rect.top) * (canvas.height / rect.height) };
    }

    function onDown(evt) {
      canvas.setPointerCapture(evt.pointerId);
      const p = toCanvasPx(evt);
      pointers.set(evt.pointerId, p);
      if (pointers.size === 1) {
        mode = 'pan';
        panLast = p;
        tapStart = { x: p.x, y: p.y, t: performance.now(), id: evt.pointerId };
        game.camera.dragging = true;
      } else if (pointers.size === 2) {
        mode = 'pinch';
        tapStart = null;
        const pts = [...pointers.values()];
        pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
        pinchStartZoom = game.camera.zoom;
      }
    }

    function onMove(evt) {
      if (!pointers.has(evt.pointerId)) return;
      const p = toCanvasPx(evt);
      pointers.set(evt.pointerId, p);

      if (mode === 'pan' && pointers.size === 1) {
        const dx = p.x - panLast.x, dy = p.y - panLast.y;
        panLast = p;
        const zoom = game.camera.zoom * dpr();
        game.camera.x -= dx / zoom;
        game.camera.y -= dy / zoom;
        game.camera.targetX = game.camera.x; game.camera.targetY = game.camera.y;
        R.clampCamera(game);
        if (tapStart && Math.hypot(p.x - tapStart.x, p.y - tapStart.y) > TAP_MOVE_THRESHOLD) tapStart = null;
      } else if (mode === 'pinch' && pointers.size === 2) {
        const pts = [...pointers.values()];
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
        const z = K.clamp(pinchStartZoom * (dist / pinchStartDist), R.ZOOM_MIN, R.ZOOM_MAX);
        game.camera.zoom = z; game.camera.targetZoom = z;
      }
    }

    function onUp(evt) {
      const wasTap = tapStart && tapStart.id === evt.pointerId
        && (performance.now() - tapStart.t) < TAP_MAX_DURATION;
      pointers.delete(evt.pointerId);

      if (wasTap) handleTap(tapStart.x, tapStart.y);

      if (pointers.size === 0) {
        mode = null; game.camera.dragging = false; tapStart = null;
      } else if (pointers.size === 1) {
        mode = 'pan';
        panLast = [...pointers.values()][0];
        tapStart = null;
      }
    }

    function handleTap(x, y) {
      const org = hitTestOrganism(game, canvas, x, y);
      if (org) { handlers.onSelectOrganism && handlers.onSelectOrganism(org); return; }
      const sample = hitTestSample(game, canvas, x, y);
      if (sample) { handlers.onTapSample && handlers.onTapSample(sample); return; }
      const core = hitTestCore(game, canvas, x, y);
      if (core) { handlers.onTapCore && handlers.onTapCore(); return; }
      handlers.onTapEmpty && handlers.onTapEmpty(R.screenToWorld(game, canvas, x, y));
    }

    canvas.addEventListener('pointerdown', onDown, { passive: true });
    canvas.addEventListener('pointermove', onMove, { passive: true });
    canvas.addEventListener('pointerup', onUp, { passive: true });
    canvas.addEventListener('pointercancel', onUp, { passive: true });
    canvas.addEventListener('wheel', evt => {
      evt.preventDefault();
      zoomBy(game, evt.deltaY < 0 ? 1.12 : 0.89);
    }, { passive: false });
  }

  CM.input = { attach, zoomBy, focusCore, hitTestOrganism, hitTestSample, hitTestCore };
})(window.CM = window.CM || {});

</script>
<script>
/* Coremind — DOM UI: HUD, tabs, directive bar, event feed, genome designer,
 * inspect overlay. Rendering (canvas) stays in render.js; this file only
 * touches the DOM layer on top of it.
 */
(function (CM) {
  'use strict';
  const K = CM.core;
  const T = CM.traits;
  const D = CM.discovery;
  const CORE = CM.coremind;

  const DIRECTIVE_META = {
    EXPLORE: { icon: '\u{1F9ED}', label: 'Explore' },
    GATHER: { icon: '\u{1F33F}', label: 'Gather' },
    HUNT: { icon: '\u{1F3F9}', label: 'Hunt' },
    DEFEND: { icon: '\u{1F6E1}', label: 'Defend' },
    REPRODUCE: { icon: '\u{1F95A}', label: 'Reproduce' },
    INVESTIGATE: { icon: '\u{1F50D}', label: 'Investigate' },
    RETURN: { icon: '\u{1F3E0}', label: 'Return' }
  };

  const STAT_ROWS = [
    ['health', 'Health'], ['energyMax', 'Energy'], ['speed', 'Speed'], ['size', 'Size'],
    ['vision', 'Vision'], ['sense_radius', 'Sense'], ['attack', 'Attack'], ['defense', 'Defense'],
    ['armor', 'Armor'], ['venom', 'Venom'], ['camouflage', 'Camo'], ['digging', 'Dig'],
    ['temperature_tolerance', 'Temp.Tol'], ['water_requirement', 'Water'],
    ['reproduction_rate', 'Repro'], ['metabolism', 'Metab.']
  ];
  const STAT_MAXES = { health: 140, energyMax: 100, speed: 60, size: 40, vision: 70, sense_radius: 45, attack: 70, defense: 70, armor: 45, venom: 45, camouflage: 45, digging: 55, temperature_tolerance: 55, water_requirement: 1.2, reproduction_rate: 1.2, metabolism: 40 };

  function el(id) { return document.getElementById(id); }
  function fmt1(n) { return (Math.round(n * 10) / 10).toString(); }

  function init(game, bus) {
    const ui = {
      dnaBadgeSeen: 0, unreadAnalyze: 0, previewRaf: null, previewAngle: 0,
      inspectTarget: null, canvas: el('world-canvas')
    };
    game.ui = ui;

    initTabs(game);
    initDirectiveBar(game, bus);
    initCamControls(game);
    initDesigner(game, bus);
    initInspect(game);

    el('btn-speed').addEventListener('click', () => {
      game.speed = game.speed >= 3 ? 1 : (game.speed === 1 ? 2 : 3);
      el('btn-speed').textContent = game.speed + 'x';
    });

    bus.on('event', evt => onEvent(game, evt));

    render(game);
    return ui;
  }

  // -- tabs -----------------------------------------------------------------
  function initTabs(game) {
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        if (tab === 'dna') { openDesigner(game); return; }
        document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
        document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
        if (tab === 'analyze') { game.ui.unreadAnalyze = 0; renderFeed(game); updateBadges(game); }
      });
    });
  }

  // -- directive bar ----------------------------------------------------------
  function initDirectiveBar(game, bus) {
    const bar = el('directive-bar');
    bar.innerHTML = '';
    for (const d of CM.organism.DIRECTIVES) {
      const meta = DIRECTIVE_META[d];
      const btn = document.createElement('button');
      btn.className = 'dirbtn'; btn.dataset.directive = d;
      btn.innerHTML = `<i>${meta.icon}</i>${meta.label}`;
      btn.addEventListener('click', () => {
        const scope = CORE.issueDirective(game, d);
        const who = scope === 'selected' ? (game.byId[game.selection] || {}).name : 'Your colony';
        toast({ kind: 'system', icon: meta.icon, message: `${who} directed to ${meta.label}.` });
        renderDirectiveBar(game);
        renderSelection(game);
      });
      bar.appendChild(btn);
    }
    renderDirectiveBar(game);
  }
  function renderDirectiveBar(game) {
    const active = game.selection && game.byId[game.selection] ? game.byId[game.selection].directive : game.globalDirective;
    document.querySelectorAll('#directive-bar .dirbtn').forEach(b => b.classList.toggle('active', b.dataset.directive === active));
  }

  // -- camera controls ---------------------------------------------------
  function initCamControls(game) {
    el('btn-focus-core').addEventListener('click', () => CM.input.focusCore(game));
    el('btn-zoom-in').addEventListener('click', () => CM.input.zoomBy(game, 1.35));
    el('btn-zoom-out').addEventListener('click', () => CM.input.zoomBy(game, 1 / 1.35));
  }

  // -- selection panel ------------------------------------------------------
  function renderSelection(game) {
    const panel = el('selection-panel');
    const summary = el('selection-summary');
    const org = game.selection && game.byId[game.selection];
    if (!org) {
      panel.classList.add('hidden');
      summary.textContent = 'Tap an organism to select it, or issue a directive to your whole colony.';
      renderDirectiveBar(game);
      return;
    }
    panel.classList.remove('hidden');
    const hf = Math.round(100 * org.health / org.stats.health);
    const ef = Math.round(100 * org.energy / org.stats.energyMax);
    // Distress flags name the thing that is actually killing this organism,
    // so a failed design reads as a diagnosis instead of a mystery.
    const flags = [];
    if (org.burrowed) flags.push('<span style="color:var(--warn)">BURROWED</span>');
    if (org.hunger > 80) flags.push('<span style="color:var(--danger)">STARVING</span>');
    if (org.thirst > 80) flags.push('<span style="color:var(--danger)">DEHYDRATED</span>');
    const stress = CM.organism.tempStress(org, CM.world.tempAt(game.world, org.x, org.y));
    if (stress > 1) flags.push('<span style="color:var(--danger)">TEMP STRESS</span>');
    panel.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center">
      <b>${org.name}</b><span style="color:var(--fg-dim);font-size:11px">${org.ownerId === 'player' ? 'Gen ' + org.generation : org.name}</span></div>
      <div style="font-size:11.5px;color:var(--fg-dim);margin-top:2px">${org.state} &middot; HP ${hf}% &middot; Energy ${ef}% &middot; Thirst ${Math.round(org.thirst)}%</div>
      ${flags.length ? `<div style="font-size:10.5px;margin-top:3px;letter-spacing:.05em">${flags.join(' ')}</div>` : ''}`;
    summary.textContent = `${org.name} selected — directives below apply to it only.`;
    renderDirectiveBar(game);
  }

  // -- events / feed / toasts ---------------------------------------------
  function onEvent(game, evt) {
    game.ui.unreadAnalyze++;
    updateBadges(game);
    if (evt.kind === 'discovery' || evt.kind === 'death' || evt.kind === 'warn') toast(evt);
    if (el('panel-analyze').classList.contains('active')) renderFeed(game);
  }

  function toast(evt) {
    const layer = el('toast-layer');
    const div = document.createElement('div');
    div.className = 'toast' + (evt.kind === 'death' ? ' danger' : evt.kind === 'warn' ? ' warn' : '');
    div.textContent = (evt.icon ? evt.icon + ' ' : '') + evt.message;
    layer.appendChild(div);
    setTimeout(() => { div.style.transition = 'opacity .4s'; div.style.opacity = '0'; setTimeout(() => div.remove(), 400); }, 3600);
    while (layer.children.length > 3) layer.removeChild(layer.firstChild);
  }

  /* The research backlog: traits the Coremind has partial evidence for.
   * Without this the player only ever sees the moment a discovery lands and
   * has no idea that watching a predator fight is *doing* anything. */
  function renderResearch(game) {
    const wrap = el('research-list');
    const rows = D.researchInProgress(game);
    if (!rows.length) { wrap.innerHTML = ''; return; }
    wrap.innerHTML = '<div class="research-head">ANALYSIS IN PROGRESS</div>';
    for (const r of rows.slice(0, 6)) {
      const row = document.createElement('div');
      row.className = 'research-row';
      row.innerHTML = `<div class="rname">${r.trait.name}</div>
        <div class="rbar"><i style="width:${Math.round(r.progress * 100)}%"></i></div>
        <div class="rcount">${r.observations}/${r.needed}</div>`;
      wrap.appendChild(row);
    }
  }

  function renderFeed(game) {
    renderResearch(game);
    const feed = el('event-feed');
    const events = game.discovery.events;
    if (!events.length) { feed.innerHTML = '<div class="event-empty">Nothing observed yet. Send an organism to EXPLORE.</div>'; return; }
    feed.innerHTML = '';
    for (const evt of events.slice(0, 80)) {
      const row = document.createElement('button');
      row.className = 'event-row' + (evt.kind === 'discovery' ? ' discovery' : evt.kind === 'death' ? ' death' : evt.kind === 'warn' ? ' warn' : '');
      const mins = Math.floor(evt.time / 60), secs = Math.floor(evt.time % 60);
      const obs = evt.observation
        ? `<div class="obs">Species: <b>${evt.observation.species}</b><br>Damage type: <b>${evt.observation.damageType}</b><br>Observed defense: <b>${evt.observation.defense}</b></div>`
        : '';
      row.innerHTML = `<div class="ico">${evt.icon || '•'}</div><div class="body"><div class="msg">${evt.message}</div>${obs}<div class="time">t+${mins}:${String(secs).padStart(2, '0')}</div></div>`;
      row.addEventListener('click', () => onEventClick(game, evt));
      feed.appendChild(row);
    }
  }

  function onEventClick(game, evt) {
    if (evt.x != null && evt.y != null) CM.render.focusOn(game, evt.x, evt.y, 22);
    if (evt.traitId) { openDesigner(game); return; }
    if (evt.orgId && game.byId[evt.orgId]) { CORE.selectOrganism(game, evt.orgId); renderSelection(game); switchTab('explore'); return; }
    if (evt.speciesId) showInspect(game, 'species', { speciesId: evt.speciesId });
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
  }

  function updateBadges(game) {
    const ab = el('badge-analyze');
    if (game.ui.unreadAnalyze > 0) { ab.textContent = Math.min(99, game.ui.unreadAnalyze); ab.classList.remove('hidden'); }
    else ab.classList.add('hidden');

    const discovered = Object.keys(game.discovery.discoveredTraits).length;
    const db = el('badge-dna');
    if (discovered > game.ui.dnaBadgeSeen) { db.classList.remove('hidden'); db.classList.add('warn'); }
    else db.classList.add('hidden');
  }

  // -- genome designer -----------------------------------------------------
  function initDesigner(game, bus) {
    el('btn-designer-close').addEventListener('click', () => closeDesigner(game));
    el('btn-create-organism').addEventListener('click', () => {
      const org = CORE.createOrganismFromDraft(game, bus);
      if (org) { renderDesigner(game); toast({ kind: 'system', icon: '\u{1F9EA}', message: `${org.name} deployed near the Core.` }); }
    });
    el('btn-save-design').addEventListener('click', () => {
      const design = CORE.saveDesign(game);
      if (design) { renderDesignerDesigns(game); toast({ kind: 'system', icon: '\u{1F4BE}', message: `Saved ${design.name}.` }); }
    });
  }

  function openDesigner(game) {
    el('designer-overlay').classList.remove('hidden');
    game.ui.dnaBadgeSeen = Object.keys(game.discovery.discoveredTraits).length;
    updateBadges(game);
    renderDesigner(game);
    startPreviewLoop(game);
  }
  function closeDesigner(game) {
    el('designer-overlay').classList.add('hidden');
    stopPreviewLoop(game);
  }

  function renderDesignerSlots(game) {
    const wrap = el('designer-slots');
    wrap.innerHTML = '';
    for (const cat of T.CATEGORIES) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      const current = game.designerDraft[cat];
      const currentTrait = current && T.TRAITS_BY_ID[current];
      const select = document.createElement('select');
      const noneOpt = document.createElement('option'); noneOpt.value = ''; noneOpt.textContent = 'None'; select.appendChild(noneOpt);
      const otherSlots = T.CATEGORIES.filter(c => c !== cat).map(c => game.designerDraft[c]);
      for (const t of T.TRAITS_BY_CATEGORY[cat]) {
        const opt = document.createElement('option');
        opt.value = t.id;
        const known = !!game.discovery.discoveredTraits[t.id];
        const blockedBy = known ? T.conflictsWith(otherSlots, t.id) : null;
        if (!known) opt.textContent = '\u{1F512} ' + t.name;               // not discovered yet
        else if (blockedBy) opt.textContent = '\u{2298} ' + t.name;        // biologically incompatible
        else opt.textContent = t.name;
        opt.disabled = !known || !!blockedBy;
        if (blockedBy) opt.title = `Incompatible with ${T.TRAITS_BY_ID[blockedBy].name}`;
        if (t.id === current) opt.selected = true;
        select.appendChild(opt);
      }
      select.addEventListener('change', () => {
        CORE.setDesignSlot(game, cat, select.value || null);
        renderDesigner(game);
      });
      slot.innerHTML = `<div class="cat">${cat}</div>`;
      const nameDiv = document.createElement('div');
      nameDiv.className = 'trait' + (currentTrait ? '' : ' empty');
      nameDiv.textContent = currentTrait ? currentTrait.name : 'Empty';
      slot.appendChild(nameDiv);
      slot.appendChild(select);
      wrap.appendChild(slot);
    }
  }

  function renderDesignerStats(game) {
    const wrap = el('designer-stats');
    const stats = CORE.draftStats(game);
    wrap.innerHTML = '';
    for (const [key, label] of STAT_ROWS) {
      const base = T.BASE_STATS[key];
      const val = stats[key];
      const delta = val - base;
      const max = STAT_MAXES[key] || 100;
      const row = document.createElement('div'); row.className = 'statrow';
      const pct = K.clamp01(val / max) * 100;
      const deltaTxt = Math.abs(delta) < 0.01 ? '' : (delta > 0 ? '+' + fmt1(delta) : fmt1(delta));
      // Colour by whether the change is *good*, not by its sign: a higher
      // metabolism or water requirement is a cost, and showing it in the
      // same green as a higher attack would invert the tradeoff the
      // designer exists to communicate.
      const deltaCls = Math.abs(delta) < 0.01 ? '' : (T.isBenefit(key, delta) ? 'pos' : 'neg');
      row.innerHTML = `<div class="label">${label}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="val">${fmt1(val)}</div><div class="delta ${deltaCls}">${deltaTxt}</div>`;
      wrap.appendChild(row);
    }
  }

  function renderDesignerCost(game) {
    const cost = CORE.draftCost(game);
    const afford = CORE.canAfford(game, cost);
    el('designer-cost').innerHTML = `Cost: <span class="${game.core.biomass >= cost.biomass ? 'ok' : 'bad'}">${cost.biomass} biomass</span> &middot; <span class="${game.core.energy >= cost.energy ? 'ok' : 'bad'}">${cost.energy} energy</span>`;
    el('btn-create-organism').disabled = !afford;
    el('btn-save-design').disabled = CORE.draftTraitIds(game).length === 0;
  }

  /* Why these traits are worth putting together — or why they can't be. The
   * designer's whole job is making a tradeoff legible before it is paid for. */
  function renderDesignerCombo(game) {
    const wrap = el('designer-combo');
    const { conflicts, synergies } = CORE.draftCombination(game);
    wrap.innerHTML = '';
    for (const s of synergies) {
      const div = document.createElement('div');
      div.className = 'combo-note synergy';
      div.innerHTML = `<span>\u{1F517}</span><span><b>${T.TRAITS_BY_ID[s.a].name} + ${T.TRAITS_BY_ID[s.b].name}</b> reinforce each other — both traits' benefits are boosted ${Math.round(T.SYNERGY_BONUS * 100)}%.</span>`;
      wrap.appendChild(div);
    }
    for (const c of conflicts) {
      const div = document.createElement('div');
      div.className = 'combo-note conflict';
      div.innerHTML = `<span>\u{2298}</span><span><b>${T.TRAITS_BY_ID[c.a].name}</b> cannot coexist with <b>${T.TRAITS_BY_ID[c.b].name}</b>.</span>`;
      wrap.appendChild(div);
    }
  }

  /* Saved strains: tap to load one back into the draft, tap the x to drop it. */
  function renderDesignerDesigns(game) {
    const wrap = el('designer-designs');
    wrap.innerHTML = '';
    for (const design of game.designs) {
      const chip = document.createElement('button');
      chip.className = 'strain-chip';
      chip.innerHTML = `${design.name}<span class="del">×</span>`;
      chip.addEventListener('click', evt => {
        if (evt.target.classList.contains('del')) {
          CORE.deleteDesign(game, design.id);
        } else {
          CORE.loadDesign(game, design.id);
        }
        renderDesigner(game);
      });
      wrap.appendChild(chip);
    }
  }

  /* One entry point so every designer control redraws consistently — the
   * slots gate on each other (conflicts), so a partial refresh would leave
   * stale options enabled. */
  function renderDesigner(game) {
    renderDesignerSlots(game);
    renderDesignerCombo(game);
    renderDesignerStats(game);
    renderDesignerCost(game);
    renderDesignerDesigns(game);
  }

  function startPreviewLoop(game) {
    stopPreviewLoop(game);
    const canvas = el('preview-canvas');
    const ctx = canvas.getContext('2d');
    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      game.ui.previewAngle += 0.012;
      const traits = CORE.draftTraitIds(game);
      const stats = T.resolveStats(traits);
      const previewOrg = { traits, stats, health: stats.health, heading: game.ui.previewAngle, color: '#33e6b0', selected: false };
      // A fixed, generous zoom independent of the world camera — the
      // designer's job is to show off trait silhouettes up close, not to
      // represent true in-world scale.
      CM.render.drawOrganism(ctx, previewOrg, canvas.width / 2, canvas.height / 2, 55);
      game.ui.previewRaf = requestAnimationFrame(frame);
    }
    frame();
  }
  function stopPreviewLoop(game) {
    if (game.ui.previewRaf) cancelAnimationFrame(game.ui.previewRaf);
    game.ui.previewRaf = null;
  }

  // -- inspect overlay (samples / species / core) --------------------------
  function initInspect(game) {
    el('btn-inspect-close').addEventListener('click', () => el('inspect-overlay').classList.add('hidden'));
  }

  function showInspect(game, kind, data) {
    const title = el('inspect-title'), body = el('inspect-body');
    if (kind === 'sample') {
      const s = data.sample;
      title.textContent = 'BIOLOGICAL SAMPLE';
      const traitChips = s.traits.map(id => `<span class="trait-chip">${T.TRAITS_BY_ID[id].name}</span>`).join('');
      body.innerHTML = `<div class="kv"><span class="k">Source</span><span>${s.name}</span></div>
        <div class="kv"><span class="k">Traits detected</span><span></span></div>
        <div style="margin-top:6px">${traitChips || '<span style="color:var(--fg-dim)">Unclear — needs more observation</span>'}</div>
        <button class="bigbtn extract-btn" id="btn-do-extract">EXTRACT SAMPLE</button>`;
      el('btn-do-extract').addEventListener('click', () => {
        D.extractSample(game, game.__bus, s.id);
        el('inspect-overlay').classList.add('hidden');
      });
    } else if (kind === 'core') {
      title.textContent = 'COREMIND';
      body.innerHTML = `<div class="kv"><span class="k">Biomass</span><span>${Math.floor(game.core.biomass)}</span></div>
        <div class="kv"><span class="k">Energy</span><span>${Math.floor(game.core.energy)}</span></div>
        <div class="kv"><span class="k">Population</span><span>${game.stats.playerPop}</span></div>
        <p style="color:var(--fg-dim);font-size:12.5px;margin-top:10px">Every organism you deploy is grown from biomass and energy gathered by the colony. Send organisms to GATHER to keep the Core supplied.</p>`;
    } else if (kind === 'species') {
      const sp = T.WILD_BY_ID[data.speciesId];
      title.textContent = sp.name.toUpperCase();
      const traitChips = sp.traits.map(id => `<span class="trait-chip">${game.discovery.discoveredTraits[id] ? '' : '\u{1F512} '}${T.TRAITS_BY_ID[id].name}</span>`).join('');
      body.innerHTML = `<div class="kv"><span class="k">Role</span><span>${sp.tier}</span></div><div style="margin-top:6px">${traitChips}</div>`;
    }
    el('inspect-overlay').classList.remove('hidden');
  }

  // -- per-frame refresh (cheap: text only) --------------------------------
  function render(game) {
    el('stat-biomass').querySelector('span').textContent = K.fmt(game.core.biomass);
    el('stat-energy').querySelector('span').textContent = K.fmt(game.core.energy);
    el('stat-pop').querySelector('span').textContent = game.stats.playerPop + game.stats.herbivorePop + game.stats.predatorPop;
  }

  CM.ui = { init, render, renderSelection, renderFeed, updateBadges, showInspect, toast, switchTab };
})(window.CM = window.CM || {});

</script>
<script>
/* Coremind — local persistence. Terrain is never saved (it's fully
 * regenerable from the seed); everything the player actually changed is:
 * discovered species/traits, designs, every living organism, and the
 * Core's resources. Autosaves are throttled but triggered eagerly on
 * anything narratively "major" so closing the app never loses progress.
 */
(function (CM) {
  'use strict';
  const KEY = 'coremind/save/v1';
  const VERSION = 1;
  const MIN_SAVE_INTERVAL_MS = 5000;
  const PERIODIC_MS = 20000;

  function hasSave() {
    try { return !!localStorage.getItem(KEY); } catch (e) { return false; }
  }

  function serialize(game) {
    return {
      v: VERSION, savedAt: Date.now(),
      seed: game.seed, simTime: game.simTime, speed: game.speed,
      core: { biomass: game.core.biomass, energy: game.core.energy },
      camera: { x: game.camera.x, y: game.camera.y, zoom: game.camera.zoom },
      discovery: {
        observations: game.discovery.observations,
        discoveredTraits: game.discovery.discoveredTraits,
        knownSpecies: game.discovery.knownSpecies,
        events: game.discovery.events.slice(0, 150),
        samples: game.discovery.samples
      },
      designs: game.designs,
      nextDesignId: game.nextDesignId,
      organisms: game.organisms.map(o => ({
        ownerId: o.ownerId, speciesId: o.speciesId, designId: o.designId, name: o.name,
        generation: o.generation, age: o.age, x: o.x, y: o.y, heading: o.heading,
        traits: o.traits, diet: o.diet, color: o.color,
        health: o.health, energy: o.energy, hunger: o.hunger, thirst: o.thirst,
        state: o.state, directive: o.directive, carrying: o.carrying, reproCooldown: o.reproCooldown,
        // Burrow state is deliberately not saved: reloading into "underground
        // and untargetable" would be an invisible, unexplainable condition.
        // Everything reloads above ground.
      }))
    };
  }

  function writeNow(game) {
    try {
      localStorage.setItem(KEY, JSON.stringify(serialize(game)));
      game.__lastSaveAt = performance.now();
      return true;
    } catch (e) {
      console.warn('[coremind] save failed', e);
      return false;
    }
  }

  function readRaw() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || data.v !== VERSION) return null;
      return data;
    } catch (e) {
      console.warn('[coremind] read failed', e);
      return null;
    }
  }

  /* Rebuild a full game object: regenerate the world from the seed, then
   * overlay everything that isn't derivable from it. */
  function hydrate(data) {
    const game = CM.coremind.newGame(data.seed);
    game.simTime = data.simTime || 0;
    game.speed = data.speed || 1;
    game.core.biomass = data.core.biomass;
    game.core.energy = data.core.energy;
    if (data.camera) {
      game.camera.x = data.camera.x; game.camera.y = data.camera.y; game.camera.zoom = data.camera.zoom;
      game.camera.targetX = game.camera.x; game.camera.targetY = game.camera.y; game.camera.targetZoom = game.camera.zoom;
    }
    const disc = data.discovery || {};
    game.discovery.observations = disc.observations || {};
    game.discovery.discoveredTraits = disc.discoveredTraits || {};
    game.discovery.knownSpecies = disc.knownSpecies || {};
    game.discovery.events = disc.events || [];
    game.discovery.samples = disc.samples || [];
    let maxEvtId = 0, maxSampleId = 0;
    for (const e of game.discovery.events) { const n = parseInt(String(e.id).split('_')[1], 10); if (n > maxEvtId) maxEvtId = n; }
    for (const s of game.discovery.samples) { const n = parseInt(String(s.id).split('_')[1], 10); if (n > maxSampleId) maxSampleId = n; }
    game.discovery.nextEventId = Math.max(maxEvtId, maxSampleId) + 1;

    game.designs = data.designs || [];
    game.nextDesignId = data.nextDesignId || 1;

    for (const od of data.organisms || []) {
      const org = CM.organism.create({
        ownerId: od.ownerId, speciesId: od.speciesId, designId: od.designId, name: od.name,
        generation: od.generation, x: od.x, y: od.y, heading: od.heading,
        traits: od.traits, diet: od.diet, color: od.color, directive: od.directive
      });
      org.age = od.age; org.health = od.health; org.energy = od.energy; org.hunger = od.hunger;
      org.thirst = od.thirst || 0;
      org.state = od.state; org.carrying = od.carrying || 0; org.reproCooldown = od.reproCooldown || 0;
      // A state saved mid-burrow (or from an older save) resumes above ground.
      if (org.state === 'SEEK_WATER' && !od.thirst) org.state = 'EXPLORE';
      CM.coremind.addOrganism(game, org);
    }
    return game;
  }

  /* Called on every notable event; only actually writes if the throttle
   * window has elapsed, so a burst of deaths/discoveries can't hammer
   * localStorage. */
  function maybeAutosave(game) {
    const now = performance.now();
    if (!game.__lastSaveAt || now - game.__lastSaveAt >= MIN_SAVE_INTERVAL_MS) writeNow(game);
  }

  function init(game, bus) {
    bus.on('event', evt => {
      if (evt.kind === 'discovery' || evt.kind === 'death' || evt.kind === 'system') maybeAutosave(game);
    });
  }

  CM.save = { hasSave, writeNow, readRaw, hydrate, maybeAutosave, init, PERIODIC_MS };
})(window.CM = window.CM || {});

</script>
<script>
/* Coremind — bootstrap. Wires world/sim/render/input/ui/save together and
 * runs the game loop: a fixed-step simulation accumulator decoupled from
 * rendering, so physics stays stable regardless of frame rate or the
 * player's chosen simulation speed.
 */
(function (CM) {
  'use strict';
  const SIM_DT = 0.1;
  const MAX_STEPS_PER_FRAME = 8;

  let game = null, canvas = null, ctx = null, acc = 0, lastT = 0, rafId = null, periodicAcc = 0;

  function wireInput() {
    CM.input.attach(canvas, game, {
      onSelectOrganism(org) {
        CM.coremind.selectOrganism(game, org.id);
        CM.ui.renderSelection(game);
        CM.render.focusOn(game, org.x, org.y);
      },
      onTapSample(sample) { CM.ui.showInspect(game, 'sample', { sample }); },
      onTapCore() { CM.ui.showInspect(game, 'core', {}); },
      onTapEmpty() { CM.coremind.selectOrganism(game, null); CM.ui.renderSelection(game); }
    });
  }

  function startCommon() {
    canvas = document.getElementById('world-canvas');
    ctx = canvas.getContext('2d');
    window.__CM_GAME__ = game; // debug/inspection hook only — never read by game logic
    CM.save.init(game, game.__bus);
    CM.ui.init(game, game.__bus);
    CM.ui.renderFeed(game);
    CM.ui.updateBadges(game);
    wireInput();
    window.addEventListener('resize', () => CM.render.resizeCanvas(canvas));
    document.addEventListener('visibilitychange', () => { if (document.hidden) CM.save.writeNow(game); });
    window.addEventListener('pagehide', () => CM.save.writeNow(game));
    acc = 0; periodicAcc = 0; lastT = 0;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function newWorld() {
    const seed = (Math.random() * 0xffffffff) >>> 0;
    game = CM.coremind.newGame(seed);
    game.__bus = CM.core.makeBus();
    CM.simulation.spawnStarterColony(game, game.__bus);
    CM.simulation.spawnStarterWildlife(game);
    startCommon();
    CM.save.writeNow(game);
  }

  function continueGame() {
    const data = CM.save.readRaw();
    if (!data) { newWorld(); return; }
    game = CM.save.hydrate(data);
    game.__bus = CM.core.makeBus();
    startCommon();
  }

  function loop(tMs) {
    rafId = requestAnimationFrame(loop);
    if (!lastT) lastT = tMs;
    let frameDt = (tMs - lastT) / 1000;
    lastT = tMs;
    frameDt = Math.min(frameDt, 0.25); // guard against tab-backgrounding spikes

    acc += frameDt * game.speed;
    let steps = 0;
    while (acc >= SIM_DT && steps < MAX_STEPS_PER_FRAME) {
      CM.simulation.tick(game, game.__bus, SIM_DT);
      acc -= SIM_DT;
      steps++;
    }
    if (steps === MAX_STEPS_PER_FRAME) acc = 0; // device can't keep up — drop the backlog rather than spiral

    CM.render.updateCamera(game, frameDt);
    CM.render.draw(game, canvas, ctx);
    CM.ui.render(game);
    CM.ui.renderSelection(game);

    periodicAcc += frameDt;
    if (periodicAcc * 1000 >= CM.save.PERIODIC_MS) { periodicAcc = 0; CM.save.writeNow(game); }
  }

  function boot() {
    const bootOverlay = document.getElementById('boot-overlay');
    const continueBtn = document.getElementById('btn-continue');
    if (CM.save.hasSave()) continueBtn.classList.remove('hidden');
    continueBtn.addEventListener('click', () => { bootOverlay.classList.add('hidden'); continueGame(); });
    document.getElementById('btn-new-world').addEventListener('click', () => { bootOverlay.classList.add('hidden'); newWorld(); });
  }

  CM.main = { newWorld, continueGame, boot };
  document.addEventListener('DOMContentLoaded', CM.main.boot);
})(window.CM = window.CM || {});

</script>
</body>
