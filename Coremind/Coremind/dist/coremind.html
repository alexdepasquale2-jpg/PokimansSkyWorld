    if (bus) {
      CM.discovery.pushEvent(game, bus, {
        kind: 'warn', icon: '\u{1F6A8}',
        message: colony.isPlayer
          ? 'The Gate is gone. You have lost the burrow. Retake the Gate, fortify the shaft, or sink a new one.'
          : `${colony.name} has lost its Gate — their entire burrow is uncontrolled.`,
        x: colony.x, y: colony.y, colonyId: colony.id
      });
    }
  }

  function restoreBurrow(game, bus, colony) {
    if (!colony || !colony.burrowLost) return;
    colony.burrowLost = false;
    for (const s of S().all(game)) {
      if (s.colonyId !== colony.id) continue;
      s.controlled = true;
    }
    if (bus) {
      CM.discovery.pushEvent(game, bus, {
        kind: 'discovery', icon: '\u{1F6E1}',
        message: colony.isPlayer
          ? 'Gate reclaimed. The burrow answers to you again.'
          : `${colony.name} has reclaimed its Gate.`,
        x: colony.x, y: colony.y, colonyId: colony.id
      });
    }
  }

  function canFortify(game, colony, site) {
    if (!site || site.type !== 'SHAFT' || !site.done) return { ok: false, reason: 'Only a finished Access Shaft can be fortified.' };
    if (site.colonyId !== colony.id) return { ok: false, reason: 'That shaft is not yours.' };
    if (site.fortified && site.fortHp > 0) return { ok: false, reason: 'The barrier is already standing.' };
    if (colony.biomass < FORTIFY_COST.biomass || colony.energy < FORTIFY_COST.energy) {
      return { ok: false, reason: `Needs ${FORTIFY_COST.biomass} biomass and ${FORTIFY_COST.energy} energy.` };
    }
    return { ok: true };
  }

  function fortify(game, bus, colony, site) {
    const check = canFortify(game, colony, site);
    if (!check.ok) return check;
    colony.biomass -= FORTIFY_COST.biomass;
    colony.energy -= FORTIFY_COST.energy;
    site.fortified = true;
    site.fortHp = FORT_HP;
    site.fortMax = FORT_HP;
    if (colony.isPlayer && bus) {
      CM.discovery.pushEvent(game, bus, {
        kind: 'system', icon: '\u{1F6E1}',
        message: 'Shaft fortified. Climbers cannot reach the surface until the barrier is broken.',
        x: site.x, y: site.y, structureId: site.id
      });
    }
    return { ok: true };
  }

  function onCompleted(game, bus, site) {
    if (site.spine || SPINE[site.type]) {
      const colony = game.coloniesById[site.colonyId];
      if (colony && site.depth >= 1 && site.depth <= 9) {
        const rec = paceOf(colony, site.depth);
        if (rec.openedAt == null) rec.openedAt = game.simTime || 0;
      }
    }
    if (site.type === 'GATE') {
      const colony = game.coloniesById[site.colonyId];
      if (colony) {
        colony.burrowLost = false;
        colony.veilOpened = true;
        openNexus(game, bus, colony, site);
      }
    }
  }

  function onDestroyed(game, bus, site) {
    if (site.type === 'GATE') {
      const colony = game.coloniesById[site.colonyId];
      if (colony) loseBurrow(game, bus, colony);
    }
    if (site.type === 'NEXUS') {
      // Portal collapse does not by itself drop the Gate; the Gate rule is the one that matters.
    }
  }

  function hostilityAt(game, site) {
    const near = game.world.grid.queryRadius(site.x, site.y, 3.4, []);
    let friends = 0, foes = 0;
    for (const o of near) {
      if (!o.alive || (o.depth || 0) !== site.depth) continue;
      if (o.ownerId === site.colonyId) friends++;
      else if (o.ownerId !== 'wild') foes++;
    }
    return { friends, foes };
  }

  function paceOf(colony, depth) {
    if (!colony.pace) colony.pace = {};
    const key = String(depth);
    if (!colony.pace[key]) {
      colony.pace[key] = { openedAt: null, holdAcc: 0, scouted: false, settled: false, announced: false };
    }
    return colony.pace[key];
  }

  function layerRooms(game, colonyId, depth) {
    let rooms = 0, have = {};
    for (const s of S().all(game)) {
      if (!s.done || s.controlled === false || s.colonyId !== colonyId || s.depth !== depth) continue;
      have[s.type] = (have[s.type] || 0) + 1;
      if (!SPINE[s.type]) rooms++;
    }
    return { rooms, have };
  }

  function hasAny(have, keys) {
    if (!keys || !keys.length) return true;
    for (const k of keys) if (have[k]) return true;
    return false;
  }

  function postedOn(game, colonyId, depth) {
    for (const s of S().all(game)) {
      if (!s.done || s.controlled === false || s.colonyId !== colonyId || s.depth !== depth) continue;
      if (DEFENSE_TYPES[s.type] || SPINE[s.type]) {
        const h = hostilityAt(game, s);
        if (h.friends >= 2) return true;
      }
    }
    return false;
  }

  function spineSite(game, colonyId, depth) {
    const want = SPINE_ORDER[depth];
    if (!want) return null;
    return S().all(game).find(s => s.done && s.controlled !== false && s.colonyId === colonyId && s.type === want) || null;
  }

  /* A colony that already cut past a layer (saves, tests, planted spines)
   * is treated as having settled everything above that cut. */
  function retroSettle(game, colony) {
    if (!colony) return;
    const deepest = S().deepestOf(game, colony.id);
    for (let d = 1; d < deepest; d++) {
      const rec = paceOf(colony, d);
      rec.settled = true;
      rec.holdAcc = Math.max(rec.holdAcc, (PACE[d] && PACE[d].hold) || 0);
      if (rec.openedAt == null) rec.openedAt = game.simTime || 0;
    }
    if (deepest >= 1) {
      const rec = paceOf(colony, deepest);
      if (rec.openedAt == null) rec.openedAt = game.simTime || 0;
    }
  }

  /* Sightings before the guide started (or the first half-second) do not
   * count as "learn the ground" — world-gen proximity must not finish foothold. */
  function postStartKnown(game) {
    const cut = (game.guide && game.guide.startedAt) || 0.5;
    const events = (game.discovery && game.discovery.events) || [];
    const seen = Object.create(null);
    let n = 0;
    for (const e of events) {
      if (!e.speciesId || seen[e.speciesId]) continue;
      if ((e.time == null ? 0 : e.time) < cut) continue;
      seen[e.speciesId] = true;
      n++;
    }
    return n;
  }

  function surfaceReady(game, colony) {
    if (!colony) return { ok: false, reason: 'No Coremind.' };
    if (game.paceSkip) return { ok: true };
    if (!colony.isPlayer) return { ok: true };
    const spec = PACE[0];
    const pop = colony.pop || 0;
    const known = postStartKnown(game);
    const timeOk = (game.simTime || 0) >= spec.hold;
    const grown = pop >= SURFACE_POP;
    const stocked = colony.biomass >= SURFACE_BIOMASS;
    const learned = known >= 1 && (game.simTime || 0) >= spec.hold * 0.5;
    if (timeOk || grown || stocked || learned) return { ok: true };
    const remain = Math.max(0, Math.ceil(spec.hold - (game.simTime || 0)));
    return {
      ok: false,
      reason: `Walk the surface first — forage, grow, learn the ground (${remain}s, or ${SURFACE_POP} living, or a first discovery).`,
      checks: [
        { key: 'time', ok: timeOk, label: remain ? `Foothold ${remain}s` : 'Foothold ready' },
        { key: 'pop', ok: grown, label: `${pop}/${SURFACE_POP} living` },
        { key: 'stock', ok: stocked, label: 'Stores ready' },
        { key: 'learn', ok: known >= 1, label: known ? 'First discovery' : 'Observe the wild' }
      ]
    };
  }

  function layerReady(game, colony, depth) {
    if (depth <= 0) return surfaceReady(game, colony);
    if (!colony) return { ok: false, reason: 'No Coremind.' };
    if (game.paceSkip) return { ok: true };
    if (depth >= 9) return { ok: true };
    retroSettle(game, colony);
    const spec = PACE[depth] || PACE[1];
    const rec = paceOf(colony, depth);
    if (rec.settled) return { ok: true, settled: true };

    const spine = spineSite(game, colony.id, depth);
    if (!spine) {
      return { ok: false, reason: `Cut the ${SPINE_ORDER[depth] ? S().TYPES[SPINE_ORDER[depth]].name : 'spine'} first.`,
        checks: [{ key: 'spine', ok: false, label: 'Spine not cut' }] };
    }

    const { rooms, have } = layerRooms(game, colony.id, depth);
    const roleOk = hasAny(have, spec.anyOf);
    const defended = !!(spec.anyOf && spec.anyOf.some(k => DEFENSE_TYPES[k] && have[k]))
      || !!(have.REDOUBT || have.BASTION || have.CITADEL || have.KEEP)
      || postedOn(game, colony.id, depth);
    const roomsOk = rooms >= spec.rooms;
    const holdOk = rec.holdAcc >= spec.hold;
    const scoutOk = rec.scouted;
    const defendOk = !spec.requireDefend || defended;

    if (holdOk && roomsOk && roleOk && defendOk) {
      rec.settled = true;
      return { ok: true, settled: true };
    }

    const missing = [];
    if (!roomsOk) missing.push(`${rooms}/${spec.rooms} rooms`);
    if (!roleOk) missing.push((spec.anyOf || []).map(k => S().TYPES[k].name).join(' or '));
    if (!holdOk) missing.push('hold the layer');
    if (!defendOk) missing.push('post a defense');
    return {
      ok: false,
      reason: spec.hint + (missing.length ? ` Still need: ${missing.join(', ')}.` : ''),
      checks: [
        { key: 'rooms', ok: roomsOk, label: `${rooms}/${spec.rooms} rooms` },
        { key: 'role', ok: roleOk, label: roleOk ? 'Role chamber ready' : ((spec.anyOf || []).map(k => S().TYPES[k].name).join(' / ') || 'Role') },
        { key: 'hold', ok: holdOk, label: `Held ${Math.min(100, Math.round(100 * rec.holdAcc / Math.max(1, spec.hold)))}%`, frac: K.clamp01(rec.holdAcc / Math.max(1, spec.hold)) },
        { key: 'scout', ok: scoutOk, label: scoutOk ? 'Ground walked' : 'Walk the layer' },
        { key: 'defend', ok: defended, label: spec.requireDefend ? (defended ? 'Posted' : 'Post a defense') : (defended ? 'Posted' : 'Post (optional)') }
      ],
      rec, spec
    };
  }

  function inGrace(game, colony, depth) {
    if (!colony || !depth) return false;
    const rec = paceOf(colony, depth);
    if (rec.openedAt == null) rec.openedAt = game.simTime || 0;
    const window = 36 + depth * 4;
    return ((game.simTime || 0) - rec.openedAt) < window && !rec.settled;
  }

  function tickPace(game, bus, dt) {
    for (const colony of (game.colonies || [])) {
      if (!colony.alive) continue;
      retroSettle(game, colony);
      const deepest = S().deepestOf(game, colony.id);
      for (let d = 1; d <= Math.min(9, Math.max(deepest, 1)); d++) {
        if (!spineSite(game, colony.id, d)) continue;
        const rec = paceOf(colony, d);
        if (rec.openedAt == null) rec.openedAt = game.simTime;
        if (rec.settled) continue;
        const spec = PACE[d];
        if (!spec) continue;

        const spine = spineSite(game, colony.id, d);
        let onLayer = 0;
        for (const org of game.organisms) {
          if (!org.alive || org.ownerId !== colony.id || (org.depth || 0) !== d) continue;
          onLayer++;
          if (spine && K.dist(org.x, org.y, spine.x, spine.y) > 8) rec.scouted = true;
        }
        const { rooms, have } = layerRooms(game, colony.id, d);
        const roleOk = hasAny(have, spec.anyOf);
        const defended = !!(have.REDOUBT || have.BASTION || have.CITADEL || have.KEEP)
          || postedOn(game, colony.id, d);

        let rate = 1;
        if (onLayer >= 1) rate += 0.28;
        if (onLayer >= 2) rate += 0.22;
        if (rec.scouted) rate += 0.28;
        if (defended) rate += 0.24;
        if (rooms >= spec.rooms) rate += 0.12;
        rec.holdAcc += dt * rate;

        if (rec.holdAcc >= spec.hold && rooms >= spec.rooms && roleOk && (!spec.requireDefend || defended)) {
          rec.settled = true;
          if (colony.isPlayer && bus && !rec.announced && d < 9) {
            rec.announced = true;
            const next = S().DEPTHS[d + 1];
            CM.discovery.pushEvent(game, bus, {
              kind: 'discovery', icon: '\u{1F5FA}',
              message: `${S().DEPTHS[d].name} is settled. ${next ? next.name + ' can be cut when you choose.' : 'The Gate is yours to open.'}`,
              x: spine.x, y: spine.y, colonyId: colony.id
            });
          }
        }
      }
    }
  }

  function tick(game, bus, dt) {
    tickPace(game, bus, dt);
    // Reclaim: standing on your uncontrolled Gate with more bodies than foes.
    for (const s of S().all(game)) {
      if (s.type !== 'GATE' || !s.done || s.controlled !== false) { s.reclaimAcc = 0; continue; }
      const colony = game.coloniesById[s.colonyId];
      if (!colony) continue;
      const h = hostilityAt(game, s);
      if (h.friends > h.foes && h.friends > 0) {
        s.reclaimAcc = (s.reclaimAcc || 0) + dt;
        if (s.reclaimAcc >= RECLAIM_SECS) restoreBurrow(game, bus, colony);
      } else {
        s.reclaimAcc = 0;
      }
    }

    // Layer-4 dominance slowly feeds nearby surface flora — a reason to hold it.
    for (const colony of (game.colonies || [])) {
      if (!colony.alive || colony.burrowLost) continue;
      if (!dominates(game, colony.id, 4)) continue;
      colony.biomass = Math.min(colony.biomassCap, colony.biomass + 0.35 * dt);
    }

    checkOutcome(game, bus);
  }

  function wantedOnLayer(game, colony, depth) {
    const spec = PACE[depth];
    if (!spec) return null;
    const { rooms, have } = layerRooms(game, colony.id, depth);
    if (spec.anyOf && !hasAny(have, spec.anyOf)) {
      for (const k of spec.anyOf) if (S().TYPES[k]) return k;
    }
    if (spec.requireDefend && !have.BASTION && !have.CITADEL && !have.KEEP && !have.REDOUBT) {
      if (depth >= 8) return 'CITADEL';
      if (depth >= 6) return 'BASTION';
      return 'REDOUBT';
    }
    if (rooms < spec.rooms) {
      if (depth === 1) return have.CISTERN ? 'GRANARY' : 'CISTERN';
      if (depth === 2) return have.REDOUBT ? 'VAULT' : 'REDOUBT';
      if (depth === 4) return have.AQUEDUCT ? 'SPOREWELL' : 'AQUEDUCT';
      if (depth === 5) return have.RELIQUARY ? 'RESONATOR' : 'RELIQUARY';
      if (depth >= 9) return have.KEEP ? 'MUSTER' : 'KEEP';
      return spec.anyOf ? spec.anyOf[0] : 'WARREN';
    }
    return null;
  }

  /* Endgame: once two Coreminds have opened a Gate, the last one still
   * holding theirs owns the Veil. The surface Core can still fall on its
   * own terms — this is specifically the burrow war. */
  function checkOutcome(game, bus) {
    if (game.outcome) return;
    const opened = (game.colonies || []).filter(c => c.veilOpened);
    if (opened.length < 2) return;
    const holding = (game.colonies || []).filter(c => c.alive && hasGate(game, c.id));
    if (holding.length !== 1) return;
    const winner = holding[0];
    game.outcome = winner.isPlayer ? 'victory' : 'defeat';
    if (bus) {
      CM.discovery.pushEvent(game, bus, {
        kind: winner.isPlayer ? 'discovery' : 'warn',
        icon: winner.isPlayer ? '\u{1F3C6}' : '\u{1F480}',
        message: winner.isPlayer
          ? 'The Veil is yours. Every other Gate has fallen — you hold the underworld.'
          : `${winner.name} holds the last Gate. The Veil belongs to them.`,
        x: winner.x, y: winner.y, colonyId: winner.id
      });
    }
    if (CM.ui && CM.ui.showOutcome) CM.ui.showOutcome(game);
  }

  function researchMul(game, org) {
    let m = 1;
    if (org.ownerId && dominates(game, org.ownerId, 2)) m *= 1.12;
    if (org.ownerId && dominates(game, org.ownerId, 5)) m *= 1.1;
    return m;
  }

  function senseMul(game, org) {
    if (org.ownerId && (org.depth || 0) === 5 && dominates(game, org.ownerId, 5)) return 1.35;
    return 1;
  }

  function layerHostiles(game, depth, colonyId) {
    let n = 0;
    for (const o of game.organisms) {
      if (!o.alive || (o.depth || 0) !== depth) continue;
      if (o.ownerId === colonyId || o.ownerId === 'wild') continue;
      n++;
    }
    return n;
  }

  /* On 1–9 you only walk excavated ground: near a chamber you own, a
   * burrow you are raiding, or any Gate (the doors onto the Veil). The
   * Veil itself (10) and the surface are open. */
  function canStand(game, org, x, y, depth) {
    if (!depth || depth >= 10) return true;
    const reach = 15;
    for (const s of S().all(game)) {
      if (!s.done || s.depth !== depth) continue;
      if (K.dist(s.x, s.y, x, y) > reach) continue;
      if (s.colonyId === org.ownerId) return true;
      if (org.raidColonyId && s.colonyId === org.raidColonyId) return true;
      const col = game.coloniesById[s.colonyId];
      if (col && col.burrowLost) return true;
      if (s.type === 'GATE' || s.type === 'NEXUS') return true;
    }
    return false;
  }

  function viewOpen(game, depth) {
    if (depth === 0) return true;
    const colony = game.core;
    if (!colony) return false;
    const deepest = S().deepestOf(game, colony.id);
    if (depth <= deepest + 1) return true;
    if (depth === 10 && hasGate(game, colony.id)) return true;
    if (depth === 10 && (game.organisms || []).some(o => o.ownerId === colony.id && (o.depth || 0) === 10)) return true;
    return false;
  }

  /* Settled rock is a better home the deeper it is. Surface stays harsh. */
  function comfort(game, depth) {
    depth = depth || 0;
    if (depth <= 0) return 0;
    const coreId = game.core && game.core.id;
    const rooms = (S().all(game) || []).filter(s =>
      s.done && s.depth === depth && (s.colonyId === coreId || s.ownerId === coreId));
    if (!rooms.length) return 0;
    let c = 0.06 * depth;
    if (rooms.some(s => s.type === 'WARREN' || s.type === 'NURSERY')) c += 0.08;
    if (game.core && layerReady(game, game.core, depth).ok) c += 0.10;
    return Math.max(0, Math.min(0.62, c));
  }

  function livingLabel(c) {
    if (c <= 0) return 'Exposed';
    if (c < 0.2) return 'Cool';
    if (c < 0.4) return 'Warm';
    return 'Hearth';
  }

  CM.layers = {
    FORTIFY_COST, FORT_HP, SPINE_ORDER, PACE,
    tradeoff, layerCounts, dominantOf, dominates,
    hasGate, hasType, isSpine, spineAt,
    nextWaypoint, tryTransfer, nearestConnector, canUseConnector,
    openNexus, loseBurrow, restoreBurrow,
    canFortify, fortify, onCompleted, onDestroyed, tick,
    researchMul, senseMul, layerHostiles, viewOpen, hostilityAt, canStand,
    surfaceReady, layerReady, retroSettle, inGrace, wantedOnLayer, paceOf, tickPace,
    comfort, livingLabel
  };
})(window.CM = window.CM || {});

</script>
<script>
/* Coremind — 4X-style individual orders.
 *
 * Colony directives are the macro. This is the micro: a selected organism
 * (or group) can be told to walk somewhere, hit something, hold ground, or
 * garrison a chamber. The simulation still owns movement and combat; this
 * file only records intent and turns a tap into an order.
 */
(function (CM) {
  'use strict';
  const K = CM.core;

  const KINDS = ['MOVE', 'ATTACK', 'ATTACK_MOVE', 'HOLD', 'GARRISON', 'PATROL', 'RETREAT', 'STOP'];

  function selectedIds(game) {
    if (game.selectedIds && game.selectedIds.length) return game.selectedIds.slice();
    return game.selection ? [game.selection] : [];
  }

  function selectedOrgs(game) {
    return selectedIds(game).map(id => game.byId[id]).filter(o => o && o.alive);
  }

  function selectedPlayerOrgs(game) {
    return selectedOrgs(game).filter(o => o.ownerId === 'player');
  }

  function formationOffset(i, n) {
    if (n < 2) return { x: 0, y: 0 };
    const cols = Math.ceil(Math.sqrt(n));
    const gx = (i % cols) - (cols - 1) / 2;
    const gy = Math.floor(i / cols) - (Math.ceil(n / cols) - 1) / 2;
    return { x: gx * 1.45, y: gy * 1.45 };
  }

  function issue(game, orgs, order) {
    if (!orgs || !orgs.length) return 0;
    const spread = (order.type === 'MOVE' || order.type === 'ATTACK_MOVE') && orgs.length > 1 && order.x != null;
    let n = 0, slot = 0;
    for (const org of orgs) {
      if (!org || !org.alive) continue;
      if (order.type === 'STOP') {
        org.order = null;
        org.actionTarget = null;
        n++;
        continue;
      }
      const off = spread ? formationOffset(slot, orgs.length) : { x: 0, y: 0 };
      slot++;
      org.order = {
        type: order.type,
        x: order.x != null ? order.x + off.x : order.x,
        y: order.y != null ? order.y + off.y : order.y,
        depth: order.depth != null ? order.depth : (org.depth || 0),
        x2: order.x2, y2: order.y2,
        refId: order.ref ? order.ref.id : null,
        refKind: order.refKind || (order.ref && order.ref.health != null ? 'org' : (order.ref ? 'site' : null)),
        engage: order.type === 'ATTACK_MOVE' || !!order.engage,
        queue: order.queue ? order.queue.slice() : null
      };
      org._orderRef = order.ref || null;
      org.aiCounter = 0;
      n++;
    }
    if (n && CM.mind && CM.mind.pulse) CM.mind.pulse(game);
    if (n && CM.economy) CM.economy.onOrder(game);
    return n;
  }

  function resolveRef(game, org) {
    const order = org.order;
    if (!order) return null;
    if (org._orderRef && (org._orderRef.alive !== false || org._orderRef.workNeeded != null)) {
      if (org._orderRef.alive === false) return null;
      return org._orderRef;
    }
    if (!order.refId) return null;
    if (order.refKind === 'org') {
      const o = game.byId[order.refId];
      org._orderRef = o && o.alive ? o : null;
      return org._orderRef;
    }
    const site = CM.structures.all(game).find(s => s.id === order.refId);
    org._orderRef = site || null;
    return site;
  }

  function clear(game, orgs) { return issue(game, orgs, { type: 'STOP' }); }

  /* Returns true when the tap was consumed as an order, so the caller should
   * not also treat it as select / inspect / deselect. */
  function handleTap(game, payload) {
    if (game.buildMode) return false;
    const group = selectedPlayerOrgs(game);
    if (!group.length) return false;

    const mode = game.commandMode || 'MOVE';
    const queued = game.queueOrders || mode === 'QUEUE' || game._shiftQueue;

    if (mode === 'RETREAT') {
      retreat(game, group);
      game.commandMode = null;
      return true;
    }

    if (payload.kind === 'org') {
      const org = payload.org;
      if (org.ownerId === 'player') {
        if (game.addSelect) {
          CM.coremind.selectOrganism(game, org.id, true);
          return true;
        }
        return false; // ordinary re-select
      }
      issue(game, group, { type: 'ATTACK', x: org.x, y: org.y, depth: org.depth || 0, ref: org, refKind: 'org' });
      game.commandMode = null;
      return true;
    }

    if (payload.kind === 'site') {
      const site = payload.site;
      const garrison = site.colonyId === 'player' || site.controlled === false || mode === 'GARRISON';
      if (garrison) {
        issue(game, group, { type: 'GARRISON', x: site.x, y: site.y, depth: site.depth, ref: site, refKind: 'site' });
      } else {
        issue(game, group, { type: 'MOVE', x: site.x, y: site.y, depth: site.depth });
      }
      game.commandMode = null;
      return true;
    }

    if (payload.kind === 'empty' || payload.kind === 'core') {
      if (mode === 'HOLD') {
        issue(game, group, { type: 'HOLD', x: group[0].x, y: group[0].y, depth: group[0].depth || 0 });
        game.commandMode = null;
        return true;
      }
      const world = payload.world;
      if (!world) return false;
      if (mode === 'PATROL') {
        issue(game, group, {
          type: 'PATROL',
          x: world.x, y: world.y, depth: game.viewDepth || 0,
          x2: group[0].x, y2: group[0].y
        });
        game.commandMode = null;
        return true;
      }
      if (queued) {
        appendWaypoint(group, world.x, world.y, game.viewDepth || 0,
          mode === 'ATTACK' || mode === 'ATTACK_MOVE', game);
        return true;
      }
      issue(game, group, {
        type: mode === 'ATTACK' || mode === 'ATTACK_MOVE' ? 'ATTACK_MOVE' : 'MOVE',
        x: world.x, y: world.y,
        depth: game.viewDepth || 0
      });
      game.commandMode = null;
      return true;
    }
    return false;
  }

  function appendWaypoint(orgs, x, y, depth, engage, game) {
    let n = 0;
    for (const org of orgs) {
      if (!org || !org.alive) continue;
      if (!org.order || org.order.x == null) {
        org.order = { type: engage ? 'ATTACK_MOVE' : 'MOVE', x, y, depth, engage: !!engage, queue: [] };
      } else {
        if (!org.order.queue) org.order.queue = [];
        org.order.queue.push({ x, y, depth });
      }
      n++;
    }
    if (n && game && CM.mind && CM.mind.pulse) CM.mind.pulse(game);
    return n;
  }

  function retreat(game, orgs) {
    const group = orgs || selectedPlayerOrgs(game);
    let n = 0;
    for (const org of group) {
      if (!org || !org.alive) continue;
      const home = game.coloniesById[org.ownerId];
      const d = org.depth || 0;
      let dest = null;
      if (home && home.layerRally && home.layerRally[d]) dest = home.layerRally[d];
      const den = CM.structures.findShelter(game, org.ownerId, org.x, org.y, 80);
      if (den) dest = dest || den;
      if (!dest) {
        const shaft = CM.structures.all(game).find(s => s.done && s.colonyId === org.ownerId && s.type === 'SHAFT');
        if (shaft) dest = shaft;
      }
      if (!dest && home) dest = { x: home.x, y: home.y, depth: 0 };
      if (!dest) continue;
      issue(game, [org], {
        type: den && dest === den ? 'GARRISON' : 'MOVE',
        x: dest.x, y: dest.y,
        depth: dest.depth != null ? dest.depth : d,
        ref: den && dest === den ? den : null,
        refKind: den && dest === den ? 'site' : null
      });
      n++;
    }
    return n;
  }

  function setMode(game, mode) {
    if (mode === 'STOP') {
      clear(game, selectedPlayerOrgs(game));
      game.commandMode = null;
      if (CM.mind && CM.mind.pulse) CM.mind.pulse(game);
      return;
    }
    if (mode === 'HOLD') {
      const group = selectedPlayerOrgs(game);
      issue(game, group, { type: 'HOLD', x: 0, y: 0, depth: 0 });
      game.commandMode = null;
      return;
    }
    if (mode === 'RETREAT') {
      retreat(game, selectedPlayerOrgs(game));
      game.commandMode = null;
      return;
    }
    if (mode === 'QUEUE') {
      game.queueOrders = !game.queueOrders;
      return;
    }
    game.commandMode = game.commandMode === mode ? null : mode;
    if (game.commandMode && CM.mind && CM.mind.pulse) CM.mind.pulse(game);
  }

  function selectInBox(game, x0, y0, x1, y1, depth) {
    const minX = Math.min(x0, x1), maxX = Math.max(x0, x1);
    const minY = Math.min(y0, y1), maxY = Math.max(y0, y1);
    const view = depth != null ? depth : (game.viewDepth || 0);
    const fogOn = game.senseSight !== false;
    const hits = [];
    for (const org of game.organisms) {
      if (!org.alive || org.ownerId !== 'player') continue;
      if ((org.depth || 0) !== view) continue;
      if (org.x < minX || org.x > maxX || org.y < minY || org.y > maxY) continue;
      if (fogOn && CM.sense && !CM.sense.lit(game, org.x, org.y, org.depth || 0)) continue;
      hits.push(org);
    }
    if (!hits.length) return 0;
    CM.coremind.selectOrganism(game, hits[0].id, false);
    for (let i = 1; i < hits.length; i++) CM.coremind.selectOrganism(game, hits[i].id, true);
    return hits.length;
  }

  function selectNearby(game, seed, radius) {
    if (!seed || seed.ownerId !== 'player') return 0;
    const r = radius || 10;
    const view = seed.depth || 0;
    const hits = game.organisms.filter(o =>
      o.alive && o.ownerId === 'player' && (o.depth || 0) === view && K.dist(o.x, o.y, seed.x, seed.y) <= r);
    if (!hits.length) return 0;
    CM.coremind.selectOrganism(game, hits[0].id, false);
    for (let i = 1; i < hits.length; i++) CM.coremind.selectOrganism(game, hits[i].id, true);
    return hits.length;
  }

  function selectAllOnLayer(game) {
    const view = game.viewDepth || 0;
    const hits = game.organisms.filter(o => o.alive && o.ownerId === 'player' && (o.depth || 0) === view);
    if (!hits.length) return 0;
    CM.coremind.selectOrganism(game, hits[0].id, false);
    for (let i = 1; i < hits.length; i++) CM.coremind.selectOrganism(game, hits[i].id, true);
    return hits.length;
  }

  function assignGroup(game, slot) {
    if (!game.controlGroups) game.controlGroups = { 1: [], 2: [], 3: [], 4: [] };
    game.controlGroups[slot] = selectedPlayerOrgs(game).map(o => o.id);
    return game.controlGroups[slot].length;
  }

  function recallGroup(game, slot) {
    const ids = (game.controlGroups && game.controlGroups[slot]) || [];
    const live = ids.map(id => game.byId[id]).filter(o => o && o.alive && o.ownerId === 'player');
    if (!live.length) return 0;
    CM.coremind.selectOrganism(game, live[0].id, false);
    for (let i = 1; i < live.length; i++) CM.coremind.selectOrganism(game, live[i].id, true);
    return live.length;
  }

  function label(order) {
    if (!order) return null;
    if (order.type === 'MOVE') return 'Moving';
    if (order.type === 'ATTACK_MOVE') return 'Attack-moving';
    if (order.type === 'ATTACK') return 'Attacking';
    if (order.type === 'HOLD') return 'Holding';
    if (order.type === 'GARRISON') return 'Garrisoning';
    if (order.type === 'PATROL') return 'Patrolling';
    if (order.type === 'RETREAT') return 'Retreating';
    if (order.queue && order.queue.length) return (order.type === 'ATTACK_MOVE' ? 'Attack-moving' : 'Moving') + ' · ' + (order.queue.length + 1);
    return order.type;
  }

  CM.orders = {
    KINDS, selectedIds, selectedOrgs, selectedPlayerOrgs,
    issue, clear, resolveRef, handleTap, setMode, label,
    selectInBox, selectNearby, selectAllOnLayer, assignGroup, recallGroup, formationOffset,
    appendWaypoint, retreat
  };
})(window.CM = window.CM || {});

<script>
/* Coremind — living weather. Influence is what the architecture did to
 * the rock; this is what the living are feeling right now. Hunger,
 * dread, brood and war stamp a coarse grid the AI and the overlay
 * both read. Hiding the overlay does not stop the weather.
 */
(function (CM) {
  'use strict';
  const K = CM.core;

  const CHANNELS = ['hunger', 'dread', 'brood', 'war', 'spore', 'mind'];
  const CELL = 8;
  const SIZE = 32;              // world 256 / 8; resized from world.size if present
  const NCHAN = CHANNELS.length;
  const MAX_DEPTH = 10;
  const CAP = 4.0;
  const DRAW_MIN = 0.12;

  const CHANNEL_INDEX = {
    hunger: 0, dread: 1, brood: 2, war: 3, spore: 4, mind: 5
  };
  const CHANNEL_COLOR = {
    hunger: [126, 224, 129],
    dread: [154, 92, 212],
    brood: [208, 122, 164],
    war: [239, 91, 91],
    spore: [80, 196, 168],
    mind: [139, 172, 15]
  };

  function zeros() {
    return { hunger: 0, dread: 0, brood: 0, war: 0, spore: 0, mind: 0 };
  }

  /* World 256 → 32. A non-256 map still fits the same cell size. */
  function sizeOf(game) {
    const w = game && game.world && game.world.size;
    return w ? Math.ceil(w / CELL) : SIZE;
  }

  function chanOf(channel) {
    if (typeof channel === 'number') return channel;
    const i = CHANNEL_INDEX[channel];
    return i == null ? -1 : i;
  }

  function cellOf(x, y, n) {
    return {
      cx: K.clamp(Math.floor(x / CELL), 0, n - 1),
      cy: K.clamp(Math.floor(y / CELL), 0, n - 1)
    };
  }

  function ensure(game) {
    if (!game.aura) game.aura = { grids: {}, gen: 0 };
    return game.aura;
  }

  function gridFor(game, depth) {
    const aura = ensure(game);
    const n = sizeOf(game);
    const need = n * n * NCHAN;
    let g = aura.grids[depth];
    if (!g || g.length !== need) {
      g = new Float32Array(need);
      aura.grids[depth] = g;
    }
    return g;
  }

  function clearViewed(game, depth) {
    const g = gridFor(game, depth);
    g.fill(0);
    return g;
  }

  function stamp(game, depth, x, y, channel, amount, radius) {
    const ch = chanOf(channel);
    if (ch < 0 || ch >= NCHAN || !amount) return;
    const n = sizeOf(game);
    const g = gridFor(game, depth);
    const r = radius == null ? 3 : radius;
    const c = cellOf(x, y, n);
    if (r <= 0) {
      const i = (c.cy * n + c.cx) * NCHAN + ch;
      const v = g[i] + amount;
      g[i] = v > CAP ? CAP : v;
      return;
    }
    const span = Math.ceil(r);
    const x0 = Math.max(0, c.cx - span);
    const x1 = Math.min(n - 1, c.cx + span);
    const y0 = Math.max(0, c.cy - span);
    const y1 = Math.min(n - 1, c.cy + span);
    for (let gy = y0; gy <= y1; gy++) {
      for (let gx = x0; gx <= x1; gx++) {
        const d = K.dist(gx, gy, c.cx, c.cy);
        if (d >= r) continue;
        const falloff = K.lerp(1, 0, d / r);
        const i = (gy * n + gx) * NCHAN + ch;
        const v = g[i] + amount * falloff;
        g[i] = v > CAP ? CAP : v;
      }
    }
  }

  function at(game, x, y, depth) {
    const out = zeros();
    if (!game || !game.aura || !game.aura.grids) return out;
    const g = game.aura.grids[depth];
    if (!g) return out;
    const n = sizeOf(game);
    const c = cellOf(x, y, n);
    const base = (c.cy * n + c.cx) * NCHAN;
    if (base + NCHAN > g.length) return out;
    out.hunger = g[base];
    out.dread = g[base + 1];
    out.brood = g[base + 2];
    out.war = g[base + 3];
    out.spore = g[base + 4];
    out.mind = g[base + 5];
    return out;
  }

  function sample(game, x, y, depth, channel) {
    const ch = chanOf(channel);
    if (ch < 0 || ch >= NCHAN) return 0;
    if (!game || !game.aura || !game.aura.grids) return 0;
    const g = game.aura.grids[depth];
    if (!g) return 0;
    const n = sizeOf(game);
    const c = cellOf(x, y, n);
    const i = (c.cy * n + c.cx) * NCHAN + ch;
    return i < g.length ? g[i] : 0;
  }

  /* Viewed depth plus peel neighbors. Dream layers keep no weather. */
  function maintainedDepths(game) {
    const view = game.viewDepth || 0;
    const depths = [view];
    if (game.peel !== false) {
      if (view - 1 >= 0 && view - 1 <= MAX_DEPTH) depths.push(view - 1);
      if (view + 1 >= 0 && view + 1 <= MAX_DEPTH) depths.push(view + 1);
    }
    return depths;
  }

  function decayGrid(g, dt) {
    const dec = dt * 0.55;
    for (let i = 0; i < g.length; i++) {
      const v = g[i] - dec;
      g[i] = v > 0 ? v : 0;
    }
  }

  function isSelected(game, org) {
    return !!(game.selectedIds && game.selectedIds.indexOf(org.id) >= 0);
  }

  function isWildPredator(org) {
    if (!org || org.ownerId !== 'wild' || !org.speciesId || !CM.traits) return false;
    const sp = CM.traits.WILD_BY_ID && CM.traits.WILD_BY_ID[org.speciesId];
    return !!(sp && sp.tier === 'predator');
  }

  function stampLiving(game, depth) {
    const orgs = game.organisms;
    const playerBodies = [];
    const wildPreds = [];
    if (orgs) {
      for (let i = 0; i < orgs.length; i++) {
        const org = orgs[i];
        if (!org.alive || (org.depth || 0) !== depth) continue;
        if (org.hunger > 55) {
          stamp(game, depth, org.x, org.y, 'hunger', (org.hunger - 55) / 45 * 0.9, 2);
        }
        if (org.state === 'FLEE') {
          stamp(game, depth, org.x, org.y, 'dread', 0.7, 2);
        } else if (org.state === 'ATTACK') {
          stamp(game, depth, org.x, org.y, 'war', 0.85, 2);
        }
        if (org.state === 'REPRODUCE') {
          stamp(game, depth, org.x, org.y, 'brood', 0.65, 2);
        }
        const fovea = CM.mind && CM.mind.band
          ? CM.mind.band(game, org) === 'fovea'
          : isSelected(game, org);
        if (isSelected(game, org) || fovea) {
          stamp(game, depth, org.x, org.y, 'mind', 1.0, 2);
        }
        if (org.ownerId === 'player') playerBodies.push(org);
        if (isWildPredator(org)) wildPreds.push(org);
      }
    }

    /* Predator within 6 of a player body paints dread on the threatened cell. */
    for (let i = 0; i < playerBodies.length; i++) {
      const body = playerBodies[i];
      for (let j = 0; j < wildPreds.length; j++) {
        const pred = wildPreds[j];
        if (K.dist(body.x, body.y, pred.x, pred.y) <= 6) {
          stamp(game, depth, body.x, body.y, 'dread', 0.75, 2);
          break;
        }
      }
    }

    /* Core is surface attention. Only paint it onto the surface grid. */
    if (game.core && (game.viewDepth || 0) === 0 && depth === 0) {
      stamp(game, 0, game.core.x, game.core.y, 'mind', 1.2, 3);
    }

    /* Empty granary / starved stores — hunger weather at the pit or Core. */
    if (game.core && CM.structures && CM.structures.all) {
      const allSites = CM.structures.all(game);
      const granaries = [];
      for (let i = 0; i < allSites.length; i++) {
        const s = allSites[i];
        if (s.type === 'GRANARY' && s.done && s.colonyId === game.core.id) granaries.push(s);
      }
      if (granaries.length) {
        for (let i = 0; i < granaries.length; i++) {
          const g = granaries[i];
          if ((g.depth || 0) !== depth) continue;
          const store = g.store != null ? g.store : (game.core.biomass || 0);
          if (store <= 8) stamp(game, depth, g.x, g.y, 'hunger', 0.8, 3);
        }
      } else if ((game.core.biomass || 0) < 20 && depth === 0) {
        stamp(game, 0, game.core.x, game.core.y, 'hunger', 0.8, 3);
      }
    }

    /* Breed labor on this stratum paints brood at the Core (surface) or
     * finished player chambers below. */
    if (game.core && CM.structures && CM.structures.laborOf) {
      const labor = CM.structures.laborOf(game.core, depth);
      if ((labor.breed || 0) >= 2) {
        if (depth === 0) {
          stamp(game, 0, game.core.x, game.core.y, 'brood', 0.45, 2);
        } else if (CM.structures.all) {
          const list = CM.structures.all(game);
          for (let i = 0; i < list.length; i++) {
            const site = list[i];
            if (!site.done || (site.depth || 0) !== depth) continue;
            if (site.colonyId !== game.core.id) continue;
            stamp(game, depth, site.x, site.y, 'brood', 0.45, 2);
          }
        }
      }
    }

    /* Layer-4 dominance feeds spore weather across player L4 chambers. */
    if (depth === 4 && CM.layers && CM.layers.dominantOf) {
      const dom = CM.layers.dominantOf(game, 4);
      if (dom && dom.colonyId === 'player' && CM.structures && CM.structures.all) {
        const list = CM.structures.all(game);
        for (let i = 0; i < list.length; i++) {
          const site = list[i];
          if (!site.done || (site.depth || 0) !== 4) continue;
          if (site.colonyId !== 'player') continue;
          stamp(game, 4, site.x, site.y, 'spore', 0.9, 3);
        }
      }
    }

    if (CM.structures && CM.structures.all) {
      const list = CM.structures.all(game);
      for (let i = 0; i < list.length; i++) {
        const site = list[i];
        if ((site.depth || 0) !== depth) continue;
        if (site.type === 'FUNGARIUM' || site.type === 'SPOREWELL') {
          stamp(game, depth, site.x, site.y, 'spore', 0.8, 3);
        }
        if (site.type === 'NURSERY') {
          stamp(game, depth, site.x, site.y, 'brood', 0.5, 3);
        }
        if (site.integrity != null && site.integrity < 70 && site.done) {
          stamp(game, depth, site.x, site.y, 'dread', 0.6, 2);
        }
        /* Hostile standing on a finished chamber paints war. */
        if (site.done && orgs) {
          const r = (CM.structures.radiusOf ? CM.structures.radiusOf(site) : 6) * 0.55;
          for (let j = 0; j < orgs.length; j++) {
            const o = orgs[j];
            if (!o.alive || (o.depth || 0) !== depth) continue;
            if (o.ownerId === site.colonyId) continue;
            if (K.dist(o.x, o.y, site.x, site.y) > r) continue;
            const hostile = o.ownerId === 'wild'
              ? true
              : (CM.colony && CM.colony.areHostile
                ? CM.colony.areHostile(game, o.ownerId, site.colonyId)
                : true);
            if (hostile) {
              stamp(game, depth, site.x, site.y, 'war', 0.9, 2);
              break;
            }
          }
        }
      }
    }
  }

  /* Stripped forage is a surface hunger stain. Stride ~64 cells so the
   * scan stays cheap on a 256² food map. */
  function stampStrippedForage(game) {
    const world = game.world;
    if (!world || !world.food || !world.foodCap) return;
    const food = world.food;
    const cap = world.foodCap;
    const n = food.length;
    const stride = Math.max(1, (n / 64) | 0);
    const size = world.size || 256;
    for (let i = 0; i < n; i += stride) {
      const c = cap[i];
      if (c > 0 && food[i] / c < 0.2) {
        stamp(game, 0, i % size, (i / size) | 0, 'hunger', 0.25, 1);
      }
    }
  }

  function tick(game, dt) {
    if (!game) return;
    /* Overlay hide does not pause weather — AI still reads the field. */
    dt = dt || 0;
    const depths = maintainedDepths(game);
    for (let i = 0; i < depths.length; i++) {
      const depth = depths[i];
      decayGrid(gridFor(game, depth), dt);
      stampLiving(game, depth);
    }
    if (depths.indexOf(0) >= 0) stampStrippedForage(game);
    if (game.aura) game.aura.gen++;
  }

  function aiMul(game, org, stateKey) {
    if (!org) return 1;
    const a = at(game, org.x, org.y, org.depth || 0);
    if (stateKey === 'SEEK_FOOD') return 1 + Math.min(0.55, a.hunger * 0.18);
    if (stateKey === 'FLEE') return 1 + Math.min(0.7, a.dread * 0.22);
    if (stateKey === 'REPRODUCE') return 1 + Math.min(0.4, a.brood * 0.15);
    return 1;
  }

  function draw(game, ctx, w, h, zoom, dpr, depth, worldToScreen) {
    if (!game || !game.showAura || !ctx || !worldToScreen) return;
    if (!game.aura || !game.aura.grids) return;
    const g = game.aura.grids[depth];
    if (!g) return;
    const n = sizeOf(game);
    const cellPx = CELL * zoom;
    const half = cellPx * 0.5;
    ctx.save();
    for (let cy = 0; cy < n; cy++) {
      for (let cx = 0; cx < n; cx++) {
        const base = (cy * n + cx) * NCHAN;
        let best = 0, bi = -1;
        for (let c = 0; c < NCHAN; c++) {
          const v = g[base + c];
          if (v > best) { best = v; bi = c; }
        }
        if (best <= DRAW_MIN || bi < 0) continue;
        const rgb = CHANNEL_COLOR[CHANNELS[bi]];
        const alpha = Math.min(0.38, best * 0.12);
        const p = worldToScreen((cx + 0.5) * CELL, (cy + 0.5) * CELL);
        if (w && h && (p.x + half < 0 || p.y + half < 0 || p.x - half > w || p.y - half > h)) continue;
        ctx.fillStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + alpha + ')';
        ctx.fillRect(p.x - half, p.y - half, cellPx, cellPx);
      }
    }
    ctx.restore();
  }

  CM.aura = {
    CHANNELS, CELL, SIZE, CHANNEL_INDEX, CHANNEL_COLOR,
    ensure, gridFor, clearViewed, stamp, at, sample, tick, aiMul, draw
  };
})(window.CM = window.CM || {});

<script>
/* Coremind — thought. You are a mind, not a camera.
 *
 * Issuing an order dilates time; releasing it lets years pass. The sim
 * spends its budget where attention is: fovea is full presence, near is
 * mid-LOD, dream is cheap time (every eighth tick).
 */
(function (CM) {
  'use strict';
  const K = CM.core;

  const THOUGHT_RISE = 3.2;
  const THOUGHT_FALL = 1.6;
  const SPEED_DILATE = 0.82;
  const DREAM_EVERY = 8;
  const VIEW_HALF = 48;
  const VIEW_PX = 180;
  const ZOOM_FLOOR = 4;
  const WAR_FOVEA = 0.8;

  function effectiveSpeed(game) {
    if (!game || !game.speed) return 0;
    const thought = K.clamp(game.thought || 0, 0, 1);
    return game.speed * (1 - SPEED_DILATE * thought);
  }

  function pulse(game, seconds) {
    if (!game) return;
    game.thoughtPulse = Math.max(game.thoughtPulse || 0, seconds == null ? 0.55 : seconds);
  }

  function thinking(game, flags) {
    if (!game) return false;
    if (game.thoughtHold) return true;
    if (game.thoughtPulse > 0) return true;
    if (flags && flags.sheetOpen) return true;

<script>
/* Coremind — the peel. The underground is a body you peel, not a menu
 * of floors. Two ghost strata hang off the one you inhabit so three
 * depths are one picture: the well below, the room you stand in, the
 * ceiling you have not yet cut.
 */

  'use strict';
  const K = CM.core;

  const MAX_DEPTH = 10;
  const SPINE = {
    SHAFT: true, DESCENT: true, WELL: true, GALLERY: true, CLEFT: true,
    CHASM: true, MANTLE: true, ABYSS: true, GATE: true, NEXUS: true
  };

  function enabled(game) {
    return game.peel !== false && (game.viewDepth || 0) >= 1;
  }

  function offsets(dpr) {
    dpr = dpr || 1;
    return {
      below: { scale: 1.07, dy: 14 * dpr, alpha: 0.28 },
      above: { scale: 0.93, dy: -12 * dpr, alpha: 0.22 }
    };
  }

  /* Same contract as render.worldToScreenDpr at delta 0. Ghost layers
   * scale around the screen centre and shift so the stack reads as one
   * body rather than three maps. */
  function project(game, w, h, zoom, dpr, x, y, layerDelta) {
    const sx = (x - game.camera.x) * zoom + w / 2;
    const sy = (y - game.camera.y) * zoom + h / 2;
    if (layerDelta === 0) return { x: sx, y: sy };
    const off = offsets(dpr);
    const pack = layerDelta < 0 ? off.below : off.above;
    const cx = w / 2, cy = h / 2;
    return {
      x: cx + (sx - cx) * pack.scale,
      y: cy + (sy - cy) * pack.scale + pack.dy
    };
  }

  /* A well is the spine at one xy, drawn through the three projected
   * centres. That is how the stack reads as one body. */
  function drawWells(game, ctx, w, h, zoom, dpr, depth) {
    if (!ctx || !enabled(game) || !CM.structures) return;
    const list = CM.structures.all(game);
    ctx.save();
    ctx.strokeStyle = 'rgba(201,162,39,0.7)';
    ctx.fillStyle = 'rgba(201,162,39,0.7)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.setLineDash([]);
    for (let i = 0; i < list.length; i++) {
      const site = list[i];
      if (!site.done || !SPINE[site.type] || site.depth !== depth) continue;
      const a = (depth - 1) >= 1
        ? project(game, w, h, zoom, dpr, site.x, site.y, -1)
        : null;
      const b = project(game, w, h, zoom, dpr, site.x, site.y, 0);
      const c = (depth + 1) <= MAX_DEPTH
        ? project(game, w, h, zoom, dpr, site.x, site.y, 1)
        : null;
      ctx.beginPath();
      if (a) {
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        if (c) ctx.lineTo(c.x, c.y);
      } else {
        ctx.moveTo(b.x, b.y);
        if (c) ctx.lineTo(c.x, c.y);
      }
      if (a || c) ctx.stroke();
      ctx.beginPath();
      ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();

   * Shaft is a wound: a dark ellipse, and if peel is on, a 0.4 glimpse of
   * any Layer-1 chamber that shares the shaft xy. The glimpse is not selectable. */
  function drawWound(game, ctx, w, h, zoom, dpr) {
    if (!game || !ctx || !CM.structures) return;
    const list = CM.structures.all(game);
    const peelOn = game.peel !== false;
    ctx.save();
    ctx.setLineDash([]);
    for (let i = 0; i < list.length; i++) {
      const site = list[i];
      if (!site.done || site.type !== 'SHAFT' || site.depth !== 1) continue;
      const p = project(game, w, h, zoom, dpr, site.x, site.y, 0);
      const r = ((CM.structures.radiusOf ? CM.structures.radiusOf(site) : 6)) * zoom;
      const rx = r, ry = r * 0.68;
      ctx.fillStyle = 'rgba(4,8,13,0.72)';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      if (!peelOn) continue;
      ctx.strokeStyle = 'rgba(139,172,15,0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
      // Glimpse of a Layer-1 chamber ring at the same xy (not the shaft itself).
      for (let j = 0; j < list.length; j++) {
        const room = list[j];
        if (!room.done || room.depth !== 1 || room.type === 'SHAFT') continue;
        if (room.x !== site.x || room.y !== site.y) continue;
        const rr = ((CM.structures.radiusOf ? CM.structures.radiusOf(room) : 6)) * zoom;
        ctx.strokeStyle = 'rgba(139,172,15,0.4)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, rr, rr * 0.68, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

    ctx.restore();
  }

    if (!enabled(game)) return [{ depth: game.viewDepth || 0, delta: 0, alpha: 1 }];
    const d = game.viewDepth;
    const off = offsets(1);
    const out = [];
    if ((d - 1) >= 1) out.push({ depth: d - 1, delta: -1, alpha: off.below.alpha });

    if ((d + 1) <= MAX_DEPTH) {
      const open = !CM.layers || !CM.layers.viewOpen || CM.layers.viewOpen(game, d + 1);
      if (open) out.push({ depth: d + 1, delta: 1, alpha: off.above.alpha });
    }
    return out;
  }

  CM.peel = {
    enabled, offsets, project, drawWells, drawWound, layersToDraw
  };
})(window.CM = window.CM || {});

<script>
/* Coremind — diegetic vision. You are not a god with a map.
 * You see through bodies. Unseen ground is rumor: a fading stain where
 * something living once stood, then dark again. The Veil (depth 10) is
 * always lit — it is shared thought-space, and hiding it would lie.
 */
(function (CM) {
  'use strict';
  const K = CM.core;

  const CELL = 8;
  const SIZE = 32;
  const MEMORY = 16;   // seconds a cell stays in memory after last lit
  const NEVER = 99;

  function playerId() {
    return (CM.colony && CM.colony.PLAYER_ID) || 'player';
  }

  function gridSize(game) {
    const w = game && game.world && game.world.size;
    return w ? Math.ceil(w / CELL) : SIZE;
  }

  function makeGrid(n) {
    const g = {
      cover: new Uint8Array(n * n),
      memory: new Float32Array(n * n)

    g.memory.fill(NEVER);
    return g;
  }

  function activateGrid(s, depth, n) {
    if (!s.grids) s.grids = {};
    let g = s.grids[depth];
    if (!g || g.cover.length !== n * n) {
      g = s.grids[depth] = makeGrid(n);
    }
    s.cover = g.cover;
    s.memory = g.memory;
    s.depth = depth;
    return g;
  }

  function ensure(game) {
    if (!game) return null;
    const n = gridSize(game);
    let s = game.sense;
    if (!s || !s.grids || s.size !== n) {
      s = game.sense = {
        depth: game.viewDepth || 0,
        size: n,
        cover: null,
        memory: null,
        chem: false,
        grids: {}
      };
    }
    activateGrid(s, game.viewDepth || 0, n);
    return s;
  }

  function cellIndex(x, y, n) {
    const cx = Math.floor(x / CELL);
    const cy = Math.floor(y / CELL);
    if (cx < 0 || cy < 0 || cx >= n || cy >= n) return -1;
    return cy * n + cx;
  }

  /* A seer is a living player body. On a raid we still see through the
   * bodies we sent (owner is the Core), not through the host. */
  function isSeer(game, org) {
    if (!org || !org.alive) return false;
    const pid = playerId();
    if (org.ownerId === pid) return true;
    if (org.raidColonyId && game.core && org.ownerId === game.core.id) return true;
    return false;
  }

  function traitId(t) {
    if (!t) return '';
    if (typeof t === 'string') return t;
    return t.id || t.name || '';
  }

  function hasChemTrait(org) {
    const traits = org && org.traits;
    if (!traits) return false;
    for (let i = 0; i < traits.length; i++) {
      const id = traitId(traits[i]).toLowerCase();
      if (!id) continue;
      if (id === 'chemsense' || id === 'chemical' || id === 'chemical_sensing') return true;
      if (id.indexOf('chem') >= 0) return true;
    }
    return false;
  }

  function scanChem(game, depth) {
    const orgs = game.organisms;
    if (!orgs) return false;
    for (let i = 0; i < orgs.length; i++) {
      const org = orgs[i];
      if (!isSeer(game, org)) continue;
      if ((org.depth || 0) !== depth) continue;
      if (hasChemTrait(org)) return true;
    }
    return false;
  }

  function ageMemory(s, dt) {
    const mem = s.memory;
    const n = mem.length;
    for (let i = 0; i < n; i++) {

  function paintSeers(game, s, depth) {

    if (!orgs) return;

    const mem = s.memory;

    for (let i = 0; i < orgs.length; i++) {
      const org = orgs[i];
      if (!isSeer(game, org)) continue;
      if ((org.depth || 0) !== depth) continue;
      if (hasChemTrait(org)) chem = true;
      let senseR = 8;
      if (org.stats) senseR = Math.max(org.stats.vision || 0, org.stats.sense_radius || 0, 6);
      const r2 = senseR * senseR;
      const x0 = Math.max(0, Math.floor((org.x - senseR) / CELL));
      const y0 = Math.max(0, Math.floor((org.y - senseR) / CELL));
      const x1 = Math.min(n - 1, Math.floor((org.x + senseR) / CELL));
      const y1 = Math.min(n - 1, Math.floor((org.y + senseR) / CELL));

    const i = cellIndex(x, y, s.size || SIZE);
    if (i < 0) return false;
    return s.cover[i] === 1;
  }

  function memory(game, x, y, depth) {
    if (!game) return NEVER;
    if (depth === 10) return 0;
    if (depth !== (game.viewDepth || 0)) return NEVER;
    const s = game.sense;
    if (!s) return NEVER;
    const i = cellIndex(x, y, s.size || SIZE);
    if (i < 0) return NEVER;
    return s.memory[i];
  }

  function auraHot(game, x, y, depth) {
    const A = CM.aura;
    if (!A || !A.sample) return false;
    return A.sample(game, x, y, depth, 'war') > 0.35

  /* Render should skip drawOrganism when !visibleOrg(game, org).
   * Unseen bodies are not drawn; peel motes handle other depths.
   * Selection must not land on what the colony has not tasted. */
  function visibleOrg(game, org) {
    if (!org || !org.alive) return false;
    if (!game || game.senseSight === false) return true;
    const depth = org.depth || 0;
    if (depth !== (game.viewDepth || 0)) return false;
    if (depth === 10) return true;
    if (lit(game, org.x, org.y, depth)) return true;
    const s = game.sense;

    const mem = memory(game, org.x, org.y, depth);

    if (!s) return;
    const cam = game.camera;
    if (!cam) return;

    const mem = s.memory;
    const cx = cam.x, cy = cam.y;

    const y0 = Math.max(0, Math.floor((cy - halfH) / CELL));
    const x1 = Math.min(n - 1, Math.floor((cx + halfW) / CELL));
    const y1 = Math.min(n - 1, Math.floor((cy + halfH) / CELL));
    const cellPx = CELL * zoom;

    for (let pass = 0; pass < 2; pass++) {
      ctx.fillStyle = pass === 0 ? 'rgba(4,8,13,0.45)' : 'rgba(4,8,13,0.72)';
      for (let j = y0; j <= y1; j++) {
        const row = j * n;

          const idx = row + i;

          const remembered = mem[idx] < MEMORY;
          if (pass === 0 ? !remembered : remembered) continue;
          ctx.fillRect((i * CELL - cx) * zoom + w / 2, sy, cellPx, cellPx);

    CELL, SIZE, MEMORY, NEVER,
    ensure, tick, lit, memory, visibleOrg, drawUnknown

 * the utility AI. Not a metaphor: 8 → 6 → 4, tanh, Hebbian.

    fight: { hunger: 'Bloodied', dread: 'Cornered', brood: 'Fighting', war: 'Fighting',

    nest: { hunger: 'Resting', dread: 'Hiding', brood: 'Brooding', war: 'Dug-in',

      if (tn) trust = trust / (tn + 1);
    }
    x[4] = K.clamp01(trust);
    x[5] = K.clamp01((game.viewDepth || 0) / 10);
    const scars = game.economy ? game.economy.scars || 0 : 0;
    x[6] = K.clamp01((game.sentiment && game.sentiment.grief || 0) * 0.2 + scars * 0.12);
    let cur = 0;
    if (game.discovery && game.discovery.observations) {
      for (const k in game.discovery.observations) {
        const v = game.discovery.observations[k];
        if (v && v < 1) cur += 1;
      }
    }
    x[7] = K.clamp01(cur / 8);
    return x;
  }

  function forward(net, x) {
    const h = new Float32Array(NH);
    for (let i = 0; i < NH; i++) {
      let s = net.bh[i];
      const off = i * NI;
      for (let j = 0; j < NI; j++) s += net.w1[off + j] * x[j];
      h[i] = tanh(s);
    }
    const y = new Float32Array(NO);
    for (let k = 0; k < NO; k++) {
      let s = net.bo[k];
      const off = k * NH;
      for (let i = 0; i < NH; i++) s += net.w2[off + i] * h[i];
      y[k] = (tanh(s) + 1) * 0.5;
    }
    return { h, y };
  }

  function feel(game) {
    const st = ensure(game);
    const x = gatherInputs(game);
    const { h, y } = forward(st.net, x);
    let bi = 0, bj = 0;
    for (let k = 1; k < NO; k++) if (y[k] > y[bi]) bi = k;
    for (let j = 1; j < NI; j++) if (x[j] > x[bj]) bj = j;
    const outName = OUTPUTS[bi];
    const inName = INPUTS[bj];
    const label = (MOODS[outName] && MOODS[outName][inName]) || 'Exploring';
    const last = {
      x: Array.from(x), h: Array.from(h), y: Array.from(y),
      mood: outName, flavor: inName, label
    };
    st.last = last;
    return last;
  }

  /* Outcome nudges the output that should grow next time those inputs fire. */
  const OUTCOME_TARGET = {
    fed: 0, kill: 1, fled: 2, sighted: 3, gift: 2, created: 3
  };

  function learn(game, outcome) {
    const st = ensure(game);
    const last = st.last || feel(game);
    const t = OUTCOME_TARGET[outcome];
    if (t == null) return;
    const net = st.net;
    const h = last.h, x = last.x;
    for (let i = 0; i < NH; i++) {
      const idx = t * NH + i;
      net.w2[idx] = K.clamp(net.w2[idx] + RATE * h[i], -WMAX, WMAX);
    }
    net.bo[t] = K.clamp(net.bo[t] + RATE * 0.4, -WMAX, WMAX);
    for (let i = 0; i < NH; i++) {
      for (let j = 0; j < NI; j++) {
        const idx = i * NI + j;
        net.w1[idx] = K.clamp(net.w1[idx] + RATE * 0.35 * x[j] * h[i], -WMAX, WMAX);
      }
    }
    if (outcome === 'kill') st.grief = Math.min(8, (st.grief || 0) + 0.35);
    if (outcome === 'gift' || outcome === 'fed') st.grief = Math.max(0, (st.grief || 0) - 0.2);
  }

  function tick(game, dt) {
    const st = ensure(game);
    st.grief = Math.max(0, (st.grief || 0) - 0.05 * dt);
    feel(game);
  }

  function aiMul(game, org, stateKey) {
    if (!game || !org || org.ownerId === 'wild') return 1;
    const last = (game.sentiment && game.sentiment.last) || feel(game);
    const y = last.y;
    if (stateKey === 'SEEK_FOOD') return 0.72 + 0.85 * y[0];
    if (stateKey === 'HUNT' || stateKey === 'ATTACK') return 0.68 + 0.95 * y[1];
    if (stateKey === 'SHELTER' || stateKey === 'REPRODUCE') return 0.72 + 0.8 * y[2];
    if (stateKey === 'EXPLORE' || stateKey === 'INVESTIGATE') return 0.7 + 0.9 * y[3];
    return 1;
  }

  function serialize(game) {
    const st = game && game.sentiment;
    if (!st) return null;
    return { net: pack(st.net), grief: st.grief || 0 };
  }

  function hydrate(game, data) {
    game.sentiment = {
      net: unpack(data && data.net, game.seed),
      last: null,
      grief: data && data.grief || 0
    };
    feel(game);
  }

  CM.sentiment = {
    INPUTS, HIDDEN, OUTPUTS, MOODS,
    ensure, feel, learn, tick, aiMul, serialize, hydrate, freshNet, forward
  };
})(window.CM = window.CM || {});

<script>
/* Coremind — reputation network. Standing between Cores was a scalar.
 * This is a directed graph: colonies remember colonies, and they remember
 * species. Overhunt a grazer and the herd learns your smell.
 */
(function (CM) {
  'use strict';
  const K = CM.core;

  function key(fromId, toId) { return fromId + '>' + toId; }
  function speciesNode(speciesId) { return 'wild:' + speciesId; }

  function ensure(game) {
    if (!game.rep) game.rep = { edges: {} };
    return game.rep;
  }

  function edge(game, fromId, toId) {
    const rep = ensure(game);
    const k = key(fromId, toId);
    if (!rep.edges[k]) rep.edges[k] = { favor: 0, n: 0, last: 0, kind: null };
    return rep.edges[k];
  }

  function of(game, fromId, toId) {
    if (!game || !game.rep || !fromId || !toId || fromId === toId) return 0;
    const e = game.rep.edges[key(fromId, toId)];
    return e ? e.favor : 0;
  }

  function touch(game, fromId, toId, delta, kind) {
    if (!game || !fromId || !toId || fromId === toId) return 0;
    const e = edge(game, fromId, toId);
    e.favor = K.clamp(e.favor + delta, -1, 1);
    e.n += 1;
    e.last = game.simTime || 0;
    e.kind = kind || e.kind;
    return e.favor;
  }

  function labelOf(game, id) {
    if (!id) return '?';
    if (id.indexOf('wild:') === 0) {
      const sp = CM.traits && CM.traits.WILD_BY_ID[id.slice(5)];
      return sp ? sp.name : id.slice(5);
    }
    const c = game.coloniesById && game.coloniesById[id];
    return c ? c.name : id;
  }

  function colorOf(game, id) {
    if (id.indexOf('wild:') === 0) return '#8aa3ab';
    const c = game.coloniesById && game.coloniesById[id];
    return c ? c.color : '#8899aa';
  }

  /* Prey that you have butchered too often leave earlier. */
  function speciesBias(game, hunter, prey) {
    if (!hunter || !prey || prey.ownerId !== 'wild' || !prey.speciesId) return 1;
    const fav = of(game, hunter.ownerId, speciesNode(prey.speciesId));
    if (fav >= -0.15) return 1;
    return 1 + Math.min(0.85, (-0.15 - fav) * 1.6);
  }

  function onKill(game, killer, victim) {
    if (!killer || !victim) return;
    if (victim.ownerId === 'wild' && victim.speciesId) {
      const sn = speciesNode(victim.speciesId);
      touch(game, killer.ownerId, sn, -0.08, 'kill');
      if (of(game, killer.ownerId, sn) < -0.4 && CM.aura) {
        const x = victim.x != null ? victim.x : killer.x;
        const y = victim.y != null ? victim.y : killer.y;
        const d = victim.depth != null ? victim.depth : (killer.depth || 0);
        if (x != null && y != null) CM.aura.stamp(game, d || 0, x, y, 'dread', 0.6, 3);
      }
    } else if (victim.ownerId && victim.ownerId !== 'wild') {
      touch(game, victim.ownerId, killer.ownerId, -0.12, 'kill');
      touch(game, killer.ownerId, victim.ownerId, -0.05, 'kill');
    }
  }

  /* Graph first: a cold edge is open hostility, a warm one keeps the peace.
   * No edge (or a mild one) falls back to colonial standing. */
  function areHostile(game, aId, bId) {
    if (!aId || !bId || aId === bId) return false;
    if (aId === 'wild' || bId === 'wild') return false;
    const ab = of(game, aId, bId);
    const ba = of(game, bId, aId);
    if (ab < -0.15 || ba < -0.15) return true;
    if (ab > 0.25 || ba > 0.25) return false;
    if (CM.colony && CM.colony.standingBetween) {
      const at = CM.colony.HOSTILE_AT != null ? CM.colony.HOSTILE_AT : -0.55;
      return CM.colony.standingBetween(game, aId, bId) <= at
          || CM.colony.standingBetween(game, bId, aId) <= at;
    }
    return false;
  }

  function onSight(game, watcher, speciesId) {
    if (!watcher || !speciesId) return;
    touch(game, watcher.ownerId || 'player', speciesNode(speciesId), 0.02, 'sight');
  }

  function onExtract(game, speciesId) {
    if (!speciesId) return;
    touch(game, 'player', speciesNode(speciesId), -0.04, 'extract');
  }

  function tribute(game, fromId, toId, amount) {
    const from = game.coloniesById[fromId], to = game.coloniesById[toId];
    if (!from || !to || !from.alive || !to.alive) return { ok: false, reason: 'No mind to receive it.' };
    const cost = amount != null ? amount : 8;
    if (from.biomass < cost) return { ok: false, reason: 'Not enough biomass to offer.' };
    from.biomass -= cost;
    to.biomass = Math.min(to.biomassCap, to.biomass + cost * 0.65);
    touch(game, fromId, toId, 0.18, 'gift');
    touch(game, toId, fromId, 0.18, 'gift');
    if (from.standing) from.standing[toId] = K.clamp((from.standing[toId] || 0) + 0.18, -1, 1);
    if (to.standing) to.standing[fromId] = K.clamp((to.standing[fromId] || 0) + 0.18, -1, 1);
    return { ok: true, cost };
  }

  function tickPeace(game, dt) {
    if (!game.organisms || !game.colonies) return;
    const player = game.organisms.filter(o => o.alive && o.ownerId === 'player');
    if (!player.length) return;
    for (const other of game.organisms) {
      if (!other.alive || other.ownerId === 'player' || other.ownerId === 'wild') continue;
      if (other.state === 'ATTACK') continue;
      for (const me of player) {
        if ((me.depth || 0) !== (other.depth || 0)) continue;
        if (me.state === 'ATTACK') continue;
        if (K.dist(me.x, me.y, other.x, other.y) > 7) continue;
        const e = edge(game, 'player', other.ownerId);
        if ((e.peaceAcc || 0) > 0.15) continue;
        const step = 0.002 * dt;
        e.peaceAcc = (e.peaceAcc || 0) + step;
        touch(game, 'player', other.ownerId, step, 'near');
        break;
      }
    }
  }

  function constellation(game) {
    const nodes = [];
    const seen = {};
    function add(id) {
      if (!id || seen[id]) return;
      seen[id] = true;
      nodes.push({ id, name: labelOf(game, id), color: colorOf(game, id) });
    }
    add('player');
    const edges = [];
    const bag = (game.rep && game.rep.edges) || {};
    const keys = Object.keys(bag);
    keys.sort((a, b) => Math.abs(bag[b].favor) - Math.abs(bag[a].favor));
    for (let i = 0; i < keys.length && edges.length < 14; i++) {
      const k = keys[i];
      const e = bag[k];
      if (Math.abs(e.favor) < 0.04 && e.n < 2) continue;
      const parts = k.split('>');
      add(parts[0]); add(parts[1]);
      edges.push({ from: parts[0], to: parts[1], favor: e.favor, n: e.n, kind: e.kind });
    }
    for (const c of (game.colonies || [])) if (c.alive) add(c.id);
    return { nodes, edges };
  }

  function serialize(game) {
    return game.rep ? { edges: game.rep.edges } : { edges: {} };
  }

  function hydrate(game, data) {
    game.rep = { edges: (data && data.edges) || {} };
  }

  CM.reputation = {
    ensure, of, touch, edge, speciesNode, speciesBias, areHostile,
    onKill, onSight, onExtract, tribute, tickPeace,
    constellation, labelOf, serialize, hydrate
  };
})(window.CM = window.CM || {});

<script>
/* Coremind — interaction economy. Biomass is meat. These coins are
 * what the mind actually trades: attention, favor, gossip, scars.
 * Orders still fire when you are broke — the net just feels thin.
 */
(function (CM) {
  'use strict';
  const K = CM.core;

  function ensure(game) {
    if (!game.economy) {
      game.economy = { attention: 2, favor: 0, gossip: 0, scars: 0, gifts: 0, spent: 0 };
    }
    return game.economy;
  }

  function add(game, coin, n) {
    const e = ensure(game);
    if (e[coin] == null) e[coin] = 0;
    e[coin] = Math.max(0, e[coin] + n);
    return e[coin];
  }

  function spendAttention(game, cost) {
    const e = ensure(game);
    const c = cost || 0.35;
    const had = e.attention;
    e.attention = Math.max(0, e.attention - c);
    e.spent = (e.spent || 0) + Math.min(had, c);
    return had >= c;
  }

  function observeMul(game) {
    const e = game.economy;
    if (!e) return 1;
    return 1 + Math.min(0.25, (e.gossip || 0) * 0.02);
  }

  function thinMul(game) {
    const e = game.economy;
    if (!e) return 1;
    if (e.attention >= 0.4) return 1;
    return 0.82 + e.attention * 0.45;
  }

  function tick(game, dt) {
    const e = ensure(game);
    const thinking = (game.thought || 0) > 0.4;
    if (thinking) e.attention = Math.min(12, e.attention + 0.15 * dt);
    e.scars = Math.max(0, e.scars - 0.04 * dt);
  }

  function onOrder(game) {
    spendAttention(game, 0.35);
    if (CM.guide) CM.guide.note(game, 'order');
  }

  function onCreate(game) {
    spendAttention(game, 0.8);
    if (CM.sentiment) CM.sentiment.learn(game, 'created');
  }

  function onExtract(game, sample) {
    add(game, 'gossip', 0.6);
    if (CM.reputation && sample) CM.reputation.onExtract(game, sample.speciesId);
    if (CM.guide) CM.guide.note(game, 'extract');
  }

  function onSight(game, speciesId, watcher) {
    add(game, 'gossip', 0.2);
    if (CM.reputation) CM.reputation.onSight(game, watcher || { ownerId: 'player' }, speciesId);
    if (CM.guide) CM.guide.note(game, 'sight');
  }

  function onDeath(game, org, cause) {
    if (org && org.ownerId === 'player') add(game, 'scars', 1);
    if (org && org.ownerId === 'wild' && cause === 'combat') {
      if (CM.sentiment) CM.sentiment.learn(game, 'kill');
    }
  }

  function offerTribute(game, colony) {
    if (!CM.reputation || !colony || colony.isPlayer) {
      return { ok: false, reason: 'No one to offer to.' };
    }
    const e = ensure(game);
    if (e.favor < 1 && e.gifts > 0 && e.attention < 0.5) {
      /* first gift is free of favor; later ones want a coin or attention */
    }
    const res = CM.reputation.tribute(game, 'player', colony.id, 8);
    if (!res.ok) return res;
    if (e.favor >= 1) e.favor -= 1;
    e.gifts = (e.gifts || 0) + 1;
    add(game, 'favor', 0.35);
    if (CM.sentiment) CM.sentiment.learn(game, 'gift');
    if (CM.guide) CM.guide.note(game, 'gift');
    if (CM.life) CM.life.grantActors(game, 'gift', 5, colony.x, colony.y);
    return res;
  }

  function serialize(game) {
    const e = ensure(game);
    return {
      attention: e.attention, favor: e.favor, gossip: e.gossip,
      scars: e.scars, gifts: e.gifts || 0, spent: e.spent || 0
    };
  }

  function hydrate(game, data) {
    game.economy = {
      attention: data && data.attention != null ? data.attention : 2,
      favor: data && data.favor || 0,
      gossip: data && data.gossip || 0,
      scars: data && data.scars || 0,
      gifts: data && data.gifts || 0,
      spent: data && data.spent || 0
    };
  }

  CM.economy = {
    ensure, add, spendAttention, observeMul, thinMul, tick,
    onOrder, onCreate, onExtract, onSight, onDeath, offerTribute,
    serialize, hydrate
  };
})(window.CM = window.CM || {});

<script>
/* Coremind — optional tutorial. Short steps. Each one names a real
 * control and completes when the player uses it. Skip is always there.
 */
(function (CM) {
  'use strict';

  const BEATS = [
    {
      id: 'select',
      title: 'Select a unit',
      text: 'Tap one of your lime creatures on the map.',
      hint: 'They spawn next to the glowing Core.',
      target: 'scout'
    },
    {
      id: 'gather',
      title: 'Feed the colony',
      text: 'Tap GATHER in the command bar. Units will collect food for the Core.',
      hint: 'Command bar is under the map on phones, along the bottom on PC.',
      target: '[data-directive="GATHER"]',
      tab: 'explore'
    },
    {
      id: 'look',
      title: 'Look around',
      text: 'Drag the map to pan. Use + / − (or pinch) to zoom.',
      hint: 'Home button recenters on your Core.',
      target: '#world-canvas'
    },
    {
      id: 'analyze',
      title: 'Open the log',
      text: 'Tap ANALYZE. Sightings and samples show up here.',
      hint: 'Stand near wildlife to start filling it.',
      target: '[data-tab="analyze"]',
      tab: 'analyze'
    },
    {
      id: 'build',
      title: 'Dig a shaft',
      text: 'Tap BUILD, choose Access Shaft, then tap open ground near the Core.',
      hint: 'You need a small foothold first — gather or grow a bit if it is locked.',
      target: '#btn-open-build',
      tab: 'explore'
    }
  ];

  const LATER = [
    {
      id: 'layers',
      title: 'Change floor',
      text: 'Tap 1 on the floor stack to go underground.',
      hint: 'Left edge of the map. S is the surface.',
      target: '#depth-controls .depthbtn[data-depth="1"]',
      ready(game) {
        return !!(CM.structures && CM.structures.all(game).some(s => s.type === 'SHAFT' && s.done));
      }
    },
    {
      id: 'rivals',
      title: 'Other colonies',
      text: 'Open WORLD and tap a rival name to inspect them.',
      hint: 'Offer tribute there if you want a truce.',
      target: '[data-tab="world"]',
      tab: 'world',
      ready(game) {
        return (game.colonies || []).some(c => !c.isPlayer && c.announced);
      }
    }
  ];

  function ensure(game) {
    if (!game.guide) game.guide = { on: false, beat: 0, done: {}, later: {}, skipped: false };
    return game.guide;
  }

  function start(game, on) {
    const g = ensure(game);
    g.on = !!on;
    g.skipped = !on;
    g.beat = 0;
    g.done = {};
    g.later = {};
    g.startedAt = game.simTime || 0;
    g.sawSelect = g.sawGather = g.sawPan = g.sawAnalyze = g.sawBuild = g.sawGift = false;
  }

  function skip(game) {
    const g = ensure(game);
    g.on = false;
    g.skipped = true;
  }

  function note(game, kind) {
    const g = game.guide;
    if (!g || !g.on) return;
    if (kind === 'select') g.sawSelect = true;
    if (kind === 'gather') g.sawGather = true;
    if (kind === 'pan') g.sawPan = true;
    if (kind === 'analyze') g.sawAnalyze = true;
    if (kind === 'build') g.sawBuild = true;
    if (kind === 'gift') g.sawGift = true;
    if (kind === 'order') g.sawOrder = true;
    if (kind === 'extract') g.sawExtract = true;
    if (kind === 'sight') g.sawSight = true;
    if (kind === 'weather') g.sawWeather = true;
  }

  function current(game) {
    const g = game.guide;
    if (!g || !g.on || g.skipped) return null;
    if (g.beat < BEATS.length) {
      const b = BEATS[g.beat];
      return Object.assign({ step: g.beat + 1, total: BEATS.length }, b);
    }
    for (const b of LATER) {
      if (g.later[b.id]) continue;
      if (b.ready && !b.ready(game)) continue;
      return Object.assign({ step: BEATS.length, total: BEATS.length, extra: true }, b);
    }
    return null;
  }

  function completeBeat(game, id) {
    const g = ensure(game);
    if (g.beat < BEATS.length && BEATS[g.beat].id === id) {
      g.done[id] = game.simTime || 1;
      g.beat += 1;
      return true;
    }
    for (const b of LATER) {
      if (b.id === id && !g.later[id]) {
        g.later[id] = game.simTime || 1;
        g.done[id] = g.later[id];
        return true;
      }
    }
    return false;
  }

  function tick(game) {
    const g = ensure(game);
    if (!g.on || g.skipped) return;
    const beat = current(game);
    if (!beat) return;

    if (beat.id === 'select' && (g.sawSelect || (game.selectedIds && game.selectedIds.length))) {
      completeBeat(game, 'select');
    } else if (beat.id === 'gather' && (g.sawGather || game.globalDirective === 'GATHER')) {
      completeBeat(game, 'gather');
    } else if (beat.id === 'look' && g.sawPan) {
      completeBeat(game, 'look');
    } else if (beat.id === 'analyze' && g.sawAnalyze) {
      completeBeat(game, 'analyze');
    } else if (beat.id === 'build' && (g.sawBuild || (CM.structures && CM.structures.all(game).some(s => s.type === 'SHAFT')))) {
      completeBeat(game, 'build');
    } else if (beat.id === 'layers' && (game.viewDepth || 0) >= 1) {
      completeBeat(game, 'layers');
    } else if (beat.id === 'rivals' && (g.sawGift || (game.ui && game.ui.sawWorld))) {
      completeBeat(game, 'rivals');
    }
  }

  function serialize(game) {
    const g = game.guide;
    if (!g) return null;
    return { on: g.on, beat: g.beat, done: g.done, later: g.later, skipped: g.skipped };
  }

  function hydrate(game, data) {
    game.guide = {
      on: !!(data && data.on),
      beat: data && data.beat || 0,
      done: (data && data.done) || {},
      later: (data && data.later) || {},
      skipped: !!(data && data.skipped)
    };
  }

  CM.guide = { BEATS, LATER, ensure, start, skip, note, current, tick, serialize, hydrate };
})(window.CM = window.CM || {});

<script>
/* Coremind — the player's own entity: the Core (biomass/energy pool),
 * directive issuance, selection, and the organism designer's draft buffer.
 * Also owns the shape of the overall game object every other system reads.

(function (CM) {

  const K = CM.core;
  const T = CM.traits;
  const O = CM.organism;

    const game = {

      world,

      byId: {},
