<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f380f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Coremind</title>
<meta name="description" content="COREMIND — a single-player biological evolution sandbox. Discover, analyze, extract, design, deploy, adapt.">
<!-- Inline so the page stays a single self-contained bundle (see tools/build.mjs)
     and so no request 404s when it is opened straight off the filesystem. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230f380f' stroke='%238bac0f' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%238bac0f'/%3E%3C/svg%3E">
<style>
/* Coremind — Game Boy palette + WoW world-maker chrome.
   Chunky gold frames, leather panels, GB greens. Mobile-first, PC dock. */
:root{
  --gb0:#0f380f;
  --gb1:#306230;
  --gb2:#8bac0f;
  --gb3:#9bbc0f;
  --bg:#120c06;
  --panel:#1c140c;
  --panel2:#2a1c10;
  --line:#6b5420;
  --gold:#c9a227;
  --gold-hi:#e8c547;
  --fg:#e8dcc0;
  --fg-dim:#9a8b6a;
  --accent:#8bac0f;
  --accent-dim:#306230;
  --warn:#e0a040;
  --danger:#c04030;
  --biomass:#8bac0f;
  --energy:#e8c547;
  --pop:#9bbc0f;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:none;}
body{
  background:var(--bg);color:var(--fg);
  font:14px/1.4 "Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
  overflow:hidden;position:fixed;inset:0;
}
#world-canvas,#minimap{image-rendering:pixelated;}
#app{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-top);}

/* ---- top bar ---- */
#topbar{
  display:flex;align-items:center;gap:6px;padding:6px 8px;
  background:linear-gradient(#2a1c10,#1c140c);
  border-bottom:3px solid var(--gold);flex:0 0 auto;
  z-index:5;
}
#topbar .stat{display:flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:0;background:var(--gb0);border:2px solid var(--gb1);color:var(--gb3);}
#topbar .stat i{font-style:normal;font-size:15px;}
#stat-biomass{color:var(--biomass);}
#stat-energy{color:var(--energy);}
#stat-pop{color:var(--pop);}
#stat-mood{color:var(--gold-hi);max-width:36vw;overflow:hidden;border-color:var(--gold);}
#stat-mood span{white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:24vw;display:inline-block;}
#stat-mood[data-mood="fight"]{color:#f0c0a0;}
#stat-mood[data-mood="forage"]{color:var(--gb3);}
#stat-mood[data-mood="nest"]{color:#c9b88a;}
#stat-mood[data-mood="wonder"]{color:var(--gb2);}
#stat-eco{color:var(--fg-dim);font-size:11px;max-width:42vw;overflow:hidden;border-color:var(--gb1);}
#stat-eco span{white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:38vw;display:inline-block;font-weight:700;font-variant-numeric:tabular-nums;}
#btn-speed{margin-left:auto;}
.nuclei-strip{margin:6px 0 4px;}
.nuclei-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11.5px;}
.nuclei-row .k{width:52px;color:var(--fg-dim);flex:0 0 auto;}
.nuclei-row .bar{flex:1;height:7px;background:var(--panel2);border:1px solid var(--line);border-radius:0;overflow:hidden;}
.nuclei-row .bar > i{display:block;height:100%;background:var(--gold);}
body.thinking #btn-speed{
  color:#0f380f;background:var(--gold-hi);border-color:var(--gold);
}
body.thinking #topbar{border-bottom-color:var(--gold-hi);}

.iconbtn{
  background:var(--panel2);color:var(--gold-hi);border:2px solid var(--gold);border-radius:0;
  min-width:40px;min-height:36px;font-size:16px;line-height:1;cursor:pointer;font-weight:800;
}
.iconbtn:active{background:var(--line);}

/* ---- stage / world canvas ---- */
#stage{position:relative;flex:1 1 auto;min-height:0;background:#0a180a;overflow:hidden;}
#world-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

#cam-controls{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:4;}
.roundbtn{
  width:44px;height:44px;border-radius:0;background:var(--panel);
  color:var(--gold-hi);border:2px solid var(--gold);font-size:18px;font-weight:800;
}
.roundbtn:active{background:var(--accent-dim);}

/* Depth switcher: a vertical stack down the left edge, laid out top-to-bottom
   like the strata it selects, so which way is "down" never needs explaining. */
#depth-controls{position:absolute;left:8px;bottom:10px;display:flex;flex-direction:column;gap:2px;z-index:4;max-height:78%;overflow-y:auto;}
.depthbtn{
  width:36px;height:26px;border-radius:0;background:var(--gb0);
  color:var(--gb2);border:2px solid var(--gb1);font-size:10px;font-weight:800;
  letter-spacing:.3px;display:flex;align-items:center;justify-content:center;
}
.depthbtn.active{color:#0f380f;background:var(--gb3);border-color:var(--gold);}
.depthbtn:disabled{opacity:.32;}
.depthbtn{position:relative;}
.depthbtn.veil{color:var(--gold-hi);border-color:var(--gold);}
.depthbtn.lost{border-color:#ef5b5b;}
.depthbtn.settled{box-shadow:inset 0 -2px 0 var(--accent-dim);}
.depthbtn .pip{
  position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;
  background:var(--danger);pointer-events:none;
}

#minimap{
  position:absolute;right:10px;top:10px;z-index:5;width:112px;height:112px;
  border:3px solid var(--gold);border-radius:0;background:#0f380f;
  box-shadow:3px 3px 0 #0a0a04;touch-action:none;
}
#layer-card{
  position:absolute;right:8px;top:122px;left:auto;bottom:auto;z-index:4;max-width:min(112px,42vw);
  background:var(--panel);border:3px solid var(--gold);border-radius:0;
  padding:7px 9px;font-size:11px;line-height:1.35;pointer-events:none;
  box-shadow:3px 3px 0 #0a0a04;
}
#layer-card .lc-head{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:3px;}
#layer-card .lc-who{color:var(--fg-dim);font-weight:600;font-size:10px;}
#layer-card .lc-bonus{color:var(--accent);margin-bottom:4px;}
#layer-card .lc-pair{color:var(--fg-dim);margin-top:3px;}
#layer-card .lc-pair b{color:var(--fg);font-weight:700;}
#layer-card .lc-checks{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:6px;font-size:10px;color:var(--fg-dim);}
#layer-card .lc-checks span.ok{color:var(--accent);}
#layer-card .lc-bar{height:3px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:5px;overflow:hidden;}
#layer-card .lc-bar > i{display:block;height:100%;background:var(--accent);}
#layer-card .lc-next{margin-top:5px;font-size:10px;color:var(--warn);line-height:1.3;}
#layer-card{pointer-events:auto;}
#layer-card .lc-stance{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
#layer-card .lc-stance button{
  background:var(--panel2);border:1px solid var(--line);color:var(--fg-dim);
  border-radius:5px;padding:3px 5px;font-size:9px;font-weight:700;
}
#layer-card .lc-stance button.active{border-color:var(--accent);color:var(--accent);}
#layer-card .lc-dist{margin-top:5px;font-size:10px;color:var(--fg-dim);}
#layer-card .lc-dist b{color:var(--fg);}
#layer-card .lc-labor,#layer-card .lc-tools{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;}
#layer-card .lc-labor button,#layer-card .lc-tools button{
  background:var(--panel2);border:1px solid var(--line);color:var(--fg-dim);
  border-radius:5px;padding:3px 5px;font-size:9px;font-weight:700;
}
#layer-card .lc-labor button.active,#layer-card .lc-tools button.active{border-color:var(--accent);color:var(--accent);}
#layer-card.lc-mini{padding:5px 7px;}
#layer-card.lc-mini .lc-head{margin-bottom:2px;align-items:center;}
#layer-card .lc-toggle{
  background:none;border:0;color:var(--gold-hi);font-weight:800;cursor:pointer;padding:0 2px;font-size:12px;
}
.build-wrap{position:relative;}
.build-card.forbid{opacity:.55;}
.bc-permit{
  position:absolute;top:6px;right:6px;z-index:1;
  background:var(--panel2);border:1px solid var(--line);color:var(--fg-dim);
  border-radius:4px;padding:2px 5px;font-size:9px;font-weight:700;
}
#guide-spot{
  position:fixed;inset:0;z-index:45;pointer-events:none;
}
#guide-hole{
  position:absolute;border:3px solid var(--gold-hi);
  box-shadow:0 0 0 3px #0f380f;
  pointer-events:none;
  animation:guidepulse 1.1s ease-in-out infinite;
}
@keyframes guidepulse{
  0%,100%{box-shadow:0 0 0 3px #0f380f;}
  50%{box-shadow:0 0 0 6px var(--gb2);}
}
#guide-card{
  position:absolute;top:8px;left:8px;right:calc(8px + min(112px,42vw) + 8px);bottom:auto;z-index:46;max-width:none;
  background:var(--panel);border:3px solid var(--gold);border-radius:0;
  padding:10px 12px 8px;font-size:13px;line-height:1.4;
  box-shadow:4px 4px 0 #0a0a04;
  pointer-events:auto;
}
#guide-card .gc-head{font-weight:800;letter-spacing:.12em;color:var(--gold-hi);font-size:10px;margin-bottom:4px;}
#guide-card .gc-title{font-weight:800;font-size:15px;color:var(--gb3);margin-bottom:4px;}
#guide-card .gc-line{margin-bottom:4px;}
#guide-card .gc-hint{color:var(--fg-dim);font-size:11px;}
#guide-card .gc-skip{
  margin-top:8px;background:var(--panel2);border:2px solid var(--line);color:var(--fg-dim);
  font-size:11px;font-weight:700;cursor:pointer;padding:6px 10px;
}
#quest-card{
  position:absolute;left:8px;top:8px;right:calc(8px + min(112px,42vw) + 8px);bottom:auto;z-index:4;max-width:min(220px,46vw);
  background:var(--panel);border:2px solid var(--gold);border-radius:0;
  padding:7px 9px;font-size:11px;line-height:1.35;pointer-events:none;
}
#quest-card .qc-head{font-weight:800;letter-spacing:.04em;color:var(--accent);font-size:10px;margin-bottom:3px;}
#quest-card .qc-blurb{margin-bottom:3px;}
#quest-card .qc-hint{color:var(--fg-dim);font-size:10px;}
#quest-card .qc-side{margin-top:5px;color:var(--fg-dim);font-size:10px;}
#quest-card .qc-side b{color:var(--fg);}
.ach-row{font-size:11px;color:var(--fg-dim);padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.ach-row.on{color:var(--accent);}
.build-row.pri{border-color:var(--accent);}
.struct-acts{margin-top:4px;}

#order-bar{
  position:absolute;left:52px;right:62px;bottom:10px;z-index:5;
  display:flex;flex-wrap:wrap;gap:4px;pointer-events:auto;
}
#order-bar.hidden{display:none;}
.obtn{
  background:var(--panel);color:var(--fg);border:2px solid var(--gold);
  border-radius:0;min-height:34px;padding:4px 8px;font-size:11px;font-weight:700;
}
.obtn.active{border-color:var(--accent);color:var(--accent);background:var(--gb0);}
.build-filters{display:flex;gap:6px;margin:0 0 10px;}
.build-filters button{
  flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--fg-dim);
  border-radius:8px;padding:7px 4px;font-size:11px;font-weight:700;
}
.build-filters button.active{border-color:var(--accent);color:var(--accent);}

#layer-card.hidden{display:none !important;}

/* Bottom-right, above the camera buttons: bottom-left belongs to the depth
   strip and bottom-centre to the stratum banner the renderer draws. */
#sanctum-meter{
  position:absolute;right:10px;bottom:178px;z-index:4;font-size:11px;color:var(--fg);
  background:var(--panel);border:2px solid var(--gold);border-radius:0;padding:5px 8px;
  max-width:150px;pointer-events:none;
}
#sanctum-meter .bar{height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:4px;overflow:hidden;}
#sanctum-meter .bar > i{display:block;height:100%;background:var(--gold);}
#sanctum-meter.secured{color:var(--gold-hi);border-color:var(--gold-hi);}

#toast-layer{
  position:absolute;left:8px;top:56px;right:auto;bottom:auto;
  display:flex;flex-direction:column-reverse;gap:4px;
  pointer-events:none;z-index:6;align-items:flex-start;
  max-width:min(260px,58vw);
}
#toast-layer.under-quest{top:88px;}
#toast-layer.under-guide{top:120px;}
.toast{
  display:flex;align-items:center;gap:6px;
  background:var(--gb0);border:2px solid var(--gb1);border-left:4px solid var(--gb2);
  padding:5px 8px;border-radius:0;max-width:100%;
  font-size:11.5px;line-height:1.3;color:var(--gb3);
  box-shadow:2px 2px 0 #0a0a04;
  animation:toastin .16s cubic-bezier(.2,1.4,.3,1);
}
.toast.good{border-left-color:var(--gold-hi);color:var(--gold-hi);}
.toast.warn{border-left-color:var(--warn);color:#f0d090;}
.toast.danger{border-left-color:var(--danger);color:#f0b0a0;}
.toast-ico{flex:0 0 auto;font-size:13px;}
.toast-msg{flex:1;min-width:0;}
.toast-n{flex:0 0 auto;font-weight:800;color:var(--gold-hi);font-size:11px;}
.toast.toast-pop{animation:toastpop .14s ease-out;}
.toast.toast-out{opacity:0;transform:translateX(-8px);transition:opacity .2s,transform .2s;}
@keyframes toastin{from{opacity:0;transform:translateX(-10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastpop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}

#selection-panel.card{
  position:absolute;left:8px;top:8px;right:auto;max-width:280px;z-index:5;
}
.playbtn{
  background:var(--gb2);color:#0f380f;border:2px solid #0f380f;font-weight:800;
  font-size:11px;padding:4px 8px;min-height:28px;cursor:pointer;
}
#hero-target{
  position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:7;
  background:var(--panel);border:2px solid var(--danger);color:var(--fg);
  padding:5px 10px;font-size:12px;font-weight:700;pointer-events:none;
  min-width:140px;text-align:center;
}
.hero-hp{height:4px;background:#2a1c10;margin-top:4px;overflow:hidden;}
.hero-hp > i{display:block;height:100%;background:var(--danger);}
#hero-hud{
  position:absolute;left:8px;right:8px;bottom:8px;z-index:8;
  display:flex;align-items:flex-end;gap:6px;pointer-events:auto;
}
#hero-bar{
  flex:1;display:flex;flex-wrap:wrap;gap:4px;
  background:var(--panel);border:3px solid var(--gold);padding:6px;
}
.abtn{
  flex:1 1 11%;min-width:52px;min-height:48px;background:var(--gb0);
  border:2px solid var(--gb1);color:var(--gb3);font-weight:800;font-size:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.abtn i{font-style:normal;color:var(--gold-hi);font-size:11px;}
.abtn.wait{opacity:.45;}
.abtn b{font-size:9px;color:var(--warn);}
.hero-syn{flex:1 0 100%;font-size:10px;color:var(--gold-hi);padding-top:2px;}
#btn-hero-bag,#btn-hero-exit{
  background:var(--panel2);color:var(--gold-hi);border:2px solid var(--gold);
  font-weight:800;min-height:48px;padding:0 10px;
}
#hero-stick{
  position:absolute;left:12px;bottom:92px;width:88px;height:88px;z-index:8;
  border:3px solid var(--gold);background:rgba(15,56,15,.45);border-radius:0;
}
#hero-bag{
  position:absolute;right:8px;bottom:92px;z-index:9;width:min(240px,70vw);
  background:var(--panel);border:3px solid var(--gold);padding:8px;
}
.bag-slot{display:block;width:100%;text-align:left;margin:3px 0;padding:6px 8px;
  background:var(--panel2);border:2px solid var(--line);color:var(--fg);font-size:12px;}
.bag-slot.empty{opacity:.4;}
body.hero #layer-card,body.hero #panel-explore,body.hero #order-bar,body.hero #cam-controls{display:none !important;}
body.hero #selection-panel.card{
  left:8px;right:auto;top:auto;bottom:96px;max-width:220px;
}
@media (min-width:900px){
  body.hero #hero-stick{display:none !important;}
  #selection-panel.card{left:52px;}
}
.card{
  background:var(--panel);border:2px solid var(--gold);border-radius:0;color:var(--fg);padding:10px 12px;
}
.hidden{display:none !important;}

/* ---- bottom tabs ---- */
#tabs{display:flex;flex:0 0 auto;background:var(--panel);border-top:3px solid var(--gold);}
.tab{
  flex:1;padding:11px 4px;background:none;border:none;color:var(--fg-dim);font-weight:800;
  font-size:12px;letter-spacing:.06em;position:relative;min-height:48px;
}
.tab.active{color:var(--gold-hi);box-shadow:inset 0 -3px 0 var(--gold);background:#2a1c10;}
.badge{
  position:absolute;top:4px;right:calc(50% - 26px);background:var(--accent);color:#04140e;
  border-radius:9px;padding:0 5px;font-size:10px;font-weight:800;
}
.badge.warn{background:var(--warn);}

/* ---- bottom panels ---- */
.panel{display:none;flex:0 0 auto;background:var(--panel);max-height:40vh;overflow-y:auto;padding:8px 10px calc(10px + var(--safe-bottom));}
.panel.active{display:block;}
#selection-summary{color:var(--fg-dim);font-size:12.5px;margin-bottom:8px;}

#panel-explore{max-height:none;}
#directive-bar{display:flex;flex-wrap:wrap;gap:4px;min-height:44px;align-items:stretch;}
#directive-bar .dir-extra{display:none;}
#directive-bar.dir-full .dir-extra{display:flex;}
#panel-explore #btn-open-build{
  position:static;width:auto;margin:0;min-height:44px;padding:4px 8px;font-size:11px;flex:0 0 auto;
}
.dirbtn{
  background:var(--gb0);border:2px solid var(--gb1);border-radius:0;color:var(--gb3);
  padding:4px 2px;font-size:10px;font-weight:800;min-height:44px;flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
}
.dirbtn i{font-style:normal;font-size:16px;}
.dirbtn.active{border-color:var(--gold);color:var(--gold-hi);background:#1a2e0a;}
.dirbtn:disabled{opacity:.35;}

/* ---- event feed ---- */
#event-feed{display:flex;flex-direction:column;gap:6px;}
.event-row{
  display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;text-align:left;color:var(--fg);
}
.event-row .ico{font-size:16px;flex:0 0 auto;}
.event-row .body{flex:1;min-width:0;}
.event-row .msg{font-size:12.5px;}
.event-row .time{font-size:10.5px;color:var(--fg-dim);}
.event-row.discovery{border-left:3px solid var(--accent);}
.event-row.death{border-left:3px solid var(--danger);}
.event-row.warn{border-left:3px solid var(--warn);}
.event-empty{color:var(--fg-dim);text-align:center;padding:20px 0;font-size:12.5px;}

/* ---- overlays (designer / inspect / boot) ---- */
.overlay{
  position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;
  padding-top:var(--safe-top);
}
.overlay-head{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto;}
.overlay-title{flex:1;text-align:center;font-weight:800;letter-spacing:.06em;font-size:13px;}

/* designer */
#designer-preview{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:10px;background:var(--panel);border-bottom:1px solid var(--line);}
#preview-canvas{background:radial-gradient(circle at 50% 40%,#0f2018,#050a08);border-radius:12px;border:1px solid var(--line);}
#designer-cost{margin-top:6px;font-size:12px;color:var(--fg-dim);}
#designer-cost .ok{color:var(--biomass);}
#designer-cost .bad{color:var(--danger);}

#designer-slots{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:var(--panel);border-bottom:1px solid var(--line);}
.slot{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;
}
.slot .cat{font-size:10px;color:var(--fg-dim);letter-spacing:.06em;}
.slot .trait{font-size:12.5px;font-weight:700;margin:4px 0;min-height:16px;}
.slot .trait.empty{color:var(--fg-dim);font-weight:400;}
.slot select{
  width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;
  padding:6px 2px;font-size:11.5px;min-height:34px;
}

#designer-stats{flex:1;overflow-y:auto;padding:10px;}
.statrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;}
.statrow .label{width:76px;flex:0 0 auto;color:var(--fg-dim);}
.statrow .bar{flex:1;height:9px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--line);}
.statrow .bar > i{display:block;height:100%;background:var(--accent);}
.statrow .val{width:34px;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums;}
.statrow .delta{width:36px;flex:0 0 auto;font-size:10.5px;text-align:left;}
.statrow .delta.pos{color:var(--biomass);}
.statrow .delta.neg{color:var(--danger);}

.bigbtn{
  flex:0 0 auto;margin:10px;padding:14px;border-radius:0;border:3px solid #0f380f;background:var(--gb2);
  color:#0f380f;font-weight:800;font-size:14px;letter-spacing:.04em;min-height:50px;
  box-shadow:3px 3px 0 #0a0a04;
}
.bigbtn:disabled{opacity:.35;}
.bigbtn.secondary{background:var(--panel2);color:var(--gold-hi);border:3px solid var(--gold);}

/* designer: conflicts / synergies / saved strains */
#designer-actions{flex:0 0 auto;display:flex;gap:0;padding-bottom:var(--safe-bottom);}
#designer-actions .bigbtn{flex:1;}
#btn-save-design{flex:0 0 38%;}

#designer-combo{flex:0 0 auto;padding:0 10px;background:var(--panel);}
#designer-combo:empty{display:none;}
.combo-note{
  display:flex;gap:6px;align-items:flex-start;font-size:11.5px;padding:6px 8px;border-radius:8px;margin-bottom:6px;
}
.combo-note.synergy{background:rgba(139,172,15,.12);border:1px solid var(--accent-dim);color:var(--accent);}
.combo-note.conflict{background:rgba(239,91,91,.12);border:1px solid var(--danger);color:var(--danger);}

#designer-designs{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line);}
#designer-designs:empty{display:none;}
.strain-chip{
  flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:14px;
  padding:7px 12px;font-size:11.5px;color:var(--fg);white-space:nowrap;min-height:34px;
}
.strain-chip:active{border-color:var(--accent);color:var(--accent);}
.strain-chip .del{color:var(--fg-dim);margin-left:6px;}

/* analyze: research backlog */
#research-list{margin-bottom:10px;}
#research-list:empty{display:none;}
.research-head{font-size:10.5px;letter-spacing:.08em;color:var(--fg-dim);margin-bottom:6px;}
.research-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px;}
.research-row .rname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.research-row .rbar{width:74px;height:7px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:0 0 auto;}
.research-row .rbar > i{display:block;height:100%;background:var(--warn);}
.research-row .rcount{width:30px;text-align:right;color:var(--fg-dim);font-size:10.5px;flex:0 0 auto;}

/* observation report inside an event row */
.obs{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line);font-size:11px;color:var(--fg-dim);}
.obs b{color:var(--fg);font-weight:600;}

/* inspect */
#inspect-body{flex:1;overflow-y:auto;padding:12px;}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.kv .k{color:var(--fg-dim);}
.trait-chip{
  display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);
  border-radius:14px;padding:4px 10px;margin:3px 4px 0 0;font-size:11.5px;
}
.extract-btn{width:100%;margin-top:12px;}

/* boot */
#boot-overlay{align-items:center;justify-content:center;z-index:50;background:#0f380f;}
.boot-card{text-align:center;padding:20px;max-width:380px;border:4px solid var(--gold);background:#1c140c;box-shadow:6px 6px 0 #0a0a04;}
.boot-core{
  width:48px;height:48px;margin:0 auto 14px;border-radius:0;
  background:var(--gb3);border:4px solid var(--gb0);
  box-shadow:4px 4px 0 #0a0a04;
}
@keyframes corepulse{0%,100%{transform:none}50%{transform:none}}
.boot-card h1{font-size:28px;letter-spacing:.16em;margin:0 0 4px;color:var(--gold-hi);}
.boot-card .tag{color:var(--fg-dim);margin:0 0 26px;}
.boot-card .hint{color:var(--fg-dim);font-size:11.5px;margin-top:20px;}
.boot-card .bigbtn{width:100%;margin:8px 0;}
.eco-strip{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px;font-size:11px;color:var(--fg-dim);}
.eco-strip span{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 7px;}
.constellation{display:block;margin:4px 0 10px;background:rgba(6,10,16,.55);border-radius:8px;border:1px solid var(--line);}

@media (min-width:600px){
  #selection-panel.card{max-width:320px;}
  #designer-slots{grid-template-columns:repeat(6,1fr);}
}

/* world / colony roster */
#world-readout{margin-bottom:10px;}
#colony-roster{display:flex;flex-direction:column;gap:6px;}
.colony-row{
  display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;text-align:left;color:var(--fg);width:100%;min-height:44px;
}
.colony-row.dead{opacity:.45;}
.colony-row .swatch{width:12px;height:12px;border-radius:3px;flex:0 0 auto;}
.colony-row .cbody{flex:1;min-width:0;display:flex;flex-direction:column;}
.colony-row .cname{font-size:12.5px;font-weight:600;}
.colony-row .cname em{color:var(--fg-dim);font-style:normal;font-weight:400;}
.colony-row .cmeta{font-size:10.5px;color:var(--fg-dim);}
.colony-row .cint{font-size:11px;color:var(--danger);flex:0 0 auto;}
.event-row.rival{border-left:3px solid #a26bd6;}
.event-row.climate{border-left:3px solid #4fa9e0;}
#stat-climate{color:var(--gb3);font-size:11.5px;}
#stat-climate span{white-space:nowrap;}

/* ---- transient sheets -------------------------------------------------
   Sheets slide up from the bottom and deliberately do NOT cover the world:
   the game stays visible and running above them, which is the whole reason
   they replaced full-screen overlays. Dismiss by tapping outside, swiping
   the grip down, or the close button. */
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:30;
  display:flex;flex-direction:column;
  max-height:52vh;
  background:var(--panel);color:var(--fg);
  border-top:3px solid var(--gold);
  border-radius:0;
  box-shadow:0 -10px 30px rgba(0,0,0,.45);
  padding-bottom:var(--safe-bottom);
  transform:translateY(0);
  transition:transform .2s cubic-bezier(.2,.8,.3,1);
  touch-action:none;
}
.sheet.tall{max-height:82vh;}
.sheet.closing{transform:translateY(105%);}
.sheet-grip{
  flex:0 0 auto;width:40px;height:4px;border-radius:2px;background:var(--line);
  margin:8px auto 2px;
}
.sheet-head{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:4px 12px 8px;
  border-bottom:1px solid var(--line);
}
.sheet-title{flex:1;font-weight:800;letter-spacing:.06em;font-size:12.5px;color:var(--fg-dim);}
#inspect-body,#build-body{flex:1 1 auto;overflow-y:auto;padding:10px 12px;}

/* The catcher sits under the sheet but over the world, so a tap anywhere
   else closes it without dimming what the player is watching. */
#sheet-catcher{position:absolute;inset:0;z-index:29;background:transparent;}

@keyframes sheetin{from{transform:translateY(105%)}to{transform:translateY(0)}}
.sheet:not(.closing){animation:sheetin .2s cubic-bezier(.2,.8,.3,1);}

/* ---- build mode ---- */
#build-banner{
  position:absolute;left:10px;right:10px;top:10px;z-index:8;
  background:var(--panel);color:var(--fg);border:2px solid var(--gold);
  border-left:3px solid var(--accent);border-radius:0;padding:9px 12px;
  font-size:12.5px;display:flex;align-items:center;gap:10px;
}
#build-banner .bb-text{flex:1;}
#build-banner .bb-text b{color:var(--accent);}
#build-banner button{
  background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  border-radius:8px;min-height:32px;padding:0 10px;font-size:11.5px;
}

.build-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.depth-head{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:10.5px;letter-spacing:.09em;color:var(--fg-dim);
  margin:12px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--line);
}
.depth-head span:first-child{font-weight:700;}
.build-card{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:9px 10px;text-align:left;color:var(--fg);min-height:70px;
}
.build-card:disabled{opacity:.4;}
.build-card.active{border-color:var(--accent);background:rgba(139,172,15,.1);}
.build-card .bc-top{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;}
.build-card .bc-cost{font-size:10.5px;color:var(--fg-dim);margin-top:3px;}
.build-card .bc-blurb{font-size:10.5px;color:var(--fg-dim);margin-top:4px;line-height:1.35;}
.build-list{display:flex;flex-direction:column;gap:5px;margin-top:10px;}
.build-row{display:flex;align-items:center;gap:8px;font-size:11.5px;background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;padding:6px 9px;color:var(--fg);text-align:left;}
.build-row .br-bar{flex:1;height:6px;background:var(--panel);border-radius:3px;overflow:hidden;border:1px solid var(--line);}
.build-row .br-bar > i{display:block;height:100%;background:var(--accent);}

/* The designer sheet: one scrolling body, a pinned action row. */
#designer-scroll{flex:1 1 auto;overflow-y:auto;min-height:0;}
#designer-scroll #designer-preview{border-bottom:1px solid var(--line);}
#designer-scroll #preview-canvas{width:180px;height:180px;}
#designer-scroll #designer-stats{flex:none;overflow:visible;}
#designer-actions{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel);}

.sheet{border-radius:0;border-top:3px solid var(--gold);}
.obtn{border-radius:0;border:2px solid var(--gold);background:var(--panel);}
.card{border-radius:0;border:2px solid var(--gold);background:var(--panel);}
body.guiding #quest-card{display:none !important;}

/* ---- PC / world-maker dock ---------------------------------------------
   Wide screens: action bar on the map, windows on the right, tabs as
   bag buttons. Phones keep the bottom tab strip. */
@media (min-width:900px){
  #app{flex-direction:column;}
  #topbar{padding:6px 12px 6px 10px;}
  #stat-mood span{max-width:160px;}
  #tabs{
    position:absolute;top:8px;right:130px;z-index:8;
    width:auto;border:3px solid var(--gold);background:var(--panel);
    flex:none;
  }
  .tab{flex:none;padding:8px 14px;min-height:36px;font-size:11px;}
  #stage{order:1;}
  #panel-explore{
    position:absolute;left:48px;right:330px;bottom:10px;z-index:7;
    max-height:none;background:transparent;padding:0;pointer-events:none;
  }
  #panel-explore.active,#panel-explore{display:block;}
  #panel-explore #selection-summary{display:none;}
  #panel-explore #directive-bar{
    display:flex;
    pointer-events:auto;
    gap:4px;
    background:var(--panel);
    border:3px solid var(--gold);
    padding:6px;
    box-shadow:4px 4px 0 #0a0a04;
  }
  #panel-explore #directive-bar .dir-extra{display:flex;}
  #panel-explore #btn-dir-more{display:none !important;}
  #panel-explore #btn-open-build{
    pointer-events:auto;position:static;width:140px;margin:0 0 0 6px;min-height:40px;
  }
  #panel-world,#panel-analyze{
    position:absolute;right:8px;top:48px;z-index:8;
    width:300px;max-height:calc(100% - 56px);
    border:3px solid var(--gold);background:var(--panel);
    box-shadow:4px 4px 0 #0a0a04;
  }
  #layer-card{top:48px;right:316px;max-width:min(200px,44vw);}
  #guide-card{top:8px;left:52px;right:auto;max-width:280px;bottom:auto;}
  #quest-card{left:52px;top:8px;right:auto;bottom:auto;}
  #cam-controls{bottom:88px;}
  #order-bar{left:48px;right:330px;bottom:86px;}
  #toast-layer{left:52px;bottom:160px;top:auto;max-width:280px;}
  #minimap{top:8px;}
  .sheet{left:auto;right:8px;width:420px;max-height:80vh;border:3px solid var(--gold);border-radius:0;}
}

@media (max-width:899px){
  /* Layer sits in the minimap column; guide/quest stop at that gutter. */
  #guide-card{top:8px;left:8px;right:calc(8px + min(112px,42vw) + 8px);bottom:auto;max-width:none;}
  #quest-card{top:8px;left:8px;right:calc(8px + min(112px,42vw) + 8px);bottom:auto;}
  #layer-card{top:122px;right:8px;left:auto;max-width:min(112px,42vw);}
  #topbar{flex-wrap:wrap;gap:4px;}
  #stat-climate,#stat-mood{font-size:11px;}
  .dirbtn{min-height:44px;}
  #toast-layer{left:8px;top:56px;bottom:auto;max-width:min(220px,52vw);}
  #toast-layer.under-quest{top:88px;}
  #toast-layer.under-guide,body.guiding #toast-layer{top:120px;bottom:auto;left:8px;}
}

</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div class="stat" id="stat-biomass" title="Biomass"><i>B</i><span>0</span></div>
    <div class="stat" id="stat-energy" title="Energy"><i>E</i><span>0</span></div>
    <div class="stat" id="stat-pop" title="Colony"><i>C</i><span>0</span></div>
    <div class="stat" id="stat-climate" title="Season and weather"><i>T</i><span>—</span></div>
    <div class="stat mood" id="stat-mood" title="Colony status"><i>&#9670;</i><span>Exploring</span></div>
    <div class="stat eco" id="stat-eco" title="ATT: earned while THINK, spent on orders. FAV: gifts and peace. GOS: sights and extracts. SCR: colony deaths."><span>ATT 2  FAV 0  GOS 0  SCR 0</span></div>
    <button id="btn-speed" class="iconbtn" title="Simulation speed">1x</button>
  </div>

  <div id="stage">
    <canvas id="world-canvas"></canvas>

    <div id="toast-layer"></div>

    <div id="selection-panel" class="card hidden"></div>
    <div id="hero-target" class="hidden"></div>
    <div id="hero-hud" class="hidden">
      <div id="hero-bar"></div>
      <button type="button" id="btn-hero-bag">BAG</button>
      <button type="button" id="btn-hero-exit">COMMAND</button>
    </div>
    <div id="hero-stick" class="hidden" aria-hidden="true"></div>
    <div id="hero-bag" class="hidden"></div>

    <div id="cam-controls">
      <button id="btn-focus-core" class="roundbtn" title="Focus Core">&#8962;</button>
      <button id="btn-zoom-in" class="roundbtn" title="Zoom in">+</button>
      <button id="btn-zoom-out" class="roundbtn" title="Zoom out">&minus;</button>
    </div>

    <canvas id="minimap" width="140" height="140" title="Tap to jump"></canvas>
    <div id="depth-controls"></div>
    <div id="layer-card" class="hidden"></div>
    <div id="guide-spot" class="hidden"><div id="guide-hole"></div></div>
    <div id="guide-card" class="hidden"></div>
    <div id="quest-card" class="hidden"></div>
    <div id="order-bar" class="hidden"></div>
    <div id="sanctum-meter" class="hidden"></div>
  </div>

  <div id="tabs">
    <button data-tab="explore" class="tab active">EXPLORE</button>
    <button data-tab="analyze" class="tab">ANALYZE<span id="badge-analyze" class="badge hidden">0</span></button>
    <button data-tab="dna" class="tab">DNA<span id="badge-dna" class="badge hidden">!</span></button>
    <button data-tab="world" class="tab">WORLD</button>
  </div>

  <div id="panel-explore" class="panel active">
    <div id="selection-summary">Select a unit on the map, or give an order to the whole colony.</div>
    <div id="directive-bar">
      <button id="btn-open-build" class="bigbtn secondary">BUILD</button>
    </div>
  </div>

  <div id="panel-world" class="panel">
    <div id="world-readout"></div>
    <div id="colony-roster"></div>
  </div>

  <div id="panel-analyze" class="panel">
    <div id="research-list"></div>
    <div id="event-feed"></div>
  </div>

  <div id="designer-overlay" class="sheet tall hidden">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <div class="sheet-title">GENOME DESIGNER</div>
      <button id="btn-designer-close" class="iconbtn">&#10005;</button>
    </div>
    <!-- Everything except the action row scrolls together. The fixed-height
         preview and slot grid together can exceed the sheet, and with them
         all flex:0 0 auto the CREATE ORGANISM button was pushed off the
         bottom of the screen and became unclickable. -->
    <div id="designer-scroll">
      <div id="designer-preview">
        <canvas id="preview-canvas" width="240" height="240"></canvas>
        <div id="designer-cost"></div>
      </div>
      <div id="designer-slots"></div>
      <div id="designer-combo"></div>
      <div id="designer-stats"></div>
      <div id="designer-designs"></div>
    </div>
    <div id="designer-actions">
      <button id="btn-save-design" class="bigbtn secondary">SAVE STRAIN</button>
      <button id="btn-create-organism" class="bigbtn" disabled>CREATE ORGANISM</button>
    </div>
  </div>

  <div id="inspect-overlay" class="sheet hidden">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <div class="sheet-title" id="inspect-title">DETAILS</div>
      <button id="btn-inspect-close" class="iconbtn">&#10005;</button>
    </div>
    <div id="inspect-body"></div>
  </div>

  <div id="build-overlay" class="sheet hidden">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <div class="sheet-title">BUILD</div>
      <button id="btn-build-close" class="iconbtn">&#10005;</button>
    </div>
    <div id="build-body"></div>
  </div>

  <!-- Catches taps outside an open sheet so anywhere-but-the-sheet dismisses
       it. Deliberately not a dimming scrim: the point of a sheet here is that
       the world stays visible and legible behind it. -->
  <div id="sheet-catcher" class="hidden"></div>

  <div id="build-banner" class="hidden"></div>

  <div id="end-overlay" class="overlay hidden">
    <div class="boot-card">
      <h1 id="end-title">COREMIND</h1>
      <p class="tag" id="end-blurb"></p>
      <button id="btn-end-continue" class="bigbtn secondary">KEEP PLAYING</button>
    </div>
  </div>

  <div id="boot-overlay" class="overlay">
    <div class="boot-card">
      <div class="boot-core" aria-hidden="true"></div>
      <h1>COREMIND</h1>
      <p class="tag">grow a colony · dig a world · hold the gate</p>
      <button id="btn-continue" class="bigbtn hidden">CONTINUE</button>
      <button id="btn-new-world" class="bigbtn">NEW GAME</button>
      <button id="btn-new-quiet" class="bigbtn secondary">NEW GAME — SKIP TUTORIAL</button>
      <p class="hint">New Game walks you through select, gather, look, log, and build.</p>
    </div>
  </div>

</div>

<script>
/* Coremind — shared helpers: RNG, noise, math, formatting, event bus.
 *
 * The world is regenerated from a seed (see world.js), so anything here that
 * touches world generation must be deterministic given the same seed.
 */
(function (CM) {
  'use strict';

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const clamp01 = v => clamp(v, 0, 1);
  const lerp = (a, b, t) => a + (b - a) * t;
  const invLerp = (a, b, v) => (b === a ? 0 : clamp01((v - a) / (b - a)));
  const rndInt = (rng, a, b) => Math.floor(a + rng() * (b - a + 1));
  const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
  const chance = (rng, p) => rng() < p;
  const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
  const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));

  /* Angle helpers for steering. */
  function angDelta(a, b) {
    let d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }
  function turnToward(a, b, maxStep) {
    return a + clamp(angDelta(a, b), -maxStep, maxStep);
  }

  /* Seeded RNG (mulberry32). Every stream that must be reproducible from the
   * world seed uses one of these — never Math.random(). */
  function rngFrom(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hash2(seed, x, y) {
    let h = (seed * 374761393 + x * 668265263 + y * 2147483647) >>> 0;
    h = (h ^ (h >>> 13)) >>> 0;
    h = Math.imul(h, 1274126177) >>> 0;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  /* Smooth value noise — good enough for biome blotches and temperature
   * fields, cheap enough to sample 65k times at world-gen. */
  function noise2(seed, x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(seed, xi, yi), b = hash2(seed, xi + 1, yi);
    const c = hash2(seed, xi, yi + 1), d = hash2(seed, xi + 1, yi + 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  }

  function fbm(seed, x, y, octaves) {
    let sum = 0, amp = 1, norm = 0, f = 1;
    for (let i = 0; i < (octaves || 4); i++) {
      sum += amp * noise2(seed + i * 7919, x * f, y * f);
      norm += amp;
      amp *= 0.52; f *= 2.1;
    }
    return sum / norm;
  }

  // --- formatting ----------------------------------------------------------
  function fmt(n) {
    n = Math.floor(n);
    if (Math.abs(n) < 1000) return String(n);
    if (Math.abs(n) < 1e6) return (n / 1000).toFixed(n < 1e4 ? 1 : 0).replace(/\.0$/, '') + 'k';
    return (n / 1e6).toFixed(2).replace(/\.0+$/, '') + 'M';
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h) return h + 'h ' + String(m).padStart(2, '0') + 'm';
    return m + ':' + String(s).padStart(2, '0');
  }

  // --- tiny pub/sub used to decouple simulation, discovery and UI ----------
  function makeBus() {
    const listeners = {};
    return {
      on(kind, fn) {
        (listeners[kind] || (listeners[kind] = [])).push(fn);
        return () => { const a = listeners[kind]; const i = a.indexOf(fn); if (i >= 0) a.splice(i, 1); };
      },
      emit(kind, payload) {
        const a = listeners[kind];
        if (!a) return;
        for (let i = 0; i < a.length; i++) {
          try { a[i](payload); } catch (e) { console.error('[coremind] listener error for', kind, e); }
        }
      }
    };
  }

  /* Monotonically increasing ids, namespaced by prefix so debug output stays
   * readable ("org_42", "sample_7"). */
  function makeIdGen() {
    const counters = {};
    return prefix => {
      counters[prefix] = (counters[prefix] || 0) + 1;
      return prefix + '_' + counters[prefix];
    };
  }

  CM.core = {
    clamp, clamp01, lerp, invLerp, rndInt, pick, chance, dist, dist2,
    angDelta, turnToward, rngFrom, hash2, noise2, fbm,
    fmt, fmtClock, makeBus, makeIdGen

  const TRAITS_BY_ID = {};

  const BASE_CREATE_COST = { biomass: 18, energy: 12 };

  /* Stats where a *lower* number is the better outcome. Everything that
   * reasons about whether a modifier is a benefit or a cost — the synergy
   * bonus below, and the designer's +/- colouring — has to consult this, or
   * it will cheerfully report a metabolism increase as an improvement. */
  const LOWER_IS_BETTER = new Set(['metabolism', 'water_requirement']);
  function isBenefit(statKey, delta) {
    return LOWER_IS_BETTER.has(statKey) ? delta < 0 : delta > 0;

  /* Each satisfied `compatibility` pairing amplifies both traits' upsides by
   * this much. Deliberately one-directional: synergy never deepens a trait's

   * relationship, never a hidden penalty. */
  const SYNERGY_BONUS = 0.15;

  /* Which declared pairings are actually live in this set of traits. Pure and
   * cheap (<=6 traits), so the designer can call it on every change. */
  function checkCombination(traitIds) {
    const ids = traitIds.filter(Boolean);
    const set = new Set(ids);
    const conflicts = [], synergies = [], seen = new Set();
    for (const id of ids) {
      const t = TRAITS_BY_ID[id];
      if (!t) continue;
      for (const other of t.incompatibility) {
        if (!set.has(other)) continue;
        const key = [id, other].sort().join('|');
        if (seen.has(key)) continue;
        seen.add(key);
        conflicts.push({ a: id, b: other });
      }
      for (const other of t.compatibility) {
        if (!set.has(other)) continue;
        const key = 's:' + [id, other].sort().join('|');
        if (seen.has(key)) continue;
        seen.add(key);
        synergies.push({ a: id, b: other });

    // every contributor of a pairing rather than depending on iteration order.

      for (const k in t.stat_modifiers) {

    resolveStats, resolveCost, behaviorModifiers,

  };

      visual_modifier: 'digger', behavior_modifier: 'caste_morph',
      unlock: 'cut_descent' }

  const BY_ID = {};
  for (const m of MUTATIONS) BY_ID[m.id] = m;

  function register() {
    const T = CM.traits;
    if (!T || T.__mutationsIn) return;
    T.__mutationsIn = true;
    for (const m of MUTATIONS) {
      m.mutation = true;
      T.TRAITS.push(m);
      T.TRAITS_BY_ID[m.id] = m;
      (T.TRAITS_BY_CATEGORY[m.category] || (T.TRAITS_BY_CATEGORY[m.category] = [])).push(m);
    }
  }

  function unlocked(game, id) {
    return !!(game.progress && game.progress.mutations && game.progress.mutations[id]);
  }

  function unlock(game, bus, id, silent) {
    if (!game.progress) return false;
    if (game.progress.mutations[id]) return false;
    const m = BY_ID[id];
    if (!m) return false;
    game.progress.mutations[id] = game.simTime || 1;
    if (game.discovery) game.discovery.discoveredTraits[id] = true;
    if (!silent && bus) {
      CM.discovery.pushEvent(game, bus, {
        kind: 'discovery', icon: '\u{1F9EC}',
        message: `Mutation unlocked: ${m.name}. It can be designed into a genome.`,
        traitId: id
      });
    }
    return true;
  }

  function allyCount(game, org, radius) {
    let n = 0;
    const near = game.world.grid.queryRadius(org.x, org.y, radius, []);
    for (const o of near) {
      if (o === org || !o.alive || o.ownerId !== org.ownerId) continue;
      if ((o.depth || 0) !== (org.depth || 0)) continue;
      n++;
    }
    return n;
  }

  function carryCap(org) {
    return org.behaviors && org.behaviors.has('iron_sinew') ? 34 : 22;
  }

  function moveMul(world, org) {
    let m = 1;
    const water = CM.world.isWaterAt(world, org.x, org.y);
    if (org.behaviors.has('amphibious') && water) m *= 2.1;
    if (org.behaviors.has('amphibious') && !water) m *= 0.92;
    if (org.behaviors.has('hover_glide')) m *= 1.35;
    if (org.behaviors.has('hibernation') && world.temp) {
      const t = CM.world.tempAt(world, org.x, org.y);
      if (t < 4) m *= 0.62;
    }
    if (org.behaviors.has('pack_stride')) {
      /* allyCount needs a game; callers that have game set __allyN. */
      if ((org.__allyN || 0) >= 2) m *= 1.22;
    }
    if (org.behaviors.has('night_sight') && world.climateOffset < -4) m *= 1.08;
    return m;
  }

  function onMelee(game, org, target, dt, dmg) {
    if (org.behaviors.has('prey_focus') && target.health < target.stats.health * 0.5) dmg *= 1.24;
    if (org.behaviors.has('constrict') && (org.stats.speed || 0) > (target.stats.speed || 0)) dmg *= 1.2;
    if (org.behaviors.has('pack_rend') && (org.__allyN || 0) >= 1) dmg *= 1.18;
    if (org.behaviors.has('keratin_plates') && target.behaviors && target.behaviors.has('armor_pierce')) {
      /* plates blunt the pierce the attacker already applied; handled in sim. */
    }
    if (org.behaviors.has('parasitic')) {
      org.health = Math.min(org.stats.health, org.health + dmg * 0.35);
    }
    if (org.behaviors.has('shock') && Math.random() < 0.22 * dt * 10) {
      target.__stun = Math.max(target.__stun || 0, 1.4);
    }
    if (target.behaviors && target.behaviors.has('thorn_hide')) {
      org.health -= dmg * 0.28;
    }
    if (target.behaviors && target.behaviors.has('toxin_sink') && org.behaviors.has('damage_over_time')) {
      dmg *= 0.55;
    }
    return dmg;
  }

  function tickOrg(game, org, dt) {
    if (!org.behaviors || org.behaviors.size === 0) return;
    org.__allyN = (org.behaviors.has('pack_stride') || org.behaviors.has('pack_rend') || org.behaviors.has('hive_mind') || org.behaviors.has('brood_care'))
      ? allyCount(game, org, 7) : 0;

    if (org.behaviors.has('phototroph') && (org.depth || 0) === 0) {
      org.energy = Math.min(org.stats.energyMax, org.energy + 1.8 * dt);
      org.hunger = Math.max(0, org.hunger - 1.1 * dt);
    }
    if (org.behaviors.has('geothermal_gut') && (org.depth || 0) >= 3) {
      org.energy = Math.min(org.stats.energyMax, org.energy + 2.2 * dt);
      org.hunger = Math.max(0, org.hunger - 0.8 * dt);
    }
    if (org.behaviors.has('saltblood')) {
      org.thirst = Math.max(0, org.thirst - 0.35 * dt);
    }
    if (org.behaviors.has('molt') && !org.__molted && org.health < org.stats.health * 0.28) {
      org.__molted = true;
      org.health = Math.min(org.stats.health, org.health + org.stats.health * 0.45);
    }
    if (org.behaviors.has('spore_cloud') && org.state === 'FLEE' && !org.__sporeAt) {
      org.__sporeAt = game.simTime;
      org.__sporeX = org.x; org.__sporeY = org.y; org.__sporeD = org.depth || 0;
    }
    if (org.__sporeAt && game.simTime - org.__sporeAt < 5) {
      const near = game.world.grid.queryRadius(org.__sporeX, org.__sporeY, 4, []);
      for (const o of near) {
        if (!o.alive || o.ownerId === org.ownerId) continue;
        if ((o.depth || 0) !== org.__sporeD) continue;
        o.__stun = Math.max(o.__stun || 0, 0.4);
      }
    }
    if (org.behaviors.has('brood_care') && org.__allyN > 0) {
      const near = game.world.grid.queryRadius(org.x, org.y, 6, []);
      for (const o of near) {
        if (!o.alive || o.ownerId !== org.ownerId) continue;
        if (o.generation > 1 || o.age < 40) {
          o.health = Math.min(o.stats.health, o.health + o.stats.health * 0.03 * dt);
          if (o.reproCooldown > 0) o.reproCooldown -= 0.8 * dt;
        }
      }
    }
    if (org.behaviors.has('hive_mind') && org.__allyN > 0) {
      org.__hiveBonus = 1 + Math.min(0.4, org.__allyN * 0.08);
    } else org.__hiveBonus = 1;
    if (org.__stun > 0) org.__stun -= dt;
  }

  function onDeath(game, bus, org) {
    if (!org.behaviors) return;
    if (org.behaviors.has('split_clone') && org.ownerId === 'player' && Math.random() < 0.55) {
      if (game.organisms.length >= 220) return;
      const child = CM.organism.create({
        ownerId: org.ownerId,
        traits: org.traits.filter(id => id !== 'split_clone'),
        x: org.x + (Math.random() - 0.5), y: org.y + (Math.random() - 0.5),
        name: (org.name || 'Clone') + '-split',
        generation: (org.generation || 1) + 1,
        directive: org.directive
      });
      child.health = child.stats.health * 0.45;
      child.depth = org.depth || 0;
      CM.coremind.addOrganism(game, child);
      if (bus) {
        CM.discovery.pushEvent(game, bus, {
          kind: 'system', icon: '\u{1F9EC}',
          message: `${org.name} split — a weaker copy crawled free.`,
          x: child.x, y: child.y, orgId: child.id
        });
      }
    }
  }

  function onBirth(game, parent, child) {
    if (!parent.behaviors) return;
    if (parent.behaviors.has('caste_morph') && (parent.stats.digging || 0) > 8) {
      child.stats = Object.assign({}, child.stats, { digging: (child.stats.digging || 0) + 14 });
    }
    if (parent.behaviors.has('delayed_spawn')) {
      game.__eggs = game.__eggs || [];
      game.__eggs.push({
        at: game.simTime + 7, ownerId: parent.ownerId, traits: parent.traits.slice(),
        x: parent.x, y: parent.y, depth: parent.depth || 0,
        directive: parent.directive, name: (parent.name || 'Egg') + '-late'
      });
    }
    if (parent.behaviors.has('spore_cast')) {
      game.__eggs = game.__eggs || [];
      game.__eggs.push({
        at: game.simTime + 11, ownerId: parent.ownerId, traits: parent.traits.slice(),
        x: parent.x + (Math.random() - 0.5) * 4, y: parent.y + (Math.random() - 0.5) * 4,
        depth: parent.depth || 0, directive: parent.directive, name: (parent.name || 'Spore') + '-spore'
      });
    }
  }

  function tickEggs(game) {
    const eggs = game.__eggs;
    if (!eggs || !eggs.length) return;
    for (let i = eggs.length - 1; i >= 0; i--) {
      const e = eggs[i];
      if (game.simTime < e.at) continue;
      eggs.splice(i, 1);
      if (game.organisms.length >= 220) continue;
      const child = CM.organism.create({
        ownerId: e.ownerId, traits: e.traits, x: e.x, y: e.y,
        name: e.name, generation: 2, directive: e.directive
      });
      child.depth = e.depth || 0;
      child.health = child.stats.health * 0.7;
      CM.coremind.addOrganism(game, child);
    }
  }

  register();

  CM.mutations = {
    MUTATIONS, BY_ID, register, unlocked, unlock,
    allyCount, carryCap, moveMul, onMelee, tickOrg, onDeath, onBirth, tickEggs
  };
})(window.CM = window.CM || {});

      blurb: 'Walk Layer 1. Post bodies on the shaft. Finish two rooms. Let the hold fill.',
      hint: 'Stance: Settle. Garrison the shaft. The layer card is the checklist.',
      next: 'cut_descent'
    },
    cut_descent: {
      title: 'Cut the Descent',
      blurb: 'When the works are settled the galleries open. Cut down on purpose.',
      hint: 'Set Layer 1 stance to Push, then place a Descent.',
      next: 'feed_stack'
    },
    feed_stack: {
      title: 'Feed the Stack',
      blurb: 'A nursery or a fungarium is how the galleries live without the weather.',
      hint: 'Stance: Breed or Harvest on Layer 2. Place the role room.',
      next: 'hold_galleries'
    },
    hold_galleries: {
      title: 'Hold the Galleries',
      blurb: 'Settle Layer 2 before you chase heat. Post a redoubt if the rock answers.',
      hint: 'Stance: Fortify if fauna showed. Otherwise Settle until the card goes green.',
      next: 'tap_heat'
    },
    tap_heat: {
      title: 'Tap the Heat',
      blurb: 'The Well, then a geothermal tap or a vein. This is the first real engine.',
      hint: 'Push Layer 2, cut a Well, stance Harvest on Layer 3.',
      next: 'hold_and_post'
    },
    hold_and_post: {
      title: 'Hold and Post',
      blurb: 'Every deeper layer wants the same beat: role room, walk the ground, post a defense, then the next stair.',
      hint: 'Use stance per layer. Fortify 6 and 8. Harvest 4 and 7. The Gate waits on 9.',
      next: null
    }
  };

  const SIDE = {
    first_look: { title: 'Watch the Wild', blurb: 'Stand near a wild organism until a species is named.', hint: 'Explore. Sightings unlock the designer.' },
    first_sample: { title: 'Take a Sample', blurb: 'Kill something and extract what it leaves.', hint: 'Hunt, then tap the lime sample.' },
    design_one: { title: 'Design One', blurb: 'Open DNA and grow an organism with a discovered trait.', hint: 'ANALYZE shows what you have earned.' },
    post_two: { title: 'Post Two', blurb: 'Two of yours standing on a spine chamber.', hint: 'Select, Garrison the shaft or descent.' },
    fortify_door: { title: 'Fortify the Door', blurb: 'Fortify the Access Shaft before a climber uses it.', hint: 'Inspect the finished shaft → Fortify.' },
    raise_one: { title: 'Raise One', blurb: 'Upgrade a finished chamber. Rooms grow after they are cut.', hint: 'Inspect a finished warren → Raise.' },
    post_crew: { title: 'Post a Crew', blurb: 'Select organisms, inspect a chamber, assign them as its crew.', hint: 'They will dig, raise, or hold that room first.' },
    paint_district: { title: 'Paint a District', blurb: 'Cluster matching rooms until the layer card names a district.', hint: 'Two cisterns make water. Two redoubts make defense. Raise a room to push harder.' },
    first_thought: { title: 'Think', blurb: 'Issue an order. The speed chip reads THINK while you command.', hint: 'Select a unit, then issue a move or attack.' },
    read_weather: { title: 'Weather Map', blurb: 'Toggle Weather on the zone card to see hunger and combat heat.', hint: 'Zone card → Weather. Key U.' },
    peel_earth: { title: 'Go Underground', blurb: 'Open floor 1 after a shaft is finished.', hint: 'Tap 1 on the left floor stack.' },
    smell_dark: { title: 'Smell the Dark', blurb: 'A chemical-sensing organism names a body in the dark.', hint: 'Unlock Chemical Sensing. Turn Sense on. Walk the edge of vision.' }
  };

  function grant(game, bus, achId) {
    const P = game.progress;
    if (!P || P.achievements[achId]) return false;
    const ach = ACH_BY_ID[achId];
    if (!ach) return false;
    P.achievements[achId] = game.simTime || 1;
    const names = [];
    for (const mid of (ach.mutations || [])) {
      if (CM.mutations && CM.mutations.unlock(game, bus, mid, true)) names.push(CM.mutations.BY_ID[mid].name);
    }
    if (bus) {
      CM.discovery.pushEvent(game, bus, {
        kind: 'progress', icon: ach.icon,
        message: names.length
          ? `Achievement: ${ach.name}. Mutation${names.length > 1 ? 's' : ''} unlocked: ${names.join(', ')}.`
          : `Achievement: ${ach.name}.`,
        x: game.core && game.core.x, y: game.core && game.core.y
      });
    }
    return true;
  }

  function hasType(game, typeKey) {
    const S = CM.structures;
    return S.all(game).some(s => s.done && s.colonyId === 'player' && s.type === typeKey);
  }

  function evaluateAchievements(game, bus) {
    const P = game.progress;
    if (!P) return;
    const pop = (game.core && game.core.pop) || 0;
    if (P.drinks >= 1) grant(game, bus, 'first_drink');
    if (pop >= 6) grant(game, bus, 'first_band');
    if (P.gathered >= 80) grant(game, bus, 'first_stores');
    if (Object.keys(P.biomes).length >= 3) grant(game, bus, 'three_biomes');
    if (hasType(game, 'SHAFT')) grant(game, bus, 'first_shaft');
    const ev = game.climate && game.climate.event;
    if (ev && ev.key === 'HEATWAVE') grant(game, bus, 'feel_the_heat');
    if (CM.layers && game.core && CM.layers.layerReady(game, game.core, 1).ok && hasType(game, 'SHAFT')) {
      grant(game, bus, 'settle_shallow');
    }
    if (P.kills >= 1) grant(game, bus, 'first_blood');
    if (game.climate && game.climate.seasonIndex === 3 && game.simTime > 20) grant(game, bus, 'deep_cold');
    if (pop >= 10) grant(game, bus, 'a_people');
    if (P.gathered >= 40) grant(game, bus, 'sun_forage');
    if (ev && ev.key === 'COLD_SNAP' && ev.remaining < 2) grant(game, bus, 'cold_snap');
    if (P.ateDefended) grant(game, bus, 'bitter_meal');
    if (hasType(game, 'GEOTHERMAL') || hasType(game, 'WELL')) grant(game, bus, 'tap_the_well');
    if (P.wounded) grant(game, bus, 'first_wounds');
    if (P.poisoned) grant(game, bus, 'poisoned');
    if (P.nearDeath) grant(game, bus, 'near_death');
    if (P.flees >= 5) grant(game, bus, 'learned_to_run');
    if (hasType(game, 'REDOUBT') || hasType(game, 'BASTION') || hasType(game, 'CITADEL') || hasType(game, 'KEEP')) {
      grant(game, bus, 'first_redoubt');
    }
    if (P.kills >= 5) grant(game, bus, 'five_kills');
    if (P.extracts >= 1) grant(game, bus, 'first_extract');
    if (P.rivalKills >= 1) grant(game, bus, 'rival_blood');
    if (P.deepKills >= 1) grant(game, bus, 'deep_kill');
    if (P.designs >= 1) grant(game, bus, 'first_design');
    if (hasType(game, 'NURSERY')) grant(game, bus, 'first_nursery');
    if (P.births >= 3) grant(game, bus, 'three_births');
    if (CM.layers && game.core && CM.layers.layerReady(game, game.core, 4).ok && hasType(game, 'GALLERY')) {
      grant(game, bus, 'settle_spore');
    }
    if (hasType(game, 'DESCENT')) grant(game, bus, 'cut_descent');
    if (P.upgrades >= 1) grant(game, bus, 'first_upgrade');
    if (P.upgrades >= 3) grant(game, bus, 'three_upgrades');
    if (P.laborSet) grant(game, bus, 'labor_set');
    if (P.crewPosted) grant(game, bus, 'crew_posted');
    if (CM.influence && game.core) {
      for (let d = 1; d <= 9; d++) {
        if (CM.influence.layerDistrict(game, game.core.id, d)) {
          P.districts = 1;
          grant(game, bus, 'first_district');
          break;
        }
      }
    }
    if (P.thought) grant(game, bus, 'first_thought');
    if (P.readWeather) grant(game, bus, 'read_weather');
    if ((P.peelTime || 0) >= 8) grant(game, bus, 'peel_earth');
    if (P.smellDark) grant(game, bus, 'smell_dark');
  }

  /* Sightings before guide.startedAt (or 0.5s when unset/0) do not finish
   * first_look / the learn half of foothold. */
  function sightingCutoff(game) {
    return (game.guide && game.guide.startedAt) || 0.5;
  }

  function hasPostStartSighting(game) {
    const cut = sightingCutoff(game);
    const events = (game.discovery && game.discovery.events) || [];
    for (const e of events) {
      if (!e.speciesId) continue;
      if ((e.time == null ? 0 : e.time) >= cut) return true;
    }
    return false;
  }

  function questDone(game, id) {
    const P = game.progress;
    if (id === 'foothold') return CM.layers && game.core && CM.layers.surfaceReady(game, game.core).ok;
    if (id === 'sink_shaft') return hasType(game, 'SHAFT');
    if (id === 'cut_warren') return hasType(game, 'WARREN');
    if (id === 'hold_shallow') return CM.layers && game.core && CM.layers.layerReady(game, game.core, 1).ok;
    if (id === 'cut_descent') return hasType(game, 'DESCENT');
    if (id === 'feed_stack') return hasType(game, 'NURSERY') || hasType(game, 'FUNGARIUM');
    if (id === 'hold_galleries') return CM.layers && game.core && CM.layers.layerReady(game, game.core, 2).ok;
    if (id === 'tap_heat') return hasType(game, 'GEOTHERMAL') || hasType(game, 'VEINWORKS') || hasType(game, 'WELL');
    if (id === 'hold_and_post') return hasType(game, 'GATE');
    if (id === 'first_look') return hasPostStartSighting(game);
    if (id === 'first_sample') return P.extracts >= 1;
    if (id === 'design_one') return P.designs >= 1;
    if (id === 'post_two') {
      if (!CM.layers) return false;
      for (const s of CM.structures.all(game)) {
        if (!s.done || s.colonyId !== 'player' || !CM.layers.isSpine(s.type)) continue;
        if (CM.layers.hostilityAt(game, s).friends >= 2) return true;
      }
      return false;
    }
    if (id === 'fortify_door') {
      return CM.structures.all(game).some(s => s.type === 'SHAFT' && s.fortified && s.fortHp > 0 && s.colonyId === 'player');
    }
    if (id === 'raise_one') return P.upgrades >= 1;
    if (id === 'post_crew') return !!P.crewPosted;
    if (id === 'paint_district') return (P.districts || 0) >= 1;
    if (id === 'first_thought') return !!P.thought;
    if (id === 'read_weather') return !!P.readWeather;
    if (id === 'peel_earth') return (P.peelTime || 0) >= 8;
    if (id === 'smell_dark') return !!P.smellDark;
    return false;
  }

  function evaluateQuests(game, bus) {
    const P = game.progress;
    if (!P || !P.quests) return;
    const Q = P.quests;
    if (Q.active && QUESTS[Q.active] && questDone(game, Q.active)) {
      Q.done[Q.active] = game.simTime || 1;
      const spec = QUESTS[Q.active];
      const next = spec.next;
      if (bus) {
        CM.discovery.pushEvent(game, bus, {
          kind: 'system', icon: '\u{1F4CB}',
          message: next
            ? `Quest complete: ${spec.title}. Next — ${QUESTS[next].title}.`
            : `Quest complete: ${spec.title}. The rest of the descent is yours to pace.`,
          x: game.core && game.core.x, y: game.core && game.core.y
        });
      }
      if (game.core) {
        game.core.biomass = Math.min(game.core.biomassCap, game.core.biomass + 12);
        game.core.energy = Math.min(game.core.energyCap, game.core.energy + 8);
      }
      Q.active = next;
      if (next === 'sink_shaft') Q.side = ['first_look', 'first_sample', 'first_thought'];
      if (next === 'cut_warren') Q.side = ['design_one', 'post_two', 'raise_one', 'read_weather'];
      if (next === 'hold_shallow') Q.side = ['post_two', 'fortify_door', 'raise_one', 'peel_earth'];
      if (next === 'cut_descent') Q.side = ['fortify_door', 'post_crew', 'paint_district', 'smell_dark'];
      if (next === 'feed_stack') Q.side = ['post_crew', 'paint_district'];
    }
    const still = [];
    for (const sid of (Q.side || [])) {
      if (questDone(game, sid)) {
        Q.done[sid] = game.simTime || 1;
        if (bus && SIDE[sid]) {
          CM.discovery.pushEvent(game, bus, {
            kind: 'system', icon: '\u{1F4CB}',
            message: `Side quest: ${SIDE[sid].title} is done.`,
            x: game.core && game.core.x, y: game.core && game.core.y
          });
        }
      } else still.push(sid);
    }
    Q.side = still;
  }

  function note(game, kind, extra) {
    const P = game.progress;
    if (!P) return;
    if (kind === 'gather') P.gathered += extra || 0;
    else if (kind === 'drink') P.drinks += 1;
    else if (kind === 'kill') {
      P.kills += 1;
      if (extra === 'rival') P.rivalKills += 1;
      if (extra === 'deep') P.deepKills += 1;
    } else if (kind === 'birth') P.births += 1;
    else if (kind === 'design') P.designs += 1;
    else if (kind === 'extract') P.extracts += 1;
    else if (kind === 'flee') P.flees += 1;
    else if (kind === 'biome' && extra != null) P.biomes[extra] = true;
    else if (kind === 'wounded') P.wounded = true;
    else if (kind === 'nearDeath') P.nearDeath = true;
    else if (kind === 'poisoned') P.poisoned = true;
    else if (kind === 'ateDefended') P.ateDefended = true;
    else if (kind === 'upgrade') P.upgrades = (P.upgrades || 0) + 1;
    else if (kind === 'labor') P.laborSet = true;
    else if (kind === 'crew') P.crewPosted = true;
    else if (kind === 'district') P.districts = 1;
    else if (kind === 'thought') P.thought = true;
    else if (kind === 'weather') P.readWeather = true;
    else if (kind === 'peel') P.peelTime = (P.peelTime || 0) + (extra || 0);
    else if (kind === 'smell') P.smellDark = true;
  }

  function tick(game, bus, dt) {
    if (!game.progress) game.progress = newState();
    game.__progAcc = (game.__progAcc || 0) + dt;
    if (game.__progAcc < 0.8) return;
    game.__progAcc = 0;
    if (game.thought > 0.55 && ((game.selectedIds && game.selectedIds.length) || game.selection)) {
      note(game, 'thought');
    }
    if (game.peel !== false && (game.viewDepth || 0) >= 1) note(game, 'peel', 0.8);
    evaluateAchievements(game, bus);
    evaluateQuests(game, bus);
  }

  function activeQuest(game) {
    const id = game.progress && game.progress.quests && game.progress.quests.active;
    if (!id || !QUESTS[id]) return null;
    return Object.assign({ id }, QUESTS[id]);
  }

  function sideQuests(game) {
    const ids = (game.progress && game.progress.quests && game.progress.quests.side) || [];
    return ids.map(id => SIDE[id] && Object.assign({ id }, SIDE[id])).filter(Boolean);
  }

  CM.progress = {
    newState, ACHIEVEMENTS, ACH_BY_ID, QUESTS, SIDE,
    grant, note, tick, activeQuest, sideQuests, evaluateAchievements, evaluateQuests,
    questDone
  };
})(window.CM = window.CM || {});

</script>
<script>
/* Coremind — flora. Plants are not one undifferentiated "food" number: each
 * biome grows particular species, and those species differ in how much they
 * feed a grazer, how fast they come back, and how hard they fight back.
 *
 * Defended plants are what make herbivory a design problem rather than a
 * formality — and they are a discovery source in their own right, since an
 * organism poisoned by a toxin has observed a real chemical defense.
 */
(function (CM) {
  'use strict';
  const K = CM.core;

  /* Ids are indices into this array and are written into a Uint8Array per
   * cell, so this list is append-only. 0 is reserved for "nothing grows". */
  const PLANTS = [
    { id: 0, key: 'none', name: 'Barren', nutrition: 0, regrowth: 0, toxicity: 0, thorns: 0,
      color: [0, 0, 0], biomes: [] },

    { id: 1, key: 'grass', name: 'Meadow Grass', nutrition: 1, regrowth: 0.022, toxicity: 0, thorns: 0,
      color: [122, 168, 74],
      biomes: ['GRASSLAND', 'SAVANNA'] },

    { id: 2, key: 'fernbed', name: 'Fernbed', nutrition: 1.25, regrowth: 0.016, toxicity: 0, thorns: 0,
      color: [76, 136, 78],
      biomes: ['FOREST', 'TAIGA'] },

    { id: 3, key: 'bitterleaf', name: 'Bitterleaf', nutrition: 1.5, regrowth: 0.014, toxicity: 0.55, thorns: 0,
      color: [110, 154, 196],
      biomes: ['FOREST', 'JUNGLE', 'MARSH'] },

    { id: 4, key: 'thornscrub', name: 'Thornscrub', nutrition: 1.7, regrowth: 0.011, toxicity: 0, thorns: 0.6,
      color: [150, 126, 66],
      biomes: ['SAVANNA', 'DESERT', 'ROCK'] },

    { id: 5, key: 'succulent', name: 'Water Succulent', nutrition: 1.1, regrowth: 0.008, toxicity: 0, thorns: 0.25,
      // The desert's compromise: feeds badly, but drinking from it is the
      // difference between crossing a waste and dying in it.
      water: 26,
      color: [128, 176, 140],
      biomes: ['DESERT', 'BEACH'] },

    { id: 6, key: 'canopy_fruit', name: 'Canopy Fruit', nutrition: 2.4, regrowth: 0.013, toxicity: 0, thorns: 0,
      color: [206, 138, 74],
      biomes: ['JUNGLE'] },

    { id: 7, key: 'bloodcap', name: 'Bloodcap Fungus', nutrition: 2.0, regrowth: 0.02, toxicity: 0.85, thorns: 0,
      color: [172, 66, 74],
      biomes: ['MARSH', 'JUNGLE', 'TAIGA'] },

    { id: 8, key: 'lichen', name: 'Frost Lichen', nutrition: 0.8, regrowth: 0.006, toxicity: 0, thorns: 0,
      color: [168, 180, 168],
      biomes: ['TUNDRA', 'ICE', 'MOUNTAIN'] },

    { id: 9, key: 'reedmat', name: 'Reed Mat', nutrition: 1.15, regrowth: 0.026, toxicity: 0, thorns: 0,
      water: 14,
      color: [96, 148, 104],
      biomes: ['MARSH', 'SHALLOWS'] }
  ];

  const BY_ID = PLANTS;
  const BY_KEY = {};
  for (const p of PLANTS) BY_KEY[p.key] = p;

  // biome key -> candidate plant ids, built once
  const BY_BIOME = {};
  for (const p of PLANTS) {
    for (const b of p.biomes) (BY_BIOME[b] || (BY_BIOME[b] = [])).push(p.id);
  }

  function get(id) { return BY_ID[id] || BY_ID[0]; }
  function regrowthRate(id) { return (BY_ID[id] || BY_ID[0]).regrowth; }
  function isDefended(id) { const p = get(id); return p.toxicity > 0 || p.thorns > 0; }

  /* Assign a plant species and a food capacity to every cell. Which of a
   * biome's candidate species grows where is driven by low-frequency noise,
   * so species form patches a player can actually learn the shape of rather
   * than salt-and-pepper randomness. */
  function populate(world, seed) {
    const W = CM.world;
    const n = world.size * world.size;
    for (let y = 0; y < world.size; y++) {
      for (let x = 0; x < world.size; x++) {
        const i = W.idx(x, y);
        const info = W.BIOME_INFO[world.biome[i]];
        const candidates = BY_BIOME[info.key];
        if (!candidates || !candidates.length || info.foodCap <= 0) {
          world.flora[i] = 0; world.foodCap[i] = 0; world.food[i] = 0;
          continue;
        }
        // fbm rather than a single noise2 octave: raw value noise is
        // axis-aligned and paints visible vertical banding into the terrain.
        const pick = K.clamp01(K.fbm(seed + 9100, x * 0.045, y * 0.045, 3));
        const plant = candidates[Math.min(candidates.length - 1, Math.floor(pick * candidates.length))];
        world.flora[i] = plant;

        // Capacity blends the biome's ceiling with local moisture/warmth, so
        // the same biome is richer in its wetter, milder parts.
        const m = world.moisture[i];
        const t = K.clamp01(K.invLerp(-8, 30, world.temp[i]));
        const quality = 0.45 + m * 0.35 + t * 0.2;
        const cap = info.foodCap * quality;
        world.foodCap[i] = cap;
        world.food[i] = cap * (0.45 + 0.55 * K.clamp01(K.fbm(seed + 5000, x * 0.09, y * 0.09, 3)));
      }
    }
  }

  /* What eating one mouthful of this plant does. Nutrition scales the food
   * value; toxin and thorn damage are returned separately so the caller can
   * decide who resists them — that is where traits get to matter. */
  function biteOutcome(plantId, eater, amount) {
    const p = get(plantId);
    const food = amount * p.nutrition;
    let toxin = 0, physical = 0;
    if (p.toxicity > 0) {
      // Venom-producing organisms have the biochemistry to handle toxins;
      // this is the payoff for a trait that otherwise only does damage.
      const resist = eater.behaviors && eater.behaviors.has('damage_over_time') ? 0.25 : 1;
      toxin = p.toxicity * amount * 0.12 * resist;
    }
    if (p.thorns > 0) {
      // Armor is literally for this.
      const armor = K.clamp01((eater.stats.armor || 0) / 40);
      physical = p.thorns * amount * 0.10 * (1 - armor);
    }
    return { food, toxin, physical, water: (p.water || 0) * (amount / 16) };
  }

  CM.flora = {
    PLANTS, BY_KEY, get, regrowthRate, isDefended, populate, biteOutcome
  };
})(window.CM = window.CM || {});
