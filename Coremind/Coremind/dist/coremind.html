<script>
/* Coremind — DISCOVER -> ANALYZE -> EXTRACT.
 *
 * Traits are never unlocked by a level-up; they're earned by watching wild
 * organisms use them. Every encounter between a player organism and a wild
 * one leaves partial evidence; killing a wild organism leaves a biological
 * sample the player can walk up to and extract for a much bigger dose of
 * evidence. Once a trait has enough evidence behind it, it becomes available
 * in the genome designer.
 */
(function (CM) {
  'use strict';

  const OBSERVATION_THRESHOLD = 4;
  const EXTRACT_CREDIT = 3;
  const ENCOUNTER_CREDIT = 1;
  const SAMPLE_TTL = 180; // seconds of sim time before an unclaimed sample decays

  function newDiscoveryState() {
    return {
      events: [],
      nextEventId: 1,
      observations: {},     // traitId -> count
      discoveredTraits: {},  // traitId -> true
      knownSpecies: {},      // speciesId -> true
      samples: []            // {id, x, y, speciesId, traits, name, ttl}
    };
  }

  function pushEvent(game, bus, evt) {
    const e = Object.assign({
      id: 'evt_' + (game.discovery.nextEventId++),
      time: game.simTime,
      read: false
    }, evt);
    game.discovery.events.unshift(e);
    if (game.discovery.events.length > 200) game.discovery.events.length = 200;
    bus.emit('event', e);
    return e;
  }

  function recordSighting(game, bus, speciesId, x, y) {
    const D = game.discovery;
    if (D.knownSpecies[speciesId]) return;
    D.knownSpecies[speciesId] = true;
    if (CM.economy) CM.economy.onSight(game, speciesId, { ownerId: 'player' });
    const sp = CM.traits.WILD_BY_ID[speciesId];
    pushEvent(game, bus, {
      kind: 'discovery', icon: sp && sp.tier === 'predator' ? '\u{1F439}' : '\u{1F43F}',
      message: `Your organism discovered a new ${sp ? sp.tier : 'species'}: ${sp ? sp.name : speciesId}.`,
      x, y, speciesId
    });
  }

  /* Watching counts as research.
   *
   * Discovery used to fire only from `resolveDeath`, which meant credit
   * existed on exactly two paths: your organism killed something, or
   * something killed your organism. A colony on GATHER does neither — and
   * GATHER is the opening directive — so a measured 1400 sim-seconds of
   * ordinary play produced an entirely empty observation ledger and not one
   * discovery. The brief's own loop starts with organisms *encountering*
   * species, so proximity has to be worth something.
   *
   * Only traits with an outward visual signature can be learned this way: a
   * shell or a set of claws is visible from across a meadow, but nothing
   * about standing near an animal reveals its biochemistry. Those still need
   * a fight or a sample, which is what keeps EXTRACT worth doing. */
  const SIGHTING_RATE = 0.05;     // credit per second of sustained proximity

  function observeNearby(game, bus, observer, targets, dt) {
    if (observer.ownerId !== 'player') return;   // only the player runs a lab
    for (const target of targets) {
      for (const traitId of target.traits) {
        const trait = CM.traits.TRAITS_BY_ID[traitId];
        if (!trait || !trait.visual_modifier) continue;
        const mul = CM.economy ? CM.economy.observeMul(game) : 1;
        creditTrait(game, bus, traitId, SIGHTING_RATE * dt * mul);
      }
    }
  }

  function creditTrait(game, bus, traitId, amount) {
    const D = game.discovery;
    if (D.discoveredTraits[traitId]) return;
    D.observations[traitId] = (D.observations[traitId] || 0) + amount;
    if (D.observations[traitId] >= OBSERVATION_THRESHOLD) {
      D.discoveredTraits[traitId] = true;
      const t = CM.traits.TRAITS_BY_ID[traitId];
      pushEvent(game, bus, {
        kind: 'discovery', icon: '\u{1F9EC}',
        message: `Biological discovery: ${t.name.toUpperCase()} can now be designed into your organisms.`,
        traitId
      });
    }
  }

  /* What the Coremind can say about an organism from watching it fight —
   * the raw material of the OBSERVATION report below. Both read the
   * organism's real traits, so the report can never describe a creature
   * that isn't the one that was actually there. */
  const DAMAGE_TYPES = { venom: 'Neurotoxic', acid: 'Corrosive', claws: 'Physical (lacerating)', bite: 'Physical (crushing)' };
  const DEFENSE_NOTES = { armor: 'Heavy external shell', camouflage: 'Adaptive colouration', regeneration: 'Rapid tissue repair', burrowing: 'Subterranean evasion' };

  function observedDamageType(org) {
    for (const id of org.traits) if (DAMAGE_TYPES[id]) return DAMAGE_TYPES[id];
    return 'Physical (blunt)';
  }
  function observedDefense(org) {
    for (const id of org.traits) if (DEFENSE_NOTES[id]) return DEFENSE_NOTES[id];
    return 'None apparent';
  }

  /* outcome: 'player_killed' | 'wild_killed' | 'player_fled' | 'wild_fled' */
  function recordEncounter(game, bus, playerOrg, wildOrg, outcome, x, y) {
    recordSighting(game, bus, wildOrg.speciesId, x, y);
    for (const traitId of wildOrg.traits) {
      const t = CM.traits.TRAITS_BY_ID[traitId];
      if (!t) continue;
      const relevant = (outcome === 'player_killed' && (t.category === 'OFFENSE'))
        || (outcome === 'wild_killed' && (t.category === 'DEFENSE'))
        || t.category === 'SENSE' || t.category === 'BODY' || t.category === 'METABOLISM' || t.category === 'REPRODUCTION';
      if (relevant) creditTrait(game, bus, traitId, ENCOUNTER_CREDIT);
    }
    if (outcome === 'player_killed') {
      const identified = !!game.discovery.knownSpecies[wildOrg.speciesId];
      pushEvent(game, bus, {
        kind: 'death', icon: '☠',
        message: `${identified ? wildOrg.name : 'An unknown predator'} killed ${playerOrg.name}.`,
        // The report the player opens to work out what to build next. It is
        // the same data the trait ledger is accumulating, shown in plain
        // language at the moment it was earned.
        observation: {
          damageType: observedDamageType(wildOrg),
          defense: observedDefense(wildOrg),
          species: identified ? wildOrg.name : 'Unidentified'
        },
        x, y, orgId: playerOrg.id, speciesId: wildOrg.speciesId
      });
    }
  }

  function spawnSample(game, world, x, y, wildOrg) {
    const D = game.discovery;
    const sample = {
      id: 'sample_' + (game.discovery.nextEventId++),
      x, y, speciesId: wildOrg.speciesId, traits: wildOrg.traits.slice(),
      name: wildOrg.name, ttl: SAMPLE_TTL
    };
    D.samples.push(sample);
    return sample;
  }

  function tickSamples(game, dt) {
    const D = game.discovery;
    for (let i = D.samples.length - 1; i >= 0; i--) {
      D.samples[i].ttl -= dt;
      if (D.samples[i].ttl <= 0) D.samples.splice(i, 1);
    }
  }

  function extractSample(game, bus, sampleId) {
    const D = game.discovery;
    const i = D.samples.findIndex(s => s.id === sampleId);
    if (i < 0) return false;
    const sample = D.samples[i];
    D.samples.splice(i, 1);
    if (CM.progress) CM.progress.note(game, 'extract');
    if (CM.economy) CM.economy.onExtract(game, sample);
    if (CM.life) CM.life.grantActors(game, 'extract', 6, sample.x, sample.y);
    for (const traitId of sample.traits) creditTrait(game, bus, traitId, EXTRACT_CREDIT);
    pushEvent(game, bus, {
      kind: 'analysis', icon: '\u{1F52C}',
      message: `Extracted a biological sample from ${sample.name}.`,
      x: sample.x, y: sample.y
    });
    return true;
  }

  function observationProgress(game, traitId) {
    return Math.min(1, (game.discovery.observations[traitId] || 0) / OBSERVATION_THRESHOLD);
  }

  /* Every trait the Coremind has partial evidence for but hasn't identified
   * yet — the research backlog the ANALYZE tab renders, so progress toward a
   * discovery is visible while it accumulates instead of only at the moment
   * it completes. */
  function researchInProgress(game) {
    const out = [];
    for (const traitId in game.discovery.observations) {
      if (game.discovery.discoveredTraits[traitId]) continue;
      const trait = CM.traits.TRAITS_BY_ID[traitId];
      if (!trait) continue;
      out.push({
        traitId, trait,
        observations: game.discovery.observations[traitId],
        needed: OBSERVATION_THRESHOLD,
        progress: observationProgress(game, traitId)
      });
    }
    return out.sort((a, b) => b.progress - a.progress);
  }

  CM.discovery = {
    OBSERVATION_THRESHOLD, newDiscoveryState, pushEvent, recordSighting,
    recordEncounter, spawnSample, tickSamples, extractSample, observationProgress, observeNearby,
    SIGHTING_RATE,
    researchInProgress, observedDamageType, observedDefense
  };
})(window.CM = window.CM || {});

</script>
<script>
/* Coremind — climate. A season cycle plus occasional weather events shift
 * the whole map's temperature and plant growth over a session.
 *
 * This exists so that a design that was correct an hour ago can stop being
 * correct: a cold snap punishes a colony bred entirely for heat, a drought
 * turns a comfortable grassland into a contested one. It is the engine's
 * main source of "a new ecological problem emerges" without scripting one.
 */
(function (CM) {
  'use strict';
  const K = CM.core;

  const SEASON_LENGTH = 260;                   // sim-seconds per season
  const SEASONS = ['Thaw', 'High Sun', 'Fade', 'Deep Cold'];
  const SEASON_TEMP = [2, 9, 0, -9];           // degrees added to the whole map
  const SEASON_GROWTH = [1.15, 1.0, 0.85, 0.55];

  const EVENTS = {
    DROUGHT:   { key: 'DROUGHT',   name: 'Drought',    temp: 5,   growth: 0.25, minDur: 90, maxDur: 200,
                 icon: '\u{1F525}', message: 'A drought has set in — plant growth is collapsing.' },
    RAINS:     { key: 'RAINS',     name: 'Rains',      temp: -2,  growth: 1.9,  minDur: 70, maxDur: 150,
                 icon: '\u{1F327}', message: 'Heavy rains — the land is growing back fast.' },
    COLD_SNAP: { key: 'COLD_SNAP', name: 'Cold Snap',  temp: -14, growth: 0.6,  minDur: 60, maxDur: 130,
                 icon: '\u{2744}',  message: 'A cold snap is sweeping the region.' },
    HEATWAVE:  { key: 'HEATWAVE',  name: 'Heatwave',   temp: 13,  growth: 0.7,  minDur: 60, maxDur: 130,
                 icon: '\u{1F321}', message: 'A heatwave is pushing temperatures past what most life tolerates.' }
  };
  const EVENT_KEYS = Object.keys(EVENTS);

  function newState(seed) {
    const rng = K.rngFrom((seed || 1) ^ 0xC11E);
    return {
      rngSeed: (seed ^ 0x7f4a7c15) >>> 0,
      seasonIndex: 0,
      seasonTimer: 0,
      event: null,          // {key, remaining}
      nextEventIn: 80 + rng() * 80
    };
  }

  function seasonName(state) { return SEASONS[state.seasonIndex]; }

  function nextRand(c) {
    let s = (c.rngSeed || 1) >>> 0;
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    c.rngSeed = s;
    return s / 4294967296;
  }

  /* The two numbers the rest of the simulation actually reads:
   *   world.climateOffset — degrees added to every temperature lookup
   *   world.growthScale   — multiplier on plant regrowth
   * Keeping it to exactly two channels is deliberate: every system that
   * cares about weather already cares about temperature or food, and a
   * third channel would mean auditing all of them again. */
  function apply(game) {
    const c = game.climate;
    const season = c.seasonIndex;
    let temp = SEASON_TEMP[season];
    let growth = SEASON_GROWTH[season];
    if (c.event) {
      const info = EVENTS[c.event.key];
      temp += info.temp;
      growth *= info.growth;
    }
    game.world.climateOffset = temp;
    game.world.growthScale = growth;
  }

  function tick(game, bus, dt) {
    const c = game.climate;
    if (!c) return;

    c.seasonTimer += dt;
    if (c.seasonTimer >= SEASON_LENGTH) {
      c.seasonTimer -= SEASON_LENGTH;
      c.seasonIndex = (c.seasonIndex + 1) % SEASONS.length;
      CM.discovery.pushEvent(game, bus, {
        kind: 'climate', icon: '\u{1F5D3}',
        message: `The season turns: ${SEASONS[c.seasonIndex]}.`
      });
    }

    if (c.event) {
      c.event.remaining -= dt;
      if (c.event.remaining <= 0) {
        const ended = EVENTS[c.event.key];
        c.event = null;
        c.nextEventIn = 200 + nextRand(c) * 320;
        CM.discovery.pushEvent(game, bus, {
          kind: 'climate', icon: '\u{1F324}',
          message: `The ${ended.name.toLowerCase()} has broken.`
        });
        if (CM.life) CM.life.onClimateEnd(game);
      }
    } else {
      c.nextEventIn -= dt;
      if (c.nextEventIn <= 0) {
        // Weight the roll by season, so a drought in Deep Cold is unlikely
        // and a cold snap in High Sun is a genuine surprise rather than noise.
        const key = rollEvent(c.seasonIndex, nextRand(c));
        const info = EVENTS[key];
        c.event = { key, remaining: info.minDur + nextRand(c) * (info.maxDur - info.minDur) };
        CM.discovery.pushEvent(game, bus, {
          kind: 'warn', icon: info.icon, message: info.message
        });
      }
    }

    apply(game);
  }

  function rollEvent(seasonIndex, roll01) {
    const weights = {
      DROUGHT:   [0.8, 1.8, 0.9, 0.15],
      RAINS:     [1.5, 0.9, 1.4, 0.5],
      COLD_SNAP: [0.9, 0.2, 1.0, 1.9],
      HEATWAVE:  [0.5, 1.9, 0.6, 0.1]
    };
    let total = 0;
    for (const k of EVENT_KEYS) total += weights[k][seasonIndex];
    let roll = (roll01 == null ? Math.random() : roll01) * total;
    for (const k of EVENT_KEYS) {
      roll -= weights[k][seasonIndex];
      if (roll <= 0) return k;
    }
    return EVENT_KEYS[0];
  }

  function describe(game) {
    const c = game.climate;
    if (!c) return '';
    const season = SEASONS[c.seasonIndex];
    if (!c.event) return season;
    return `${season} · ${EVENTS[c.event.key].name}`;
  }

  CM.climate = { SEASONS, SEASON_LENGTH, EVENTS, newState, seasonName, tick, apply, describe };
})(window.CM = window.CM || {});

</script>
<script>
/* Coremind — colonies. The player is one Coremind among several.
 *
 * A rival is not a spawner with a hostile flag: it runs the same loop the
 * player does. It gathers biomass, accumulates observations of what it has
 * fought, unlocks traits from those observations, designs an organism against
 * the pressures it can actually perceive near its own Core, deploys it, and
 * changes its mind when the design fails. The player's advantage is judgement,
 * not information.
 *
 * `game.colonies[0]` is always the player, and `game.core` aliases it, so the
 * rest of the simulation can keep treating "the Core" as one object.
 */
(function (CM) {
  'use strict';
  const K = CM.core;
  const T = CM.traits;
  const W = CM.world;

  const PLAYER_ID = 'player';
  const WILD_ID = 'wild';

  /* Strategy archetypes. These are weights, not scripts — two colonies with
   * the same strategy on different ground still end up with different
   * organisms, because the design scorer reads local conditions. */
  const STRATEGIES = {
    EXPANSIONIST: {
      key: 'EXPANSIONIST', label: 'Expansionist',
      blurb: 'Spreads fast and thin, claiming ground before it can be contested.',
      deployRate: 0.72, aggression: 0.4, expansion: 1.5, defense: 0.6,
      favor: { BODY: 1.5, SENSE: 1.2, METABOLISM: 1.3, DEFENSE: 0.6, OFFENSE: 0.8, REPRODUCTION: 1.6 },
      directiveMix: { EXPLORE: 0.4, GATHER: 0.4, HUNT: 0.1, DEFEND: 0.1 }
    },
    ENTRENCHED: {
      key: 'ENTRENCHED', label: 'Entrenched',
      blurb: 'Builds heavy, slow organisms and refuses to yield ground near its Core.',
      deployRate: 0.5, aggression: 0.2, expansion: 0.4, defense: 1.8,
      favor: { BODY: 0.7, SENSE: 0.9, METABOLISM: 1.1, DEFENSE: 2.0, OFFENSE: 1.1, REPRODUCTION: 0.7 },
      directiveMix: { EXPLORE: 0.15, GATHER: 0.4, HUNT: 0.05, DEFEND: 0.4 }
    },
    PREDATORY: {
      key: 'PREDATORY', label: 'Predatory',
      blurb: 'Feeds by killing. Treats neighbours as a food source.',
      deployRate: 0.62, aggression: 1.6, expansion: 0.9, defense: 0.7,
      favor: { BODY: 1.2, SENSE: 1.3, METABOLISM: 0.9, DEFENSE: 0.8, OFFENSE: 2.1, REPRODUCTION: 0.8 },
      directiveMix: { EXPLORE: 0.2, GATHER: 0.2, HUNT: 0.55, DEFEND: 0.05 }
    },
    ADAPTIVE: {
      key: 'ADAPTIVE', label: 'Adaptive',
      blurb: 'Slow to commit, but rebuilds its organisms around whatever is killing them.',
      deployRate: 0.55, aggression: 0.7, expansion: 0.9, defense: 1.1,
      favor: { BODY: 1.1, SENSE: 1.5, METABOLISM: 1.4, DEFENSE: 1.2, OFFENSE: 1.1, REPRODUCTION: 1.0 },
      directiveMix: { EXPLORE: 0.3, GATHER: 0.35, HUNT: 0.2, DEFEND: 0.15 }
    }
  };
  const STRATEGY_KEYS = Object.keys(STRATEGIES);

  const RIVAL_NAMES = ['Thren', 'Ossuary', 'Kel-Var', 'Sable Choir', 'Meridian', 'Umbral Host', 'Cassiel'];
  const RIVAL_COLORS = ['#e0714f', '#a26bd6', '#4fa9e0', '#d6b34f', '#5fd67f', '#d64f9e'];

  const DEPLOY_INTERVAL = 11;      // sim-seconds between deploy decisions
  const REDESIGN_INTERVAL = 46;    // how often a rival reconsiders its genome
  /* A Core can only hold so much living matter. Without a ceiling, income
   * scales with population while nothing scales against it, biomass runs to
   * five figures, and every design cost becomes a rounding error — the
   * genome designer stops being a decision at all. Capping storage makes
   * hoarding pointless and spending the obvious move. */
  const BIOMASS_CAP = 500, ENERGY_CAP = 500;
  const TERR_CELL = 8;             // world cells per territory cell
  const TERR_SIZE = 32;            // 32*8 = 256

  function newColony(opts) {
    return {
      id: opts.id,
      name: opts.name,
      isPlayer: !!opts.isPlayer,
      x: opts.x, y: opts.y,
      radius: 7,
      biomass: opts.biomass != null ? opts.biomass : 60,
      energy: opts.energy != null ? opts.energy : 55,
      biomassCap: BIOMASS_CAP,
      energyCap: ENERGY_CAP,
      color: opts.color || '#8bac0f',
      strategyKey: opts.strategyKey || 'ADAPTIVE',
      alive: true,
      integrity: 100,                 // Core health; rivals collapse at 0
      // Rivals run their own discovery ledger — they know what they have met,
      // not what the player has met.
      observations: {},
      discovered: Object.assign({}, opts.discovered || {}),
      currentDesign: null,            // {BODY, SENSE, ...}
      designGeneration: 1,
      deployTimer: Math.random() * DEPLOY_INTERVAL,
      redesignTimer: Math.random() * REDESIGN_INTERVAL,
      losses: 0, kills: 0, deployed: 0,
      lastLossCause: null,            // drives ADAPTIVE redesign
      pop: 0,
      standing: {}                    // colonyId -> -1..1 (negative = hostile)
    };
  }

  function strategyOf(colony) { return STRATEGIES[colony.strategyKey] || STRATEGIES.ADAPTIVE; }

  /* Place the player plus `rivalCount` rivals, each on its own viable site. */
  function createAll(game, rivalCount) {
    const world = game.world;
    const rng = K.rngFrom(world.seed ^ 0x1b873593);
    const taken = [{ x: world.coreSpawn.x, y: world.coreSpawn.y }];

    const player = newColony({
      id: PLAYER_ID, name: 'Coremind', isPlayer: true,
      x: world.coreSpawn.x, y: world.coreSpawn.y, color: '#8bac0f'
    });
    const colonies = [player];

    for (let i = 0; i < rivalCount; i++) {
      const site = W.findColonySite(world, rng, taken);
      taken.push(site);
      const strategyKey = STRATEGY_KEYS[Math.floor(rng() * STRATEGY_KEYS.length)];
      const rival = newColony({
        id: 'rival_' + (i + 1),
        name: RIVAL_NAMES[Math.floor(rng() * RIVAL_NAMES.length)] + ' ' + romanNumeral(i + 1),
        x: site.x, y: site.y,
        color: RIVAL_COLORS[i % RIVAL_COLORS.length],
        strategyKey,
        biomass: 70, energy: 60,
        // A rival starts knowing a little, so it is a going concern from the
        // first minute rather than a colony of blank starter organisms.
        discovered: seedKnowledge(rng, strategyKey)
      });
      rival.awakenAt = RIVAL_WAKE_BASE + i * RIVAL_WAKE_STAGGER;
      rival.announced = false;
      rival.currentDesign = chooseDesign(game, rival);
      colonies.push(rival);
    }

    game.colonies = colonies;
    game.coloniesById = {};
    for (const c of colonies) game.coloniesById[c.id] = c;
    game.core = player;

    // pairwise standing, mildly hostile by default
    for (const a of colonies) {
      for (const b of colonies) {
        if (a.id !== b.id) a.standing[b.id] = -0.25;
      }
    }
    initTerritory(game);
    return colonies;
  }

  function romanNumeral(n) { return ['I', 'II', 'III', 'IV', 'V', 'VI'][n - 1] || String(n); }

  function seedKnowledge(rng, strategyKey) {
    const base = { basic_legs: true, bite: true };
    const extras = {
      EXPANSIONIST: ['vision', 'prolific_broodsac'],
      ENTRENCHED: ['armor', 'regeneration'],
      PREDATORY: ['claws', 'fast_movement'],
      ADAPTIVE: ['chem_sense', 'efficient_metabolism']
    }[strategyKey] || [];
    for (const id of extras) base[id] = true;
    // plus one wildcard, so two colonies of the same strategy still differ
    const all = T.TRAITS.map(t => t.id);
    base[all[Math.floor(rng() * all.length)]] = true;
    return base;
  }

  // --- rival design ---------------------------------------------------------
  /* Score every discovered trait against the strategy's preferences and the
   * conditions the colony can actually observe around its own Core, then take
   * the best legal trait per slot. This is why a rival on an ice sheet builds
   * differently from the same strategy on a savanna. */
  function chooseDesign(game, colony) {
    const strategy = strategyOf(colony);
    const world = game.world;
    const localTemp = W.tempAt(world, colony.x, colony.y);
    const localWater = W.findNearestWater(world, colony.x, colony.y, 26) ? 1 : 0;
    const threat = perceivedThreat(game, colony);

    const draft = {};
    for (const cat of T.CATEGORIES) {
      let best = null, bestScore = 0;
      for (const trait of T.TRAITS_BY_CATEGORY[cat]) {
        if (!colony.discovered[trait.id]) continue;
        if (T.conflictsWith(Object.values(draft), trait.id)) continue;

        let score = strategy.favor[cat] || 1;
        const mods = trait.stat_modifiers;

        // environmental fit
        if (trait.id === 'cold_resistance') score *= localTemp < 8 ? 3.2 : 0.25;
        if (trait.id === 'heat_resistance') score *= localTemp > 27 ? 3.2 : 0.25;
        if (trait.id === 'efficient_metabolism') score *= localWater ? 1.1 : 1.9;
        if (mods.water_requirement) score *= localWater ? 1 : (mods.water_requirement < 0 ? 1.8 : 0.5);

        // pressure fit: something is killing us, build against it
        if (threat > 0.5 && (cat === 'DEFENSE' || cat === 'OFFENSE')) score *= 1 + threat;
        if (colony.lastLossCause === 'combat' && cat === 'DEFENSE') score *= 1.6;
        if (colony.lastLossCause === 'starved' && trait.id === 'efficient_metabolism') score *= 2.2;
        if (colony.lastLossCause === 'thirst' && mods.water_requirement < 0) score *= 2.4;
        if (colony.lastLossCause === 'cold' && trait.id === 'cold_resistance') score *= 2.6;
        if (colony.lastLossCause === 'heat' && trait.id === 'heat_resistance') score *= 2.6;

        // synergy with what is already slotted
        const withDraft = Object.values(draft).concat([trait.id]);
        score *= 1 + T.checkCombination(withDraft).synergies.length * 0.35;

        // cheaper traits are more attractive when poor
        const afford = colony.biomass / Math.max(1, trait.biomass_cost * 4);
        score *= K.clamp(afford, 0.35, 1.4);

        score *= 0.9 + Math.random() * 0.2;   // keep colonies from converging

        /* Incumbency bonus. The jitter above exists so two colonies don't
         * converge on identical genomes, but without stickiness it also makes
         * a colony flip between two near-equal designs every single review —
         * which reads in the feed as an intelligence that cannot make up its
         * mind, and churns the announcement channel. A design has to be
         * clearly better to displace the one already in service. */
        if (colony.currentDesign && colony.currentDesign[cat] === trait.id) score *= 1.35;

        if (score > bestScore) { bestScore = score; best = trait.id; }
      }
      // Leaving a slot empty is a legitimate choice: it is cheaper, and a
      // colony that fills every slot on principle deploys half as often.
      if (best && bestScore > 0.75) draft[cat] = best;
    }
    for (const cat of T.CATEGORIES) if (!draft[cat]) draft[cat] = null;
    return draft;
  }

  function designTraitIds(design) {
    return design ? T.CATEGORIES.map(c => design[c]).filter(Boolean) : [];
  }

  /* How dangerous the colony's surroundings look right now, 0..1+. Read from
   * the same spatial grid everything else uses. */
  function perceivedThreat(game, colony) {
    const near = game.world.grid.queryRadius(colony.x, colony.y, 32, []);
    let hostile = 0;
    for (const o of near) {
      if (!o.alive) continue;
      if (o.ownerId === colony.id) continue;
      if (o.ownerId === WILD_ID) {
        const sp = T.WILD_BY_ID[o.speciesId];
        if (sp && sp.tier === 'predator') hostile += 0.5;
      } else hostile += 1;
    }
    return K.clamp01(hostile / 12) + (colony.losses > 4 ? 0.3 : 0);
  }

  // --- rival economy + deployment ------------------------------------------
  function tick(game, bus, dt) {
    if (!game.colonies) return;
    for (const colony of game.colonies) {
      if (colony.isPlayer || !colony.alive) continue;
      if (!isAwake(colony, game.simTime)) continue;
      if (!colony.announced) {
        colony.announced = true;
        CM.discovery.pushEvent(game, bus, {
          kind: 'rival', icon: '\u{1F4E1}',
          message: `Another Coremind has become active: ${colony.name}. Doctrine reads as ${strategyOf(colony).label.toLowerCase()}.`,
          x: colony.x, y: colony.y, colonyId: colony.id
        });
      }

      // Rivals get a modest passive income so they remain a going concern
      // even when their gatherers are being picked off; the bulk of their
      // economy still comes from organisms returning to their Core.
      colony.biomass = Math.min(colony.biomassCap, colony.biomass + 0.55 * dt);
      colony.energy = Math.min(colony.energyCap, colony.energy + 0.7 * dt);

      decayStanding(colony, dt);
      colony.redesignTimer -= dt;
      if (colony.redesignTimer <= 0) {
        colony.redesignTimer = REDESIGN_INTERVAL * (0.7 + Math.random() * 0.6);
        const next = chooseDesign(game, colony);
        const changed = T.CATEGORIES.filter(c => next[c] !== (colony.currentDesign || {})[c]).length;
        if (changed > 0) {
          colony.currentDesign = next;
          colony.designGeneration++;
          /* Only a substantive revision is worth the player's attention, and
           * never more than once every couple of minutes per colony. The feed
           * is the game's narration channel; a rival muttering about a single
           * swapped slot every 46 seconds drowns out actual news. */
          const now = game.simTime;
          if (changed >= 2 && now - (colony.lastAnnouncedAt || -999) > 120) {
            colony.lastAnnouncedAt = now;
            announceRedesign(game, bus, colony);
          }
        }
        colony.lastLossCause = null;
      }

      /* Rivals dig too. They queue one chamber at a time against whatever
       * they are currently short of, so an inland rival ends up with cisterns
       * and a besieged one with redoubts — the same reasoning the player
       * applies, run on their own state. */
      colony.digTimer = (colony.digTimer || 0) - dt;
      if (colony.digTimer <= 0) {
        colony.digTimer = 30 + Math.random() * 40;
        const pending = CM.structures.ofColony(game, colony.id).filter(s => !s.done).length;
        if (pending < 2) {
          const plan = CM.structures.suggestExpansion(game, colony);
          if (plan) CM.structures.queue(game, bus, colony, plan.typeKey, plan.x, plan.y);
        }
      }

      if (CM.layers && !colony.isPlayer) maybeRaid(game, colony, dt);

      colony.deployTimer -= dt;
      if (colony.deployTimer <= 0) {
        colony.deployTimer = DEPLOY_INTERVAL / Math.max(0.2, strategyOf(colony).deployRate);
        tryDeploy(game, bus, colony);
      }
    }
    updateTerritory(game, dt);
  }

  /* Predatory and Expansionist colonies that hold a Gate will send a
   * handful of bodies onto the Veil toward a hostile Gate. Entrenched
   * colonies fortify instead. */
  function maybeRaid(game, colony, dt) {
    colony.raidTimer = (colony.raidTimer || 0) - dt;
    if (colony.raidTimer > 0) return;
    colony.raidTimer = 22 + Math.random() * 18;
    if (!CM.layers.hasGate(game, colony.id)) return;
    const strat = strategyOf(colony);
    if (strat.defense >= 1.5 && (!colony.burrowLost)) {
      const shaft = CM.structures.ofColony(game, colony.id).find(s => s.type === 'SHAFT' && s.done);
      if (shaft && !shaft.fortified && colony.biomass > 120) CM.layers.fortify(game, game.__bus, colony, shaft);
      return;
    }
    if (strat.aggression < 0.5) return;
    let target = null;
    for (const other of game.colonies) {
      if (other.id === colony.id || !other.alive) continue;
      if (!CM.layers.hasGate(game, other.id)) continue;
      if (!areHostile(game, colony.id, other.id) && strat.aggression < 1.2) continue;
      target = other; break;
    }
    if (!target) return;
    const portal = CM.structures.all(game).find(s => s.type === 'NEXUS' && s.colonyId === target.id && s.done);
    if (!portal) return;
    let sent = 0;
    for (const org of game.organisms) {
      if (org.ownerId !== colony.id || !org.alive || org.order) continue;
      if (sent >= 3) break;
      org.order = { type: 'MOVE', x: portal.x, y: portal.y, depth: 10 };
      sent++;
    }
  }

  function announceRedesign(game, bus, colony) {
    const ids = designTraitIds(colony.currentDesign);
    const names = ids.map(id => T.TRAITS_BY_ID[id].name).join(', ') || 'a stripped-down form';
    CM.discovery.pushEvent(game, bus, {
      kind: 'rival', icon: '\u{1F9EC}',
      message: `${colony.name} has redesigned its organisms: ${names}.`,
      x: colony.x, y: colony.y, colonyId: colony.id
    });
  }

  /* Rivals wake up on a stagger and grow into their ceiling rather than
   * starting at full strength.
   *
   * With rivals fully operational from t=0 — five known traits, deploying
   * immediately, capped at 34 — the player's three trait-less scouts were
   * simply erased inside the first fifteen minutes, measured. The brief's
   * opening is meant to be a quiet stretch of exploration, a first death
   * around minute three, and a discovery around minute five; a rival army at
   * minute one deletes that entirely. Rivals are the escalation *after* the
   * player has found their footing, so they arrive on a timer and ramp. */
  const RIVAL_WAKE_BASE = 240;    // sim-seconds before the first rival deploys
  const RIVAL_WAKE_STAGGER = 90;  // and each subsequent one waits longer
  const RIVAL_GROWTH_PERIOD = 150; // how often a rival's ceiling rises

  function isAwake(colony, simTime) {
    return colony.isPlayer || simTime >= (colony.awakenAt || 0);
  }

  function populationCap(colony, simTime) {
    if (colony.isPlayer) return 60;
    const t = simTime == null ? 1e9 : simTime;
    if (t < (colony.awakenAt || 0)) return 0;
    const grown = 6 + Math.floor((t - colony.awakenAt) / RIVAL_GROWTH_PERIOD) * 5;
    return Math.max(0, Math.min(34, grown));
  }

  function tryDeploy(game, bus, colony) {
    if (colony.pop >= populationCap(colony, game.simTime)) return;
    if (game.organisms.length >= CM.simulation.MAX_ACTIVE) return;
    if (!colony.currentDesign) colony.currentDesign = chooseDesign(game, colony);

    const traits = designTraitIds(colony.currentDesign);
    const cost = T.resolveCost(traits);
    if (colony.biomass < cost.biomass || colony.energy < cost.energy) return;
    colony.biomass -= cost.biomass;
    colony.energy -= cost.energy;

    const a = Math.random() * Math.PI * 2, r = 1.5 + Math.random() * 2.5;
    const directive = rollDirective(colony);
    const org = CM.organism.create({
      ownerId: colony.id,
      traits,
      name: colony.name + '-' + (++colony.deployed),
      x: K.clamp(colony.x + Math.cos(a) * r, 1, game.world.size - 1),
      y: K.clamp(colony.y + Math.sin(a) * r, 1, game.world.size - 1),
      color: colony.color,
      diet: 'omnivore',
      directive
    });
    org.rallyPoint = pickRally(game, colony, directive);
    CM.coremind.addOrganism(game, org);
  }

  /* Where a newly deployed organism is sent. This is what actually makes the
   * doctrines legible on screen: a Predatory colony's organisms converge on
   * whoever it hates, an Expansionist's fan outward toward unheld ground, and
   * an Entrenched one's never leave the porch. Without it every colony
   * behaved identically and `aggression`/`expansion`/`defense` were decorative. */
  function pickRally(game, colony, directive) {
    const strategy = strategyOf(colony);
    if (directive === 'DEFEND' || strategy.defense > 1.4) {
      return { x: colony.x, y: colony.y, radius: 10 };
    }
    if (directive === 'HUNT' && strategy.aggression > 0.6) {
      // Head for the colony it likes least that is actually reachable.
      let target = null, worst = 1;
      for (const other of game.colonies) {
        if (other.id === colony.id || !other.alive) continue;
        const s = standingBetween(game, colony, other);
        if (s < worst) { worst = s; target = other; }
      }
      if (target) {
        const t = 0.55 + Math.random() * 0.35;    // stop short of the Core itself
        return { x: colony.x + (target.x - colony.x) * t, y: colony.y + (target.y - colony.y) * t, radius: 18 };
      }
    }
    // Expansion: push outward from the Core, further the more expansionist.
    const ang = Math.random() * Math.PI * 2;
    const dist = 14 + strategy.expansion * 26 * Math.random();
    return {
      x: K.clamp(colony.x + Math.cos(ang) * dist, 2, game.world.size - 2),
      y: K.clamp(colony.y + Math.sin(ang) * dist, 2, game.world.size - 2),
      radius: 14
    };
  }

  function rollDirective(colony) {
    const mix = strategyOf(colony).directiveMix;
    let total = 0;
    for (const k in mix) total += mix[k];
    let roll = Math.random() * total;
    for (const k in mix) { roll -= mix[k]; if (roll <= 0) return k; }
    return 'EXPLORE';
  }

  /* Rivals learn the way the player does — from what their organisms meet.
   * Called by the simulation whenever one of their organisms is in a fight. */
  function creditObservation(game, bus, colony, traitIds, amount) {
    if (!colony || colony.isPlayer || !colony.alive) return;
    for (const traitId of traitIds) {
      if (colony.discovered[traitId]) continue;
      colony.observations[traitId] = (colony.observations[traitId] || 0) + amount;
      if (colony.observations[traitId] >= CM.discovery.OBSERVATION_THRESHOLD + 2) {
        colony.discovered[traitId] = true;
        colony.redesignTimer = Math.min(colony.redesignTimer, 6); // reconsider soon
      }
    }
  }

  function recordLoss(game, colony, cause) {
    if (!colony) return;
    colony.losses++;
    if (colony.isPlayer) return;
    colony.lastLossCause = cause;
    // A colony bleeding organisms rethinks sooner than its normal cadence.
    if (colony.losses % 3 === 0) colony.redesignTimer = Math.min(colony.redesignTimer, 8);
  }

  /* --- standing -------------------------------------------------------------
   * Hostility is earned rather than assigned. Every colony starts mildly wary
   * of every other; killing their organisms drives it down, and time with no
   * incidents lets it drift back up. Below HOSTILE_AT the two treat each other
   * as targets on sight rather than only when posturing, which is what turns a
   * border incident into a running feud without any scripted war declaration. */
  const HOSTILE_AT = -0.55;
  const STANDING_PER_KILL = 0.12;

  function standingBetween(game, a, b) {
    if (!a || !b || a === b) return 0;
    const colA = typeof a === 'string' ? game.coloniesById[a] : a;
    if (!colA || !colA.standing) return 0;
    const bId = typeof b === 'string' ? b : b.id;
    return colA.standing[bId] != null ? colA.standing[bId] : 0;
  }

  function areHostile(game, aId, bId) {
    if (!aId || !bId || aId === bId) return false;
    if (aId === WILD_ID || bId === WILD_ID) return false;
    if (CM.reputation && CM.reputation.areHostile) {
      return CM.reputation.areHostile(game, aId, bId);
    }
    return standingBetween(game, aId, bId) <= HOSTILE_AT
        || standingBetween(game, bId, aId) <= HOSTILE_AT;
  }

  /* Both sides move: the victim resents the killer, and the killer's own
   * regard for a colony it keeps preying on also drops, so predation is
   * self-reinforcing rather than one-sided. */
  function registerKill(game, bus, killerColonyId, victimColonyId) {
    if (!killerColonyId || !victimColonyId || killerColonyId === victimColonyId) return;
    if (killerColonyId === WILD_ID || victimColonyId === WILD_ID) return;
    const victim = game.coloniesById[victimColonyId];
    const killer = game.coloniesById[killerColonyId];
    if (!victim || !killer) return;
    const before = areHostile(game, killerColonyId, victimColonyId);
    victim.standing[killerColonyId] = K.clamp((victim.standing[killerColonyId] || 0) - STANDING_PER_KILL, -1, 1);
    killer.standing[victimColonyId] = K.clamp((killer.standing[victimColonyId] || 0) - STANDING_PER_KILL * 0.4, -1, 1);
    if (!before && areHostile(game, killerColonyId, victimColonyId)) {
      const involvesPlayer = victim.isPlayer || killer.isPlayer;
      CM.discovery.pushEvent(game, bus, {
        kind: involvesPlayer ? 'warn' : 'rival', icon: '\u{2694}',
        message: involvesPlayer
          ? `${(victim.isPlayer ? killer : victim).name} is now openly hostile to you.`
          : `${victim.name} and ${killer.name} have turned on each other.`,
        x: victim.x, y: victim.y, colonyId: victim.isPlayer ? killer.id : victim.id
      });
    }
  }

  /* Standing recovers slowly when nothing is happening, so an old grudge can
   * cool if both sides leave each other alone. */
  function decayStanding(colony, dt) {
    for (const id in colony.standing) {
      const v = colony.standing[id];
      if (v < -0.25) colony.standing[id] = Math.min(-0.25, v + 0.004 * dt);
    }
  }

  // --- territory -------------------------------------------------------------
  function initTerritory(game) {
    game.territory = {
      cell: TERR_CELL, size: TERR_SIZE,
      owner: new Int8Array(TERR_SIZE * TERR_SIZE).fill(-1),  // colony index, -1 unclaimed
      strength: new Float32Array(TERR_SIZE * TERR_SIZE),
      contested: new Uint8Array(TERR_SIZE * TERR_SIZE),
      timer: 0
    };
  }

  /* Recomputed on a slow cadence rather than per tick: it is a coarse 32x32
   * field and nothing about it needs to be frame-accurate. Influence comes
   * from Cores (strong, fixed) and from living organisms (weak, mobile), so
   * territory follows where a colony actually *is*, not where it claims. */
  function updateTerritory(game, dt) {
    const terr = game.territory;
    if (!terr) return;
    terr.timer -= dt;
    if (terr.timer > 0) return;
    terr.timer = 2.5;

    const n = TERR_SIZE * TERR_SIZE;
    const colonies = game.colonies;
    const influence = [];
    for (let c = 0; c < colonies.length; c++) influence.push(new Float32Array(n));

    for (let c = 0; c < colonies.length; c++) {
      const colony = colonies[c];
      if (!colony.alive) continue;
      stamp(influence[c], colony.x, colony.y, 5, 9);
    }
    for (const org of game.organisms) {
      if (!org.alive || org.ownerId === WILD_ID) continue;
      const ci = colonies.findIndex(c => c.id === org.ownerId);
      if (ci < 0) continue;
      stamp(influence[ci], org.x, org.y, 2, 1.1);
    }

    for (let i = 0; i < n; i++) {
      let bestC = -1, best = 0, second = 0;
      for (let c = 0; c < colonies.length; c++) {
        const v = influence[c][i];
        if (v > best) { second = best; best = v; bestC = c; }
        else if (v > second) second = v;
      }
      terr.owner[i] = best > 0.8 ? bestC : -1;
      terr.strength[i] = best;
      // "Contested" means two colonies have comparable presence here — the
      // border friction that drives raids without any scripted war.
      terr.contested[i] = (best > 0.8 && second > best * 0.55) ? 1 : 0;
    }

    function stamp(field, wx, wy, radius, weight) {
      const cx = Math.floor(wx / TERR_CELL), cy = Math.floor(wy / TERR_CELL);
      for (let dy = -radius; dy <= radius; dy++) {
        for (let dx = -radius; dx <= radius; dx++) {
          const tx = cx + dx, ty = cy + dy;
          if (tx < 0 || ty < 0 || tx >= TERR_SIZE || ty >= TERR_SIZE) continue;
          const d = Math.hypot(dx, dy);
          if (d > radius) continue;
          field[ty * TERR_SIZE + tx] += weight * (1 - d / (radius + 1));
        }
      }
    }
  }

  function territoryOwnerAt(game, x, y) {
    const terr = game.territory;
    if (!terr) return null;
    const tx = Math.floor(x / TERR_CELL), ty = Math.floor(y / TERR_CELL);
    if (tx < 0 || ty < 0 || tx >= TERR_SIZE || ty >= TERR_SIZE) return null;
    const owner = terr.owner[ty * TERR_SIZE + tx];
    return owner >= 0 ? game.colonies[owner] : null;
  }

  function territoryCounts(game) {
    const terr = game.territory;
    const out = {};
    if (!terr) return out;
    for (const c of game.colonies) out[c.id] = 0;
    for (let i = 0; i < terr.owner.length; i++) {
      const o = terr.owner[i];
      if (o >= 0 && game.colonies[o]) out[game.colonies[o].id]++;
    }
    return out;
  }

  /* A Core takes damage when hostile organisms stand on it with nothing left
   * to stop them. A colony whose Core reaches zero collapses: its organisms
   * are released as wild rather than vanishing, because a population does not
   * evaporate when its leadership does. */
  function damageCore(game, bus, colony, amount) {
    if (!colony.alive) return;
    colony.integrity -= amount;
    if (colony.integrity > 0) return;
    /* A Deep Sanctum is a second seat for the Coremind, buried past anything
     * that can reach it from the surface. Losing the surface Core no longer
     * ends the colony — it falls back to the sanctum and rebuilds from there.
     * That is what the abyssal tier is *for*: the endgame is not a bigger
     * number, it is becoming impossible to kill from above. */
    if (CM.structures.hasSanctum(game, colony.id)) {
      const seat = CM.structures.all(game)
        .find(s => s.done && s.colonyId === colony.id && CM.structures.TYPES[s.type].endgame);

      if (seat && !colony.__fellBack) {

        colony.x = seat.x; colony.y = seat.y;
        CM.discovery.pushEvent(game, bus, {
          kind: colony.isPlayer ? 'warn' : 'rival', icon: '\u{1F52E}',
          message: colony.isPlayer

            : `${colony.name}'s Core fell, but it survives in a Deep Sanctum.`,
          x: seat.x, y: seat.y, colonyId: colony.id
        });
      }
      return;
    }
    collapse(game, bus, colony);
  }

  function collapse(game, bus, colony) {
    colony.alive = false;
    colony.integrity = 0;
    // The tunnels go with it — an abandoned network is not a prize another
    // colony can simply walk into.
    CM.structures.removeStructuresOf(game, colony.id);
    let released = 0;
    for (const org of game.organisms) {

        org.speciesId = org.speciesId || 'grazer';
        org.directive = null;
        released++;

    CM.discovery.pushEvent(game, bus, {
      kind: 'rival', icon: '\u{1F480}',
      message: `${colony.name} has collapsed. ${released} of its organisms are now feral.`,
      x: colony.x, y: colony.y, colonyId: colony.id
    });
  }

  function livingRivals(game) {
    return game.colonies ? game.colonies.filter(c => !c.isPlayer && c.alive) : [];
  }

  function all(game) { return game.structures ? game.structures.list : []; }

  /* Can this colony put `typeKey` at (x,y)? Returns {ok, reason, linkTo}.
   * The reason strings are shown directly in the build UI — a refusal the
   * player cannot interpret is worse than no refusal at all. */
  function canPlace(game, colony, typeKey, x, y) {
    const type = TYPES[typeKey];
    if (!type) return { ok: false, reason: 'Unknown chamber.' };
    if (type.hidden) return { ok: false, reason: 'That chamber cannot be sited by hand.' };
    if (!colony || !colony.alive) return { ok: false, reason: 'No Coremind to build it.' };
    if (colony.burrowLost && !type.standalone) {
      return { ok: false, reason: 'The burrow is lost. Sink a new shaft, or reclaim the Gate.' };
    }
    if (CM.layers) {
      if (type.standalone && type.key === 'SHAFT') {
        const foothold = CM.layers.surfaceReady(game, colony);
        if (!foothold.ok) return foothold;
      } else if (type.spine && type.depth > 1 && type.depth <= 9) {
        const ready = CM.layers.layerReady(game, colony, type.depth - 1);
        if (!ready.ok) return ready;
      }
    }

    if (x < 2 || y < 2 || x > game.world.size - 2 || y > game.world.size - 2) {
      return { ok: false, reason: 'Outside the world.' };
    }
    if (W.isWaterAt(game.world, x, y)) return { ok: false, reason: 'Cannot dig under open water.' };
    const biome = W.biomeAt(game.world, x, y);
    if (biome === W.BIOME.MOUNTAIN) return { ok: false, reason: 'The rock here is too hard to cut.' };

    const depth = type.depth;
    const mine = ofColony(game, colony.id);
    // Spacing is per-depth: two chambers on different strata are not in each
    // other's way, which is what lets a network stack rather than sprawl.
    for (const s of mine) {
      if (s.depth === depth && K.dist(s.x, s.y, x, y) < MIN_SPACING) {
        return { ok: false, reason: 'Too close to an existing chamber on this level.' };
      }
    }

    // A vein chamber has to sit on an actual vein — the deep resource is a
    // place on the map, not a purchase.
    if (type.requiresVein) {
      const vein = nearestVein(game, x, y, VEIN_REACH);
      if (!vein) return { ok: false, reason: 'No abyssal vein here — find one first.' };
      if (vein.claimedBy && vein.claimedBy !== colony.id) return { ok: false, reason: 'That vein is already being worked.' };
    }

    if (colony.layerPermit && colony.layerPermit[depth] && colony.layerPermit[depth][typeKey] === false) {
      return { ok: false, reason: 'This layer forbids that chamber.' };
    }

    if (type.standalone) {
      // A shaft may go anywhere, but not right beside another shaft — that is
      // what stops the network being a blob and makes expansion directional.
      for (const s of mine) {
        if (s.type === 'SHAFT' && K.dist(s.x, s.y, x, y) < SHAFT_SPACING) {
          return { ok: false, reason: 'Another shaft already serves this area.' };
        }
      }
      return { ok: true, linkTo: null };
    }

    /* Everything else must connect to a *finished* chamber within one depth
     * level of itself. That single rule is what makes depth a campaign: to
     * put anything in the abyssal reach you must already hold deep galleries
     * above it, and to hold those you need shallow works above them. */
    let linkTo = null, bestD = LINK_RANGE;
    let sawNearer = false;
    const pinned = game.buildFromId && mine.find(s => s.id === game.buildFromId && s.done);
    if (pinned && Math.abs(pinned.depth - depth) <= 1) {
      const pd = K.dist(pinned.x, pinned.y, x, y);
      if (pd <= LINK_RANGE) {
        return { ok: true, linkTo: pinned };
      }
    }
    for (const s of mine) {
      if (!s.done) continue;
      const d = K.dist(s.x, s.y, x, y);
      if (d > LINK_RANGE) continue;
      sawNearer = true;
      if (Math.abs(s.depth - depth) > 1) continue;
      if (d <= bestD) { bestD = d; linkTo = s; }
    }
    if (!linkTo) {
      if (sawNearer) {
        const above = DEPTHS[depth - 1];
        return { ok: false, reason: `Nothing at a workable depth here — cut ${above ? above.name.toLowerCase() : 'shallower works'} first.` };
      }
      return { ok: false, reason: 'Must connect to a finished chamber — sink a shaft first.' };
    }
    return { ok: true, linkTo };
  }

  /* --- abyssal veins --------------------------------------------------------
   * Buried biomass seams, placed at world generation and only findable by
   * digging. They are the reason to go deep at all, and being fixed points on
   * the map means the deep tier is contested ground rather than a menu. */
  const VEIN_REACH = 3.2;
  function nearestVein(game, x, y, radius) {
    let best = null, bestD = radius;
    for (const v of (game.world.veins || [])) {
      const d = K.dist(v.x, v.y, x, y);
      if (d < bestD) { bestD = d; best = v; }
    }
    return best;
  }
  /* Veins are only revealed once a colony has dug deep nearby — until then
   * the player is prospecting, not shopping from a list. */
  function revealVeinsNear(game, x, y, radius) {
    let found = null;
    for (const v of (game.world.veins || [])) {
      if (v.known) continue;
      if (K.dist(v.x, v.y, x, y) <= radius) { v.known = true; found = v; }
    }
    return found;
  }

  function cost(typeKey) {
    const t = TYPES[typeKey];
    return t ? { biomass: t.cost.biomass, energy: t.cost.energy } : { biomass: 0, energy: 0 };
  }

  /* Queues a build site. Resources are spent up front, so a half-dug chamber
   * represents a real commitment the player can lose. */
  function queue(game, bus, colony, typeKey, x, y) {
    const check = canPlace(game, colony, typeKey, x, y);
    if (!check.ok) return { ok: false, reason: check.reason };
    const c = cost(typeKey);
    if (colony.biomass < c.biomass || colony.energy < c.energy) {
      return { ok: false, reason: 'Not enough biomass or energy.' };
    }
    colony.biomass -= c.biomass;
    colony.energy -= c.energy;

    const site = {
      id: 'st_' + (game.structures.nextId++),
      colonyId: colony.id,
      type: typeKey,
      x, y,
      depth: TYPES[typeKey].depth,
      work: 0,
      workNeeded: TYPES[typeKey].work,
      done: false,
      integrity: 100,
      controlled: true,
      fortified: false,
      fortHp: 0,
      linkId: check.linkTo ? check.linkTo.id : null,
      tier: 0,
      upgradingTo: 0,
      upgradeWork: 0,
      crewIds: [],
      priority: 0,
      entrenched: false
    };
    if (TYPES[typeKey].requiresVein) {
      const vein = nearestVein(game, x, y, VEIN_REACH);
      if (vein) { vein.claimedBy = colony.id; site.veinId = vein.id; }
    }
    game.structures.list.push(site);
    if (colony.isPlayer && bus) {
      CM.discovery.pushEvent(game, bus, {
        kind: 'system', icon: TYPES[typeKey].icon,
        message: `${TYPES[typeKey].name} marked for excavation.`,
        x, y, structureId: site.id
      });
    }
    return { ok: true, site };
  }

  /* Digging progress. Rate scales with the organism's digging stat, so the
   * trait is what makes a colony able to build at all — a colony with no
   * burrowers can queue chambers but will crawl through them. */
  const MAX_TIER = 3;
  function tierMul(site) { return 1 + 0.28 * ((site && site.tier) || 0); }
  function radiusOf(site) {
    const t = TYPES[site.type];
    return t ? t.radius * tierMul(site) : 6;
  }

    REDOUBT: ['Slit walls', 'Murder holes', 'Iron keep'],
    FUNGARIUM: ['Spawn beds', 'Spore loft', 'Mother bloom'],
    GEOTHERMAL: ['Steam flue', 'Heat well', 'Mantle throat'],
    VEINWORKS: ['Pick face', 'Ore hall', 'Deep cut'],
    SANCTUM: ['Inner seat', 'Relic vault', 'Second mind'],
    WELL: ['Ring stair', 'Drop shaft', 'Abyss well'],
    GALLERY: ['Spore stair', 'Bloom ramp', 'March hall'],
    SPOREWELL: ['Cultured ring', 'Bloom cistern', 'Mother well'],
    AQUEDUCT: ['Lined run', 'Pressure run', 'Deep river'],
    CLEFT: ['Listen cut', 'Echo stair', 'Resonant well'],
    RESONATOR: ['Drum skin', 'Long ear', 'Warning choir'],
    RELIQUARY: ['Deep bench', 'Bone library', 'Thought vault'],
    CHASM: ['Brace cut', 'Drop hall', 'Bastion stair'],
    BASTION: ['Outer works', 'Kill yard', 'Crown wall'],
    MANTLE: ['Heat stair', 'Cinder ramp', 'Hearth cut'],
    HEARTH: ['Coal bed', 'Forge well', 'Mantle heart'],
    SEAM: ['Deep face', 'Rich cut', 'Mother seam'],
    ABYSS: ['Hollow stair', 'Last ramp', 'Night well'],
    CITADEL: ['Outer court', 'Inner wall', 'Crown keep'],
    CRYPT: ['Lower seat', 'Bone throne', 'Third mind'],
    GATE: ['Door braces', 'Kill gallery', 'Veil lock'],
    MUSTER: ['Staging floor', 'Raid hall', 'War court'],
    KEEP: ['Gate yard', 'Inner keep', 'Last wall']
  };
  const UPGRADE_COST_F = [0, 0.65, 1.05, 1.55];
  const UPGRADE_WORK_F = [0, 0.55, 0.85, 1.20];

  function upgradeName(typeKey, tier) {
    const list = UPGRADE_TITLES[typeKey];
    if (list && list[tier - 1]) return list[tier - 1];
    return ['Shoring', 'Expansion', 'Masterwork'][tier - 1] || ('Tier ' + tier);
  }
  function upgradeCost(site) {
    const next = ((site && site.tier) || 0) + 1;
    const c = cost(site.type);
    const f = UPGRADE_COST_F[next] || 1.6;
    return { biomass: Math.round(c.biomass * f), energy: Math.round(c.energy * f) };
  }
  function upgradeWorkNeeded(site) {
    const next = ((site && site.tier) || 0) + 1;
    const t = TYPES[site.type];
    return Math.round((t ? t.work : 40) * (UPGRADE_WORK_F[next] || 1.2));
  }
  function canUpgrade(game, colony, site) {
    if (!site || !site.done || site.colonyId !== colony.id) return { ok: false, reason: 'Finish a chamber you own first.' };
    if (site.type === 'NEXUS') return { ok: false, reason: 'A Veil door cannot be raised.' };
    if (site.controlled === false) return { ok: false, reason: 'Reclaim the chamber first.' };
    if (site.upgradingTo) return { ok: false, reason: 'Already being raised.' };
    if ((site.tier || 0) >= MAX_TIER) return { ok: false, reason: 'This chamber is finished — masterwork.' };
    const c = upgradeCost(site);
    if (colony.biomass < c.biomass || colony.energy < c.energy) {
      return { ok: false, reason: `Needs ${c.biomass} biomass and ${c.energy} energy.` };
    }
    return { ok: true, cost: c, name: upgradeName(site.type, (site.tier || 0) + 1) };
  }
  function startUpgrade(game, bus, colony, site) {
    const check = canUpgrade(game, colony, site);
    if (!check.ok) return check;
    const c = check.cost;
    colony.biomass -= c.biomass;
    colony.energy -= c.energy;
    site.upgradingTo = (site.tier || 0) + 1;
    site.upgradeWork = 0;
    site.upgradeNeeded = upgradeWorkNeeded(site);
    if (colony.isPlayer && bus) {
      CM.discovery.pushEvent(game, bus, {
        kind: 'system', icon: '\u{26A1}',
        message: `${TYPES[site.type].name}: raising ${check.name}. Diggers will finish it.`,
        x: site.x, y: site.y, structureId: site.id
      });
    }
    return { ok: true };
  }
  function finishUpgrade(game, bus, site) {
    site.tier = site.upgradingTo || ((site.tier || 0) + 1);
    site.upgradingTo = 0;
    site.upgradeWork = 0;
    site.upgradeNeeded = 0;
    site.integrity = Math.max(site.integrity || 100, 100 + site.tier * 12);
    const colony = game.coloniesById[site.colonyId];
    if (colony && colony.isPlayer && bus) {
      CM.discovery.pushEvent(game, bus, {
        kind: 'discovery', icon: TYPES[site.type].icon,
        message: `${TYPES[site.type].name} raised to ${upgradeName(site.type, site.tier)}.`,
        x: site.x, y: site.y, structureId: site.id
      });
    }
    if (colony && colony.isPlayer && CM.progress) CM.progress.note(game, 'upgrade');
    return true;
  }

  function addWork(game, bus, site, org, dt) {
    const infl = CM.influence ? CM.influence.digMul(game, site) : 1;
    const rate = (0.5 + (org.stats.digging || 0) * 0.055) * infl;
    if (site.done && site.upgradingTo) {
      site.upgradeWork = (site.upgradeWork || 0) + rate * dt;
      if (site.upgradeWork < (site.upgradeNeeded || upgradeWorkNeeded(site))) return false;
      return finishUpgrade(game, bus, site);
    }
    if (site.done) return false;
    site.work += rate * dt;
    if (site.work < site.workNeeded) return false;
    site.done = true;
    site.work = site.workNeeded;
    const colony = game.coloniesById[site.colonyId];
    if (colony && colony.isPlayer && bus) {
      CM.discovery.pushEvent(game, bus, {
        kind: 'discovery', icon: TYPES[site.type].icon,
        message: `${TYPES[site.type].name} complete. ${TYPES[site.type].blurb}`,
        x: site.x, y: site.y, structureId: site.id
      });
    }
    /* Cutting deep is how veins are found. Prospecting is a *consequence* of
     * digging rather than a separate action, so the reward for pushing the
     * network downward arrives on its own — and the deeper the chamber, the
     * further through the rock the colony can sense. */
    if (site.depth >= 2) {
      const found = revealVeinsNear(game, site.x, site.y, 8 + site.depth * 7);
      if (found && colony && colony.isPlayer && bus) {
        CM.discovery.pushEvent(game, bus, {
          kind: 'discovery', icon: '\u{1F48E}',
          message: 'Abyssal vein struck. Cut a Veinworks or Deep Seam onto it to work it.',
          x: found.x, y: found.y
        });
      }
    }
    if (CM.layers) CM.layers.onCompleted(game, bus, site);
    return true;
  }

  /* How much the buried works themselves resist being chewed open. A redoubt
   * hardens the ground around it, which is what makes it worth putting one in
   * the middle of a network rather than at its edge. */
  function defenseAt(game, colonyId, x, y, depth) {
    let bonus = 0;
    for (const s of all(game)) {
      if (!s.done || s.controlled === false || s.colonyId !== colonyId) continue;
      const type = TYPES[s.type];
      if (!type || !type.defenseBonus) continue;
      if (depth != null) {
        const sd = s.depth || 0;
        if (sd !== depth && sd !== depth - 1) continue;
      }
      if (K.dist(s.x, s.y, x, y) <= radiusOf(s) * 1.5) {
        bonus += type.defenseBonus * tierMul(s) * (s.entrenched ? 1.35 : 1);
      }
    }
    return bonus;
  }

  function nearestSite(game, colonyId, x, y, maxDist, org) {
    if (org && org.assignedSiteId) {
      const assigned = all(game).find(s => s.id === org.assignedSiteId);
      if (assigned && assigned.colonyId === colonyId && (!assigned.done || assigned.upgradingTo)) {
        return assigned;
      }
    }
    let best = null, bestScore = -Infinity;
    const cap = maxDist || Infinity;
    for (const s of all(game)) {
      if (s.colonyId !== colonyId) continue;
      if (s.done && !s.upgradingTo) continue;
      const d = K.dist(s.x, s.y, x, y);
      if (d > cap) continue;
      const score = (s.priority || 0) * 1000 - d;
      if (score > bestScore) { bestScore = score; best = s; }
    }
    return best;
  }

  function setPriority(game, site, on) {
    if (!site) return;
    if (on) {
      let hi = 1;
      for (const s of all(game)) if ((s.priority || 0) >= hi) hi = s.priority + 1;
      site.priority = hi;
    } else site.priority = 0;
  }

  function demolish(game, bus, colony, site) {
    if (!site || site.colonyId !== colony.id) return { ok: false, reason: 'That chamber is not yours.' };
    if (site.type === 'NEXUS') return { ok: false, reason: 'A Veil door cannot be pulled up.' };
    if (site.done && site.type === 'GATE' && !colony.burrowLost) {
      return { ok: false, reason: 'Pulling the Gate drops the burrow. Reclaim or lose it first.' };
    }
    const type = TYPES[site.type];
    const c = cost(site.type);
    if (!site.done) {
      colony.biomass = Math.min(colony.biomassCap, colony.biomass + c.biomass * 0.5);
      colony.energy = Math.min(colony.energyCap, colony.energy + c.energy * 0.5);
    }
    destroy(game, site);
    if (colony.isPlayer && bus) {
      CM.discovery.pushEvent(game, bus, {
        kind: 'system', icon: '\u{1F5D1}',
        message: site.done
          ? `${type.name} pulled down.`
          : `${type.name} cancelled. Half the cost returned.`,
        x: site.x, y: site.y
      });
    }
    return { ok: true };
  }

  const ENTRENCH_COST = { biomass: 36, energy: 24 };
  function canEntrench(game, colony, site) {
    if (!site || !site.done || site.colonyId !== colony.id) return { ok: false, reason: 'Finish a chamber you own first.' };
    if (site.entrenched) return { ok: false, reason: 'Already entrenched.' };
    if (colony.biomass < ENTRENCH_COST.biomass || colony.energy < ENTRENCH_COST.energy) {
      return { ok: false, reason: `Needs ${ENTRENCH_COST.biomass} biomass and ${ENTRENCH_COST.energy} energy.` };
    }
    return { ok: true };
  }
  function entrench(game, bus, colony, site) {
    const check = canEntrench(game, colony, site);
    if (!check.ok) return check;
    colony.biomass -= ENTRENCH_COST.biomass;
    colony.energy -= ENTRENCH_COST.energy;
    site.entrenched = true;
    site.integrity = Math.max(site.integrity || 100, 140);
    if (colony.isPlayer && bus) {
      CM.discovery.pushEvent(game, bus, {
        kind: 'system', icon: '\u{1F6E1}',
        message: `${TYPES[site.type].name} entrenched. Harder to chew, stronger in a fight.`,
        x: site.x, y: site.y, structureId: site.id
      });
    }
    return { ok: true };
  }

  /* --- effects -------------------------------------------------------------
   * Queried by the simulation. Each is a plain lookup over finished chambers
   * of the right type in range, so a chamber's benefit is always tied to
   * *where* the player chose to put it. */
  function nearestOfType(game, colonyId, typeKey, x, y) {
    let best = null, bestD = Infinity;
    for (const s of all(game)) {
      if (!s.done || s.controlled === false || s.type !== typeKey || s.colonyId !== colonyId) continue;
      const d = K.dist(s.x, s.y, x, y);
      if (d < bestD && d <= radiusOf(s)) { bestD = d; best = s; }
    }
    return best;
  }

  /* Is there a chamber this organism could walk to for shelter? Kept separate
   * from the effect-radius lookups above: searching within a chamber's *effect*
   * radius meant an organism only recognised a warren once it was already
   * standing in one, so the SHELTER order could never move anybody. */
  function findShelter(game, colonyId, x, y, searchRadius) {
    let best = null, bestD = searchRadius;
    for (const s of all(game)) {
      if (!s.done || s.controlled === false || s.colonyId !== colonyId) continue;
      if (s.type !== 'WARREN' && s.type !== 'REDOUBT' && s.type !== 'BASTION' && s.type !== 'CITADEL' && s.type !== 'KEEP' && s.type !== 'MUSTER') continue;
      const d = K.dist(s.x, s.y, x, y);
      if (d < bestD) { bestD = d; best = s; }
    }
    return best;
  }
  function nurseryAt(game, org) {
    return nearestOfType(game, org.ownerId, 'NURSERY', org.x, org.y)
        || nearestOfType(game, org.ownerId, 'MUSTER', org.x, org.y);
  }

  function findNearestCistern(game, colonyId, x, y, radius) {
    let best = null, bestD = radius;
    for (const s of all(game)) {
      if (!s.done || s.controlled === false || s.colonyId !== colonyId) continue;
      if (s.type !== 'CISTERN' && s.type !== 'AQUEDUCT') continue;
      const d = K.dist(s.x, s.y, x, y);
      if (d < bestD) { bestD = d; best = s; }
    }
    return best;
  }

  /* Fungus feeds whoever stands in it. This is the chamber that severs a
   * colony from the surface: with one, organisms no longer have to walk out
   * into the weather and the predators to eat, which is the precondition for
   * living in the abyssal reach at all. */
  function fungariumFeed(game, org) {
    let best = 0;
    for (const key of TYPE_KEYS) {
      if (!TYPES[key].feedsRate) continue;
      const site = nearestOfType(game, org.ownerId, key, org.x, org.y);
      if (site) {
        const mul = (CM.influence ? CM.influence.incomeMul(game, site) : 1) * tierMul(site);
        best = Math.max(best, TYPES[key].feedsRate * mul);
      }
    }
    return best;
  }

  /* Everything a colony's finished chambers pay out per second, gathered in
   * one pass so the simulation does not walk the list once per effect. */
  function colonyIncome(game, colonyId) {
    let biomass = 0, energy = 0;
    for (const s of all(game)) {
      if (!s.done || s.colonyId !== colonyId || s.controlled === false) continue;
      const type = TYPES[s.type];
      const mul = tierMul(s) * (CM.influence ? CM.influence.incomeMul(game, s) : 1);
      if (type.energyRate) energy += type.energyRate * mul;
      if (type.requiresVein && s.veinId) {
        const vein = (game.world.veins || []).find(v => v.id === s.veinId);
        if (vein && vein.remaining > 0) {
          // A vein is finite: the abyssal economy is a windfall to be used,
          // not a permanent fountain.
          const rate = 2.4 * mul;
          biomass += rate;
          vein.remaining = Math.max(0, vein.remaining - rate);
        }
      }
    }
    return { biomass, energy };
  }

  function hasSanctum(game, colonyId) {
    return all(game).some(s => s.done && s.controlled !== false && s.colonyId === colonyId && TYPES[s.type].endgame);
  }
  function sanctumProgress(game, colonyId) {
    let best = 0;
    for (const s of all(game)) {
      if (s.colonyId !== colonyId || !TYPES[s.type].endgame) continue;
      best = Math.max(best, s.done ? 1 : s.work / s.workNeeded);
    }
    return best;
  }

  function deepestOf(game, colonyId) {
    let d = 0;
    for (const s of all(game)) {
      if (s.done && s.controlled !== false && s.colonyId === colonyId && s.type !== 'NEXUS' && s.depth > d) d = s.depth;
    }
    return d;
  }

  function storageBonus(game, colonyId) {
    let bonus = 0;
    for (const s of all(game)) {
      if (s.done && s.controlled !== false && s.colonyId === colonyId && TYPES[s.type].storageBonus) {
        bonus += TYPES[s.type].storageBonus * tierMul(s);
      }
    }
    return bonus;
  }

  /* Research multiplier from vaults covering the observing organism. */
  function researchMultiplier(game, org) {
    const vault = nearestOfType(game, org.ownerId, 'VAULT', org.x, org.y)
               || nearestOfType(game, org.ownerId, 'RELIQUARY', org.x, org.y);
    let m = vault ? (1 + (TYPES[vault.type].researchBonus - 1) * tierMul(vault)) : 1;
    if (CM.layers) m *= CM.layers.researchMul(game, org);
    return m;
  }

  /* Where a colony should dig next if it is expanding on its own. Picks a
   * point at the edge of the current network, biased toward ground the
   * colony actually wants: water for cisterns, open land otherwise. */
  function suggestExpansion(game, colony) {
    const mine = completed(game, colony.id);
    if (!mine.length) {
      // No network yet: the first thing is always a shaft near the Core.
      for (let i = 0; i < 24; i++) {
        const a = Math.random() * Math.PI * 2, r = 6 + Math.random() * 8;
        const x = colony.x + Math.cos(a) * r, y = colony.y + Math.sin(a) * r;
        if (canPlace(game, colony, 'SHAFT', x, y).ok) return { typeKey: 'SHAFT', x, y };
      }
      return null;
    }
    const wanted = pickWantedType(game, colony);
    const wantedType = TYPES[wanted];
    let pool = mine;
    if (wantedType && wantedType.depth) {
      const same = mine.filter(s => Math.abs(s.depth - wantedType.depth) <= 1);
      if (same.length) pool = same;
    }
    const anchor = pool[Math.floor(Math.random() * pool.length)];
    for (let i = 0; i < 28; i++) {
      const a = Math.random() * Math.PI * 2, r = MIN_SPACING + Math.random() * (LINK_RANGE - MIN_SPACING);
      const x = anchor.x + Math.cos(a) * r, y = anchor.y + Math.sin(a) * r;
      if (canPlace(game, colony, wanted, x, y).ok) return { typeKey: wanted, x, y };
    }
    return null;
  }

  /* What this colony is short of. Deliberately reads live state rather than
   * a fixed build order, so an inland colony digs cisterns and a besieged
   * one digs redoubts. */
  const STANCES = {
    SETTLE: { label: 'Settle', hint: 'Fill this layer. No next stair until it is ready.' },
    FORTIFY: { label: 'Fortify', hint: 'Defense rooms and posts. Hold what you have.' },
    HARVEST: { label: 'Harvest', hint: 'Water, food, heat, veins. Income first.' },
    BREED: { label: 'Breed', hint: 'Nurseries and mustering halls.' },
    PUSH: { label: 'Push', hint: 'Cut the next spine the moment this layer is settled.' },
    QUIET: { label: 'Quiet', hint: 'No auto-expand on this layer.' }
  };
  const STANCE_ORDER = ['SETTLE', 'FORTIFY', 'HARVEST', 'BREED', 'PUSH', 'QUIET'];

  function stanceOf(colony, depth) {
    if (!colony.layerStance) colony.layerStance = {};
    return colony.layerStance[depth] || 'SETTLE';
  }
  function setStance(colony, depth, stance) {
    if (!colony.layerStance) colony.layerStance = {};
    if (!STANCES[stance]) return;
    colony.layerStance[depth] = stance;
  }
  function setLayerRally(colony, depth, x, y, siteId) {
    if (!colony.layerRally) colony.layerRally = {};
    if (x == null) { delete colony.layerRally[depth]; return; }
    colony.layerRally[depth] = { x, y, siteId: siteId || null };
  }

  function stancePick(game, colony, depth) {
    const stance = stanceOf(colony, depth);
    if (stance === 'QUIET') return null;
    const have = {};
    for (const s of completed(game, colony.id)) {
      if (s.depth === depth) have[s.type] = (have[s.type] || 0) + 1;
    }
    const missing = (keys) => {
      for (const k of keys) {
        if (TYPES[k] && TYPES[k].depth === depth && !have[k] && isPermitted(colony, k, depth)) return k;
      }
      return null;
    };
    if (stance === 'FORTIFY') {
      return missing(['REDOUBT', 'BASTION', 'CITADEL', 'KEEP', 'WARREN', 'MUSTER']) || missing(['REDOUBT']);
    }
    if (stance === 'HARVEST') {
      return missing(['CISTERN', 'GRANARY', 'FUNGARIUM', 'SPOREWELL', 'AQUEDUCT', 'GEOTHERMAL', 'VEINWORKS', 'HEARTH', 'SEAM']);
    }
    if (stance === 'BREED') return missing(['NURSERY', 'MUSTER']);
    if (stance === 'PUSH') {
      if (CM.layers && CM.layers.layerReady(game, colony, depth).ok && depth < 9) {
        const spines = [null, 'SHAFT', 'DESCENT', 'WELL', 'GALLERY', 'CLEFT', 'CHASM', 'MANTLE', 'ABYSS', 'GATE'];
        return spines[depth + 1];
      }
      return CM.layers ? CM.layers.wantedOnLayer(game, colony, depth) : null;
    }
    return CM.layers ? CM.layers.wantedOnLayer(game, colony, depth) : null;
  }

  function pickWantedType(game, colony) {
    const have = {};
    for (const s of completed(game, colony.id)) have[s.type] = (have[s.type] || 0) + 1;
    const deepest = deepestOf(game, colony.id);

    if (deepest >= 1) {
      const stance = stanceOf(colony, deepest);
      if (stance === 'QUIET') {
        // Quiet deepest: only fill a critical shallow need, never push.
      } else {
        const pick = stancePick(game, colony, deepest);
        if (pick && isPermitted(colony, pick)) return pick;
      }
    }

    // Shallow needs first — a colony that cannot drink has no business
    // sinking a descent.
    const dry = !W.findNearestWater(game.world, colony.x, colony.y, 30);
    if (dry && !have.CISTERN && isPermitted(colony, 'CISTERN')) return 'CISTERN';
    if (!have.WARREN && isPermitted(colony, 'WARREN')) return 'WARREN';
    if (colony.biomass >= colony.biomassCap * 0.95 && !have.GRANARY && isPermitted(colony, 'GRANARY')) return 'GRANARY';

    // Fill the current layer before cutting the next spine. Rushing the
    // ladder is how a colony arrives at a Gate with nothing to hold.
    if (CM.layers && deepest >= 1 && deepest < 9) {
      const fill = CM.layers.wantedOnLayer(game, colony, deepest);
      if (fill) return fill;
      const ready = CM.layers.layerReady(game, colony, deepest);
      if (!ready.ok) {
        const more = CM.layers.wantedOnLayer(game, colony, deepest);
        if (more) return more;
      }
    }

    const spines = [null, 'SHAFT', 'DESCENT', 'WELL', 'GALLERY', 'CLEFT', 'CHASM', 'MANTLE', 'ABYSS', 'GATE'];
    if (deepest >= 1 && deepest < 9 && !have[spines[deepest + 1]]) {
      if (!CM.layers || CM.layers.layerReady(game, colony, deepest).ok) return spines[deepest + 1];
    }

    if (deepest >= 2) {
      if (colony.losses > 6 && !have.REDOUBT) return 'REDOUBT';
      if (!have.NURSERY) return 'NURSERY';
      if (!have.FUNGARIUM) return 'FUNGARIUM';
      if (!have.VAULT) return 'VAULT';
    }
    if (deepest >= 3) {
      if (!have.GEOTHERMAL) return 'GEOTHERMAL';
      if (nearestVein(game, colony.x, colony.y, 40) && !have.VEINWORKS) return 'VEINWORKS';
    }
    if (deepest >= 4 && !have.SPOREWELL) return 'SPOREWELL';
    if (deepest >= 5 && !have.RESONATOR) return 'RESONATOR';
    if (deepest >= 6 && (colony.losses > 4 || !have.BASTION) && !have.BASTION) return 'BASTION';
    if (deepest >= 7 && !have.HEARTH) return 'HEARTH';
    if (deepest >= 8 && !have.CITADEL) return 'CITADEL';
    if (deepest >= 9 && !have.KEEP) return 'KEEP';
    if (deepest >= 3 && !have.SANCTUM && colony.biomass > 150) return 'SANCTUM';
    if (deepest >= 8 && !have.CRYPT && colony.biomass > 200) return 'CRYPT';

    const pool = deepest >= 6
      ? ['BASTION', 'CITADEL', 'FUNGARIUM', 'SPOREWELL', 'REDOUBT']
      : deepest >= 2
        ? ['WARREN', 'CISTERN', 'GRANARY', 'NURSERY', 'REDOUBT', 'FUNGARIUM']
        : ['WARREN', 'CISTERN', 'GRANARY'];
    const allowed = pool.filter(k => isPermitted(colony, k));
    const pick = allowed.length ? allowed : pool;
    return pick[Math.floor(Math.random() * pick.length)];
  }

  const LABOR_KEYS = ['dig', 'guard', 'harvest', 'breed'];
  const LABOR_LABEL = { dig: 'Dig', guard: 'Guard', harvest: 'Forage', breed: 'Breed' };
  function laborOf(colony, depth) {
    if (!colony.layerLabor) colony.layerLabor = {};
    const cur = colony.layerLabor[depth];
    if (cur) return cur;
    return { dig: 1, guard: 1, harvest: 1, breed: 1 };
  }
  function bumpLabor(colony, depth, key) {
    if (!LABOR_KEYS.includes(key)) return laborOf(colony, depth);
    const cur = Object.assign({}, laborOf(colony, depth));

    REDOUBT: { defense: 1 },

    GEOTHERMAL: { heat: 1 },
    VEINWORKS: { food: 1 },

    WELL: { spine: 1 },
    GALLERY: { spine: 1 },
    SPOREWELL: { food: 1 },
    AQUEDUCT: { water: 1 },
    CLEFT: { spine: 1 },
    RESONATOR: { research: 0.85, spine: 0.2 },
    RELIQUARY: { research: 1 },
    CHASM: { spine: 1 },
    BASTION: { defense: 1 },
    MANTLE: { spine: 1 },
    HEARTH: { heat: 1 },
