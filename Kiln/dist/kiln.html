<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiln — a social app you leave when you are done</title>
<meta name="description" content="A social app for making things: no likes, no counts, no streaks, no notifications, a feed that ends, and a tab that shows you exactly how the other apps hook you.">
<meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<style>
/* Kiln — the skin.
 *
 * Warm neutrals and a single terracotta accent, because the app is about
 * making things with your hands and a cold blue interface would be lying
 * about that. One accent only, carrying every active and live state.
 *
 * Two rules with teeth:
 *
 *   Nothing in this stylesheet is red-badge urgent. There is no colour
 *   reserved for "you have missed something", because there is nothing in
 *   this app you can miss. The accent means "this is on", never "come here".
 *
 *   Every card in the feed is the same width, the same weight, and the same
 *   size. There is no visual hierarchy between people. A feed where some
 *   cards are bigger has already told you who matters.
 *
 * Serif is used for the prompt and for written pieces — those are the two
 * places where the app is prose rather than interface, and the change of
 * voice is the signal.
 */

/* --- tokens: the complete light palette lives on bare :root --------------- */
:root {
  color-scheme: light;

  --bg: #f4f1ec;
  --surface: #fffdfa;
  --surface-2: #eae5dc;
  --surface-3: #ded7cb;

  --ink: #1d1b18;
  --ink-2: #57514a;
  --ink-3: #857d73;

  --line: #d8d1c6;
  --line-soft: #e7e1d7;

  --accent: #a8492e;
  --accent-strong: #8a3a23;
  --accent-ink: #fffdfa;
  --accent-soft: rgba(168, 73, 46, 0.14);
  --accent-band: rgba(168, 73, 46, 0.07);

  --good: #3f6d4a;
  --warn: #8a6519;

  --shadow-1: 0 1px 2px rgba(29, 27, 24, 0.06), 0 1px 1px rgba(29, 27, 24, 0.04);
  --shadow-2: 0 12px 40px rgba(29, 27, 24, 0.18);

  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-read: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --r-sm: 6px;
  --r: 12px;
  --r-lg: 18px;

  --pad: 1rem;
  --wrap: 44rem;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #14161a;
    --surface: #1c1f24;
    --surface-2: #242830;
    --surface-3: #2f343d;

    --ink: #ece7df;
    --ink-2: #b0a89d;
    --ink-3: #7f7a72;

    --line: #333942;
    --line-soft: #272c34;

    --accent: #e0866a;
    --accent-strong: #f0a189;
    --accent-ink: #17191d;
    --accent-soft: rgba(224, 134, 106, 0.18);
    --accent-band: rgba(224, 134, 106, 0.09);

    --good: #7fb98c;
    --warn: #d5ac5a;

    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-2: 0 12px 40px rgba(0, 0, 0, 0.55);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14161a;
  --surface: #1c1f24;
  --surface-2: #242830;
  --surface-3: #2f343d;
  --ink: #ece7df;
  --ink-2: #b0a89d;
  --ink-3: #7f7a72;
  --line: #333942;
  --line-soft: #272c34;
  --accent: #e0866a;
  --accent-strong: #f0a189;
  --accent-ink: #17191d;
  --accent-soft: rgba(224, 134, 106, 0.18);
  --accent-band: rgba(224, 134, 106, 0.09);
  --good: #7fb98c;
  --warn: #d5ac5a;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-2: 0 12px 40px rgba(0, 0, 0, 0.55);
}

/* --- base ---------------------------------------------------------------- */
* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 1rem/1.55 var(--font-ui);
  padding-bottom: env(safe-area-inset-bottom);
}

h1, h2, h3 { margin: 0; font-weight: 650; line-height: 1.25; }
p { margin: 0 0 0.7em; }
p:last-child { margin-bottom: 0; }
ul { margin: 0; padding-left: 1.1rem; }

button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: 0.45; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

.muted { color: var(--ink-3); }
.tiny { font-size: 0.75rem; }
.small { font-size: 0.85rem; }
.pad { margin-top: 1rem; }

.sec { font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.sec.big {
  font-size: 1.25rem; letter-spacing: 0; text-transform: none; color: var(--ink);
  margin: 1.8rem 0 0.5rem;
}
.sec.tiny { font-size: 0.7rem; }

.lede { font-size: 1.05rem; color: var(--ink-2); }

/* --- chrome -------------------------------------------------------------- */
#app { min-height: 100vh; display: flex; flex-direction: column; }

.bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: 0.6rem var(--pad);
  padding-top: calc(0.6rem + env(safe-area-inset-top));
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line-soft);
}
.bar.hushed { opacity: 0.35; pointer-events: none; }

.mark { display: flex; align-items: baseline; gap: 0.5rem; min-width: 0; }
.mark b { font-size: 1.05rem; letter-spacing: 0.01em; }
.mark span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.done-btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 0.35rem 0.85rem;
  font-size: 0.82rem;
  white-space: nowrap;
}
.done-btn:hover { border-color: var(--accent); color: var(--accent); }

main {
  display: block;
  width: 100%;
  max-width: var(--wrap);
  margin: 0 auto;
  padding: var(--pad);
  padding-bottom: 6.5rem;
}
main:focus { outline: none; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line-soft);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  flex: 1 1 0;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: 0; background: none;
  padding: 0.5rem 0.2rem 0.55rem;
  color: var(--ink-3);
  border-top: 2px solid transparent;
  margin-top: -1px;
}
.tab.on { color: var(--accent); border-top-color: var(--accent); }
.tab-mark { font-size: 1.05rem; line-height: 1; }
.tab-label { font-size: 0.66rem; letter-spacing: 0.02em; }

/* --- shared bits --------------------------------------------------------- */
.view { animation: rise 0.18s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } }
@media (prefers-reduced-motion: reduce) {
  .view { animation: none; }
}

.tool-btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-sm);
  padding: 0.45rem 0.8rem;
  font-size: 0.88rem;
}
.tool-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.tool-btn.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tool-btn.go:hover:not(:disabled) { background: var(--accent-strong); color: var(--accent-ink); }
.tool-btn.quiet { background: transparent; color: var(--ink-3); }
.tool-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tool-btn.danger { border-color: var(--accent); color: var(--accent); }

.big-btn {
  border: 0;
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: var(--r);
  padding: 0.8rem 1.4rem;
  font-size: 1rem;
  font-weight: 600;
}
.big-btn:hover { background: var(--accent-strong); }

.link-btn {
  border: 0; background: none; padding: 0 0 0 0.5rem;
  color: var(--accent); text-decoration: underline; font-size: 0.8rem;
}

.chip {
  font-size: 0.7rem; letter-spacing: 0.03em;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.12rem 0.5rem;
  color: var(--ink-3);
  white-space: nowrap;
}
.chip.chip-out { border-color: var(--accent); color: var(--accent); }

.avatar {
  display: grid; place-items: center;
  width: 2rem; height: 2rem;
  border-radius: 999px;
  background: hsl(var(--hue) 42% 88%);
  color: hsl(var(--hue) 55% 25%);
  font-size: 0.9rem;
  flex: none;
}
.avatar.small { width: 1.5rem; height: 1.5rem; font-size: 0.7rem; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .avatar {
    background: hsl(var(--hue) 30% 26%);
    color: hsl(var(--hue) 55% 82%);
  }
}

.who { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
.who-text { display: flex; flex-direction: column; min-width: 0; }
.who-text span { font-size: 0.75rem; }

/* --- studio -------------------------------------------------------------- */
.prompt-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 1.1rem;
  box-shadow: var(--shadow-1);
}
.prompt-eyebrow {
  display: flex; justify-content: space-between; gap: 1rem;
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--ink-3);
  margin-bottom: 0.5rem;
}
.prompt-text {
  font-family: var(--font-read);
  font-size: 1.45rem;
  font-weight: 500;
  line-height: 1.25;
  margin-bottom: 0.6rem;
}

.craft-pick {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;
  margin: 1rem 0;
}
.craft {
  position: relative;
  display: flex; flex-direction: column; align-items: flex-start; gap: 0.15rem;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--r);
  padding: 0.7rem 0.6rem;
  text-align: left;
}
.craft.suits { border-color: var(--accent-soft); background: var(--accent-band); }
.craft.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.craft-mark { font-size: 1.15rem; }
.suits-tag {
  position: absolute; top: 0.45rem; right: 0.5rem;
  font-size: 0.6rem; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--accent);
}
@media (max-width: 30rem) {
  .craft-pick { grid-template-columns: 1fr; }
  .craft { flex-direction: row; align-items: center; gap: 0.6rem; }
  .craft .tiny { display: none; }
}

.tool-host { margin: 0.5rem 0 1rem; }
.empty-note {
  border: 1px dashed var(--line);
  border-radius: var(--r);
  padding: 1.2rem;
  color: var(--ink-3);
  font-size: 0.9rem;
}

.keep-inner {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem;
  border-top: 1px solid var(--line-soft);
  padding-top: 0.9rem;
}
.title-in, .resp-in {
  flex: 1 1 12rem;
  border: 1px solid var(--line);
  background: var(--surface);
  color: inherit;
  border-radius: var(--r-sm);
  padding: 0.5rem 0.65rem;
  font: inherit;
  font-size: 0.9rem;
  min-width: 0;
}
.title-in.wide { flex: 1 1 100%; margin: 1rem 0; }

.aud-wrap { display: flex; align-items: center; gap: 0.5rem; flex: 1 1 100%; flex-wrap: wrap; }
.lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
.aud { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.aud-opt {
  display: flex; flex-direction: column; align-items: flex-start;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-sm);
  padding: 0.4rem 0.6rem;
  text-align: left;
  max-width: 15rem;
}
.aud-opt.on { border-color: var(--accent); background: var(--accent-band); }
.keep-msg { flex: 1 1 100%; font-size: 0.85rem; color: var(--accent); margin: 0; }

.today-mine { margin-top: 1.6rem; }

/* --- draw ---------------------------------------------------------------- */
.draw-stage {
  position: relative;
  aspect-ratio: 4 / 3;
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
  background: var(--surface-2);
}
.draw-canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

.draw-bar { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.6rem; flex-wrap: wrap; }
.draw-bar.split { justify-content: space-between; }

.swatches { display: flex; gap: 0.3rem; flex-wrap: wrap; }
.swatch {
  width: 1.65rem; height: 1.65rem; border-radius: 999px;
  border: 2px solid var(--line);
  padding: 0;
}
.swatch.on { border-color: var(--ink); transform: scale(1.14); }

.sizes, .papers { display: flex; gap: 0.25rem; }
.size {
  display: grid; place-items: center;
  width: 1.8rem; height: 1.8rem;
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm);
  padding: 0;
}
.size i { display: block; background: var(--ink); border-radius: 999px; }
.size.on { border-color: var(--accent); background: var(--accent-band); }

.paper {
  width: 1.5rem; height: 1.8rem; border-radius: 3px;
  border: 1px solid var(--line); padding: 0;
}
.paper.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

.draw-acts { display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
.draw-count { font-size: 0.72rem; color: var(--ink-3); }

/* --- write --------------------------------------------------------------- */
.write-area {
  width: 100%;
  min-height: 14rem;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface);
  color: inherit;
  padding: 1rem;
  font: 1.02rem/1.6 var(--font-read);
  resize: vertical;
}
.write-meter { font-size: 0.72rem; color: var(--ink-3); text-align: right; margin-top: 0.3rem; }
.write-hint { font-size: 0.78rem; color: var(--ink-3); margin-top: 0.3rem; }

/* --- beat ---------------------------------------------------------------- */
.beat-grid { display: flex; flex-direction: column; gap: 0.3rem; }
.beat-row { display: flex; align-items: center; gap: 0.5rem; }
.beat-name {
  width: 3.1rem; flex: none;
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3);
}
.beat-steps { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; flex: 1; }
.step {
  aspect-ratio: 1;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 3px;
  padding: 0;
  display: grid; place-items: center;
  min-width: 0;
}
.step i { font-size: 0.55rem; opacity: 0; font-style: normal; }
.step.beat1 { background: var(--surface-2); }
.step.on { background: var(--accent); border-color: var(--accent); }
.step.on i { opacity: 1; color: var(--accent-ink); }
.step.now { box-shadow: inset 0 0 0 2px var(--ink); }

.beat-bar { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.7rem; flex-wrap: wrap; }
.tempo-wrap { display: flex; align-items: center; gap: 0.4rem; flex: 1 1 10rem; }
.tempo { flex: 1; accent-color: var(--accent); min-width: 6rem; }
.tempo-label { font-size: 0.72rem; color: var(--ink-3); white-space: nowrap; }

.beat-play { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 0.35rem 0.7rem; font-size: 0.82rem; }
.beat-play.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* --- cards --------------------------------------------------------------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 0.9rem;
  margin: 0.8rem 0;
  box-shadow: var(--shadow-1);
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 0.7rem; margin-bottom: 0.6rem; }
.card-title { font-family: var(--font-read); font-size: 1.05rem; margin-bottom: 0.4rem; }
.card-note { font-size: 0.85rem; color: var(--ink-2); margin-top: 0.5rem; }
.card-foot { display: flex; justify-content: flex-end; margin-top: 0.5rem; }

.work-draw { border-radius: var(--r); overflow: hidden; border: 1px solid var(--line-soft); }
.work-canvas { display: block; width: 100%; }
.work-write { font-family: var(--font-read); font-size: 1.02rem; line-height: 1.6; }
.work-beat { display: flex; flex-direction: column; gap: 0.5rem; }
.beat-strip { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; }
.strip-cell { height: 1.7rem; background: var(--surface-2); border-radius: 3px; }
.strip-cell.on { background: var(--accent-soft); }
.strip-cell.now { box-shadow: inset 0 0 0 2px var(--accent); }
.beat-foot { display: flex; align-items: center; gap: 0.6rem; }

.why-btn {
  border: 0; background: none; padding: 0;
  font-size: 0.72rem; color: var(--ink-3); text-decoration: underline dotted;
}
.why-btn:hover { color: var(--accent); }
.why-box {
  margin-top: 0.4rem; font-size: 0.8rem; color: var(--ink-2);
  border-left: 2px solid var(--accent); padding-left: 0.6rem;
}

.practice-hit { margin-top: 0.5rem; }
.responses { margin-top: 0.8rem; border-top: 1px solid var(--line-soft); padding-top: 0.7rem; }
.resp { display: flex; gap: 0.5rem; align-items: flex-start; margin: 0.45rem 0; font-size: 0.88rem; }

/* --- respond ------------------------------------------------------------- */
.respond { margin-top: 0.8rem; border-top: 1px solid var(--line-soft); padding-top: 0.7rem; }
.say-btn {
  border: 1px solid var(--line); background: none;
  border-radius: 999px; padding: 0.3rem 0.8rem; font-size: 0.8rem; color: var(--ink-3);
}
.say-btn:hover { border-color: var(--accent); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.5rem; }
.chip-btn {
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 0.25rem 0.65rem; font-size: 0.8rem;
}
.chip-btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.resp-row { display: flex; gap: 0.4rem; align-items: center; }
.cool {
  margin-top: 0.5rem; font-size: 0.82rem;
  border-left: 2px solid var(--warn); padding-left: 0.6rem; color: var(--ink-2);
}

/* --- feed ---------------------------------------------------------------- */
.feed-head { margin-bottom: 0.5rem; }
.quiet-chip { text-transform: lowercase; }

.gate {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 1.4rem; text-align: left;
}
.gate-acts { display: flex; gap: 0.6rem; flex-wrap: wrap; margin: 1rem 0 0.8rem; }

.end-card { text-align: center; padding: 2rem 1rem 1rem; }
.end-rule { width: 3rem; height: 1px; background: var(--line); margin: 0 auto 1.2rem; }
.end-card h2 { font-family: var(--font-read); font-size: 1.3rem; margin-bottom: 0.5rem; }
.end-card p { max-width: 30rem; margin-left: auto; margin-right: auto; font-size: 0.9rem; }

/* --- shelf --------------------------------------------------------------- */
.welcome-back {
  background: var(--accent-band); border: 1px solid var(--accent-soft);
  border-radius: var(--r); padding: 0.9rem; margin-bottom: 1rem;
}
.welcome-back p { margin-top: 0.3rem; font-size: 0.9rem; color: var(--ink-2); }

.ladders { display: grid; gap: 0.7rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
.ladder { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 0.9rem; }
.ladder-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }

.practice { list-style: none; padding: 0; margin: 0.6rem 0 0.5rem; }
.practice li { display: flex; gap: 0.45rem; align-items: baseline; font-size: 0.82rem; margin: 0.3rem 0; }
.practice li.done { color: var(--ink); }
.practice li:not(.done) { color: var(--ink-3); }
.tick { color: var(--accent); flex: none; }
.practice li:not(.done) .tick { color: var(--line); }

.day-sep {
  margin: 1.6rem 0 0.4rem;
  padding-bottom: 0.3rem;
  border-bottom: 1px solid var(--line-soft);
  font-size: 0.8rem;
}
.sep-prompt { font-style: italic; }

/* --- watchtower ---------------------------------------------------------- */
.tower-head { margin-bottom: 1rem; }
.tower-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); margin: 0.5rem 0; overflow: hidden;
}
.tower-card.open { border-color: var(--accent-soft); }
.tower-head-btn {
  width: 100%; display: flex; gap: 0.7rem; align-items: flex-start;
  border: 0; background: none; text-align: left; padding: 0.85rem;
}
.tower-head-btn div { display: flex; flex-direction: column; min-width: 0; }
.tower-n { color: var(--accent); flex: none; width: 1rem; }

<div id="app"></div>

<noscript>
  <p style="padding:2rem;font:1rem/1.6 system-ui,sans-serif">
    Kiln is a drawing, writing and music tool, so it needs JavaScript. It does not
    need a network — once this page has loaded you can turn the network off.
  </p>
</noscript>

<script>
/* Kiln — shared helpers: RNG, days, DOM, persistence.
 *
 * Two rules hold this file together and most of the app follows from them:
 *
 *   1. Randomness that anyone else can see must be deterministic. The circle
 *      is simulated, and a peer who made a different drawing every time you
 *      reloaded would be a slot machine wearing a friend's name. Everything
 *      about a peer's day comes out of seeded(day, peerId), so the day is the
 *      day whether you look once or forty times.
 *
 *   2. Nothing leaves the device. There is no fetch, no XHR, no beacon, no
 *      WebSocket anywhere in this app, and tools/build.mjs fails the build if
 *      one appears. Storage is localStorage and the user can read and erase
 *      all of it from inside the app.
 */
(function (K) {
  'use strict';

  const SAVE_KEY = 'kiln/save/v1';
  const SAVE_VERSION = 1;

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const lerp = (a, b, t) => a + (b - a) * t;

  /* --- deterministic randomness ------------------------------------------
   * mulberry32 off a string hash. Same seed, same stream, forever. */
  function hash(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function seeded(...parts) {
    let a = hash(parts.join('|'));
    const rng = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    rng.int = (lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
    rng.pick = arr => arr[Math.floor(rng() * arr.length)];
    rng.chance = p => rng() < p;
    rng.shuffle = arr => {
      const a2 = arr.slice();
      for (let i = a2.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        const t = a2[i]; a2[i] = a2[j]; a2[j] = t;
      }
      return a2;
    };
    /* Pick without repeating until the pool is exhausted — peers should not
     * say the same word four times in a row just because the die is fair. */
    rng.some = (arr, n) => rng.shuffle(arr).slice(0, clamp(n, 0, arr.length));
    return rng;
  }

  /* --- days --------------------------------------------------------------
   * A day is a local calendar day, not 24 hours from signup. Rolling over at
   * midnight local time is the honest version: it does not quietly move the
   * finish line based on when you happened to open the app.
   *
   * `offset` is the demo control in Settings. It is stored, visible, and
   * labelled as a demo — it exists so the "you were away" paths can be seen
   * without waiting a week, and it is never used to manufacture urgency. */
  let dayOffset = 0;
  function setDayOffset(n) { dayOffset = n | 0; }
  function getDayOffset() { return dayOffset; }

  function today() {
    const d = new Date();
    const local = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
    return Math.floor(local / 86400000) + dayOffset;
  }

  /* A day index maps straight to a calendar date, offset included — moving
   * the demo clock forward really does move the date, so the app never shows
   * one date while reasoning about another. */
  function dayLabel(day) {
    const d = new Date(day * 86400000);
    return d.toLocaleDateString(undefined, {
      weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC'
    });
  }

  function dayShort(day) {
    const d = new Date(day * 86400000);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });
  }

  function agoWords(days) {
    if (days <= 0) return 'today';
    if (days === 1) return 'yesterday';
    if (days < 7) return days + ' days ago';
    if (days < 14) return 'last week';
    if (days < 60) return Math.round(days / 7) + ' weeks ago';
    return Math.round(days / 30) + ' months ago';
  }

  function plural(n, one, many) {
    return n + ' ' + (n === 1 ? one : (many || one + 's'));
  }

  function minutesWords(ms) {
    const m = Math.floor(ms / 60000);
    const s = Math.floor(ms / 1000) % 60;
    if (m < 1) return s + ' seconds';
    if (m < 60) return plural(m, 'minute');
    const h = Math.floor(m / 60);
    return plural(h, 'hour') + (m % 60 ? ' ' + plural(m % 60, 'minute') : '');
  }

  /* --- DOM ---------------------------------------------------------------- */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));

  function el(tag, attrs, kids) {
    const n = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') n.className = v;
        else if (k === 'text') n.textContent = v;
        else if (k === 'html') n.innerHTML = v;
        else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
        else if (k === 'data') { for (const d in v) n.dataset[d] = v[d]; }
        else n.setAttribute(k, v === true ? '' : v);
      }
    }
    if (kids) {
      for (const kid of [].concat(kids)) {
        if (kid === null || kid === undefined || kid === false) continue;
        n.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
      }
    }
    return n;
  }

  function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* --- persistence -------------------------------------------------------- */
  function save(state) {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ v: SAVE_VERSION, t: Date.now(), s: state }));
      return true;
    } catch (e) {
      return false;   // private mode, quota, a locked-down browser — never fatal
    }
  }

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const p = JSON.parse(raw);
      return p && p.s ? p.s : null;
    } catch (e) {
      return null;
    }
  }

  function saveBytes() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      return raw ? raw.length : 0;
    } catch (e) { return 0; }
  }

  function erase() {
    try { localStorage.removeItem(SAVE_KEY); return true; } catch (e) { return false; }
  }

  function bytesWords(n) {
    if (n < 1024) return n + ' bytes';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' kB';
    return (n / 1048576).toFixed(2) + ' MB';
  }

  function uid(prefix) {
    return (prefix || 'x') + '-' + Date.now().toString(36) + '-' +
      Math.floor(Math.random() * 1e6).toString(36);
  }

  const reducedMotion = () =>
    window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  K.core = {
    SAVE_KEY, clamp, lerp, hash, seeded,
    today, dayLabel, dayShort, agoWords, setDayOffset, getDayOffset,
    plural, minutesWords, bytesWords,
    $, $$, el, clear, esc,
    save, load, erase, saveBytes, uid, reducedMotion
  };
})(window.Kiln = window.Kiln || {});

</script>
<script>
/* Kiln — every table the app reads from.
 *
 * Content choices here are load-bearing, so they are argued rather than
 * listed. Three rules govern this file:
 *
 *   Prompts are about the world, never about the self. Not one prompt asks
 *   for a face, a body, a bedroom, a possession, or a ranking. Every prompt
 *   that asks "what do you think" is answerable by someone with nothing.
 *   A prompt that rewards having things is a prompt that punishes not having
 *   them, and eleven-year-olds notice long before they can say so.
 *
 *   Praise is specific and about the work. "Nice!" is noise; "the ending
 *   surprised me" is information a person can build on. The whole vocabulary
 *   points at the thing made, never at the maker's worth.
 *
 *   Peers are ordinary. They skip days, they make rough things, they are
 *   sometimes better than you and sometimes not. Nobody in this circle is a
 *   professional pretending to be a peer, which is the single most corrosive
 *   thing about the feeds this app is a response to.
 */
(function (K) {
  'use strict';

  /* --- the daily prompt ---------------------------------------------------
   * Everyone in your circle gets the same one. Shared constraint turns a feed
   * from a competition into a comparison of minds — the interesting kind. It
   * also removes the "what do I post" pressure that pushes kids toward the
   * only subject always available to them, which is themselves. */
  const PROMPTS = [
    { t: 'A door that has been locked for a hundred years. What is behind it?', c: ['draw', 'write', 'beat'] },
    { t: 'The sound a city makes at 4am.', c: ['beat', 'write', 'draw'] },
    { t: 'Invent a weather that does not exist.', c: ['draw', 'write'] },
    { t: 'Something small that deserves a monument.', c: ['draw', 'write'] },
    { t: 'A map of somewhere you have never been.', c: ['draw', 'write'] },
    { t: 'The last thing in the universe. What is it doing?', c: ['write', 'draw'] },
    { t: 'Make something that gets faster.', c: ['beat', 'draw'] },
    { t: 'A creature built entirely wrong that is doing fine anyway.', c: ['draw', 'write'] },
    { t: 'Two colours that should not go together. Make them go together.', c: ['draw'] },
    { t: 'Write instructions for something impossible.', c: ['write'] },
    { t: 'The inside of a sound.', c: ['draw', 'beat'] },
    { t: 'A machine with one job. It does that job perfectly.', c: ['draw', 'write'] },
    { t: 'What does 3am feel like if you had to draw the feeling, not the room?', c: ['draw', 'beat'] },
    { t: 'A story in six words.', c: ['write'] },
    { t: 'Make a rhythm you could walk to.', c: ['beat'] },
    { t: 'Somewhere that is only real when nobody is looking.', c: ['draw', 'write'] },
    { t: 'The worst possible superpower. Make it sound great.', c: ['write', 'draw'] },
    { t: 'A colour that has no name yet. Name it.', c: ['draw', 'write'] },
    { t: 'Draw a place using only straight lines.', c: ['draw'] },
    { t: 'Something you know how to do that you could teach in four sentences.', c: ['write'] },
    { t: 'A beat that sounds like getting away with something.', c: ['beat'] },
    { t: 'What is under the floor?', c: ['draw', 'write'] },
    { t: 'Make the same shape five times, worse each time, on purpose.', c: ['draw'] },
    { t: 'A conversation between two things that cannot talk.', c: ['write'] },
    { t: 'The quietest thing you can make that is still interesting.', c: ['beat', 'draw'] },
    { t: 'An object from a hundred years from now, found in a field.', c: ['draw', 'write'] },
    { t: 'Describe a smell without naming what it is.', c: ['write'] },
    { t: 'A pattern that almost repeats.', c: ['draw', 'beat'] },
    { t: 'Something you changed your mind about.', c: ['write', 'draw'] },
    { t: 'A tiny room with one enormous thing in it.', c: ['draw'] },
    { t: 'The theme music for a very boring job.', c: ['beat'] },
    { t: 'Draw something you can only half remember.', c: ['draw'] },
    { t: 'A rule that everybody follows and nobody agreed to.', c: ['write', 'draw'] },
    { t: 'Make a thing out of exactly three parts.', c: ['draw', 'beat'] },
    { t: 'What does a plant think winter is?', c: ['write', 'draw'] },
    { t: 'The bit of a song that gets stuck. Make one.', c: ['beat'] },
    { t: 'Somewhere with bad weather and good light.', c: ['draw'] },
    { t: 'An apology from something that is not sorry.', c: ['write'] },
    { t: 'Build a beat that falls apart at the end.', c: ['beat'] },
    { t: 'The view from something very small.', c: ['draw', 'write'] },
    { t: 'A word for a feeling English does not have a word for.', c: ['write'] },
    { t: 'Draw the shape of a week.', c: ['draw'] },
    { t: 'Make something that sounds older than it is.', c: ['beat'] },
    { t: 'A place that is 90% sky.', c: ['draw', 'write'] },
    { t: 'Something that got left behind. Not sad about it.', c: ['write', 'draw'] },
    { t: 'The most useful lie.', c: ['write'] },
    { t: 'Two beats fighting. One wins.', c: ['beat'] },
    { t: 'Draw the same object from a viewpoint nobody picks.', c: ['draw'] }
  ];

  /* --- crafts -------------------------------------------------------------
   * Three real tools, not three content formats. The difference matters: a
   * format is a shape you pour yourself into, a tool is a thing you get
   * better at. Getting better at something is the only durable reason to
   * open an app every day. */
  const CRAFTS = {
    draw: {
      id: 'draw', name: 'Draw', mark: '✏️',
      blurb: 'A limited palette and a canvas. The limits are the point.'

<script>
/* Kiln — the shape of everything that persists, and the day rollover.
 *
 * The whole state is a plain object the user can read in the Audit tab. That
 * is a design constraint, not a convenience: an app aimed at children should
 * not hold anything about them it would be awkward to show them.
 *
 * Note what is absent. No engagement score, no session count used against
 * you, no dwell time per post, no "last active" broadcast to anyone, no
 * consecutive-day counter. Those fields are missing because a field that
 * exists eventually gets used, and there is no version of "how long did they
 * hesitate over Priya's drawing" that helps the person hesitating.
 */
(function (K) {
  'use strict';
  const { today, clamp } = K.core;
  const C = K.content;

  const VERSION = 1;

  function newState() {
    const d = today();
    return {
      v: VERSION,
      name: '',
      onboarded: false,
      createdDay: d,
      lastDay: d,

      /* The charter: limits the user sets for themselves. See charter.js for
       * why loosening one waits until tomorrow and tightening one does not. */
      charter: {
        minutes: 20,        // session budget, self-chosen
        makeFirst: false,   // open the studio before the circle
        pending: []         // [{ key, value, from }] — loosenings in the post
      },

      pieces: [],           // everything you have made, oldest first
      practice: {},         // practiceId -> day completed
      given: {},            // postId -> { praise, text, day } you sent a peer
      seen: {},             // postId -> day you first saw it
      batch: { day: -1, ids: [] },
      days: [],             // [{ day, made, looked, ms, over }] one per day used
      read: [],             // Watchtower entries read through

      /* Feed ordering, user-editable, printed in plain English in Audit. */
      rules: { chrono: true, quiet: true, unseen: true, mycraft: false },

      demoOffset: 0
    };
  }

  function migrate(s) {
    if (!s || typeof s !== 'object') return null;
    const base = newState();
    /* Forward-compatible merge: unknown keys survive, missing keys fill in. */
    const out = Object.assign({}, base, s);
    out.charter = Object.assign({}, base.charter, s.charter || {});
    out.charter.pending = Array.isArray(out.charter.pending) ? out.charter.pending : [];
    out.rules = Object.assign({}, base.rules, s.rules || {});
    out.pieces = Array.isArray(s.pieces) ? s.pieces : [];
    out.days = Array.isArray(s.days) ? s.days : [];
    out.read = Array.isArray(s.read) ? s.read : [];
    out.practice = s.practice && typeof s.practice === 'object' ? s.practice : {};
    out.given = s.given && typeof s.given === 'object' ? s.given : {};
    out.seen = s.seen && typeof s.seen === 'object' ? s.seen : {};
    out.batch = s.batch && typeof s.batch === 'object' ? s.batch : { day: -1, ids: [] };
    out.v = VERSION;
    return out;
  }

  /* --- the day ------------------------------------------------------------
   * Everything time-dependent funnels through here so there is exactly one
   * place that can decide a new day has started. Returns how many days were
   * missed, which the shelf uses to say the "nothing was lost" line — the
   * only place in the app that mentions an absence at all. */
  function rollover(s) {
    const d = today();
    if (d === s.lastDay) return 0;

    const gap = d - s.lastDay;
    if (gap < 0) { s.lastDay = d; return 0; }   // clock moved back; no drama

    // Pending charter loosenings mature.
    const still = [];
    for (const p of s.charter.pending) {
      if (p.from <= d) s.charter[p.key] = p.value;
      else still.push(p);
    }
    s.charter.pending = still;

    s.batch = { day: -1, ids: [] };
    s.lastDay = d;
    return gap - 1;   // days entirely skipped
  }

  function dayRecord(s, day) {
    let rec = null;
    for (const r of s.days) if (r.day === day) { rec = r; break; }
    if (!rec) { rec = { day, made: 0, looked: 0, ms: 0, over: 0 }; s.days.push(rec); }
    return rec;
  }

  /* --- the prompt ---------------------------------------------------------
   * One prompt per calendar day, the same for everyone in the circle. Walking
   * the table by day index rather than picking randomly means the prompt is a
   * fact about the day, not a roll — you can be told tomorrow's if you ask. */
  function promptFor(day) {
    const n = C.PROMPTS.length;
    return C.PROMPTS[((day % n) + n) % n];
  }
  function promptIndex(day) {
    const n = C.PROMPTS.length;
    return ((day % n) + n) % n;
  }

  /* --- derived reads ------------------------------------------------------ */
  function piecesOn(s, day) { return s.pieces.filter(p => p.day === day); }
  function madeToday(s) { return piecesOn(s, today()).length; }

  function craftCount(s, craft) {
    let n = 0;
    for (const p of s.pieces) if (p.craft === craft) n++;
    return n;
  }

  function levelFor(count) {
    let cur = C.LEVELS[0], next = null;
    for (let i = 0; i < C.LEVELS.length; i++) {
      if (count >= C.LEVELS[i].at) cur = C.LEVELS[i];
      else { next = C.LEVELS[i]; break; }
    }
    return { cur, next };
  }

  function practiceDone(s, id) { return Object.prototype.hasOwnProperty.call(s.practice, id); }

  function addPiece(s, piece) {
    s.pieces.push(piece);
    dayRecord(s, piece.day).made++;
    return piece;
  }

  function markSeen(s, postId) {
    if (s.seen[postId] !== undefined) return false;
    s.seen[postId] = today();
    dayRecord(s, today()).looked++;
    return true;
  }

  K.state = {
    VERSION, newState, migrate, rollover, dayRecord,
    promptFor, promptIndex, piecesOn, madeToday, craftCount, levelFor,
    practiceDone, addPiece, markSeen, clamp
  };
})(window.Kiln = window.Kiln || {});

</script>
<script>
/* Kiln — the charter: limits you set on yourself, and the asymmetry that
 * makes them worth anything.
 *
 * A limit you can lift in the moment you want to lift it is not a limit; it
 * is a suggestion you will overrule exactly when overruling it matters. So:
 *
 *   Tightening a limit takes effect now.
 *   Loosening a limit takes effect tomorrow.
 *
 * That is the whole mechanism. It is the oldest trick there is — the sailor
 * lashed to the mast, the alarm clock across the room — and it belongs to
 * the user rather than being done to them. Crucially the app never refuses.
 * You can always raise the ceiling; the raise simply arrives when the urge
 * that produced it has passed, which is the only time a limit is tested.
 *
 * Everything about the delay is stated out loud before the first choice is
 * made. A commitment device you did not know you were signing is a trap, and
 * the difference between this and a dark pattern is entirely consent.
 */
(function (K) {
  'use strict';
  const { today, plural } = K.core;

  /* Which way is stricter for each setting. */
  const STRICTER = {
    minutes: (a, b) => a < b,      // fewer minutes is stricter
    makeFirst: (a, b) => a === true && b === false
  };

  const LABEL = {
    minutes: 'session length',
    makeFirst: 'make before you look'
  };

  function describe(key, value) {
    if (key === 'minutes') return plural(value, 'minute');
    if (key === 'makeFirst') return value ? 'on' : 'off';
    return String(value);
  }

  function pendingFor(s, key) {
    for (const p of s.charter.pending) if (p.key === key) return p;
    return null;
  }

  function dropPending(s, key) {
    s.charter.pending = s.charter.pending.filter(p => p.key !== key);
  }

  /* The single entry point for changing a charter setting. Returns a result
   * the interface can show verbatim — the user should never have to guess
   * whether their change took. */
  function propose(s, key, value) {
    const cur = s.charter[key];
    if (cur === value) {
      dropPending(s, key);
      return { applied: true, changed: false, text: 'No change.' };
    }

    const stricter = STRICTER[key] ? STRICTER[key](value, cur) : true;

    if (stricter) {
      // Tighter, now. Also cancels any looser change waiting in the post.
      dropPending(s, key);
      s.charter[key] = value;
      return {
        applied: true, changed: true,
        text: 'Done, from right now. ' + LABEL[key] + ' is ' + describe(key, value) + '.'
      };
    }

    // Looser: it waits.
    dropPending(s, key);
    const from = today() + 1;
    s.charter.pending.push({ key, value, from });
    return {
      applied: false, changed: true, from,
      text: 'Saved for tomorrow. You set this limit yourself, so loosening it ' +
            'takes a day — that way the decision is made by the version of you ' +
            'who is not in the middle of it. ' + LABEL[key] + ' stays ' +
            describe(key, cur) + ' today.'
    };
  }

  /* Cancelling a waiting loosening is itself a tightening, so it is instant. */
  function cancel(s, key) {
    dropPending(s, key);
  }

  function pendingSummary(s) {
    return s.charter.pending.map(p => ({
      key: p.key,
      label: LABEL[p.key],
      value: describe(p.key, p.value),
      from: p.from,
      days: Math.max(0, p.from - today())
    }));
  }

  /* Whether the circle is open yet under the user's own make-first rule.
   * Note that this never hides the tab or lies about why — see feed.js. */
  function circleOpen(s) {
    if (!s.charter.makeFirst) return true;
    return K.state.madeToday(s) > 0;
  }

  K.charter = { propose, cancel, pendingFor, pendingSummary, describe, circleOpen, LABEL };
})(window.Kiln = window.Kiln || {});

</script>
<script>
/* Kiln — the drawing format, its renderer, and the peers' hands.
 *
 * A drawing is a list of strokes in normalised 0..1 space, not a bitmap.
 * Three reasons, in order of how much they matter:
 *
 *   It stays sharp at any size, so the same data is the thumbnail and the
 *   full piece. It stays small, so a year of drawing fits in localStorage
 *   next to everything else. And it is legible — a user who opens the Audit
 *   tab sees a list of lines with colours, which is what they drew, rather
 *   than a wall of base64 that could be anything.
 *

 * There is no separate "nice art" path for the simulated people, which keeps
 * the feed honest: everything in it was made with the tool you have.
 */
(function (K) {
  'use strict';
  const { seeded, clamp } = K.core;

  /* Twelve colours. A limited palette is the single most reliable way to
   * make a beginner's drawing look composed, and picking from twelve is a
   * decision, where picking from sixteen million is a search. */
  const PALETTE = [
    '#1b1b1e', '#f5f2ea', '#c8453a', '#e2793a', '#e9b93b',
    '#5c9a4a', '#2f7f74', '#3b6fb0', '#6a4fa3', '#c05a8e',
    '#8a6a4f', '#9aa3a8'

  const SIZES = [2, 5, 11, 22];

  function isDarkPaper(paper) {
    const hex = PAPERS[paper] || PAPERS[0];
    const r = parseInt(hex.slice(1, 3), 16),
          g = parseInt(hex.slice(3, 5), 16),
          b = parseInt(hex.slice(5, 7), 16);

  }

  function blank() { return { paper: 0, strokes: [] }; }

  /* --- renderer -----------------------------------------------------------
   * One function draws every drawing in the app: yours in the studio, yours
   * on the shelf, the peers' in the feed, and every thumbnail. */
  function render(ctx, art, w, h) {
    ctx.save();
    ctx.fillStyle = PAPERS[art.paper] || PAPERS[0];
    ctx.fillRect(0, 0, w, h);

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const scale = Math.min(w, h);

    for (const st of art.strokes || []) {
      const pts = st.pts;

      ctx.strokeStyle = PALETTE[st.c] || PALETTE[0];

         * corners that raw lineTo leaves at every sampled point. */

          ctx.quadraticCurveTo(pts[i] * w, pts[i + 1] * h, mx * w, my * h);

  const HANDS = {
    /* Towers that lean. Nour's. */
    architecture(rng, pal) {
      const out = [];
      const n = rng.int(3, 6);
      let x = 0.1;
      for (let i = 0; i < n; i++) {
        const w = rng() * 0.14 + 0.06;
        const top = rng() * 0.45 + 0.12;
        const lean = (rng() - 0.5) * 0.09;
        const c = rng.pick(pal), s = rng.int(0, 2);
        out.push(line(c, s, wobbly(x, 0.88, x + lean, top, 0.012, rng, 5)));
        out.push(line(c, s, wobbly(x + w, 0.88, x + w + lean, top, 0.012, rng, 5)));

      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + rng() * 0.1;
        const r = rng() * 0.34 + 0.1;

      let y = hy;

    },

    creature(rng, pal) {
      const out = [];
      const c = rng.pick(pal), c2 = rng.pick(pal);

      const body = [];
      for (let i = 0; i <= 24; i++) {

      return { i, diff, grey: mx - mn < 0.12 };

    let strokes = HANDS[hand](rng, isDarkPaper(paper) ? pal.concat([1]) : pal);

     * a joke the peers are not making. */
    if (isDarkPaper(paper)) {

    }

    PALETTE, PAPERS, SIZES, blank, render, paint, generate,
    coloursUsed, coverage, isDarkPaper

<script>
/* Kiln — four sounds, synthesised, no files.
 *
 * Everything you hear is made by oscillators and a noise buffer at the
 * moment it plays. No samples, no downloads, no network — which is what lets
 * the whole app be one HTML file that works with the radio off.
 *
 * Nothing here ever starts on its own. There is no autoplay path in this
 * module: playback requires a call that only ever comes from a press, and a
 * pattern plays one bar and stops unless the person asked for a loop. See
 * the autoplay entry in the Watchtower for why that is not an oversight.
 */
(function (K) {
  'use strict';

  let ctx = null;
  let noiseBuf = null;
  let master = null;

  function ready() {
    if (ctx) {
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.8;
    master.connect(ctx.destination);

    const len = Math.floor(ctx.sampleRate * 0.4);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return ctx;
  }

  function available() {
    return !!(window.AudioContext || window.webkitAudioContext);
  }

  function env(node, t, a, d, peak) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);

    g.connect(master);
    return g;

    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(46, t + 0.12);
    env(o, t, 0.004, 0.28, 0.9);
    o.start(t); o.stop(t + 0.35);
  }

  function snare(t) {
    const s = ctx.createBufferSource();
    s.buffer = noiseBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.8;
    s.connect(bp);
    env(bp, t, 0.003, 0.16, 0.42);
    s.start(t); s.stop(t + 0.2);

    const o = ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(190, t);
    env(o, t, 0.002, 0.09, 0.22);
    o.start(t); o.stop(t + 0.12);
  }

  function hat(t) {
    const s = ctx.createBufferSource();
    s.buffer = noiseBuf;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 7200;
    s.connect(hp);
    env(hp, t, 0.002, 0.045, 0.2);
    s.start(t); s.stop(t + 0.08);

    /* A pentatonic degree chosen by step position, so a pattern someone taps
     * in at random still lands somewhere musical. */
    const scale = [0, 3, 5, 7, 10, 12];
    const semis = scale[step % scale.length] + (step > 7 ? 12 : 0);
    const o = ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(220 * Math.pow(2, semis / 12), t);
    const g = env(o, t, 0.006, 0.34, 0.3);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 2600;
    g.disconnect(); g.connect(lp); lp.connect(master);
    o.start(t); o.stop(t + 0.42);

  const VOICES = [kick, snare, hat, tone];
  const VOICE_NAMES = ['kick', 'snare', 'hat', 'tone'];

  function hit(track, step) {
    if (!ready()) return;
    const t = ctx.currentTime + 0.01;
    VOICES[track](t, step || 0);
  }

  /* A running pattern. `stop()` is always available and always immediate —
   * there is no "are you sure you want to stop the music" anywhere. */
  function play(pattern, opts) {
    if (!ready()) return { stop() {}, running: false };
    opts = opts || {};
    const stepDur = 60 / (pattern.tempo || 100) / 4;
    const tracks = pattern.tracks;
    let step = 0;
    let next = ctx.currentTime + 0.06;
    let stopped = false;
    let timer = null;
    const startedAt = next;

    function schedule() {
      if (stopped) return;
      while (next < ctx.currentTime + 0.12) {
        const s = step % 16;
        for (let tr = 0; tr < tracks.length; tr++) {
          if (tracks[tr][s]) VOICES[tr](next, s);
        }
        if (opts.onStep) {
          const at = next, cur = s;
          const delay = Math.max(0, (at - ctx.currentTime) * 1000);
          setTimeout(() => { if (!stopped) opts.onStep(cur); }, delay);
        }
        next += stepDur;
        step++;
        if (!opts.loop && step >= 16) {
          const endIn = Math.max(0, (next - ctx.currentTime) * 1000);
          setTimeout(() => { if (!stopped) { stopped = true; if (opts.onEnd) opts.onEnd(); } }, endIn);
          clearInterval(timer);
          return;
        }
      }
    }

    timer = setInterval(schedule, 25);
    schedule();

    return {
      get running() { return !stopped; },
      stop() {
        if (stopped) return;
        stopped = true;
        clearInterval(timer);
        if (opts.onEnd) opts.onEnd();
      },
      startedAt
    };
  }

  K.audio = { ready, available, play, hit, VOICE_NAMES };
})(window.Kiln = window.Kiln || {});

<script>
/* Kiln — the drawing tool.
 *
 * Twelve colours, four brush sizes, five papers, undo. That is the whole
 * instrument, and the shortness of that list is the design. A tool with
 * every option makes choosing the work; a tool with twelve colours makes
 * drawing the work. Every kid who has ever been handed a big box of pencils
 * and a small box of pencils knows which one they actually made things with.
 *
 * There is no filter, no template, no auto-enhance, and nothing that
 * improves a drawing on the maker's behalf. A tool that finishes your work
 * for you teaches you that your work needed finishing.
 */
(function (K) {
  'use strict';
  const { el, $, clamp } = K.core;
