<script>
/* Kiln — Audit: the settings, the ranking rules, and the whole save file.
 *
 * The premise of this tab is that a user is owed the ability to check. Not a
 * privacy policy describing what happens — the actual bytes, the actual
 * ordering rules with switches on them, and the actual reason each person in
 * the circle responds as often as they do.
 *
 * "Show your working" is a much stronger commitment than "trust us", and it
 * is the one thing a platform funded by attention can never offer, because
 * the working is the part that would not survive being read.
 */
(function (K) {
  'use strict';
  const { el, plural, bytesWords, today, dayShort } = K.core;
  const C = K.content;

  function build(state, onChange) {
    const root = el('section', { class: 'view audit' });

    /* --- your charter ------------------------------------------------------ */
    root.appendChild(el('h1', { class: 'sec big', text: 'Limits you set on yourself' }));
    root.appendChild(el('p', { class: 'muted small', text:
      'Making a limit stricter happens now. Making it looser happens tomorrow. ' +
      'That is the entire deal, it is the same in both directions every time, ' +
      'and the app will never refuse you — it only ever makes you sleep on it.' }));

    const pend = K.charter.pendingSummary(state);
    if (pend.length) {
      root.appendChild(el('div', { class: 'pending' }, [
        el('b', { text: 'Waiting until tomorrow' }),
        el('ul', {}, pend.map(p => el('li', {}, [
          el('span', { text: p.label + ' → ' + p.value }),
          el('button', {
            type: 'button', class: 'link-btn',
            onclick: () => { K.charter.cancel(state, p.key); onChange({ rerender: true }); }
          }, ['cancel'])
        ])))
      ]));
    }

    const msg = el('p', { class: 'charter-msg', role: 'status' });

    // Session length
    const minutes = [10, 15, 20, 30, 45, 60];
    const minRow = el('div', { class: 'opt-row', role: 'group', 'aria-label': 'Session length' });
    minutes.forEach(m => {
      minRow.appendChild(el('button', {
        type: 'button', class: 'opt' + (state.charter.minutes === m ? ' on' : ''),
        'aria-pressed': state.charter.minutes === m ? 'true' : 'false',
        onclick: () => {
          const r = K.charter.propose(state, 'minutes', m);
          msg.textContent = r.text;
          onChange({ rerender: true, keepMsg: r.text });
        }
      }, [m + ' min']));
    });

    root.appendChild(el('div', { class: 'setting' }, [
      el('b', { text: 'How long a session is' }),
      el('p', { class: 'muted small', text:
        'When you reach it, Kiln says so once and gets out of the way. It does not ' +
        'lock you out — a lockout only teaches you to find a way round it. It tells ' +
        'you the truth and lets you decide.' }),
      minRow
    ]));

    // Make first
    const mfRow = el('div', { class: 'opt-row', role: 'group', 'aria-label': 'Make before you look' });
    [[true, 'On'], [false, 'Off']].forEach(([v, label]) => {
      mfRow.appendChild(el('button', {
        type: 'button', class: 'opt' + (state.charter.makeFirst === v ? ' on' : ''),
        'aria-pressed': state.charter.makeFirst === v ? 'true' : 'false',
        onclick: () => {
          const r = K.charter.propose(state, 'makeFirst', v);
          msg.textContent = r.text;
          onChange({ rerender: true, keepMsg: r.text });
        }
      }, [label]));
    });

    root.appendChild(el('div', { class: 'setting' }, [
      el('b', { text: 'Make before you look' }),
      el('p', { class: 'muted small', text:
        'The circle stays shut until you have made something that day. Plenty of ' +
        'people find this is the only setting that matters.' }),
      mfRow
    ]));

    root.appendChild(msg);

    /* --- the ranking rules -------------------------------------------------- */
    root.appendChild(el('h1', { class: 'sec big', text: 'How your feed is ordered' }));
    root.appendChild(el('p', { class: 'muted small', text:
      'This is the complete list. There is no other ranking, no model, no ' +
      'engagement prediction, and nothing that learns what keeps you here. ' +
      'Turn them all off and the circle comes in the order it was made.' }));

    const rules = el('div', { class: 'rules' });
    Object.keys(K.feed.RULE_TEXT).forEach(k => {
      const on = !!state.rules[k];
      rules.appendChild(el('button', {
        type: 'button', class: 'rule' + (on ? ' on' : ''),
        'aria-pressed': on ? 'true' : 'false',
        onclick: () => {
          state.rules[k] = !state.rules[k];

           * settled — the whole point of a settled batch is that it settles. */
          onChange({ rerender: true });
        }
      }, [
        el('span', { class: 'tick', text: on ? '✓' : '○' }),
        el('span', { text: K.feed.RULE_TEXT[k] })
      ]));
    });
    root.appendChild(rules);
    root.appendChild(el('p', { class: 'muted tiny', text:
      'Changes apply to tomorrow\'s batch. Today\'s was decided this morning and ' +
      'does not get to be re-decided while you are in it.' }));

    /* --- the circle, explained ----------------------------------------------- */
    root.appendChild(el('h1', { class: 'sec big', text: 'Who responds, and why' }));
    root.appendChild(el('p', { class: 'muted small', text:
      'How often somebody responds to your work is a fixed fact about them. It is ' +
      'not a lottery, it does not go up when you post more, and it has nothing to ' +
      'do with whether the thing you made was good. Here it is, written down.' }));

    const who = el('div', { class: 'peer-list' });
    K.peers.all().forEach(p => {
      const d = K.peers.disposition(p.id);
      who.appendChild(el('div', { class: 'peer-row' }, [
        el('span', { class: 'avatar', style: '--hue:' + p.hue, text: p.mark }),
        el('div', {}, [
          el('b', { text: p.name }),
          el('div', { class: 'muted tiny', text: p.about }),
          el('div', { class: 'tiny', text: d ? d.warmth : '' }),
          el('div', { class: 'muted tiny', text:
            'makes something on about ' + Math.round(p.cadence * 100) + ' days in 100' })

      ]));
    });
    root.appendChild(who);

    /* --- data ---------------------------------------------------------------- */
    root.appendChild(el('h1', { class: 'sec big', text: 'Everything Kiln knows about you' }));

    const bytes = K.core.saveBytes();
    root.appendChild(el('p', { text:
      'It is ' + bytesWords(bytes) + ', it is in this browser, and it has never ' +
      'been anywhere else. Kiln makes no network requests of any kind — there is ' +
      'no server for it to talk to. Switch the network off and use the whole app.' }));

    const raw = el('pre', { class: 'payload tall', hidden: true });
    const showBtn = el('button', {
      type: 'button', class: 'tool-btn', onclick: () => {
        if (raw.hidden) {
          raw.textContent = JSON.stringify(state, null, 2);
          raw.hidden = false;
          showBtn.textContent = 'Hide it';
        } else { raw.hidden = true; showBtn.textContent = 'Show me the file'; }
      }
    }, ['Show me the file']);

    const copyMsg = el('span', { class: 'muted tiny', role: 'status' });
    const copyBtn = el('button', {
      type: 'button', class: 'tool-btn', onclick: () => {
        const text = JSON.stringify(state, null, 2);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text)
            .then(() => { copyMsg.textContent = 'copied'; })
            .catch(() => { copyMsg.textContent = 'could not copy — use "show me the file"'; });
        } else {
          copyMsg.textContent = 'no clipboard here — use "show me the file"';
        }
      }
    }, ['Copy it out']);

    let armed = false;
    const eraseMsg = el('span', { class: 'muted tiny', role: 'status' });
    const eraseBtn = el('button', {
      type: 'button', class: 'tool-btn danger', onclick: () => {
        if (!armed) {
          armed = true;
          eraseBtn.textContent = 'Erase everything — tap again';
          eraseMsg.textContent = 'This deletes your shelf and cannot be undone. ' +
            'Nothing will try to talk you out of it a second time.';
          return;
        }
        K.core.erase();
        onChange({ erased: true });
      }
    }, ['Erase everything']);

    root.appendChild(el('div', { class: 'data-acts' }, [showBtn, copyBtn, copyMsg]));
    root.appendChild(raw);
    root.appendChild(el('div', { class: 'data-acts' }, [eraseBtn, eraseMsg]));

    /* --- what is not here ----------------------------------------------------- */
    root.appendChild(el('h1', { class: 'sec big', text: 'What this app does not have' }));
    const absent = [
      'No like button, and no count of anything, anywhere.',
      'No followers, no follower count, and no profiles to compare.',
      'No streak, and nothing that decays while you are away.',
      'No notifications. Kiln never interrupts you.',
      'No refresh. The day\'s batch is settled before you open it.',
      'No infinite scroll. The feed ends and says so.',
      'No autoplay. Sound happens when you press something.',
      'No camera, no face, no filter.',
      'No advertising, no sponsored posts, and nothing bought its way in front of you.',
      'No recommendation model, and no strangers — only the eight people in your circle.',
      'No account, no email, no password, no analytics, no cookies.',
      'No network requests at all.'
    ];
    root.appendChild(el('ul', { class: 'absent' }, absent.map(t => el('li', { text: t }))));

    /* --- demo control ---------------------------------------------------------- */
    root.appendChild(el('h1', { class: 'sec big', text: 'Demo control' }));
    root.appendChild(el('p', { class: 'muted small', text:
      'Kiln is built around what happens across days, which is awkward to show in ' +
      'one sitting. This moves the app\'s clock so you can watch a day roll over, ' +
      'see responses arrive, and see the "you were away" message. It is labelled ' +
      'as a demo because that is what it is.' }));

    const dayRow = el('div', { class: 'opt-row' }, [
      el('button', { type: 'button', class: 'opt', onclick: () => shift(1) }, ['+1 day']),
      el('button', { type: 'button', class: 'opt', onclick: () => shift(7) }, ['+7 days']),
      el('button', { type: 'button', class: 'opt', onclick: () => shift(-state.demoOffset) },
        ['back to real today'])
    ]);

    function shift(n) {
      if (!n) return;
      state.demoOffset = (state.demoOffset || 0) + n;
      K.core.setDayOffset(state.demoOffset);
      onChange({ dayShift: true });
    }

    root.appendChild(dayRow);
    root.appendChild(el('p', { class: 'muted tiny', text:
      state.demoOffset ? 'Currently ' + plural(state.demoOffset, 'day') + ' ahead of ' +
        'real time. Today reads as ' + K.core.dayLabel(today()) + '.'
        : 'Running on the real calendar.' }));

    return root;
  }

  K.audit = { build };
})(window.Kiln = window.Kiln || {});

<script>
/* Kiln — the attention receipt.
 *
 * The app counts the time you spend in it and then tells you, which is the
 * exact inverse of the normal arrangement: every attention-funded app
 * measures this far more precisely than Kiln does and shows it to advertisers
 * instead of to you.
 *
 * Three rules keep the receipt from becoming its own kind of pressure:
 *
 *   It is never used against you. No target, no goal, no "you did better
 *   than last week", no comparison with anyone. A receipt, not a scorecard.
 *
 *   Reaching your limit is not a lockout. Locks teach circumvention and
 *   nothing else; a fourteen-year-old defeats one in an afternoon and learns
 *   that the app was an opponent. Kiln says the true thing once and then
 *   gets out of the way.
 *
 *   Leaving is celebrated and takes one tap. There is no confirmation, no
 *   "are you sure", and nothing waiting to be missed.
 */
(function (K) {
  'use strict';
  const { el, plural, minutesWords, today } = K.core;
  const S = K.state;

  let startedAt = 0;
  let accrued = 0;
  let visible = true;
  let announced = false;

  function start() {
    startedAt = Date.now();
    accrued = 0;
    announced = false;
    document.addEventListener('visibilitychange', () => {
      /* Time with the tab hidden is not time you spent here. Counting it
       * would flatter the number in the app's favour, which is the direction
       * every other counter in this industry leans. */
      if (document.hidden) { accrued += Date.now() - startedAt; visible = false; }
      else { startedAt = Date.now(); visible = true; }
    });
  }

  function ms() {
    return accrued + (visible ? Date.now() - startedAt : 0);
  }

  function overBudget(state) {
    return ms() >= state.charter.minutes * 60000;
  }

  function shouldAnnounce(state) {
    if (announced) return false;
    if (!overBudget(state)) return false;
    announced = true;
    return true;
  }

  function extend(state, mins) {
    /* Extending is honest: it is recorded as an extension, in the receipt,
     * in your words. It is not punished and it is not hidden. */
    const rec = S.dayRecord(state, today());
    rec.over = (rec.over || 0) + mins;
    announced = false;
    accrued -= mins * 60000;   // push the next announcement out by the extension
  }

  function commit(state) {
    const rec = S.dayRecord(state, today());
    rec.ms = (rec.ms || 0) + ms();
    accrued = 0;
    startedAt = Date.now();
  }

  /* The "you have reached your limit" card. One sentence of fact, two
   * buttons, neither of them arguing. */
  function budgetCard(state, onDone, onMore) {
    const mins = state.charter.minutes;
    return el('div', { class: 'modal-inner' }, [
      el('h2', { text: 'That is ' + plural(mins, 'minute') + '.' }),
      el('p', { text: 'You set that yourself. Nothing is locked and nothing is ' +
        'about to be taken away — this is just the app telling you the time, ' +
        'which is the only thing it knows that you do not.' }),
      tally(state),
      el('div', { class: 'modal-acts' }, [
        el('button', { type: 'button', class: 'big-btn', onclick: onDone }, ['I am done']),
        el('button', {
          type: 'button', class: 'tool-btn quiet',
          onclick: () => onMore(10)
        }, ['Ten more, on purpose'])
      ]),
      el('p', { class: 'muted tiny', text:
        'If you carry on, it goes in the receipt as a choice you made, not as a ' +
        'failure. That is the difference between a record and a telling-off.' })
    ]);
  }

  function tally(state) {
    const rec = S.dayRecord(state, today());
    const made = S.piecesOn(state, today()).length;
    const looked = rec.looked || 0;
    const t = ms() + (rec.ms || 0);
    return el('div', { class: 'tally' }, [
      row('Time here today', minutesWords(t)),
      row('Things you made', made ? plural(made, 'thing') : 'none'),
      row('Things you looked at', looked ? String(looked) : 'none'),
      rec.over ? row('Extra minutes you chose', plural(rec.over, 'minute')) : null
    ]);
  }

  function row(k, v) {
    return el('div', { class: 'tally-row' }, [
      el('span', { class: 'muted', text: k }), el('b', { text: v })
    ]);
  }

  /* The goodbye. Deliberately final-looking and deliberately pleasant. */
  function goodbye(state, onBack) {
    const made = S.piecesOn(state, today()).length;
    const rec = S.dayRecord(state, today());
    return el('div', { class: 'goodbye' }, [
      el('div', { class: 'goodbye-mark', text: '⌂' }),
      el('h1', { text: 'Done for today.' }),
      el('p', { class: 'lede', text: made
        ? 'You made ' + plural(made, 'thing') + '. It is on your shelf and it will ' +
          'be there whenever you want it.'
        : 'You did not make anything today, and nothing happened as a result. ' +
          'No streak broke. Nobody was told.' }),
      tally(state),
      el('p', { class: 'muted small', text:
        'Tomorrow there is a new prompt and a new batch. Neither of them will ' +
        'come looking for you.' }),
      el('button', { type: 'button', class: 'tool-btn quiet', onclick: onBack },
        ['Actually, one more thing'])
    ]);
  }

  K.receipt = { start, ms, overBudget, shouldAnnounce, extend, commit, budgetCard, tally, goodbye };
})(window.Kiln = window.Kiln || {});

</script>
<script>
/* Kiln — tabs, modals, onboarding, and the glue between views.
 *
 * The interface has one structural opinion: the studio is the first tab and
 * the app opens on it. Which screen an app opens on is the loudest thing it
 * ever says about what it thinks you are for, and a feed-first app has
 * already decided you are an audience before you have touched it.
 *
 * The tab bar shows no badges, no dots, and no counts. There is nothing in
 * this app that can accumulate somewhere you are not looking, so there is
 * nothing for a badge to be about — which is the honest reason most apps
 * have badges, and it is not a good one.
 */
(function (K) {
  'use strict';
  const { el, $, clear, today, plural } = K.core;
  const S = K.state;

  const TABS = [
    { id: 'studio', label: 'Studio', mark: '✎' },
    { id: 'circle', label: 'Circle', mark: '◇' },
    { id: 'shelf', label: 'Shelf', mark: '▤' },
    { id: 'tower', label: 'Watchtower', mark: '◭' },
    { id: 'audit', label: 'Audit', mark: '⚙' }
  ];

  let state = null;
  let tab = 'studio';
  let away = 0;
  let cache = {};
  let root, main, nav, header;
  let leaving = false;

  function boot(s, awayDays) {
    state = s;
    away = awayDays || 0;
    root = $('#app');
    clear(root);

    header = el('header', { class: 'bar' });
    main = el('main', { id: 'main', tabindex: '-1' });
    nav = el('nav', { class: 'tabs', role: 'tablist', 'aria-label': 'Sections' });

    root.appendChild(header);
    root.appendChild(main);
    root.appendChild(nav);

    if (!state.onboarded) { onboarding(); return; }
    buildChrome();
    render();
  }

  /* --- chrome -------------------------------------------------------------- */
  function buildChrome() {
    clear(header);
    header.appendChild(el('div', { class: 'mark' }, [
      el('b', { text: 'Kiln' }),
      el('span', { class: 'muted tiny', text: state.name ? state.name : 'a place to make things' })
    ]));
    header.appendChild(el('button', {
      type: 'button', class: 'done-btn', onclick: showGoodbye
    }, ['Done for today']));

    clear(nav);
    TABS.forEach(t => {
      nav.appendChild(el('button', {
        type: 'button', role: 'tab', class: 'tab' + (t.id === tab ? ' on' : ''),
        'aria-selected': t.id === tab ? 'true' : 'false',
        onclick: () => setTab(t.id)
      }, [
        el('span', { class: 'tab-mark', text: t.mark }),
        el('span', { class: 'tab-label', text: t.label })
      ]));
    });
  }

  function setTab(id) {
    if (leaving) return;
    if (tab === id) { window.scrollTo(0, 0); return; }
    tab = id;
    K.core.$$('.tab', nav).forEach((b, i) => {
      const on = TABS[i].id === id;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    render(true);
    main.focus({ preventScroll: true });
  }

  function invalidate() {
    for (const k of arguments) delete cache[k];
    if (!arguments.length) cache = {};
  }

  /* Settings changes rebuild everything except the studio, because a
   * half-finished drawing should survive a trip to the Audit tab. */
  function invalidateAround() {
    const studio = cache.studio;
    cache = {};
    if (studio) cache.studio = studio;
  }

  function render(fresh) {
    const keepScroll = fresh ? 0 : window.scrollY;
    clear(main);
    let node = cache[tab];
    if (!node) {
      node = buildTab(tab);
      /* The studio keeps its DOM between tab switches so a half-finished
       * drawing survives a look at the circle. Nothing else needs to. */
      if (tab === 'studio') cache.studio = node;
    }
    main.appendChild(node);
    window.scrollTo(0, keepScroll);
  }

  function buildTab(id) {
    const on = res => handle(res);
    if (id === 'studio') return K.make.build(state, on);
    if (id === 'circle') return K.feed.build(state, on);
    if (id === 'shelf') { const n = K.shelf.build(state, on, away); away = 0; return n; }
    if (id === 'tower') return K.watchtower.build(state, on);
    return K.audit.build(state, on);
  }

  /* --- what the views ask for ---------------------------------------------- */
  function handle(res) {
    res = res || {};

    if (res.go) { setTab(res.go === 'settings' ? 'audit' : res.go); return; }

    if (res.erased) {
      state = S.newState();
      K.core.setDayOffset(0);
      cache = {};
      K.core.save(state);
      onboarding();
      return;
    }

    if (res.kept) {
      K.core.save(state);
      invalidate();
      toast(keptWords(res.kept, res.fresh));
      render(true);
      return;
    }

    if (res.responded) {
      K.core.save(state);
      invalidate('circle');
      render();
      return;
    }

    if (res.dayShift) {
      K.core.save(state);
      away = S.rollover(state);
      K.core.save(state);
      cache = {};
      render(true);
      toast('Clock moved. Today is ' + K.core.dayLabel(today()) + '.');
      return;
    }

    if (res.rerender) {
      K.core.save(state);
      invalidateAround();
      render();
      if (res.keepMsg) toast(res.keepMsg);
      return;
    }
  }

  function keptWords(piece, fresh) {
    let t = piece.audience === 'circle'
      ? 'Kept, and your circle sees it tomorrow.'
      : 'Kept, just for you.';
    if (fresh && fresh.length) {
      const names = fresh.map(id => {
        for (const c in K.content.PRACTICE) {
          const hit = K.content.PRACTICE[c].find(p => p.id === id);
          if (hit) return hit.name;
        }
        return null;
      }).filter(Boolean);
      if (names.length) t += ' You also did: ' + names.join(', ') + '.';
    }
    return t;
  }

  /* --- onboarding -----------------------------------------------------------
   * The charter is explained before it is chosen, including the part that is
   * inconvenient. A commitment device you did not know you were agreeing to
   * is just a dark pattern facing the other way. */
  function onboarding() {
    clear(header); clear(nav); clear(main);
    let step = 0;
    const draft = { name: '', minutes: 20, makeFirst: false };

    function paint() {
      clear(main);
      main.appendChild(steps[step]());
      window.scrollTo(0, 0);
    }

    const steps = [
      () => el('section', { class: 'view onboard' }, [
        el('h1', { class: 'ob-title', text: 'Kiln' }),
        el('p', { class: 'lede', text:
          'A small social app where the point is the thing you make, and where ' +
          'the app is not trying to keep you.' }),
        el('ul', { class: 'absent' }, [
          el('li', { text: 'No likes, no counts, no followers, no profiles.' }),
          el('li', { text: 'No streaks. Nothing decays while you are away.' }),
          el('li', { text: 'No notifications, ever. It will not come looking for you.' }),
          el('li', { text: 'The feed ends. Every day. On purpose.' }),
          el('li', { text: 'Eight people you know. No strangers and no public.' }),
          el('li', { text: 'Nothing leaves this device. There is no server.' })
        ]),
        el('p', { class: 'muted small', text:
          'There is also a tab that shows you, with working demos, exactly how the ' +
          'apps that do the opposite pull it off. That one is the real point.' }),
        el('button', { type: 'button', class: 'big-btn', onclick: () => { step = 1; paint(); } },
          ['Start'])
      ]),

      () => {
        const input = el('input', {
          type: 'text', class: 'title-in wide', maxlength: '24',
          placeholder: 'A name, or nothing', 'aria-label': 'Your name'
        });
        input.value = draft.name;
        return el('section', { class: 'view onboard' }, [
          el('h1', { class: 'ob-title', text: 'What should the app call you?' }),
          el('p', { class: 'muted', text:
            'Optional, and it stays in this browser. There is no account, no email, ' +
            'no password, and nothing to sign up to — the app has nowhere to send it ' +
            'even if it wanted to.' }),
          input,
          el('button', {
            type: 'button', class: 'big-btn',
            onclick: () => { draft.name = input.value.trim(); step = 2; paint(); }
          }, ['Next'])
        ]);
      },

      () => {
        const minRow = el('div', { class: 'opt-row' });
        [10, 15, 20, 30, 45, 60].forEach(m => {
          minRow.appendChild(el('button', {
            type: 'button', class: 'opt' + (draft.minutes === m ? ' on' : ''),
            onclick: () => {
              draft.minutes = m;
              K.core.$$('.opt', minRow).forEach(b =>
                b.classList.toggle('on', b.textContent === m + ' min'));
            }
          }, [m + ' min']));
        });

        const mfRow = el('div', { class: 'opt-row' });
        [[true, 'Yes'], [false, 'No']].forEach(([v, label]) => {
          mfRow.appendChild(el('button', {
            type: 'button', class: 'opt' + (draft.makeFirst === v ? ' on' : ''),
            onclick: () => {
              draft.makeFirst = v;
              K.core.$$('.opt', mfRow).forEach(b => b.classList.toggle('on', b.textContent === label));
            }
          }, [label]));
        });

        return el('section', { class: 'view onboard' }, [
          el('h1', { class: 'ob-title', text: 'Set your own limits' }),
          el('p', { text:
            'You pick these, not the app. And here is the part you should know ' +
            'before you choose:' }),
          el('div', { class: 'deal' }, [
            el('b', { text: 'Tightening a limit happens straight away.' }),
            el('b', { text: 'Loosening one happens tomorrow.' }),
            el('p', { class: 'muted small', text:
              'That one-day wait is the only thing that makes a limit worth setting, ' +
              'because a limit you can lift the second you want to lift it is not a ' +
              'limit. Kiln will never refuse you — it just makes the decision ' +
              'yours-tomorrow instead of yours-right-now.' })
          ]),
          el('div', { class: 'setting' }, [
            el('b', { text: 'How long is a session?' }),
            el('p', { class: 'muted small', text:
              'When you get there Kiln tells you once and then leaves you alone. ' +
              'It never locks you out.' }),
            minRow
          ]),
          el('div', { class: 'setting' }, [
            el('b', { text: 'Make something before you look at anyone else\'s?' }),
            el('p', { class: 'muted small', text:
              'The circle stays shut until you have made something that day. You can ' +
              'change your mind later — tomorrow.' }),
            mfRow
          ]),
          el('button', {
            type: 'button', class: 'big-btn',
            onclick: () => {
              state.name = draft.name;
              state.charter.minutes = draft.minutes;
              state.charter.makeFirst = draft.makeFirst;
              state.onboarded = true;
              K.core.save(state);
              cache = {};
              tab = 'studio';
              buildChrome();
              render(true);
            }
          }, ['Into the studio'])
        ]);
      }
    ];

    paint();
  }

  /* --- modal + toast --------------------------------------------------------- */
  function modal(inner, opts) {
    const back = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' });
    back.appendChild(inner);
    document.body.appendChild(back);
    const close = () => { if (back.parentNode) back.parentNode.removeChild(back); };
    if (!opts || !opts.sticky) {
      back.addEventListener('click', e => { if (e.target === back) close(); });
    }
    return close;
  }

  let toastTimer = null;
  function toast(text) {
    let t = $('#toast');
    if (!t) {
      t = el('div', { id: 'toast', role: 'status' });
      document.body.appendChild(t);
    }
    t.textContent = text;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), 5200);
  }

  /* --- session end ------------------------------------------------------------ */
  function showBudget() {
    let close = null;
    close = modal(K.receipt.budgetCard(state,
      () => { close(); showGoodbye(); },
      mins => { K.receipt.extend(state, mins); K.core.save(state); close(); toast('Ten more. It is in the receipt.'); }
    ), { sticky: true });
  }

  function showGoodbye() {
    K.receipt.commit(state);
    K.core.save(state);
    leaving = true;
    clear(main); clear(nav);
    header.classList.add('hushed');
    main.appendChild(K.receipt.goodbye(state, () => {
      leaving = false;
      header.classList.remove('hushed');
      buildChrome();
      invalidateAround();
      render(true);
    }));
    window.scrollTo(0, 0);
  }

  K.ui = { boot, setTab, toast, modal, showBudget, showGoodbye, invalidate,
    get state() { return state; } };
})(window.Kiln = window.Kiln || {});

</script>
<script>
/* Kiln — boot.
 *
 * Load, roll the day over, start the clock, hand off to the interface. The
 * only recurring timer in the app checks whether you have reached the
 * session length you set for yourself; there is no polling, no background
 * work, and nothing that runs to keep the app warm.
 */
(function (K) {
  'use strict';
  const S = K.state;

  function start() {
    let state = S.migrate(K.core.load()) || S.newState();

    /* The demo clock offset is restored before anything asks what day it is,
     * so the whole app agrees on the date from the first line. */
    K.core.setDayOffset(state.demoOffset || 0);

    const away = S.rollover(state);
    K.core.save(state);

    K.receipt.start();
    K.ui.boot(state, away);

    /* One interval, one job. When you reach the length you chose, the app
     * says so exactly once and then never brings it up again unless you ask
     * for more time. */
    setInterval(() => {
      if (K.receipt.shouldAnnounce(state)) K.ui.showBudget();
    }, 5000);

    /* Keep the clock honest across a closed tab, without ever using the
     * saved time for anything but the receipt. */
    window.addEventListener('pagehide', () => {
      K.receipt.commit(state);
      K.core.save(state);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})(window.Kiln = window.Kiln || {});

</script>
</body>
