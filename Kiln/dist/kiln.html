    let colour = 0, size = 1;
    let drawing = null;
    const redo = [];

    const canvas = el('canvas', { class: 'draw-canvas', 'aria-label': 'Drawing canvas' });
    const stage = el('div', { class: 'draw-stage' }, [canvas]);

    const swatches = el('div', { class: 'swatches', role: 'group', 'aria-label': 'Colour' });
    A.PALETTE.forEach((hex, i) => {
      const b = el('button', {
        type: 'button', class: 'swatch' + (i === colour ? ' on' : ''),
        style: 'background:' + hex, 'aria-label': 'Colour ' + (i + 1),
        'aria-pressed': i === colour ? 'true' : 'false',
        onclick: () => { colour = i; sync(); }
      });
      b.dataset.i = i;
      swatches.appendChild(b);
    });

    const sizes = el('div', { class: 'sizes', role: 'group', 'aria-label': 'Brush size' });
    A.SIZES.forEach((px, i) => {
      const b = el('button', {
        type: 'button', class: 'size' + (i === size ? ' on' : ''),
        'aria-label': 'Brush ' + (i + 1), 'aria-pressed': i === size ? 'true' : 'false',
        onclick: () => { size = i; sync(); }
      }, [el('i', { style: 'width:' + (px + 2) + 'px;height:' + (px + 2) + 'px' })]);
      b.dataset.i = i;
      sizes.appendChild(b);
    });

    const papers = el('div', { class: 'papers', role: 'group', 'aria-label': 'Paper' });
    A.PAPERS.forEach((hex, i) => {
      const b = el('button', {
        type: 'button', class: 'paper' + (i === art.paper ? ' on' : ''),
        style: 'background:' + hex, 'aria-label': 'Paper ' + (i + 1),
        'aria-pressed': i === art.paper ? 'true' : 'false',
        onclick: () => { art.paper = i; sync(); paint(); }
      });
      b.dataset.i = i;
      papers.appendChild(b);
    });

    const btnUndo = el('button', {
      type: 'button', class: 'tool-btn', onclick: undo, text: 'Undo'
    });
    const btnRedo = el('button', {
      type: 'button', class: 'tool-btn', onclick: () => {
        if (!redo.length) return;
        art.strokes.push(redo.pop());
        paint(); sync();
      }, text: 'Redo'
    });
    const btnClear = el('button', {
      type: 'button', class: 'tool-btn quiet', onclick: () => {
        if (!art.strokes.length) return;
        for (let i = art.strokes.length - 1; i >= 0; i--) redo.push(art.strokes[i]);
        art.strokes.length = 0;
        paint(); sync();
      }, text: 'Clear'
    });

    const count = el('span', { class: 'draw-count' });

    host.appendChild(el('div', { class: 'draw' }, [
      stage,
      el('div', { class: 'draw-bar' }, [swatches]),
      el('div', { class: 'draw-bar split' }, [
        sizes, papers,
        el('div', { class: 'draw-acts' }, [btnUndo, btnRedo, btnClear, count])
      ])
    ]));

    function sync() {
      K.core.$$('.swatch', swatches).forEach(b => {
        const on = +b.dataset.i === colour;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      K.core.$$('.size', sizes).forEach(b => {
        const on = +b.dataset.i === size;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      K.core.$$('.paper', papers).forEach(b => {
        const on = +b.dataset.i === art.paper;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      btnUndo.disabled = !art.strokes.length;
      btnRedo.disabled = !redo.length;
      btnClear.disabled = !art.strokes.length;
      const n = art.strokes.length;
      count.textContent = n ? K.core.plural(n, 'stroke') + ', ' +
        K.core.plural(A.coloursUsed(art), 'colour') : '';
    }

    function undo() {
      if (!art.strokes.length) return;
      redo.push(art.strokes.pop());
      paint(); sync();
    }

    function box() {
      const r = stage.getBoundingClientRect();
      return r;
    }

    function paint() {
      const r = box();
      A.paint(canvas, art, r.width, r.height);
      if (drawing && drawing.pts.length >= 2) {
        // The live stroke is already in art.strokes while drawing.
      }
    }

    function pos(ev) {
      const r = box();
      return [
        clamp((ev.clientX - r.left) / r.width, 0, 1),
        clamp((ev.clientY - r.top) / r.height, 0, 1)
      ];
    }

    function down(ev) {
      if (ev.button !== undefined && ev.button !== 0) return;
      canvas.setPointerCapture && canvas.setPointerCapture(ev.pointerId);
      const [x, y] = pos(ev);
      drawing = { c: colour, s: size, pts: [round(x), round(y)] };
      art.strokes.push(drawing);
      redo.length = 0;
      paint(); sync();
      ev.preventDefault();
    }

    function move(ev) {
      if (!drawing) return;
      const [x, y] = pos(ev);
      const p = drawing.pts;
      const lx = p[p.length - 2], ly = p[p.length - 1];
      /* Sample by distance, not by event. Fast phones fire pointermove far
       * more often than a line needs, and every extra point is bytes in a
       * save file that has to last years. */
      if (Math.abs(x - lx) + Math.abs(y - ly) < 0.006) return;
      p.push(round(x), round(y));
      paint();
      ev.preventDefault();
    }

    function up() {
      if (!drawing) return;
      if (drawing.pts.length < 2) art.strokes.pop();
      drawing = null;
      paint(); sync();
    }

    const round = v => Math.round(v * 1000) / 1000;

    canvas.addEventListener('pointerdown', down);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
    canvas.addEventListener('pointerleave', up);
    canvas.style.touchAction = 'none';

    const onResize = () => paint();
    window.addEventListener('resize', onResize);
    let ro = null;
    if (window.ResizeObserver) {
      ro = new ResizeObserver(() => paint());
      ro.observe(stage);
    }

    requestAnimationFrame(() => { paint(); sync(); });

    return {
      craft: 'draw',
      payload() { return { paper: art.paper, strokes: art.strokes.slice() }; },
      empty() { return art.strokes.length === 0; },
      /* Which deliberate-practice constraints this piece satisfies. Checked
       * from the work itself, never self-reported. */
      practice() {
        const done = [];
        if (art.strokes.length && A.coloursUsed(art) <= 3) done.push('d-three');
        if (art.strokes.length === 1 && art.strokes[0].pts.length >= 12) done.push('d-nolift');
        const cov = A.coverage(art);
        if (art.strokes.length && cov.minx < 0.06 && cov.miny < 0.06 &&
            cov.maxx > 0.94 && cov.maxy > 0.94) done.push('d-big');
        if (art.strokes.length >= 2 && cov.area > 0 && cov.area < 0.3) done.push('d-empty');
        return done;
      },
      destroy() {
        window.removeEventListener('resize', onResize);
        if (ro) ro.disconnect();
      }
    };
  }

  K.draw = { mount };
})(window.Kiln = window.Kiln || {});

</script>
<script>
/* Kiln — the writing tool.
 *
 * A box and a word count. No character limit, because a character limit is a
 * format decision that became a thinking limit: a generation learned to have
 * only thoughts that fit, and then to mistake the fit for the thought.
 *
 * The word count is information, never a target. It does not go red, there
 * is no minimum to unlock anything, and nothing in the interface implies
 * that longer is better. It is there because knowing how long a thing is
 * helps you shape it, the same way a musician wants to know the bar count.
 */
(function (K) {
  'use strict';
  const { el, plural } = K.core;

  /* Common describing words, for the "no adjectives" practice. The check is
   * approximate and the interface says so — a constraint you can game is
   * fine, because the person gaming it is the person it was for. */
  const ADJ = ('big small large tiny huge little old new young bright dark ' +
    'beautiful ugly pretty nice good bad great awful terrible lovely happy sad ' +
    'angry quiet loud soft hard warm cold hot cool wet dry clean dirty long ' +
    'short tall wide narrow thick thin heavy light fast slow strange weird odd ' +
    'normal perfect broken empty full open closed sharp dull smooth rough deep ' +
    'shallow rich poor strong weak sweet bitter sour fresh stale ancient modern ' +
    'red orange yellow green blue purple pink brown black white grey gray silver ' +
    'golden scary funny serious silly clever stupid kind cruel gentle fierce ' +
    'calm wild busy lazy tired awake hungry thirsty lonely crowded distant near ' +
    'far early late final first last only real fake true false')
    .split(' ');
  const ADJSET = {};
  for (const a of ADJ) ADJSET[a] = 1;

  function words(text) {
    const t = String(text || '').trim();
    if (!t) return 0;
    return t.split(/\s+/).length;
  }

  function mount(host, initial) {
    const area = el('textarea', {
      class: 'write-area',
      rows: 12,
      spellcheck: 'true',
      placeholder: 'Start anywhere. You can delete the first line later.',
      'aria-label': 'Your writing'
    });
    area.value = (initial && initial.text) || '';

    const meter = el('div', { class: 'write-meter' });
    const hint = el('p', { class: 'write-hint', text:
      'No length limit, in either direction. Six words is a piece. So is nine hundred.' });

    function sync() {
      const w = words(area.value);
      meter.textContent = w ? plural(w, 'word') : '';
    }
    area.addEventListener('input', sync);

    host.appendChild(el('div', { class: 'write' }, [area, meter, hint]));
    sync();
    requestAnimationFrame(() => area.focus());

    return {
      craft: 'write',
      payload() { return { text: area.value.trim() }; },
      empty() { return !area.value.trim(); },
      practice() {
        const text = area.value.trim();
        const w = words(text);
        const done = [];
        if (w > 0 && w < 40) done.push('w-short');
        if (w >= 200) done.push('w-long');
        if (w >= 15) {
          const toks = text.toLowerCase().replace(/[^a-z\s'-]/g, ' ').split(/\s+/);
          if (!toks.some(t => ADJSET[t])) done.push('w-noadj');
        }
        if (w >= 15) {
          const quoted = (text.match(/["“][^"”]+["”]/g) || []).join(' ');
          if (words(quoted) > w * 0.8) done.push('w-dial');
        }
        return done;
      },
      destroy() {}
    };
  }

  K.write = { mount, words };
})(window.Kiln = window.Kiln || {});

</script>
<script>
/* Kiln — the beat tool: four voices, sixteen steps.
 *
 * A step sequencer is the fastest route from "I cannot make music" to a
 * thing that sounds like music, because it removes the two barriers that
 * stop most people — you do not need an instrument and you cannot play a
 * wrong note. Sixteen boxes and a tempo, and the first pattern anyone taps
 * in sounds better than they expected. That surprise is the point.
 *
 * Playback rules, which are the anti-pattern half of this file: pressing
 * play plays one bar and stops. Looping is a separate switch you have to
 * turn on yourself. Nothing here starts without a press, and stop is always
 * one press away and never asks a question.
 */
(function (K) {
  'use strict';
  const { el, $$, clamp } = K.core;
  const AU = K.audio;

  const VOICES = [
    { name: 'kick', mark: '●' },
    { name: 'snare', mark: '◆' },
    { name: 'hat', mark: '×' },
    { name: 'tone', mark: '▲' }
  ];

  function blank() {
    return { tempo: 96, tracks: [0, 1, 2, 3].map(() => new Array(16).fill(0)) };
  }

  function hits(pattern) {
    let n = 0;
    for (const t of pattern.tracks) for (const v of t) if (v) n++;
    return n;
  }

  /* A read-only player used by the feed and the shelf. Same rules as the
   * editor: one bar unless asked, stop always available. */
  function player(pattern, opts) {
    opts = opts || {};
    let handle = null;
    const btn = el('button', {
      type: 'button', class: 'beat-play', 'aria-label': 'Play this beat',
      onclick: () => {
        if (handle && handle.running) { handle.stop(); return; }
        handle = AU.play(pattern, {
          loop: false,
          onStep: opts.onStep,
          onEnd: () => { btn.classList.remove('on'); btn.textContent = '▶ Play'; }
        });
        btn.classList.add('on');
        btn.textContent = '■ Stop';
      }
    }, ['▶ Play']);
    return {
      node: btn,
      stop() { if (handle) handle.stop(); }
    };
  }

  function mount(host, initial) {
    const pattern = initial
      ? { tempo: initial.tempo, tracks: initial.tracks.map(t => t.slice()) }
      : blank();

    let handle = null;
    let loop = false;

    const gridWrap = el('div', { class: 'beat-grid', role: 'group', 'aria-label': 'Pattern' });
    const cells = [];

    VOICES.forEach((v, ti) => {
      const row = el('div', { class: 'beat-row' });
      row.appendChild(el('span', { class: 'beat-name', text: v.name }));
      const steps = el('div', { class: 'beat-steps' });
      const rowCells = [];
      for (let s = 0; s < 16; s++) {
        const on = !!pattern.tracks[ti][s];
        const b = el('button', {
          type: 'button',
          class: 'step' + (on ? ' on' : '') + (s % 4 === 0 ? ' beat1' : ''),
          'aria-label': v.name + ' step ' + (s + 1),
          'aria-pressed': on ? 'true' : 'false',
          onclick: () => {
            const now = pattern.tracks[ti][s] ? 0 : 1;
            pattern.tracks[ti][s] = now;
            b.classList.toggle('on', !!now);
            b.setAttribute('aria-pressed', now ? 'true' : 'false');
            if (now) AU.hit(ti, s);
            syncCount();
          }
        }, [el('i', { text: v.mark })]);
        rowCells.push(b);
        steps.appendChild(b);
      }
      cells.push(rowCells);
      row.appendChild(steps);
      gridWrap.appendChild(row);
    });

    const tempo = el('input', {
      type: 'range', min: '60', max: '150', step: '1', value: String(pattern.tempo),
      class: 'tempo', 'aria-label': 'Tempo',
      oninput: () => { pattern.tempo = +tempo.value; tempoLabel.textContent = tempo.value + ' bpm'; }
    });
    const tempoLabel = el('span', { class: 'tempo-label', text: pattern.tempo + ' bpm' });

    const playBtn = el('button', {
      type: 'button', class: 'tool-btn go', onclick: toggle
    }, ['▶ Play']);

    const loopBtn = el('button', {
      type: 'button', class: 'tool-btn', 'aria-pressed': 'false',
      onclick: () => {
        loop = !loop;
        loopBtn.classList.toggle('on', loop);
        loopBtn.setAttribute('aria-pressed', loop ? 'true' : 'false');
        if (handle && handle.running) { stop(); toggle(); }
      }
    }, ['Loop']);

    const clearBtn = el('button', {
      type: 'button', class: 'tool-btn quiet', onclick: () => {
        for (const t of pattern.tracks) t.fill(0);
        cells.forEach(row => row.forEach(b => {
          b.classList.remove('on'); b.setAttribute('aria-pressed', 'false');
        }));
        syncCount();
      }
    }, ['Clear']);

    const countLabel = el('span', { class: 'draw-count' });

    function syncCount() {
      const n = hits(pattern);
      countLabel.textContent = n ? K.core.plural(n, 'hit') : '';
    }

    function markStep(s) {
      $$('.step.now', gridWrap).forEach(b => b.classList.remove('now'));
      if (s < 0) return;
      cells.forEach(row => row[s].classList.add('now'));
    }

    function stop() {
      if (handle) handle.stop();
      handle = null;
      playBtn.textContent = '▶ Play';
      playBtn.classList.remove('on');
      markStep(-1);
    }

    function toggle() {
      if (handle && handle.running) { stop(); return; }
      if (!AU.available()) { playBtn.textContent = 'no audio here'; return; }
      handle = AU.play(pattern, {
        loop,
        onStep: markStep,
        onEnd: () => {
          playBtn.textContent = '▶ Play';
          playBtn.classList.remove('on');
          markStep(-1);
          handle = null;
        }
      });
      playBtn.textContent = '■ Stop';
      playBtn.classList.add('on');
    }

    host.appendChild(el('div', { class: 'beat' }, [
      gridWrap,
      el('div', { class: 'beat-bar' }, [
        playBtn, loopBtn, clearBtn,
        el('label', { class: 'tempo-wrap' }, [tempo, tempoLabel]),
        countLabel
      ]),
      el('p', { class: 'write-hint', text:
        'Play runs one bar and stops. Loop is a switch, not a default.' })
    ]));

    syncCount();

    return {
      craft: 'beat',
      payload() { return { tempo: pattern.tempo, tracks: pattern.tracks.map(t => t.slice()) }; },
      empty() { return hits(pattern) === 0; },
      practice() {
        const done = [];
        const n = hits(pattern);
        if (n > 0 && n <= 12) done.push('b-sparse');
        if (pattern.tracks.every(t => t.some(v => v))) done.push('b-full');
        const off = pattern.tracks.some(t => t.some((v, i) => v && i % 2 === 1));
        if (off && n > 0) done.push('b-odd');
        if (n > 0) {
          for (let s = 0; s <= 12; s++) {
            let quiet = true;
            for (let k = 0; k < 4 && quiet; k++) {
              if (pattern.tracks.some(t => t[s + k])) quiet = false;
            }
            if (quiet) { done.push('b-quiet'); break; }
          }
        }
        return done;
      },
      destroy() { stop(); }
    };
  }

  K.beat = { mount, player, blank, hits, VOICES };
})(window.Kiln = window.Kiln || {});

</script>
<script>
/* Kiln — how a made thing is shown, wherever it is shown.
 *
 * One renderer for the feed, the shelf, and the studio preview. Your work
 * and a peer's work go through identical code and come out looking the same
 * size, in the same frame, with the same amount of room. No "featured", no
 * "trending", no boosted card, no visual weight bought or earned. A feed
 * where some cards are bigger is a feed that has already told you who
 * matters before you have read a word.
 */
(function (K) {
  'use strict';
  const { el, esc } = K.core;

  /* The work itself: canvas, prose, or a bar of music. */
  function body(craft, payload, opts) {
    opts = opts || {};
    if (craft === 'draw') {
      const canvas = el('canvas', { class: 'work-canvas', role: 'img',
        'aria-label': 'A drawing' });
      const wrap = el('div', { class: 'work-draw' }, [canvas]);
      const paintIt = () => {
        const w = wrap.clientWidth || 320;
        K.art.paint(canvas, payload, w, Math.round(w * 0.72));
      };
      requestAnimationFrame(paintIt);
      window.addEventListener('resize', paintIt);
      if (window.ResizeObserver) new ResizeObserver(paintIt).observe(wrap);
      return wrap;
    }

    if (craft === 'write') {
      const text = String(payload.text || '');
      const p = el('div', { class: 'work-write' });
      for (const para of text.split(/\n{2,}/)) {
        if (!para.trim()) continue;
        p.appendChild(el('p', { text: para.trim() }));
      }
      return p;
    }

    // beat
    const wrap = el('div', { class: 'work-beat' });
    const strip = el('div', { class: 'beat-strip', 'aria-hidden': 'true' });
    const marks = [];
    for (let s = 0; s < 16; s++) {
      const on = payload.tracks.some(t => t[s]);
      const cell = el('span', { class: 'strip-cell' + (on ? ' on' : '') });
      marks.push(cell);
      strip.appendChild(cell);
    }
    const pl = K.beat.player(payload, {
      onStep: s => {
        marks.forEach((m, i) => m.classList.toggle('now', i === s));
      }
    });
    wrap.appendChild(strip);
    wrap.appendChild(el('div', { class: 'beat-foot' }, [
      pl.node,
      el('span', { class: 'muted', text: payload.tempo + ' bpm' })
    ]));
    return wrap;
  }

  /* A peer's identity chip. Deliberately not a link to a profile with
   * counts on it — there are no profiles, because a profile is where a
   * person becomes a set of numbers other people can compare. */
  function who(peer, sub) {
    return el('div', { class: 'who' }, [
      el('span', { class: 'avatar', style: '--hue:' + peer.hue, text: peer.mark }),
      el('div', { class: 'who-text' }, [
        el('b', { text: peer.name }),
        sub ? el('span', { class: 'muted', text: sub }) : null
      ])
    ]);
  }

  K.card = { body, who };
})(window.Kiln = window.Kiln || {});

</script>
<script>
/* Kiln — the circle: eight simulated people who make things.
 *
 * There is no server, so the circle is generated. That is a limitation
 * turned into the app's most honest feature, because a generated circle can
 * be given properties a real platform would never admit to:
 *
 *   Whether a peer responds to your work is a fixed fact about that peer,
 *   not a roll of dice. Nour responds to everything. Basil responds to one
 *   piece in seven, forever, no matter what you make. This is written down
 *   in the Audit tab in those words.
 *
 * That single decision removes the engine underneath most of what social
 * media does to a young person. If response rate were random, every post
 * would be a pull of a lever and you would learn, correctly, that posting
 * more often pays. If it is a fixed property of other people, you learn the
 * true thing instead: how much someone responds is about them, and the only
 * thing you control is the work.
 *
 * Responses also arrive the day after you post. Never the same session. You
 * cannot sit and wait for them, because they are not coming today.
 */
(function (K) {
  'use strict';
  const C = K.content;
  const { seeded, clamp } = K.core;

  /* Fixed disposition per peer: responds to one piece in `every`, counting
   * through your pieces in order, starting at `offset`. Deterministic, and
   * printed for the user in Audit. */
  const DISPOSITION = {
    nour:  { every: 1, offset: 0, warmth: 'responds to everything you make' },
    tomas: { every: 3, offset: 1, warmth: 'responds to about one piece in three' },
    imani: { every: 2, offset: 0, warmth: 'responds to about half of what you make' },
    yuki:  { every: 2, offset: 1, warmth: 'responds to about half of what you make' },
    basil: { every: 7, offset: 3, warmth: 'responds to about one piece in seven' },
    priya: { every: 3, offset: 0, warmth: 'responds to about one piece in three' },
    okwe:  { every: 4, offset: 2, warmth: 'responds to about one piece in four' },
    lena:  { every: 8, offset: 5, warmth: 'responds rarely, and at length' }
  };

  const byId = {};
  for (const p of C.PEERS) byId[p.id] = p;

  function peer(id) { return byId[id]; }
  function all() { return C.PEERS; }

  function postId(peerId, day) { return peerId + '@' + day; }

  /* --- does this peer make something today? ------------------------------
   * Seeded on the day and the peer, so it is settled before you look. Some
   * peers go quiet for a week. That absence is normal and the app never
   * flags it, because "X hasn't posted in a while" is a nudge aimed at X. */
  function active(p, day) {
    return seeded('active', p.id, day)() < p.cadence;
  }

  /* --- writing ------------------------------------------------------------ */
  function writeText(p, day) {
    const rng = seeded('write', p.id, day);
    const long = rng() < p.wordy;
    const parts = [];
    const n = long ? rng.int(3, 5) : rng.int(1, 2);
    for (let i = 0; i < n; i++) {
      if (i > 0 && rng.chance(0.4)) { parts.push(rng.pick(C.W.mid)); continue; }
      parts.push(rng.pick(C.W.open) + ' ' + rng.pick(C.W.subj) + ' ' +
                 rng.pick(C.W.verb) + ', ' + rng.pick(C.W.tail));
    }
    let text = parts.join(' ');
    text = text.charAt(0).toUpperCase() + text.slice(1);
    return text;
  }

  /* --- beats --------------------------------------------------------------
   * Generated with a little musical prior so peers' patterns are listenable:
   * kick near downbeats, snare on the backbeat, hats subdividing, tone
   * sparse. Then the seed is allowed to break one of those rules. */
  function beatPattern(p, day) {
    const rng = seeded('beat', p.id, day);
    const g = () => new Array(16).fill(false);
    const kick = g(), snare = g(), hat = g(), tone = g();

    kick[0] = true;
    if (rng.chance(0.8)) kick[8] = true;
    for (let i = 0; i < 16; i++) if (rng.chance(0.12)) kick[i] = true;

    snare[4] = true; snare[12] = true;
    if (rng.chance(0.3)) snare[14] = true;

    const div = rng.pick([1, 2, 2, 4]);
    for (let i = 0; i < 16; i++) if (i % div === 0 && rng.chance(0.85)) hat[i] = true;

    const toneN = rng.int(1, 5);
    for (let i = 0; i < toneN; i++) tone[rng.int(0, 15)] = true;

    // One rule broken on purpose, because perfectly correct is not a person.
    if (rng.chance(0.35)) { snare[rng.chance(0.5) ? 4 : 12] = false; }

    return {
      tempo: rng.int(72, 132),
      tracks: [kick, snare, hat, tone].map(t => t.map(v => (v ? 1 : 0)))
    };
  }

  /* --- the post ----------------------------------------------------------- */
  function post(p, day) {
    if (!active(p, day)) return null;
    const rng = seeded('post', p.id, day);
    const prompt = K.state.promptFor(day);
    /* Peers reach for a craft the prompt suits. If none of theirs fits they
     * answer in their own medium anyway — the studio tells you the prompt is
     * a suggestion rather than a rule, and the circle should be seen taking
     * that at its word rather than quietly obeying. */
    const fits = p.crafts.filter(c => prompt.c.indexOf(c) >= 0);
    const craft = rng.pick(fits.length ? fits : p.crafts);

    const o = {
      id: postId(p.id, day),
      peer: p.id,
      day,
      craft,
      title: rng.chance(0.45) ? rng.pick(C.TITLES) : '',
      note: rng.chance(0.3) ? rng.pick(C.W.mid) : ''
    };

    if (craft === 'draw') o.payload = K.art.generate(p, day, 'post');
    else if (craft === 'write') o.payload = { text: writeText(p, day) };
    else o.payload = beatPattern(p, day);

    return o;
  }

  /* Every post from the circle for a given day. */
  function postsOn(day) {
    const out = [];
    for (const p of C.PEERS) {
      const o = post(p, day);
      if (o) out.push(o);
    }
    return out;
  }

  function postById(id) {
    const at = id.indexOf('@');
    if (at < 0) return null;
    const p = byId[id.slice(0, at)];
    const day = parseInt(id.slice(at + 1), 10);
    if (!p || isNaN(day)) return null;
    return post(p, day);
  }

  /* --- responses to your work --------------------------------------------
   * Deterministic from the piece's ordinal in your body of work and each
   * peer's fixed disposition. Nothing here consults luck, recency, effort,
   * or how often you opened the app. */
  function responsesFor(state, piece) {
    const today = K.core.today();
    if (today <= piece.day) return [];               // never the same day
    if (piece.audience !== 'circle') return [];      // kept to yourself is kept

    const ordinal = state.pieces.filter(x => x.audience === 'circle')
      .findIndex(x => x.id === piece.id);
    if (ordinal < 0) return [];

    const out = [];
    for (const p of C.PEERS) {
      const d = DISPOSITION[p.id];
      if (!d) continue;
      if ((ordinal + d.offset) % d.every !== 0) continue;
      // They also have to have been around the day after you posted.
      if (!active(p, piece.day + 1)) continue;

      const rng = seeded('resp', p.id, piece.id);
      const pool = C.PRAISE.filter(x => x.for.indexOf(piece.craft) >= 0);
      const praise = rng.pick(pool);
      const words = rng() < p.wordy ? rng.pick([
        'Kept looking at it.', 'I want to try this.', 'Did not expect that.',
        'This is the one.', 'Made me want to make something.',
        'I would not have thought of it.', 'Do more of these.'
      ]) : '';
      out.push({ from: p.id, praise: praise.id, text: words, day: piece.day + 1 });
    }
    return out;
  }

  function disposition(id) { return DISPOSITION[id]; }

  K.peers = { all, peer, post, postsOn, postById, active, responsesFor, disposition, postId };
})(window.Kiln = window.Kiln || {});

</script>
<script>
/* Kiln — the Studio. The front door of the app.
 *
 * The app opens here, on a blank canvas and a question, and not on other
 * people's work. Which screen an app opens on is the strongest statement it
 * makes about what it thinks you are for, and every feed-first app has
 * already decided you are an audience.
 *
 * Three things in this file are worth defending:
 *
 *   Audience defaults to "just me". Sharing is a separate, deliberate tap
 *   with a plain label. The default for a child's creative work should be
 *   private, and every app that defaults to public is relying on the fact
 *   that almost nobody changes a default.
 *
 *   Practice constraints are read off the finished piece, never announced
 *   in advance as a goal. You find out you did the hard thing after you did
 *   it, which is how it feels when it is real, and it means nobody makes a
 *   deliberately bad piece to farm a checkbox.
 *
 *   Nothing congratulates you for volume. Making a second piece is allowed
 *   and never suggested.
 */
(function (K) {
  'use strict';
  const { el, $, today, plural } = K.core;
  const C = K.content;
  const S = K.state;

  let draft = { craft: null, tool: null, title: '' };
  let node = null;

  function toolFor(craft) {
    return craft === 'draw' ? K.draw : craft === 'write' ? K.write : K.beat;
  }

  function build(state, onChange) {
    const day = today();
    const prompt = S.promptFor(day);
    const mine = S.piecesOn(state, day);

    const root = el('section', { class: 'view studio' });

    root.appendChild(el('div', { class: 'prompt-card' }, [
      el('div', { class: 'prompt-eyebrow' }, [
        el('span', { text: 'Today' }),
        el('span', { class: 'muted', text: K.core.dayLabel(day) })
      ]),
      el('h1', { class: 'prompt-text', text: prompt.t }),
      el('p', { class: 'muted small', text:
        'Everyone in your circle got this same prompt. Nobody is competing; you are ' +
        'just going to see seven other ways of reading one sentence.' })
    ]));

    /* --- craft chooser ---------------------------------------------------- */
    const chooser = el('div', { class: 'craft-pick', role: 'group', 'aria-label': 'What to make' });
    ['draw', 'write', 'beat'].forEach(id => {
      const craft = C.CRAFTS[id];
      const suits = prompt.c.indexOf(id) >= 0;
      const b = el('button', {
        type: 'button',
        class: 'craft' + (draft.craft === id ? ' on' : '') + (suits ? ' suits' : ''),
        'aria-pressed': draft.craft === id ? 'true' : 'false',
        onclick: () => { setCraft(id); }
      }, [
        el('span', { class: 'craft-mark', text: craft.mark }),
        el('b', { text: craft.name }),
        el('span', { class: 'muted tiny', text: craft.blurb }),
        suits ? el('span', { class: 'suits-tag', text: 'fits today' }) : null
      ]);
      chooser.appendChild(b);
    });
    root.appendChild(chooser);

    const toolHost = el('div', { class: 'tool-host' });
    root.appendChild(toolHost);

    const keepRow = el('div', { class: 'keep-row' });
    root.appendChild(keepRow);

    /* --- what you already made today -------------------------------------- */
    if (mine.length) {
      const list = el('div', { class: 'today-mine' }, [
        el('h2', { class: 'sec', text: mine.length === 1
          ? 'You made this today'
          : 'You made ' + plural(mine.length, 'thing') + ' today' })
      ]);
      for (const p of mine) list.appendChild(pieceCard(state, p, onChange));
      root.appendChild(list);
    }

    function setCraft(id) {
      if (draft.tool) { draft.tool.destroy(); draft.tool = null; }
      K.core.clear(toolHost);
      K.core.clear(keepRow);
      draft.craft = id;
      K.core.$$('.craft', chooser).forEach((b, i) => {
        const on = ['draw', 'write', 'beat'][i] === id;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      if (!id) return;
      draft.tool = toolFor(id).mount(toolHost, null);
      buildKeep();
    }

    function buildKeep() {
      K.core.clear(keepRow);
      const title = el('input', {
        type: 'text', class: 'title-in', maxlength: '60',
        placeholder: 'Title it, or do not', 'aria-label': 'Title (optional)'
      });

      const audience = { to: 'self' };
      const audWrap = el('div', { class: 'aud', role: 'radiogroup', 'aria-label': 'Who sees this' });
      const opts = [
        { id: 'self', label: 'Just me', note: 'It goes on your shelf. Nobody else ever sees it.' },
        { id: 'circle', label: 'My circle', note: 'The eight people in your circle. Not a public.' }
      ];
      opts.forEach(o => {
        const b = el('button', {
          type: 'button', class: 'aud-opt' + (o.id === 'self' ? ' on' : ''),
          role: 'radio', 'aria-checked': o.id === 'self' ? 'true' : 'false',
          onclick: () => {
            audience.to = o.id;
            K.core.$$('.aud-opt', audWrap).forEach((x, i) => {
              const on = opts[i].id === o.id;
              x.classList.toggle('on', on);
              x.setAttribute('aria-checked', on ? 'true' : 'false');
            });
          }
        }, [el('b', { text: o.label }), el('span', { class: 'muted tiny', text: o.note })]);
        audWrap.appendChild(b);
      });

      const msg = el('p', { class: 'keep-msg', role: 'status' });

      const keep = el('button', {
        type: 'button', class: 'big-btn', onclick: () => {
          if (!draft.tool || draft.tool.empty()) {
            msg.textContent = 'Nothing on it yet.';
            return;
          }
          const piece = {
            id: K.core.uid('p'),
            day: today(),
            craft: draft.craft,
            prompt: S.promptIndex(today()),
            title: title.value.trim(),
            payload: draft.tool.payload(),
            audience: audience.to
          };
          const got = draft.tool.practice() || [];
          const fresh = got.filter(id => !S.practiceDone(state, id));
          for (const id of fresh) state.practice[id] = today();
          piece.practice = got;

          S.addPiece(state, piece);
          draft.tool.destroy();
          draft = { craft: null, tool: null, title: '' };
          onChange({ kept: piece, fresh });
        }
      }, ['Keep it']);

      keepRow.appendChild(el('div', { class: 'keep-inner' }, [
        title,
        el('div', { class: 'aud-wrap' }, [
          el('span', { class: 'lbl', text: 'Who sees it' }), audWrap
        ]),
        keep, msg
      ]));
    }

    if (draft.craft) {
      setCraft(draft.craft);
    } else {
      toolHost.appendChild(el('p', { class: 'empty-note', text:
        'Pick one. "Fits today" is a suggestion about the prompt, not a rule — ' +
        'answer it with whatever you want.' }));
    }

    return root;
  }

  /* A piece of yours, with whatever the circle said about it. Responses show
   * up the day after you shared, so there is nothing to sit and refresh for. */
  function pieceCard(state, piece, onChange) {
    const resp = K.peers.responsesFor(state, piece);
    const wrap = el('article', { class: 'card mine' });

    wrap.appendChild(el('div', { class: 'card-head' }, [
      el('div', {}, [
        el('b', { text: piece.title || 'untitled' }),
        el('span', { class: 'muted tiny', text: ' · ' + C.CRAFTS[piece.craft].name.toLowerCase() })
      ]),
      el('span', { class: 'chip' + (piece.audience === 'circle' ? ' chip-out' : ''),
        text: piece.audience === 'circle' ? 'circle' : 'just me' })
    ]));

    wrap.appendChild(K.card.body(piece.craft, piece.payload));

    if (piece.practice && piece.practice.length) {
      const names = piece.practice
        .map(id => (C.PRACTICE[piece.craft] || []).find(p => p.id === id))
        .filter(Boolean);
      if (names.length) {
        wrap.appendChild(el('div', { class: 'practice-hit' }, [
          el('span', { class: 'muted tiny', text: 'you also did: ' }),
          el('span', { class: 'tiny', text: names.map(n => n.name).join(' · ') })
        ]));
      }
    }

    if (piece.audience === 'circle') {
      if (resp.length) {
        const list = el('div', { class: 'responses' }, [
          el('h3', { class: 'sec tiny', text: 'What people said' })
        ]);
        for (const r of resp) {
          const p = K.peers.peer(r.from);
          const pr = C.PRAISE.find(x => x.id === r.praise);
          list.appendChild(el('div', { class: 'resp' }, [
            el('span', { class: 'avatar small', style: '--hue:' + p.hue, text: p.mark }),
            el('div', {}, [
              el('b', { text: p.name }),
              el('span', { text: ' — ' + (pr ? pr.t : '') }),
              r.text ? el('div', { class: 'muted small', text: r.text }) : null
            ])
          ]));
        }
        list.appendChild(el('p', { class: 'muted tiny', text:
          'Only you can see these. There is no count, and nobody else knows who said what.' }));
        wrap.appendChild(list);
      } else if (K.core.today() <= piece.day) {
        wrap.appendChild(el('p', { class: 'muted tiny pad', text:
          'Your circle sees this tomorrow. Anything they say will be here then — ' +
          'there is nothing to check for today.' }));
      }
    }

    return wrap;
  }

  function reset() {
    if (draft.tool) draft.tool.destroy();
    draft = { craft: null, tool: null, title: '' };
  }

  K.make = { build, pieceCard, reset };
})(window.Kiln = window.Kiln || {});

</script>
<script>
/* Kiln — the Circle: a feed that ends.
 *
 * The batch is everyone in your circle who made something today. It is built
 * once, stored, and does not change again until tomorrow. There is no
 * refresh gesture, no "new posts" pill, no infinite scroll, and nothing
 * loads when you reach the bottom, because there is a bottom and reaching it
 * is the normal way to finish.
 *
 * That one property — a finite, settled batch — removes most of what makes a
 * feed compulsive. You cannot pull a lever that has no handle. Everything
 * else in this file is downstream of it.
 *
 * The ordering is a short list of rules the user can read and switch off,
 * and every card will tell you which rule put it where it is. An algorithm
 * you can interrogate stops being a thing that happens to you.
 */
(function (K) {
  'use strict';
  const { el, today, plural, agoWords } = K.core;
  const C = K.content;
  const S = K.state;

  const RULE_TEXT = {
    chrono: 'Keep the circle in the order it was made. No ranking at all.',
    quiet: 'People you have not heard from in a while come first.',
    unseen: 'Things you have not seen yet come before things you have.',
    mycraft: 'If you made something today, put the same craft near the top.'
  };

  /* --- building the day's batch ------------------------------------------
   * Called at most once per day. Storing the ids means the order is fixed
   * even across reloads: the app cannot quietly reshuffle to show you
   * something it thinks will hold you longer, because it has already
   * committed to an order in writing. */
  function batch(state) {
    const d = today();
    if (state.batch.day === d && state.batch.ids.length) {
      return state.batch.ids.map(K.peers.postById).filter(Boolean);
    }
    const posts = K.peers.postsOn(d);
    const ordered = order(state, posts);
    state.batch = { day: d, ids: ordered.map(p => p.id) };
    return ordered;
  }

  function lastHeardFrom(state, peerId) {
    let last = -1;
    for (const id in state.seen) {
      if (id.indexOf(peerId + '@') === 0) {
        const day = parseInt(id.slice(id.indexOf('@') + 1), 10);
        if (day > last) last = day;
      }
    }
    return last;
  }

  function order(state, posts) {
    const d = today();
    const r = state.rules;
    const mineToday = S.piecesOn(state, d).map(p => p.craft);

    const scored = posts.map((p, i) => {
      let score = 0;
      let why = 'The order your circle has always been in.';

      if (r.unseen && state.seen[p.id] === undefined) {
        score -= 100;
        why = 'You have not seen this one yet.';
      }
      if (r.quiet) {
        const last = lastHeardFrom(state, p.peer);
        const gap = last < 0 ? 999 : d - last;
        if (gap >= 3) {
          score -= Math.min(gap, 60);
          why = last < 0
            ? 'You have not heard from ' + K.peers.peer(p.peer).name + ' before.'
            : 'You have not heard from ' + K.peers.peer(p.peer).name + ' since ' +
              agoWords(gap) + '.';
        }
      }
      if (r.mycraft && mineToday.indexOf(p.craft) >= 0) {
        score -= 40;
        why = 'You made a ' + C.CRAFTS[p.craft].name.toLowerCase() +
              ' today, and so did they.';
      }
      if (!r.chrono && !r.unseen && !r.quiet && !r.mycraft) {
        why = 'No rules are switched on, so this is just the circle in order.';
      }
      return { p, score, i, why };
    });

    scored.sort((a, b) => (a.score - b.score) || (a.i - b.i));
    return scored.map(s => { s.p.why = s.why; return s.p; });
  }

  /* --- the view ----------------------------------------------------------- */
  function build(state, onChange) {
    const root = el('section', { class: 'view feed' });
    const d = today();

    if (!K.charter.circleOpen(state)) {
      root.appendChild(gate(state, onChange));
      return root;
    }

    const posts = batch(state);

    root.appendChild(el('div', { class: 'feed-head' }, [
      el('h1', { class: 'sec big', text: posts.length
        ? plural(posts.length, 'person', 'people') + ' made something today'
        : 'Nobody made anything today' }),
      el('p', { class: 'muted small', text: posts.length
        ? 'That is the whole batch. It was decided this morning and it will not ' +
          'grow while you are reading it.'
        : 'That happens. Everyone in your circle is a person with a week going on.' })
    ]));

    const io = window.IntersectionObserver ? new IntersectionObserver(entries => {
      let touched = false;
      for (const e of entries) {
        if (e.isIntersecting && e.intersectionRatio > 0.5) {
          const id = e.target.dataset.post;
          if (id && S.markSeen(state, id)) touched = true;
          io.unobserve(e.target);
        }
      }
      if (touched) K.core.save(state);
    }, { threshold: [0.55] }) : null;

    for (const p of posts) {
      const card = postCard(state, p, onChange);
      card.dataset.post = p.id;
      root.appendChild(card);
      if (io) io.observe(card);
      else S.markSeen(state, p.id);
    }

    root.appendChild(endCard(state, posts.length));
    return root;
  }

  /* The make-first gate. It is the user's own rule, so the card says so, and
   * the way out is one tap — to the studio, not to a paywall. */
  function gate(state, onChange) {
    return el('div', { class: 'gate' }, [
      el('h1', { class: 'sec big', text: 'You asked for this one' }),
      el('p', { text:
        'You turned on "make before you look". The batch is sitting there and it ' +
        'is not going anywhere — it is the same eight people whether you open it ' +
        'now or tonight. Go and make the thing first.' }),
      el('div', { class: 'gate-acts' }, [
        el('button', {
          type: 'button', class: 'big-btn',
          onclick: () => onChange({ go: 'studio' })
        }, ['Open the studio']),
        el('button', {
          type: 'button', class: 'tool-btn quiet',
          onclick: () => onChange({ go: 'settings' })
        }, ['Change this rule'])
      ]),
      el('p', { class: 'muted small', text:
        'Turning it off takes effect tomorrow — that was the deal you made with ' +
        'yourself, and it is the only reason the rule is worth anything.' })
    ]);
  }

  function endCard(state, n) {
    const made = S.madeToday(state);
    return el('div', { class: 'end-card' }, [
      el('div', { class: 'end-rule' }),
      el('h2', { text: n ? 'That is everyone.' : 'Nothing today.' }),
      el('p', { class: 'muted', text: n
        ? 'You have reached the end of the day. There is nothing underneath this, ' +
          'and nothing new will appear if you wait. Tomorrow there will be a new ' +
          'prompt and a new batch.'
        : 'Come back tomorrow, or make something anyway.' }),
      el('p', { class: 'small', text: made
        ? 'You made something today too. Good day.'
        : 'You have not made anything today. That is allowed. So is closing the app.' })
    ]);
  }

  /* --- one post ------------------------------------------------------------ */
  function postCard(state, post, onChange) {
    const peer = K.peers.peer(post.peer);
    const wrap = el('article', { class: 'card' });

    wrap.appendChild(el('div', { class: 'card-head' }, [
      K.card.who(peer, peer.about),
      el('span', { class: 'chip quiet-chip', text: C.CRAFTS[post.craft].name.toLowerCase() })
    ]));

    if (post.title) wrap.appendChild(el('div', { class: 'card-title', text: post.title }));

    wrap.appendChild(K.card.body(post.craft, post.payload));

    if (post.note) wrap.appendChild(el('p', { class: 'card-note', text: post.note }));

    /* "Why am I seeing this" is one tap and always answerable. */
    const whyBtn = el('button', {
      type: 'button', class: 'why-btn',
      onclick: () => {
        whyBox.hidden = !whyBox.hidden;
        whyBtn.setAttribute('aria-expanded', whyBox.hidden ? 'false' : 'true');
      },
      'aria-expanded': 'false'
    }, ['why this is here']);
    const whyBox = el('p', { class: 'why-box', hidden: true, text: post.why || '' });

    wrap.appendChild(el('div', { class: 'card-foot' }, [whyBtn]));
    wrap.appendChild(whyBox);
    wrap.appendChild(respond(state, post, onChange));
    return wrap;
  }

  /* --- responding ----------------------------------------------------------
   * A specific sentence about the work, or nothing. There is no button that
   * costs nothing to press, because a button that costs nothing to press
   * produces a number, and a number produces a ranking. */
  function respond(state, post, onChange) {
    const box = el('div', { class: 'respond' });
    const given = state.given[post.id];

    if (given) {
      const pr = C.PRAISE.find(x => x.id === given.praise);
      box.appendChild(el('p', { class: 'muted small', text:
        'You said: ' + (pr ? pr.t : '') + (given.text ? ' — "' + given.text + '"' : '') }));
      return box;
    }

    /* Folded away until asked for. An always-open response panel under every
     * post is a standing invitation to react, and the invitation itself is a
     * pressure — the reason every platform leaves the box open is that an
     * open box gets used. Here, responding is a thing you decide to do. */
    const open = el('button', {
      type: 'button', class: 'say-btn', onclick: () => {
        open.remove();
        box.appendChild(panel);
      }
    }, ['Say something about this']);
    const panel = el('div', { class: 'respond-panel' });
    box.appendChild(open);

    let chosen = null;
    const pool = C.PRAISE.filter(p => p.for.indexOf(post.craft) >= 0);
    const chips = el('div', { class: 'chips', role: 'group', 'aria-label': 'Say something specific' });
    pool.forEach(p => {
      const b = el('button', {
        type: 'button', class: 'chip-btn', 'aria-pressed': 'false',
        onclick: () => {
          chosen = chosen === p.id ? null : p.id;
          K.core.$$('.chip-btn', chips).forEach(x => {
            const on = x.dataset.id === chosen;
            x.classList.toggle('on', on);
            x.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
          sync();
        }
      }, [p.t]);
      b.dataset.id = p.id;
      chips.appendChild(b);
    });

    const note = el('input', {
      type: 'text', class: 'resp-in', maxlength: '140',
      placeholder: 'Add a sentence, if you have one',
      'aria-label': 'Optional sentence'
    });

    const cool = el('p', { class: 'cool', hidden: true, role: 'status' });
    const send = el('button', { type: 'button', class: 'tool-btn go', disabled: true }, ['Send']);
    const hint = el('p', { class: 'muted tiny', text:
      'Only they will see this. Nobody is counting.' });

    let timer = null, left = 0;

    function hot(text) {
      const t = ' ' + text.toLowerCase() + ' ';
      for (const w of C.HEAT) if (t.indexOf(w) >= 0) return w;
      if (text.length > 12 && text === text.toUpperCase() && /[A-Z]/.test(text)) return 'shouting';
      return null;
    }

    function sync() {
      send.disabled = !chosen || left > 0;
      send.textContent = left > 0 ? 'Send in ' + left : 'Send';
    }

    /* The cool-down. Not a filter and not a ban: the message still sends,
     * intact, if you still want it in forty-five seconds. Almost nobody
     * does, and the ones who do meant it. */
    function checkHeat() {
      const w = hot(note.value);
      if (!w || timer) return;
      left = 45;
      cool.hidden = false;
      cool.textContent = 'That reads hot. Nothing is blocked — the send button just ' +
        'waits forty-five seconds. Change it, keep it, or delete it. It is yours either way.';
      sync();
      timer = setInterval(() => {
        left--;
        if (left <= 0) {
          clearInterval(timer); timer = null; left = 0;
          cool.textContent = 'Still want to send it? Go ahead.';
        }
        sync();
      }, 1000);
    }

    note.addEventListener('input', () => { sync(); });
    note.addEventListener('blur', checkHeat);

    send.addEventListener('click', () => {
      if (!chosen) return;
      const w = hot(note.value);
      if (w && left === 0 && !timer && !send.dataset.waited) {
        send.dataset.waited = '1';
        checkHeat();
        return;
      }
      state.given[post.id] = { praise: chosen, text: note.value.trim(), day: today() };
      if (timer) { clearInterval(timer); timer = null; }
      onChange({ responded: post.id });
    });

    panel.appendChild(chips);
    panel.appendChild(el('div', { class: 'resp-row' }, [note, send]));
    panel.appendChild(cool);
    panel.appendChild(hint);
    return box;
  }

  K.feed = { build, batch, order, RULE_TEXT };
})(window.Kiln = window.Kiln || {});

<script>
/* Kiln — the Shelf: everything you have made, and the only progress the app
 * keeps.
 *
 * The shelf is a monotone accumulator. It goes up and it never goes down.
 * There is no streak, no decay, no "you're falling behind", no weekly
 * comparison against your past self, and no consecutive-anything.
 *
 * This is the direct inversion of the streak, and it is worth being precise
 * about why. A streak's only real feature is that it can be destroyed, which
 * is what gives it its grip: loss hurts about twice as much as the
 * equivalent gain feels good, so the longer you hold one the more leverage
 * the app has over you. The leverage is the product. Removing the streak
 * does not make the app less motivating — it makes the motivation yours,
 * because what remains is the actual pile of things you actually made.
 *
 * So when you come back after six weeks, the app says exactly that: you were
 * gone, nothing happened to your work, here it is.
 */
(function (K) {
  'use strict';
  const { el, today, plural, dayShort, agoWords } = K.core;
  const C = K.content;
  const S = K.state;

  function build(state, onChange, away) {
    const root = el('section', { class: 'view shelf' });
    const d = today();

    if (away > 0) {
      root.appendChild(el('div', { class: 'welcome-back' }, [
        el('b', { text: 'You were away ' + plural(away, 'day') + '.' }),
        el('p', { text:
          'Nothing was lost, because there was never anything set up to be lost. ' +
          'No streak broke. Your shelf is exactly as you left it, ' +
          plural(state.pieces.length, 'thing') + ' and counting.' })
      ]));
    }

    /* --- the ladders ------------------------------------------------------ */
    const ladders = el('div', { class: 'ladders' });
    ['draw', 'write', 'beat'].forEach(id => {
      const craft = C.CRAFTS[id];
      const n = S.craftCount(state, id);
      const { cur, next } = S.levelFor(n);
      const prac = C.PRACTICE[id] || [];
      const doneN = prac.filter(p => S.practiceDone(state, p.id)).length;

      const card = el('div', { class: 'ladder' }, [
        el('div', { class: 'ladder-head' }, [
          el('span', { class: 'craft-mark', text: craft.mark }),
          el('div', {}, [
            el('b', { text: craft.name }),
            el('span', { class: 'muted tiny', text: ' · ' + cur.name })
          ])
        ]),
        el('p', { class: 'muted small', text: n
          ? plural(n, 'piece') + '. ' + (next
              ? plural(next.at - n, 'more') + ' and this becomes "' + next.name + '".'
              : 'You have been at this a while.')
          : 'Nothing yet. That is where everyone starts.' })
      ]);

      const list = el('ul', { class: 'practice' });
      prac.forEach(p => {
        const done = S.practiceDone(state, p.id);
        list.appendChild(el('li', { class: done ? 'done' : '' }, [
          el('span', { class: 'tick', text: done ? '✓' : '○' }),
          el('div', {}, [
            el('b', { text: p.name }),
            el('span', { class: 'muted tiny', text: ' — ' + p.note }),
            done ? el('span', { class: 'muted tiny', text:
              ' (' + dayShort(state.practice[p.id]) + ')' }) : null
          ])
        ]));
      });
      card.appendChild(list);
      card.appendChild(el('p', { class: 'muted tiny', text: doneN === prac.length
        ? 'All four. These do not reset.'
        : 'Nobody is told about these but you. They are checked from the work itself.' }));
      ladders.appendChild(card);
    });

    root.appendChild(el('h1', { class: 'sec big', text: 'What your hands can do' }));
    root.appendChild(ladders);

    /* --- the pile ---------------------------------------------------------- */
    root.appendChild(el('h1', { class: 'sec big', text: state.pieces.length
      ? plural(state.pieces.length, 'thing') + ', since ' + dayShort(state.createdDay)
      : 'Your shelf' }));

    if (!state.pieces.length) {
      root.appendChild(el('p', { class: 'muted', text:
        'Empty for now. Whatever you keep in the studio lands here and stays here.' }));
      return root;
    }

    let lastDay = null;
    const pieces = state.pieces.slice().reverse();
    for (const p of pieces) {
      if (p.day !== lastDay) {
        lastDay = p.day;
        const gap = d - p.day;
        root.appendChild(el('div', { class: 'day-sep' }, [
          el('b', { text: dayShort(p.day) }),
          el('span', { class: 'muted tiny', text: ' · ' + agoWords(gap) }),
          el('span', { class: 'muted tiny sep-prompt', text: C.PROMPTS[p.prompt]
            ? ' · ' + C.PROMPTS[p.prompt].t : '' })
        ]));
      }
      root.appendChild(K.make.pieceCard(state, p, onChange));
    }

    root.appendChild(el('p', { class: 'muted small pad', text:
      'This list only ever gets longer. Nothing here expires, and nothing here ' +
      'is worth more because it is recent.' }));

    return root;
  }

  K.shelf = { build };
})(window.Kiln = window.Kiln || {});

</script>
<script>
/* Kiln — the Watchtower: ten techniques, done to you on purpose.
 *
 * This is the part of the app that is actually about empowerment, and it is
 * the part most likely to be misread as a lecture, so the demos are real.
 * The variable-reward demo runs a genuine variable-ratio schedule and shows
 * you your own pull count. The drift demo really does move a baseline while
 * you watch. The collection demo really does measure your behaviour in this
 * tab and then shows you the payload it did not send.
 *
 * Being told a hook exists and feeling one close on you are different kinds
 * of knowing, and only the second one transfers to the next app. A child who
 * has watched a streak counter take a hostage in a sandbox will recognise
 * the shape of it in the wild, on an app that will never explain itself.
 *
 * None of these demos are wired to anything real. Nothing in here writes to
 * your pieces, your shelf, or your circle.
 */
(function (K) {
  'use strict';
  const { el, $, $$, plural } = K.core;
  const C = K.content;

  /* Behaviour this tab quietly measures, for the collection demo at the end.
   * It never leaves this object and it is wiped when you leave the tab. */
  const watched = { opened: Date.now(), expands: 0, longest: null, longestMs: 0, taps: 0, scroll: 0 };

  function build(state, onChange) {
    const root = el('section', { class: 'view tower' });
    watched.opened = Date.now();
    watched.expands = 0; watched.taps = 0; watched.scroll = 0;

    root.appendChild(el('div', { class: 'tower-head' }, [
      el('h1', { class: 'sec big', text: 'How the other apps work' }),
      el('p', { text:
        'Ten techniques, each with a working demo that does the thing to you. ' +
        'None of them are guesses about what apps might do — they are the ' +
        'standard toolkit, and most of them are in the app you used before ' +
        'this one.' }),
      el('p', { class: 'muted small', text:
        'You have read ' + state.read.length + ' of ' + C.PATTERNS.length + '. ' +
        'Nothing happens when you finish. There is no badge.' })
    ]));

    C.PATTERNS.forEach(pat => {
      root.appendChild(patternCard(state, pat, onChange));
    });

    root.appendChild(el('div', { class: 'end-card' }, [
      el('div', { class: 'end-rule' }),
      el('h2', { text: 'One question that covers most of it' }),
      el('p', { text:
        'When something in an app feels good, ask who chose the timing. If you ' +
        'chose it, it is a tool. If it chose you, it is a hook, and it was ' +
        'designed by someone who was paid for the time you spent.' })
    ]));

    return root;
  }

  function patternCard(state, pat, onChange) {
    const open = { at: 0 };
    const card = el('article', { class: 'tower-card' });
    const bodyBox = el('div', { class: 'tower-body', hidden: true });

    const head = el('button', {
      type: 'button', class: 'tower-head-btn', 'aria-expanded': 'false',
      onclick: () => {
        const show = bodyBox.hidden;
        bodyBox.hidden = !show;
        head.setAttribute('aria-expanded', show ? 'true' : 'false');
        card.classList.toggle('open', show);
        if (show) {
          watched.expands++;
          open.at = Date.now();
          if (!bodyBox.dataset.built) { fill(state, bodyBox, pat, onChange); bodyBox.dataset.built = '1'; }
          if (state.read.indexOf(pat.id) < 0) {
            state.read.push(pat.id);
            K.core.save(state);
          }
        } else if (open.at) {
          const ms = Date.now() - open.at;
          if (ms > watched.longestMs) { watched.longestMs = ms; watched.longest = pat.name; }
        }
      }
    }, [
      el('span', { class: 'tower-n', text: state.read.indexOf(pat.id) >= 0 ? '✓' : '·' }),
      el('div', {}, [
        el('b', { text: pat.name }),
        el('span', { class: 'muted tiny', text: pat.one })
      ])
    ]);

    card.appendChild(head);
    card.appendChild(bodyBox);
    return card;
  }

  function fill(state, box, pat, onChange) {
    box.appendChild(el('p', { text: pat.body }));
    box.appendChild(el('p', { text: pat.body2 }));
    const demo = el('div', { class: 'demo' }, [
      el('div', { class: 'demo-tag', text: 'live demo — this one is real' })
    ]);
    (DEMOS[pat.demo] || (() => {}))(demo, state);
    box.appendChild(demo);
    box.appendChild(el('div', { class: 'instead' }, [
      el('b', { text: 'What Kiln does instead' }),
      el('p', { text: pat.instead })
    ]));
  }

  /* ====================================================================== */
  const DEMOS = {};

  /* --- 1. variable-ratio reward ------------------------------------------ */
  DEMOS.variable = function (host) {
    /* A real VR schedule: the payout lands after a random 1–8 pulls, then a
     * fresh interval is drawn. This is the schedule in a slot machine and it
     * is the schedule behind pull-to-refresh. */
    let pulls = 0, wins = 0, need = 1 + Math.floor(Math.random() * 8), since = 0;
    const history = [];

    const face = el('div', { class: 'slot' , text: 'pull'});
    const tape = el('div', { class: 'tape', 'aria-hidden': 'true' });
    const read = el('p', { class: 'demo-read', role: 'status' });

    const btn = el('button', { type: 'button', class: 'tool-btn go', onclick: () => {
      pulls++; since++; watched.taps++;
      let win = false;
      if (since >= need) { win = true; wins++; since = 0; need = 1 + Math.floor(Math.random() * 8); }
      history.push(win);
      face.textContent = win ? '✦ something new' : 'nothing';
      face.classList.toggle('win', win);
      const dot = el('span', { class: 'tape-dot' + (win ? ' win' : '') });
      tape.appendChild(dot);
      if (tape.children.length > 60) tape.removeChild(tape.firstChild);
      read.textContent = 'You have pulled ' + pulls + ' times and been rewarded ' +
        wins + '. The next reward is between one and eight pulls away, redrawn ' +
        'every time. There is no pattern to find. That is the design — a ' +
        'schedule you could learn would stop working.';
    }}, ['Pull to refresh']);

    host.appendChild(face);
    host.appendChild(btn);
    host.appendChild(tape);
    host.appendChild(read);
    host.appendChild(el('p', { class: 'muted tiny', text:
      'Notice the urge to do one more to see. That urge is the product.' }));
  };

  /* --- 2. infinite scroll ------------------------------------------------- */
  DEMOS.infinite = function (host) {
    const FILL = ['a cat doing something', 'someone angry about a film',
      'a recipe with a long story first', 'a stranger\'s holiday',
      'an advert dressed as a friend', 'a fact that is not true',
      'a person you went to school with', 'someone very upset about nothing',
      'a clip of a clip of a clip', 'an argument you were not in'];

    let n = 0;
    const list = el('div', { class: 'scroller', tabindex: '0' });
    const count = el('p', { class: 'demo-read', role: 'status' });

    function add(k) {
      for (let i = 0; i < k; i++) {
        n++;
        list.appendChild(el('div', { class: 'scroll-item', text: n + '. ' + FILL[n % FILL.length] }));
      }
      count.textContent = 'Loaded ' + n + ' items. It will keep doing this. There ' +
        'is no bottom, so there is no moment where stopping is the obvious thing to do.';
    }
    add(12);
    list.addEventListener('scroll', () => {
      watched.scroll = Math.max(watched.scroll, list.scrollTop);
      if (list.scrollTop + list.clientHeight > list.scrollHeight - 60) add(8);
    });

    const finite = el('div', { class: 'scroller finite', hidden: true });
    ['Nour made a drawing', 'Imani wrote four lines', 'Okwe made a beat',
     'Yuki drew a map'].forEach(t => finite.appendChild(el('div', { class: 'scroll-item', text: t })));
    finite.appendChild(el('div', { class: 'scroll-end', text:
      'That is everyone. Nothing below this.' }));

    const swap = el('button', { type: 'button', class: 'tool-btn', onclick: () => {
      const showFinite = finite.hidden;
      finite.hidden = !showFinite;
      list.hidden = showFinite;
      swap.textContent = showFinite ? 'Back to the endless one' : 'Show me one with a bottom';
      count.hidden = showFinite;
    }}, ['Show me one with a bottom']);

    host.appendChild(list);
    host.appendChild(finite);
    host.appendChild(swap);
    host.appendChild(count);
  };

  /* --- 3. the streak ------------------------------------------------------ */
  DEMOS.streak = function (host) {
    let streak = 47, lost = false;
    const num = el('div', { class: 'streak-num', text: '47' });
    const sub = el('p', { class: 'demo-read', text: 'A 47-day streak. Think about how ' +
      'you would feel pressing the next button.' });

    const skip = el('button', { type: 'button', class: 'tool-btn', onclick: () => {
      if (lost) {
        streak = 47; lost = false;
        num.textContent = '47'; num.classList.remove('lost');
        sub.textContent = 'Back to 47. Notice that getting it back felt like much ' +
          'less than losing it did. That gap is the whole mechanism.';
        skip.textContent = 'Skip a day';
        return;
      }
      streak = 0; lost = true;
      num.textContent = '0'; num.classList.add('lost');
      sub.textContent = 'Gone. Note what it cost you: nothing. You cannot spend a ' +
        'streak, it does not make you better at anything, and the app lost nothing ' +
        'when it reset. The only thing that happened is that you feel bad, which ' +
        'was the feature.';
      skip.textContent = 'Give it back';
    }}, ['Skip a day']);

    const shelf = el('div', { class: 'demo-side' }, [
      el('b', { text: 'The same information, without the hostage' }),
      el('p', { class: 'muted small', text:
        'You made 47 things. ← This is true whether or not you show up tomorrow, ' +
        'and it is the only sentence of the two that is about you.' })
    ]);

    host.appendChild(num);
    host.appendChild(skip);
    host.appendChild(sub);
    host.appendChild(shelf);
  };

  /* --- 4. public numbers --------------------------------------------------- */
  DEMOS.metrics = function (host) {
    /* Two identical posts. Different numbers, assigned at random. */
    const a = 12 + Math.floor(Math.random() * 40);
    const b = 4000 + Math.floor(Math.random() * 40000);
    let live = a;

    function post(label, n, id) {
      const numEl = el('b', { class: 'metric-n', text: String(n) });
      return {
        node: el('div', { class: 'metric-post' }, [
          el('div', { class: 'metric-art', text: '"the door was already open"' }),
          el('div', { class: 'metric-row' }, [
            el('span', { text: label }), numEl, el('span', { class: 'muted tiny', text: 'likes' })
          ])
        ]),
        numEl
      };
    }

    const p1 = post('Post A', a);
    const p2 = post('Post B', b);
    const ask = el('p', { class: 'demo-read', text:
      'Which one is better? You already have an answer, and you have not read ' +
      'either of them properly.' });

    const reveal = el('button', { type: 'button', class: 'tool-btn', onclick: () => {
      ask.textContent = 'They are the same post. The two numbers were generated at ' +
        'random when this demo loaded. Nothing about the work differs — the only ' +
        'thing that differed was a number somebody chose to show you.';
      reveal.disabled = true;
    }}, ['Tell me which is better']);

    // The live one ticks while you watch, which is its own small hook.
    const tick = setInterval(() => {
      live += Math.random() < 0.4 ? 1 : 0;
      p1.numEl.textContent = String(live);
    }, 1400);
    host.addEventListener('DOMNodeRemoved', () => clearInterval(tick));
    setTimeout(() => clearInterval(tick), 120000);

    host.appendChild(el('div', { class: 'metric-pair' }, [p1.node, p2.node]));
    host.appendChild(reveal);
    host.appendChild(ask);
    host.appendChild(el('p', { class: 'muted tiny', text:
      'Post A is also climbing while you sit here. Watch how hard it is not to look at it.' }));
  };

  /* --- 5. vague notifications ---------------------------------------------- */
  DEMOS.notify = function (host) {
    const rows = [
      ['Someone commented on a post you interacted with.',
       'Kai replied "same" to a photo you tapped on in March.'],
      ['You have 3 new activities waiting.',
       'Two adverts and a suggested account you have declined twice.'],
      ['People are talking about you.',
       'Your name appears in a group chat you are not in. It is about lunch.'],
      ['🔥 Your friends are online right now!',
       'Two people opened the app in the last hour. Neither mentioned you.']
    ];
    const list = el('div', { class: 'notify-list' });
    rows.forEach(([vague, real]) => {
      const truth = el('div', { class: 'notify-truth', hidden: true, text: real });
      list.appendChild(el('div', { class: 'notify-row' }, [
        el('button', {
          type: 'button', class: 'notify-btn',
          onclick: () => { truth.hidden = !truth.hidden; watched.taps++; }
        }, [el('span', { class: 'buzz', text: '🔔' }), vague]),
        truth
      ]));
    });
    host.appendChild(list);
    host.appendChild(el('p', { class: 'demo-read', text:
      'Tap each one to see what it would say if it were complete. Every one of ' +
      'them becomes ignorable the moment it tells you the truth, which is exactly ' +
      'why it does not.' }));
  };

  /* --- 6. autoplay ---------------------------------------------------------- */
  DEMOS.autoplay = function (host) {
    let t = null, left = 5, played = 0;
    const screen = el('div', { class: 'auto-screen', text: 'a video, finishing' });
    const bar = el('div', { class: 'auto-bar' }, [el('i')]);
    const read = el('p', { class: 'demo-read' });

    function stop() { if (t) { clearInterval(t); t = null; } }

    function run() {
      stop(); left = 5;
      screen.textContent = 'Next up in 5…';
      screen.classList.add('counting');
      t = setInterval(() => {
        left--;
        if (left <= 0) {
          played++;
          screen.textContent = 'Playing the next one. (' + played + ' auto-played)';
          read.textContent = 'You did not choose that. Stopping something already ' +
            'running feels like an action; letting it run feels like nothing. The ' +
            'default did the deciding, which is what a default is for.';
          setTimeout(run, 1800);
          stop();
          return;
        }
        screen.textContent = 'Next up in ' + left + '…';
        bar.firstChild.style.width = ((5 - left) / 5 * 100) + '%';
      }, 1000);
    }

    const start = el('button', { type: 'button', class: 'tool-btn go', onclick: () => {
      run(); start.disabled = true; cancel.disabled = false;
    }}, ['Let it finish']);

    const cancel = el('button', { type: 'button', class: 'tool-btn', disabled: true, onclick: () => {
      stop();
      screen.textContent = 'stopped';
      screen.classList.remove('counting');
      start.disabled = false; cancel.disabled = true;
      read.textContent = 'You had to act to make nothing happen. That asymmetry is ' +
        'the whole design.';
    }}, ['Stop it']);

    host.appendChild(screen);
    host.appendChild(bar);
    host.appendChild(el('div', { class: 'demo-acts' }, [start, cancel]));
    host.appendChild(read);
  };

  /* --- 7. filter drift ------------------------------------------------------ */
  DEMOS.compare = function (host) {
    /* Nine plain faces, drawn procedurally. The slider "improves" all of them
     * at once, and a marker tracks where your sense of normal has moved to. */
    const canvas = el('canvas', { class: 'faces', role: 'img',
      'aria-label': 'Nine simple drawn faces' });
    const slider = el('input', { type: 'range', min: '0', max: '100', value: '0',
      class: 'tempo', 'aria-label': 'Filter strength' });
    const read = el('p', { class: 'demo-read' });
    const baseline = el('div', { class: 'drift' }, [
      el('i', { class: 'drift-fill' }), el('span', { class: 'drift-mark' })
    ]);

    let seenSum = 0, seenN = 0;

    function face(ctx, x, y, r, seed, k) {
      const rng = K.core.seeded('face', seed);
      const eye = 0.14 + rng() * 0.05 + k * 0.10;
      const jaw = 1 - k * 0.28;
      const chin = 1 + k * 0.10;
      ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--ink') || '#222';
      ctx.lineWidth = Math.max(1, r * 0.06);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 0.78 * jaw, r * 0.95 * chin, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(x - r * 0.3 * jaw, y - r * 0.15, r * eye, r * eye * 0.8, 0, 0, Math.PI * 2);
      ctx.ellipse(x + r * 0.3 * jaw, y - r * 0.15, r * eye, r * eye * 0.8, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - r * 0.22 * jaw, y + r * 0.42);
      ctx.quadraticCurveTo(x, y + r * (0.52 - k * 0.08), x + r * 0.22 * jaw, y + r * 0.42);
      ctx.stroke();
    }

    function paint() {
      const k = +slider.value / 100;
      const w = host.clientWidth || 320, h = 190;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      const cols = 5, r = Math.min(w / (cols * 2.4), 34);
      for (let i = 0; i < 9; i++) {
        const cx = (i % cols + 0.5) * (w / cols);
        const cy = (Math.floor(i / cols) + 0.5) * (h / 2);
        face(ctx, cx, cy, r, i, k);
      }
      seenSum += k; seenN++;
      const drift = seenN ? seenSum / seenN : 0;
      baseline.firstChild.style.width = (drift * 100) + '%';
      baseline.lastChild.style.left = (k * 100) + '%';
      read.textContent = k === 0
        ? 'Nine ordinary faces. Move the slider.'
        : 'Every face moved the same way, so none of them looks edited relative to ' +
          'the others — and your sense of an average face has already followed them ' +
          'to about ' + Math.round(drift * 100) + '% of the way. The bar is where ' +
          '"normal" has drifted to. Slide back to zero and see whether it looks right.';
    }

    slider.addEventListener('input', paint);
    host.appendChild(canvas);
    host.appendChild(slider);
    host.appendChild(baseline);
    host.appendChild(read);
    requestAnimationFrame(paint);
  };

  /* --- 8. ranking for reaction --------------------------------------------- */
  DEMOS.ranking = function (host) {
    const items = [
      { t: 'Nour posted a drawing of a bridge', heat: 2, when: 'this morning' },
      { t: 'A stranger says your city is the worst in the country', heat: 97, when: '3 days ago' },
      { t: 'Imani wrote four lines about rain', heat: 3, when: 'an hour ago' },
      { t: 'Two people arguing about a film neither watched', heat: 88, when: 'yesterday' },
      { t: 'Okwe made a beat', heat: 4, when: 'this afternoon' },
      { t: 'Someone is furious about a shop closing', heat: 76, when: 'last week' }
    ];
    let mode = 'time';
    const list = el('div', { class: 'rank-list' });

    function paint() {
      K.core.clear(list);
      const rows = items.slice();
      if (mode === 'heat') rows.sort((a, b) => b.heat - a.heat);
      rows.forEach(r => {
        list.appendChild(el('div', { class: 'rank-row' + (mode === 'heat' && r.heat > 50 ? ' hot' : '') }, [
          el('span', { text: r.t }),
          el('span', { class: 'muted tiny', text: mode === 'heat'
            ? 'predicted reaction ' + r.heat : r.when })
        ]));
      });
    }

    const swap = el('button', { type: 'button', class: 'tool-btn', onclick: () => {
      mode = mode === 'time' ? 'heat' : 'time';
      swap.textContent = mode === 'heat' ? 'Sort by when it happened' : 'Sort by predicted reaction';
      note.textContent = mode === 'heat'
        ? 'Nobody wrote a rule saying "show them angry things". The rule said ' +
          '"show them what gets a response", and anger won on the merits. Your ' +
          'friends dropped to the bottom without anyone deciding they should.'
        : 'Six things, in the order they happened. Three of your friends are in here.';
      paint();
    }}, ['Sort by predicted reaction']);

    const note = el('p', { class: 'demo-read', text:
      'Six things, in the order they happened. Three of your friends are in here.' });

    host.appendChild(list);
    host.appendChild(swap);
    host.appendChild(note);
    paint();
  };

  /* --- 9. the guilt-trip exit ----------------------------------------------- */
  DEMOS.exit = function (host) {
    let attempts = 0;
    const stage = el('div', { class: 'exit-stage' });
    const read = el('p', { class: 'demo-read' });

    const LINES = [
      ['Are you sure you want to leave?', 'Your friends will miss you.'],
      ['Really leaving?', 'You will lose your place in the conversation.'],
      ['Wait — just 5 more minutes?', 'There are 12 things you have not seen.'],
      ['Last chance.', 'People are posting right now.']
    ];

    function tryLeave() {
      if (attempts >= LINES.length) {
        K.core.clear(stage);
        stage.appendChild(el('p', { class: 'muted', text: 'Fine. Bye.' }));
        read.textContent = 'It took ' + plural(attempts + 1, 'tap') + ' to leave, and ' +
          'four separate attempts to make you feel bad about it. Staying was one tap ' +
          'the whole time.';
        return;
      }
      const [a, b] = LINES[attempts];
      attempts++;
      K.core.clear(stage);
      stage.appendChild(el('div', { class: 'exit-dialog' }, [
        el('b', { text: a }),
        el('p', { class: 'muted small', text: b }),
        el('button', { type: 'button', class: 'big-btn', onclick: () => {
          K.core.clear(stage);
          stage.appendChild(el('button', { type: 'button', class: 'tool-btn', onclick: tryLeave },
            ['Leave']));
          read.textContent = 'Staying is a big button. Leaving is small text. ' +
            'That asymmetry is not an accident and it is not a style choice.';
        }}, ['Stay']),
        el('button', { type: 'button', class: 'exit-link', onclick: tryLeave }, ['leave anyway'])
      ]));
    }

    stage.appendChild(el('button', { type: 'button', class: 'tool-btn', onclick: tryLeave }, ['Leave']));
    host.appendChild(stage);
    host.appendChild(read);
    host.appendChild(el('div', { class: 'demo-side' }, [
      el('b', { text: 'Kiln\'s version' }),
      el('p', { class: 'muted small', text: '"Done for today." → the app says goodbye. One tap, no argument.' })
    ]));
  };

  /* --- 10. quiet collection -------------------------------------------------- */
  DEMOS.harvest = function (host) {
    const out = el('pre', { class: 'payload' });
    const read = el('p', { class: 'demo-read', text:
      'Everything below was measured by this tab while you were reading it. None ' +
      'of it was requested, none of it is needed for anything, and all of it is ' +
      'the kind of thing that normally goes to a server.' });

    function paint() {
      const secs = Math.round((Date.now() - watched.opened) / 1000);
      const payload = {
        session_seconds: secs,
        sections_opened: watched.expands,
        taps_inside_demos: watched.taps,
        deepest_scroll_px: Math.round(watched.scroll),
        longest_read: watched.longest || '(still reading)',
        longest_read_seconds: Math.round(watched.longestMs / 1000),
        screen: window.innerWidth + 'x' + window.innerHeight,
        timezone_offset_minutes: new Date().getTimezoneOffset(),
        language: navigator.language,
        touch_capable: ('ontouchstart' in window),
        hour_of_day: new Date().getHours()
      };
      out.textContent = JSON.stringify(payload, null, 2);
    }
    const timer = setInterval(paint, 1000);
    setTimeout(() => clearInterval(timer), 300000);
    paint();

    host.appendChild(out);
    host.appendChild(read);
    host.appendChild(el('div', { class: 'demo-side' }, [
      el('b', { text: 'Where it went' }),
      el('p', { class: 'muted small', text:
        'Nowhere. This app contains no fetch, no XHR, no beacon and no socket — ' +
        'the build refuses to produce a file that has any of them. The object above ' +
        'was built in your browser and will be destroyed when you leave this tab. ' +
        'You can check: turn off the network and every part of Kiln still works.' })
    ]));
  };

  K.watchtower = { build };
})(window.Kiln = window.Kiln || {});
