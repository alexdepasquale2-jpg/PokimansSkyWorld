<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0608">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>DoomSpire</title>
<meta name="description" content="A Doom-simple raycast shooter with Burning-Crusade-deep MMORPG bones: six classes, talent trees, itemization, professions, reputation and a dungeon boss, all in one phone-playable file.">
<style>
/* DoomSpire — phone-first skin. Simple rendering, deep menus: the canvas
 * gets no texture budget, so the panels are where the game gets to look
 * like an MMO. Every tap target is at least 40px and nothing important
 * sits inside the safe-area insets.
 */
:root {
  --bg: #0a0608; --panel: #16101a; --panel-2: #1d1522; --line: #34222e;
  --ink: #e6ecf7; --dim: #9a8ea6; --dimmer: #6a5f70;
  --gold: #e8b23a; --amber: #f0a52e; --good: #79c07a; --bad: #d8564a; --warn: #e0a83f;
  --radius: 12px;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--sans);
  overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
h1, h2, h3, h4 { margin: 10px 0 6px; }
p { margin: 4px 0; }

#app { position: fixed; inset: 0; }
#stage { position: absolute; inset: 0; touch-action: none; background: #000; }
#scene { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

/* ---------- top HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; }
#hud-top {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding: calc(var(--safe-t) + 8px) calc(var(--safe-r) + 8px) 0 calc(var(--safe-l) + 8px);
}
#vitals { width: 46%; max-width: 240px; margin-left: 40px; }
.who { display: flex; align-items: baseline; gap: 6px; text-shadow: 0 1px 3px #000; margin-bottom: 4px; }
.who b { font-size: 14px; }
.who span { font-size: 11px; color: var(--dim); }
.bar {
  position: relative; height: 12px; border-radius: 6px; background: rgba(6, 4, 8, 0.66);
  overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 3px;
}
.bar i { position: absolute; inset: 0 auto 0 0; display: block; border-radius: 6px; transition: width .15s linear; }
.bar b {
  position: relative; display: block; font-size: 9px; font-weight: 600; line-height: 12px;
  padding-left: 6px; letter-spacing: .02em; text-shadow: 0 1px 2px rgba(0, 0, 0, .8); color: #fff;
}
.bar.hp i { background: linear-gradient(90deg, #a63f38, #d8564a); }
.bar.res i { background: #2f6fb0; }
.bar.xp { height: 5px; }
.bar.xp i { background: linear-gradient(90deg, #9a6fd0, #c08fe8); }
.bar.target i { background: linear-gradient(90deg, #a63f38, #d8564a); }
#combo-points { display: flex; gap: 3px; margin-top: 2px; }
#combo-points i { width: 10px; height: 10px; border-radius: 2px; background: rgba(255, 255, 255, .12); border: 1px solid var(--line); display: inline-block; }
#combo-points i.on { background: var(--amber); border-color: var(--amber); }

#hud-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
#wallet { font-size: 11px; color: var(--dim); text-shadow: 0 1px 3px #000; line-height: 1.5; }
#minimap { width: 88px; height: 88px; border-radius: 50%; border: 2px solid rgba(230, 236, 247, .3); }

#target-bar { align-self: center; width: 58%; max-width: 320px; margin-top: 4px; text-align: center; }
#target-bar span { font-size: 11px; text-shadow: 0 1px 3px #000; }
#target-bar.hidden { display: none; }

#combat-log {
  position: absolute; left: calc(var(--safe-l) + 10px); bottom: 168px; width: 56%; max-width: 280px;
  font-size: 11px; color: rgba(230, 236, 247, .82); text-shadow: 0 1px 3px #000;
  display: flex; flex-direction: column-reverse; max-height: 90px; overflow: hidden; pointer-events: none;
}

#interact-btn {
  position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%);
  pointer-events: auto; background: rgba(20, 12, 18, .82); border: 1px solid var(--gold);
  color: var(--gold); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
  white-space: nowrap;
}
#interact-btn.hidden { display: none; }

/* ---------- movement stick ---------- */
#stick {
  position: absolute; left: calc(var(--safe-l) + 14px); bottom: calc(var(--safe-b) + 16px);
  width: 104px; height: 104px; border-radius: 50%; background: rgba(230, 236, 247, .08);
  border: 1px solid rgba(230, 236, 247, .18); pointer-events: none;
}
#knob {
  position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
  border-radius: 50%; background: rgba(230, 236, 247, .28); border: 1px solid rgba(230, 236, 247, .4);
}

/* ---------- ability bar ---------- */
#ability-bar {
  position: absolute; right: calc(var(--safe-r) + 10px); bottom: calc(var(--safe-b) + 16px);
  display: grid; grid-template-columns: repeat(4, 50px); grid-auto-rows: 50px; gap: 6px;
  pointer-events: auto;
}
.ability-btn {
  position: relative; background: rgba(22, 16, 26, .82); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center;
}
.ability-btn .ab-icon { font-size: 22px; }
.ability-btn .ab-cd {
  position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: rgba(0, 0, 0, .68);
  pointer-events: none;
}
.ability-btn .ab-key {
  position: absolute; top: 2px; left: 4px; font-size: 8px; color: var(--dim);
}
.ability-btn.unaffordable { opacity: .45; }
.ability-btn:active { border-color: var(--gold); }

/* ---------- tabs / menu ---------- */
#tabs {
  position: absolute; top: calc(var(--safe-t) + 74px); left: 50%; transform: translateX(-50%);
  display: flex; gap: 4px; background: rgba(20, 12, 18, .7); border-radius: 16px; padding: 4px;
  pointer-events: auto; z-index: 15;
}
#tabs button { width: 30px; height: 30px; border-radius: 10px; font-size: 15px; }
#tabs button.active { background: rgba(232, 178, 58, .22); }
#menu-btn {
  position: absolute; top: calc(var(--safe-t) + 8px); left: calc(var(--safe-l) + 8px);
  width: 34px; height: 34px; border-radius: 50%; background: rgba(20, 12, 18, .7);
  border: 1px solid var(--line); pointer-events: auto; font-size: 15px; z-index: 15;
}

/* ---------- panels ---------- */
#panels {
  position: absolute; left: 3%; right: 3%; top: 14%; bottom: 12%; background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius); pointer-events: auto;
  display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); z-index: 10;
}
#panels.hidden { display: none; }
.panel-head {
  display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
  border-bottom: 1px solid var(--line); flex: none;
}
.panel-title { font-weight: 700; font-size: 15px; }
.panel-close { width: 30px; height: 30px; border-radius: 8px; background: var(--panel-2); font-size: 14px; }
.panel-body { padding: 12px 14px; overflow-y: auto; flex: 1; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; font-size: 12px; margin-bottom: 8px; }
.stat-grid b { float: right; color: var(--gold); }
.slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.slot-cell {
  text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px; min-height: 40px; display: flex; flex-direction: column; gap: 2px; font-size: 11px;
}
.slot-cell b { font-size: 12px; }
.slot-cell:disabled { opacity: .55; }

.talent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; }
.talent-tier { margin-bottom: 10px; }
.talent-tier.locked { opacity: .4; }
.tier-label { font-size: 11px; color: var(--dim); margin-bottom: 4px; }
.talent-row { display: flex; flex-wrap: wrap; gap: 6px; }
.talent-cell {
  width: 108px; text-align: left; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px; font-size: 10px; position: relative;
}
.talent-cell.ranked { border-color: var(--gold); }
.talent-cell b { display: block; font-size: 11px; margin: 2px 0; }
.talent-cell .t-icon { font-size: 16px; }
.talent-cell .t-rank { position: absolute; top: 6px; right: 6px; color: var(--dim); font-size: 9px; }
.talent-cell .t-desc { color: var(--dim); font-size: 9px; line-height: 1.3; }
.talent-cell:disabled { opacity: .4; }

.mini-btn {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px;
  padding: 6px 9px; font-size: 11px; white-space: nowrap;
}
.mini-btn:disabled { opacity: .4; }
.mini-btn:active { border-color: var(--gold); }

.item-row, .quest-row, .prof-block, .rep-row, .party-row, .recipe-row {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 10px; margin-bottom: 6px;
}
.item-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.item-main b { font-size: 12px; }
.item-sub { color: var(--dim); font-size: 10px; margin-left: 6px; }
.item-stats { color: var(--dim); font-size: 10px; margin-top: 2px; }
.item-btns { display: flex; gap: 4px; flex: none; }
.bag-header { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
.empty { color: var(--dim); font-size: 12px; }

.quest-sub { color: var(--dim); font-size: 10px; }
.quest-text { font-size: 11px; margin: 4px 0; }
.quest-row.dim { opacity: .6; }
.party-row.dim { opacity: .55; }

.skillbar {
  position: relative; height: 8px; border-radius: 4px; background: rgba(0, 0, 0, .4);
  overflow: hidden; margin: 4px 0;
}
.skillbar i { position: absolute; inset: 0 auto 0 0; background: var(--gold); display: block; }
.learn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.recipe-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }

/* ---------- overlays ---------- */
.overlay {
  position: absolute; inset: 0; background: rgba(6, 4, 8, .92); display: flex;
  align-items: center; justify-content: center; z-index: 20; pointer-events: auto;
  padding: calc(var(--safe-t) + 12px) calc(var(--safe-r) + 12px) calc(var(--safe-b) + 12px) calc(var(--safe-l) + 12px);
}
.overlay.hidden { display: none; }
.overlay-box { max-width: 420px; width: 100%; text-align: center; max-height: 100%; overflow-y: auto; }
.overlay-box h1 { font-size: 26px; letter-spacing: .04em; color: var(--gold); }
.overlay-box .tagline { color: var(--dim); margin-bottom: 16px; }
.overlay-box h2 { color: var(--bad); }
.wide-btn {
  display: block; width: 100%; padding: 12px; margin: 10px 0; background: var(--gold);
  color: #1a0f06; font-weight: 700; border-radius: 10px; font-size: 15px;
}
.wide-btn:disabled { opacity: .4; }
.wide-btn.hidden { display: none; }
#name-input {
  display: block; width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); font-size: 14px;
}
#class-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
.class-card {
  text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px; display: flex; flex-direction: column; gap: 2px;
}
.class-card.sel { border-color: var(--gold); background: rgba(232, 178, 58, .12); }
.cc-icon { font-size: 22px; }
.cc-name { font-weight: 700; font-size: 13px; }
.cc-role { color: var(--gold); font-size: 10px; }
.cc-blurb { color: var(--dim); font-size: 10px; line-height: 1.3; }
.respawn-btn { padding: 12px 22px; background: var(--bad); color: #fff; border-radius: 10px; font-weight: 700; margin-top: 12px; }

.hidden { display: none !important; }

</style>
</head>
<body>
<div id="app">

  <div id="stage">
    <canvas id="scene"></canvas>

    <div id="hud">
      <div id="hud-top">
        <div id="vitals">
          <div class="who"><b id="name-text"></b> <span id="lvl-text"></span></div>
          <div class="bar hp"><i id="hp-fill"></i><b id="hp-text"></b></div>
          <div class="bar res"><i id="res-fill"></i><b id="res-text"></b></div>
          <div class="bar xp"><i id="xp-fill"></i></div>
          <div id="combo-points"></div>
        </div>
        <div id="hud-right">
          <div id="wallet"><span id="zone-text"></span><br><span id="gold-text"></span></div>
          <canvas id="minimap"></canvas>
        </div>
      </div>

      <div id="target-bar" class="hidden">
        <span id="target-name"></span>
        <div class="bar target"><i id="target-fill"></i></div>
      </div>

      <div id="combat-log"></div>

      <button id="interact-btn" class="hidden"></button>
    </div>

    <div id="stick"><div id="knob"></div></div>

    <div id="ability-bar"></div>

    <div id="tabs">
      <button data-tab="character">👤</button>
      <button data-tab="talents">🌟</button>
      <button data-tab="bags">🎒</button>
      <button data-tab="quests">📜</button>
      <button data-tab="professions">⚙️</button>
      <button data-tab="reputation">🏳️</button>
      <button data-tab="party">🤝</button>
    </div>
    <button id="menu-btn">☰</button>

    <div id="panels" class="hidden panel">
      <div class="panel-head">
        <span class="panel-title"></span>
        <button class="panel-close">✕</button>
      </div>
      <div class="panel-body"></div>
    </div>

    <div id="deathscreen" class="hidden overlay">
      <div class="overlay-box">
        <h2>YOU HAVE FALLEN</h2>
        <p>The Scar remembers everyone eventually.</p>
        <button class="respawn-btn">Return to Camp</button>
      </div>
    </div>

    <div id="charcreate" class="overlay">
      <div class="overlay-box wide">
        <h1>DoomSpire</h1>
        <p class="tagline">Simple halls. Deep character.</p>
        <button id="continue-btn" class="hidden wide-btn">Continue</button>
        <input id="name-input" placeholder="Your name" maxlength="18">
        <div id="class-list"></div>
        <button id="begin-btn" class="wide-btn" disabled>Begin</button>
      </div>
    </div>

  </div>
</div>
<script>
/* DoomSpire — shared helpers: RNG, math, formatting, persistence.
 *
 * Nothing here knows about walls or talents. Content and systems build on
 * top of this the way PrimalIsle's core.js underpins that game.
 */
(function (DS) {
  'use strict';

  const SAVE_KEY = 'doomspire/save/v1';
  const SAVE_VERSION = 1;

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  const clamp01 = v => clamp(v, 0, 1);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const rndInt = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const chance = p => Math.random() < p;
  const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
  const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));

  /* Angle difference wrapped to [-PI, PI], and a turn that never overshoots. */
  function angDelta(a, b) {
    let d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }
  function turnToward(a, b, maxStep) {
    const d = angDelta(a, b);
    return a + clamp(d, -maxStep, maxStep);
  }

  /* Seeded RNG (mulberry32), used for loot rolls and anything that should be
   * reproducible from a saved seed rather than the wall-clock RNG. */
  function rngFrom(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // --- formatting ----------------------------------------------------------
  function fmt(n) {
    n = Math.floor(n);
    if (Math.abs(n) < 1000) return String(n);
    if (Math.abs(n) < 1e6) return (n / 1000).toFixed(Math.abs(n) < 1e4 ? 1 : 0).replace(/\.0$/, '') + 'k';
    return (n / 1e6).toFixed(2).replace(/\.0+$/, '') + 'M';
  }
  const pct = v => Math.round(v * 100) + '%';
  function titleCase(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // --- persistence -----------------------------------------------------------
  function save(game) {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ v: SAVE_VERSION, t: Date.now(), g: game }));
      return true;
    } catch (e) { console.warn('[doomspire] save failed', e); return false; }
  }
  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const payload = JSON.parse(raw);
      if (!payload || payload.v !== SAVE_VERSION || !payload.g) return null;
      return payload.g;
    } catch (e) { console.warn('[doomspire] load failed', e); return null; }
  }
  function wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } }

  DS.core = {
    SAVE_KEY, clamp, clamp01, lerp, rnd, rndInt, pick, chance, dist, dist2,
    angDelta, turnToward, rngFrom, fmt, pct, titleCase, save, load, wipe
  };
})(window.DS = window.DS || {});

</script>
<script>
/* DoomSpire — every static number in the game: classes, talents, items,
 * the bestiary, the four maps, quests, professions and factions.
 *
 * Nothing in here touches the DOM or the canvas. It is a book of facts that
 * every other module reads from, exactly the role PrimalIsle's content.js
 * plays for that game.
 */
(function (DS) {
  'use strict';
  const C = DS.core;

  const LEVEL_CAP = 30;
  const TALENT_START_LEVEL = 10;

  // --- gear slots & quality --------------------------------------------------
  const SLOTS = [
    'head', 'neck', 'shoulder', 'cloak', 'chest', 'wrist', 'hands', 'waist',
    'legs', 'feet', 'ring1', 'ring2', 'trinket1', 'trinket2', 'mainhand', 'offhand'
  ];
  const SLOT_WEIGHT = {
    head: 1, neck: 0.5, shoulder: 0.75, cloak: 0.5, chest: 1, wrist: 0.4,
    hands: 0.6, waist: 0.6, legs: 1, feet: 0.75, ring1: 0.5, ring2: 0.5,
    trinket1: 0.6, trinket2: 0.6, mainhand: 1.25, offhand: 0.85
  };
  const QUALITIES = [
    { key: 'poor', name: 'Poor', color: '#9d9d9d', mult: 0.6, weight: 0 },
    { key: 'common', name: 'Common', color: '#e6ecf7', mult: 1.0, weight: 60 },
    { key: 'uncommon', name: 'Uncommon', color: '#1eff00', mult: 1.4, weight: 30 },
    { key: 'rare', name: 'Rare', color: '#2f9dff', mult: 1.9, weight: 8.5 },
    { key: 'epic', name: 'Epic', color: '#c86dff', mult: 2.6, weight: 1.4 },
    { key: 'legendary', name: 'Legendary', color: '#ff8000', mult: 3.6, weight: 0.1 }
  ];
  const QUALITY_BY_KEY = Object.fromEntries(QUALITIES.map(q => [q.key, q]));

  function rollQuality(rng, floorKey) {
    const floorIdx = floorKey ? QUALITIES.findIndex(q => q.key === floorKey) : 1;
    const pool = QUALITIES.filter((q, i) => i >= Math.max(1, floorIdx) && q.weight > 0);
    const total = pool.reduce((s, q) => s + q.weight, 0);
    let r = rng() * total;
    for (const q of pool) { if ((r -= q.weight) <= 0) return q.key; }
    return pool[0].key;
  }

  /* Stat budget for a rolled item: level, slot and quality all scale it, then
   * the budget is spread over a primary pool (armor type/class flavour),
   * stamina (always present — nobody wants a purely offensive MMO), and a
   * chance at one secondary rating. */
  function rollItem(rng, ilvl, slot, qKey, styleHint) {
    qKey = qKey || rollQuality(rng);
    const q = QUALITY_BY_KEY[qKey];
    const w = SLOT_WEIGHT[slot] || 0.6;
    const budget = Math.max(1, Math.round(ilvl * 0.9 * q.mult * w));
    const isWeapon = slot === 'mainhand' || slot === 'offhand';
    const primaryPool = styleHint === 'str' ? ['str'] : styleHint === 'agi' ? ['agi'] : styleHint === 'int' ? ['int'] : ['str', 'agi', 'int'];
    const primary = primaryPool.length === 1 ? primaryPool[0] : primaryPool[Math.floor(rng() * primaryPool.length)];
    const stats = {};
    const staShare = isWeapon ? 0 : Math.round(budget * 0.35);
    const primShare = Math.round(budget * (isWeapon ? 0.55 : 0.4));
    if (staShare) stats.sta = staShare;
    if (primShare) stats[primary] = primShare;
    let rest = budget - staShare - primShare;
    if (!isWeapon) { stats.armor = Math.round(budget * 1.8); rest = Math.max(0, rest); }
    if (rest > 0 && rng() < 0.75) {
      const sec = rng() < 0.5 ? 'crit' : 'haste';
      stats[sec] = (stats[sec] || 0) + rest;
    } else if (rest > 0) {
      stats[primary] = (stats[primary] || 0) + rest;
    }
    let dmgLo = 0, dmgHi = 0, speed = 0;
    if (isWeapon) {
      speed = slot === 'offhand' ? 1.8 + rng() * 0.6 : 2.2 + rng() * 1.2;
      const dps = 1.1 * ilvl * q.mult;
      dmgLo = Math.max(1, Math.round(dps * speed * 0.8));
      dmgHi = Math.round(dps * speed * 1.2);
    }
    const name = nameItem(rng, slot, q, styleHint);
    return {
      iid: 'i' + Math.floor(rng() * 1e9).toString(36),
      name, slot, quality: qKey, ilvl, stats, dmgLo, dmgHi, speed,
      sell: Math.max(1, Math.round(budget * q.mult * (isWeapon ? 3 : 1.6)))
    };
  }

  // --- map builder --------------------------------------------------------
  /* Rooms are rectangles, corridors are rectangles, and the border is
   * whatever the grid started filled with — a small level-compiler instead
   * of hand-aligned ASCII art, so every map is guaranteed rectangular and
   * every carve is guaranteed to stay inside the walls. */
  function mkGrid(w, h, fill) {
    const cells = [];
    for (let y = 0; y < h; y++) cells.push(new Array(w).fill(fill == null ? 1 : fill));
    return { w, h, cells };
  }
  function carve(m, x0, y0, x1, y1, val) {
    val = val == null ? 0 : val;
    for (let y = Math.max(1, y0); y <= Math.min(m.h - 2, y1); y++)
      for (let x = Math.max(1, x0); x <= Math.min(m.w - 2, x1); x++)
        m.cells[y][x] = val;
  }

<script>
/* DoomSpire — the renderer and the touch input, and nothing else.
 *
 * The renderer is deliberately the simplest raycaster that still reads as
 * Doom: vertical-strip DDA walls in one flat colour per wall type, shaded by
 * side and by distance, no textures. Floor and ceiling are cheap horizontal
 * bands rather than per-pixel casting. Sprites are a coloured disc and an
 * emoji glyph, billboarded and depth-tested against the wall the ray behind
 * them actually hit. That is the whole trick; everything else in the game
 * is the MMO sitting on top of it.
 */
(function (DS) {
  'use strict';
  const C = DS.core;
  const FOV = 1.15; // ~66 degrees, classic Doom-ish field of view

  function wallColorFor(cellVal, palette) {
    return cellVal === 2 ? palette.wall2 : palette.wall1;
  }
  function shade(hex, factor) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = C.clamp(Math.round(r * factor), 0, 255);
    g = C.clamp(Math.round(g * factor), 0, 255);
    b = C.clamp(Math.round(b * factor), 0, 255);
    return `rgb(${r},${g},${b})`;
  }

  /* Casts every column, draws floor/ceiling/walls straight to ctx, and
   * returns the per-column depth buffer sprites are tested against. */
  function castWalls(ctx, W, H, zone, player) {
    const grid = zone.grid, pal = zone.palette;
    const dirX = Math.cos(player.angle), dirY = Math.sin(player.angle);
    const planeLen = Math.tan(FOV / 2);
    const planeX = -dirY * planeLen, planeY = dirX * planeLen;
    const zbuffer = new Float32Array(W);
    const half = H / 2;

    // Floor and ceiling: cheap distance-shaded horizontal bands.
    ctx.fillStyle = pal.ceil; ctx.fillRect(0, 0, W, half);
    ctx.fillStyle = pal.floor; ctx.fillRect(0, half, W, half);
    const bandStep = Math.max(2, Math.floor(H / 90));
    for (let y = half; y < H; y += bandStep) {
      const rowDist = half / (y - half + 1) * 0.9;
      const f = C.clamp(1.15 - rowDist * 0.10, 0.18, 1.0);
      ctx.fillStyle = shade(pal.floor, f);
      ctx.fillRect(0, y, W, bandStep);
      const cy = H - y - bandStep;
      ctx.fillStyle = shade(pal.ceil, f * 0.85);
      ctx.fillRect(0, Math.max(0, cy), W, bandStep);
    }

    for (let x = 0; x < W; x++) {
      const cameraX = (2 * x) / W - 1;
      const rayDirX = dirX + planeX * cameraX;
      const rayDirY = dirY + planeY * cameraX;
      let mapX = Math.floor(player.x), mapY = Math.floor(player.y);
      const deltaDistX = rayDirX === 0 ? 1e30 : Math.abs(1 / rayDirX);
      const deltaDistY = rayDirY === 0 ? 1e30 : Math.abs(1 / rayDirY);
      let stepX, stepY, sideDistX, sideDistY;
      if (rayDirX < 0) { stepX = -1; sideDistX = (player.x - mapX) * deltaDistX; }
      else { stepX = 1; sideDistX = (mapX + 1 - player.x) * deltaDistX; }
      if (rayDirY < 0) { stepY = -1; sideDistY = (player.y - mapY) * deltaDistY; }
      else { stepY = 1; sideDistY = (mapY + 1 - player.y) * deltaDistY; }

      let side = 0, hitVal = 1, steps = 0;
      while (steps++ < 256) {
        if (sideDistX < sideDistY) { sideDistX += deltaDistX; mapX += stepX; side = 0; }
        else { sideDistY += deltaDistY; mapY += stepY; side = 1; }
        if (mapX < 0 || mapY < 0 || mapX >= grid.w || mapY >= grid.h) { hitVal = 1; break; }
        const v = grid.cells[mapY][mapX];
        if (v !== 0) { hitVal = v; break; }
      }
      const perp = side === 0 ? (sideDistX - deltaDistX) : (sideDistY - deltaDistY);
      const dist = Math.max(0.05, perp);
      zbuffer[x] = dist;
      const lineH = Math.min(H * 4, H / dist);
      const drawStart = Math.max(0, half - lineH / 2);
      const drawEnd = Math.min(H, half + lineH / 2);
      const fog = C.clamp(1 - dist / 16, 0.12, 1);
      const sideShade = side === 1 ? 0.72 : 1.0;
      ctx.fillStyle = shade(wallColorFor(hitVal, pal), fog * sideShade);
      ctx.fillRect(x, drawStart, 1, Math.max(1, drawEnd - drawStart));
    }
    return zbuffer;
  }

  /* Projects a world point into screen space against the same camera used
   * for the walls this frame, so sprites and nameplates line up. */
  function project(player, W, H, ex, ey) {
    const dirX = Math.cos(player.angle), dirY = Math.sin(player.angle);
    const planeLen = Math.tan(FOV / 2);
    const planeX = -dirY * planeLen, planeY = dirX * planeLen;
    const sx = ex - player.x, sy = ey - player.y;
    const invDet = 1 / (planeX * dirY - dirX * planeY);
    const tx = invDet * (dirY * sx - dirX * sy);
    const ty = invDet * (-planeY * sx + planeX * sy);
    if (ty <= 0.05) return { visible: false, depth: ty };
    const screenX = (W / 2) * (1 + tx / ty);
    const scale = H / ty;
    return { visible: true, depth: ty, screenX, scale };
  }

  /* Draws one billboard: a team-coloured disc with an emoji glyph on it,
   * clipped by the wall depth buffer at its own screen column. */
  function drawSprite(ctx, W, H, zbuffer, proj, opts) {
    if (!proj.visible) return;
    const col = C.clamp(Math.floor(proj.screenX), 0, W - 1);
    if (proj.depth > zbuffer[col] + 0.15) return;
    const size = C.clamp(proj.scale * (opts.height || 0.9), 4, H * 1.4);
    const cy = H / 2 + H / 2 - size * (opts.footOffset != null ? opts.footOffset : 0.5);
    const top = cy - size;
    if (proj.screenX < -size || proj.screenX > W + size) return;
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = opts.ring || '#c0392b';
    ctx.beginPath();
    ctx.ellipse(proj.screenX, cy - size * 0.5, size * 0.42, size * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = `${Math.max(8, size * 0.62)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(opts.icon || '?', proj.screenX, cy - size * 0.52);
    ctx.restore();
    return { screenX: proj.screenX, top, size, cy };
  }

  function minimap(ctx, canvas, zone, player, entities) {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(6,10,18,0.72)';
    ctx.fillRect(0, 0, W, H);
    const grid = zone.grid;
    const range = 11; // world units shown across the minimap
    const scale = W / (range * 2);
    const px = player.x, py = player.y;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(-player.angle + Math.PI / 2);
    const x0 = Math.max(0, Math.floor(px - range)), x1 = Math.min(grid.w - 1, Math.ceil(px + range));
    const y0 = Math.max(0, Math.floor(py - range)), y1 = Math.min(grid.h - 1, Math.ceil(py + range));
    ctx.fillStyle = 'rgba(220,230,247,0.16)';
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      if (grid.cells[y][x] === 0) ctx.fillRect((x - px) * scale, (y - py) * scale, scale + 1, scale + 1);
    }
    (entities || []).forEach(e => {
      ctx.fillStyle = e.color || '#e0655a';
      ctx.beginPath();
      ctx.arc((e.x - px) * scale, (e.y - py) * scale, 3, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
    ctx.fillStyle = '#79c07a';
    ctx.beginPath();
    ctx.moveTo(W / 2, H / 2 - 6); ctx.lineTo(W / 2 - 5, H / 2 + 5); ctx.lineTo(W / 2 + 5, H / 2 + 5);
    ctx.closePath(); ctx.fill();
  }

  // --- input: left move-stick, right-side drag-to-look, keyboard fallback ---
  function makeInput(els) {
    const st = {
      moveX: 0, moveY: 0, turnDelta: 0, keys: {},
      touches: {} // pointerId -> {kind:'stick'|'look', ...}
    };
    const stick = els.stick, knob = els.knob, stage = els.stage;
    let stickCenter = null;

    function stickStart(id, x, y) {
      const r = stick.getBoundingClientRect();
      stickCenter = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      st.touches[id] = { kind: 'stick' };
      stickMove(id, x, y);
    }
    function stickMove(id, x, y) {
      if (!stickCenter) return;
      const maxR = 42;
      let dx = x - stickCenter.x, dy = y - stickCenter.y;
      const d = Math.hypot(dx, dy) || 1;
      const clampD = Math.min(maxR, d);
      dx = (dx / d) * clampD; dy = (dy / d) * clampD;
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
      st.moveX = dx / maxR; st.moveY = dy / maxR;
    }
    function stickEnd() {
      st.moveX = 0; st.moveY = 0;
      knob.style.transform = 'translate(0,0)';
    }

    stage.addEventListener('pointerdown', ev => {
      const stickBox = stick.getBoundingClientRect();
      const inStick = ev.clientX >= stickBox.left - 24 && ev.clientX <= stickBox.right + 24 &&
        ev.clientY >= stickBox.top - 24 && ev.clientY <= stickBox.bottom + 24;
      if (ev.target.closest('button') || ev.target.closest('.panel')) return;
      if (inStick) { stickStart(ev.pointerId, ev.clientX, ev.clientY); }
      else { st.touches[ev.pointerId] = { kind: 'look', lastX: ev.clientX, lastY: ev.clientY }; }
      ev.target.setPointerCapture && ev.target.setPointerCapture(ev.pointerId);
    });
    stage.addEventListener('pointermove', ev => {
      const t = st.touches[ev.pointerId];
      if (!t) return;
      if (t.kind === 'stick') stickMove(ev.pointerId, ev.clientX, ev.clientY);
      else {
        st.turnDelta += (ev.clientX - t.lastX) * 0.0062;
        t.lastX = ev.clientX; t.lastY = ev.clientY;
      }
    });
    function endTouch(ev) {
      const t = st.touches[ev.pointerId];
      if (t && t.kind === 'stick') stickEnd();
      delete st.touches[ev.pointerId];
    }
    stage.addEventListener('pointerup', endTouch);
    stage.addEventListener('pointercancel', endTouch);

    window.addEventListener('keydown', e => { st.keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => { st.keys[e.key.toLowerCase()] = false; });

    function frameAxes() {
      let mx = st.moveX, my = st.moveY, turn = st.turnDelta;
      st.turnDelta = 0;
      if (st.keys['w']) my = -1; if (st.keys['s']) my = 1;
      if (st.keys['a']) mx = -1; if (st.keys['d']) mx = 1;
      if (st.keys['arrowleft'] || st.keys['q']) turn -= 0.045;
      if (st.keys['arrowright'] || st.keys['e']) turn += 0.045;
      return { mx, my, turn };
    }
    return Object.assign(st, { frameAxes });
  }

  DS.engine = { FOV, castWalls, project, drawSprite, minimap, makeInput };
})(window.DS = window.DS || {});

<script>
/* DoomSpire — the character: stats, leveling, gear, bags, talents,
 * professions, reputation, quest log and companions.
 *
 * Everything here is pure data manipulation. Nothing draws, nothing moves
 * anyone in the world — sim.js and world.js call into this to change the
 * character and read the result back.
 */
(function (DS) {
  'use strict';
  const C = DS.core;
  const K = DS.content;

  const BAG_SIZE = 24;
  const RESOURCE_MAX = { rage: 100, energy: 100 };

  function xpForLevel(level) {
    return Math.round(45 * Math.pow(level, 2.15) + 55 * level);
  }

  function newCharacter(name, clsId) {
    const cls = K.CLASSES[clsId];
    const zone = K.ZONES.scar;
    return {
      name: name || 'Adventurer', cls: clsId, level: 1, xp: 0,
      x: zone.spawn.x, y: zone.spawn.y, angle: zone.spawn.facing || 0, zone: 'scar',
      talentPoints: 0, talents: {},
      equip: Object.fromEntries(K.SLOTS.map(s => [s, null])),
      bags: [], gold: 15,
      quests: { active: {}, completed: [] }, flags: {},
      rep: Object.fromEntries(Object.keys(K.FACTIONS).map(f => [f, 0])),
      professions: { learned: [], skill: {} },
      companions: {},
      resource: { current: cls.resource === 'mana' ? 30 : cls.resource === 'rage' ? 0 : 100 },
      comboPoints: 0,
      hp: { current: 1, max: 1 }, // filled in by refreshVitals right after creation
      buffs: [], cooldowns: {},
      alive: true, log: []
    };
  }

  // --- derived stats -----------------------------------------------------
  function classModifiers(player) {
    const cls = K.CLASSES[player.cls];
    const mods = {};
    let unlocked = [];
    for (const t of cls.talents) {
      const rank = player.talents[t.id] || 0;
      if (rank <= 0) continue;
      if (t.mod) mods[t.mod.key] = (mods[t.mod.key] || 0) + t.mod.perRank * rank;
      if (t.unlockAbility) unlocked.push(t.unlockAbility);
    }
    return { mods, unlockedAbilities: unlocked };
  }

  function gearTotals(player) {
    const tot = { str: 0, agi: 0, int: 0, sta: 0, spirit: 0, armor: 0, crit: 0, haste: 0 };
    K.SLOTS.forEach(s => {
      const it = player.equip[s];
      if (!it) return;
      Object.entries(it.stats || {}).forEach(([k, v]) => { tot[k] = (tot[k] || 0) + v; });
    });
    return tot;
  }

  /* Recomputed on demand rather than cached — cheap, and it means gear and
   * talent changes are correct on the very next read with no invalidation
   * bugs to chase. */
  function derived(player) {
    const cls = K.CLASSES[player.cls];
    const { mods } = classModifiers(player);
    const gear = gearTotals(player);
    const base = k => 6 + (cls.growth[k] || 0) * player.level;
    const stat = k => (base(k) + (gear[k] || 0)) * (1 + (mods['statPct.' + k] || 0));
    const str = stat('str'), agi = stat('agi'), int_ = stat('int'), sta = stat('sta'), spirit = stat('spirit');

    const attackPower = Math.round((cls.primary === 'str' ? str * 2.2 : cls.primary === 'agi' ? agi * 2.2 : str + agi) + (mods.apFlatPerRank || 0) + (mods.apFlat || 0));
    const spellPower = Math.round(int_ * 1.6);
    const armor = Math.round((gear.armor || 0) * (1 + (mods.armorPct || 0)));
    const maxHealth = Math.round((60 + player.level * 11 + sta * 11) * (1 + (mods.healthPct || 0)));
    const resKind = cls.resource;
    let maxResource = 100;
    if (resKind === 'mana') maxResource = Math.round((25 + player.level * 8 + int_ * 9) * (1 + (mods.manaPct || 0)));
    else maxResource = RESOURCE_MAX[resKind] || 100;

    const critChance = C.clamp(0.04 + (gear.crit || 0) * 0.0035 + (mods.meleeCrit || 0) + (mods.rangedCrit || 0) + (mods.spellCrit || 0), 0.02, 0.6);
    const hastePct = C.clamp((gear.haste || 0) * 0.0035, 0, 0.6);
    const dodge = C.clamp(0.03 + (mods.dodge || 0), 0, 0.5);
    const parry = C.clamp(mods.parry || 0, 0, 0.4);
    const block = C.clamp(mods.block || 0, 0, 0.4);

    return {
      str, agi, int: int_, sta, spirit, attackPower, spellPower, armor,
      maxHealth, maxResource, resKind, critChance, hastePct, dodge, parry, block, mods
    };
  }

  function refreshVitals(player) {
    const d = derived(player);
    const hpRatio = player.hp.max > 0 ? player.hp.current / player.hp.max : 1;
    player.hp.max = d.maxHealth;
    player.hp.current = player.hp.current <= 0 ? 0 : Math.round(d.maxHealth * hpRatio);
    if (player.resource.current == null) player.resource.current = d.maxResource;
    player.resource.max = d.maxResource;
    return d;
  }

  // --- leveling ------------------------------------------------------------
  function grantXP(player, amount) {
    if (player.level >= K.LEVEL_CAP) return { leveled: false };
    player.xp += Math.round(amount);
    let leveled = false, newTalentPts = 0;
    while (player.level < K.LEVEL_CAP && player.xp >= xpForLevel(player.level)) {
      player.xp -= xpForLevel(player.level);
      player.level++;
      leveled = true;
      if (player.level >= K.TALENT_START_LEVEL) { player.talentPoints++; newTalentPts++; }
      const d = refreshVitals(player);
      player.hp.current = d.maxHealth;
      player.resource.current = d.maxResource;
    }
    if (player.level >= K.LEVEL_CAP) player.xp = 0;
    return { leveled, newTalentPts };
  }

  // --- talents -------------------------------------------------------------
  function talentPointsSpent(player) { return Object.values(player.talents).reduce((s, r) => s + r, 0); }
  function talentTierUnlocked(player, tier) { return talentPointsSpent(player) >= K.talentTiers()[tier]; }
  function canSpendTalent(player, talentId) {
    const cls = K.CLASSES[player.cls];
    const t = cls.talents.find(x => x.id === talentId);

    if (player.talentPoints <= 0) return false;
    if (!talentTierUnlocked(player, t.tier)) return false;

    return cur < t.maxRank;
  }
  function spendTalent(player, talentId) {
    if (!canSpendTalent(player, talentId)) return false;
    player.talents[talentId] = (player.talents[talentId] || 0) + 1;
    player.talentPoints--;
    return true;
  }
  function resetTalents(player) {
    const refund = talentPointsSpent(player);
    player.talents = {};
    player.talentPoints += refund;
  }
  function abilityList(player) {
    const cls = K.CLASSES[player.cls];
    const { unlockedAbilities } = classModifiers(player);
    const known = cls.abilities.filter(a => !a.requiresTalent || (player.talents[a.requiresTalent] || 0) > 0);
    return known.concat(unlockedAbilities);
  }

  // --- inventory & gear ------------------------------------------------------
  function addItem(player, item) {
    if (player.bags.length >= BAG_SIZE) return false;
    player.bags.push(item);
    return true;
  }
  function removeItem(player, iid) {
    const i = player.bags.findIndex(it => it.iid === iid);
    if (i < 0) return null;
    return player.bags.splice(i, 1)[0];
  }
  function equipFromBag(player, iid) {
    const item = removeItem(player, iid);
    if (!item) return false;
    const slot = item.slot === 'ring1' && player.equip.ring1 && !player.equip.ring2 ? 'ring2'
      : item.slot === 'trinket1' && player.equip.trinket1 && !player.equip.trinket2 ? 'trinket2' : item.slot;
    const old = player.equip[slot];
    player.equip[slot] = item;
    if (old) player.bags.push(old);
    return true;
  }
  function unequipToBag(player, slot) {
    const item = player.equip[slot];
    if (!item) return false;
    if (player.bags.length >= BAG_SIZE) return false;
    player.equip[slot] = null;
    player.bags.push(item);
    return true;
  }

  // --- reputation ------------------------------------------------------------
  function addRep(player, factionId, amount) {
    player.rep[factionId] = (player.rep[factionId] || 0) + amount;
  }

  // --- professions -------------------------------------------------------
  function learnProfession(player, profId) {
    if (player.professions.learned.includes(profId)) return false;
    if (player.professions.learned.length >= 2) return false;
    player.professions.learned.push(profId);
    player.professions.skill[profId] = 1;
    return true;
  }
  function gatherSkillUp(player, profId, tier) {
    const cur = player.professions.skill[profId] || 0;
    const cap = tier * 75 + 75;
    if (cur >= cap) return 0;
    const gain = C.rndInt(1, 3);
    player.professions.skill[profId] = Math.min(300, cur + gain);
    return gain;
  }

  // --- quests ----------------------------------------------------------------
  function questAvailable(player, qid) {
    const q = K.QUESTS[qid];
    if (!q) return false;
    if (player.quests.active[qid] || player.quests.completed.includes(qid)) return false;
    if (player.level < q.level - 2) return false;
    if (q.requires && !q.requires.every(r => player.quests.completed.includes(r))) return false;
    return true;
  }
  function acceptQuest(player, qid) {
    if (!questAvailable(player, qid)) return false;
    player.quests.active[qid] = { progress: 0 };
    return true;
  }
  function questReadyToTurnIn(player, qid) {
    const q = K.QUESTS[qid];
    const a = player.quests.active[qid];
    if (!q || !a) return false;
    if (q.kind === 'talk') return true;
    return a.progress >= (q.count || 1);
  }
  function noteKill(player, mobTpl) {
    Object.entries(player.quests.active).forEach(([qid, a]) => {
      const q = K.QUESTS[qid];
      if (q.kind === 'kill' && q.target === mobTpl) a.progress = Math.min(q.count, a.progress + 1);
    });
  }
  function noteCollect(player, itemId, count) {
    Object.entries(player.quests.active).forEach(([qid, a]) => {
      const q = K.QUESTS[qid];
      if (q.kind === 'collect' && q.item === itemId) {
        const have = player.bags.filter(b => b.tplId === itemId).length;
        a.progress = Math.min(q.count, have);
      }
    });
  }
  function turnInQuest(player, qid) {
    if (!questReadyToTurnIn(player, qid)) return null;
    const q = K.QUESTS[qid];
    delete player.quests.active[qid];
    player.quests.completed.push(qid);
    if (q.kind === 'collect') {
      let need = q.count;
      player.bags = player.bags.filter(b => { if (need > 0 && b.tplId === q.item) { need--; return false; } return true; });
    }
    grantXP(player, q.xp);
    player.gold += q.gold || 0;
    if (q.rep) addRep(player, q.rep.faction, q.rep.amount);
    if (q.grantsFlag) player.flags[q.grantsFlag] = true;
    if (q.companion) player.companions[q.companion] = { recruited: true, alive: true };
    return q;
  }

  DS.player = {
    BAG_SIZE, xpForLevel, newCharacter, derived, refreshVitals, gearTotals, classModifiers,
    grantXP, talentPointsSpent, talentTierUnlocked, canSpendTalent, spendTalent, resetTalents, abilityList,
    addItem, removeItem, equipFromBag, unequipToBag, addRep,
    learnProfession, gatherSkillUp,
    questAvailable, acceptQuest, questReadyToTurnIn, noteKill, noteCollect, turnInQuest
  };
})(window.DS = window.DS || {});

<script>
/* DoomSpire — ability resolution, damage/healing math, buffs and cooldowns.
 *
 * Player, companions and mobs all funnel through the same handful of
 * functions here. A companion is just a player-shaped object without gear
 * (see DS.player.derived — it tolerates an empty equip/talents object), so
 * "group content" is the same code path as soloing, the way PrimalIsle's
 * other thirty-four dinosaurs run through the same dino.js as the player.
 */
(function (DS) {
  'use strict';
  const C = DS.core;
  const K = DS.content;
  const GCD = 1.0;

  function getCombatStats(actor) {
    if (actor.kind === 'mob') return actor.combat;
    return DS.player.derived(actor);
  }

  function mitigatePhysical(dmg, armor, level) {
    const mitigation = C.clamp(armor / (armor + 400 + 85 * Math.max(1, level)), 0, 0.75);
    return dmg * (1 - mitigation);
  }
  function rollCrit(chance) { return C.chance(chance); }

  // --- buffs -----------------------------------------------------------------
  function addBuff(actor, buff) {
    actor.buffs = actor.buffs || [];
    const existing = actor.buffs.find(b => b.key === buff.key);
    if (existing) Object.assign(existing, buff, { elapsed: 0 });
    else actor.buffs.push(Object.assign({ elapsed: 0, tickTimer: 0 }, buff));
  }
  function buffTotals(actor) {
    const t = { apFlat: 0, armorPct: 0, dmgPct: 0, dmgTakenPct: 0, speedPct: 0, dodgeFlat: 0, shield: 0, immune: false, energyRegenPct: 0, rooted: false, snaredPct: 0 };
    (actor.buffs || []).forEach(b => {
      const f = b.fields || {};
      t.apFlat += f.apFlat || 0; t.armorPct += f.armorPct || 0; t.dmgPct += f.dmgPct || 0;
      t.dmgTakenPct += f.dmgTakenPct || 0; t.speedPct += f.speedPct || 0; t.dodgeFlat += f.dodgeFlat || 0;
      t.shield += b.shieldRemaining || 0; if (f.immune) t.immune = true;
      t.energyRegenPct += f.energyRegenPct || 0; if (b.kind === 'root') t.rooted = true;
      if (b.kind === 'snare') t.snaredPct = Math.max(t.snaredPct, f.snarePct || 0);
    });
    return t;
  }

  function tickBuffs(actor, dt, log) {
    if (!actor.buffs || !actor.buffs.length) return;
    actor.buffs = actor.buffs.filter(b => {
      b.elapsed += dt;
      if (b.dot) {
        b.tickTimer += dt;
        while (b.tickTimer >= b.dot.interval && b.ticksLeft > 0) {
          b.tickTimer -= b.dot.interval; b.ticksLeft--;
          if (b.healPerTick) applyHeal(actor, b.healPerTick);
          else if (b.perTick) applyDamage(actor, b.perTick, {});
        }
      }
      return b.elapsed < b.dur && actor.alive !== false;
    });
  }

  // --- resources & cooldowns -----------------------------------------------
  function tickCooldowns(actor, dt) {
    const cds = actor.cooldowns || (actor.cooldowns = {});
    Object.keys(cds).forEach(k => { cds[k] = Math.max(0, cds[k] - dt); if (cds[k] === 0) delete cds[k]; });
  }
  function tickResource(actor, dt, inCombat) {
    const cs = getCombatStats(actor);
    if (!actor.resource) return;
    actor.resource.max = cs.maxResource;
    const kind = actor.kind === 'mob' ? null : K.CLASSES[actor.cls].resource;
    if (kind === 'mana') {
      const regen = (2 + cs.spirit * 0.18) * dt * (inCombat ? 0.4 : 1);
      actor.resource.current = Math.min(cs.maxResource, actor.resource.current + regen);
    } else if (kind === 'energy') {
      const mult = 1 + buffTotals(actor).energyRegenPct;
      actor.resource.current = Math.min(100, actor.resource.current + 12 * mult * dt);
    } else if (kind === 'rage') {
      if (!inCombat) {
        const decayMod = 1 + ((cs.mods && cs.mods.rageDecayPct) || 0);
        actor.resource.current = Math.max(0, actor.resource.current - 6 * decayMod * dt);
      }
    }
  }

  // --- damage / healing --------------------------------------------------
  function applyDamage(target, amount, opts) {
    opts = opts || {};
    let dealt = Math.max(0, Math.round(amount));
    const bt = buffTotals(target);
    if (bt.immune) return 0;
    if (bt.shield > 0) {
      const absorbed = Math.min(bt.shield, dealt);
      dealt -= absorbed;
      const shieldBuff = (target.buffs || []).find(b => b.shieldRemaining > 0);
      if (shieldBuff) shieldBuff.shieldRemaining = Math.max(0, shieldBuff.shieldRemaining - absorbed);
    }

    if (target.hp.current <= 0) target.alive = false;

  }
  function applyHeal(target, amount) {
    const healed = Math.min(target.hp.max - target.hp.current, Math.max(0, Math.round(amount)));
    target.hp.current += healed;
    return healed;
  }

  function costFor(ability, cs) {
    const pct = (cs.mods && (cs.mods[ability.id + '.costPct'] || cs.mods.costPct)) || 0;
    return Math.max(0, Math.round((ability.cost || 0) * (1 + pct)));
  }
  function cdFor(ability, cs) {
    const pct = (cs.mods && cs.mods[ability.id + '.cdPct']) || 0;
    return Math.max(0.5, (ability.cd || 0) * (1 + pct) * (1 - cs.hastePct * 0.5));
  }

  function canUse(caster, target, ability) {
    if (caster.casting) return { ok: false, reason: 'busy' };
    if ((caster.cooldowns && caster.cooldowns['_gcd']) > 0) return { ok: false, reason: 'gcd' };
    if (caster.cooldowns && caster.cooldowns[ability.id] > 0) return { ok: false, reason: 'cooldown' };
    const cs = getCombatStats(caster);
    if (ability.finisher && !(caster.comboPoints > 0)) return { ok: false, reason: 'no combo points' };
    const cost = costFor(ability, cs);
    if (caster.resource && cost > caster.resource.current) return { ok: false, reason: 'resource' };
    if (!ability.self && ability.kind !== 'buff' && ability.kind !== 'gap' && ability.range) {
      if (!target || !target.alive) return { ok: false, reason: 'no target' };
      if (C.dist(caster.x, caster.y, target.x, target.y) > ability.range + 0.4) return { ok: false, reason: 'range' };
    }
    if (ability.execute) {
      if (!target) return { ok: false, reason: 'no target' };
      const thresh = ability.execute + ((cs.mods && cs.mods['w_execute.executeThreshold']) || 0);
      if (target.hp.current / target.hp.max > thresh) return { ok: false, reason: 'target too healthy' };
    }
    return { ok: true };
  }

  function startCast(caster, target, ability, log) {
    const chk = canUse(caster, target, ability);
    if (!chk.ok) return chk;
    const cs = getCombatStats(caster);
    const cost = costFor(ability, cs);
    if (caster.resource) caster.resource.current -= cost;
    caster.cooldowns[ability.id] = cdFor(ability, cs);
    caster.cooldowns['_gcd'] = GCD;
    const castTime = (ability.castTime || 0) * (1 - cs.hastePct * 0.5);
    if (castTime > 0.05) {
      caster.casting = { ability, target, remaining: castTime, total: castTime };
    } else {
      resolveAbility(caster, target, ability, log);
    }
    return { ok: true };
  }

  function tickCasting(caster, dt, log) {
    if (!caster.casting) return;
    caster.casting.remaining -= dt;
    if (caster.casting.remaining <= 0) {
      const { target, ability } = caster.casting;
      caster.casting = null;
      if (target ? target.alive : true) resolveAbility(caster, target, ability, log);
    }
  }
  function interruptCast(caster) { if (caster.casting) { caster.casting = null; return true; } return false; }

  function resolveAbility(caster, target, ability, log) {
    const cs = getCombatStats(caster);
    const push = m => log && log.push(m);
    if (ability.kind === 'gap') {
      const dist = target ? Math.min(ability.range, C.dist(caster.x, caster.y, target.x, target.y) - 1.2) : ability.range;
      const nx = caster.x + Math.cos(caster.angle) * (ability.blink ? ability.range : Math.max(0, dist));
      const ny = caster.y + Math.sin(caster.angle) * (ability.blink ? ability.range : Math.max(0, dist));
      if (!DS.world.blocked(caster.zone, nx, ny)) { caster.x = nx; caster.y = ny; }
      if (ability.rageGen && caster.resource) caster.resource.current = Math.min(cs.maxResource, caster.resource.current + ability.rageGen);
      push(`${caster.name || 'You'} use ${ability.name}.`);
      return;
    }
    if (ability.kind === 'buff') {
      const dur = (ability.buff.dur || 10) * (1 + ((cs.mods && cs.mods[ability.id + '.durPct']) || 0));
      const fields = {};
      if (ability.buff.apFlat) fields.apFlat = ability.buff.apFlat * (1 + ((cs.mods && cs.mods[ability.id + '.apFlatPct']) || 0));
      if (ability.buff.armorPct) fields.armorPct = ability.buff.armorPct;
      if (ability.buff.dmgPct) fields.dmgPct = ability.buff.dmgPct;
      if (ability.buff.dmgTakenPct) fields.dmgTakenPct = ability.buff.dmgTakenPct;
      if (ability.buff.speedPct) fields.speedPct = ability.buff.speedPct;
      if (ability.buff.dodgeFlat) fields.dodgeFlat = ability.buff.dodgeFlat;
      if (ability.buff.immune) fields.immune = true;
      if (ability.buff.energyRegenPct) fields.energyRegenPct = ability.buff.energyRegenPct;
      const buff = { key: ability.id, name: ability.name, icon: ability.icon, dur, fields };
      if (ability.buff.shield) {
        const amt = Math.round(ability.buff.shield * (ability.buff.scalesWith === 'sp' ? cs.spellPower : 40));
        buff.shieldRemaining = amt;
      }
      addBuff(target && !ability.self ? target : caster, buff);
      push(`${caster.name || 'You'} cast ${ability.name}.`);
      return;
    }
    if (ability.kind === 'utility') {
      if (ability.dropAggro) caster.aggroDropped = 2.0;
      push(`${caster.name || 'You'} use ${ability.name}.`);
      return;
    }
    if (!target || !target.alive) return;
    if (ability.kind === 'heal') {
      let amt = ability.power * cs.spellPower + caster.level * 1.5;
      amt *= 1 + ((cs.mods && cs.mods.healPowerPct) || 0) + ((cs.mods && cs.mods.spellDmgPct) || 0);
      const crit = rollCrit(cs.critChance);

      if (ability.dot && ability.dot.heal) {
        addBuff(target, { key: ability.id, name: ability.name, icon: ability.icon, dur: ability.dot.ticks * ability.dot.interval, dot: ability.dot, ticksLeft: ability.dot.ticks, healPerTick: Math.round(ability.power * cs.spellPower * 0.4) });
      }

    let base = ability.power * scaleStat + caster.level * 1.3;

    base *= 1 + ((cs.mods && cs.mods.spellDmgPct) || 0) + ((cs.mods && cs.mods.meleeDmgPct) || 0) + bt.dmgPct;
    const crit = rollCrit(cs.critChance);

    if (ability.scalesWith !== 'sp') {
      const tcs = getCombatStats(target);
      dealt = mitigatePhysical(dealt, tcs.armor || 0, caster.level);

    if (ability.generatesCombo && caster.comboPoints != null) caster.comboPoints = Math.min(5, caster.comboPoints + ability.generatesCombo);
    if (ability.finisher && caster.comboPoints != null) {
      const keep = (cs.mods && cs.mods.ruthlessnessChance) || 0;
      caster.comboPoints = C.chance(keep) ? 1 : 0;
    }
    if (ability.dot) {
      const perTick = Math.round((ability.power * scaleStat * 0.35 + caster.level) * (1 + tbt.dmgTakenPct));
      addBuff(target, { key: ability.id + '_dot', name: ability.name, icon: ability.icon, dur: ability.dot.ticks * ability.dot.interval, dot: ability.dot, ticksLeft: ability.dot.ticks, perTick, physical: ability.scalesWith !== 'sp', sourceId: caster.id });

    if (ability.rootDur) addBuff(target, { key: 'root', name: 'Rooted', icon: '🌿', dur: ability.rootDur, kind: 'root' });
    if (ability.interrupt) interruptCast(target);
    if (ability.dropAggro) caster.aggroDropped = 2.0;
    push(`${caster.name || 'You'} hit ${target.name || 'target'} with ${ability.name} for ${finalDmg}${crit ? ' (crit)' : ''}.`);
  }

  function autoAttack(caster, target, log) {
    const cs = getCombatStats(caster);
    const dmg = mitigatePhysical((cs.attackPower || 6) * 0.55 + caster.level, getCombatStats(target).armor || 0, caster.level);
    const crit = rollCrit(cs.critChance);
    const dealt = applyDamage(target, crit ? dmg * 1.5 : dmg, {});
    log && log.push(`${caster.name || 'You'} swing at ${target.name || 'target'} for ${dealt}${crit ? ' (crit)' : ''}.`);
    if (caster.kind !== 'mob' && caster.resource && K.CLASSES[caster.cls].resource === 'rage') {
      caster.resource.current = Math.min(cs.maxResource, caster.resource.current + 4 + dealt * 0.05);
    }

  }

  DS.combat = {
    GCD, getCombatStats, mitigatePhysical, rollCrit, addBuff, buffTotals, tickBuffs,
    tickCooldowns, tickResource, applyDamage, applyHeal, canUse, startCast, tickCasting,
    interruptCast, resolveAbility, autoAttack
  };
})(window.DS = window.DS || {});
