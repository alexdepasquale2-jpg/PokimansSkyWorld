<script>
/* DoomSpire — mob and companion brains, and loot rolls.
 *
 * A mob is a small state machine: idle until something wanders into its
 * aggro radius, then chase, melee, occasionally use its one special move,
 * and leash home if the target runs far enough. A companion is the same
 * movement loop pointed at the player instead of a spawn point, choosing
 * abilities with a two- or three-line heuristic instead of a script.
 */
(function (DS) {
  'use strict';
  const C = DS.core;
  const K = DS.content;
  let nextId = 1;

  function cloneCurated(key, rng) {
    const base = K.CURATED_ITEMS[key];
    const r = (rng ? rng() : Math.random());
    return Object.assign({}, base, { iid: base.iid + '_' + Math.floor(r * 1e9).toString(36), tplId: key });
  }

  function spawnMob(tplId, x, y, opts) {
    opts = opts || {};
    const tpl = K.BESTIARY[tplId];
    const level = opts.level || C.rndInt(tpl.level[0], tpl.level[1]);
    const maxHealth = Math.round(tpl.hp);
    const mob = {
      id: 'm' + (nextId++), kind: 'mob', tplId, name: tpl.name, icon: tpl.icon,
      x, y, angle: Math.random() * Math.PI * 2, level, faction: tpl.faction,
      elite: !!tpl.elite, boss: !!tpl.boss, speed: tpl.speed,
      aggroRadius: tpl.aggroRadius, leashX: x, leashY: y, leashRadius: (opts.radius || 6) + 10,
      hp: { current: maxHealth, max: maxHealth },
      combat: {
        attackPower: Math.max(6, Math.round(tpl.dmg * 1.8)), spellPower: 0, armor: tpl.armor,
        maxHealth, maxResource: 0, resKind: null,
        critChance: tpl.boss ? 0.15 : tpl.elite ? 0.1 : 0.05, hastePct: 0, mods: {}
      },
      target: null, atkTimer: C.rnd(0.5, 1.4), abilityTimer: tpl.ability ? C.rnd(2, tpl.ability.every) : Infinity,
      enraged: false, buffs: [], cooldowns: {}, alive: true
    };
    return mob;
  }

  function nearestHostileTarget(mob, candidates) {
    let best = null, bestD = mob.aggroRadius;
    candidates.forEach(c => {
      if (!c || !c.alive) return;
      const d = C.dist(mob.x, mob.y, c.x, c.y);
      if (d < bestD) { bestD = d; best = c; }
    });
    return best;
  }

  function tickMob(mob, candidates, zone, dt, log) {
    if (!mob.alive) return;
    DS.combat.tickCooldowns(mob, dt);
    DS.combat.tickBuffs(mob, dt);

    if (mob.enrageAbilityTpl == null) mob.enrageAbilityTpl = K.BESTIARY[mob.tplId].enrageAbility || null;
    const tpl = K.BESTIARY[mob.tplId];
    if (tpl.enrageAt && !mob.enraged && mob.hp.current / mob.hp.max <= tpl.enrageAt) {
      mob.enraged = true;
      log && log.push(`${mob.name} flies into a rage!`);
    }

    if (mob.target && (!mob.target.alive || C.dist(mob.x, mob.y, mob.target.x, mob.target.y) > mob.aggroRadius * 2.2)) mob.target = null;
    if (!mob.target) mob.target = nearestHostileTarget(mob, candidates);
    if (C.dist(mob.x, mob.y, mob.leashX, mob.leashY) > mob.leashRadius) {
      mob.target = null;
      const dx = mob.leashX - mob.x, dy = mob.leashY - mob.y, d = Math.hypot(dx, dy) || 1;
      const step = mob.speed * dt * 1.6;
      const nx = mob.x + (dx / d) * step, ny = mob.y + (dy / d) * step;
      if (!DS.world.blocked(zone, nx, ny)) { mob.x = nx; mob.y = ny; }
      mob.hp.current = Math.min(mob.hp.max, mob.hp.current + mob.hp.max * 0.15 * dt);
      return;
    }
    if (!mob.target) return;

    const d = C.dist(mob.x, mob.y, mob.target.x, mob.target.y);
    mob.angle = Math.atan2(mob.target.y - mob.y, mob.target.x - mob.x);
    const meleeRange = 1.5;
    if (d > meleeRange) {
      const step = mob.speed * dt;
      const nx = mob.x + Math.cos(mob.angle) * step, ny = mob.y + Math.sin(mob.angle) * step;
      if (!DS.world.blocked(zone, nx, ny)) { mob.x = nx; mob.y = ny; }
      else if (!DS.world.blocked(zone, nx, mob.y)) mob.x = nx;
      else if (!DS.world.blocked(zone, mob.x, ny)) mob.y = ny;
    } else {
      mob.atkTimer -= dt;
      if (mob.atkTimer <= 0) {
        mob.atkTimer = 1.3 + Math.random() * 0.6;
        DS.combat.autoAttack(mob, mob.target, log);
      }
    }
    const ability = mob.enraged && mob.enrageAbilityTpl ? mob.enrageAbilityTpl : tpl.ability;
    if (ability) {
      mob.abilityTimer -= dt;
      if (mob.abilityTimer <= 0 && d <= ability.radius + 3) {
        mob.abilityTimer = ability.every;
        [mob.target].concat(candidates.filter(c => c !== mob.target && c && c.alive && C.dist(mob.x, mob.y, c.x, c.y) <= ability.radius))
          .forEach(t => { if (t && t.alive) DS.combat.applyDamage(t, ability.dmg, {}); });
        log && log.push(`${mob.name} uses ${ability.name}!`);
      }
    }
  }

  // --- companions -----------------------------------------------------------
  const COMPANION_DEFS = {
    bruggo: { id: 'bruggo', name: 'Bruggo Ironhide', icon: '🛡️', cls: 'warrior', role: 'tank' },
    vell: { id: 'vell', name: 'Sister Vell', icon: '✝️', cls: 'priest', role: 'heal' }
  };

  function makeCompanionActor(id, player) {
    const def = COMPANION_DEFS[id];
    const actor = {
      kind: 'companion', id: 'c_' + id, defId: id, name: def.name, icon: def.icon, cls: def.cls,
      level: player.level, x: player.x, y: player.y, angle: player.angle, zone: player.zone,
      equip: {}, talents: {}, hp: { current: 1, max: 1 }, resource: { current: null },
      comboPoints: 0, buffs: [], cooldowns: {}, alive: true
    };
    DS.player.refreshVitals(actor);
    actor.hp.current = actor.hp.max;
    actor.resource.current = actor.resource.max;
    return actor;
  }

  function tickCompanion(comp, player, mobs, dt, zone, log) {
    if (!comp.alive) {
      comp.reviveTimer = (comp.reviveTimer || 0) - dt;
      if (comp.reviveTimer <= 0) { comp.alive = true; comp.hp.current = Math.round(comp.hp.max * 0.5); comp.reviveTimer = null; }
      return;
    }
    DS.combat.tickCooldowns(comp, dt);
    DS.combat.tickBuffs(comp, dt);
    DS.combat.tickResource(comp, dt, !!comp.inCombat);
    DS.combat.tickCasting(comp, dt, log);

    const followD = C.dist(comp.x, comp.y, player.x, player.y);
    const abilities = DS.player.abilityList(comp);
    const def = COMPANION_DEFS[comp.defId];
    const liveMobs = mobs.filter(m => m.alive);
    const nearest = liveMobs.reduce((best, m) => {
      const d = C.dist(comp.x, comp.y, m.x, m.y);
      return (d < 14 && (!best || d < best.d)) ? { m, d } : best;
    }, null);
    comp.inCombat = !!nearest;

    if (def.role === 'heal') {
      const woundedAlly = [player, comp].filter(a => a.alive && a.hp.current / a.hp.max < 0.75)
        .sort((a, b) => (a.hp.current / a.hp.max) - (b.hp.current / b.hp.max))[0];
      if (woundedAlly && !comp.casting) {
        const heal = abilities.find(a => a.kind === 'heal' && a.id !== 'pr_renew') || abilities.find(a => a.kind === 'heal');
        if (heal) { comp.angle = Math.atan2(woundedAlly.y - comp.y, woundedAlly.x - comp.x); DS.combat.startCast(comp, woundedAlly, heal, log); }
      } else if (nearest && nearest.d <= 20 && !comp.casting) {
        const dmg = abilities.find(a => a.kind === 'ranged');
        if (dmg) { comp.angle = Math.atan2(nearest.m.y - comp.y, nearest.m.x - comp.x); DS.combat.startCast(comp, nearest.m, dmg, log); }
      }
      moveToward(comp, player, followD > 3.5 ? player : (nearest && nearest.d > 8 ? null : player), zone, dt, 3.5);
      return;
    }

    // tank/melee companion: stick close to whatever the player is fighting
    if (nearest && nearest.d <= 1.6) {
      comp.angle = Math.atan2(nearest.m.y - comp.y, nearest.m.x - comp.x);
      comp.atkTimer = (comp.atkTimer || 0) - dt;
      if (comp.atkTimer <= 0) { comp.atkTimer = 1.4; DS.combat.autoAttack(comp, nearest.m, log); }
      const shout = abilities.find(a => a.id === 'w_shout');
      if (shout && DS.combat.canUse(comp, comp, shout).ok && Math.random() < 0.02) DS.combat.startCast(comp, comp, shout, log);
    } else if (nearest) {
      moveTowardPoint(comp, nearest.m.x, nearest.m.y, zone, dt, 2.6);
    } else {
      moveTowardPoint(comp, player.x, player.y, zone, dt, followD > 2 ? 3.0 : 0);
    }
  }
  function moveTowardPoint(actor, tx, ty, zone, dt, speed) {
    if (!speed) return;
    const dx = tx - actor.x, dy = ty - actor.y, d = Math.hypot(dx, dy) || 1;
    if (d < 0.3) return;
    actor.angle = Math.atan2(dy, dx);
    const step = speed * dt;
    const nx = actor.x + (dx / d) * step, ny = actor.y + (dy / d) * step;
    if (!DS.world.blocked(zone, nx, ny)) { actor.x = nx; actor.y = ny; }
  }
  function moveToward(comp, player, target, zone, dt, speed) {
    if (!target) return;
    moveTowardPoint(comp, target.x, target.y, zone, dt, C.dist(comp.x, comp.y, player.x, player.y) > 1.5 ? speed : 0);
  }

  // --- loot -----------------------------------------------------------------
  function rollLoot(mob, rng) {
    rng = rng || Math.random;
    const tpl = K.BESTIARY[mob.tplId];
    const table = K.LOOT_TABLES[tpl.loot];
    const result = { gold: C.rndInt(table.gold[0], table.gold[1]), item: null, questItem: null };
    if (tpl.dropItem && rng() < tpl.dropItem.chance) result.questItem = cloneCurated(tpl.dropItem.id, rng);
    let guaranteedHit = null;
    (table.guaranteed || []).forEach(g => { if (!guaranteedHit && rng() < g.chance) guaranteedHit = g.id; });
    if (guaranteedHit) { result.item = cloneCurated(guaranteedHit, rng); return result; }
    if (rng() < table.itemChance) {
      const slot = C.pick(K.SLOTS);
      const ilvl = Math.max(1, mob.level + table.ilvlBonus);
      const quality = K.rollQuality(rng, table.qualityFloor);
      result.item = K.rollItem(rng, ilvl, slot, quality);
    }
    return result;
  }

  DS.ai = { spawnMob, tickMob, makeCompanionActor, tickCompanion, rollLoot, cloneCurated, COMPANION_DEFS };
})(window.DS = window.DS || {});

</script>
<script>
/* DoomSpire — the living zone: collision, mob/node spawns and their
 * respawn timers, and every kind of interaction (vendor, quest giver,
 * trainer, gathering node, portal, zone exit).
 *
 * Zone content in content.js is the blueprint; a "zone runtime" built here
 * is the actual instance of it for this session — who's alive, what's been
 * picked clean, what's on cooldown to come back. It is not saved: like
 * PrimalIsle's island, it is cheap to rebuild and only the character
 * persists.
 */
(function (DS) {
  'use strict';
  const C = DS.core;
  const K = DS.content;

  function blocked(zoneId, x, y) {
    const zone = K.ZONES[zoneId];
    const g = zone.grid, r = 0.22;
    const pts = [[x - r, y - r], [x + r, y - r], [x - r, y + r], [x + r, y + r]];
    for (const [px, py] of pts) {
      const cx = Math.floor(px), cy = Math.floor(py);
      if (cx < 0 || cy < 0 || cx >= g.w || cy >= g.h || g.cells[cy][cx] !== 0) return true;
    }
    return false;
  }

  function scatterPoint(zone, cx, cy, radius, rng) {
    rng = rng || Math.random;
    for (let i = 0; i < 24; i++) {
      const a = rng() * Math.PI * 2, r = rng() * radius;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      if (!blocked(zone.id, x, y)) return { x, y };
    }
    return { x: cx, y: cy };
  }

  function buildZoneRuntime(zoneId) {
    const zone = K.ZONES[zoneId];
    const mobs = [];
    zone.mobs.forEach(def => {
      for (let i = 0; i < def.n; i++) {
        const p = scatterPoint(zone, def.x, def.y, def.radius);
        const m = DS.ai.spawnMob(def.tpl, p.x, p.y, { radius: def.radius });
        m.spawnDef = def;
        m.respawnDelay = def.elite ? (m.boss ? 999999 : 90) : 38;
        mobs.push(m);
      }
    });
    const nodes = zone.nodes.map(n => Object.assign({}, n, { harvested: false, respawnAt: 0 }));
    const npcs = zone.npcs.map(n => Object.assign({}, n));
    return { zoneId, mobs, nodes, npcs, floatText: [] };
  }

  function tickRespawns(rt, dt) {
    const zone = K.ZONES[rt.zoneId];
    for (let i = 0; i < rt.mobs.length; i++) {
      const m = rt.mobs[i];
      if (m.alive) continue;
      m.respawning = (m.respawning == null ? m.respawnDelay : m.respawning) - dt;
      if (m.respawning <= 0 && isFinite(m.respawnDelay)) {
        const p = scatterPoint(zone, m.spawnDef.x, m.spawnDef.y, m.spawnDef.radius);
        const fresh = DS.ai.spawnMob(m.tplId, p.x, p.y, { radius: m.spawnDef.radius });
        fresh.spawnDef = m.spawnDef; fresh.respawnDelay = m.respawnDelay;
        rt.mobs[i] = fresh;
      }
    }
    rt.nodes.forEach(n => {
      if (!n.harvested) return;
      n.respawnAt -= dt;
      if (n.respawnAt <= 0) n.harvested = false;
    });
  }

  // --- interaction discovery ------------------------------------------------
  const INTERACT_RANGE = 2.4;
  function nearbyInteractable(player, rt) {
    const zone = K.ZONES[rt.zoneId];
    let best = null, bestD = INTERACT_RANGE;
    rt.npcs.forEach(n => {
      if (n.kind === 'companion' && player.companions[n.companion] && player.companions[n.companion].recruited) return;
      const d = C.dist(player.x, player.y, n.x, n.y);
      if (d < bestD) { bestD = d; best = { kind: 'npc', ref: n }; }
    });
    rt.nodes.forEach(n => {
      if (n.harvested) return;
      const d = C.dist(player.x, player.y, n.x, n.y);
      if (d < bestD) { bestD = d; best = { kind: 'node', ref: n }; }
    });
    (zone.exits || []).forEach(e => {
      const d = C.dist(player.x, player.y, e.x, e.y);
      if (d < e.r) { bestD = 0; best = { kind: 'exit', ref: e }; }
    });
    if (zone.portal) {
      const d = C.dist(player.x, player.y, zone.portal.x, zone.portal.y);
      if (d < INTERACT_RANGE) { best = best && best.kind === 'exit' ? best : { kind: 'portal', ref: zone.portal }; }
    }
    return best;
  }

  function checkAutoTransition(player, rt) {
    const zone = K.ZONES[rt.zoneId];
    for (const e of (zone.exits || [])) {
      if (C.dist(player.x, player.y, e.x, e.y) < e.r) return { toZone: e.toZone, toX: e.toX, toY: e.toY, toFacing: e.toFacing };
    }
    return null;
  }

  // --- gathering -------------------------------------------------------------
  function gatherNode(player, node) {
    const prof = K.GATHER_PROFESSIONS[node.kind];
    if (!player.professions.learned.includes(prof.id)) return { ok: false, msg: `You haven't learned ${prof.name}.` };
    if (node.harvested) return { ok: false, msg: 'Already picked clean.' };
    const mat = prof.mats[node.tier];
    const count = C.rndInt(1, 3);
    for (let i = 0; i < count; i++) DS.player.addItem(player, matItem(mat));
    const gain = DS.player.gatherSkillUp(player, prof.id, node.tier);
    node.harvested = true; node.respawnAt = 75;
    return { ok: true, msg: `Gathered ${count}x ${matName(mat)}${gain ? ` (+${gain} ${prof.name})` : ''}.` };
  }
  const MAT_NAMES = {
    copper_ore: 'Copper Ore', iron_ore: 'Iron Ore', mithril_ore: 'Mithril Ore',
    silverleaf: 'Silverleaf', briarroot: 'Briarroot', frostbloom: 'Frostbloom', dust: 'Arcane Dust'
  };
  function matName(id) { return MAT_NAMES[id] || id; }
  function matItem(id) {
    return { iid: 'mat_' + id + '_' + Math.floor(Math.random() * 1e9).toString(36), name: matName(id), slot: null, quality: 'common', tplId: id, matId: id, stats: {}, sell: 1 };
  }

  // --- crafting ----------------------------------------------------------
  function matCount(player, matId) { return player.bags.filter(b => b.matId === matId).length; }
  function canCraft(player, profId, recipe) {
    const skill = player.professions.skill[profId] || 0;
    if (skill < recipe.skillReq) return false;
    return Object.entries(recipe.mats).every(([m, n]) => matCount(player, m) >= n);
  }
  function craft(player, profId, recipe, rng) {
    if (!canCraft(player, profId, recipe)) return { ok: false, msg: 'Missing materials or skill.' };
    Object.entries(recipe.mats).forEach(([m, n]) => {
      let left = n;
      player.bags = player.bags.filter(b => { if (left > 0 && b.matId === m) { left--; return false; } return true; });
    });
    let result;
    if (recipe.result.potion) {
      result = { iid: 'pot_' + Math.floor(Math.random() * 1e9).toString(36), name: recipe.name, slot: null, quality: 'common', potion: recipe.result.potion, power: recipe.result.power, stats: {}, sell: 3 };
    } else if (recipe.result.enchant) {
      result = { iid: 'ench_' + Math.floor(Math.random() * 1e9).toString(36), name: recipe.name, slot: null, quality: 'uncommon', enchant: recipe.result.enchant, stats: {}, sell: 5 };
    } else {
      result = K.rollItem(rng || Math.random, recipe.result.ilvl, recipe.result.slot, recipe.result.quality, recipe.result.styleHint);
      result.name = recipe.name;
    }
    if (!DS.player.addItem(player, result)) return { ok: false, msg: 'Bags are full.' };
    const cur = player.professions.skill[profId] || 0;
    const cap = recipe.skillReq + 75;
    if (cur < cap) player.professions.skill[profId] = Math.min(300, cur + C.rndInt(1, 3));
    return { ok: true, msg: `Crafted ${recipe.name}.`, item: result };
  }

  // --- vendors -------------------------------------------------------------
  function repTierIndex(player, factionId) {
    const rep = player.rep[factionId] || 0;
    const tier = K.repTier(rep);
    return K.FACTION_TIERS.findIndex(t => t.name === tier.name);
  }
  function vendorStock(npc, player) {
    const v = K.VENDORS[npc.vendor];
    if (!v.__stock) {
      const rng = C.rngFrom(1337 + npc.vendor.length * 97);
      v.__stock = v.fixed.map(id => Object.assign({}, K.CURATED_ITEMS[id]))
        .concat(v.generated.map(g => K.rollItem(rng, g.ilvl, g.slot, g.quality)));
    }
    const gated = (v.repGated || []).filter(g => {
      const need = K.FACTION_TIERS.findIndex(t => t.name === g.tier);
      return repTierIndex(player, v.repFaction) >= need;
    }).map(g => { if (!g.__item) g.__item = K.rollItem(Math.random, g.ilvl, g.slot, g.quality); return g.__item; });
    return v.__stock.concat(gated);
  }
  function buyItem(player, npc, item) {
    const price = Math.max(1, Math.round((item.sell || 1) * 3.2));
    if (player.gold < price) return { ok: false, msg: 'Not enough gold.' };
    if (!DS.player.addItem(player, Object.assign({}, item, { iid: item.iid + '_' + Math.floor(Math.random() * 1e6) }))) return { ok: false, msg: 'Bags are full.' };
    player.gold -= price;
    return { ok: true, msg: `Bought ${item.name}.` };
  }
  function sellItem(player, iid) {
    const item = player.bags.find(b => b.iid === iid);
    if (!item) return { ok: false };
    DS.player.removeItem(player, iid);
    const price = Math.max(1, item.sell || 1);
    player.gold += price;
    return { ok: true, msg: `Sold ${item.name} for ${price}g.` };
  }

  // --- quests at an npc -----------------------------------------------------
  function questsOffered(player, npcId) {
    return Object.values(K.QUESTS).filter(q => q.giver === npcId && DS.player.questAvailable(player, q.id));
  }
  function questsToTurnIn(player, npcId) {
    return Object.values(K.QUESTS).filter(q => q.turnin === npcId && player.quests.active[q.id] && DS.player.questReadyToTurnIn(player, q.id));
  }
  function questsInProgress(player, npcId) {
    return Object.values(K.QUESTS).filter(q => q.turnin === npcId && player.quests.active[q.id] && !DS.player.questReadyToTurnIn(player, q.id));
  }

  function enterPortal(player) {
    const zone = K.ZONES[player.zone];
    if (!zone.portal) return { ok: false, msg: 'Nothing here.' };
    if (zone.portal.requiresFlag && !player.flags[zone.portal.requiresFlag]) return { ok: false, msg: 'The vault is sealed. Something out here must be holding the key.' };
    return { ok: true, toZone: zone.portal.toZone, toX: zone.portal.toX, toY: zone.portal.toY, toFacing: zone.portal.toFacing };
  }

  function respecCost(player) { return player.level * 5; }
  function respec(player) {
    const cost = respecCost(player);
    if (player.gold < cost) return { ok: false, msg: 'Not enough gold.' };
    player.gold -= cost;
    DS.player.resetTalents(player);
    return { ok: true, msg: 'Talents reset.' };
  }

  DS.world = {
    blocked, buildZoneRuntime, tickRespawns, nearbyInteractable, checkAutoTransition,
    gatherNode, matName, canCraft, craft, matCount,
    vendorStock, buyItem, sellItem, repTierIndex, enterPortal,
    questsOffered, questsToTurnIn, questsInProgress, respec, respecCost
  };
})(window.DS = window.DS || {});

</script>
<script>
/* DoomSpire — the game object, new-character flow, and save/load.
 *
 * Only the character is persisted — level, gear, bags, quest log, rep,
 * professions, talents, companions recruited. Zones are rebuilt fresh each
 * session the way PrimalIsle rebuilds the island from a seed: mobs respawn
 * where their spawn table says they should, nodes are full again, and nothing
 * about that needs to survive a reload.
 */
(function (DS) {
  'use strict';
  const K = DS.content;

  function newGame(name, clsId) {
    const player = DS.player.newCharacter(name, clsId);
    DS.player.refreshVitals(player);
    player.hp.current = player.hp.max;
    player.resource.current = player.resource.max;
    return {
      player, zoneRuntimes: {}, companionsActive: {},
      combatLog: [], target: null, clock: 0, paused: false
    };
  }

  function ensureZoneRuntime(game, zoneId) {
    if (!game.zoneRuntimes[zoneId]) game.zoneRuntimes[zoneId] = DS.world.buildZoneRuntime(zoneId);
    return game.zoneRuntimes[zoneId];
  }

  function syncCompanions(game) {
    Object.entries(game.player.companions).forEach(([defId, c]) => {
      if (c.recruited && !game.companionsActive[defId]) {
        game.companionsActive[defId] = DS.ai.makeCompanionActor(defId, game.player);
      }
    });
    return Object.values(game.companionsActive);
  }

  function currentZone(game) { return K.ZONES[game.player.zone]; }
  function currentRuntime(game) { return ensureZoneRuntime(game, game.player.zone); }

  function warp(game, toZone, toX, toY, toFacing) {
    const p = game.player;
    p.zone = toZone; p.x = toX; p.y = toY; p.angle = toFacing || 0;
    ensureZoneRuntime(game, toZone);
    Object.values(game.companionsActive).forEach(c => { c.x = toX; c.y = toY; c.zone = toZone; });
  }

  function forSave(game) { return { player: game.player }; }

  function fromSaved(saved) {
    const game = newGame(saved.player.name, saved.player.cls);
    game.player = Object.assign(game.player, saved.player);
    // migration safety: fill in any fields older/partial saves might lack
    if (!game.player.professions) game.player.professions = { learned: [], skill: {} };
    if (!game.player.companions) game.player.companions = {};
    if (!game.player.flags) game.player.flags = {};
    K.SLOTS.forEach(s => { if (!(s in game.player.equip)) game.player.equip[s] = null; });
    DS.player.refreshVitals(game.player);
    ensureZoneRuntime(game, game.player.zone);
    syncCompanions(game);
    return game;
  }

  function load() {
    const saved = DS.core.load();
    if (!saved || !saved.player) return null;
    try { return fromSaved(saved); } catch (e) { console.warn('[doomspire] save incompatible', e); return null; }
  }

  DS.state = { newGame, ensureZoneRuntime, syncCompanions, currentZone, currentRuntime, warp, forSave, fromSaved, load };
})(window.DS = window.DS || {});

</script>
<script>
/* DoomSpire — the tick: turning and movement, targeting, combat, respawns,
 * and the automatic zone exit at a map edge. Everything else (panels,
 * rendering) reads what this produces.
 */
(function (DS) {
  'use strict';
  const C = DS.core;
  const K = DS.content;
  const CB = DS.combat;

  const MOVE_SPEED = 3.3;
  const AUTO_ATTACK_RANGE = 1.7;
  const TARGET_RANGE = 22;
  const TARGET_CONE = 0.55;
  const LOG_MAX = 60;

  function log(game, msg) {
    game.combatLog.push(msg);
    if (game.combatLog.length > LOG_MAX) game.combatLog.splice(0, game.combatLog.length - LOG_MAX);
  }

  function pickTarget(player, mobs) {
    const cur = mobs.find(m => m.id === player.__targetId && m.alive);
    if (cur && C.dist(player.x, player.y, cur.x, cur.y) <= TARGET_RANGE * 1.3) return cur;
    let best = null, bestScore = Infinity;
    mobs.forEach(m => {
      if (!m.alive) return;
      const d = C.dist(player.x, player.y, m.x, m.y);
      if (d > TARGET_RANGE) return;
      const ang = Math.atan2(m.y - player.y, m.x - player.x);
      const diff = Math.abs(C.angDelta(player.angle, ang));
      if (diff > TARGET_CONE && d > 2.2) return;
      const score = d + diff * 5;
      if (score < bestScore) { bestScore = score; best = m; }
    });
    return best;
  }

  function moveActor(actor, mx, my, speed, dt, zoneId) {
    const len = Math.hypot(mx, my);
    if (len < 1e-4) return;
    if (len > 1) { mx /= len; my /= len; }
    const fx = Math.cos(actor.angle), fy = Math.sin(actor.angle);
    const rx = -Math.sin(actor.angle), ry = Math.cos(actor.angle);
    const wx = fx * (-my) + rx * mx, wy = fy * (-my) + ry * mx;
    const step = speed * dt;
    const nx = actor.x + wx * step, ny = actor.y + wy * step;
    if (!DS.world.blocked(zoneId, nx, ny)) { actor.x = nx; actor.y = ny; }
    else if (!DS.world.blocked(zoneId, nx, actor.y)) actor.x = nx;
    else if (!DS.world.blocked(zoneId, actor.x, ny)) actor.y = ny;
  }

  function handleMobDeath(game, mob) {
    if (mob.deathProcessed) return;
    mob.deathProcessed = true;
    const player = game.player;
    const tpl = K.BESTIARY[mob.tplId];
    const gained = DS.player.grantXP(player, tpl.xp);
    log(game, `${mob.name} dies. (+${tpl.xp} xp${gained.leveled ? `, level ${player.level}!` : ''})`);
    const loot = DS.ai.rollLoot(mob);
    if (loot.gold) { player.gold += loot.gold; }
    if (loot.item) { if (!DS.player.addItem(player, loot.item)) log(game, `Bags full — ${loot.item.name} was lost.`); else log(game, `Loot: ${loot.item.name}.`); }
    if (loot.questItem) {
      if (!DS.player.addItem(player, loot.questItem)) log(game, `Bags full — ${loot.questItem.name} was lost.`);
      else { log(game, `Picked up ${loot.questItem.name}.`); DS.player.noteCollect(player, loot.questItem.tplId); }
    }
    DS.player.noteKill(player, mob.tplId);
    if (player.__targetId === mob.id) player.__targetId = null;
  }

  function respawnPlayer(game) {
    const player = game.player;
    const zone = K.ZONES[player.zone] || K.ZONES.scar;
    player.zone = zone.id;
    player.x = zone.spawn.x; player.y = zone.spawn.y; player.angle = zone.spawn.facing || 0;
    player.alive = true;
    DS.player.refreshVitals(player);
    player.hp.current = player.hp.max;
    player.gold = Math.max(0, player.gold - Math.round(player.gold * 0.1));
    DS.state.ensureZoneRuntime(game, player.zone);
    log(game, 'You return to the world, a little poorer.');
  }

  function useAbility(game, abilityId) {
    const player = game.player;
    if (!player.alive) return { ok: false, reason: 'dead' };
    const ability = DS.player.abilityList(player).find(a => a.id === abilityId);
    if (!ability) return { ok: false, reason: 'unknown' };
    const target = ability.self || ability.kind === 'buff' || ability.kind === 'heal' || ability.kind === 'utility' ? player : game.target;
    const res = CB.startCast(player, target, ability, game.combatLog);
    if (game.combatLog.length > LOG_MAX) game.combatLog.splice(0, game.combatLog.length - LOG_MAX);
    return res;
  }

  function tick(game, dt, input) {
    const player = game.player;
    const rt = DS.state.currentRuntime(game);
    const companions = DS.state.syncCompanions(game).filter(c => player.companions[c.defId] && player.companions[c.defId].recruited);
    game.clock += dt;

    if (!player.alive) return;

    const axes = input.frameAxes();
    player.angle += axes.turn;

    const bt = CB.buffTotals(player);
    const speedMult = (1 + bt.speedPct) * (1 - bt.snaredPct) * (bt.rooted ? 0 : 1);
    if (!player.casting) moveActor(player, axes.mx, axes.my, MOVE_SPEED * speedMult, dt, player.zone);

    CB.tickCooldowns(player, dt);
    CB.tickBuffs(player, dt);
    CB.tickCasting(player, dt, game.combatLog);

    const liveMobs = rt.mobs.filter(m => m.alive);
    const target = pickTarget(player, liveMobs);
    player.__targetId = target ? target.id : null;
    game.target = target;

    const inCombat = !!target || liveMobs.some(m => m.target === player || companions.includes(m.target));
    CB.tickResource(player, dt, inCombat);

    player.autoAttackTimer = (player.autoAttackTimer || 0) - dt;
    if (target && !player.casting && C.dist(player.x, player.y, target.x, target.y) <= AUTO_ATTACK_RANGE) {
      if (player.autoAttackTimer <= 0) { player.autoAttackTimer = 1.9; CB.autoAttack(player, target, game.combatLog); }
    }

    companions.forEach(c => DS.ai.tickCompanion(c, player, liveMobs, dt, player.zone, game.combatLog));
    rt.mobs.forEach(m => {
      if (m.alive) DS.ai.tickMob(m, [player].concat(companions), player.zone, dt, game.combatLog);
      else handleMobDeath(game, m);
    });
    DS.world.tickRespawns(rt, dt);

    if (game.combatLog.length > LOG_MAX) game.combatLog.splice(0, game.combatLog.length - LOG_MAX);

    if (player.hp.current <= 0 && player.alive) { player.alive = false; log(game, 'You have fallen.'); }

    const exit = DS.world.checkAutoTransition(player, rt);
    if (exit) {
      DS.state.warp(game, exit.toZone, exit.toX, exit.toY, exit.toFacing);
      log(game, `You enter ${K.ZONES[exit.toZone].name}.`);
    }
  }

  DS.sim = { tick, useAbility, pickTarget, respawnPlayer, log, MOVE_SPEED, AUTO_ATTACK_RANGE };
})(window.DS = window.DS || {});

</script>
<script>
/* DoomSpire — one frame: the raycast scene, sprites with nameplates and
 * health bars, the crosshair/target reticle, and the minimap. Everything
 * else (bars, buttons, panels) is DOM and lives in ui.js.
 */
(function (DS) {
  'use strict';
  const C = DS.core;
  const K = DS.content;
  const E = DS.engine;

  let scene = null, sceneCtx = null, mini = null, miniCtx = null;
  let W = 320, H = 240;

  function init(sceneCanvas, miniCanvas) {
    scene = sceneCanvas; sceneCtx = scene.getContext('2d');
    mini = miniCanvas; miniCtx = mini.getContext('2d');
    resize();
  }

  function resize() {
    const dpr = Math.min(1.5, window.devicePixelRatio || 1);
    const rect = scene.getBoundingClientRect();
    W = scene.width = Math.max(160, Math.round(rect.width * dpr));
    H = scene.height = Math.max(120, Math.round(rect.height * dpr));
    const mr = mini.getBoundingClientRect();
    mini.width = Math.round(mr.width * dpr);
    mini.height = Math.round(mr.height * dpr);
  }

  const NPC_COLORS = { vendor: '#e8b23a', trainer: '#7fb8e0', proftrainer: '#7fb8e0', quest: '#e0a83f', companion: '#79c07a' };

  function npcMarker(npc, player) {
    if (npc.kind === 'quest' || npc.kind === 'companion') {
      const give = DS.world.questsOffered(player, npc.id).length;
      const turn = DS.world.questsToTurnIn(player, npc.id).length;
      const prog = DS.world.questsInProgress(player, npc.id).length;
      if (turn) return { glyph: '❓', color: '#f0d34a' };
      if (give) return { glyph: '❗', color: '#f0a52e' };
      if (prog) return { glyph: '…', color: '#8d9ab2' };
    }
    return null;
  }

  function drawBarAbove(ctx, screenX, top, size, ratio, color) {
    const w = Math.max(14, size * 0.7), h = Math.max(2, size * 0.06);
    const x = screenX - w / 2, y = top - h - 3;
    ctx.fillStyle = 'rgba(6,10,18,0.75)'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color; ctx.fillRect(x, y, w * C.clamp(ratio, 0, 1), h);
  }
  function drawGlyphAbove(ctx, screenX, top, size, glyph, color) {
    ctx.font = `${Math.max(10, size * 0.35)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = color;
    ctx.fillText(glyph, screenX, top - 3);
  }

  function frame(game, dt) {
    if (!scene) return;
    const player = game.player;
    sceneCtx.clearRect(0, 0, W, H);
    if (!player.alive) {
      sceneCtx.fillStyle = '#1a0608';
      sceneCtx.fillRect(0, 0, W, H);
      sceneCtx.fillStyle = '#c0392b';
      sceneCtx.textAlign = 'center'; sceneCtx.font = `${Math.round(H * 0.07)}px sans-serif`;
      sceneCtx.fillText('YOU HAVE FALLEN', W / 2, H / 2);
      return;
    }
    const zone = K.ZONES[player.zone];
    const rt = DS.state.currentRuntime(game);
    const zbuffer = E.castWalls(sceneCtx, W, H, zone, player);

    const companions = Object.values(game.companionsActive).filter(c => player.companions[c.defId] && player.companions[c.defId].recruited && c.zone === player.zone);
    const sprites = [];
    rt.mobs.filter(m => m.alive).forEach(m => sprites.push({ x: m.x, y: m.y, icon: m.icon, ring: m.boss ? '#7a1030' : m.elite ? '#a9432c' : '#c0392b', kind: 'mob', ref: m, height: m.boss ? 1.5 : m.elite ? 1.15 : 0.9 }));
    companions.forEach(c => sprites.push({ x: c.x, y: c.y, icon: c.icon, ring: '#2f6f4a', kind: 'companion', ref: c, height: 0.95 }));
    rt.npcs.forEach(n => { if (n.kind === 'companion' && player.companions[n.companion] && player.companions[n.companion].recruited) return; sprites.push({ x: n.x, y: n.y, icon: n.icon, ring: NPC_COLORS[n.kind] || '#8d9ab2', kind: 'npc', ref: n, height: 1.0 }); });
    rt.nodes.forEach(n => { if (n.harvested) return; sprites.push({ x: n.x, y: n.y, icon: n.kind === 'mining' ? '⛏️' : '🌿', ring: '#5f8a4a', kind: 'node', ref: n, height: 0.55, footOffset: 0.15 }); });
    if (zone.portal) sprites.push({ x: zone.portal.x, y: zone.portal.y, icon: '🌀', ring: '#6a3a9a', kind: 'portal', ref: zone.portal, height: 1.2 });

    const withDepth = sprites.map(s => Object.assign(s, { proj: E.project(player, W, H, s.x, s.y) })).filter(s => s.proj.visible);
    withDepth.sort((a, b) => b.proj.depth - a.proj.depth);
    withDepth.forEach(s => {
      const drawn = E.drawSprite(sceneCtx, W, H, zbuffer, s.proj, { icon: s.icon, ring: s.ring, height: s.height, footOffset: s.footOffset });
      if (!drawn) return;
      if (s.kind === 'mob') {
        const m = s.ref;
        if (m.hp.current < m.hp.max) drawBarAbove(sceneCtx, drawn.screenX, drawn.top, drawn.size, m.hp.current / m.hp.max, m.boss ? '#c0392b' : '#d8564a');
        if (game.target === m) {
          sceneCtx.strokeStyle = '#f0d34a'; sceneCtx.lineWidth = Math.max(1, drawn.size * 0.03);
          sceneCtx.beginPath(); sceneCtx.ellipse(drawn.screenX, drawn.cy - drawn.size * 0.5, drawn.size * 0.46, drawn.size * 0.54, 0, 0, Math.PI * 2); sceneCtx.stroke();
        }
      } else if (s.kind === 'npc') {
        const marker = npcMarker(s.ref, player);
        if (marker) drawGlyphAbove(sceneCtx, drawn.screenX, drawn.top, drawn.size, marker.glyph, marker.color);
      }
    });

    // crosshair
    sceneCtx.strokeStyle = game.target ? '#f0d34a' : 'rgba(230,236,247,0.55)';
    sceneCtx.lineWidth = 1.5;
    const cx = W / 2, cy = H / 2, r = 6;
    sceneCtx.beginPath();
    sceneCtx.moveTo(cx - r, cy); sceneCtx.lineTo(cx - 2, cy);
    sceneCtx.moveTo(cx + 2, cy); sceneCtx.lineTo(cx + r, cy);
    sceneCtx.moveTo(cx, cy - r); sceneCtx.lineTo(cx, cy - 2);
    sceneCtx.moveTo(cx, cy + 2); sceneCtx.lineTo(cx, cy + r);
    sceneCtx.stroke();

    const mapEntities = rt.mobs.filter(m => m.alive).map(m => ({ x: m.x, y: m.y, color: m.boss ? '#c0392b' : m.elite ? '#e0655a' : '#a9432c' }))
      .concat(rt.npcs.filter(n => !(n.kind === 'companion' && player.companions[n.companion] && player.companions[n.companion].recruited)).map(n => ({ x: n.x, y: n.y, color: NPC_COLORS[n.kind] || '#8d9ab2' })))
      .concat(companions.map(c => ({ x: c.x, y: c.y, color: '#79c07a' })));
    E.minimap(miniCtx, mini, zone, player, mapEntities);
  }

  DS.render = { init, resize, frame };
})(window.DS = window.DS || {});

</script>
<script>
/* DoomSpire — every DOM surface: the HUD, the ability bar, character
 * creation, and every panel (character, talents, bags, quests, professions,
 * reputation, party, and whatever NPC you're standing in front of).
 *
 * Panels are rebuilt from scratch on open and on action (innerHTML from a
 * template string) since they're opened rarely; the HUD bars and ability
 * cooldowns are touched every frame with direct property writes, the same
 * split PrimalIsle's ui.js makes.
 */
(function (DS) {
  'use strict';
  const C = DS.core;
  const K = DS.content;

  const RES_COLOR = { rage: '#c0392b', mana: '#2f6fb0', energy: '#e0b23a' };
  const RES_NAME = { rage: 'Rage', mana: 'Mana', energy: 'Energy' };

  let els = {};
  let game = null;
  let ui = { panel: null, panelCtx: null };
  let onStartCb = null;

  function q(sel, root) { return (root || document).querySelector(sel); }
  function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
  function qcolor(key) { return (K.QUALITY_BY_KEY[key] || K.QUALITY_BY_KEY.common).color; }

  function boot() {
    els = {
      scene: q('#scene'), minimap: q('#minimap'), stage: q('#stage'), stick: q('#stick'), knob: q('#knob'),
      hpFill: q('#hp-fill'), hpText: q('#hp-text'), resFill: q('#res-fill'), resText: q('#res-text'),
      xpFill: q('#xp-fill'), lvlText: q('#lvl-text'), nameText: q('#name-text'),
      zoneText: q('#zone-text'), goldText: q('#gold-text'),
      log: q('#combat-log'), interactBtn: q('#interact-btn'),
      abilityBar: q('#ability-bar'), menuBtn: q('#menu-btn'), targetBar: q('#target-bar'),
      targetName: q('#target-name'), targetFill: q('#target-fill'),
      panelsHost: q('#panels'), tabs: q('#tabs'),
      charcreate: q('#charcreate'), deathscreen: q('#deathscreen'), comboWrap: q('#combo-points')
    };
    DS.engine.input = DS.engine.makeInput({ stage: els.stage, stick: els.stick, knob: els.knob });
    els.interactBtn.addEventListener('click', onInteract);
    els.menuBtn.addEventListener('click', () => openPanel(ui.panel ? null : 'character'));
    els.panelsHost.addEventListener('click', onPanelClick);
    els.tabs.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) openPanel(b.dataset.tab); });
    q('#deathscreen .respawn-btn').addEventListener('click', () => { DS.sim.respawnPlayer(game); closeDeath(); });
    window.addEventListener('resize', () => DS.render.resize());
    buildCharCreate();
  }

  // --- character creation ---------------------------------------------------
  function buildCharCreate() {
    const list = q('#class-list');
    list.innerHTML = Object.values(K.CLASSES).map(c => `
      <button class="class-card" data-cls="${c.id}">
        <div class="cc-icon">${c.icon}</div>
        <div class="cc-name">${c.name}</div>
        <div class="cc-role">${c.role}</div>
        <div class="cc-blurb">${c.blurb}</div>
      </button>`).join('');
    let chosen = null;
    list.addEventListener('click', e => {
      const b = e.target.closest('.class-card'); if (!b) return;
      list.querySelectorAll('.class-card').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel'); chosen = b.dataset.cls;
      q('#begin-btn').disabled = false;
    });
    q('#begin-btn').addEventListener('click', () => {
      if (!chosen) return;
      const name = (q('#name-input').value || 'Adventurer').trim().slice(0, 18);
      const g = DS.state.newGame(name, chosen);
      els.charcreate.classList.add('hidden');
      onStartCb && onStartCb(g);
    });
  }
  function showCharCreate(onStart) { onStartCb = onStart; els.charcreate.classList.remove('hidden'); }

  function startGame(g) {
    game = g;
    DS.render.init(els.scene, els.minimap);
    buildAbilityBar();
    renderStaticHeader();
  }

  function renderStaticHeader() {
    els.nameText.textContent = `${game.player.name}`;
  }

  // --- ability bar -----------------------------------------------------------
  function buildAbilityBar() {
    const abilities = DS.player.abilityList(game.player);
    els.abilityBar.innerHTML = abilities.map((a, i) => `
      <button class="ability-btn" data-ability="${a.id}" title="${a.name}">
        <span class="ab-icon">${a.icon}</span>
        <span class="ab-cd"></span>
        <span class="ab-key">${i + 1}</span>
      </button>`).join('');
    els.abilityBar.querySelectorAll('.ability-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const res = DS.sim.useAbility(game, btn.dataset.ability);
        if (!res.ok && res.reason !== 'gcd' && res.reason !== 'cooldown') { DS.sim.log(game, `Can't use that (${res.reason}).`); refreshLog(); }
      });
    });
  }

  // --- per-frame HUD ----------------------------------------------------------
  let lastLogLen = -1;
  function frame(dt) {
    if (!game) return;
    const p = game.player;
    if (!p.alive) { showDeath(); return; }
    const d = DS.player.refreshVitals(p);
    els.hpFill.style.width = C.pct(p.hp.current / p.hp.max);
    els.hpText.textContent = `${Math.round(p.hp.current)} / ${p.hp.max}`;
    const resKind = K.CLASSES[p.cls].resource;
    els.resFill.style.width = C.pct(p.resource.current / p.resource.max);
    els.resFill.style.background = RES_COLOR[resKind];
    els.resText.textContent = `${Math.round(p.resource.current)} / ${p.resource.max} ${RES_NAME[resKind]}`;
    const need = DS.player.xpForLevel(p.level);
    els.xpFill.style.width = p.level >= K.LEVEL_CAP ? '100%' : C.pct(p.xp / need);
    els.lvlText.textContent = `Lv ${p.level} ${K.CLASSES[p.cls].icon} ${K.CLASSES[p.cls].name}`;
    els.zoneText.textContent = K.ZONES[p.zone].name;
    els.goldText.textContent = `${p.gold}g`;

    els.comboWrap.innerHTML = K.CLASSES[p.cls].comboPoints
      ? Array.from({ length: 5 }, (_, i) => `<i class="${i < p.comboPoints ? 'on' : ''}"></i>`).join('') : '';

    const abilities = DS.player.abilityList(p);
    els.abilityBar.querySelectorAll('.ability-btn').forEach(btn => {
      const a = abilities.find(x => x.id === btn.dataset.ability);
      const cd = (p.cooldowns[a.id] || 0);
      const cdEl = btn.querySelector('.ab-cd');
      cdEl.style.height = cd > 0 ? C.pct(cd / (a.cd || 1)) : '0%';
      const cost = a.cost || 0;
      btn.classList.toggle('unaffordable', cost > (p.resource.current || 0) && !a.self);
    });

    if (game.target && game.target.alive) {
      els.targetBar.classList.remove('hidden');
      els.targetName.textContent = `${game.target.name} · Lv ${game.target.level}`;
      els.targetFill.style.width = C.pct(game.target.hp.current / game.target.hp.max);
    } else els.targetBar.classList.add('hidden');

    const rt = DS.state.currentRuntime(game);
    const near = DS.world.nearbyInteractable(p, rt);
    if (near) {
      els.interactBtn.classList.remove('hidden');
      els.interactBtn.textContent = interactLabel(near);
    } else els.interactBtn.classList.add('hidden');

    if (game.combatLog.length !== lastLogLen) { refreshLog(); lastLogLen = game.combatLog.length; }
    if (ui.panel) refreshOpenPanel();
  }

  function interactLabel(near) {
    if (near.kind === 'node') return `⛏️ Gather ${near.ref.kind === 'mining' ? 'Ore' : 'Herb'}`;
    if (near.kind === 'portal') return `🌀 Enter the Vault`;
    if (near.kind === 'exit') return `➜ ${K.ZONES[near.ref.toZone].name}`;
    const n = near.ref;
    if (n.vendor) return `💰 Trade with ${n.name}`;
    if (n.kind === 'trainer') return `🏛️ Speak with ${n.name}`;
    if (n.kind === 'proftrainer') return `⚙️ Speak with ${n.name}`;
    return `❗ Speak with ${n.name}`;
  }

  function refreshLog() {
    els.log.innerHTML = game.combatLog.slice(-8).map(m => `<div>${m}</div>`).join('');
    els.log.scrollTop = els.log.scrollHeight;
  }

  function onInteract() {
    const rt = DS.state.currentRuntime(game);
    const near = DS.world.nearbyInteractable(game.player, rt);
    if (!near) return;
    if (near.kind === 'node') { const r = DS.world.gatherNode(game.player, near.ref); DS.sim.log(game, r.msg); refreshLog(); return; }
    if (near.kind === 'portal') {
      const r = DS.world.enterPortal(game.player);
      if (!r.ok) { DS.sim.log(game, r.msg); refreshLog(); return; }
      DS.state.warp(game, r.toZone, r.toX, r.toY, r.toFacing);
      DS.sim.log(game, `You step through into ${K.ZONES[r.toZone].name}.`);
      refreshLog(); return;
    }
    if (near.kind === 'exit') return; // handled automatically by sim
    openPanel('npc', { npc: near.ref });
  }

  // --- panels -----------------------------------------------------------------
  function openPanel(kind, ctx) {
    if (!kind) { closePanel(); return; }
    ui.panel = kind; ui.panelCtx = ctx || null;
    els.tabs.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === kind));
    els.panelsHost.classList.remove('hidden');
    renderPanel();
  }
  function closePanel() {
    ui.panel = null; ui.panelCtx = null;
    els.panelsHost.classList.add('hidden');
    els.tabs.querySelectorAll('[data-tab]').forEach(b => b.classList.remove('active'));
  }
  function paused() { return !!ui.panel; }
  function refreshOpenPanel() { renderPanel(); }

  function renderPanel() {
    const p = game.player;
    let html = '';
    switch (ui.panel) {
      case 'character': html = renderCharacter(p); break;
      case 'talents': html = renderTalents(p); break;
      case 'bags': html = renderBags(p); break;
      case 'quests': html = renderQuests(p); break;
      case 'professions': html = renderProfessions(p); break;
      case 'reputation': html = renderReputation(p); break;
      case 'party': html = renderParty(p); break;
      case 'npc': html = renderNpc(p, ui.panelCtx.npc); break;
      default: html = '';
    }
    els.panelsHost.querySelector('.panel-body').innerHTML = html;
    const title = els.panelsHost.querySelector('.panel-title');
    title.textContent = ui.panel === 'npc' ? ui.panelCtx.npc.name : C.titleCase(ui.panel);
  }

  function slotIcon(slot) {
    return ({ head: '🪖', neck: '📿', shoulder: '🎽', cloak: '🧣', chest: '👕', wrist: '⌚', hands: '🧤', waist: '🎗️', legs: '👖', feet: '🥾', ring1: '💍', ring2: '💍', trinket1: '🔮', trinket2: '🔮', mainhand: '🗡️', offhand: '🛡️' })[slot] || '❔';
  }
  function itemLine(it, extraBtns) {
    const color = qcolor(it.quality);
    const sub = it.slot ? `${K.SLOT_WEIGHT[it.slot] ? C.titleCase(it.slot.replace(/[12]$/, '')) : ''}${it.ilvl ? ` · ilvl ${it.ilvl}` : ''}`
      : it.potion ? 'Potion' : it.enchant ? 'Enchant' : it.matId ? 'Material' : 'Item';
    const stats = Object.entries(it.stats || {}).filter(([, v]) => v).map(([k, v]) => `+${v} ${k}`).join(', ');
    const dmg = it.dmgLo ? `${it.dmgLo}-${it.dmgHi} dmg, ${it.speed.toFixed(1)} spd` : '';
    return `<div class="item-row">
      <div class="item-main">
        <b style="color:${color}">${it.name}</b>
        <span class="item-sub">${sub}</span>
        ${stats || dmg ? `<div class="item-stats">${[dmg, stats].filter(Boolean).join(' · ')}</div>` : ''}
      </div>
      <div class="item-btns">${extraBtns}</div>
    </div>`;
  }

  function renderCharacter(p) {
    const d = DS.player.derived(p);
    const eq = K.SLOTS.map(s => {
      const it = p.equip[s];
      return `<button class="slot-cell" data-act="unequip" data-slot="${s}" ${it ? '' : 'disabled'}>
        <span>${it ? '' : slotIcon(s)}</span>
        <b style="color:${it ? qcolor(it.quality) : '#5f6b82'}">${it ? it.name : C.titleCase(s.replace(/[12]$/, ''))}</b>
      </button>`;
    }).join('');
    return `
      <div class="stat-grid">
        <div>Strength <b>${Math.round(d.str)}</b></div><div>Agility <b>${Math.round(d.agi)}</b></div>
        <div>Intellect <b>${Math.round(d.int)}</b></div><div>Stamina <b>${Math.round(d.sta)}</b></div>
        <div>Spirit <b>${Math.round(d.spirit)}</b></div><div>Armor <b>${d.armor}</b></div>
        <div>Attack Power <b>${d.attackPower}</b></div><div>Spell Power <b>${d.spellPower}</b></div>
        <div>Crit <b>${C.pct(d.critChance)}</b></div><div>Haste <b>${C.pct(d.hastePct)}</b></div>
      </div>
      <h4>Equipped</h4>
      <div class="slot-grid">${eq}</div>`;
  }

  function renderTalents(p) {
    const cls = K.CLASSES[p.cls];
    const tiers = K.talentTiers();
    const spent = DS.player.talentPointsSpent(p);
    const groups = [1, 2, 3, 4, 5].map(tier => {
      const unlocked = spent >= tiers[tier];
      const items = cls.talents.filter(t => t.tier === tier).map(t => {
        const rank = p.talents[t.id] || 0;
        const can = DS.player.canSpendTalent(p, t.id);
        return `<button class="talent-cell ${rank > 0 ? 'ranked' : ''} ${can ? 'can' : ''}" data-act="talent" data-id="${t.id}" ${unlocked ? '' : 'disabled'}>
          <span class="t-icon">${t.icon}</span>
          <b>${t.name}</b>
          <span class="t-rank">${rank}/${t.maxRank}</span>
          <div class="t-desc">${t.desc}</div>
        </button>`;
      }).join('');
      return `<div class="talent-tier ${unlocked ? '' : 'locked'}">
        <div class="tier-label">${unlocked ? `Tier ${tier}` : `Tier ${tier} — needs ${tiers[tier]} points spent`}</div>
        <div class="talent-row">${items}</div>
      </div>`;
    }).join('');
    return `<div class="talent-header">
        <span>${p.talentPoints} point${p.talentPoints === 1 ? '' : 's'} available</span>
        <button class="mini-btn" data-act="respec">Reset (${DS.world.respecCost(p)}g)</button>
      </div>${groups}`;
  }

  function renderBags(p) {
    const items = p.bags.map(it => itemLine(it,
      (it.slot ? `<button class="mini-btn" data-act="equip" data-iid="${it.iid}">Equip</button>` : '') +
      (it.potion ? `<button class="mini-btn" data-act="usepotion" data-iid="${it.iid}">Use</button>` : '') +
      (it.enchant ? `<button class="mini-btn" data-act="useenchant" data-iid="${it.iid}">Apply</button>` : '') +
      (it.questItem ? '' : `<button class="mini-btn" data-act="sell" data-iid="${it.iid}">Sell ${it.sell}g</button>`)
    )).join('') || '<p class="empty">Nothing here.</p>';
    return `<div class="bag-header">${p.bags.length} / ${DS.player.BAG_SIZE} — ${p.gold}g</div>${items}`;
  }

  function renderQuests(p) {
    const active = Object.entries(p.quests.active).map(([qid, a]) => {
      const q = K.QUESTS[qid];
      const goal = q.kind === 'kill' ? `${K.BESTIARY[q.target].name} ${a.progress}/${q.count}` : q.kind === 'collect' ? `${q.item.replace(/_/g, ' ')} ${a.progress}/${q.count}` : 'Return and report';
      return `<div class="quest-row"><b>${q.name}</b><div class="quest-sub">${K.ZONES[q.zone].name} · ${goal}</div><div class="quest-text">${q.text}</div></div>`;
    }).join('') || '<p class="empty">No active quests.</p>';
    return `<h4>Active</h4>${active}<h4>Completed (${p.quests.completed.length})</h4>`;
  }

  function renderProfessions(p) {
    const learnedGather = p.professions.learned.filter(id => K.GATHER_PROFESSIONS[id]);
    const learnedCraft = p.professions.learned.filter(id => K.CRAFT_PROFESSIONS[id]);
    const allIds = Object.keys(K.GATHER_PROFESSIONS).concat(Object.keys(K.CRAFT_PROFESSIONS));
    const learnRow = p.professions.learned.length >= 2 ? '' : `<div class="learn-row">${allIds.filter(id => !p.professions.learned.includes(id)).map(id => {
      const def = K.GATHER_PROFESSIONS[id] || K.CRAFT_PROFESSIONS[id];
      return `<button class="mini-btn" data-act="learnprof" data-id="${id}">${def.icon} Learn ${def.name}</button>`;
    }).join('')}</div>`;
    const gatherHtml = learnedGather.map(id => {
      const skill = p.professions.skill[id] || 0;
      return `<div class="prof-block"><b>${K.GATHER_PROFESSIONS[id].icon} ${K.GATHER_PROFESSIONS[id].name}</b>
        <div class="skillbar"><i style="width:${C.pct(skill / 300)}"></i></div>
        <span>${skill} / 300 — ${K.SKILL_TIER_NAME(skill)}</span></div>`;
    }).join('');
    const craftHtml = learnedCraft.map(id => {
      const prof = K.CRAFT_PROFESSIONS[id];
      const skill = p.professions.skill[id] || 0;
      const recipes = prof.recipes.map(r => {
        const can = DS.world.canCraft(p, id, r);
        const matsStr = Object.entries(r.mats).map(([m, n]) => `${DS.world.matName(m)} ${DS.world.matCount(p, m)}/${n}`).join(', ');
        return `<div class="recipe-row"><b>${r.name}</b><span class="item-sub">req ${r.skillReq} skill — ${matsStr}</span>
          <button class="mini-btn" data-act="craft" data-prof="${id}" data-recipe="${r.id}" ${can ? '' : 'disabled'}>Craft</button></div>`;
      }).join('');
      return `<div class="prof-block"><b>${prof.icon} ${prof.name}</b>
        <div class="skillbar"><i style="width:${C.pct(skill / 300)}"></i></div>
        <span>${skill} / 300 — ${K.SKILL_TIER_NAME(skill)}</span>${recipes}</div>`;
    }).join('');
    return `${learnRow}${gatherHtml}${craftHtml}` || '<p class="empty">No professions learned.</p>';
  }

  function renderReputation(p) {
    return Object.values(K.FACTIONS).map(f => {
      const rep = p.rep[f.id] || 0;
      const tier = K.repTier(rep);
      const idx = K.FACTION_TIERS.findIndex(t => t.name === tier.name);
      const next = K.FACTION_TIERS[idx + 1];
      const span = next ? next.min - tier.min : 1;
      const into = rep - tier.min;
      return `<div class="rep-row"><b>${f.name}</b><span class="item-sub">${tier.name} (${rep})</span>
        <div class="skillbar"><i style="width:${next ? C.pct(C.clamp(into / span, 0, 1)) : '100%'}"></i></div></div>`;
    }).join('');
  }

  function renderParty(p) {
    return Object.entries(DS.ai.COMPANION_DEFS).map(([id, def]) => {
      const c = p.companions[id];
      if (!c || !c.recruited) return `<div class="party-row dim"><b>${def.icon} ${def.name}</b><span class="item-sub">Not yet found — rumored to be somewhere out there.</span></div>`;
      const actor = game.companionsActive[id];
      const hpPct = actor ? actor.hp.current / actor.hp.max : 1;
      return `<div class="party-row"><b>${def.icon} ${def.name}</b><span class="item-sub">Lv ${actor ? actor.level : p.level} ${K.CLASSES[def.cls].name} — ${def.role}</span>
        <div class="skillbar"><i style="width:${C.pct(hpPct)};background:#79c07a"></i></div></div>`;
    }).join('');
  }

  function renderNpc(p, npc) {
    let html = '';
    if (npc.kind === 'quest' || npc.kind === 'companion') {
      const offer = DS.world.questsOffered(p, npc.id);
      const turn = DS.world.questsToTurnIn(p, npc.id);
      const prog = DS.world.questsInProgress(p, npc.id);
      html += turn.map(q => `<div class="quest-row"><b>${q.name}</b><div class="quest-text">Turn in for ${q.xp} xp, ${q.gold}g${q.rep ? `, +rep` : ''}${q.companion ? ', a companion' : ''}.</div>
        <button class="mini-btn" data-act="turnin" data-q="${q.id}">Turn In</button></div>`).join('');
      html += offer.map(q => `<div class="quest-row"><b>${q.name}</b><div class="quest-text">${q.text}</div>
        <button class="mini-btn" data-act="accept" data-q="${q.id}">Accept</button></div>`).join('');
      html += prog.map(q => `<div class="quest-row dim"><b>${q.name}</b><div class="quest-text">In progress.</div></div>`).join('');
      if (!offer.length && !turn.length && !prog.length) html += '<p class="empty">Nothing for you right now.</p>';
    }
    if (npc.vendor) {
      const stock = DS.world.vendorStock(npc, p);
      html += `<h4>For Sale</h4>` + stock.map(it => itemLine(it, `<button class="mini-btn" data-act="buy" data-npc="${npc.id}" data-iid="${it.iid}">Buy ${Math.max(1, Math.round((it.sell || 1) * 3.2))}g</button>`)).join('');
      html += `<h4>Sell From Bags</h4>` + (p.bags.length ? p.bags.map(it => itemLine(it, it.questItem ? '' : `<button class="mini-btn" data-act="sell" data-iid="${it.iid}">Sell ${it.sell}g</button>`)).join('') : '<p class="empty">Bags are empty.</p>');
    }
    if (npc.kind === 'trainer') {
      html += `<p>${npc.name} can unteach what you've learned, for a price.</p>
        <button class="mini-btn" data-act="respec">Reset Talents (${DS.world.respecCost(p)}g)</button>`;
    }
    if (npc.kind === 'proftrainer') {
      html += renderProfessions(p);
    }
    return html;
  }

  // --- action dispatch --------------------------------------------------------
  function onPanelClick(e) {
    const btn = e.target.closest('[data-act]');
    if (!btn) { if (e.target.closest('.panel-close')) closePanel(); return; }
    const p = game.player, d = btn.dataset;
    let msg = null;
    switch (d.act) {
      case 'unequip': if (DS.player.unequipToBag(p, d.slot)) msg = 'Unequipped.'; else msg = 'Bags are full.'; break;
      case 'equip': DS.player.equipFromBag(p, d.iid); break;
      case 'sell': msg = DS.world.sellItem(p, d.iid).msg; break;
      case 'usepotion': { const it = p.bags.find(b => b.iid === d.iid); if (it) { if (it.potion === 'heal') DS.combat.applyHeal(p, it.power); else DS.combat.addBuff(p, { key: 'potion_speed', name: 'Swiftness', icon: '💨', dur: 15, fields: { speedPct: it.power } }); DS.player.removeItem(p, d.iid); msg = `Used ${it.name}.`; } break; }
      case 'useenchant': { const it = p.bags.find(b => b.iid === d.iid); if (it) { const slot = K.SLOTS.find(s => p.equip[s] && !p.equip[s].__enchanted); if (slot) { Object.entries(it.enchant).forEach(([k, v]) => { p.equip[slot].stats[k] = (p.equip[slot].stats[k] || 0) + v; }); p.equip[slot].__enchanted = true; DS.player.removeItem(p, d.iid); msg = `Applied ${it.name} to ${slot}.`; } else msg = 'Every equipped item is already enchanted.'; } break; }
      case 'talent': if (DS.player.spendTalent(p, d.id)) { msg = 'Talent learned.'; buildAbilityBar(); } else msg = 'Cannot learn that yet.'; break;
      case 'respec': msg = DS.world.respec(p).msg; buildAbilityBar(); break;
      case 'learnprof': msg = DS.player.learnProfession(p, d.id) ? 'Profession learned.' : "Can't learn more professions."; break;
      case 'craft': msg = DS.world.craft(p, d.prof, K.CRAFT_PROFESSIONS[d.prof].recipes.find(r => r.id === d.recipe)).msg; break;
      case 'accept': msg = DS.player.acceptQuest(p, d.q) ? 'Quest accepted.' : "Can't accept that."; break;
      case 'turnin': { const q = DS.player.turnInQuest(p, d.q); msg = q ? `Turned in: ${q.name}.` : "Can't turn that in."; if (q) buildAbilityBar(); break; }
      case 'buy': { const npc = ui.panelCtx.npc; const item = DS.world.vendorStock(npc, p).find(it => it.iid === d.iid); msg = item ? DS.world.buyItem(p, npc, item).msg : null; break; }
      default: break;
    }
    if (msg) { DS.sim.log(game, msg); refreshLog(); }
    renderPanel();
  }

  // --- death ------------------------------------------------------------------
  function showDeath() { els.deathscreen.classList.remove('hidden'); }
  function closeDeath() { els.deathscreen.classList.add('hidden'); }

  DS.ui = { boot, showCharCreate, startGame, frame, paused, openPanel, closePanel };
})(window.DS = window.DS || {});

</script>
<script>
/* DoomSpire — bootstrap and the game loop. */
(function (DS) {
  'use strict';

  let game = null;
  let last = 0;
  let saveAcc = 0;
  let started = false;

  function persist() {
    if (!game) return;
    DS.core.save(DS.state.forSave(game));
  }

  function begin(g) {
    game = g;
    DS.ui.startGame(game);
    started = true;
    last = performance.now();
  }

  function loop(now) {
    requestAnimationFrame(loop);
    if (!started) return;
    const dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    if (!DS.ui.paused()) DS.sim.tick(game, dt, DS.engine.input);
    DS.render.frame(game, dt);
    DS.ui.frame(dt);
    saveAcc += dt;
    if (saveAcc > 8) { saveAcc = 0; persist(); }
  }

  window.addEventListener('DOMContentLoaded', () => {
    DS.ui.boot();
    const saved = DS.state.load();
    const continueBtn = document.getElementById('continue-btn');
    if (saved) {
      continueBtn.classList.remove('hidden');
      continueBtn.addEventListener('click', () => {
        document.getElementById('charcreate').classList.add('hidden');
        begin(saved);
      });
    }
    DS.ui.showCharCreate(begin);
    requestAnimationFrame(loop);
  });
  window.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
  window.addEventListener('pagehide', persist);
})(window.DS = window.DS || {});

</script>
</body>
